<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 10">
    <defs>
        <linearGradient id="stripeGradient">
            <stop offset="0%" stop-color="white">
                <animate attributeName="offset" from="0%" to="100%" dur="1s" repeatCount="indefinite"/>
            </stop>
            <stop offset="50%" stop-color="white">
                <animate attributeName="offset" from="50%" to="150%" dur="1s" repeatCount="indefinite"/>
            </stop>
            <stop offset="100%" stop-color="transparent">
                <animate attributeName="offset" from="100%" to="200%" dur="1s" repeatCount="indefinite"/>
            </stop>
        </linearGradient>
    </defs>
    <rect width="100" height="10" fill="url(#stripeGradient)"/>
</svg>