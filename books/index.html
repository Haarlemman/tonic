<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOKS | David Enker</title>

    <meta name="description"
        content="Memoirs and books by David Enker: Phantom Parents (2023), Unexpected Gifts (2025), and Tonic for the Bones (The Upcoming Memoir).">
    <meta name="keywords"
        content="David Enker, Books, Phantom Parents, Unexpected Gifts, Tonic for the Bones, Memoir, Adoption, Graphic Memoir, Philosophy">
    <meta name="author" content="David Enker">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.tonicforthebones.com/books/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.tonicforthebones.com/books/">
    <meta property="og:title" content="BOOKS | David Enker">
    <meta property="og:description" content="Memoirs and books by David Enker: Phantom Parents (2023), Unexpected Gifts (2025), and Tonic for the Bones.">
    <meta property="og:image" content="https://www.tonicforthebones.com/assets/images/books.png">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin
        src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Pathway+Gothic+One&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --cream: #EDE4CE;
            --cream-deep: #E1D3AF;
            --paper: #F6F0E1;
            --ink: #26211a;
            --ink-soft: #4a4234;
            --navy-deep: #10243b;
            --ochre-deep: #96592b;
            --red: #c03626;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'DM Serif Display', serif;
            --font-mono: 'DM Mono', monospace;
        }

        html {
            background-color: var(--cream);
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--cream);
            background-image: url('../assets/images/papertexture.jpg'), url('/assets/images/papertexture.jpg');
            background-repeat: repeat;
            background-blend-mode: multiply;
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(38, 33, 26, 0.2);
            border-radius: 10px;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .animate-fade-in {
            animation: fade-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

<body>
    <div id="app-header"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const SvgIcon = ({ children, className, size = 24, ...props }) => (
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
                width={size}
                height={size}
                {...props}
            >
                {children}
            </svg>
        );

        const Icons = {
            X: (props) => <SvgIcon {...props}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></SvgIcon>,
            ExternalLink: (props) => <SvgIcon {...props}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></SvgIcon>,
            BookOpen: (props) => <SvgIcon {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></SvgIcon>,
            ArrowRight: (props) => <SvgIcon {...props}><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></SvgIcon>,
            Instagram: (props) => <SvgIcon {...props}><rect x="2" y="2" width="20" height="20" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" /></SvgIcon>,
        };

        // --- FOLIO / ABOUT MODAL ---
        const FolioMenu = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[1100] bg-stone-950/90 backdrop-blur-md overflow-y-auto animate-fade-in text-stone-200 p-6 md:p-12">
                    <div className="max-w-4xl mx-auto min-h-screen flex flex-col justify-center">
                        <div className="flex justify-between items-center mb-10 border-b border-stone-800 pb-6">
                            <h2 className="font-serif font-bold text-3xl md:text-5xl text-white">BOOKS &amp; MEMOIRS</h2>
                            <button onClick={onClose} className="p-2 px-4 border border-stone-700 hover:bg-stone-800 rounded-full transition-colors flex items-center gap-2">
                                <span className="font-mono text-xs tracking-widest">CLOSE</span>
                                <Icons.X size={18} />
                            </button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                            <div className="space-y-8">
                                <div>
                                    <h3 className="font-mono text-xs uppercase text-stone-400 mb-1 tracking-widest">1. Phantom Parents (2023)</h3>
                                    <p className="font-serif text-lg leading-relaxed text-stone-300 mb-2">
                                        A graphic memoir of an adoptee and the four parents, two given and two chosen, who shaped him.
                                    </p>
                                    <a href="/phantomparents/" className="inline-flex items-center gap-2 text-xs font-mono uppercase tracking-widest text-amber-400 hover:underline">Explore Phantom Parents &rarr;</a>
                                </div>
                                <div className="pt-4 border-t border-stone-800">
                                    <h3 className="font-mono text-xs uppercase text-stone-400 mb-1 tracking-widest">2. Unexpected Gifts (2025)</h3>
                                    <p className="font-serif text-lg leading-relaxed text-stone-300 mb-2">
                                        Stories of change by several authors, including David Enker in the final chapter.
                                    </p>
                                </div>
                                <div className="pt-4 border-t border-stone-800">
                                    <h3 className="font-mono text-xs uppercase text-stone-400 mb-1 tracking-widest">3. Tonic for the Bones (Upcoming)</h3>
                                    <p className="font-serif text-lg leading-relaxed text-stone-300 mb-2">
                                        A forthcoming memoir—a collage of philosophy, art, and life navigating Parkinson's.
                                    </p>
                                    <a href="/tftb/" className="inline-flex items-center gap-2 text-xs font-mono uppercase tracking-widest text-orange-400 hover:underline">Enter Interactive Prelude &rarr;</a>
                                </div>
                            </div>
                            <div>
                                <h3 className="font-mono text-xs uppercase text-stone-400 mb-4 tracking-widest">Index</h3>
                                <div className="grid gap-3">
                                    {[
                                        { title: "Phantom Parents", url: "/phantomparents/", icon: Icons.BookOpen, desc: "Graphic Memoir (2023)" },
                                        { title: "Tonic for the Bones", url: "/tftb/", icon: Icons.BookOpen, desc: "Interactive Prelude" },
                                        { title: "The Folio", url: "https://www.tonicforthebones.com/folio", icon: Icons.BookOpen, desc: "Digital Archive" },
                                        { title: "Music Archive", url: "/music/", icon: Icons.BookOpen, desc: "Playlists & Soundtracks" },
                                        { title: "Connect on Instagram", url: "http://instagram.com/davidje", icon: Icons.Instagram, desc: "@davidje" }
                                    ].map((item, i) => (
                                        <a key={i} href={item.url} className="flex items-center justify-between p-4 bg-stone-900 border border-stone-800 hover:bg-stone-800 rounded-sm group transition-all">
                                            <div className="flex items-center gap-3">
                                                <item.icon className="w-5 h-5 text-stone-500 group-hover:text-white" />
                                                <div>
                                                    <div className="font-mono text-sm uppercase tracking-wide text-stone-300 group-hover:text-white">{item.title}</div>
                                                    <div className="font-serif text-xs italic text-stone-500">{item.desc}</div>
                                                </div>
                                            </div>
                                            <Icons.ExternalLink size={14} className="text-stone-600 group-hover:text-white" />
                                        </a>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN BOOKS APP ---
        function App() {
            const [isFolioOpen, setIsFolioOpen] = useState(false);

            return (
                <div className="min-h-screen w-full relative z-10 px-6 md:px-12 py-10 max-w-5xl mx-auto flex flex-col justify-between">
                    {/* Header Nav */}
                    <div className="flex justify-between items-start mb-10 pb-6 border-b border-[#26211a]/15">
                        <div>
                            <h1 className="font-serif font-black text-6xl md:text-8xl tracking-tight text-[#26211a] leading-none">
                                BOOKS
                            </h1>
                            <p className="font-mono text-xs uppercase tracking-[0.25em] text-[#4a4234] mt-3">
                                Memoirs &amp; Works by David Enker
                            </p>
                        </div>
                        <button
                            onClick={() => setIsFolioOpen(true)}
                            className="flex items-center gap-2 px-4 py-2 bg-[#26211a]/10 hover:bg-[#26211a]/15 border border-[#26211a]/20 rounded-full transition-all text-[#26211a]"
                        >
                            <span className="font-mono text-xs uppercase tracking-widest font-semibold">About</span>
                        </button>
                    </div>

                    {/* Books Entries List */}
                    <div className="flex flex-col space-y-6 max-w-2xl">
                        {/* 1. PHANTOM PARENTS (2023) - Smaller Link */}
                        <a
                            href="/phantomparents/"
                            className="group block p-4 -ml-4 rounded-lg hover:bg-[#26211a]/5 border border-transparent hover:border-[#26211a]/10 transition-all duration-200"
                        >
                            <div className="flex items-center gap-3">
                                <h2 className="font-serif font-bold text-2xl md:text-3xl text-[#26211a] group-hover:text-[#c03626] tracking-tight transition-colors">
                                    PHANTOM PARENTS
                                </h2>
                                <span className="font-mono text-xs text-[#4a4234] px-2 py-0.5 border border-[#26211a]/25 rounded-sm">
                                    (2023)
                                </span>
                            </div>
                            <p className="font-serif italic text-[#4a4234] text-base md:text-lg mt-1 group-hover:text-[#26211a] transition-colors">
                                The graphic memoir of an adoptee
                            </p>
                            <div className="mt-2 inline-flex items-center gap-2 font-mono text-[11px] uppercase tracking-widest text-[#c03626] font-semibold group-hover:translate-x-1 transition-transform">
                                <span>Explore the book</span>
                                <Icons.ArrowRight size={14} />
                            </div>
                        </a>

                        {/* 2. UNEXPECTED GIFTS - STORIES OF CHANGE (2025) */}
                        <div className="p-4 -ml-4 rounded-lg bg-[#26211a]/[0.03] border border-[#26211a]/10">
                            <div className="flex flex-wrap items-center gap-2 md:gap-3">
                                <h2 className="font-serif font-bold text-2xl md:text-3xl text-[#26211a] tracking-tight">
                                    UNEXPECTED GIFTS
                                </h2>
                                <span className="font-serif text-lg md:text-xl text-[#4a4234] italic">
                                    — Stories of Change
                                </span>
                                <span className="font-mono text-xs text-[#4a4234] px-2 py-0.5 border border-[#26211a]/25 rounded-sm">
                                    (2025)
                                </span>
                            </div>
                            <p className="font-serif italic text-[#4a4234] text-base md:text-lg mt-1">
                                Several authors, including me in the final chapter.
                            </p>
                        </div>

                        {/* 3. TONIC FOR THE BONES (Upcoming) */}
                        <a
                            href="/tftb/"
                            className="group block p-4 -ml-4 rounded-lg hover:bg-[#26211a]/5 border border-transparent hover:border-[#26211a]/10 transition-all duration-200"
                        >
                            <div className="flex flex-col">
                                <div className="flex items-center gap-3">
                                    <h2 className="font-serif font-black text-3xl md:text-4xl text-[#26211a] group-hover:text-[#96592b] tracking-tight transition-colors">
                                        TONIC FOR THE BONES
                                    </h2>
                                    <span className="font-mono text-[11px] text-[#96592b] font-semibold px-2 py-0.5 border border-[#96592b]/30 rounded-sm">
                                        Upcoming
                                    </span>
                                </div>
                                <div className="font-mono text-[10px] md:text-xs uppercase tracking-[0.25em] text-[#96592b] mt-1 font-semibold">
                                    The Upcoming Memoir
                                </div>
                            </div>
                            <div className="font-serif italic text-[#4a4234] border-l-2 border-[#96592b]/40 pl-3 mt-3">
                                <p className="text-xs md:text-sm leading-snug max-w-md">"Life is but a brief crack of light between two eternities of darkness"</p>
                                <p className="text-[10px] md:text-xs uppercase tracking-widest mt-1 text-[#4a4234]/70">— Nabokov</p>
                            </div>
                            <div className="mt-3 inline-flex items-center gap-2 font-mono text-[11px] uppercase tracking-widest text-[#96592b] font-semibold group-hover:translate-x-1 transition-transform">
                                <span>Enter Interactive Prelude</span>
                                <Icons.ArrowRight size={14} />
                            </div>
                        </a>
                    </div>

                    {/* Books Artwork (Transparent PNG with Drop Shadow) */}
                    <div className="pt-8 pb-4">
                        <img
                            src="../assets/images/books.png"
                            alt="Books by David Enker — Phantom Parents, Unexpected Gifts, Tonic for the Bones"
                            className="max-w-md md:max-w-lg w-full h-auto drop-shadow-2xl select-none pointer-events-none"
                            loading="eager"
                        />
                    </div>

                    <FolioMenu isOpen={isFolioOpen} onClose={() => setIsFolioOpen(false)} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <div id="app-footer" class="relative z-[1000]"></div>
    <script src="../js/layout.js?v=202608251125"></script>
</body>

</html>
