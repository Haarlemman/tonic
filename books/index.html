<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOKS | David Enker</title>

    <meta name="description"
        content="Memoirs and books by David Enker: Phantom Parents (2023) and Tonic for the Bones (The Upcoming Memoir).">
    <meta name="keywords"
        content="David Enker, Books, Phantom Parents, Tonic for the Bones, Memoir, Adoption, Graphic Memoir, Philosophy">
    <meta name="author" content="David Enker">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.tonicforthebones.com/books/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.tonicforthebones.com/books/">
    <meta property="og:title" content="BOOKS | David Enker">
    <meta property="og:description" content="Memoirs and books by David Enker: Phantom Parents (2023) and Tonic for the Bones.">
    <meta property="og:image" content="https://www.tonicforthebones.com/tftb/images/sky.jpg">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin
        src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;600&family=Pathway+Gothic+One&family=Wallpoet&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'DM Serif Display', serif;
            --font-mono: 'DM Mono', monospace;
        }

        html {
            background-color: #0c0a09;
        }

        body {
            font-family: var(--font-sans);
            background-color: #0c0a09;
            color: #e7e5e4;
            overflow: hidden;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .text-shadow {
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* Animations */
        @keyframes fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slow-pan {
            0% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1.2) translate(-2%, -2%);
            }
        }

        /* Glitch Animation */
        @keyframes glitch {
            0% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }

            5% {
                opacity: 0.8;
                transform: scaleY(0.9) skewX(5deg);
            }

            10% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }

            15% {
                opacity: 0.4;
                transform: scaleY(1.1) skewX(-5deg);
            }

            20% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }

            45% {
                opacity: 1;
                transform: scaleY(1) skewX(3deg);
            }

            50% {
                opacity: 0.5;
                transform: scaleY(0.9) skewX(0deg);
            }

            55% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }

            80% {
                opacity: 1;
                transform: scaleY(1) skewX(-3deg);
            }

            85% {
                opacity: 0.8;
                transform: scaleY(1.2) skewX(5deg);
            }

            90% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }

            100% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }
        }

        /* Flicker Animation */
        @keyframes flicker {
            0% {
                opacity: 0.9;
            }

            50% {
                opacity: 1;
            }

            52% {
                opacity: 0.2;
            }

            54% {
                opacity: 1;
            }

            80% {
                opacity: 0.9;
            }

            90% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }

        /* Scanline Overlay */
        .scanlines {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg,
                    rgba(255, 0, 0, 0.03),
                    rgba(0, 255, 0, 0.01),
                    rgba(0, 0, 255, 0.03));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .animate-fade-in {
            animation: fade-in 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-glitch {
            animation: glitch 0.3s infinite;
        }

        .animate-flicker {
            animation: flicker 0.15s infinite;
        }

        .animate-slow-pan {
            animation: slow-pan 30s ease-in-out infinite alternate;
        }
    </style>
</head>

<body>
    <div id="app-header"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useLayoutEffect } = React;

        // --- GLOBAL CONFIGURATION (Edit Here) ---
        // 1. VIDEO SETTINGS
        const VIDEO_CONFIG = {
            src: "https://www.tonicforthebones.com/assets/video/sky.mp4",
            fallbackImage: "https://www.tonicforthebones.com/tftb/images/sky.jpg",
            loopType: "bounce" // Options: 'bounce' (ping-pong smoothly) or 'restart' (loop from start)
        };

        // 2. AUDIO TRACKS
        const AUDIO_TRACKS = {
            static: "/tftb/noise.mp3",
            body: "/tftb/body.mp3",
            mind: "/tftb/mind.mp3",
            soul: "/tftb/soul.mp3",
            future: "/tftb/future.mp3"
        };

        // 3. IMAGES & LOCATIONS
        const LOCATIONS = ["Haarlem", "London", "New York", "Amsterdam", "Köln", "Ramat Gan", "Rzeszów", "The Hague"];

        // 4. INTRO CHEVRON SETTINGS
        const CHEVRON_CONFIG = {
            size: 96,
            color: "text-orange-500",
            animation: "animate-bounce"
        };

        const ARTWORKS = {
            shakingMan: "https://www.tonicforthebones.com/tftb/images/raar.png",
            heartMonster: "https://www.tonicforthebones.com/tftb/images/beest.png",
            infinityMap: "https://www.tonicforthebones.com/tftb/images/gme.png",
            stars: "https://www.tonicforthebones.com/tftb/images/stars.jpg"
        };

        const NOISE_SVG = `data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E`;

        const SvgIcon = ({ children, className, size = 24, ...props }) => (
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
                width={size}
                height={size}
                {...props}
            >
                {children}
            </svg>
        );

        const Icons = {
            X: (props) => <SvgIcon {...props}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></SvgIcon>,
            ExternalLink: (props) => <SvgIcon {...props}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></SvgIcon>,
            BookOpen: (props) => <SvgIcon {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></SvgIcon>,
            ArrowRight: (props) => <SvgIcon {...props}><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></SvgIcon>,
            ChevronsDown: (props) => <SvgIcon {...props}><path d="M7 13l5 5 5-5M7 6l5 5 5-5" /></SvgIcon>,
            Image: (props) => <SvgIcon {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><circle cx="8.5" cy="8.5" r="1.5" /><polyline points="21 15 16 10 5 21" /></SvgIcon>,
            Instagram: (props) => <SvgIcon {...props}><rect x="2" y="2" width="20" height="20" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" /></SvgIcon>,
            Mail: (props) => <SvgIcon {...props}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" /><polyline points="22,6 12,13 2,6" /></SvgIcon>
        };

        const IntroVideo = ({ src }) => {
            const videoRef = useRef(null);

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                let animationId;
                let lastTime = performance.now();
                let isReversing = false;

                const updateLoop = () => {
                    const now = performance.now();
                    const delta = (now - lastTime) / 1000;
                    lastTime = now;

                    if (!video.duration) {
                        animationId = requestAnimationFrame(updateLoop);
                        return;
                    }

                    if (VIDEO_CONFIG.loopType === 'bounce') {
                        if (!isReversing) {
                            if (video.currentTime >= video.duration - 0.1) {
                                isReversing = true;
                                video.pause();
                            }
                        } else {
                            video.currentTime = Math.max(0, video.currentTime - delta);
                            if (video.currentTime <= 0.1) {
                                isReversing = false;
                                video.play().catch(() => {});
                            }
                        }
                    }
                    animationId = requestAnimationFrame(updateLoop);
                };

                const handleCanPlay = () => {
                    video.play().catch(() => {});
                    lastTime = performance.now();
                    animationId = requestAnimationFrame(updateLoop);
                };

                video.addEventListener('canplay', handleCanPlay);
                return () => {
                    video.removeEventListener('canplay', handleCanPlay);
                    cancelAnimationFrame(animationId);
                };
            }, [src]);

            return (
                <video
                    ref={videoRef}
                    src={src}
                    playsInline
                    muted
                    autoPlay
                    loop={VIDEO_CONFIG.loopType === 'restart'}
                    className="w-full h-full object-cover"
                    style={{ filter: 'brightness(0.55) contrast(1.15)' }}
                />
            );
        };

        // --- FOLIO / ABOUT MODAL ---
        const FolioMenu = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-x-0 bottom-0 z-[1100] bg-stone-950/98 backdrop-blur-xl overflow-y-auto animate-fade-in text-stone-200" style={{top: '28px'}}>
                    <div className="max-w-4xl mx-auto min-h-screen p-6 md:p-12 flex flex-col">
                        <div className="flex justify-between items-center mb-12 border-b border-stone-800 pb-6">
                            <h2 className="font-serif font-bold text-3xl md:text-5xl text-white">BOOKS &amp; MEMOIRS</h2>
                            <button onClick={onClose} className="p-2 px-4 border border-stone-700 hover:bg-stone-800 rounded-full transition-colors flex items-center gap-2">
                                <span className="font-mono text-xs tracking-widest">BACK</span>
                                <Icons.X size={18} />
                            </button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                            <div className="space-y-8">
                                <div>
                                    <h3 className="font-mono text-xs uppercase text-stone-500 mb-2 tracking-widest">1. Phantom Parents (2023)</h3>
                                    <p className="font-serif text-lg leading-relaxed text-stone-300 mb-3">
                                        A graphic memoir of an adoptee and the four parents, two given and two chosen, who shaped him.
                                    </p>
                                    <a href="/phantomparents/" className="inline-flex items-center gap-2 text-xs font-mono uppercase tracking-widest text-amber-400 hover:underline">Explore Phantom Parents &rarr;</a>
                                </div>
                                <div className="pt-4 border-t border-stone-800">
                                    <h3 className="font-mono text-xs uppercase text-stone-500 mb-2 tracking-widest">2. Tonic for the Bones (Upcoming)</h3>
                                    <p className="font-serif text-lg leading-relaxed text-stone-300 mb-3">
                                        A forthcoming memoir—a collage of philosophy, art, and life navigating Parkinson's.
                                    </p>
                                    <a href="/tftb/" className="inline-flex items-center gap-2 text-xs font-mono uppercase tracking-widest text-orange-400 hover:underline">Enter Interactive Prelude &rarr;</a>
                                </div>
                            </div>
                            <div>
                                <h3 className="font-mono text-xs uppercase text-stone-500 mb-4 tracking-widest">Index</h3>
                                <div className="grid gap-3">
                                    {[
                                        { title: "Phantom Parents", url: "/phantomparents/", icon: Icons.BookOpen, desc: "Graphic Memoir (2023)" },
                                        { title: "Tonic for the Bones", url: "/tftb/", icon: Icons.BookOpen, desc: "Interactive Prelude" },
                                        { title: "The Folio", url: "https://www.tonicforthebones.com/folio", icon: Icons.BookOpen, desc: "Digital Archive" },
                                        { title: "Connect on Instagram", url: "http://instagram.com/davidje", icon: Icons.Instagram, desc: "@davidje" }
                                    ].map((item, i) => (
                                        <a key={i} href={item.url} className="flex items-center justify-between p-4 bg-stone-900 border border-stone-800 hover:bg-stone-800 rounded-sm group transition-all">
                                            <div className="flex items-center gap-3">
                                                <item.icon className="w-5 h-5 text-stone-500 group-hover:text-white" />
                                                <div>
                                                    <div className="font-mono text-sm uppercase tracking-wide text-stone-300 group-hover:text-white">{item.title}</div>
                                                    <div className="font-serif text-xs italic text-stone-500">{item.desc}</div>
                                                </div>
                                            </div>
                                            <Icons.ExternalLink size={14} className="text-stone-600 group-hover:text-white" />
                                        </a>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN BOOKS APP ---
        function App() {
            const [isFolioOpen, setIsFolioOpen] = useState(false);
            const [isMuted, setIsMuted] = useState(false);
            const [hasInteracted, setHasInteracted] = useState(false);
            const audioRef = useRef(new Audio());

            const toggleMute = () => {
                setIsMuted(!isMuted);
                if (!isMuted) audioRef.current.pause();
                else if (hasInteracted) audioRef.current.play();
            };

            return (
                <div className="fixed inset-0 w-full text-white font-sans overflow-y-auto" style={{ top: '28px', height: 'calc(100% - 28px)' }}>
                    {/* Background Visual Layer */}
                    <div className="fixed inset-0 z-0 overflow-hidden pointer-events-none">
                        <IntroVideo src={VIDEO_CONFIG.src} />
                        <div className="absolute inset-0 bg-gradient-to-b from-black/80 via-black/60 to-black/90"></div>
                        <div className="absolute inset-0 opacity-[0.05]" style={{ backgroundImage: `url("${NOISE_SVG}")` }}></div>
                        <div className="absolute inset-0 scanlines opacity-30"></div>
                    </div>

                    {/* --- HEADER NAV --- */}
                    <nav className="relative z-50 p-6 md:p-10 flex justify-between items-start">
                        {/* Books Titles Hierarchy */}
                        <div className="flex flex-col space-y-8 max-w-2xl select-none">
                            {/* TOP TITLE: BOOKS */}
                            <div className="border-b border-stone-800/80 pb-4">
                                <h1 className="font-serif font-black text-6xl md:text-8xl tracking-tight text-stone-100 leading-none drop-shadow-2xl">
                                    BOOKS
                                </h1>
                                <p className="font-mono text-xs uppercase tracking-[0.25em] text-stone-500 mt-2">
                                    Memoirs &amp; Works by David Enker
                                </p>
                            </div>

                            {/* 1. PHANTOM PARENTS (2023) */}
                            <a href="/phantomparents/" className="group block p-4 -ml-4 rounded-lg hover:bg-stone-900/60 border border-transparent hover:border-stone-800 transition-all duration-300">
                                <div className="flex items-center gap-3">
                                    <h2 className="font-serif font-black text-3xl md:text-5xl text-stone-100 group-hover:text-red-400 tracking-tight transition-colors">
                                        PHANTOM PARENTS
                                    </h2>
                                    <span className="font-mono text-xs md:text-sm text-stone-400 font-medium px-2 py-0.5 border border-stone-700 rounded-sm">
                                        (2023)
                                    </span>
                                </div>
                                <p className="font-serif italic text-stone-300 text-sm md:text-lg mt-1 group-hover:text-stone-100 transition-colors">
                                    The memoir of an unusual adoption
                                </p>
                                <div className="mt-2 inline-flex items-center gap-2 font-mono text-[11px] uppercase tracking-widest text-red-400 group-hover:translate-x-1 transition-transform">
                                    <span>Explore the book</span>
                                    <Icons.ArrowRight size={14} />
                                </div>
                            </a>

                            {/* 2. TONIC FOR THE BONES (Upcoming) */}
                            <a href="/tftb/" className="group block p-4 -ml-4 rounded-lg hover:bg-stone-900/60 border border-transparent hover:border-stone-800 transition-all duration-300">
                                <div className="flex flex-col">
                                    <h2 className="font-serif font-black text-3xl md:text-5xl text-stone-100 group-hover:text-orange-400 tracking-tight transition-colors">
                                        TONIC FOR THE BONES
                                    </h2>
                                    <div className="font-mono text-[10px] md:text-xs uppercase tracking-[0.3em] text-orange-500 mt-1">
                                        The Upcoming Memoir
                                    </div>
                                </div>
                                <div className="font-serif italic text-stone-400 border-l-2 border-stone-600 pl-3 mt-3">
                                    <p className="text-xs md:text-sm leading-snug max-w-md">"Life is but a brief crack of light between two eternities of darkness"</p>
                                    <p className="text-[10px] md:text-xs uppercase tracking-widest mt-1 text-stone-500">— Nabokov</p>
                                </div>
                                <div className="mt-3 inline-flex items-center gap-2 font-mono text-[11px] uppercase tracking-widest text-orange-400 group-hover:translate-x-1 transition-transform">
                                    <span>Enter Interactive Prelude</span>
                                    <Icons.ArrowRight size={14} />
                                </div>
                            </a>
                        </div>

                        {/* Top Right Actions */}
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsFolioOpen(true)} className="flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 backdrop-blur rounded-full transition-all border border-white/20">
                                <span className="font-mono text-xs uppercase tracking-widest">About</span>
                            </button>
                        </div>
                    </nav>

                    <FolioMenu isOpen={isFolioOpen} onClose={() => setIsFolioOpen(false)} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <div id="app-footer" class="relative z-[1000]"></div>
    <script src="https://www.tonicforthebones.com/js/layout.js?v=202608251125"></script>
</body>

</html>
