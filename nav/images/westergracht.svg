<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Asclepius Rod in Westergracht Crimson Red -->
  <g fill="none" stroke="#C8102E" stroke-linecap="round" stroke-linejoin="round">
    <!-- Staff -->
    <line x1="50" y1="12" x2="50" y2="88" stroke-width="6"/>
    <!-- Staff top knob -->
    <circle cx="50" cy="11" r="5" fill="#C8102E" stroke="none"/>
    <!-- Snake winding around staff -->
    <path d="M 41 24 C 59 19, 68 28, 59 40 C 45 51, 33 49, 42 63 C 51 75, 68 70, 58 84 C 54 87, 46 87, 50 92" stroke-width="5.5"/>
  </g>
  <!-- Snake head -->
  <path d="M 41 24 C 36 21, 36 16, 42 17 C 46 18, 45 23, 41 24 Z" fill="#C8102E"/>
  <!-- Snake eye dot -->
  <circle cx="41" cy="19" r="1" fill="#FFFFFF"/>
</svg>
