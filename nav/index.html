<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#032c5e">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <title>Navigate the Web — Desktop Shortcuts</title>
    <style>
        :root {
            --accent: #e2dfb3;
            --hover-accent: #d8ce2f;
            --bg-dark: #192227;
            --radius: 16px;
            --base-opacity: 0.25;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            display: block;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--bg-dark);
            font-family: 'Space Grotesk', Arial, sans-serif;
            color: var(--accent);
            overflow-x: hidden;
            user-select: none;
        }

        .main-wrapper {
            max-width: 1600px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Bar Header */
        .header-section {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .header-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .grid-hoofd img {
            width: 40px;
            height: 40px;
            animation: jerkyRotate 30s linear infinite;
            filter: drop-shadow(0 0 8px #007bff);
        }

        .grid-item-nav {
            font-size: 1.5em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -1px;
            white-space: nowrap;
        }




        /* Desktop Canvas & Grid */
        .desktop-canvas {
            flex: 1;
            width: 100%;
            padding: 10px 5px 40px 5px;
        }

        .desktop-grid {
            columns: 180px auto;
            column-gap: 12px;
            width: 100%;
        }

        /* Category group panel */
        .cat-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            break-inside: avoid;
            margin-bottom: 12px;
        }

        .cat-group-label {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 1;
            padding: 0 4px;
            color: var(--cat-color, var(--accent));
        }

        .cat-group-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 16px;
            background: var(--cat-bg, rgba(255,255,255,0.06));
            border: 1px solid var(--cat-border, rgba(255,255,255,0.08));
            width: fit-content;
            max-width: 100%;
        }

        /* Desktop Shortcut Card */
        .desktop-shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            position: relative;
            width: auto;
            min-width: 56px;
            max-width: 72px;
            padding: 6px 6px;
            border-radius: 10px;
            transition: transform 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
        }

        .desktop-shortcut:hover {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            transform: translateY(-3px);
        }

        .desktop-shortcut.dragging {
            opacity: 0.35;
            transform: scale(0.92);
        }

        .desktop-shortcut.drag-over {
            outline: 2px dashed var(--hover-accent);
            outline-offset: 3px;
            border-radius: 10px;
            background: rgba(226, 223, 179, 0.2);
        }

        /* Desktop Icon Circle */
        .icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff, #d9d9d9);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 0 0 1.5px rgba(255, 255, 255, 0.7);
            overflow: hidden;
            position: relative;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .desktop-shortcut:hover .icon-circle {
            transform: scale(1.1);
            box-shadow: 0 6px 18px var(--cat-glow, rgba(226, 223, 179, 0.7)), inset 0 0 0 1.5px #ffffff;
        }

        .icon-circle img,
        .icon-circle svg {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .icon-circle .fallback {
            font-weight: 700;
            color: #333;
            font-size: 22px;
            text-transform: uppercase;
        }



        /* Title Label Under Icon */
        .shortcut-title {
            color: #ffffff;
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            margin-top: 5px;
            line-height: 1.2;
            max-width: 64px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            word-break: break-word;
            letter-spacing: 0.1px;
            transition: color 0.2s ease;
        }

        .desktop-shortcut:hover .shortcut-title {
            color: var(--hover-accent);
        }

        /* Delete Button in Edit Mode */
        .item-del {
            display: none;
            position: absolute;
            top: 2px;
            right: 6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #e63946;
            color: #fff;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        body.edit-mode .item-del {
            display: flex;
        }

        body.edit-mode .desktop-shortcut {
            cursor: grab;
        }

        body.edit-mode .desktop-shortcut:active {
            cursor: grabbing;
        }

        /* Add Shortcut Tile */
        .add-shortcut-tile {
            display: none;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: auto;
            min-width: 56px;
            padding: 6px 6px;
            border-radius: 10px;
            transition: all 0.2s ease;
            opacity: 0.8;
        }

        body.edit-mode .add-shortcut-tile {
            display: flex;
        }

        .add-shortcut-tile:hover {
            opacity: 1;
            transform: translateY(-3px);
        }

        .add-shortcut-tile .icon-circle {
            border: 2px dashed rgba(226, 223, 179, 0.7);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .add-shortcut-tile .plus {
            font-size: 20px;
            color: var(--accent);
            line-height: 1;
        }

        .add-shortcut-tile .shortcut-title {
            color: var(--accent);
        }

        @keyframes jerkyRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Modal */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 100;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            background: #233137;
            border: 1px solid rgba(226, 223, 179, 0.35);
            border-radius: 16px;
            padding: 24px;
            width: min(440px, 92vw);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }

        .modal h2 {
            margin: 0 0 16px 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.85;
            margin: 12px 0 4px;
        }

        .modal input,
        .modal select {
            width: 100%;
            padding: 9px 11px;
            border-radius: 8px;
            border: 1px solid rgba(226, 223, 179, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: var(--accent);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .modal select option {
            background: #233137;
            color: var(--accent);
        }

        .modal input:focus,
        .modal select:focus {
            outline: none;
            border-color: var(--hover-accent);
        }

        .modal .hint {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-top: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 22px;
        }

        .modal-actions .btn.primary {
            background: var(--hover-accent);
            color: #1a1a1a;
            border-color: var(--hover-accent);
        }

        @media (max-width: 600px) {
            .header-section {
                flex-direction: column;
                align-items: flex-start;
            }

            .desktop-shortcut,
            .add-shortcut-tile {
                min-width: 48px;
                max-width: 60px;
            }

            .icon-circle {
                width: 36px;
                height: 36px;
            }

            .icon-circle img,
            .icon-circle svg {
                width: 22px;
                height: 22px;
            }

            .shortcut-title {
                font-size: 9px;
                max-width: 58px;
            }

            .desktop-grid {
                column-count: 3;
                column-gap: 8px;
            }

            .cat-group-row {
                padding: 6px 7px;
                gap: 4px;
            }
        }
    </style>
</head>

<body>

    <canvas id="bg-canvas"></canvas>

        </header>

        <!-- Desktop Canvas -->
        <main class="desktop-canvas">
            <div class="desktop-grid" id="desktopGrid"></div>

    </div>

    <!-- Shortcut Modal -->

        <div class="modal">

            <label>Label</label>
            <input type="text" id="itemLabel" placeholder="e.g. Gmail">
            <label>URL</label>
            <input type="text" id="itemUrl" placeholder="https://mail.google.com">
            <label>Category</label>
            <select id="itemCategory"></select>
            <label>Custom icon URL (optional)</label>
            <input type="text" id="itemIcon" placeholder="leave blank to auto-fetch favicon">
            <div class="hint">If blank, the icon is fetched automatically from the website.</div>
            <div class="modal-actions">
                <button class="btn" id="itemCancel">Cancel</button>
                <button class="btn primary" id="itemSave">Save</button>
            </div>
        </div>
    </div>

            { label: 'LinkedIn', url: 'https://www.linkedin.com', category: 'work' },

            // My Stuff
            { label: 'Studio', url: 'https://www.tonicforthebones.com/standingstudio', category: 'mystuff' },

            { label: 'Folio', url: 'https://www.tonicforthebones.com/folio/', category: 'mystuff' },
            { label: 'Awe', url: 'https://house-of-awe.web.app', category: 'mystuff' },
        ];

        const STORAGE_KEY = 'navdash.desktop.v2';
        const LEGACY_STORAGE_KEY = 'navdash.v1';
        const uid = () => 'id' + Math.random().toString(36).slice(2, 9);

        let shortcuts = loadData();
        let editMode = false;

        // ---------- Data Load & Migration ----------
        function loadData() {
            try {
                // Try modern desktop storage key first
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) return ensureIds(parsed);
                }

                // Fallback / Migration from legacy folder-based navdash.v1
                const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
                if (legacyRaw) {
                    const legacyData = JSON.parse(legacyRaw);
                    if (Array.isArray(legacyData)) {
                        const migrated = [];
                        legacyData.forEach(folder => {
                            const catId = folder.id || 'mystuff';
                            if (Array.isArray(folder.items)) {
                                folder.items.forEach(it => {
                                    migrated.push({
                                        id: it.id || uid(),
                                        label: it.label || 'Link',
                                        url: it.url || '',
                                        icon: it.icon,
                                        category: catId
                                    });
                                });
                            }
                        });
                        if (migrated.length > 0) return ensureIds(migrated);
                    }
                }
            } catch (e) {
                console.error('Error loading shortcuts:', e);
            }

            // Default initial shortcuts
            return ensureIds(DEFAULT_SHORTCUTS);
        }

        function ensureIds(list) {
            return list.map(item => ({
                id: item.id || uid(),
                label: item.label || 'Shortcut',
                url: item.url || '#',
                icon: item.icon,
                category: item.category || 'mystuff'
            }));
        }

        function save() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(shortcuts));
            } catch (e) { }
        }

            [/canva\.com/, 'images/Canva.svg'],
            [/capcut\.com/, 'images/Capcut.svg'],
            [/spotify\.com/, 'images/Spotify.svg'],
            [/music\.youtube\./, 'images/Youtube_Music.svg'],
            [/youtube\.com/, 'images/youtube.svg'],
            [/suno\.com/, 'images/suno.svg'],
            [/distrokid\.com/, 'images/dk.svg']
        ];

        function iconSources(item) {
            const out = [];
            if (item.icon) out.push(item.icon);
            for (const [re, src] of ICON_OVERRIDES) {
                if (re.test(item.url)) { out.push(src); break; }
            }
            try {
                const u = new URL(item.url);
                out.push(`${u.origin}/favicon.ico`);
                out.push(`https://www.google.com/s2/favicons?sz=128&domain=${u.hostname}`);
                out.push(`https://icons.duckduckgo.com/ip3/${u.hostname}.ico`);
            } catch (e) { }
            return out;
        }

        function createIconElement(item) {
            const circle = document.createElement('div');
            circle.className = 'icon-circle';
            const sources = iconSources(item);

            const showFallback = () => {
                const fb = document.createElement('span');
                fb.className = 'fallback';
                fb.textContent = (item.label || '?').trim().charAt(0);
                circle.appendChild(fb);
            };

            if (!sources.length) {
                showFallback();
            } else {
                const img = document.createElement('img');
                let i = 0;
                img.alt = item.label;
                img.loading = 'lazy';
                img.onerror = () => {
                    i++;
                    if (i < sources.length) { img.src = sources[i]; }
                    else { img.remove(); showFallback(); }
                };
                img.src = sources[0];
                circle.appendChild(img);
            }



            return circle;
        }

        // ---------- UI Rendering ----------
        const grid = document.getElementById('desktopGrid');

        function renderGrid() {
            grid.innerHTML = '';

            const visibleItems = shortcuts;

            if (true) {
                // Group by category
                const groups = new Map();
                CATEGORIES.forEach(cat => groups.set(cat.id, []));

                visibleItems.forEach(item => {
                    const key = item.category || 'mystuff';
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(item);
                });

                CATEGORIES.forEach(cat => {
                    const items = groups.get(cat.id);
                    if (!items || items.length === 0) return;

                    // Convert hex color to rgba for subtle tinted background
                    const hex = cat.color;
                    const r = parseInt(hex.slice(1,3),16);
                    const g = parseInt(hex.slice(3,5),16);
                    const b = parseInt(hex.slice(5,7),16);

                    const group = document.createElement('div');
                    group.className = 'cat-group';

                    const label = document.createElement('div');
                    label.className = 'cat-group-label';
                    label.textContent = cat.name;
                    label.style.setProperty('--cat-color', cat.color);
                    group.appendChild(label);

                    const row = document.createElement('div');
                    row.className = 'cat-group-row';
                    row.style.setProperty('--cat-bg', `rgba(${r},${g},${b},0.35)`);
                    row.style.setProperty('--cat-border', `rgba(${r},${g},${b},0.55)`);

                    items.forEach(item => row.appendChild(renderShortcut(item)));

                    // Add tile inside last group only (edit mode)
                    if (cat === CATEGORIES[CATEGORIES.length - 1]) {
                        const addTile = document.createElement('div');
                        addTile.className = 'add-shortcut-tile';
                        addTile.innerHTML = `<div class="icon-circle"><span class="plus">+</span></div><span class="shortcut-title">Add</span>`;
                        addTile.onclick = () => openItemModal(null);
                        row.appendChild(addTile);
                    }

                    group.appendChild(row);
                    grid.appendChild(group);
                });

            }
        }

        function renderShortcut(item) {
            const card = document.createElement('a');
            card.className = 'desktop-shortcut';
            card.href = item.url;
            card.target = '_blank';
            card.rel = 'noopener';
            card.dataset.id = item.id;

            const cat = CATEGORIES.find(c => c.id === item.category);
            if (cat) {
                card.style.setProperty('--cat-color', cat.color);
                card.style.setProperty('--cat-glow', cat.glow);
            }

            // Icon
            card.appendChild(createIconElement(item));

            // Title Label UNDER Icon
            const title = document.createElement('span');
            title.className = 'shortcut-title';
            title.textContent = item.label;
            card.appendChild(title);

            // Delete button in edit mode
            const del = document.createElement('div');
            del.className = 'item-del';
            del.textContent = '×';
            del.title = 'Delete shortcut';
            del.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                deleteShortcut(item.id);
            });
            card.appendChild(del);

            // Edit mode click handler (opens modal instead of navigating)
            card.addEventListener('click', (e) => {
                if (editMode) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (!e.target.closest('.item-del')) {
                        openItemModal(item.id);
                    }
                }
            });

            // Drag and drop event handlers
            card.draggable = true;

            card.addEventListener('dragstart', (e) => {
                dragState = { itemId: item.id };
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', item.id);
            });

            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
                dragState = null;
                document.querySelectorAll('.desktop-shortcut').forEach(el => el.classList.remove('drag-over'));
            });

            card.addEventListener('dragover', (e) => {
                if (dragState && dragState.itemId !== item.id) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    card.classList.add('drag-over');
                }
            });

            card.addEventListener('dragleave', () => {
                card.classList.remove('drag-over');
            });

            card.addEventListener('drop', (e) => {
                e.preventDefault();
                card.classList.remove('drag-over');
                if (dragState && dragState.itemId !== item.id) {
                    reorderShortcuts(dragState.itemId, item.id);
                }
            });

            return card;
        }

        // ---------- Drag & Reorder Logic ----------
        let dragState = null;

        function reorderShortcuts(srcId, targetId) {
            const srcIdx = shortcuts.findIndex(s => s.id === srcId);
            const tgtIdx = shortcuts.findIndex(s => s.id === targetId);
            if (srcIdx < 0 || tgtIdx < 0) return;

            const [moved] = shortcuts.splice(srcIdx, 1);
            shortcuts.splice(tgtIdx, 0, moved);
            save();
            renderGrid();
        }

        function deleteShortcut(id) {
            const item = shortcuts.find(s => s.id === id);
            if (!item) return;
            if (confirm(`Delete shortcut "${item.label}"?`)) {
                shortcuts = shortcuts.filter(s => s.id !== id);
                save();
                renderGrid();
            }
        }

        function autoArrange() {
            // Sort by category order then by label
            const catOrder = CATEGORIES.reduce((acc, cat, idx) => { acc[cat.id] = idx; return acc; }, {});
            shortcuts.sort((a, b) => {
                const orderA = catOrder[a.category] ?? 99;
                const orderB = catOrder[b.category] ?? 99;
                if (orderA !== orderB) return orderA - orderB;
                return a.label.localeCompare(b.label);
            });
            save();
            renderGrid();
        }

        // ---------- Modal Management ----------
        const itemModal = document.getElementById('itemModal');
        const itemCategorySelect = document.getElementById('itemCategory');
        let itemEditId = null;

        function populateCategorySelect() {
            itemCategorySelect.innerHTML = '';
            CATEGORIES.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = cat.name;
                itemCategorySelect.appendChild(opt);
            });
        }

        function openItemModal(id) {
            populateCategorySelect();
            itemEditId = id;
            const item = id ? shortcuts.find(s => s.id === id) : null;

            document.getElementById('itemModalTitle').textContent = item ? 'Edit Shortcut' : 'New Shortcut';
            document.getElementById('itemLabel').value = item ? item.label : '';
            document.getElementById('itemUrl').value = item ? item.url : '';
            document.getElementById('itemIcon').value = item ? (item.icon || '') : '';
            itemCategorySelect.value = item ? item.category : 'office';

            itemModal.classList.add('open');
            document.getElementById('itemLabel').focus();
        }

        document.getElementById('itemCancel').onclick = () => itemModal.classList.remove('open');

        document.getElementById('itemSave').onclick = () => {
            const label = document.getElementById('itemLabel').value.trim() || 'Link';
            let url = document.getElementById('itemUrl').value.trim();
            const icon = document.getElementById('itemIcon').value.trim();
            const category = itemCategorySelect.value;

            if (url && !/^[a-z]+:/i.test(url)) url = 'https://' + url;

            if (itemEditId) {
                const item = shortcuts.find(s => s.id === itemEditId);
                if (item) {
                    item.label = label;
                    item.url = url;
                    item.icon = icon || undefined;
                    item.category = category;
                }
            } else {
                shortcuts.push({
                    id: uid(),
                    label,
                    url,
                    icon: icon || undefined,
                    category
                });
            }

            save();
            renderGrid();
            itemModal.classList.remove('open');
        };

        itemModal.addEventListener('click', (e) => {
            if (e.target === itemModal) itemModal.classList.remove('open');
        });

        // ---------- Initialize ----------
        renderGrid();

        // ---------- Soothing Ambient Canvas Background ----------
        (function () {
            const canvas = document.getElementById('bg-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            let width = 0, height = 0, dpr = 1;
            let mouseX = 0.5, mouseY = 0.5;
            let targetMouseX = 0.5, targetMouseY = 0.5;

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
            }
            window.addEventListener('resize', resize, { passive: true });
            resize();

            window.addEventListener('mousemove', (e) => {
                targetMouseX = e.clientX / Math.max(width, 1);
                targetMouseY = e.clientY / Math.max(height, 1);
            }, { passive: true });

            // Fluid color blobs matching dark theme with warm accents
            const blobs = [
                { x: 0.2, y: 0.25, radius: 0.5, color: 'rgba(10, 40, 62, 0.85)', speed: 0.00015, phase: 0 },
                { x: 0.8, y: 0.2, radius: 0.55, color: 'rgba(27, 28, 75, 0.75)', speed: 0.00012, phase: 1.5 },
                { x: 0.65, y: 0.75, radius: 0.6, color: 'rgba(13, 63, 77, 0.8)', speed: 0.00018, phase: 3.1 },
                { x: 0.25, y: 0.8, radius: 0.45, color: 'rgba(50, 45, 25, 0.45)', speed: 0.0001, phase: 4.5 },
                { x: 0.85, y: 0.65, radius: 0.4, color: 'rgba(22, 55, 75, 0.65)', speed: 0.00014, phase: 2.2 }
            ];

            // Soft floating stardust particles
            const PARTICLE_COUNT = 70;
            const particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2.2 + 0.8,
                    speedY: Math.random() * 0.22 + 0.08,
                    speedX: (Math.random() - 0.5) * 0.15,
                    opacity: Math.random() * 0.5 + 0.2,
                    pulseSpeed: Math.random() * 0.015 + 0.005,
                    pulsePhase: Math.random() * Math.PI * 2,
                    isWarm: Math.random() < 0.25
                });
            }

            let animId = null;
            let lastTime = performance.now();

            function render(now) {
                // Smooth mouse drift interpolation
                mouseX += (targetMouseX - mouseX) * 0.03;
                mouseY += (targetMouseY - mouseY) * 0.03;

                // Canvas dimensions for calculations
                const minDim = Math.min(width, height);
                const maxDim = Math.max(width, height);

                // Deep dark base gradient background
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = '#0b1217';
                ctx.fillRect(0, 0, width, height);

                // Render Fluid Ambient Aurora Blobs
                ctx.globalCompositeOperation = 'lighter';

                for (let i = 0; i < blobs.length; i++) {
                    const b = blobs[i];
                    const time = now * b.speed + b.phase;
                    const bx = (b.x + Math.sin(time) * 0.12 + (mouseX - 0.5) * 0.08) * width;
                    const by = (b.y + Math.cos(time * 0.8) * 0.12 + (mouseY - 0.5) * 0.08) * height;
                    const r = b.radius * maxDim * (1 + Math.sin(time * 1.3) * 0.08);

                    const grad = ctx.createRadialGradient(bx, by, 0, bx, by, r);
                    grad.addColorStop(0, b.color);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(bx, by, r, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Render Floating Particles
                ctx.globalCompositeOperation = 'source-over';
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.y -= p.speedY;
                    p.x += p.speedX + Math.sin(now * 0.001 + p.pulsePhase) * 0.12;
                    p.pulsePhase += p.pulseSpeed;

                    if (p.y < -10) {
                        p.y = height + 10;
                        p.x = Math.random() * width;
                    }
                    if (p.x < -10) p.x = width + 10;
                    if (p.x > width + 10) p.x = -10;

                    const alpha = p.opacity * (0.6 + 0.4 * Math.sin(p.pulsePhase));
                    ctx.fillStyle = p.isWarm ? `rgba(226, 223, 179, ${alpha})` : `rgba(180, 220, 240, ${alpha * 0.75})`;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Vignette for subtle edge focus
                const vigGrad = ctx.createRadialGradient(
                    width / 2, height / 2, minDim * 0.45,
                    width / 2, height / 2, maxDim * 0.85
                );
                vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
                vigGrad.addColorStop(1, 'rgba(5, 10, 15, 0.65)');
                ctx.fillStyle = vigGrad;
                ctx.fillRect(0, 0, width, height);

                if (!document.hidden) {
                    animId = requestAnimationFrame(render);
                }
            }

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (animId) cancelAnimationFrame(animId);
                } else {
                    lastTime = performance.now();
                    animId = requestAnimationFrame(render);
                }
            });

            animId = requestAnimationFrame(render);
        })();
    </script>
</body>
