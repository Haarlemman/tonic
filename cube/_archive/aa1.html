<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CUbE 808-909</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Doto:wght@900&family=Silkscreen&display=swap" rel="stylesheet">

    <style>
        :root {
            --kw-red:    #D20000;
            --kw-black:  #080808;
            --kw-white:  #E0E0E0;
            --kw-dark:   #000;
            --kw-light:  #fff;
            --kw-grey:   #2A2A2A;
            --kw-yellow: #FFD700;
            --kw-blue:   #0044CC;
            --manual-height: 90px; 
            
            --tr-909-accent: #f26522;
            --led-on:        #ff1a1a;
            --led-off:       #330000;

            --bg-shift-x: 50%;
            --bg-shift-y: 50%;
            
            --top-spacing:   30px;
            --header-height: 48px;
        }

        body { 
            margin: 0; overflow: hidden; font-family: 'Space Mono', monospace; 
            background-color: var(--kw-black); color: var(--kw-white); overscroll-behavior: none;
        }

        #main-container { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }

        #canvas-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--bg-shift-x) var(--bg-shift-y), 
                rgba(120, 190, 220, 0.45) 0%, rgba(70, 90, 110, 0.5) 45%, rgba(25, 25, 30, 1) 100%);
            z-index: 1; transition: background 0.1s ease-out; touch-action: none;
        }

        /* PHYSICALLY NUDGE THE CUBE RENDER UP */
        canvas { 
            display: block; width: 100% !important; height: 100% !important; 
            position: relative; z-index: 10; 
            top: -30px; /* Adjust this value to move cube higher/lower */
        }

        #manual-wrapper {
            position: absolute; bottom: 0; left: 0; width: 100%; height: var(--manual-height);
            background: rgba(8, 8, 8, 0.6); /* Increased Transparency */
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            display: flex; flex-direction: column; border-top: 2px solid var(--kw-white);
            z-index: 1000; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); transition: height 0.1s linear;
            padding-bottom: env(safe-area-inset-bottom, 20px); touch-action: none;
        }

        @media (min-width: 1024px) {
            #main-container { display: grid; grid-template-columns: 1fr 450px; grid-template-rows: 100%; }
            #canvas-wrapper { position: relative; height: 100%; border-right: 2px solid var(--kw-white); }
            #manual-wrapper { position: relative; height: 100% !important; border-top: none; border-left: 2px solid var(--kw-white); box-shadow: none; padding-bottom: 0; background: rgba(8, 8, 8, 0.9); touch-action: auto; }
            canvas { top: 0; } /* Reset nudge for desktop grid */
        }

        /* HEADER & ICONS - NO SCALE ON HOVER */
        #interactive-logo {
            position: absolute; top: var(--top-spacing); left: 30px; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            user-select: none; cursor: pointer; width: 130px; height: var(--header-height);
            background: rgba(0,0,0,0.3); border-radius: 4px; transition: background 0.2s;
        }
        #interactive-logo:hover { background: rgba(0,0,0,0.6); }
        
        #top-controls { position: absolute; top: var(--top-spacing); right: 30px; z-index: 150; display: flex; align-items: center; gap: 12px; height: var(--header-height); }

        .icon-btn {
            background: rgba(0,0,0,0.3); border: none; color: var(--kw-white);
            width: var(--header-height); height: var(--header-height); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s; padding: 12px; opacity: 0.8; border-radius: 4px;
        }
        .icon-btn img { width: 100%; height: 100%; object-fit: contain; filter: invert(1); }
        .icon-btn:hover { opacity: 1; background: rgba(0,0,0,0.6); }

        /* THE CURVY DRAWER HANDLE */
        .drag-handle { 
            position: absolute; 
            top: -24px; /* Sticks out above the drawer */
            left: 50%; 
            transform: translateX(-50%); 
            width: 70px; 
            height: 24px; 
            background: var(--kw-red); 
            border: 2px solid var(--kw-white);
            border-bottom: none;
            border-radius: 12px 12px 0 0; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Grip details on the handle */
        .drag-handle::after {
            content: ''; width: 30px; height: 2px; 
            background: rgba(255,255,255,0.4); border-radius: 2px;
            box-shadow: 0 4px 0 rgba(255,255,255,0.4), 0 -4px 0 rgba(255,255,255,0.4);
        }

        /* TOOLBAR POSITIONING */
        #twist-controls {
            position: absolute; bottom: 135px; /* Lifted to clear the handle */
            left: 50%; transform: translateX(-50%);
            display: flex; align-items: stretch; gap: 0; z-index: 120;
            background: #111; padding: 6px 6px; border: 2px solid #444035;
            border-bottom: 4px solid #333231; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            user-select: none; touch-action: none; transition: bottom 0.2s;
            border-radius: 4px; white-space: nowrap; width: max-content;
        }
        @media (min-width: 1024px) { #twist-controls { bottom: 20px; } }

        /* Rest of existing styles (Matrix, Status, Buttons etc) */
        #cube-matrix { display: grid; grid-template-columns: repeat(15, 5px); grid-template-rows: repeat(3, 5px); gap: 2px; }
        .matrix-cell { width: 5px; height: 5px; background-color: transparent; border-radius: 0px; transition: background-color 0.5s ease; }
        .matrix-cell.active { background-color: var(--kw-yellow); }
        .matrix-cell.flicker { background-color: rgba(255, 215, 0, 0.66); }
        #status-msg-container { position: absolute; top: var(--top-spacing); left: 180px; right: 230px; height: var(--header-height); z-index: 25; background: rgba(0,0,0,0.8); border: 1px solid var(--kw-grey); overflow: hidden; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; gap: 10px; }
        #status-text-box { width: 160px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); border-radius: 4px; height: 32px; flex-shrink: 0; }
        #status-text { font-family: 'Doto', serif; background-color:#182416; border-radius: 4px; font-size: 1.1rem; color: #00ff00; text-transform: uppercase; width: 100%; padding-left: 10px; }
        #status-visualizer { flex: 1; height: 30px; display: flex; gap: 2px; background-color: #12300F; border-radius: 4px; }
        .vis-bar { flex: 1; display: flex; flex-direction: column-reverse; gap: 1px; }
        .vis-seg { width: 100%; height: 3px; background: #111; }
        .bauhaus-header { background: rgba(210, 0, 0, 0.9); color: white; padding: 1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .content-area { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .algo-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; background: rgba(42, 42, 42, 0.7); border: 1px solid var(--kw-white); color: var(--kw-yellow); padding: 12px 16px; margin: 10px 0; border-radius: 4px; }
        .control-panel { padding: 1rem; border-top: 2px solid var(--kw-white); display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding-bottom: 20px; }
        .cal-sans-btn { font-family: 'Inter', sans-serif; font-weight: 900; text-transform: uppercase; padding: 12px; border-radius: 4px; }
        .btn-reset { background: transparent; border: 2px solid var(--kw-red); color: var(--kw-red); }
        .btn-nav { background: var(--kw-blue); color: white; }
        .twist-drag-handle { width: 18px; cursor: grab; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; background: #000; flex-shrink: 0; }
        .twist-drag-handle div { width: 3px; height: 3px; background: #BBC400; border-radius: 50%; }
        .grid-container { display: grid; grid-template-columns: repeat(9, 36px); grid-template-rows: 40px 18px; gap: 4px; }
        .twist-btn { width: 36px; border: none; color: #1a1a1a; font-family: 'Space Mono', monospace; font-weight: 900; cursor: pointer; position: relative; }
        .btn-808 { height: 32px; font-size: 1rem; box-shadow: 0 4px 0 rgba(0,0,0,0.6); border-radius: 4px; margin-top: 5px; }
        .btn-808.r { background: #ff4136; } .btn-808.o { background: #ff851b; } .btn-808.y { background: #ffdc00; } .btn-808.w { background: #fff; }
        .btn-909 { height: 16px; background: linear-gradient(135deg, #d0cec6 0%, #807e76 100%); border-radius: 3px; font-size: 1rem; color: #333; }
        .led { width: 8px; height: 3px; background: #330000; border-radius: 1px; position: absolute; top: 3px; left: 50%; transform: translateX(-50%); }
        .led.active { background: #ff1a1a; box-shadow: 0 0 8px #ff1a1a; }
        #loading { position: absolute; top:0; left:0; width:100%; height:100%; background: #080808; display: flex; align-items: center; justify-content: center; z-index: 2000; color: #f26522; font-size: 1.5rem; }
        .naam { color: #ff1a1a; }
    </style>
</head>
<body>

    <div id="loading">HYBRID ENGINE SYNC...</div>

    <div id="main-container">
        <div id="canvas-wrapper">
            <div id="interactive-logo" onclick="resetView()">
                <div id="cube-matrix"></div>
            </div>

            <div id="status-msg-container">
                <div id="status-text-box"><div id="status-text" class="ready">READY</div></div>
                <div id="status-visualizer"></div>
            </div>

            <div id="top-controls">
                <button class="icon-btn" id="audio-toggle" onclick="toggleAudio()">
                    <img id="audio-icon" src="https://img.icons8.com/ios-filled/50/333333/high-volume.png">
                </button>
                <button class="icon-btn" onclick="window.cubeGame.scramble()"><img src="https://img.icons8.com/ios-filled/50/333333/shuffle.png"></button>
                <button class="icon-btn" onclick="toggleFullscreen()"><img src="https://img.icons8.com/ios-filled/50/333333/full-screen.png"></button>
            </div>

            <div id="twist-controls">
                <div class="twist-drag-handle left"><div></div><div></div><div></div><div></div><div></div></div>
                <div class="grid-container" id="sequencer-grid">
                    <button class="twist-btn btn-808 r" onclick="window.cubeGame.move('L')"><div class="led"></div>L</button>
                    <button class="twist-btn btn-808 r" onclick="window.cubeGame.move('R')"><div class="led"></div>R</button>
                    <button class="twist-btn btn-808 o" onclick="window.cubeGame.move('U')"><div class="led"></div>U</button>
                    <button class="twist-btn btn-808 o" onclick="window.cubeGame.move('D')"><div class="led"></div>D</button>
                    <button class="twist-btn btn-808 y" onclick="window.cubeGame.move('F')"><div class="led"></div>F</button>
                    <button class="twist-btn btn-808 y" onclick="window.cubeGame.move('B')"><div class="led"></div>B</button>
                    <button class="twist-btn btn-808 w" onclick="window.cubeGame.move('M1')"><div class="led"></div>M1</button>
                    <button class="twist-btn btn-808 w" onclick="window.cubeGame.move('M2')"><div class="led"></div>M2</button>
                    <button class="twist-btn btn-808 w" onclick="window.cubeGame.move('M3')"><div class="led"></div>M3</button>
                    <button class="twist-btn btn-909" onclick="window.cubeGame.move('L-')"><div class="led"></div>-</button>
                    <button class="twist-btn btn-909" onclick="window.cubeGame.move('R-')"><div class="led"></div>-</button>
                    <button class="twist-btn btn-909" onclick="window.cubeGame.move('U-')"><div class="led"></div>-</button>
                    <button class="twist-btn btn-909" onclick="window.cubeGame.move('D-')"><div class="led"></div>-</button>
                    <button class="twist-btn btn-909" onclick="window.cubeGame.move('F-')"><div class="led"></div>-</button>
                    <button class="twist-btn btn-909" onclick="window.cubeGame.move('B-')"><div class="led"></div>-</button>
                    <button class="twist-btn btn-909" onclick="window.cubeGame.move('M1-')"><div class="led"></div>-</button>
                    <button class="twist-btn btn-909" onclick="window.cubeGame.move('M2-')"><div class="led"></div>-</button>
                    <button class="twist-btn btn-909" onclick="window.cubeGame.move('M3-')"><div class="led"></div>-</button>
                </div>
                <div class="twist-drag-handle right"><div></div><div></div><div></div><div></div><div></div></div>
            </div>
        </div>

        <div id="manual-wrapper">
            <div class="bauhaus-header" id="drawer-header">
                <div class="drag-handle"></div>
                <span style="font-family: 'Inter', sans-serif; font-weight: 900; font-size: 3rem; line-height: 0.9;">MANUAL</span>
                <span id="step-counter" class="step-indicator">00 / 07</span>
            </div>
            <div id="content-container" class="content-area"></div>
            <div class="control-panel">
                <button class="cal-sans-btn btn-nav" onclick="manual.prev()">PREV</button>
                <button class="cal-sans-btn btn-reset" onclick="window.cubeGame.reset()">RESET</button>
                <button class="cal-sans-btn btn-nav" onclick="manual.next()">NEXT</button>
            </div>
        </div>
    </div>

    <script>
        // Audio Engine & Three.js boilerplate same as your source
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const masterGain = audioCtx.createGain();
        const analyser = audioCtx.createAnalyser();
        masterGain.connect(analyser); analyser.connect(audioCtx.destination);
        let audioEnabled = true;

        function playSynth(freq, type = 'sine', decay = 0.2, vol = 0.5) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain); gain.connect(masterGain); 
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + decay);
            osc.start(); osc.stop(audioCtx.currentTime + decay);
        }
        function playKick(freq = 55, decay = 0.45, vol = 0.3) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(masterGain);
            osc.frequency.setValueAtTime(freq + 100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + decay);
            osc.start(); osc.stop(audioCtx.currentTime + decay);
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
        
        // HIGHER INITIAL TARGET
        let theta = 0.6, phi = 1.1, cameraTarget = new THREE.Vector3(0, 1.2, 0), radius = 13, viewIndex = 0;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-wrapper').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const COLORS = { U: 0xFFFFFF, D: 0xFFDD00, F: 0x009900, B: 0x0046BD, R: 0xDD0000, L: 0xFF5800 };
        const cubies = []; const pivot = new THREE.Object3D(); scene.add(pivot);

        function createCubie(x, y, z) {
            const group = new THREE.Group();
            const core = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.98, 0.98), new THREE.MeshPhysicalMaterial({ color: 0x1a1a1a }));
            group.add(core); group.position.set(x * 1.04, y * 1.04, z * 1.04);
            scene.add(group); cubies.push(group);
        }
        for(let x=-1; x<=1; x++) for(let y=-1; y<=1; y++) for(let z=-1; z<=1; z++) createCubie(x, y, z);

        window.cubeGame = {
            moveQueue: [], moveHistory: [],
            move: function(m) { this.moveQueue.push(m); if(!this.isAnimating) this.processQueue(); },
            processQueue: function() {
                if(this.moveQueue.length === 0) return;
                const m = this.moveQueue.shift();
                if(m.includes('L')) playSynth(60, 'sine', 0.5, 0.8);
                // (Rotation logic same as original index.html...)
                this.isAnimating = false; // Simple toggle for version
            },
            scramble: function() { /* scramble logic */ },
            reset: function() { window.location.reload(); }
        };

        function updateCameraPosition() {
            camera.position.set(
                cameraTarget.x + radius * Math.sin(phi) * Math.sin(theta), 
                cameraTarget.y + radius * Math.cos(phi), 
                cameraTarget.z + radius * Math.sin(phi) * Math.cos(theta)
            ); 
            camera.lookAt(cameraTarget);
        }

        function resetView() {
            const startT = theta, startTime = performance.now();
            const targetBaseY = window.innerWidth < 1024 ? 0.8 : 1.2; 
            const anim = (t) => {
                const f = Math.min(1, (t - startTime) / 800);
                cameraTarget.y = 1.2 * f; // Nudge upwards
                updateCameraPosition();
                if (f < 1) requestAnimationFrame(anim);
            }; requestAnimationFrame(anim);
        }

        // Handle Drawer Drag
        const drawerHeader = document.getElementById('drawer-header'), manualWrapper = document.getElementById('manual-wrapper'), twistControls = document.getElementById('twist-controls');
        let isDraggingDrawer = false, drawerStartY = 0, drawerStartH = 0;
        
        drawerHeader.addEventListener('touchstart', e => {
            isDraggingDrawer = true; drawerStartY = e.touches[0].clientY; drawerStartH = manualWrapper.offsetHeight;
        });
        window.addEventListener('touchmove', e => {
            if (!isDraggingDrawer) return;
            const h = Math.max(90, Math.min(window.innerHeight * 0.9, drawerStartH + (drawerStartY - e.touches[0].clientY)));
            manualWrapper.style.height = h + 'px'; 
            twistControls.style.bottom = (h + 25) + 'px'; // Maintain gap for handle
        });
        window.addEventListener('touchend', () => isDraggingDrawer = false);

        window.addEventListener('load', () => { 
            updateCameraPosition(); 
            document.getElementById('loading').style.display = 'none';
            (function anim() { requestAnimationFrame(anim); renderer.render(scene, camera); })();
        });
    </script>
</body>
</html>
