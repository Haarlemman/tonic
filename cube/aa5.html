    <script>
        // --- HYBRID AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const masterGain = audioCtx.createGain(); // Master gain for muting
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        // Signal Chain: Oscillators -> masterGain -> analyser -> destination
        masterGain.connect(analyser);
        analyser.connect(audioCtx.destination);
        
        let audioEnabled = true;

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const icon = document.getElementById('audio-icon');
            if (audioEnabled) {
                masterGain.gain.setTargetAtTime(1, audioCtx.currentTime, 0.05);
                icon.src = "https://img.icons8.com/ios-filled/50/333333/high-volume.png";
            } else {
                masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
                icon.src = "https://img.icons8.com/ios-filled/50/333333/mute.png";
            }
        }

        function playSynth(freq, type = 'sine', decay = 0.2, vol = 0.5) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain); gain.connect(masterGain); 
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + decay);
            osc.start(); osc.stop(audioCtx.currentTime + decay);
        }

        function playNoise(decay = 0.1, highPass = 1000, vol = 0.3) {
            const bufferSize = audioCtx.sampleRate * decay;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = highPass;
            const gain = audioCtx.createGain();
            noise.connect(filter); filter.connect(gain); gain.connect(masterGain);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + decay);
            noise.start(); noise.stop(audioCtx.currentTime + decay);
        }

        function playKick(freq = 55, decay = 0.45, vol = 0.3) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(masterGain);
            osc.frequency.setValueAtTime(freq + 100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq, audioCtx.currentTime + 0.05);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + decay);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);

            h.addEventListener('touchstart', e => { e.preventDefault(); sD(e.touches[0].clientX, e.touches[0].clientY); });
        });
        
        window.addEventListener('mousemove', e => mD(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => { if(isDragC && e.touches[0]) mD(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('mouseup', () => isDragC = false);
        window.addEventListener('touchend', () => isDragC = false);

        window.addEventListener('resize', handleResize);
        window.addEventListener('load', () => { 
            manual.init(); handleResize(); 
            document.getElementById('loading').style.display = 'none'; 
            (function anim() { requestAnimationFrame(anim); renderer.render(scene, camera); })(); 
        });
