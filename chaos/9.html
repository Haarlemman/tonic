<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dance of Red & Blue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: #e2e8f0;
            user-select: none;
        }
        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            width: 350px;
            transition: all 0.3s ease;
        }
        #ui-layer.minimized {
            bottom: 30px;
            width: auto;
        }
        
        .title-container {
            pointer-events: auto; /* Allow clicking title if needed, or keeping interactions */
        }
        
        .title {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            line-height: 1.1;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .subtitle {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 0.5rem;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        
        /* Controls Container */
        .controls {
            pointer-events: auto;
            margin-top: 1.5rem;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
            position: relative;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform-origin: bottom left;
        }

        #ui-layer.minimized .controls {
            display: none;
        }

        /* Minimize Toggle */
        .min-toggle {
            position: absolute;
            top: -30px;
            right: 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #475569;
            color: #94a3b8;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            pointer-events: auto;
            border-radius: 2px;
        }
        .min-toggle:hover {
            border-color: #e2e8f0;
            color: #fff;
        }

        /* Buttons */
        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 8px;
        }
        .btn:hover {
            border-color: #e2e8f0;
            color: #ffffff;
            background: rgba(255,255,255,0.1);
        }
        .btn.active {
            border-color: #10b981;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        /* Playlist */
        .playlist {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
            border: 1px solid #334155;
            background: rgba(0,0,0,0.3);
        }
        .track {
            padding: 6px 10px;
            font-size: 0.7rem;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #64748b;
        }
        .track:hover {
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
        }
        .track.playing {
            color: #60a5fa; /* Blue */
            background: rgba(96, 165, 250, 0.1);
            border-left: 3px solid #60a5fa;
        }

        /* Scrubber */
        .scrubber-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #e2e8f0;
            border-radius: 50%;
            cursor: pointer;
        }
        .time-display {
            font-size: 0.65rem;
            color: #64748b;
            min-width: 60px;
            text-align: right;
        }

        /* File Input */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="ui-layer">
        <div class="title-container">
            <h1 class="title text-4xl text-red-500">RED <span class="text-xs text-red-300 align-middle">(BASS)</span></h1>
            <h1 class="title text-4xl text-blue-500">& BLUE <span class="text-xs text-blue-300 align-middle">(TREBLE)</span></h1>
            <p class="subtitle text-slate-300">Hover to Conduct / Drag to Cluster</p>
        </div>
        
        <div class="controls">
            <div class="min-toggle" id="min-toggle">–</div>

            <!-- Playlist Controls -->
            <label for="audio-upload" class="btn">
                <span>📂 Upload MP3s (Optional)</span>
            </label>
            <input type="file" id="audio-upload" accept="assets/audio/*" multiple>

            <div class="playlist" id="playlist-container">
                <!-- Tracks rendered by JS -->
            </div>

            <button id="play-pause-btn" class="btn">PLAY / PAUSE</button>

            <!-- Scrubber -->
            <div class="scrubber-container">
                <input type="range" id="seek-bar" value="0" max="100">
                <div class="time-display" id="time-display">--:--</div>
            </div>
            
            <div id="status-text" class="text-xs text-slate-500 mt-2">Status: Ready</div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const config = {
            redColor: '255, 60, 60',
            blueColor: '60, 100, 255',
            particleCount: 220,
            bgFade: 'rgba(5, 5, 5, 0.3)' 
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const fileInput = document.getElementById('audio-upload');
        const playlistContainer = document.getElementById('playlist-container');
        const seekBar = document.getElementById('seek-bar');
        const timeDisplay = document.getElementById('time-display');
        const statusText = document.getElementById('status-text');
        const minToggle = document.getElementById('min-toggle');
        const uiLayer = document.getElementById('ui-layer');

        let width, height;
        let particles = [];
        
        // Audio State
        let audioCtx;
        let analyser;
        let source; 
        let dataArray;
        let isAudioInitialized = false;
        let isPlaying = false;
        let isGenerative = true;
        let genOscillators = [];
        
        // Pre-defined Generative Playlist (Simulating Tracks)
        let playlist = [
            { name: "1. Deep Submersion (Bass)", type: "gen", preset: "bass" },
            { name: "2. Crystal Rain (Treble)", type: "gen", preset: "treble" },
            { name: "3. Neural Static (Glitch)", type: "gen", preset: "glitch" },
            { name: "4. Cardiac Pulse (Rhythm)", type: "gen", preset: "pulse" },
            { name: "5. The Void (Drone)", type: "gen", preset: "drone" }
        ];
        
        let currentTrackIndex = 0;
        let audioElement = new Audio(); // Reusable audio element for files
        audioElement.crossOrigin = "anonymous";

        // Frequencies
        let bassLevel = 0;
        let trebleLevel = 0;
        
        // Mouse state
        let mouse = { x: null, y: null, active: false, isDown: false, isDragging: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- UI LOGIC ---
        minToggle.addEventListener('click', () => {
            uiLayer.classList.toggle('minimized');
            minToggle.innerText = uiLayer.classList.contains('minimized') ? '+' : '–';
        });

        // --- AUDIO ENGINE ---
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512; 
                analyser.smoothingTimeConstant = 0.8;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Playlist Logic
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                // Keep the default tracks, append user tracks
                // or replace? Let's append for "mix" feel
                files.forEach(file => {
                    playlist.push({
                        name: `MP3: ${file.name}`,
                        type: 'file',
                        file: file
                    });
                });
                renderPlaylist();
                // Play first new track
                playTrack(playlist.length - files.length);
            }
        });

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = `track ${index === currentTrackIndex ? 'playing' : ''}`;
                div.innerText = track.name;
                div.onclick = () => playTrack(index);
                div.id = `track-${index}`;
                playlistContainer.appendChild(div);
            });
        }

        function playTrack(index) {
            initAudioContext();
            
            // Stop everything first
            stopAudio();
            
            // Update UI
            document.getElementById(`track-${currentTrackIndex}`)?.classList.remove('playing');
            currentTrackIndex = index;
            document.getElementById(`track-${currentTrackIndex}`)?.classList.add('playing');

            const track = playlist[index];
            
            if (track.type === 'gen') {
                // Play Generative Preset
                playGenerativePreset(track.preset);
                isGenerative = true;
                seekBar.disabled = true;
                timeDisplay.innerText = "GEN:∞";
            } else {
                // Play File
                isGenerative = false;
                seekBar.disabled = false;
                const fileURL = URL.createObjectURL(track.file);
                
                // Disconnect old media source if exists to avoid errors
                // Note: Re-creating source node is safer in web audio
                // For simplicity here, we assume one source per element life cycle or simple switching
                
                if (source && source.mediaElement) {
                     // If we already made a source node for this element, we reuse the element
                     // but the graph remains.
                } else if (!source || !source.mediaElement) {
                     source = audioCtx.createMediaElementSource(audioElement);
                     source.connect(analyser);
                     analyser.connect(audioCtx.destination);
                }

                audioElement.src = fileURL;
                audioElement.play();
                statusText.innerText = `Playing: ${track.name}`;
                isPlaying = true;
                playPauseBtn.innerText = "PAUSE";
                playPauseBtn.classList.add('active');
            }
        }

        function stopAudio() {
            if (isGenerative) {
                genOscillators.forEach(o => {
                    try { o.stop(); o.disconnect(); } catch(e){}
                });
                genOscillators = [];
            } else {
                audioElement.pause();
            }
            isPlaying = false;
        }

        // GENERATIVE SYNTH ENGINE (The "Fake" Tracks)
        function playGenerativePreset(preset) {
            isGenerative = true;
            genOscillators = [];
            
            const masterGenGain = audioCtx.createGain();
            masterGenGain.gain.value = 0.2;
            masterGenGain.connect(analyser);
            analyser.connect(audioCtx.destination);

            const createOsc = (type, freq, detune = 0, gainVal = 0.5) => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.detune.value = detune;
                g.gain.value = gainVal;
                osc.connect(g);
                g.connect(masterGenGain);
                osc.start();
                genOscillators.push(osc);
            };

            // LFO helper
            const createLFO = (targetParam, freq, depth) => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.frequency.value = freq;
                g.gain.value = depth;
                osc.connect(g);
                g.connect(targetParam);
                osc.start();
                genOscillators.push(osc);
            };

            if (preset === 'bass') {
                // Deep Submersion
                createOsc('sine', 55, 0, 0.8); // Sub
                createOsc('triangle', 110, 5, 0.4);
                createLFO(masterGenGain.gain, 0.5, 0.1); // Slow pulse
            } else if (preset === 'treble') {
                // Crystal Rain
                createOsc('sine', 880, 0, 0.3);
                createOsc('sine', 1320, 10, 0.2); // E6
                createLFO(masterGenGain.gain, 4, 0.1); // Fast shimmer
            } else if (preset === 'glitch') {
                // Neural Static
                createOsc('sawtooth', 40, 0, 0.6);
                createOsc('square', 41, 0, 0.6); // Beating
            } else if (preset === 'pulse') {
                // Cardiac
                createOsc('triangle', 60, 0, 0.7);
                createLFO(masterGenGain.gain, 2, 0.5); // Heartbeat
            } else {
                // Drone (Default)
                createOsc('sawtooth', 110, 0, 0.1);
                createOsc('square', 220, 0, 0.1);
            }
            
            statusText.innerText = `Playing: ${playlist[currentTrackIndex].name}`;
            isPlaying = true;
            playPauseBtn.innerText = "PAUSE";
            playPauseBtn.classList.add('active');
        }

        // Play/Pause Toggle
        playPauseBtn.addEventListener('click', () => {
            if (!isAudioInitialized) {
                // Start first track if nothing initialized
                playTrack(0);
                return;
            }
            
            if (isPlaying) {
                // Pause
                if (isGenerative) {
                    // Mute gain rather than stop to allow resume-like feel, or just stop
                    // For simplicity, we stop, but UI says pause.
                    stopAudio(); 
                } else {
                    audioElement.pause();
                }
                isPlaying = false;
                playPauseBtn.innerText = "RESUME";
                playPauseBtn.classList.remove('active');
            } else {
                // Resume
                if (playlist[currentTrackIndex].type === 'gen') {
                    playTrack(currentTrackIndex); // Re-trigger generator
                } else {
                    audioElement.play();
                }
                isPlaying = true;
                playPauseBtn.innerText = "PAUSE";
                playPauseBtn.classList.add('active');
            }
        });

        // Scrubbing
        audioElement.addEventListener('timeupdate', () => {
            if (!isGenerative && audioElement.duration) {
                const progress = (audioElement.currentTime / audioElement.duration) * 100;
                seekBar.value = progress;
                
                const curMins = Math.floor(audioElement.currentTime / 60);
                const curSecs = Math.floor(audioElement.currentTime % 60).toString().padStart(2, '0');
                const durMins = Math.floor(audioElement.duration / 60);
                const durSecs = Math.floor(audioElement.duration % 60).toString().padStart(2, '0');
                timeDisplay.innerText = `${curMins}:${curSecs} / ${durMins}:${durSecs}`;
            }
        });
        
        seekBar.addEventListener('input', () => {
            if (!isGenerative && audioElement.duration) {
                const time = (seekBar.value / 100) * audioElement.duration;
                audioElement.currentTime = time;
            }
        });

        // --- INTERACTION ---
        const handleStart = (x, y) => {
            mouse.x = x;
            mouse.y = y;
            mouse.isDown = true;
            mouse.isDragging = true; // Start Dragging
            mouse.active = true;
        };

        const handleMove = (x, y) => {
            mouse.x = x;
            mouse.y = y;
            mouse.active = true;
        };

        const handleEnd = () => {
            mouse.isDown = false;
            mouse.isDragging = false; // Release -> "Separate" logic kicks in naturally
            // We keep active true for a moment so they don't freeze instantly if playing
        };

        window.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', handleEnd);
        
        window.addEventListener('touchstart', e => handleStart(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchmove', e => handleMove(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchend', handleEnd);

        // Render initial playlist
        renderPlaylist();


        // --- PARTICLES ---
        class Particle {
            constructor(type) {
                this.type = type; 
                this.reset(true); 
            }

            reset(initial = false) {
                // STANDOFF POSITIONS
                if (initial) {
                    if (this.type === 'red') {
                        this.x = Math.random() * (width * 0.4);
                    } else {
                        this.x = (width * 0.6) + Math.random() * (width * 0.4);
                    }
                } else {
                    this.x = Math.random() * width;
                }
                
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                this.baseSize = Math.random() * 2 + 1; 
                this.angle = Math.random() * Math.PI * 2;
                this.speedMod = this.type === 'red' ? 0.04 : 0.03; 
            }

            update(bass, treble) {
                let energy = (this.type === 'red') ? bass : treble;
                
                // Standstill logic
                const baseSpeed = isPlaying ? 0.005 : 0; 
                const reactionMult = 8.0; 

                // 1. Base Movement
                if (this.type === 'red') {
                    this.angle += this.speedMod;
                    this.vx += (Math.sin(this.angle) * baseSpeed) + ((Math.random()-0.5) * energy * reactionMult);
                    this.vy += (Math.cos(this.angle) * baseSpeed) + ((Math.random()-0.5) * energy * reactionMult);
                } else {
                    this.angle -= this.speedMod;
                    this.vx += (Math.cos(this.angle) * baseSpeed) + ((Math.random()-0.5) * energy * reactionMult);
                    this.vy += (Math.sin(this.angle) * baseSpeed) + ((Math.random()-0.5) * energy * reactionMult);
                }

                // 2. Interaction
                if (mouse.active && mouse.x) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const angle = Math.atan2(dy, dx);

                    if (mouse.isDragging) {
                        // --- DRAG CLUSTER MODE ---
                        // Strong Attraction to Mouse to create the "Cluster"
                        // They swarm the mouse
                        const force = (1000 - dist) / 1000; // Long range pull
                        if (dist > 50) { // Don't collapse into a singularity
                            this.vx += Math.cos(angle) * force * 3.5;
                            this.vy += Math.sin(angle) * force * 3.5;
                        } else {
                            // Jiggle inside the cluster
                            this.vx += (Math.random()-0.5) * 2;
                            this.vy += (Math.random()-0.5) * 2;
                        }
                    } else if (dist < 300) {
                        // --- HOVER CONDUCT MODE ---
                        // Gentle influence
                        const force = (300 - dist) / 300;
                        const pullStrength = 0.5 + (energy * 2); 
                        this.vx += Math.cos(angle) * force * pullStrength;
                        this.vy += Math.sin(angle) * force * pullStrength;
                    }
                }
                
                // 3. Standoff Logic (Return to Sites when not dragging)
                if (!mouse.isDragging) {
                    // If Red is on Right side -> Push Left
                    if (this.type === 'red' && this.x > width * 0.5) {
                        this.vx -= 0.3; // Stronger pushback
                    }
                    // If Blue is on Left side -> Push Right
                    if (this.type === 'blue' && this.x < width * 0.5) {
                        this.vx += 0.3;
                    }
                }

                // Friction
                this.vx *= 0.90; 
                this.vy *= 0.90;

                this.x += this.vx;
                this.y += this.vy;

                // Wall collisions (Bounce instead of wrap for standoff feel)
                if (this.x < 0) { this.x = 0; this.vx *= -1; }
                if (this.x > width) { this.x = width; this.vx *= -1; }
                if (this.y < 0) { this.y = 0; this.vy *= -1; }
                if (this.y > height) { this.y = height; this.vy *= -1; }
            }

            draw(bass, treble) {
                let energy = (this.type === 'red') ? bass : treble;
                
                ctx.beginPath();
                
                // Radius Logic
                let r = this.baseSize;
                if (this.type === 'red') {
                    // RED BASS BOOST (More pronounced as requested)
                    r = this.baseSize * (1 + energy * 8); // Huge scaler for bass
                } else {
                    r = this.baseSize * (1 + energy * 4);
                }

                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                
                if (this.type === 'red') {
                    const alpha = 0.2 + (energy * 0.8);
                    ctx.fillStyle = `rgba(${config.redColor}, ${alpha})`;
                } else {
                    const alpha = 0.2 + (energy * 0.8);
                    ctx.fillStyle = `rgba(${config.blueColor}, ${alpha})`;
                }
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < config.particleCount / 2; i++) particles.push(new Particle('red'));
            for (let i = 0; i < config.particleCount / 2; i++) particles.push(new Particle('blue'));
        }

        function animate() {
            // Analyze Audio
            if (analyser && isPlaying) {
                analyser.getByteFrequencyData(dataArray);
                const bufferLength = analyser.frequencyBinCount;
                const splitIndex = Math.floor(bufferLength / 8); // Focus on very low end for bass
                
                let bassSum = 0;
                let trebleSum = 0;
                
                // Bass (Deep low end)
                for(let i = 0; i < splitIndex; i++) bassSum += dataArray[i];
                // Treble (High end)
                for(let i = splitIndex * 4; i < bufferLength; i++) trebleSum += dataArray[i];
                
                bassLevel = (bassSum / splitIndex) / 255; 
                trebleLevel = (trebleSum / (bufferLength - splitIndex*4)) / 255;
                
                // Normalize / Boost
                trebleLevel = Math.min(1, trebleLevel * 4);
                bassLevel = Math.min(1, bassLevel * 2); // Boost bass level for logic
            } else {
                bassLevel *= 0.8;
                trebleLevel *= 0.8;
            }

            // Draw Background
            ctx.fillStyle = config.bgFade; 
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                const p1 = particles[i];
                p1.update(bassLevel, trebleLevel);
                p1.draw(bassLevel, trebleLevel);

                // Connections
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const distSq = dx*dx + dy*dy; 
                    
                    if (distSq < 15000) { 
                        const dist = Math.sqrt(distSq);
                        const opacity = 1 - (dist / 122);

                        if (p1.type === p2.type) {
                            ctx.beginPath();
                            ctx.lineWidth = 0.5;
                            const color = p1.type === 'red' ? config.redColor : config.blueColor;
                            const pulse = p1.type === 'red' ? bassLevel : trebleLevel;
                            
                            ctx.strokeStyle = `rgba(${color}, ${opacity * (0.1 + pulse * 2)})`;
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        } else {
                            if (dist < 60) {
                                ctx.beginPath();
                                ctx.lineWidth = 1 + (bassLevel + trebleLevel) * 2; 
                                ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 2 * (bassLevel+trebleLevel)})`;
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        }
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();

    </script>
</body>
</html>
