<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complexity & Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19; /* Very dark slate */
            color: #e2e8f0;
            user-select: none;
        }
        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #overlay {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none; /* Let clicks pass through to canvas generally */
        }
        .title {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            line-height: 1.1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #audio-toggle {
            pointer-events: auto; /* Re-enable clicks for the button */
            margin-top: 1rem;
            background: transparent;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 8px 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #audio-toggle:hover {
            border-color: #e2e8f0;
            color: #e2e8f0;
        }
        #audio-toggle.active {
            border-color: #10b981;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="overlay">
        <!-- Made both lines identical in styling -->
        <h1 class="title text-3xl font-bold text-slate-200 opacity-90">COMPLEXITY</h1>
        <h1 class="title text-3xl font-bold text-slate-200 opacity-90">& CONTROL</h1>
        
        <button id="audio-toggle">SOUND: OFF</button>
    </div>

    <script>
        // --- USER CONFIGURATION ---
        // You can control the colors here. Use RGB format 'Red, Green, Blue'.
        const config = {
            color1: '230, 00, 0',   // Amber/Gold
            color2: '0, 0, 230',   // Blue/Teal
            particleCount: 200,
            bgFade: 'rgba(11, 15, 25, 0.5)' // Background trail fade
        };
        // --------------------------

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const toggleBtn = document.getElementById('audio-toggle');

        let width, height;
        let particles = [];
        const connectionDistance = 100;
        
        // Audio State
        let audioCtx;
        let masterGain;
        let filter;
        let isAudioInitialized = false;
        let isMuted = true;
        
        // Mouse state
        let mouse = { x: null, y: null, active: false };

        // Resize
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Initialization
        function initAudio() {
            if (isAudioInitialized) return;
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0; // Start muted
            masterGain.connect(audioCtx.destination);

            filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 300; 
            filter.connect(masterGain);

            // Osc 1
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'triangle'; 
            osc1.frequency.value = 220; 
            osc1.connect(filter);
            osc1.start();

            // Osc 2
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.value = 329.63; 
            osc2.connect(filter);
            osc2.start();

            // Sub Osc
            const subOsc = audioCtx.createOscillator();
            subOsc.type = 'sawtooth'; 
            subOsc.frequency.value = 110; 
            const subGain = audioCtx.createGain();
            subGain.gain.value = 0.08; 
            subOsc.connect(subGain);
            subGain.connect(filter);
            subOsc.start();

            isAudioInitialized = true;
        }

        // Toggle Button Logic
        toggleBtn.addEventListener('click', () => {
            if (!isAudioInitialized) {
                initAudio();
            }
            
            // Resume context if suspended (common browser policy)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isMuted = !isMuted;
            
            if (isMuted) {
                masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
                toggleBtn.innerText = "SOUND: OFF";
                toggleBtn.classList.remove('active');
            } else {
                masterGain.gain.setTargetAtTime(0.15, audioCtx.currentTime, 0.1);
                toggleBtn.innerText = "SOUND: ON";
                toggleBtn.classList.add('active');
            }
        });

        // Mouse/Touch Interaction
        const handleInteractionStart = (x, y) => {
            mouse.x = x;
            mouse.y = y;
            mouse.active = true;
            updateAudio(true);
        };

        const handleInteractionEnd = () => {
            mouse.active = false;
            updateAudio(false);
        };

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
            updateAudio(true);
        });
        window.addEventListener('mouseup', handleInteractionEnd);
        
        window.addEventListener('touchstart', e => handleInteractionStart(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchmove', e => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        window.addEventListener('touchend', handleInteractionEnd);


        function updateAudio(isActive) {
            if (!isAudioInitialized || isMuted) return;
            const now = audioCtx.currentTime;
            
            if (isActive) {
                filter.frequency.setTargetAtTime(1200, now, 0.2); 
                masterGain.gain.setTargetAtTime(0.3, now, 0.2);
            } else {
                filter.frequency.setTargetAtTime(300, now, 1.5);
                masterGain.gain.setTargetAtTime(0.15, now, 1.5);
            }
        }


        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.size = Math.random() * 2 + 1;
                
                // --- USE CONFIG COLORS ---
                this.baseColor = Math.random() > 0.5 ? config.color1 : config.color2; 
                
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                this.angle += 0.02;
                this.vx += Math.sin(this.angle) * 0.05;
                this.vy += Math.cos(this.angle) * 0.05;

                if (mouse.active && mouse.x) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    
                    const maxDistance = 300;
                    if (distance < maxDistance) {
                        const force = (maxDistance - distance) / maxDistance;
                        this.vx += forceDirectionX * force * 0.8;
                        this.vy += forceDirectionY * force * 0.8;
                    }
                }

                this.vx *= 0.96;
                this.vy *= 0.96;
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = `rgba(${this.baseColor}, 0.8)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < config.particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.fillStyle = config.bgFade; 
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        const opacity = 1 - (distance / connectionDistance);
                        // Make lines white/greyish to match any color scheme
                        ctx.strokeStyle = `rgba(200, 200, 220, ${opacity * 0.2})`; 
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();

    </script>
</body>
</html>
