<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dance of Red & Blue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* Near black */
            color: #e2e8f0;
            user-select: none;
        }
        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            mix-blend-mode: exclusion; /* Cool effect over particles */
        }
        .title {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            line-height: 1.1;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .subtitle {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 0.5rem;
        }
        #audio-toggle {
            pointer-events: auto;
            margin-top: 1.5rem;
            background: rgba(0,0,0,0.5);
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #audio-toggle:hover {
            border-color: #e2e8f0;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        #audio-toggle.active {
            border-color: #10b981;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="ui-layer">
        <h1 class="title text-4xl text-red-500">RED</h1>
        <h1 class="title text-4xl text-blue-500">& BLUE</h1>
        <p class="subtitle text-slate-300">A visual dance of complexity</p>
        
        <button id="audio-toggle">INITIALIZE DANCE</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        const config = {
            redColor: '255, 60, 60',    // Vivid Red
            blueColor: '60, 100, 255',  // Vivid Blue
            particleCount: 220,
            baseConnectionDist: 110,
            bgFade: 'rgba(5, 5, 5, 0.2)' // Trails
        };
        // ---------------------

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const toggleBtn = document.getElementById('audio-toggle');

        let width, height;
        let particles = [];
        
        // Audio State
        let audioCtx;
        let masterGain;
        let analyser;
        let dataArray;
        let filter;
        let isAudioInitialized = false;
        let isPlaying = false;
        let audioLevel = 0; // Normalized 0-1 volume level
        
        // Mouse state
        let mouse = { x: null, y: null, active: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- AUDIO ENGINE ---
        function initAudio() {
            if (isAudioInitialized) return;
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            // Analyser (The "Eyes" of the audio)
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64; // Low resolution is fine for volume
            dataArray = new Uint8Array(analyser.frequencyBinCount);

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0; 
            
            // Chain: Oscillators -> Filter -> MasterGain -> Analyser -> Destination
            masterGain.connect(analyser);
            analyser.connect(audioCtx.destination);

            filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 400; 

            // Drone 1 (Deep)
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'triangle'; 
            osc1.frequency.value = 110; // A2
            osc1.connect(filter);
            osc1.start();

            // Drone 2 (Harmony)
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.value = 164.81; // E3
            osc2.connect(filter);
            osc2.start();

            // LFO (Low Frequency Oscillator) to make the sound "breathe" automatically
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 0.2; // Slow pulse (5 seconds)
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 200; // Filter sweep amount
            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            lfo.start();

            isAudioInitialized = true;
        }

        toggleBtn.addEventListener('click', () => {
            if (!isAudioInitialized) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isPlaying = !isPlaying;
            
            if (!isPlaying) {
                masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
                toggleBtn.innerText = "RESUME DANCE";
                toggleBtn.classList.remove('active');
            } else {
                masterGain.gain.setTargetAtTime(0.25, audioCtx.currentTime, 1);
                toggleBtn.innerText = "PAUSE DANCE";
                toggleBtn.classList.add('active');
            }
        });

        // --- INTERACTION ---
        const handleInteraction = (x, y, active) => {
            mouse.x = x;
            mouse.y = y;
            mouse.active = active;
            
            // Interaction changes sound filter immediately
            if (isAudioInitialized && isPlaying) {
                const now = audioCtx.currentTime;
                if (active) {
                    filter.frequency.setTargetAtTime(1000, now, 0.2); 
                    masterGain.gain.setTargetAtTime(0.4, now, 0.2);
                } else {
                    filter.frequency.setTargetAtTime(400, now, 1.5);
                    masterGain.gain.setTargetAtTime(0.25, now, 1.5);
                }
            }
        };

        window.addEventListener('mousemove', e => handleInteraction(e.clientX, e.clientY, true));
        window.addEventListener('mousedown', e => handleInteraction(e.clientX, e.clientY, true));
        window.addEventListener('mouseup', () => handleInteraction(mouse.x, mouse.y, false));
        
        window.addEventListener('touchstart', e => handleInteraction(e.touches[0].clientX, e.touches[0].clientY, true));
        window.addEventListener('touchmove', e => handleInteraction(e.touches[0].clientX, e.touches[0].clientY, true));
        window.addEventListener('touchend', () => handleInteraction(mouse.x, mouse.y, false));

        // --- PARTICLES ---
        class Particle {
            constructor(type) {
                this.type = type; // 'red' or 'blue'
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = (Math.random() - 0.5) * 1;
                this.baseSize = Math.random() * 2 + 1;
                this.angle = Math.random() * Math.PI * 2;
                // Slightly different movement speeds for the "dance" dynamics
                this.speedMod = this.type === 'red' ? 0.04 : 0.03; 
            }

            update(time, audioBoost) {
                // 1. Time-based Undulation (The Dance)
                // Red moves with Sine, Blue with Cosine for complementary motion
                if (this.type === 'red') {
                    this.angle += this.speedMod;
                    this.vx += Math.sin(this.angle + time) * 0.02;
                    this.vy += Math.cos(this.angle + time) * 0.02;
                } else {
                    this.angle -= this.speedMod; // Reverse rotation
                    this.vx += Math.cos(this.angle - time) * 0.02;
                    this.vy += Math.sin(this.angle - time) * 0.02;
                }

                // 2. Mouse Interaction (The Conductor)
                if (mouse.active && mouse.x) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < 400) {
                        const force = (400 - dist) / 400;
                        // Swirl effect
                        const angle = Math.atan2(dy, dx);
                        const rotationForce = 0.05;
                        
                        // Attraction
                        this.vx += Math.cos(angle) * force * 0.5;
                        this.vy += Math.sin(angle) * force * 0.5;

                        // Rotation (Red CW, Blue CCW)
                        const rotDir = this.type === 'red' ? 1.5 : -1.5;
                        this.vx += -Math.sin(angle) * force * rotationForce * rotDir;
                        this.vy += Math.cos(angle) * force * rotationForce * rotDir;
                    }
                }

                // 3. Audio Reactivity (Energy)
                // Add jitter based on volume
                this.vx += (Math.random() - 0.5) * audioBoost * 2;
                this.vy += (Math.random() - 0.5) * audioBoost * 2;

                // Friction
                this.vx *= 0.96;
                this.vy *= 0.96;

                this.x += this.vx;
                this.y += this.vy;

                // Wrap
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw(audioScale) {
                ctx.beginPath();
                // Audio makes them pulsate
                const r = this.baseSize * (1 + audioScale * 1.5); 
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                
                if (this.type === 'red') {
                    ctx.fillStyle = `rgba(${config.redColor}, 0.8)`;
                } else {
                    ctx.fillStyle = `rgba(${config.blueColor}, 0.8)`;
                }
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            // Create Red Team
            for (let i = 0; i < config.particleCount / 2; i++) {
                particles.push(new Particle('red'));
            }
            // Create Blue Team
            for (let i = 0; i < config.particleCount / 2; i++) {
                particles.push(new Particle('blue'));
            }
        }

        function animate() {
            // Get Audio Data
            if (isAudioInitialized && isPlaying) {
                analyser.getByteFrequencyData(dataArray);
                // Calculate average volume level (0.0 to 1.0)
                let sum = 0;
                for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                audioLevel = sum / dataArray.length / 128; // Normalize rough approx
            } else {
                // Decay if paused
                audioLevel *= 0.9;
            }

            // Background
            ctx.fillStyle = config.bgFade; 
            ctx.fillRect(0, 0, width, height);

            const time = Date.now() * 0.001; // Global time

            // Update and Draw Particles
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.update(time, audioLevel);
                p.draw(audioLevel);
            }

            // Draw Connections (The "Relations")
            // Boost connection distance with audio
            const currentConnectDist = config.baseConnectionDist * (1 + audioLevel * 0.5);

            ctx.lineWidth = 0.5;
            
            for (let i = 0; i < particles.length; i++) {
                const p1 = particles[i];

                // Optimization: Check fewer neighbors
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < currentConnectDist) {
                        ctx.beginPath();
                        const opacity = 1 - (dist / currentConnectDist);
                        
                        // Logic: 
                        // Red-Red connections = Red line
                        // Blue-Blue connections = Blue line
                        // Red-Blue connections = White/Purple line (The "Dance" interaction)
                        
                        if (p1.type !== p2.type) {
                            // Cross-pollination (The Dance) - Make these brighter
                            ctx.strokeStyle = `rgba(200, 100, 255, ${opacity * 0.8})`;
                        } else if (p1.type === 'red') {
                             ctx.strokeStyle = `rgba(${config.redColor}, ${opacity * 0.2})`;
                        } else {
                             ctx.strokeStyle = `rgba(${config.blueColor}, ${opacity * 0.2})`;
                        }
                        
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();

    </script>
</body>
</html>
