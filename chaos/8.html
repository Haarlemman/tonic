<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dance of Red & Blue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: #e2e8f0;
            user-select: none;
        }
        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            width: 350px;
        }
        .title {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            line-height: 1.1;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .subtitle {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 0.5rem;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        
        /* Controls Container */
        .controls {
            pointer-events: auto;
            margin-top: 1.5rem;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        /* Buttons */
        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 8px;
        }
        .btn:hover {
            border-color: #e2e8f0;
            color: #ffffff;
            background: rgba(255,255,255,0.1);
        }
        .btn.active {
            border-color: #10b981;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        /* Playlist */
        .playlist {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
            border: 1px solid #334155;
            background: rgba(0,0,0,0.3);
        }
        .track {
            padding: 6px 10px;
            font-size: 0.7rem;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #64748b;
        }
        .track:hover {
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
        }
        .track.playing {
            color: #60a5fa; /* Blue */
            background: rgba(96, 165, 250, 0.1);
            border-left: 3px solid #60a5fa;
        }

        /* Scrubber */
        .scrubber-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #e2e8f0;
            border-radius: 50%;
            cursor: pointer;
        }
        .time-display {
            font-size: 0.65rem;
            color: #64748b;
            min-width: 60px;
            text-align: right;
        }

        /* File Input */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="ui-layer">
        <h1 class="title text-4xl text-red-500">RED <span class="text-xs text-red-300 align-middle">(BASS)</span></h1>
        <h1 class="title text-4xl text-blue-500">& BLUE <span class="text-xs text-blue-300 align-middle">(TREBLE)</span></h1>
        <p class="subtitle text-slate-300">Hover to Conduct / Click to Untie</p>
        
        <div class="controls">
            <!-- Playlist Controls -->
            <label for="audio-upload" class="btn">
                <span>📂 Load MP3s (Select Multiple)</span>
            </label>
            <input type="file" id="audio-upload" accept="audio/*" multiple>

            <div class="playlist" id="playlist-container">
                <div class="track playing" id="track-0" onclick="playTrack(0)">1. Generative Synth Demo</div>
                <!-- User tracks will be added here -->
            </div>

            <button id="play-pause-btn" class="btn">PLAY / PAUSE</button>

            <!-- Scrubber -->
            <div class="scrubber-container">
                <input type="range" id="seek-bar" value="0" max="100">
                <div class="time-display" id="time-display">0:00 / 0:00</div>
            </div>
            
            <div id="status-text" class="text-xs text-slate-500 mt-2">Status: Ready</div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const config = {
            redColor: '255, 60, 60',
            blueColor: '60, 100, 255',
            particleCount: 220,
            bgFade: 'rgba(5, 5, 5, 0.3)' 
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const fileInput = document.getElementById('audio-upload');
        const playlistContainer = document.getElementById('playlist-container');
        const seekBar = document.getElementById('seek-bar');
        const timeDisplay = document.getElementById('time-display');
        const statusText = document.getElementById('status-text');

        let width, height;
        let particles = [];
        
        // Audio State
        let audioCtx;
        let analyser;
        let source; 
        let dataArray;
        let isAudioInitialized = false;
        let isPlaying = false;
        let isGenerative = true;
        
        // Playlist State
        let playlist = [{ name: "Generative Synth Demo", type: "gen" }]; // Track 0 is always generative
        let currentTrackIndex = 0;
        let audioElement = new Audio(); // Reusable audio element for files
        audioElement.crossOrigin = "anonymous";

        // Frequencies
        let bassLevel = 0;
        let trebleLevel = 0;
        
        // Mouse state
        let mouse = { x: null, y: null, active: false, isDown: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- AUDIO ENGINE ---
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512; 
                analyser.smoothingTimeConstant = 0.8;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                // Connect audio element to context
                const trackSource = audioCtx.createMediaElementSource(audioElement);
                trackSource.connect(analyser);
                analyser.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Playlist Logic
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                // Keep generative at 0, remove old user tracks if any
                playlist = [playlist[0]]; 
                
                files.forEach(file => {
                    playlist.push({
                        name: file.name,
                        type: 'file',
                        file: file
                    });
                });
                renderPlaylist();
                // Auto play first user track
                if(playlist.length > 1) playTrack(1);
            }
        });

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = `track ${index === currentTrackIndex ? 'playing' : ''}`;
                div.innerText = `${index + 1}. ${track.name}`;
                div.onclick = () => playTrack(index);
                div.id = `track-${index}`;
                playlistContainer.appendChild(div);
            });
        }

        function playTrack(index) {
            initAudioContext();
            
            // Stop previous generative if running
            if (isGenerative && source && source.stop) {
                source.stop();
                source.disconnect();
            }
            
            // Update UI
            document.getElementById(`track-${currentTrackIndex}`)?.classList.remove('playing');
            currentTrackIndex = index;
            document.getElementById(`track-${currentTrackIndex}`)?.classList.add('playing');

            const track = playlist[index];
            
            if (track.type === 'gen') {
                // Play Generative
                audioElement.pause();
                startGenerativeAudio();
                isGenerative = true;
                seekBar.disabled = true;
            } else {
                // Play File
                isGenerative = false;
                seekBar.disabled = false;
                const fileURL = URL.createObjectURL(track.file);
                audioElement.src = fileURL;
                audioElement.play();
                statusText.innerText = `Playing: ${track.name}`;
                isPlaying = true;
                playPauseBtn.innerText = "PAUSE";
                playPauseBtn.classList.add('active');
            }
        }

        // Generative Logic (Fallback/Default)
        function startGenerativeAudio() {
            isGenerative = true;
            if (source && source.disconnect) source.disconnect();
            
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'sawtooth';
            osc1.frequency.value = 110; 

            const osc2 = audioCtx.createOscillator();
            osc2.type = 'square';
            osc2.frequency.value = 220; 

            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.15;

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(analyser); // Connect to analyser to drive visuals!
            // Note: We don't connect generative to destination in this specific flow 
            // to avoid conflict, but here we do:
            // Actually, we must create a new connection for generative
            // since audioElement is wired separately.
            analyser.connect(audioCtx.destination); 

            osc1.start();
            osc2.start();
            
            source = {
                stop: () => {
                    osc1.stop();
                    osc2.stop();
                },
                disconnect: () => {
                    osc1.disconnect();
                    osc2.disconnect();
                    gainNode.disconnect();
                }
            };
            
            statusText.innerText = "Playing: Generative Synth";
            isPlaying = true;
            playPauseBtn.innerText = "PAUSE";
            playPauseBtn.classList.add('active');
        }

        // Play/Pause Toggle
        playPauseBtn.addEventListener('click', () => {
            initAudioContext();
            
            if (isPlaying) {
                if (isGenerative) {
                    source.stop();
                } else {
                    audioElement.pause();
                }
                isPlaying = false;
                playPauseBtn.innerText = "RESUME";
                playPauseBtn.classList.remove('active');
            } else {
                if (isGenerative) {
                    startGenerativeAudio();
                } else {
                    audioElement.play();
                }
                isPlaying = true;
                playPauseBtn.innerText = "PAUSE";
                playPauseBtn.classList.add('active');
            }
        });

        // Scrubbing & Time Update
        audioElement.addEventListener('timeupdate', () => {
            if (!isGenerative && audioElement.duration) {
                const progress = (audioElement.currentTime / audioElement.duration) * 100;
                seekBar.value = progress;
                
                const curMins = Math.floor(audioElement.currentTime / 60);
                const curSecs = Math.floor(audioElement.currentTime % 60).toString().padStart(2, '0');
                const durMins = Math.floor(audioElement.duration / 60);
                const durSecs = Math.floor(audioElement.duration % 60).toString().padStart(2, '0');
                
                timeDisplay.innerText = `${curMins}:${curSecs} / ${durMins}:${durSecs}`;
            }
        });

        seekBar.addEventListener('input', () => {
            if (!isGenerative && audioElement.duration) {
                const time = (seekBar.value / 100) * audioElement.duration;
                audioElement.currentTime = time;
            }
        });

        // --- INTERACTION ---
        const handleInteraction = (x, y, active, isDown = false) => {
            mouse.x = x;
            mouse.y = y;
            mouse.active = active;
            mouse.isDown = isDown;
        };

        window.addEventListener('mousedown', e => handleInteraction(e.clientX, e.clientY, true, true));
        window.addEventListener('mousemove', e => handleInteraction(e.clientX, e.clientY, true, mouse.isDown));
        window.addEventListener('mouseup', e => handleInteraction(e.clientX, e.clientY, true, false));
        
        window.addEventListener('touchstart', e => handleInteraction(e.touches[0].clientX, e.touches[0].clientY, true, true));
        window.addEventListener('touchmove', e => handleInteraction(e.touches[0].clientX, e.touches[0].clientY, true, true));
        window.addEventListener('touchend', () => handleInteraction(mouse.x, mouse.y, false, false));


        // --- PARTICLES ---
        class Particle {
            constructor(type) {
                this.type = type; 
                this.reset(true); 
            }

            reset(initial = false) {
                if (initial) {
                    if (this.type === 'red') {
                        this.x = Math.random() * (width * 0.4);
                    } else {
                        this.x = (width * 0.6) + Math.random() * (width * 0.4);
                    }
                } else {
                    this.x = Math.random() * width;
                }
                
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                this.baseSize = Math.random() * 2 + 1; 
                this.angle = Math.random() * Math.PI * 2;
                this.speedMod = this.type === 'red' ? 0.04 : 0.03; 
            }

            update(bass, treble) {
                let energy = (this.type === 'red') ? bass : treble;
                
                // EXTREME SENSITIVITY Logic
                // If not playing or silent, base speed is infinitesimal (Standstill)
                const baseSpeed = isPlaying ? 0.005 : 0; 
                const reactionMult = 8.0; // Explosion factor

                // 1. Movement
                if (this.type === 'red') {
                    this.angle += this.speedMod;
                    // Formula: (Tiny Drift) + (Massive Energy Burst)
                    this.vx += (Math.sin(this.angle) * baseSpeed) + ((Math.random()-0.5) * energy * reactionMult);
                    this.vy += (Math.cos(this.angle) * baseSpeed) + ((Math.random()-0.5) * energy * reactionMult);
                } else {
                    this.angle -= this.speedMod;
                    this.vx += (Math.cos(this.angle) * baseSpeed) + ((Math.random()-0.5) * energy * reactionMult);
                    this.vy += (Math.sin(this.angle) * baseSpeed) + ((Math.random()-0.5) * energy * reactionMult);
                }

                // 2. Interaction
                if (mouse.active && mouse.x) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < 500) {
                        const force = (500 - dist) / 500;
                        const angle = Math.atan2(dy, dx);

                        if (mouse.isDown) {
                            // Untie (Repulsion)
                            this.vx -= Math.cos(angle) * force * 2.5;
                            this.vy -= Math.sin(angle) * force * 2.5;
                        } else {
                            // Conduct (Attraction)
                            const pullStrength = 0.8 + (energy * 3); // Pull stronger on beat
                            this.vx += Math.cos(angle) * force * pullStrength;
                            this.vy += Math.sin(angle) * force * pullStrength;
                        }
                    }
                } else {
                    // Standoff Logic
                    if (this.type === 'red' && this.x > width * 0.5) this.vx -= 0.02;
                    if (this.type === 'blue' && this.x < width * 0.5) this.vx += 0.02;
                }

                // Heavy Friction to stop quickly when music stops
                this.vx *= 0.90; 
                this.vy *= 0.90;

                this.x += this.vx;
                this.y += this.vy;

                // Wrap
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw(bass, treble) {
                let energy = (this.type === 'red') ? bass : treble;
                
                ctx.beginPath();
                // Extreme Pulse: Radius expands drastically on beat
                const r = this.baseSize * (1 + energy * 4); 
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                
                if (this.type === 'red') {
                    // Opacity goes from 0.2 (dim) to 1.0 (bright)
                    const alpha = 0.2 + (energy * 0.8);
                    ctx.fillStyle = `rgba(${config.redColor}, ${alpha})`;
                } else {
                    const alpha = 0.2 + (energy * 0.8);
                    ctx.fillStyle = `rgba(${config.blueColor}, ${alpha})`;
                }
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < config.particleCount / 2; i++) particles.push(new Particle('red'));
            for (let i = 0; i < config.particleCount / 2; i++) particles.push(new Particle('blue'));
        }

        function animate() {
            // Analyze Audio
            if (analyser && isPlaying) {
                analyser.getByteFrequencyData(dataArray);
                
                const bufferLength = analyser.frequencyBinCount;
                const splitIndex = Math.floor(bufferLength / 4); 
                
                let bassSum = 0;
                let trebleSum = 0;
                
                for(let i = 0; i < splitIndex; i++) bassSum += dataArray[i];
                for(let i = splitIndex; i < bufferLength; i++) trebleSum += dataArray[i];
                
                bassLevel = (bassSum / splitIndex) / 255; 
                trebleLevel = (trebleSum / (bufferLength - splitIndex)) / 255;
                trebleLevel = Math.min(1, trebleLevel * 3);
            } else {
                // Rapid decay for "Standstill" feel
                bassLevel *= 0.8;
                trebleLevel *= 0.8;
            }

            // Draw Background
            ctx.fillStyle = config.bgFade; 
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                const p1 = particles[i];
                p1.update(bassLevel, trebleLevel);
                p1.draw(bassLevel, trebleLevel);

                // Connections
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const distSq = dx*dx + dy*dy; 
                    
                    if (distSq < 15000) { 
                        const dist = Math.sqrt(distSq);
                        const opacity = 1 - (dist / 122);

                        if (p1.type === p2.type) {
                            ctx.beginPath();
                            ctx.lineWidth = 0.5;
                            const color = p1.type === 'red' ? config.redColor : config.blueColor;
                            const pulse = p1.type === 'red' ? bassLevel : trebleLevel;
                            
                            // Lines vanish when silent (0.1 base), shine when loud
                            ctx.strokeStyle = `rgba(${color}, ${opacity * (0.1 + pulse * 2)})`;
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        } else {
                            if (dist < 60) {
                                ctx.beginPath();
                                ctx.lineWidth = 1 + (bassLevel + trebleLevel) * 2; 
                                ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 2 * (bassLevel+trebleLevel)})`;
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        }
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();

    </script>
</body>
</html>
