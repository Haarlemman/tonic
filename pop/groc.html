<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POPULATION TRACKER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Helvetica:wght@700&family=OCR-A&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0020, #1a0040, #0f0020);
            background-size: 300% 300%;
            animation: glitchPulse 12s infinite;
            font-family: 'Helvetica', sans-serif;
            font-weight: 700;
            font-stretch: condensed;
            color: #ffeb3b;
            overflow: hidden;
            min-height: 100vh;
            position: relative;
            filter: hue-rotate(20deg) saturate(1.5);
        }

        @keyframes glitchPulse {
            0% { background-position: 0% 0%; }
            25% { background-position: 100% 0%; filter: hue-rotate(0deg); }
            50% { background-position: 0% 100%; filter: hue-rotate(40deg); }
            75% { background-position: 100% 100%; filter: hue-rotate(20deg); }
            100% { background-position: 0% 0%; }
        }

        .header {
            position: relative;
            padding: 120px 60px;
            min-height: 700px;
            overflow: visible;
            transform-style: preserve-3d;
            z-index: 1;
        }

        .main-title {
            font-size: clamp(8rem, 20vw, 15rem);
            color: #ffeb3b;
            text-transform: uppercase;
            letter-spacing: -0.1em;
            position: absolute;
            top: 15%;
            left: 5%;
            transform: rotateX(-20deg) translateZ(150px) scale(1.2);
            animation: mirrorFlip 10s infinite alternate;
            text-shadow: 0 0 20px #ff9800, 0 0 40px #f44336;
            z-index: 2;
        }

        @keyframes mirrorFlip {
            0% { transform: rotateX(-20deg) translateZ(150px) scale(1.2); }
            50% { transform: rotateX(20deg) translateZ(-150px) scale(1.2) rotateY(180deg); }
            100% { transform: rotateX(-20deg) translateZ(150px) scale(1.2); }
        }

        .title-part-1 { animation: sway 5s infinite; }
        .title-part-2 { animation: stretch 6s infinite; }
        .title-part-3 { animation: fadeGlitch 4s infinite; }

        @keyframes sway { 50% { transform: translateX(30px); } }
        @keyframes stretch { 50% { transform: scaleY(1.3); } }
        @keyframes fadeGlitch { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        .author-text {
            font-size: clamp(2.5rem, 6vw, 4rem);
            letter-spacing: -0.05em;
            position: absolute;
            top: 3%;
            right: 3%;
            color: #4caf50;
            transform: rotateZ(15deg) skewY(-10deg);
            animation: spiral 18s infinite linear;
            z-index: 2;
        }

        @keyframes spiral {
            0% { transform: rotateZ(15deg) skewY(-10deg) translate(0, 0); }
            100% { transform: rotateZ(375deg) skewY(-10deg) translate(300px, -300px); }
        }

        .year-text {
            font-size: clamp(3rem, 7vw, 5rem);
            letter-spacing: -0.08em;
            position: absolute;
            bottom: 8%;
            left: 15%;
            color: #2196f3;
            transform: rotateZ(-25deg) perspective(600px) translateZ(100px);
            animation: reverseFlow 14s infinite;
            z-index: 2;
        }

        @keyframes reverseFlow {
            0% { transform: rotateZ(-25deg) perspective(600px) translateZ(100px); }
            50% { transform: rotateZ(25deg) perspective(600px) translateZ(-100px); }
            100% { transform: rotateZ(-25deg) perspective(600px) translateZ(100px); }
        }

        .geometric-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .shape-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 152, 0, 0.2);
            clip-path: polygon(0 0, 100% 0, 75% 100%, 0% 75%);
            top: 10%;
            left: 5%;
            animation: expandContract 9s infinite;
            z-index: 1;
        }

        .shape-2 {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(33, 150, 243, 0.2);
            clip-path: circle(50% at 75% 25%);
            bottom: 10%;
            right: 5%;
            animation: rotateReverse 11s infinite linear;
            z-index: 1;
        }

        @keyframes expandContract { 50% { transform: scale(1.2); } }
        @keyframes rotateReverse { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        .random-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .line-1 { position: absolute; width: 4px; height: 400px; background: #4caf50; top: 25%; left: 20%; transform: rotate(35deg); animation: wave 7s infinite; z-index: 1; }
        .line-2 { position: absolute; width: 4px; height: 300px; background: #2196f3; top: 45%; right: 10%; transform: rotate(-40deg); animation: shrinkGrow 8s infinite; z-index: 1; }
        .line-3 { position: absolute; width: 4px; height: 350px; background: #ff9800; bottom: 15%; left: 30%; transform: rotate(50deg); animation: flickerWave 6s infinite; z-index: 1; }

        @keyframes wave { 50% { transform: rotate(35deg) translateY(20px); } }
        @keyframes shrinkGrow { 0%, 100% { height: 300px; } 50% { height: 400px; } }
        @keyframes flickerWave { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px;
            position: relative;
            z-index: 3;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 80px;
            margin-bottom: 150px;
        }

        .primary-section, .secondary-stats, .bottom-grid {
            position: relative;
            transform: translateZ(30px) rotateZ(5deg);
            animation: oscillate 5s infinite alternate;
            z-index: 4;
        }

        @keyframes oscillate {
            0% { transform: translateZ(30px) rotateZ(5deg) translateX(0); }
            100% { transform: translateZ(30px) rotateZ(5deg) translateX(-20px); }
        }

        .primary-counter, .stat-block, .region-card {
            padding: 60px;
            background: rgba(0, 0, 0, 0.7); /* Solid background to ensure visibility */
            border: none;
            border-left: 2px dashed rgba(255, 235, 59, 0.5);
            transition: transform 0.7s ease, filter 0.7s ease;
            z-index: 5;
        }

        .primary-counter:hover, .stat-block:hover, .region-card:hover {
            transform: scale(1.2) rotate(10deg);
            filter: brightness(1.5);
        }

        .primary-label, .stat-label, .region-label {
            font-size: clamp(2.5rem, 6vw, 4rem);
            color: #ffeb3b;
            text-transform: uppercase;
            letter-spacing: -0.1em;
            position: absolute;
            top: -40px;
            left: 40px;
            transform: rotate(-30deg);
            animation: bounce 3s infinite;
            z-index: 5;
        }

        @keyframes bounce {
            0%, 100% { transform: rotate(-30deg) translateY(0); }
            50% { transform: rotate(-30deg) translateY(-10px); }
        }

        .primary-count, .stat-count, .region-count {
            font-family: 'OCR-A', monospace;
            font-size: clamp(5rem, 12vw, 8rem); /* Increased further for visibility */
            color: #00bcd4;
            text-shadow: 0 0 20px #00bcd4, 0 0 40px #00bcd4; /* Stronger glow */
            margin-top: 70px; /* Increased to avoid overlap */
            position: relative;
            z-index: 10; /* Highest z-index */
            opacity: 1;
            display: block;
            text-align: center;
            background: rgba(255, 255, 255, 0.1); /* Slight background to help readability */
            padding: 10px;
            border-radius: 5px;
        }

        @keyframes scan {
            0% { text-shadow: 0 0 0 #00bcd4; }
            50% { text-shadow: 0 0 10px #00bcd4, 0 0 20px #00bcd4; }
            100% { text-shadow: 0 0 0 #00bcd4; }
        }

        .primary-rate, .stat-rate, .region-rate {
            display: none;
        }

        .europe { color: #3f51b5; }
        .uk { color: #9c27b0; }
        .netherlands { color: #ff5722; }
        .haarlem { color: #4caf50; }

        @media (max-width: 1024px) {
            .main-title { font-size: clamp(5rem, 12vw, 8rem); }
            .header { padding: 80px 40px; min-height: 500px; }
            .primary-count, .stat-count, .region-count { font-size: clamp(4rem, 10vw, 6rem); }
        }

        @media (max-width: 768px) {
            .main-title { font-size: clamp(3rem, 10vw, 5rem); }
            .container { padding: 40px; }
            .stats-grid, .bottom-grid { grid-template-columns: 1fr; }
            .primary-count, .stat-count, .region-count { font-size: clamp(3.5rem, 9vw, 5rem); margin-top: 50px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="author-text">Live Statistics</div>
        <div class="main-title">
            <span class="title-part-1">POPU</span>
            <span class="title-part-2">LATI</span>
            <span class="title-part-3">ON</span>
        </div>
        <div class="year-text">2025</div>
        <div class="geometric-shapes">
            <div class="shape-1"></div>
            <div class="shape-2"></div>
        </div>
        <div class="random-lines">
            <div class="line-1"></div>
            <div class="line-2"></div>
            <div class="line-3"></div>
        </div>
    </div>
    
    <div class="container">
        <div class="stats-grid">
            <div class="primary-section">
                <div class="primary-label">Global</div>
                <div class="primary-counter">
                    <div class="primary-count" id="global-count">8,118,835,421</div>
                    <div class="primary-rate"></div>
                </div>
            </div>
            
            <div class="secondary-stats">
                <div class="stat-block europe">
                    <div class="stat-label">Europe</div>
                    <div class="stat-count" id="europe-count">748,935,267</div>
                    <div class="stat-rate"></div>
                </div>
                
                <div class="stat-block uk">
                    <div class="stat-label">United Kingdom</div>
                    <div class="stat-count" id="uk-count">67,886,011</div>
                    <div class="stat-rate"></div>
                </div>
            </div>
        </div>
        
        <div class="bottom-grid">
            <div class="region-card netherlands">
                <div class="region-label">Netherlands</div>
                <div class="region-count" id="netherlands-count">17,564,014</div>
                <div class="region-rate"></div>
            </div>
            
            <div class="region-card haarlem">
                <div class="region-label">Haarlem</div>
                <div class="region-count" id="haarlem-count">162,543</div>
                <div class="region-rate"></div>
            </div>
        </div>
    </div>
    
    <script>
        const populations = {
            global: { count: 8118835421, rate: 2.3 },
            europe: { count: 748935267, rate: 0.08 },
            uk: { count: 67886011, rate: 0.02 },
            netherlands: { count: 17564014, rate: 0.004 },
            haarlem: { count: 162543, rate: 0.0003 }
        };
        
        function formatNumber(num) {
            return num.toLocaleString();
        }
        
        function updateCounters() {
            Object.keys(populations).forEach(region => {
                const data = populations[region];
                data.count += data.rate;
                const element = document.getElementById(`${region}-count`);
                if (element) {
                    element.textContent = formatNumber(Math.floor(data.count));
                    console.log(`Updating ${region}: ${element.textContent}`); // Debug log
                }
            });
        }
        
        setInterval(updateCounters, 1000);
        
        Object.keys(populations).forEach(region => {
            const element = document.getElementById(`${region}-count`);
            if (element) {
                element.textContent = formatNumber(Math.floor(populations[region].count));
                console.log(`Initial ${region}: ${element.textContent}`); // Debug log
            }
        });
    </script>
</body>
</html>
