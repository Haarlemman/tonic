<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POPULATION TRACKER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bauhaus+93&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f3f0;
            font-family: 'Roboto', sans-serif;
            color: #1a1a1a;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 0%, transparent 48%, #1a1a1a 48%, #1a1a1a 52%, transparent 52%);
            z-index: 0;
            pointer-events: none;
        }
        
        .header {
            background: transparent;
            padding: 80px 40px 60px;
            position: relative;
            z-index: 2;
            overflow: hidden;
            min-height: 400px;
        }
        
        .main-title {
            font-family: 'Bauhaus 93', sans-serif;
            font-size: 8rem;
            font-weight: normal;
            color: #1a1a1a;
            text-transform: uppercase;
            line-height: 0.8;
            position: absolute;
            top: 120px;
            left: 100px;
            transform: rotate(-45deg);
            transform-origin: left bottom;
            z-index: 3;
        }
        
        .title-part-1 {
            display: block;
            background: #ffff00;
            padding: 20px 40px;
            margin-bottom: 10px;
        }
        
        .title-part-2 {
            display: block;
            background: #ff4500;
            padding: 20px 40px;
            margin-bottom: 10px;
        }
        
        .title-part-3 {
            display: block;
            background: #e74c3c;
            padding: 20px 40px;
        }
        
        .author-text {
            font-family: 'Bauhaus 93', sans-serif;
            font-size: 1.5rem;
            position: absolute;
            top: 80px;
            left: 80px;
            transform: rotate(-45deg);
            transform-origin: left bottom;
            z-index: 4;
        }
        
        .year-text {
            font-family: 'Bauhaus 93', sans-serif;
            font-size: 2rem;
            position: absolute;
            bottom: 100px;
            right: 150px;
            transform: rotate(-45deg);
            transform-origin: right bottom;
            z-index: 4;
        }
        
        .geometric-triangle {
            position: absolute;
            top: 100px;
            right: 100px;
            width: 0;
            height: 0;
            border-left: 80px solid transparent;
            border-right: 80px solid transparent;
            border-bottom: 120px solid #3498db;
            z-index: 3;
        }
        
        .geometric-triangle::after {
            content: '';
            position: absolute;
            top: 20px;
            left: -40px;
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 60px solid #1a1a1a;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
            position: relative;
            z-index: 2;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 60px;
            margin-bottom: 80px;
        }
        
        .primary-section {

            position: relative;
        }
        
        .primary-counter {
            background: #1a1a1a;
            padding: 60px;
            position: relative;
            overflow: hidden;
            transform: rotate(-2deg);
            margin-top: 40px;
        }
        
        .primary-counter::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(45deg, #ff4500 0%, #e74c3c 100%);
            clip-path: polygon(0 0, 100% 0, 70% 100%, 0% 100%);
        }
        
        .primary-label {
            font-family: 'Bauhaus 93', sans-serif;
            font-size: 2.5rem;
            color: #ffffff;
            text-transform: uppercase;
            position: absolute;
            top: -50px;
            left: 0;
            transform: rotate(-8deg);
            transform-origin: left bottom;
            z-index: 4;
            background: #ffff00;
            color: #1a1a1a;
            padding: 15px 30px;
        }
        
        .primary-count {
            font-size: 4rem;
            font-weight: 900;
            color: #ffffff;
            position: relative;
            z-index: 2;
            margin-top: 40px;
        }
        
        .primary-rate {
            font-size: 1.2rem;
            color: #cccccc;
            margin-top: 20px;
            position: relative;
            z-index: 2;
        }
        
        .secondary-stats {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .stat-block {
            background: #ffffff;
            padding: 40px;
            position: relative;
            overflow: hidden;
            transform: rotate(1deg);
        }
        
        .stat-block:nth-child(2) {
            transform: rotate(-1deg);
        }
        
        .stat-block::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 100%;
            background: currentColor;
            opacity: 0.8;
        }
        
        .stat-label {
            font-family: 'Bauhaus 93', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            transform: rotate(-3deg);
            transform-origin: left bottom;
            display: inline-block;
        }
        
        .stat-count {
            font-size: 2.2rem;
            font-weight: 900;
            position: relative;
            z-index: 2;
        }
        
        .stat-rate {
            font-size: 0.9rem;
            margin-top: 10px;
            opacity: 0.7;
            position: relative;
            z-index: 2;
        }
        
        .bottom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            margin-top: 60px;
        }
        
        .region-card {
            background: #ffffff;
            padding: 50px;
            position: relative;
            overflow: hidden;
            transform: rotate(-1deg);
        }
        
        .region-card:nth-child(2) {
            transform: rotate(1deg);
        }
        
        .region-card::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: currentColor;
            opacity: 0.1;
            clip-path: polygon(0 100%, 100% 100%, 80% 0%, 0% 0%);
        }
        
        .region-label {
            font-family: 'Bauhaus 93', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            margin-bottom: 20px;
            transform: rotate(-5deg);
            transform-origin: left bottom;
            display: inline-block;
            position: relative;
            z-index: 2;
        }
        
        .region-count {
            font-size: 2.8rem;
            font-weight: 900;
            position: relative;
            z-index: 2;
            margin-bottom: 15px;
        }
        
        .region-rate {
            font-size: 1rem;
            opacity: 0.7;
            position: relative;
            z-index: 2;
        }
        
        .europe { color: #3498db; }
        .uk { color: #9b59b6; }
        .netherlands { color: #e67e22; }
        .haarlem { color: #27ae60; }
        
        @media (max-width: 1024px) {
            .main-title {
                font-size: 6rem;
                top: 100px;
                left: 60px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }
        
        @media (max-width: 768px) {
            .main-title {
                font-size: 4rem;
                top: 80px;
                left: 40px;
            }
            
            .container {
                padding: 20px;
            }
            
            .primary-counter {
                padding: 40px;
            }
            
            .primary-count {
                font-size: 2.8rem;
            }
            
            .bottom-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="author-text">Live Statistics</div>
        <div class="main-title">
            <span class="title-part-1">POPU</span>
            <span class="title-part-2">LATI</span>
            <span class="title-part-3">ON</span>
        </div>
        <div class="year-text">2025</div>
        <div class="geometric-triangle"></div>
    </div>
    
    <div class="container">
        <div class="stats-grid">
            <div class="primary-section">
                <div class="primary-label">Global</div>
                <div class="primary-counter">
                    <div class="primary-count" id="global-count">8,118,835,421</div>
                    <div class="primary-rate">+2.3 people per second</div>
                </div>
            </div>
            
            <div class="secondary-stats">
                <div class="stat-block europe">
                    <div class="stat-label">Europe</div>
                    <div class="stat-count" id="europe-count">748,935,267</div>
                    <div class="stat-rate">+0.08 per second</div>
                </div>
                
                <div class="stat-block uk">
                    <div class="stat-label">United Kingdom</div>
                    <div class="stat-count" id="uk-count">67,886,011</div>
                    <div class="stat-rate">+0.02 per second</div>
                </div>
            </div>
        </div>
        
        <div class="bottom-grid">
            <div class="region-card netherlands">
                <div class="region-label">Netherlands</div>
                <div class="region-count" id="netherlands-count">17,564,014</div>
                <div class="region-rate">+0.004 people per second</div>
            </div>
            
            <div class="region-card haarlem">
                <div class="region-label">Haarlem</div>
                <div class="region-count" id="haarlem-count">162,543</div>
                <div class="region-rate">+0.0003 people per second</div>
            </div>
        </div>
    </div>
    
    <script>
        // Population data with growth rates (people per second)
        const populations = {
            global: { count: 8118835421, rate: 2.3 },
            europe: { count: 748935267, rate: 0.08 },
            uk: { count: 67886011, rate: 0.02 },
            netherlands: { count: 17564014, rate: 0.004 },
            haarlem: { count: 162543, rate: 0.0003 }
        };
        
        function formatNumber(num) {

            return num.toLocaleString();
        }
        
        function updateCounters() {
            Object.keys(populations).forEach(region => {
                const data = populations[region];
                data.count += data.rate;
                
                const element = document.getElementById(`${region}-count`);
                if (element) {
                    element.textContent = formatNumber(Math.floor(data.count));
                }
            });
        }
        
        // Update counters every second
        setInterval(updateCounters, 1000);
        
        // Initial formatting
        Object.keys(populations).forEach(region => {
            const element = document.getElementById(`${region}-count`);
            if (element) {
                element.textContent = formatNumber(Math.floor(populations[region].count));
            }
        });
        
        // Subtle interactions
        document.addEventListener('DOMContentLoaded', function() {
            const counters = document.querySelectorAll('.primary-count, .stat-count, .region-count');
            
            counters.forEach(counter => {
                counter.addEventListener('mouseover', function() {
                    this.style.transform = 'scale(1.05)';
                    this.style.transition = 'transform 0.3s ease';
                });
                
                counter.addEventListener('mouseout', function() {
                    this.style.transform = 'scale(1)';
                });
            });
        });
    </script>
</body>
</html>
