<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The University of Free Will</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --neon-red: #ff3131;
            --neon-blue: #00f2ff;
            --neon-yellow: #f4ea16;
            --bg-dark: #050505;
            --panel-bg: rgba(10, 10, 10, 0.85);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Intro Overlay */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1.5s ease;
        }

        #intro-text {
            width: 80%;
            max-width: 600px;
            font-size: 1.2rem;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 40px;
            min-height: 100px;
        }

        .intro-btns {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 3s ease, transform 3s ease;
        }

        .intro-btns.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .action-btn {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 10px 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: white;
            color: black;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        /* HUD Layer */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #hud-layer.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .brand-box h1 {
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
            border-left: 3px solid var(--neon-red);
            padding-left: 15px;
            line-height: 1.1;
        }

        .sub-brand {
            font-size: 0.6rem;
            letter-spacing: 3px;
            margin-top: 5px;
            padding-left: 15px;
            color: #888;
        }

        .status-box {
            display: flex;
            gap: 10px;
        }

        .hud-btn {
            background: var(--panel-bg);
            border: 1px solid #333;
            color: #eee;
            padding: 5px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            pointer-events: auto;
        }

        /* Menu */
        #general-menu {
            position: absolute;
            top: 60px;
            right: 20px;
            background: var(--panel-bg);
            border: 1px solid #333;
            width: 150px;
            display: none;
            flex-direction: column;
            pointer-events: auto;
        }

        .menu-link {
            padding: 8px;
            font-size: 0.7rem;
            color: #bbb;
            text-decoration: none;
            border-bottom: 1px solid #222;
        }

        .menu-link:hover {
            background: #222;
            color: white;
        }

        /* Faculty Screen */
        #faculty-screen {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            padding: 15px;
            text-align: center;
            z-index: 5;
            display: none;
        }

        .neon-text {
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .screen-sub {
            font-size: 0.5rem;
            color: #666;
            letter-spacing: 2px;
        }

        /* Control Boxes */
        .controls-box, .directory-box {
            background: var(--panel-bg);
            padding: 10px;
            border: 1px solid #333;
            pointer-events: auto;
        }

        .control-row {
            font-size: 0.6rem;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 4px;
        }

        .key { color: #666; }

        .building-tag {
            display: inline-block;
            font-size: 0.6rem;
            padding: 4px 8px;
            margin-left: 5px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tag-red { border-color: var(--neon-red); color: var(--neon-red); }
        .tag-blue { border-color: var(--neon-blue); color: var(--neon-blue); }
        .tag-yellow { border-color: var(--neon-yellow); color: var(--neon-yellow); }

        #tooltip {
            position: fixed;
            background: black;
            padding: 5px 10px;
            font-size: 0.7rem;
            border: 1px solid #444;
            display: none;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>

<body>

    <audio id="bg-music" loop crossorigin="anonymous">
        <!-- Replace with actual URL or local file -->
        <source src="assets/audio/MysteriousHeartbeat1.mp3" type="assets/audio/mpeg">
    </audio>

    <div id="intro-overlay">
        <div id="intro-text"></div>
        <div class="intro-btns" id="intro-btn-container">
            <button id="skip-btn" class="action-btn">Learn</button>
        </div>
    </div>

    <div id="faculty-screen">
        <div id="screen-content" class="neon-text">STANDBY...</div>
        <div class="screen-sub">FACULTY DATA FEED</div>
    </div>

    <div id="hud-layer">
        <div style="display:flex; justify-content:space-between; align-items: flex-start;">
            <div class="brand-box">
                <h1>University<br>of Free Will</h1>
                <div class="sub-brand">ADVERSITY IS YOUR TEACHER</div>
            </div>
            <div class="status-box">
                <button class="hud-btn" onclick="toggleMusic()" id="music-toggle">Audio: Off</button>
                <button class="hud-btn" onclick="toggleMenu()">Menu</button>
            </div>
            <div id="general-menu">
                <div style="color:white; font-size:0.5rem; padding:8px; border-bottom:1px solid #333; margin-bottom:5px;">CAMPUS DIRECTORY</div>
                <a href="#" class="menu-link" onclick="showInfo('Desk')">Info Desk</a>
                <a href="#" class="menu-link" onclick="showInfo('Art')">Artistic Core</a>
                <a href="#" class="menu-link" onclick="showInfo('Science')">Scientific Method</a>
                <a href="#" class="menu-link" onclick="showInfo('Spirit')">Spiritual Path</a>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
            <div class="controls-box">
                <div style="border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:8px; padding-bottom:4px; color:#888; font-weight:bold; font-size:0.5rem;">AUDIO-KINETIC FEED</div>
                <div class="control-row"><span class="key">BEAT SYNC</span> <span>ACTIVE</span></div>
                <div class="control-row"><span class="key">AUTO-TOUR</span> <span>ENGAGED</span></div>
                <div class="control-row"><span class="key">ORBITING</span> <span>L-DRAG</span></div>
            </div>

            <div class="directory-box">
                <div class="building-tag tag-red" onclick="focusBuilding('art')">Beauty</div>
                <div class="building-tag tag-blue" onclick="focusBuilding('science')">Knowledge</div>
                <div class="building-tag tag-yellow" onclick="focusBuilding('spirit')">Wisdom</div>
            </div>
        </div>
    </div>

    <div id="tooltip"></div>
    <div id="canvas-container"></div>

    <script>
        // --- CONSTANTS & STATE ---
        const introLines = [
            "Life is complicated, full of surprises, twists and turns.",
            "But within a framework, there is still control.",
            "The more you learn, the more you realise you know nothing.",
            "Welcome to the paradox of Free Will."
        ];
        let audioStarted = false;

        // --- DOM ELEMENTS ---
        const introTextEl = document.getElementById('intro-text');
        const introBtnContainer = document.getElementById('intro-btn-container');
        const skipBtn = document.getElementById('skip-btn');
        const introOverlay = document.getElementById('intro-overlay');
        const hudLayer = document.getElementById('hud-layer');
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        const menu = document.getElementById('general-menu');

        // --- TYPEWRITER & ANIMATION ---
        async function runIntro() {
            // Start fading in the button slightly after the text begins
            setTimeout(() => {
                introBtnContainer.classList.add('visible');
            }, 2000);

            for (let line of introLines) {
                introTextEl.innerHTML = "";
                for (let char of line) {
                    introTextEl.innerHTML += char;
                    await new Promise(r => setTimeout(r, 40));
                }
                await new Promise(r => setTimeout(r, 1500));
            }
            
            // Auto-transition if they haven't clicked
            if (introOverlay.style.display !== 'none') {
                // Keep it visible until user interacts
            }
        }

        skipBtn.addEventListener('click', () => {
            introOverlay.style.opacity = '0';
            setTimeout(() => {
                introOverlay.style.display = 'none';
                hudLayer.classList.add('visible');
                document.getElementById('faculty-screen').style.display = 'block';
                startAudio();
            }, 1500);
        });

        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play();
                musicToggle.innerText = "Audio: On";
            } else {
                bgMusic.pause();
                musicToggle.innerText = "Audio: Off";
            }
        }

        function startAudio() {
            if (!audioStarted) {
                bgMusic.play().catch(e => console.log("Audio block: Needs interaction"));
                musicToggle.innerText = "Audio: On";
                audioStarted = true;
            }
        }

        function toggleMenu() {
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function showInfo(topic) {
            const content = document.getElementById('screen-content');
            content.innerText = `ACCESSING ${topic.toUpperCase()}...`;
            toggleMenu();
        }

        // --- THREE.JS ENGINE ---
        let scene, camera, renderer, controls, cubes = [];

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            // Objects (The "Buildings")
            createBuilding(0, 0, 0, 0x00f2ff, "Core");
            createBuilding(-5, 3, -2, varColor('--neon-red'), "Beauty");
            createBuilding(5, -2, 3, varColor('--neon-blue'), "Knowledge");
            createBuilding(2, 6, -5, varColor('--neon-yellow'), "Wisdom");

            animate();
        }

        function varColor(cssVar) {
            const val = getComputedStyle(document.documentElement).getPropertyValue(cssVar).trim();
            return new THREE.Color(val);
        }

        function createBuilding(x, y, z, color, label) {
            const geo = new THREE.BoxGeometry(2, 2, 2);
            const mat = new THREE.MeshPhongMaterial({ 
                color: color, 
                wireframe: true,
                emissive: color,
                emissiveIntensity: 0.5
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.userData = { label: label };
            scene.add(mesh);
            cubes.push(mesh);
        }

        function focusBuilding(type) {
            const colors = { art: '--neon-red', science: '--neon-blue', spirit: '--neon-yellow' };
            const content = document.getElementById('screen-content');
            content.style.color = getComputedStyle(document.documentElement).getPropertyValue(colors[type]);
            content.innerText = `SCANNING ${type.toUpperCase()}... COMPLETE.`;
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            cubes.forEach(c => {
                c.rotation.x += 0.005;
                c.rotation.y += 0.01;
            });
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- STARTUP ---
        window.onload = () => {
            initThree();
            runIntro();
        };
    </script>
</body>

</html>
