<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The University of Free Will | City of Life Expansion Suite</title>

    <!-- Tailwind CSS Production CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ==========================================================================
           1. COMPREHENSIVE DESIGN SYSTEM & TYPOGRAPHIC BASE
           ========================================================================== */
        h1, h2, h3, h4, h5, h6 {
            margin: 0;
            padding: 0;
            text-rendering: optimizeLegibility;
        }

        :root {
            --ink-primary: #0a0f1d;
            --ink-surface: #111827;
            --accent-art: #ff3300;     /* Body / Literature, Painting, Music[cite: 1] */
            --accent-science: #ffcc00; /* Mind / Physics, Maths, Astronomy[cite: 1] */
            --accent-soul: #0033cc;    /* Religion / Faith, Meaning, Solace[cite: 1] */
            --slate-canvas: #0f172a;
        }

        *, ::before, ::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--slate-canvas);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
            opacity: 1;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* ==========================================================================
           2. CINEMATIC OVERLAYS & INTRODUCTORY SEQUENCING MODULES
           ========================================================================== */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.92) 0%, rgba(10, 15, 29, 0.98) 100%);
            backdrop-filter: blur(16px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 2rem;
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.8s;
        }

        #intro-text-container {
            max-width: 720px;
            margin-bottom: 3rem;
        }

        #intro-text {
            font-size: 1.75rem;
            font-weight: 300;
            line-height: 1.6;
            letter-spacing: 0.025em;
            font-style: italic;
            color: #e2e8f0;
            transition: opacity 0.8s ease-in-out;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 1.15rem 3.5rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        .action-btn:hover {
            background: #ffffff;
            color: #0f172a;
            border-color: #ffffff;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.15);
        }

        /* ==========================================================================
           3. DYNAMIC FACULTY HUD & FLOATING DATA FEEDS
           ========================================================================== */
        #faculty-screen {
            position: absolute;
            width: 300px;
            background: rgba(10, 15, 29, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 1.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
            z-index: 800;
            opacity: 0;
            transition: opacity 0.4s ease;
            text-align: center;
            transform: translate(-50%, -125%);
            border-radius: 6px;
        }

        #faculty-screen.active {
            display: flex;
            opacity: 1;
        }

        .neon-text {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            line-height: 1.4;
            min-height: 3.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
        }

        .neon-art { 
            color: var(--accent-art); 
            text-shadow: 0 0 12px rgba(255, 51, 0, 0.6); 
        }
        .neon-science { 
            color: var(--accent-science); 
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.6); 
        }
        .neon-spirit { 
            color: #60a5fa; 
            text-shadow: 0 0 12px rgba(96, 165, 250, 0.6); 
        }

        .screen-sub {
            color: #94a3b8;
            font-size: 0.55rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 0.5rem;
        }

        /* ==========================================================================
           4. HEADS-UP DISPLAY (HUD) LAYER & CONTROLS INTERFACE
           ========================================================================== */
        #hud-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem;
            box-sizing: border-box;
            z-index: 500;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .top-right-controls {
            position: absolute;
            top: 2.5rem;
            right: 2.5rem;
            display: flex;
            gap: 1rem;
            pointer-events: auto;
        }

        .icon-btn {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }

        .icon-btn:hover {
            background: white;
            color: #0f172a;
            border-color: white;
            transform: scale(1.08);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        #tri-truth-badge {
            position: absolute;
            top: 2.2rem;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #tri-words {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 0.65rem 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: opacity 0.6s ease;
        }

        .tri-w-red { color: var(--accent-art); }
        .tri-w-blue { color: var(--accent-science); }
        .tri-w-yellow { color: #60a5fa; }
        .tri-sep { color: rgba(255, 255, 255, 0.3); }

        .bottom-nav {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1.25rem;
            pointer-events: auto;
        }

        .building-tag {
            cursor: pointer;
            padding: 0.85rem 1.75rem;
            background: rgba(15, 23, 42, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .building-tag:hover {
            background: white;
            color: #0f172a;
            border-color: white;
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.15);
        }

        .tag-red { border-bottom: 4px solid var(--accent-art); }
        .tag-yellow { border-bottom: 4px solid var(--accent-science); }
        .tag-blue { border-bottom: 4px solid #3b82f6; }

        #tooltip {
            position: absolute;
            padding: 0.5rem 0.85rem;
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            pointer-events: none;
            display: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            z-index: 900;
            transform: translate(-50%, -130%);
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <!-- Cinematic Introductory Overlay -->
    <div id="intro-overlay">
        <div id="intro-text-container">
            <div id="intro-text">Initializing the City of Life...</div>
        </div>
        <button id="skip-btn" class="action-btn">Enter Campus</button>
    </div>

    <!-- Interactive Floating Faculty HUD Screen -->
    <div id="faculty-screen">
        <div id="screen-content" class="neon-text"></div>
        <div class="screen-sub">FACULTY DATA FEED</div>
    </div>

    <!-- HUD Layout Frame -->
    <div id="hud-layer">
        <div id="tri-truth-badge">
            <div id="tri-words"></div>
        </div>

        <div class="top-right-controls">
            <button class="icon-btn" onclick="toggleFullScreen()" title="Toggle Fullscreen">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                </svg>
            </button>
        </div>

        <div class="bottom-nav">
            <div class="building-tag tag-red" onclick="focusBuilding('art')">Faculty of Art</div>
            <div class="building-tag tag-yellow" onclick="focusBuilding('science')">Faculty of Science</div>
            <div class="building-tag tag-blue" onclick="focusBuilding('spirit')">Faculty of Religion</div>
        </div>
    </div>

    <div id="tooltip"></div>
    <div id="canvas-container"></div>

    <!-- External Script Dependencies: Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        /* ==========================================================================
           5. THREE.JS CAMPUS SIMULATION & CORE ARCHITECTURAL ENGINE
           ========================================================================== */
        let scene, camera, renderer, raycaster, mouse, controls;
        let specialBlocks = [];
        let leaderLines = [];
        let triTriangleLine;

        let introActive = true;
        let cinematicTarget = null;
        let lastZoomTime = 0;
        let lastQuoteTime = 0;
        const ZOOM_INTERVAL = 13000;
        const QUOTE_INTERVAL = 3200;

        const tooltip = document.getElementById('tooltip');
        const introTextEl = document.getElementById('intro-text');
        const skipBtn = document.getElementById('skip-btn');
        const hudLayer = document.getElementById('hud-layer');
        const facultyScreen = document.getElementById('faculty-screen');
        const screenContent = document.getElementById('screen-content');

        // Faculty Data Feed Configuration Mapping to Body-Mind-Soul Categories
        const facultyData = {
            art: {
                quotes: [
                    "LITERATURE, PAINTING, MUSIC", 
                    "BEAUTY IS SUBJECTIVE TRUTH", 
                    "SENSES & SENSORY EXPERIENCE", 
                    "THE CANVAS BLEEDS EXPRESSION"
                ],
                class: "neon-art"
            },
            science: {
                quotes: [
                    "PHYSICS, MATHS, ASTRONOMY", 
                    "EMPIRICAL REASON & KNOWLEDGE", 
                    "OBJECTIVE ORDER & FACTS", 
                    "THE LAWS OF THE HUMAN BRAIN"
                ],
                class: "neon-science"
            },
            spirit: {
                quotes: [
                    "PRIESTHOOD & SACRED MYSTERY", 
                    "FAITH, MEANING & SOLACE", 
                    "THE UNIVERSAL HORIZON", 
                    "ENLIGHTENMENT THROUGH UNITY"
                ],
                class: "neon-spirit"
            }
        };

        // Triad Truth Systems Matrix
        const triTruths = [
            ["ART", "SCIENCE", "RELIGION"],
            ["BODY", "MIND", "SOUL"],
            ["BEAUTY", "REASON", "WISDOM"],
            ["SUBJECTIVE", "OBJECTIVE", "UNIVERSAL"],
            ["HAPPINESS", "ORDER", "HOPE"]
        ];
        let triTruthIndex = 0;
        const triWordsEl = document.getElementById('tri-words');

        function cycleTriTruth() {
            if (!triWordsEl) return;
            triWordsEl.style.opacity = 0;
            setTimeout(() => {
                const t = triTruths[triTruthIndex];
                triWordsEl.innerHTML =
                    `<span class="tri-w-red">${t[0]}</span><span class="tri-sep">&middot;</span>` +
                    `<span class="tri-w-blue">${t[1]}</span><span class="tri-sep">&middot;</span>` +
                    `<span class="tri-w-yellow">${t[2]}</span>`;
                triWordsEl.style.opacity = 1;
                triTruthIndex = (triTruthIndex + 1) % triTruths.length;
            }, 600);
        }

        const introQuotes = [
            "Welcome to the City of Life.",
            "The University of Hope and the Faculties of Free Will.",
            "Explore where Body, Mind, and Soul converge.",
            "Where Art, Science, and Religion structure reality."
        ];

        window.onload = function () {
            initScene();
            animateScene();
            runIntroSequence();
            cycleTriTruth();
            setInterval(cycleTriTruth, 5000);
            skipBtn.onclick = (e) => { e.stopPropagation(); startExperience(); };
        };

        async function runIntroSequence() {
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.75;
            for (let quote of introQuotes) {
                introTextEl.style.opacity = 0;
                await new Promise(r => setTimeout(r, 700));
                introTextEl.innerText = quote;
                introTextEl.style.opacity = 1;
                await new Promise(r => setTimeout(r, 3200));
            }
        }

        function startExperience() {
            introActive = false;
            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                hudLayer.style.opacity = 1;
                lastZoomTime = Date.now();
            }, 1000);
        }

        function focusBuilding(type) {
            const b = specialBlocks.find(b => b.userData.type === type);
            if (b) {
                cinematicTarget = b;
                lastZoomTime = Date.now();
                lastQuoteTime = Date.now();
                updateFacultyScreen(type);
                facultyScreen.classList.add('active');
            }
        }

        function updateFacultyScreen(type) {
            const data = facultyData[type];
            if (!data) return;
            screenContent.className = 'neon-text ' + data.class;
            const randomQuote = data.quotes[Math.floor(Math.random() * data.quotes.length)];
            screenContent.innerText = randomQuote;
        }

        function createTextSprite(text, color = "#ffffff") {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024; 
            canvas.height = 256;
            ctx.fillStyle = 'rgba(10, 15, 29, 0.85)';
            ctx.fillRect(180, 48, 664, 160);
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'middle'; 
            ctx.fillStyle = color;
            ctx.font = 'Bold 42px Inter, Arial, sans-serif'; 
            ctx.fillText(text, 512, 128);
            
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
            sprite.scale.set(7.5, 1.85, 1);
            return sprite;
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 45, 160);

            const container = document.getElementById('canvas-container');
            const aspect = container.clientWidth / container.clientHeight;
            const d = 16;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(40, 40, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);
            
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.25);
            sunLight.position.set(35, 65, 25);
            sunLight.castShadow = true;
            scene.add(sunLight);

            buildCampusEnvironment();

            window.addEventListener('resize', () => {
                const asp = container.clientWidth / container.clientHeight;
                camera.left = -d * asp; 
                camera.right = d * asp;
                camera.top = d; 
                camera.bottom = -d;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            window.addEventListener('mousemove', onMouseMove, false);
        }

        function buildCampusEnvironment() {
            const SPACING = 1.6;
            const GRID = 12;
            const centerOffset = (GRID * SPACING) / 2;

            const materials = {
                campus: new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 }),
                artBuilding: new THREE.MeshStandardMaterial({ color: 0xff3300, roughness: 0.3 }),
                scienceBuilding: new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.3, emissive: 0x665200 }),
                spiritBuilding: new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, emissive: 0x001a66 }),
                dottedLine: new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.2, gapSize: 0.2, transparent: true, opacity: 0.6 })
            };

            for (let x = 0; x < GRID; x++) {
                for (let z = 0; z < GRID; z++) {
                    let mesh, type = "campus", labelText = "", labelY = 0;

                    if (x === 4 && z === 4) {
                        type = "art"; 
                        labelText = "FACULTY OF ART"; 
                        labelY = 8.5;
                        const g = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.BoxGeometry(2.2, 6.5, 2.2), materials.artBuilding);
                        core.position.y = 3.25; 
                        g.add(core);
                        mesh = g;
                    } else if (x === 8 && z === 4) {
                        type = "science"; 
                        labelText = "FACULTY OF SCIENCE"; 
                        labelY = 8.5;
                        const g = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.6, 5.5, 6), materials.scienceBuilding);
                        core.position.y = 2.75; 
                        g.add(core);
                        mesh = g;
                    } else if (x === 6 && z === 8) {
                        type = "spirit"; 
                        labelText = "FACULTY OF RELIGION"; 
                        labelY = 9.5;
                        const g = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.ConeGeometry(1.6, 7.5, 4), materials.spiritBuilding);
                        core.position.y = 3.75; 
                        g.add(core);
                        mesh = g;
                    } else {
                        let h = 0.5 + Math.random() * 3.2;
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), materials.campus);
                        mesh.scale.set(1, h, 1);
                        mesh.position.y = h / 2;
                    }

                    mesh.position.x = x * SPACING - centerOffset;
                    mesh.position.z = z * SPACING - centerOffset;
                    mesh.userData = { type, label: labelText || type };
                    scene.add(mesh);

                    if (type !== "campus") {
                        specialBlocks.push(mesh);
                        const label = createTextSprite(labelText);
                        label.position.set(mesh.position.x, labelY, mesh.position.z);
                        scene.add(label);
                        
                        const linePts = [
                            new THREE.Vector3(mesh.position.x, 2.5, mesh.position.z), 
                            new THREE.Vector3(label.position.x, label.position.y - 0.9, label.position.z)
                        ];
                        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(linePts), materials.dottedLine.clone());
                        line.computeLineDistances();
                        scene.add(line);
                        leaderLines.push(line);
                    }
                }
            }

            // Campus Ground Floor Plane
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(90, 90), 
                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Ground Geometrical Truth Triangle Linking the Three Faculties
            if (specialBlocks.length === 3) {
                const triPts = specialBlocks.map(b => new THREE.Vector3(b.position.x, 0.08, b.position.z));
                triPts.push(triPts[0].clone());
                const triGeom = new THREE.BufferGeometry().setFromPoints(triPts);
                triTriangleLine = new THREE.Line(
                    triGeom, 
                    new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.45, gapSize: 0.25, transparent: true, opacity: 0.45 })
                );
                triTriangleLine.computeLineDistances();
                scene.add(triTriangleLine);
            }
        }

        function onMouseMove(event) {
            if (introActive) return;
            mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1, 
                -(event.clientY / window.innerHeight) * 2 + 1
            );
            raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(specialBlocks, true);
            if (intersects.length > 0) {
                let t = intersects[0].object; 
                while (t.parent && !t.userData.type) t = t.parent;
                tooltip.style.display = 'block';
                tooltip.style.left = event.clientX + 'px';
                tooltip.style.top = event.clientY + 'px';
                tooltip.innerText = t.userData.label;
            } else {
                tooltip.style.display = 'none';
            }
        }

        function animateScene() {
            requestAnimationFrame(animateScene);
            const now = Date.now();

            if (controls.autoRotate && !introActive) {
                controls.autoRotateSpeed = 0.5;
            }

            if (!introActive && now - lastZoomTime > ZOOM_INTERVAL) {
                if (cinematicTarget) {
                    cinematicTarget = null;
                    facultyScreen.classList.remove('active');
                } else {
                    cinematicTarget = specialBlocks[Math.floor(Math.random() * specialBlocks.length)];
                    facultyScreen.classList.add('active');
                }
                lastZoomTime = now;
            }

            if (cinematicTarget) {
                controls.target.lerp(cinematicTarget.position.clone(), 0.08);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 2.25, 0.04);
                if (now - lastQuoteTime > QUOTE_INTERVAL) {
                    updateFacultyScreen(cinematicTarget.userData.type);
                    lastQuoteTime = now;
                }
                const vector = cinematicTarget.position.clone();
                vector.y += 3.5; 
                vector.project(camera);
                const container = document.getElementById('canvas-container');
                facultyScreen.style.left = ((vector.x * .5 + .5) * container.clientWidth) + 'px';
                facultyScreen.style.top = ((vector.y * -.5 + .5) * container.clientHeight) + 'px';
            } else {
                controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.03);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.03);
            }

            camera.updateProjectionMatrix();
            controls.update();
            renderer.render(scene, camera);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
