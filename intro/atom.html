<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Atom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let atomGroup, atomNucleus, electronRings = [];

        function init() {
            const container = document.getElementById('canvas-container') || document.body;
            const width = container.clientWidth || window.innerWidth || 120;
            const height = container.clientHeight || window.innerHeight || 140;
            const aspect = width / height;

            scene = new THREE.Scene();

            // Mathematically exact 1:1 aspect ratio to ensure zero stretching
            const frustumHeight = 5.2;
            const frustumBottom = -0.15;
            const frustumTop = frustumBottom + frustumHeight;
            const halfFrustumWidth = (frustumHeight * aspect) / 2;

            camera = new THREE.OrthographicCamera(-halfFrustumWidth, halfFrustumWidth, frustumTop, frustumBottom, 0.1, 100);
            camera.position.set(14, 11, 14);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(width, height);
            renderer.setClearColor(0x000000, 0);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.shadowMap.enabled = true;
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 1.3);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            const blueLight = new THREE.PointLight(0x3b82f6, 2.5, 10);
            blueLight.position.set(0, 3.2, 0);
            scene.add(blueLight);

            // Materials
            const materials = {
                science: new THREE.MeshStandardMaterial({
                    color: 0x3b82f6,
                    emissive: 0x1d4ed8,
                    emissiveIntensity: 0.85,
                    roughness: 0.2
                }),
                scienceBase: new THREE.MeshStandardMaterial({
                    color: 0x0f172a,
                    roughness: 0.5,
                    metalness: 0.4
                })
            };

            // Pedestal with bottom 33% cut off (sitting flush at y=0)
            const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.88, 1.8, 4), materials.scienceBase);
            ped.position.y = 0.9;
            scene.add(ped);

            // Atom Cluster
            atomGroup = new THREE.Group();
            atomGroup.position.y = 3.15;

            // Perfectly Round Spherical Nucleus
            atomNucleus = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 32), materials.science);
            atomGroup.add(atomNucleus);

            // Circular Orbital Rings
            const rGeom = new THREE.TorusGeometry(1.3, 0.05, 16, 64);
            const rMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.9 });

            [0, Math.PI / 2, Math.PI / 4].forEach((rot, i) => {
                const r = new THREE.Mesh(rGeom, rMat);
                if (i === 1) r.rotation.x = rot;
                if (i === 2) r.rotation.y = rot;
                atomGroup.add(r);
                electronRings.push(r);
            });

            scene.add(atomGroup);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container') || document.body;
            if (!container || !renderer || !camera) return;
            const width = container.clientWidth || window.innerWidth || 120;
            const height = container.clientHeight || window.innerHeight || 140;
            const aspect = width / height;

            const frustumHeight = 5.2;
            const frustumBottom = -0.15;
            const frustumTop = frustumBottom + frustumHeight;
            const halfFrustumWidth = (frustumHeight * aspect) / 2;

            camera.left = -halfFrustumWidth;
            camera.right = halfFrustumWidth;
            camera.top = frustumTop;
            camera.bottom = frustumBottom;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            if (atomGroup) {
                atomGroup.rotation.y += 0.032;
                atomGroup.rotation.z += 0.022;
                atomGroup.position.y = 3.15 + Math.sin(time * 2.2) * 0.08;
            }

            if (atomNucleus) {
                const s = 1.0 + Math.sin(time * 4.0) * 0.08;
                atomNucleus.scale.set(s, s, s);
            }

            renderer.render(scene, camera);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => { init(); animate(); });
        } else {
            init();
            animate();
        }
    </script>
</body>

</html>
