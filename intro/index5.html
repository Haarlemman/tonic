<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The University of Free Will | City of Life Expansion</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ==========================================================================
           1. CORE STYLING & VARIABLES (Body, Mind, Soul Triad System)
           ========================================================================== */
        h1, h2, h3 {
            margin: 0;
        }

        :root {
            --ink: #111111;
            --red: #ff3300;     /* Body / Physics / Art[cite: 1, 2] */
            --yellow: #ffcc00;  /* Mind / Logic / Science[cite: 1, 2] */
            --blue: #0033cc;    /* Soul / Faith / Wisdom[cite: 1, 2] */
            --slate-bg: #0f172a;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--slate-bg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* ==========================================================================
           2. CINEMATIC INTRO SCREEN & OVERLAYS
           ========================================================================== */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(14px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            transition: opacity 1.5s ease, visibility 1.5s;
        }

        #intro-text {
            font-size: 1.6rem;
            font-weight: 300;
            max-width: 650px;
            min-height: 100px;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 0 20px;
            letter-spacing: 1px;
            transition: opacity 0.8s ease;
            font-style: italic;
        }

        .action-btn {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 16px 44px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
        }

        .action-btn:hover {
            background: white;
            color: #1e293b;
            border-color: white;
            transform: scale(1.05);
        }

        /* ==========================================================================
           3. FLOATING FACULTY DATA FEED HUD & SCREENS
           ========================================================================== */
        #faculty-screen {
            position: absolute;
            width: 280px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 80;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            transform: translate(-50%, -120%);
        }

        #faculty-screen.active {
            display: flex;
            opacity: 1;
        }

        .neon-text {
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.3;
            min-height: 3em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neon-art { color: #ff3300; text-shadow: 0 0 10px #ff3300; }
        .neon-science { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
        .neon-spirit { color: #0033cc; text-shadow: 0 0 10px #0033cc; }

        .screen-sub {
            color: #888;
            font-size: 0.55rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 6px;
        }

        /* ==========================================================================
           4. HUD CONTROLS & TRITRUH BADGE LAYOUT
           ========================================================================== */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
            z-index: 50;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .top-right-controls {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .icon-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: white;
            color: black;
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        #tri-truth-badge {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        #tri-words {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: opacity 0.6s ease;
        }

        .tri-w-red { color: #ff3300; }
        .tri-w-blue { color: #ffcc00; }
        .tri-w-yellow { color: #60a5fa; }
        .tri-sep { color: rgba(255, 255, 255, 0.3); }

        .bottom-nav {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .building-tag {
            cursor: pointer;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .building-tag:hover {
            background: white;
            color: black;
            transform: translateY(-4px);
        }

        .tag-red { border-bottom: 4px solid #ff3300; }
        .tag-yellow { border-bottom: 4px solid #ffcc00; }
        .tag-blue { border-bottom: 4px solid #3b82f6; }

        #tooltip {
            position: absolute;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            display: none;
            font-size: 11px;
            font-weight: 700;
            z-index: 60;
            transform: translate(-50%, -120%);
        }
    </style>
</head>

<body>

    <div id="intro-overlay">
        <div id="intro-text">Initializing the City of Life...</div>
        <button id="skip-btn" class="action-btn">Enter Campus</button>
    </div>

    <div id="faculty-screen">
        <div id="screen-content" class="neon-text"></div>
        <div class="screen-sub">FACULTY DATA FEED</div>
    </div>

    <div id="hud-layer">
        <div id="tri-truth-badge">
            <div id="tri-words"></div>
        </div>

        <div class="top-right-controls">
            <button class="icon-btn" onclick="toggleFullScreen()" title="Toggle Fullscreen">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                </svg>
            </button>
        </div>

        <div class="bottom-nav">
            <div class="building-tag tag-red" onclick="focusBuilding('art')">Faculty of Art</div>
            <div class="building-tag tag-yellow" onclick="focusBuilding('science')">Faculty of Science</div>
            <div class="building-tag tag-blue" onclick="focusBuilding('spirit')">Faculty of Religion</div>
        </div>
    </div>

    <div id="tooltip"></div>
    <div id="canvas-container"></div>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        /* ==========================================================================
           5. THREE.JS CAMPUS SIMULATION & INTERACTION LOGIC
           ========================================================================== */
        let scene, camera, renderer, raycaster, mouse, controls;
        let specialBlocks = [];
        let leaderLines = [];
        let triTriangleLine;

        let introActive = true;
        let cinematicTarget = null;
        let lastZoomTime = 0;
        let lastQuoteTime = 0;
        const ZOOM_INTERVAL = 12000;
        const QUOTE_INTERVAL = 3000;

        const tooltip = document.getElementById('tooltip');
        const introTextEl = document.getElementById('intro-text');
        const skipBtn = document.getElementById('skip-btn');
        const hudLayer = document.getElementById('hud-layer');
        const facultyScreen = document.getElementById('faculty-screen');
        const screenContent = document.getElementById('screen-content');

        const facultyData = {
            art: {
                quotes: ["LITERATURE & PAINTING", "BEAUTY IS SUBJECTIVE TRUTH", "SENSES & FEELING", "THE CANVAS BLEEDS FORM"],
                class: "neon-art"
            },
            science: {
                quotes: ["PHYSICS, MATHS, ASTRONOMY", "EMPIRICAL REASON & KNOWLEDGE", "OBJECTIVE ORDER", "THE LAWS OF THE BRAIN"],
                class: "neon-science"
            },
            spirit: {
                quotes: ["PRIESTHOOD & MYSTERY", "FAITH, MEANING & SOLACE", "THE UNIVERSAL VOID", "ENLIGHTENMENT THROUGH UNITY"],
                class: "neon-spirit"
            }
        };

        const triTruths = [
            ["ART", "SCIENCE", "RELIGION"],
            ["BODY", "MIND", "SOUL"],
            ["BEAUTY", "REASON", "WISDOM"],
            ["SUBJECTIVE", "OBJECTIVE", "UNIVERSAL"]
        ];
        let triTruthIndex = 0;
        const triWordsEl = document.getElementById('tri-words');

        function cycleTriTruth() {
            if (!triWordsEl) return;
            triWordsEl.style.opacity = 0;
            setTimeout(() => {
                const t = triTruths[triTruthIndex];
                triWordsEl.innerHTML =
                    `<span class="tri-w-red">${t[0]}</span><span class="tri-sep">&middot;</span>` +
                    `<span class="tri-w-blue">${t[1]}</span><span class="tri-sep">&middot;</span>` +
                    `<span class="tri-w-yellow">${t[2]}</span>`;
                triWordsEl.style.opacity = 1;
                triTruthIndex = (triTruthIndex + 1) % triTruths.length;
            }, 500);
        }

        const introQuotes = [
            "Welcome to the City of Life.",
            "The University of Hope and the Faculties of Free Will.",
            "Explore where Body, Mind, and Soul converge.",
            "Where Art, Science, and Religion build reality."
        ];

        window.onload = function () {
            init();
            animate();
            runIntroSequence();
            cycleTriTruth();
            setInterval(cycleTriTruth, 4500);
            skipBtn.onclick = (e) => { e.stopPropagation(); startExperience(); };
        };

        async function runIntroSequence() {
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.8;
            for (let quote of introQuotes) {
                introTextEl.style.opacity = 0;
                await new Promise(r => setTimeout(r, 600));
                introTextEl.innerText = quote;
                introTextEl.style.opacity = 1;
                await new Promise(r => setTimeout(r, 3000));
            }
        }

        function startExperience() {
            introActive = false;
            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                hudLayer.style.opacity = 1;
                lastZoomTime = Date.now();
            }, 1000);
        }

        function focusBuilding(type) {
            const b = specialBlocks.find(b => b.userData.type === type);
            if (b) {
                cinematicTarget = b;
                lastZoomTime = Date.now();
                lastQuoteTime = Date.now();
                updateFacultyScreen(type);
                facultyScreen.classList.add('active');
            }
        }

        function updateFacultyScreen(type) {
            const data = facultyData[type];
            if (!data) return;
            screenContent.className = 'neon-text ' + data.class;
            const randomQuote = data.quotes[Math.floor(Math.random() * data.quotes.length)];
            screenContent.innerText = randomQuote;
        }

        function createTextSprite(text, color = "#ffffff") {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024; canvas.height = 256;
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(200, 64, 624, 128);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
            ctx.font = 'Bold 42px Inter, Arial'; ctx.fillText(text, 512, 128);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
            sprite.scale.set(7, 1.75, 1);
            return sprite;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 40, 150);

            const container = document.getElementById('canvas-container');
            const aspect = container.clientWidth / container.clientHeight;
            const d = 16;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(40, 40, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(30, 60, 20);
            scene.add(sun);

            createCampus();

            window.addEventListener('resize', () => {
                const asp = container.clientWidth / container.clientHeight;
                camera.left = -d * asp; camera.right = d * asp;
                camera.top = d; camera.bottom = -d;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            window.addEventListener('mousemove', onMouseMove, false);
        }

        function createCampus() {
            const SPACING = 1.6;
            const GRID = 12;
            const centerOffset = (GRID * SPACING) / 2;

            const materials = {
                campus: new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 }),
                artBuilding: new THREE.MeshStandardMaterial({ color: 0xff3300 }),
                scienceBuilding: new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0x997700 }),
                spiritBuilding: new THREE.MeshStandardMaterial({ color: 0x0033cc, emissive: 0x001166 }),
                white: new THREE.MeshStandardMaterial({ color: 0xffffff }),
                dottedLine: new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.2, gapSize: 0.2, transparent: true, opacity: 0.6 })
            };

            for (let x = 0; x < GRID; x++) {
                for (let z = 0; z < GRID; z++) {
                    let mesh, type = "campus", labelText = "", labelY = 0;

                    if (x === 4 && z === 4) {
                        type = "art"; labelText = "FACULTY OF ART"; labelY = 8;
                        const g = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 2), materials.artBuilding);
                        core.position.y = 3; g.add(core);
                        mesh = g;
                    } else if (x === 8 && z === 4) {
                        type = "science"; labelText = "FACULTY OF SCIENCE"; labelY = 8;
                        const g = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.5, 5, 6), materials.scienceBuilding);
                        core.position.y = 2.5; g.add(core);
                        mesh = g;
                    } else if (x === 6 && z === 8) {
                        type = "spirit"; labelText = "FACULTY OF RELIGION"; labelY = 9;
                        const g = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.ConeGeometry(1.5, 7, 4), materials.spiritBuilding);
                        core.position.y = 3.5; g.add(core);
                        mesh = g;
                    } else {
                        let h = 0.5 + Math.random() * 3;
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), materials.campus);
                        mesh.scale.set(1, h, 1);
                        mesh.position.y = h / 2;
                    }

                    mesh.position.x = x * SPACING - centerOffset;
                    mesh.position.z = z * SPACING - centerOffset;
                    mesh.userData = { type, label: labelText || type };
                    scene.add(mesh);

                    if (type !== "campus") {
                        specialBlocks.push(mesh);
                        const label = createTextSprite(labelText);
                        label.position.set(mesh.position.x, labelY, mesh.position.z);
                        scene.add(label);
                        
                        const linePts = [new THREE.Vector3(mesh.position.x, 2, mesh.position.z), new THREE.Vector3(label.position.x, label.position.y - 0.8, label.position.z)];
                        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(linePts), materials.dottedLine.clone());
                        line.computeLineDistances();
                        scene.add(line);
                        leaderLines.push(line);
                    }
                }
            }

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            if (specialBlocks.length === 3) {
                const triPts = specialBlocks.map(b => new THREE.Vector3(b.position.x, 0.05, b.position.z));
                triPts.push(triPts[0].clone());
                const triGeom = new THREE.BufferGeometry().setFromPoints(triPts);
                triTriangleLine = new THREE.Line(triGeom, new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.4, gapSize: 0.2, transparent: true, opacity: 0.4 }));
                triTriangleLine.computeLineDistances();
                scene.add(triTriangleLine);
            }
        }

        function onMouseMove(event) {
            if (introActive) return;
            mouse = new THREE.Vector2((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window.innerHeight) * 2 + 1);
            raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(specialBlocks, true);
            if (intersects.length > 0) {
                let t = intersects[0].object; 
                while (t.parent && !t.userData.type) t = t.parent;
                tooltip.style.display = 'block';
                tooltip.style.left = event.clientX + 'px';
                tooltip.style.top = event.clientY + 'px';
                tooltip.innerText = t.userData.label;
            } else {
                tooltip.style.display = 'none';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = Date.now();

            if (controls.autoRotate && !introActive) controls.autoRotateSpeed = 0.5;

            if (!introActive && now - lastZoomTime > ZOOM_INTERVAL) {
                if (cinematicTarget) {
                    cinematicTarget = null;
                    facultyScreen.classList.remove('active');
                } else {
                    cinematicTarget = specialBlocks[Math.floor(Math.random() * specialBlocks.length)];
                    facultyScreen.classList.add('active');
                }
                lastZoomTime = now;
            }

            if (cinematicTarget) {
                controls.target.lerp(cinematicTarget.position.clone(), 0.08);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 2.2, 0.04);
                if (now - lastQuoteTime > QUOTE_INTERVAL) {
                    updateFacultyScreen(cinematicTarget.userData.type);
                    lastQuoteTime = now;
                }
                const vector = cinematicTarget.position.clone();
                vector.y += 3; 
                vector.project(camera);
                const container = document.getElementById('canvas-container');
                facultyScreen.style.left = ((vector.x * .5 + .5) * container.clientWidth) + 'px';
                facultyScreen.style.top = ((vector.y * -.5 + .5) * container.clientHeight) + 'px';
            } else {
                controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.03);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.03);
            }

            camera.updateProjectionMatrix();
            controls.update();
            renderer.render(scene, camera);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }
    </script>
</body>
</html>
