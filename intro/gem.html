<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Elements - Isolated</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e293b;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            position: absolute;
            top: 0;
            left: 0;
        }

        #canvas-container:active {
            cursor: grabbing;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;

        // Dynamic element references
        let spiritBeam, spiritGlowVolume;
        let beautyGroup, beautyCore, beautyShards = [];
        let atomGroup, atomNucleus, electronRings = [];

        function createGradientTexture() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 1;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createLinearGradient(0, 256, 0, 0);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.7, 'rgba(255,255,255,0.3)');
                grad.addColorStop(1, '#000000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 1, 256);
                return new THREE.CanvasTexture(canvas);
            } catch (e) {
                return null;
            }
        }

        function init() {
            const container = document.getElementById('canvas-container') || document.body;
            const width = container.clientWidth || window.innerWidth || 800;
            const height = container.clientHeight || window.innerHeight || 600;
            const aspect = width / height;
            const d = 10.0;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e293b);
            scene.fog = new THREE.Fog(0x1e293b, 40, 140);

            // Pure Isometric Orthographic Camera centered at origin
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(30, 30, 30);
            camera.lookAt(0, 3.5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(width, height);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            if (typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.target.set(0, 3.5, 0);
            }

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 1.4);
            sun.position.set(25, 50, 25);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            sun.shadow.camera.near = 0.5;
            sun.shadow.camera.far = 150;
            const dCam = 15;
            sun.shadow.camera.left = -dCam;
            sun.shadow.camera.right = dCam;
            sun.shadow.camera.top = dCam;
            sun.shadow.camera.bottom = -dCam;
            sun.shadow.bias = -0.0005;
            scene.add(sun);

            createElements();

            window.addEventListener('resize', onWindowResize, false);
        }

        function createElements() {
            const gradTexture = createGradientTexture();

            const materials = {
                museumWhite: new THREE.MeshStandardMaterial({ 
                    color: 0xdddef0, 
                    roughness: 0.6, 
                    metalness: 0.1 
                }),
                museumRed: new THREE.MeshStandardMaterial({ 
                    color: 0xdc2626, 
                    roughness: 0.4, 
                    metalness: 0.2 
                }),
                science: new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8, emissiveIntensity: 0.6 }),
                scienceBase: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 }),
                spiritNeon: new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xfacc15, emissiveIntensity: 6, transparent: true, alphaMap: gradTexture }),
                spiritGlow: new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, alphaMap: gradTexture })
            };

            // ========================================================
            // 1. WISDOM PILLAR (Spirit / Screen-Left: X = -7.0, Z = 7.0)
            // ========================================================
            const wisdomGroup = new THREE.Group();
            wisdomGroup.position.set(-7.0, 0, 7.0);

            spiritBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.45, 18, 32), materials.spiritNeon);
            spiritBeam.position.y = 9;
            wisdomGroup.add(spiritBeam);

            spiritGlowVolume = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 1.0, 18, 32), materials.spiritGlow);
            spiritGlowVolume.position.y = 9;
            wisdomGroup.add(spiritGlowVolume);

            scene.add(wisdomGroup);


            // ========================================================
            // 2. BEAUTY MUSEUM (Art / Screen-Center: X = 0, Z = 0)
            // Enhanced with stronger shadows and textured materials
            // ========================================================
            beautyGroup = new THREE.Group();
            beautyGroup.position.set(0, 0, 0);

            beautyCore = new THREE.Mesh(new THREE.BoxGeometry(0.8, 6.5, 0.8), materials.museumRed);
            beautyCore.position.y = 3.25;
            beautyCore.castShadow = true;
            beautyCore.receiveShadow = true;
            beautyGroup.add(beautyCore);

            const shardDefs = [
                { size: [4.5, 0.8, 3.0], pos: [0, 1.5, 0], rot: [0.2, 0.1, 0.1], speed: 1.3, amp: 0.3 },
                { size: [3.0, 0.8, 5.0], pos: [-0.5, 3.8, 0.5], rot: [-0.3, -0.4, 0.1], speed: 1.7, amp: 0.35 },
                { size: [5.5, 0.4, 2.5], pos: [0.8, 2.6, -0.2], rot: [0.1, 0.6, -0.2], speed: 1.1, amp: 0.25 }
            ];

            beautyShards = [];
            shardDefs.forEach(s => {
                const sh = new THREE.Mesh(new THREE.BoxGeometry(...s.size), materials.museumWhite);
                sh.position.set(...s.pos);
                sh.rotation.set(...s.rot);
                sh.castShadow = true;
                sh.receiveShadow = true;
                sh.userData = {
                    basePos: new THREE.Vector3(...s.pos),
                    baseRot: new THREE.Euler(...s.rot),
                    speed: s.speed,
                    amp: s.amp
                };
                beautyGroup.add(sh);
                beautyShards.push(sh);
            });

            scene.add(beautyGroup);


            // ========================================================
            // 3. KNOWLEDGE ATOM (Science / Screen-Right: X = 7.0, Z = -7.0)
            // ========================================================
            const scienceGroup = new THREE.Group();
            scienceGroup.position.set(7.0, 0, -7.0);

            const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 1.2, 3.0, 4), materials.scienceBase);
            ped.position.y = 1.5;
            ped.castShadow = true;
            ped.receiveShadow = true;
            scienceGroup.add(ped);

            atomGroup = new THREE.Group();
            atomGroup.position.y = 4.8;

            atomNucleus = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 24), materials.science);
            atomNucleus.castShadow = true;
            atomGroup.add(atomNucleus);

            const rGeom = new THREE.TorusGeometry(1.4, 0.05, 12, 64);
            const rMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.85 });

            electronRings = [];
            [0, Math.PI / 2, Math.PI / 4].forEach((rot, i) => {
                const r = new THREE.Mesh(rGeom, rMat);
                if (i === 1) r.rotation.x = rot;
                if (i === 2) r.rotation.y = rot;
                atomGroup.add(r);
                electronRings.push(r);
            });

            scienceGroup.add(atomGroup);
            scene.add(scienceGroup);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container') || document.body;
            if (!container || !renderer || !camera) return;
            const width = container.clientWidth || window.innerWidth || 800;
            const height = container.clientHeight || window.innerHeight || 600;
            const aspect = width / height;
            const d = 10.0;

            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            // 1. Wisdom Pillar: Pounding animation
            if (spiritBeam && spiritGlowVolume) {
                const cycle = (time * 4.0) % Math.PI;
                const pound = Math.pow(Math.sin(cycle), 10);
                const s = 1.0 + pound * 0.5;
                spiritBeam.scale.set(s, 1.0 - pound * 0.08, s);
                spiritGlowVolume.scale.set(s * 1.05, 1.0, s * 1.05);
                spiritGlowVolume.material.opacity = 0.2 + pound * 0.6;
                spiritBeam.material.emissiveIntensity = 4.0 + pound * 8.0;
            }

            // 2. Beauty Museum: Moving floating shards animation
            if (beautyCore) {
                beautyCore.position.y = 3.25 + Math.sin(time * 1.2) * 0.12;
            }
            beautyShards.forEach((sh, idx) => {
                const u = sh.userData;
                sh.position.y = u.basePos.y + Math.sin(time * u.speed + idx) * u.amp;
                sh.position.x = u.basePos.x + Math.cos(time * (u.speed * 0.8) + idx) * 0.15;
                sh.rotation.z = u.baseRot.z + Math.sin(time * u.speed + idx) * 0.08;
                sh.rotation.x = u.baseRot.x + Math.cos(time * (u.speed * 0.9) + idx) * 0.06;
            });

            // 3. Knowledge Atom: Animated rotation
            if (atomGroup) {
                atomGroup.rotation.y += 0.03;
                atomGroup.rotation.z += 0.02;
                atomGroup.position.y = 4.8 + Math.sin(time * 2.0) * 0.15;
            }
            if (atomNucleus) {
                const s = 1.0 + Math.sin(time * 4.0) * 0.08;
                atomNucleus.scale.set(s, s, s);
            }

            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        // Start immediately or on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () {
                init();
                animate();
            });
        } else {
            init();
            animate();
        }
    </script>
</body>

</html>
