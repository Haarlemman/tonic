<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The University of Free Will | City of Life Complete Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ink: #0a0f1d;
            --surface: #111827;
            --art: #ff3300;
            --science: #ffcc00;
            --soul: #3b82f6;
        }
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Inter', sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(15,23,42,0.95) 0%, rgba(10,15,29,0.99) 100%);
            backdrop-filter: blur(16px); z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 2rem;
            transition: opacity 1.5s ease, visibility 1.5s;
        }
        #intro-text { font-size: 1.6rem; font-style: italic; max-width: 650px; min-height: 100px; margin-bottom: 2rem; color: #e2e8f0; transition: opacity 0.8s ease; }
        .action-btn {
            background: #1e293b; border: 1px solid rgba(255,255,255,0.3); color: #fff;
            padding: 1rem 3rem; text-transform: uppercase; letter-spacing: 0.2em; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease; border-radius: 4px;
        }
        .action-btn:hover { background: #fff; color: #0f172a; transform: scale(1.05); }
        #faculty-screen {
            position: absolute; width: 300px; background: rgba(10,15,29,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); padding: 1.25rem; display: none; flex-direction: column;
            gap: 0.75rem; z-index: 800; opacity: 0; transition: opacity 0.4s ease; text-align: center;
            transform: translate(-50%, -125%); border-radius: 6px; pointer-events: none;
        }
        #faculty-screen.active { display: flex; opacity: 1; }
        .neon-text { font-family: 'Courier New', monospace; font-weight: 900; font-size: 1rem; letter-spacing: 0.05em; text-transform: uppercase; min-height: 3em; display: flex; align-items: center; justify-content: center; }
        .neon-art { color: var(--art); text-shadow: 0 0 12px rgba(255,51,0,0.6); }
        .neon-science { color: var(--science); text-shadow: 0 0 12px rgba(255,204,0,0.6); }
        .neon-spirit { color: var(--soul); text-shadow: 0 0 12px rgba(59,130,246,0.6); }
        #hud-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 2.5rem; box-sizing: border-box; z-index: 500; opacity: 0; transition: opacity 1.5s ease;
        }
        .top-right { position: absolute; top: 2.5rem; right: 2.5rem; pointer-events: auto; }
        .icon-btn { background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .icon-btn:hover { background: #fff; color: #000; }
        #tri-truth-badge { position: absolute; top: 2.2rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.75rem; font-family: 'Courier New', monospace; font-size: 0.7rem; font-weight: bold; letter-spacing: 0.2em; text-transform: uppercase; background: rgba(15,23,42,0.8); padding: 0.6rem 1.2rem; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .bottom-nav { position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%); display: flex; gap: 1rem; pointer-events: auto; }
        .building-tag { cursor: pointer; padding: 0.8rem 1.5rem; background: rgba(15,23,42,0.85); color: #fff; border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase; font-size: 0.75font-weight: bold; letter-spacing: 0.1em; transition: 0.3s; border-radius: 4px; }
        .building-tag:hover { background: #fff; color: #000; transform: translateY(-3px); }
        .tag-red { border-bottom: 4px solid var(--art); }
        .tag-yellow { border-bottom: 4px solid var(--science); }
        .tag-blue { border-bottom: 4px solid var(--soul); }
        #tooltip { position: absolute; padding: 0.4rem 0.8rem; background: rgba(15,23,42,0.95); border: 1px solid rgba(255,255,255,0.2); font-size: 11px; font-weight: bold; display: none; z-index: 900; transform: translate(-50%, -130%); pointer-events: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="intro-overlay">
        <div id="intro-text">Initializing the City of Life...</div>
        <button id="skip-btn" class="action-btn">Enter Campus</button>
    </div>
    <div id="faculty-screen">
        <div id="screen-content" class="neon-text"></div>
        <div style="color:#94a3b8; font-size:0.55rem; letter-spacing:0.3em; border-top:1px solid rgba(255,255,255,0.1); padding-top:0.5em;">FACULTY DATA FEED</div>
    </div>
    <div id="hud-layer">
        <div id="tri-truth-badge">
            <span style="color:var(--art)">ART</span> &middot; <span style="color:var(--science)">SCIENCE</span> &middot; <span style="color:var(--soul)">RELIGION</span>
        </div>
        <div class="top-right">
            <button class="icon-btn" onclick="if(!document.fullscreenElement)document.documentElement.requestFullscreen();else if(document.exitFullscreen)document.exitFullscreen();" title="Fullscreen">⛶</button>
        </div>
        <div class="bottom-nav">
            <div class="building-tag tag-red" onclick="focusBuilding('art')">Faculty of Art</div>
            <div class="building-tag tag-yellow" onclick="focusBuilding('science')">Faculty of Science</div>
            <div class="building-tag tag-blue" onclick="focusBuilding('spirit')">Faculty of Religion</div>
        </div>
    </div>
    <div id="tooltip"></div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        let specialBlocks = [];
        let cinematicTarget = null;
        let lastZoomTime = 0;
        let introActive = true;

        const facultyData = {
            art: { quotes: ["LITERATURE, PAINTING, MUSIC", "BEAUTY IS SUBJECTIVE TRUTH", "SENSES & SENSORY EXPERIENCE"], class: "neon-art" },
            science: { quotes: ["PHYSICS, MATHS, ASTRONOMY", "EMPIRICAL REASON & KNOWLEDGE", "OBJECTIVE ORDER & FACTS"], class: "neon-science" },
            spirit: { quotes: ["PRIESTHOOD & SACRED MYSTERY", "FAITH, MEANING & SOLACE", "ENLIGHTENMENT THROUGH UNITY"], class: "neon-spirit" }
        };

        window.onload = function() {
            init();
            animate();
            runIntro();
            document.getElementById('skip-btn').onclick = (e) => { e.stopPropagation(); startApp(); };
        };

        async function runIntro() {
            const quotes = [
                "Welcome to the City of Life.",
                "The University of Hope and the Faculties of Free Will.",
                "Explore where Body, Mind, and Soul converge."
            ];
            for(let q of quotes) {
                document.getElementById('intro-text').style.opacity = 0;
                await new Promise(r => setTimeout(r, 500));
                document.getElementById('intro-text').innerText = q;
                document.getElementById('intro-text').style.opacity = 1;
                await new Promise(r => setTimeout(r, 3000));
            }
        }

        function startApp() {
            introActive = false;
            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                document.getElementById('hud-layer').style.opacity = 1;
                lastZoomTime = Date.now();
            }, 1000);
        }

        function focusBuilding(type) {
            const b = specialBlocks.find(x => x.userData.type === type);
            if(b) {
                cinematicTarget = b;
                lastZoomTime = Date.now();
                const screen = document.getElementById('faculty-screen');
                const content = document.getElementById('screen-content');
                content.className = "neon-text " + facultyData[type].class;
                content.innerText = facultyData[type].quotes[0];
                screen.classList.add('active');
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 40, 150);

            const container = document.getElementById('canvas-container');
            const aspect = container.clientWidth / container.clientHeight;
            camera = new THREE.OrthographicCamera(-16 * aspect, 16 * aspect, 16, -16, 1, 1000);
            camera.position.set(40, 40, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(30, 60, 20);
            scene.add(sun);

            // Build Grid & Landmarks
            const spacing = 1.6;
            const grid = 12;
            const offset = (grid * spacing) / 2;

            for (let x = 0; x < grid; x++) {
                for (let z = 0; z < grid; z++) {
                    let mesh, type = "campus", label = "";
                    if (x === 4 && z === 4) {
                        type = "art"; label = "FACULTY OF ART";
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(2.2, 6.5, 2.2), new THREE.MeshStandardMaterial({color: 0xff3300}));
                        mesh.position.y = 3.25;
                    } else if (x === 8 && z === 4) {
                        type = "science"; label = "FACULTY OF SCIENCE";
                        mesh = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.6, 5.5, 6), new THREE.MeshStandardMaterial({color: 0xffcc00}));
                        mesh.position.y = 2.75;
                    } else if (x === 6 && z === 8) {
                        type = "spirit"; label = "FACULTY OF RELIGION";
                        mesh = new THREE.Mesh(new THREE.ConeGeometry(1.6, 7.5, 4), new THREE.MeshStandardMaterial({color: 0x3b82f6}));
                        mesh.position.y = 3.75;
                    } else {
                        let h = 0.5 + Math.random() * 3;
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({color: 0x334155}));
                        mesh.scale.set(1, h, 1);
                        mesh.position.y = h / 2;
                    }
                    mesh.position.x = x * spacing - offset;
                    mesh.position.z = z * spacing - offset;
                    mesh.userData = { type, label: label || type };
                    scene.add(mesh);
                    if(type !== "campus") specialBlocks.push(mesh);
                }
            }

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshStandardMaterial({color: 0x1e293b}));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            window.addEventListener('resize', () => {
                const asp = container.clientWidth / container.clientHeight;
                camera.left = -16 * asp; camera.right = 16 * asp;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = Date.now();
            if(!introActive && now - lastZoomTime > 12000) {
                cinematicTarget = cinematicTarget ? null : specialBlocks[Math.floor(Math.random() * specialBlocks.length)];
                lastZoomTime = now;
                const screen = document.getElementById('faculty-screen');
                if(cinematicTarget) {
                    const content = document.getElementById('screen-content');
                    const t = cinematicTarget.userData.type;
                    content.className = "neon-text " + facultyData[t].class;
                    content.innerText = facultyData[t].quotes[Math.floor(Math.random()*facultyData[t].quotes.length)];
                    screen.classList.add('active');
                } else {
                    screen.classList.remove('active');
                }
            }
            if(cinematicTarget) {
                controls.target.lerp(cinematicTarget.position.clone(), 0.08);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 2.2, 0.04);
                const vector = cinematicTarget.position.clone();
                vector.y += 3.5; vector.project(camera);
                const cont = document.getElementById('canvas-container');
                const screen = document.getElementById('faculty-screen');
                screen.style.left = ((vector.x * .5 + .5) * cont.clientWidth) + 'px';
                screen.style.top = ((vector.y * -.5 + .5) * cont.clientHeight) + 'px';
            } else {
                controls.target.lerp(new THREE.Vector3(0,0,0), 0.03);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.03);
            }
            camera.updateProjectionMatrix();
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
