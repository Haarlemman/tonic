<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The University of Free Will</title>
    <!-- External CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <audio id="bg-music" loop crossorigin="anonymous">
        <source src="audio/MysteriousHeartbeat1.mp3" type="audio/mpeg">
    </audio>

    <div id="intro-overlay">
        <div id="intro-text"></div>
        <div class="intro-btns">
            <button id="skip-btn" class="action-btn">Learn</button>
        </div>
    </div>

    <div id="faculty-screen">
        <div id="screen-content" class="neon-text"></div>
        <div class="screen-sub">FACULTY DATA FEED</div>
    </div>

    <div id="hud-layer">
        <div style="display:flex; justify-content:space-between; align-items: flex-start;">
            <div class="brand-box">
                <h1>University<br>of Free Will</h1>
                <div class="sub-brand">ADVERSITY IS YOUR TEACHER</div>
            </div>
            <div class="status-box">
                <button class="hud-btn" onclick="toggleMusic()" id="music-toggle">Audio: On</button>
                <button class="hud-btn" onclick="toggleMenu()">Menu</button>
                <button class="hud-btn btn-red" onclick="alert('Borders Expanding Required')">Login</button>
            </div>
            <div id="general-menu">
                <div style="color:white; font-size:0.5rem; padding:8px; border-bottom:1px solid #333; margin-bottom:5px;">
                    CAMPUS DIRECTORY</div>
                <a href="info.html" class="menu-link">Info Desk</a>
                <a href="art.html" class="menu-link">Artistic Core</a>
                <a href="science.html" class="menu-link">Scientific Method</a>
                <a href="spirit.html" class="menu-link">Spiritual Path</a>
                <a href="#" class="menu-link" onclick="alert('Portal is read-only')">Registry</a>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
            <div class="controls-box">
                <div style="border-bottom:1px solid rgba(0,0,0,0.1); margin-bottom:8px; padding-bottom:4px; color:#111; font-weight:bold; font-size:0.5rem;">
                    AUDIO-KINETIC FEED</div>
                <div class="control-row"><span class="key">BEAT SYNC</span> <span>ACTIVE</span></div>
                <div class="control-row"><span class="key">AUTO-TOUR</span> <span>ENGAGED</span></div>
                <div class="control-row"><span class="key">ORBITING</span> <span>L-DRAG</span></div>
            </div>

            <div class="directory-box">
                <div class="building-tag tag-red" onclick="focusBuilding('art')">Beauty</div>
                <div class="building-tag tag-blue" onclick="focusBuilding('science')">Knowledge</div>
                <div class="building-tag tag-yellow" onclick="focusBuilding('spirit')">Wisdom</div>
            </div>
        </div>
    </div>

    <div id="audio-status">Audio Kinetic Analysis Online</div>
    <div id="tooltip"></div>
    <div id="canvas-container"></div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- External Custom Logic -->
    <script src="kript.js"></script>
</body>

</html>
