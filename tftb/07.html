    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'DM Serif Display', serif;
            --font-mono: 'DM Mono', monospace;
        }
        body {
            font-family: var(--font-sans);
            background-color: #0c0a09;
            color: #e7e5e4;
            overflow: hidden;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        .text-shadow { text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        /* Animations */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slow-pan { 0% { transform: scale(1.1); } 100% { transform: scale(1.2) translate(-2%, -2%); } }
        
        /* Glitch Animation */
        @keyframes glitch {
            0% { opacity: 1; transform: scaleY(1) skewX(0deg); }
            5% { opacity: 0.8; transform: scaleY(0.9) skewX(5deg); }
            10% { opacity: 1; transform: scaleY(1) skewX(0deg); }
            15% { opacity: 0.4; transform: scaleY(1.1) skewX(-5deg); }
            20% { opacity: 1; transform: scaleY(1) skewX(0deg); }
            45% { opacity: 1; transform: scaleY(1) skewX(3deg); }
            50% { opacity: 0.5; transform: scaleY(0.9) skewX(0deg); }
            55% { opacity: 1; transform: scaleY(1) skewX(0deg); }
            80% { opacity: 1; transform: scaleY(1) skewX(-3deg); }
            85% { opacity: 0.7; transform: scaleY(1.05) skewX(0deg); }
            90% { opacity: 1; transform: scaleY(1) skewX(0deg); }
            100% { opacity: 1; transform: scaleY(1) skewX(0deg); }
        }

        /* Flicker Animation */
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 0.9; box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
            20%, 24%, 55% { opacity: 0.2; box-shadow: none; }
            70% { opacity: 0.7; }
            72% { opacity: 0.2; }
            74% { opacity: 0.9; }
        }

        .animate-fade-in { animation: fade-in 1s ease-out forwards; }
        .animate-fade-in-up { animation: fade-in-up 0.8s ease-out forwards; }
        .animate-slow-pan { animation: slow-pan 20s infinite alternate ease-in-out; }
        .animate-glitch { animation: glitch 2s infinite steps(2); }
        .animate-flicker { animation: flicker 4s infinite; }
        .rotate-step { transition: transform 0.2s cubic-bezier(0.4, 2.5, 0.55, 0.45); }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="root"></div>
	
<script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    // --- CONFIGURATION: EDIT HERE ---
    
    // 1. VIDEO SETTINGS
    const VIDEO_CONFIG = {
        videoPath: "/folio/video/light.mp4",
        opacity: 0.50,            // 0.1 = 10% Opacity
        playbackSpeed: 2,       // Speed of the video (0.5 = Half Speed)
        loopType: "bounce",       // "bounce" = Forward/Backward Loop. "standard" = Normal Loop.
        enableGlitch: false,       // Toggle the visual jump/glitch effect
        cssFilters: "grayscale(0%) contrast(100%) brightness(100%) blur(0px)" 
    };

    // 2. AUDIO TRACKS
    const AUDIO_TRACKS = {
        static: "noise.mp3",
        body: "body.mp3",
        mind: "mind.mp3",
        soul: "soul.mp3",
        future: "future.mp3"
    };

    // 3. IMAGES & LOCATIONS
    const LOCATIONS = ["Haarlem", "London", "New York", "Amsterdam", "Köln", "Ramat Gan", "Rzeszów", "The Hague"];
    
    const ARTWORKS = {
        shakingMan: "https://davidenker.com/tftb/images/raar.png", 
        heartMonster: "https://davidenker.com/tftb/images/beest.png",
        infinityMap: "https://davidenker.com/tftb/images/gme.png",
        stars: "https://davidenker.com/tftb/images/stars.jpg"
    };

    const IMAGES = {
        body:   "https://www.davidenker.com/tftb/images/ailishleidsevaart.jpg?q=80&w=1600&auto=format&fit=crop",
        mind:   "https://www.davidenker.com/tftb/images/brug.jpg?q=80&w=1600&auto=format&fit=crop",
        soul:   "https://www.davidenker.com/tftb/images/hitchin.jpg?q=80&w=1600&auto=format&fit=crop",
        future: "https://www.davidenker.com/tftb/images/sea.jpg?q=80&w=1600&auto=format&fit=crop"
    };
    
    const NOISE_SVG = `data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E`;

    // --- ICONS ---
    const SvgIcon = ({ children, className, ...props }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
    );

    const Icons = {
        X: (props) => <SvgIcon {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></SvgIcon>,
        ChevronLeft: (props) => <SvgIcon {...props}><path d="M15 18l-6-6 6-6" /></SvgIcon>,
        ChevronRight: (props) => <SvgIcon {...props}><path d="M9 18l6-6-6-6" /></SvgIcon>,
        ChevronsDown: (props) => <SvgIcon {...props}><path d="M7 13l5 5 5-5M7 6l5 5 5-5" /></SvgIcon>,
        Play: (props) => <SvgIcon {...props}><polygon points="5 3 19 12 5 21 5 3"/></SvgIcon>,
        ExternalLink: (props) => <SvgIcon {...props}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></SvgIcon>,
        Zap: (props) => <SvgIcon {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></SvgIcon>,
        Brain: (props) => <SvgIcon {...props}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></SvgIcon>,
        Heart: (props) => <SvgIcon {...props}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></SvgIcon>,
        Radio: (props) => <SvgIcon {...props}><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></SvgIcon>,
        ArrowDown: (props) => <SvgIcon {...props}><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></SvgIcon>,
        Image: (props) => <SvgIcon {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></SvgIcon>,
        BookOpen: (props) => <SvgIcon {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></SvgIcon>,
        Instagram: (props) => <SvgIcon {...props}><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></SvgIcon>,
        Mail: (props) => <SvgIcon {...props}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></SvgIcon>
    };

    // --- VIDEO COMPONENT (Robust State Machine) ---
    const IntroVideo = ({ src }) => {
        const videoRef = useRef(null);
        
        useEffect(() => {
            const video = videoRef.current;
            if (!video) return;

            let animationId;
            let lastTime = performance.now();
            let isReversing = false;

            const updateLoop = () => {
                const now = performance.now();
                const delta = (now - lastTime) / 1000; // seconds
                lastTime = now;

                if (!video.duration) {
                    // Wait for metadata
                    animationId = requestAnimationFrame(updateLoop);
                    return;
                }

                if (VIDEO_CONFIG.loopType === 'bounce') {
                    // --- BOUNCE LOGIC ---
                    if (!isReversing) {
                        // FORWARD PHASE
                        // We use native play() for smoothness, but monitor position
                        if (video.paused) video.play().catch(() => {});
                        
                        // Turn around before the very end to prevent getting stuck
                        if (video.currentTime >= video.duration - 0.2) {
                            isReversing = true;
                            video.pause();
                        }
                    } else {
                        // BACKWARD PHASE
                        // Native players can't play backwards, so we Manual Scrub
                        if (!video.paused) video.pause();
                        
                        const step = delta * VIDEO_CONFIG.playbackSpeed;
                        // Protect against negative time
                        video.currentTime = Math.max(0, video.currentTime - step);
                        
                        // Turn around at start
                        if (video.currentTime <= 0.1) {
                            isReversing = false;
                        }
                    }
                } else {
                    // --- STANDARD LOOP ---
                    if (!video.loop) video.loop = true;
                    if (video.paused) video.play().catch(() => {});
                }

                animationId = requestAnimationFrame(updateLoop);
            };

            // Init
            video.playbackRate = VIDEO_CONFIG.playbackSpeed;
            animationId = requestAnimationFrame(updateLoop);

            return () => {
                cancelAnimationFrame(animationId);
            };
        }, [src]);

        return (
            <div className="absolute inset-0 w-full h-full overflow-hidden pointer-events-none">
                <div className={`absolute inset-0 z-20 ${VIDEO_CONFIG.enableGlitch ? 'animate-glitch' : ''}`}>
                    <video 
                        ref={videoRef}
                        muted 
                        playsInline
                        className="w-full h-full object-cover scale-110 mix-blend-screen"
                        style={{ filter: VIDEO_CONFIG.cssFilters }}
                    >
                        <source src={VIDEO_CONFIG.videoPath} type="assets/video/mp4" />
                    </video>
                </div>
                <div className="absolute inset-0 bg-transparent mix-blend-overlay z-10" style={{ backgroundImage: `url("${NOISE_SVG}")` }}></div>
            </div>
        );
    };

    // --- VISUAL LAYER ---
    const VisualLayer = ({ station }) => (
        <div className="absolute inset-0 overflow-hidden pointer-events-none bg-black transition-colors duration-1000">
            {/* Base Color Tints */}
            <div className={`absolute inset-0 transition-colors duration-1000 z-10 opacity-70 mix-blend-multiply ${
                station === 'body' ? 'bg-red-950' :
                station === 'mind' ? 'bg-indigo-950' :
                station === 'soul' ? 'bg-amber-950' :
                station === 'future' ? 'bg-fuchsia-950' :
                'bg-stone-900'
            }`}></div>
            
            {/* INTRO VIDEO LAYER - CONTROLLED BY VIDEO_CONFIG */}
            <div 
                className={`absolute inset-0 transition-opacity duration-1000 ease-in-out z-0 ${station === 'static' ? 'opacity-100' : 'opacity-0'}`}
                style={{ opacity: station === 'static' ? VIDEO_CONFIG.opacity : 0 }}
            >
                <IntroVideo src={VIDEO_CONFIG.videoPath} />
            </div>

            {/* IMAGE LAYERS - VISIBLE ON OTHER STATIONS */}
            {Object.entries(IMAGES).map(([key, src]) => (
                <div key={key} className={`absolute inset-0 transition-opacity duration-1000 ease-in-out ${station === key ? 'opacity-70' : 'opacity-0'}`}>
                    <img src={src} alt="" className="w-full h-full object-cover animate-slow-pan grayscale" />
                </div>
            ))}
        </div>
    );

    // --- CONTENT COMPONENT ---
    const StationContent = ({ type }) => {
        return (
            <div className="w-full max-w-3xl mx-auto pt-20 md:pt-28 pb-60 px-6 md:px-12 animate-fade-in text-shadow">
                {type === 'body' && (
                    <div className="space-y-32">
                        <section className="text-center space-y-6">
                            <Icons.Zap className="w-10 h-10 md:w-12 md:h-12 mx-auto text-red-500 animate-pulse" />
                            <h2 className="text-5xl md:text-8xl font-serif font-black text-red-100 tracking-tight drop-shadow-2xl">THE TREMOR</h2>
                            <p className="font-serif text-lg md:text-3xl text-red-200/90 leading-relaxed drop-shadow-md">"It takes your movement, but gives you a rhythm."</p>
                        </section>
                        <section className="bg-black/40 p-8 md:p-12 rounded-lg border border-red-500/20 backdrop-blur-md shadow-2xl">
                            <div className="flex flex-col items-center">
                                <img src={ARTWORKS.shakingMan} alt="Shaking Man" className="w-48 h-48 object-contain opacity-80 mb-6"/>
                                <p className="font-mono text-xs uppercase tracking-widest text-stone-500">Fig 1. "Shaken, Not Heard"</p>
                            </div>
                            <blockquote className="mt-8 font-serif italic text-xl text-stone-200 border-l-2 border-red-500 pl-6 leading-loose">
                                "My legs are twitching, muscles spasming as if preparing for action. Should I dance? I slide out of bed, slowly swaying in the dark."
                            </blockquote>
                        </section>
                        <section className="space-y-8 prose prose-invert prose-lg max-w-none">
                            <h3 className="text-4xl font-serif font-bold text-red-200">The Wrong Diagnosis</h3>
                            <p className="text-stone-300 font-serif text-xl leading-loose">In 2021, I received my diagnosis. It hit me like a storm coming through the backdoor, though looking back, the signs had been there for years.</p>
                            <p className="text-stone-300 font-serif text-xl leading-loose">But what I didn't know then is that Parkinson's also came with unexpected gifts. It became my teacher, revealing truths about resilience.</p>
                        </section>
                    </div>
                )}
                {type === 'mind' && (
                    <div className="space-y-32">
                        <section className="text-center space-y-6">
                            <Icons.Brain className="w-10 h-10 md:w-12 md:h-12 mx-auto text-indigo-500 animate-pulse" />
                            <h2 className="text-5xl md:text-8xl font-serif font-black text-indigo-100 tracking-tight drop-shadow-2xl">THE THIEF</h2>
                            <p className="font-serif text-lg md:text-3xl text-indigo-200/90 leading-relaxed drop-shadow-md">"You call me affliction. I call myself a witness."</p>
                        </section>
                        <section className="bg-black/40 p-8 md:p-12 rounded-lg border border-indigo-500/20 backdrop-blur-md shadow-2xl">
                            <div className="flex flex-col items-center">
                                <img src={ARTWORKS.heartMonster} alt="Heart Monster" className="w-48 h-48 object-contain opacity-80 mb-6"/>
                                <p className="font-mono text-xs uppercase tracking-widest text-stone-500">Fig 2. "The Smiling Monster"</p>
                            </div>
                            <blockquote className="mt-8 font-serif italic text-xl text-stone-200 border-l-2 border-indigo-500 pl-6 leading-loose">
                                "Parkinson's is a two-headed beast. My son draws the monsters I fear, and makes them smile."
                            </blockquote>
                        </section>
                        <section className="space-y-8 prose prose-invert prose-lg max-w-none">
                            <h3 className="text-4xl font-serif font-bold text-indigo-200">Trauma: Eyes Wide Open</h3>
                            <p className="text-stone-300 font-serif text-xl leading-loose">Darkness. Sweat, pain. Too early. Outside, a September storm rattles the house. Windows and doors communicate through squeaks, cracks, bangs—an orchestra for the restless.</p>
                        </section>
                    </div>
                )}
                {type === 'soul' && (
                    <div className="space-y-32">
                        <section className="text-center space-y-6">
                            <Icons.Heart className="w-10 h-10 md:w-12 md:h-12 mx-auto text-amber-500 animate-pulse" />
                            <h2 className="text-5xl md:text-8xl font-serif font-black text-amber-100 tracking-tight drop-shadow-2xl">THE LIGHT</h2>
                            <p className="font-serif text-lg md:text-3xl text-amber-200/90 leading-relaxed drop-shadow-md">"We made it to the light. The tonic waits in the quiet beat."</p>
                        </section>
                        <section className="bg-black/40 p-8 md:p-12 rounded-lg border border-amber-500/20 backdrop-blur-md shadow-2xl">
                            <div className="flex flex-col items-center">
                                <img src={ARTWORKS.stars} alt="Stars" className="w-full max-w-sm object-contain opacity-80 mb-6"/>
                                <p className="font-mono text-xs uppercase tracking-widest text-stone-500">Fig 3. "The Stars"</p>
                            </div>
                            <blockquote className="mt-8 font-serif italic text-xl text-stone-200 border-l-2 border-amber-500 pl-6 leading-loose">
                                "Maybe awe is the goal in life. A childlike gaze through the dark branches, trying to find the stars again."
                            </blockquote>
                        </section>
                        <section className="space-y-8 prose prose-invert prose-lg max-w-none">
                            <h3 className="text-4xl font-serif font-bold text-amber-200">The Unexpected Gift</h3>
                            <p className="text-stone-300 font-serif text-xl leading-loose">What if the workspace of the future isn’t a desk with a mouse, but a dance between mind and machine? I find myself increasingly drawn to the edges of what’s emerging.</p>
                        </section>
                    </div>
                )}
                {type === 'future' && (
                    <div className="space-y-32">
                        <section className="text-center space-y-6">
                            <Icons.Radio className="w-10 h-10 md:w-12 md:h-12 mx-auto text-fuchsia-500 animate-pulse" />
                            <h2 className="text-5xl md:text-8xl font-serif font-black text-fuchsia-100 tracking-tight drop-shadow-2xl">GME!</h2>
                            <p className="font-serif text-lg md:text-3xl text-fuchsia-200/90 leading-relaxed drop-shadow-md">"Infinity is just a sideways eight."</p>
                        </section>
                        <section className="bg-black/40 p-8 md:p-12 rounded-lg border border-fuchsia-500/20 backdrop-blur-md shadow-2xl">
                            <div className="flex flex-col items-center">
                                <img src={ARTWORKS.infinityMap} alt="Infinity Map" className="w-full max-w-sm object-contain opacity-80 mb-6"/>
                                <p className="font-mono text-xs uppercase tracking-widest text-stone-500">Fig 4. "Infinity Jimmy"</p>
                            </div>
                            <blockquote className="mt-8 font-serif italic text-xl text-stone-200 border-l-2 border-fuchsia-500 pl-6 leading-loose">
                                "What is behind the wall of the observable universe? 'Jimmy,' my son said. 'Jimmy is a girl. GME.'"
                            </blockquote>
                        </section>
                        <section className="space-y-8 prose prose-invert prose-lg max-w-none">
                            <h3 className="text-4xl font-serif font-bold text-fuchsia-200">The Stand-up Parkinsonian</h3>
                            <p className="text-stone-300 font-serif text-xl leading-loose">Living with Parkinson’s has taught me not only about loss, but about navigating limitations. I find myself increasingly drawn to the edges of what’s emerging: voice-driven control, AI, VR.</p>
                        </section>
                    </div>
                )}
            </div>
        );
    };

    // --- FOLIO MENU ---
    const FolioMenu = ({ isOpen, onClose }) => {
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 z-[100] bg-stone-950/98 backdrop-blur-xl overflow-y-auto animate-fade-in text-stone-200">
                <div className="max-w-4xl mx-auto min-h-screen p-6 md:p-12 flex flex-col">
                    <div className="flex justify-between items-center mb-12 border-b border-stone-800 pb-6">
                        <h2 className="font-serif font-bold text-3xl md:text-5xl text-white">THE MEMOIR</h2>
                        <button onClick={onClose} className="p-2 px-4 border border-stone-700 hover:bg-stone-800 rounded-full transition-colors flex items-center gap-2">
                             <span className="font-mono text-xs tracking-widest">BACK</span>
                             <Icons.X size={18} />
                        </button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                        <div className="space-y-8">
                            <div>
                                <h3 className="font-mono text-xs uppercase text-stone-500 mb-2 tracking-widest">About the Book</h3>
                                <p className="font-serif text-lg leading-relaxed text-stone-300">
                                    "Tonic for the Bones" is a forthcoming memoir—a collage of philosophy, art, and life. It explores the intersection of adversity and the soul, written from the perspective of an adoptee with Parkinson's.
                                </p>
                            </div>
                             <div>
                                <h3 className="font-mono text-xs uppercase text-stone-500 mb-2 tracking-widest">Get Updates</h3>
                                <p className="font-sans text-sm text-stone-400 leading-relaxed mb-4">
                                    The book is currently in production. Join the list to be notified when it arrives.
                                </p>
                                <a href="mailto:david.enker@gmail.com?subject=Tonic for the Bones - Waitlist&body=Please add me to the mailing list for the upcoming book release." 
                                   className="inline-flex items-center gap-3 px-6 py-3 bg-stone-100 text-black font-mono text-xs uppercase tracking-widest hover:bg-white transition-all rounded-sm group">
                                    <Icons.Mail size={16} />
                                    <span>Join Waitlist</span>
                                </a>
                            </div>
                            <div>
                                <h3 className="font-mono text-xs uppercase text-stone-500 mb-2 tracking-widest">Author</h3>
                                <p className="font-sans text-sm text-stone-400 leading-relaxed">David Enker. Creative Designer, Writer.<br/>Haarlem, The Netherlands.</p>
                            </div>
                        </div>
                        <div>
                            <h3 className="font-mono text-xs uppercase text-stone-500 mb-4 tracking-widest">Index</h3>
                            <div className="grid gap-3">
                                {[
                                    { title: "Connect on Instagram", url: "http://instagram.com/davidje", icon: Icons.Instagram, desc: "@davidje" },
                                    { title: "The Folio", url: "https://davidenker.com/folio", icon: Icons.BookOpen, desc: "Archive" },
                                    { title: "Photo Gallery", url: "https://photos.app.goo.gl/Qtdnqgy3bR4j61ut9", icon: Icons.Image, desc: "Visuals" },
                                    { title: "Spotify Playlist", url: "https://open.spotify.com/playlist/6fdgo7q6wuk9H0JZCYKUb6?si=fdd0e1b77fea43ce", icon: Icons.Play, desc: "Audio" }
                                ].map((item, i) => (
                                    <a key={i} href={item.url} target="_blank" rel="noopener noreferrer" className="flex items-center justify-between p-4 bg-stone-900 border border-stone-800 hover:bg-stone-800 rounded-sm group transition-all">
                                        <div className="flex items-center gap-3">
                                            <item.icon className="w-5 h-5 text-stone-500 group-hover:text-white" />
                                            <div>
                                                <div className="font-mono text-sm uppercase tracking-wide text-stone-300 group-hover:text-white">{item.title}</div>
                                                <div className="font-serif text-xs italic text-stone-500">{item.desc}</div>
                                            </div>
                                        </div>
                                        <Icons.ExternalLink size={14} className="text-stone-600 group-hover:text-white" />
                                    </a>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    // --- MAIN ---
    function App() {
        const [stationIndex, setStationIndex] = useState(0); 
        const [rotation, setRotation] = useState(0);
        const [isFolioOpen, setIsFolioOpen] = useState(false);
        const [isMuted, setIsMuted] = useState(false);
        const [hasInteracted, setHasInteracted] = useState(false);
        const [locationIndex, setLocationIndex] = useState(0);
        const [showScrollPrompt, setShowScrollPrompt] = useState(true);
        const audioRef = useRef(new Audio());
        const scrollContainerRef = useRef(null);
        
        const stations = ['static', 'body', 'mind', 'soul', 'future'];
        const currentStation = stations[stationIndex];

        // Scroll Tracker
        useEffect(() => {
            const el = scrollContainerRef.current;
            if (!el) return;
            const handleScroll = () => {
                const isNearBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 100;
                if (isNearBottom) {
                    setShowScrollPrompt(false);
                } else {
                    setShowScrollPrompt(true);
                }
            };
            el.addEventListener('scroll', handleScroll);
            return () => el.removeEventListener('scroll', handleScroll);
        }, [stationIndex]);

        useEffect(() => { setShowScrollPrompt(true); }, [stationIndex]);

        // Location Cycler
        useEffect(() => {
            let interval;
            if (hasInteracted && currentStation === 'static') {
                interval = setInterval(() => {
                    setLocationIndex(prev => (prev + 1) % LOCATIONS.length);
                    setRotation(prev => prev + 15);
                }, 300);
            }
            return () => clearInterval(interval);
        }, [hasInteracted, currentStation]);

        // Audio Engine
        useEffect(() => {
            const handleInteraction = () => {};
            window.addEventListener('click', handleInteraction);
            return () => window.removeEventListener('click', handleInteraction);
        }, []);

        useEffect(() => {
            const audio = audioRef.current;
            const trackUrl = AUDIO_TRACKS[currentStation];

            audio.pause();
            
            if (trackUrl) {
                audio.src = trackUrl;
                audio.loop = true;
                
                if (hasInteracted && !isMuted) {
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => console.log("Auto-play prevented"));
                    }
                }
            }
        }, [currentStation, hasInteracted, isMuted]);

        // Keyboard navigation
        useEffect(() => {
            const handleKeyDown = (e) => {
                if (e.key === 'ArrowRight') handleNext();
                if (e.key === 'ArrowLeft') handlePrev();
            };
            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
        }, [stationIndex]);

        // Scroll Reset
        useLayoutEffect(() => {
            if(scrollContainerRef.current) {
                scrollContainerRef.current.scrollTo({ top: 0, behavior: 'instant' });
            }
        }, [stationIndex]);

        const initSignal = () => {
            if (!hasInteracted) {
                setHasInteracted(true);
                if (!isMuted && audioRef.current.paused) {
                    audioRef.current.play().catch(e => console.log("Audio play blocked"));
                }
            }
        };

        const handleDialClick = () => {
            if (!hasInteracted) {
                initSignal();
            } else if (currentStation === 'static') {
                setStationIndex(1);
                setRotation(prev => prev + 72);
            } else {
                handleNext();
            }
        };

        const handleNext = () => {
            if (!hasInteracted) {
                initSignal();
                return;
            }
            setStationIndex((prev) => (prev + 1) % stations.length);
            setRotation(prev => prev + 72);
        };

        const handlePrev = () => {
            if (!hasInteracted) {
                initSignal();
                return;
            }
            setStationIndex((prev) => (prev - 1 + stations.length) % stations.length);
            setRotation(prev => prev - 72);
        };

        const toggleMute = () => {
            setIsMuted(!isMuted);
            if (!isMuted) audioRef.current.pause();
            else if (hasInteracted) audioRef.current.play();
        };

        const handleReadMore = () => {
            if (!scrollContainerRef.current) return;
            const startY = scrollContainerRef.current.scrollTop;
            const distance = window.innerHeight * 0.8; 
            const duration = 2500; 
            const startTime = performance.now();
            const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

            const animate = (currentTime) => {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = easeInOutCubic(progress);
                scrollContainerRef.current.scrollTop = startY + (distance * easedProgress);
                if (elapsed < duration) requestAnimationFrame(animate);
            };
            requestAnimationFrame(animate);
        };

        return (
            <div className="fixed inset-0 w-full h-full text-white font-sans">
                <div className="absolute inset-0 opacity-[0.05] pointer-events-none z-0" style={{ backgroundImage: `url("${NOISE_SVG}")` }}></div>
                <VisualLayer station={currentStation} />
                
                {/* --- HEADER --- */}
                <nav className="absolute top-0 w-full p-4 md:p-6 flex justify-between items-start z-50 mix-blend-difference">
                    <div onClick={() => window.location.reload()} className="cursor-pointer group select-none max-w-[70%] md:max-w-none">
                        <div className="flex flex-col">
                            <h1 className={`font-serif font-black tracking-tighter leading-none text-stone-100 transition-all duration-700 ${currentStation === 'static' ? 'text-6xl md:text-9xl' : 'text-5xl md:text-6xl'}`}>TONIC</h1>
                            <div className="flex flex-col md:flex-row md:items-baseline gap-2">
                                <h2 className={`font-serif font-bold tracking-tight text-stone-300 leading-none transition-all duration-700 ${currentStation === 'static' ? 'text-2xl md:text-5xl -mt-1 md:-mt-3 ml-1' : 'text-lg md:text-2xl -mt-1 ml-0.5'}`}>FOR THE BONES</h2>
                                {currentStation === 'static' && (
                                    <div className="font-mono text-[10px] md:text-xs uppercase tracking-[0.3em] text-orange-500 md:ml-4 animate-fade-in opacity-80 whitespace-nowrap">
                                        The Upcoming Memoir
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className={`font-serif italic text-stone-400 block transition-all duration-700 border-l-2 border-stone-600 pl-3 mt-3 ${currentStation === 'static' ? 'opacity-100 max-h-20' : 'opacity-0 max-h-0 overflow-hidden'}`}>
                            <p className="text-[10px] md:text-sm leading-tight max-w-xs">"Life is but a brief crack of light between two eternities of darkness"</p>
                            <p className="text-[8px] md:text-xs uppercase tracking-widest mt-1 text-stone-500">— Nabokov</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-4">
                        <button onClick={() => setIsFolioOpen(true)} className="flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 backdrop-blur rounded-full transition-all border border-white/20">
                            <span className="font-mono text-xs uppercase tracking-widest">About</span>
                        </button>
                    </div>
                </nav>

                {/* --- MAIN CONTENT AREA --- */}
                <main ref={scrollContainerRef} className="absolute inset-0 z-10 overflow-y-auto custom-scrollbar">
                    {currentStation === 'static' ? (
                        <div className="min-h-screen flex flex-col justify-center items-center text-center space-y-8">
                            <div className={`w-px h-32 bg-gradient-to-b from-transparent via-white to-transparent shadow-[0_0_20px_rgba(255,255,255,0.5)] ${hasInteracted ? 'animate-glitch' : 'animate-flicker'}`}></div>
                            <div className="h-24 flex flex-col justify-start items-center">
                                {hasInteracted ? (
                                    <div className="animate-fade-in">
                                        <h2 className="font-serif text-3xl md:text-5xl italic text-stone-300 mb-2">{LOCATIONS[locationIndex]}</h2>
                                        <p className="font-mono text-xs uppercase tracking-widest text-orange-500 animate-pulse">• Signal Searching</p>
                                    </div>
                                ) : (
                                    <div className="animate-fade-in cursor-pointer" onClick={initSignal}>
                                        <h2 className="font-serif text-lg md:text-xl italic text-stone-500 hover:text-stone-300 transition-colors duration-500 tracking-wide">click dial to initialize</h2>
                                        <div className="mt-2 flex justify-center animate-bounce text-stone-600"><Icons.ChevronsDown size={14} /></div>
                                    </div>
                                )}
                            </div>
                        </div>
                    ) : (
                        <StationContent type={currentStation} />
                    )}
                </main>

                {/* --- FLOATING SCROLL INDICATOR --- */}
                {currentStation !== 'static' && (
                     <div className={`fixed bottom-32 left-1/2 -translate-x-1/2 z-40 transition-all duration-700 pointer-events-none ${showScrollPrompt ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`}>
                        <div onClick={handleReadMore} className="flex flex-col items-center animate-bounce cursor-pointer pointer-events-auto">
                             <div className={`p-2 rounded-full border bg-black/50 backdrop-blur-md ${currentStation === 'body' ? 'border-red-500/50 text-red-200' : currentStation === 'mind' ? 'border-indigo-500/50 text-indigo-200' : currentStation === 'soul' ? 'border-amber-500/50 text-amber-200' : 'border-fuchsia-500/50 text-fuchsia-200'}`}>
                                <Icons.ArrowDown className="w-5 h-5" />
                            </div>
                            <span className="mt-2 text-[10px] uppercase tracking-[0.2em] text-stone-400 font-mono bg-black/50 px-2 py-0.5 rounded">Read More</span>
                        </div>
                     </div>
                )}

                {/* --- FOOTER / CONTROLS --- */}
                <footer className="absolute bottom-0 w-full p-2 md:p-8 z-[60] bg-gradient-to-t from-black via-black/90 to-transparent pointer-events-none pb-8 md:pb-8">
                    <div className="absolute bottom-4 right-4 md:right-8 pointer-events-auto">
                        <button onClick={toggleMute} className="font-mono text-[10px] uppercase tracking-widest text-stone-500 hover:text-white transition-colors flex items-center gap-2">
                             <span>AUDIO</span>
                             <span className={isMuted ? "text-red-500" : "text-green-500"}>{isMuted ? "OFF" : "ON"}</span>
                        </button>
                    </div>
                    <div className="absolute bottom-4 left-4 md:left-8 pointer-events-auto">
                        <div className="font-mono text-[10px] uppercase tracking-[0.2em] text-stone-500">FREQ: {currentStation.toUpperCase()}</div>
                    </div>
                    <div className="max-w-xl mx-auto flex flex-col items-center gap-4 pointer-events-auto">
                        <div className="flex items-center justify-center gap-6 md:gap-12 w-full">
                            <button onClick={handlePrev} className="w-16 h-16 md:w-14 md:h-14 shrink-0 rounded-full bg-stone-900 border border-stone-600 flex items-center justify-center transition-all active:scale-95 hover:bg-stone-800 hover:border-stone-400 shadow-[0_0_15px_rgba(0,0,0,0.5)] z-50 text-stone-200"><Icons.ChevronLeft size={32} /></button>
                            <div onClick={handleDialClick} className={`relative w-24 h-24 md:w-20 md:h-20 shrink-0 rounded-full border-2 border-stone-600 bg-stone-900 flex items-center justify-center shadow-2xl transition-transform duration-500 cursor-pointer hover:border-orange-500/50 active:scale-95 ${hasInteracted && currentStation === 'static' ? 'rotate-step' : ''}`} style={{ transform: `rotate(${rotation}deg)` }}>
                                <div className={`absolute w-1.5 h-8 md:h-6 bg-orange-600 rounded-full top-2 shadow-[0_0_10px_rgba(249,115,22,0.8)] ${hasInteracted && currentStation === 'static' ? 'animate-pulse' : ''}`}></div>
                                <div className="absolute inset-2 rounded-full border border-stone-800/50"></div>
                            </div>
                            <button onClick={handleNext} className="w-16 h-16 md:w-14 md:h-14 shrink-0 rounded-full bg-stone-900 border border-stone-600 flex items-center justify-center transition-all active:scale-95 hover:bg-stone-800 hover:border-stone-400 shadow-[0_0_15px_rgba(0,0,0,0.5)] z-50 text-stone-200"><Icons.ChevronRight size={32} /></button>
                        </div>
                    </div>
                </footer>
                <FolioMenu isOpen={isFolioOpen} onClose={() => setIsFolioOpen(false)} />
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
