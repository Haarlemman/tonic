    <style>
        :root {
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'DM Serif Display', serif;
            --font-mono: 'DM Mono', monospace;
        }

        html {
            background-color: #0c0a09;
        }

        body {
            font-family: var(--font-sans);
            background-color: #0c0a09;
            color: #e7e5e4;
            overflow: hidden;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .text-shadow {
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* Animations */
        @keyframes fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slow-pan {
            0% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1.2) translate(-2%, -2%);
            }
        }

        /* Glitch Animation */
        @keyframes glitch {
            0% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }

            5% {
                opacity: 0.8;
                transform: scaleY(0.9) skewX(5deg);
            }

            10% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }

            15% {
                opacity: 0.4;
                transform: scaleY(1.1) skewX(-5deg);
            }

            20% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }

            45% {
                opacity: 1;
                transform: scaleY(1) skewX(3deg);
            }

            50% {
                opacity: 0.5;
                transform: scaleY(0.9) skewX(0deg);
            }

            55% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }

            80% {
                opacity: 1;
                transform: scaleY(1) skewX(-3deg);
            }

            85% {
                opacity: 0.7;
                transform: scaleY(1.05) skewX(0deg);
            }

            90% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }

            100% {
                opacity: 1;
                transform: scaleY(1) skewX(0deg);
            }
        }

        /* Flicker Animation */
        @keyframes flicker {

            0%,
            19%,
            21%,
            23%,
            25%,
            54%,
            56%,
            100% {
                opacity: 0.9;
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            }

            20%,
            24%,
            55% {
                opacity: 0.2;
                box-shadow: none;
            }

            70% {
                opacity: 0.7;
            }

            72% {
                opacity: 0.2;
            }

            74% {
                opacity: 0.9;
            }
        }

        .animate-fade-in {
            animation: fade-in 1s ease-out forwards;
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.8s ease-out forwards;
        }

        .animate-slow-pan {
            animation: slow-pan 20s infinite alternate ease-in-out;
        }

        .animate-glitch {
            animation: glitch 2s infinite steps(2);
        }

        .animate-flicker {
            animation: flicker 4s infinite;
        }

        .rotate-step {
            transition: transform 0.2s cubic-bezier(0.4, 2.5, 0.55, 0.45);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
