<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good vs. Bad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; color: white; font-family: sans-serif; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background-color: #4ade80; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 4px solid #333; }
        #ui-layer { position: absolute; top: 10px; left: 10px; pointer-events: none; z-index: 20; }
        .hud-text { font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px black; }
        
        #lobby, #game-over { position: absolute; z-index: 9999; background: rgba(0,0,0,0.9); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #game-over { display: none; }
        
        input { 
            padding: 15px; 
            border-radius: 8px; 
            border: 3px solid #555; 
            margin-bottom: 20px; 
            color: #000000 !important; 
            background-color: #ffffff !important; 
            width: 300px; 
            text-align: center; 
            font-size: 20px;
            font-weight: bold;
            pointer-events: auto !important;
            z-index: 10000;
        }
        input:focus {
            outline: none;
            border-color: #facc15; 
            box-shadow: 0 0 15px #facc15;
            background-color: #fffbeb !important;
        }

        button { 
            padding: 20px 40px; 
            background: #22c55e; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 24px; 
            transition: all 0.2s; 
            z-index: 10000; 
            pointer-events: auto; 
            box-shadow: 0 6px 0 #16a34a; 
            min-width: 200px;
        }
        button:hover { background: #16a34a; transform: translateY(-2px); }
        button:active { transform: translateY(4px); box-shadow: none; }
        
        .status-line { margin-top: 20px; color: #4ade80; font-size: 18px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="lobby">
        <h1 class="text-6xl mb-8 font-bold text-yellow-400" style="text-shadow: 4px 4px 0 #000;">Good vs. Bad</h1>
        
        <label class="text-lg text-gray-300 mb-2">Wie ben jij?</label>
        <input type="text" id="playerNameInput" placeholder="Typ hier je naam..." maxlength="12" autocomplete="off">
        
        <button id="joinBtn">START SPEL</button>
        <p id="statusMsg" class="status-line">Klaar om te starten!</p>
    </div>

    <div id="game-over">
        <h1 id="winnerTitle" class="text-6xl mb-4 font-bold text-white">GAME OVER</h1>
        <button onclick="location.reload()">Opnieuw Spelen</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-text" id="playerInfo"></div>
        <div class="hud-text text-yellow-300" style="font-size: 14px; margin-top: 5px;">Besturing: Pijltjes = Bewegen | Spatie = Schieten | TAB = Wissel Soldaat</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let playerRole = 'red';
    let myName = "Speler";
    let gameState = null;
    let gameActive = false;
    
    canvas.width = 1000;
    canvas.height = 600;

    const TEAM_RED = 'red';
    const TEAM_BLUE = 'blue';
    const UNIT_TYPES = {
        KING: { hp: 500, speed: 0, width: 60, height: 60, label: 'Koning' },
        TOWER: { hp: 300, speed: 0, width: 50, height: 80, label: 'Toren' },
        TANK: { hp: 150, speed: 2, width: 50, height: 40, label: 'Tank' },
        PLANE: { hp: 80, speed: 5, width: 40, height: 40, label: 'Vliegtuig' },
        SOLDIER: { hp: 50, speed: 3, width: 20, height: 30, label: 'Soldaat' }
    };

    let activeUnitIndex = 0;
    let keys = {};
    let lastShotTime = 0;

    const nameInput = document.getElementById('playerNameInput');
    nameInput.addEventListener('keydown', (e) => e.stopPropagation());
    nameInput.addEventListener('keypress', (e) => e.stopPropagation());
    nameInput.addEventListener('keyup', (e) => e.stopPropagation());
    
    setTimeout(() => nameInput.focus(), 100);

    document.getElementById('joinBtn').addEventListener('click', () => {
        const nameInputVal = document.getElementById('playerNameInput').value.trim();
        myName = nameInputVal || "Speler";
        
        createGame();
        startGame();
    });

    function createGame() {
        const initialUnits = createArmy(TEAM_RED).concat(createArmy(TEAM_BLUE));
        const potions = [
            {id: 'hp1', x: 400, y: 100, used: false}, 
            {id: 'hp2', x: 600, y: 500, used: false},
            {id: 'hp3', x: 500, y: 300, used: false}
        ];

        gameState = {
            nameRed: myName,
            nameBlue: "Computer",
            units: initialUnits,
            potions: potions
        };
    }

    function createArmy(team) {
        let units = [];
        const isRed = team === TEAM_RED;
        const baseX = isRed ? 50 : 900;
        const forwardDir = isRed ? 1 : -1;
        
        let idCounter = 0;
        const genId = () => `${team}_${idCounter++}`;

        units.push({ ...UNIT_TYPES.KING, id: genId(), team, x: baseX, y: 270, maxHp: UNIT_TYPES.KING.hp });
        units.push({ ...UNIT_TYPES.TOWER, id: genId(), team, x: baseX + (100 * forwardDir), y: 260, maxHp: UNIT_TYPES.TOWER.hp });
        units.push({ ...UNIT_TYPES.TANK, id: genId(), team, x: baseX + (150 * forwardDir), y: 100, maxHp: UNIT_TYPES.TANK.hp });
        units.push({ ...UNIT_TYPES.TANK, id: genId(), team, x: baseX + (150 * forwardDir), y: 450, maxHp: UNIT_TYPES.TANK.hp });

        for(let i=0; i<3; i++) {
            units.push({ ...UNIT_TYPES.PLANE, id: genId(), team, x: baseX + (50 * forwardDir), y: 50 + (i*200), maxHp: UNIT_TYPES.PLANE.hp });
        }

        for(let i=0; i<8; i++) {
            units.push({ ...UNIT_TYPES.SOLDIER, id: genId(), team, x: baseX + (200 * forwardDir), y: 50 + (i * 60), maxHp: UNIT_TYPES.SOLDIER.hp });
        }

        return units;
    }

    function enableGameControls() {
        if(document.activeElement) document.activeElement.blur();
        
        // Remove any existing listeners first
        document.onkeydown = null;
        document.onkeyup = null;

        document.addEventListener('keydown', (e) => {
            console.log('Key pressed:', e.key);
            keys[e.key] = true;
            if (e.key === 'Tab') {
                e.preventDefault();
                activeUnitIndex++;
                const myUnits = gameState.units.filter(u => u.team === playerRole && u.hp > 0);
                if (activeUnitIndex >= myUnits.length) activeUnitIndex = 0;
            }
            if (e.key === ' ') {
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
    }

    function startGame() {
        document.getElementById('lobby').style.display = 'none';
        gameActive = true;
        
        enableGameControls();
        
        document.getElementById('playerInfo').innerHTML = 
            `<span style="color:#ff6b6b; font-size:24px;">${gameState.nameRed}</span> <span style="font-size:16px; color:#aaa;">VS</span> <span style="color:#4dabf7; font-size:24px;">${gameState.nameBlue}</span>`;
        
        requestAnimationFrame(gameLoop);
    }
    
    function endGame(msg, color) {
        gameActive = false;
        const goScreen = document.getElementById('game-over');
        const title = document.getElementById('winnerTitle');
        title.innerText = msg;
        title.style.color = color;
        goScreen.style.display = 'flex';
    }

    function gameLoop() {
        if (!gameActive) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        if (!gameState) return;

        const myUnits = gameState.units.filter(u => u.team === playerRole && u.hp > 0);
        
        if (activeUnitIndex >= myUnits.length) activeUnitIndex = 0;
        
        const activeUnit = myUnits[activeUnitIndex];

        if (activeUnit && activeUnit.speed > 0) {
            if (keys['ArrowUp'] && activeUnit.y > 0) activeUnit.y -= activeUnit.speed;
            if (keys['ArrowDown'] && activeUnit.y < canvas.height - activeUnit.height) activeUnit.y += activeUnit.speed;
            if (keys['ArrowLeft'] && activeUnit.x > 0) activeUnit.x -= activeUnit.speed;
            if (keys['ArrowRight'] && activeUnit.x < canvas.width - activeUnit.width) activeUnit.x += activeUnit.speed;
        }

        const now = Date.now();
        if (keys[' '] && activeUnit && now - lastShotTime > 500) {
            console.log('Shooting!');
            shoot(activeUnit);
            lastShotTime = now;
        }

        gameState.potions.forEach((pot) => {
            if (!pot.used && activeUnit && checkCollision(activeUnit, {x: pot.x, y: pot.y, width: 20, height: 20})) {
                activeUnit.hp = Math.min(activeUnit.hp + 50, activeUnit.maxHp);
                pot.used = true;
            }
        });

        // Simple AI for enemy
        const enemyUnits = gameState.units.filter(u => u.team === TEAM_BLUE && u.hp > 0 && u.speed > 0);
        enemyUnits.forEach(enemy => {
            // Move towards red base
            if (Math.random() < 0.3) {
                if (enemy.x > 100) enemy.x -= enemy.speed * 0.5;
                
                // Random vertical movement
                if (Math.random() < 0.1) {
                    if (enemy.y > canvas.height / 2) enemy.y -= enemy.speed;
                    else enemy.y += enemy.speed;
                }
            }
            
            // Enemy shoots randomly
            if (Math.random() < 0.05) {
                shoot(enemy);
            }
        });

        // Check win condition
        const kings = gameState.units.filter(u => u.label === 'Koning');
        const redKing = kings.find(k => k.team === TEAM_RED);
        const blueKing = kings.find(k => k.team === TEAM_BLUE);

        if (redKing && redKing.hp <= 0) endGame(`${gameState.nameBlue} WINT!`, '#4dabf7');
        if (blueKing && blueKing.hp <= 0) endGame(`${gameState.nameRed} WINT!`, '#ff6b6b');
    }

    function shoot(unit) {
        const isRed = unit.team === TEAM_RED;
        const enemies = gameState.units.filter(u => u.team !== playerRole && u.hp > 0);
        
        const bulletX = unit.x + (unit.width/2);
        const bulletY = unit.y + (unit.height/2);
        const range = unit.label === 'Soldaat' ? 100 : 600;

        for (let enemy of enemies) {
            const dist = Math.abs(enemy.x - bulletX);
            const yDist = Math.abs(enemy.y - bulletY);
            
            if (isRed && enemy.x > bulletX && dist < range && yDist < 30) {
                enemy.hp -= 10;
                break;
            } else if (!isRed && enemy.x < bulletX && dist < range && yDist < 30) {
                enemy.hp -= 10;
                break;
            }
        }
    }

    function draw() {
        ctx.fillStyle = '#3f6b2f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (!gameState) return;

        gameState.potions.forEach(pot => {
            if (!pot.used) {
                ctx.fillStyle = 'purple';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 5;
                ctx.fillRect(pot.x, pot.y, 20, 20);
                ctx.shadowBlur = 0;
            }
        });

        gameState.units.forEach(unit => {
            if (unit.hp <= 0) return;

            const isMine = unit.team === playerRole;
            const myUnits = gameState.units.filter(u => u.team === playerRole && u.hp > 0);
            const isActive = isMine && myUnits[activeUnitIndex] && myUnits[activeUnitIndex].id === unit.id;

            if (isActive) {
                ctx.strokeStyle = 'yellow';
                ctx.lineWidth = 4;
                ctx.strokeRect(unit.x - 5, unit.y - 5, unit.width + 10, unit.height + 10);
            }

            let color = unit.team === TEAM_RED ? '#d32f2f' : '#1976d2';
            ctx.fillStyle = color;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 5;
            ctx.fillRect(unit.x, unit.y, unit.width, unit.height);
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = 'white';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(unit.label, unit.x + unit.width/2, unit.y + unit.height/2 + 3);

            const hpPct = unit.hp / unit.maxHp;
            ctx.fillStyle = 'red';
            ctx.fillRect(unit.x, unit.y - 10, unit.width, 5);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(unit.x, unit.y - 10, unit.width * hpPct, 5);
        });
    }

    function checkCollision(rect1, rect2) {
        return (rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y);
    }

</script>
</body>
</html>
