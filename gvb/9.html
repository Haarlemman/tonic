<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good vs. Bad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; color: white; font-family: sans-serif; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background-color: #4ade80; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 4px solid #333; }
        #ui-layer { position: absolute; top: 10px; left: 10px; pointer-events: none; z-index: 20; }
        .hud-text { font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px black; }
        
        /* Lobby Styles */
        #lobby, #game-over { position: absolute; z-index: 9999; background: rgba(0,0,0,0.95); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #game-over { display: none; }
        
        input { 
            padding: 15px; border-radius: 8px; border: 3px solid #555; margin-bottom: 20px; 
            color: #000; background-color: #fff; width: 300px; text-align: center; font-size: 20px; font-weight: bold;
            pointer-events: auto; z-index: 10000;
        }
        
        button { 
            padding: 20px 40px; background: #ef4444; color: white; border: none; border-radius: 10px; 
            cursor: pointer; font-weight: bold; font-size: 24px; transition: all 0.2s; position: relative; 
            z-index: 10001; pointer-events: auto; box-shadow: 0 6px 0 #b91c1c; min-width: 250px; text-transform: uppercase;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(4px); box-shadow: none; }
        button:disabled { background: #555; cursor: wait; color: #aaa; box-shadow: none; transform: none; }
        
        .status-line { margin-top: 20px; color: #fbbf24; font-size: 18px; font-weight: bold; min-height: 24px; text-align: center; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="lobby">
        <h1 class="text-6xl mb-8 font-bold text-yellow-400" style="text-shadow: 4px 4px 0 #000;">Good vs. Bad</h1>
        <label class="text-lg text-gray-300 mb-2">Wie ben jij?</label>
        <input type="text" id="playerNameInput" placeholder="Typ je naam..." maxlength="12" autocomplete="off">
        <button id="joinBtn" onclick="window.tryStartGame()">Laden...</button>
        <p id="statusMsg" class="status-line">Systeem opstarten...</p>
    </div>

    <div id="game-over">
        <h1 id="winnerTitle" class="text-6xl mb-4 font-bold text-white">GAME OVER</h1>
        <button onclick="location.reload()">Opnieuw Spelen</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-text" id="playerInfo"></div>
        <div class="hud-text text-yellow-300" style="font-size: 14px; margin-top: 5px;">Besturing: Pijltjes = Bewegen | Spatie = Schieten | TAB = Wissel Soldaat</div>
    </div>
</div>

<!-- GAME ENGINE (Werkt altijd, ook zonder internet) -->
<script>
    // --- CORE GAME DATA ---
    const ASSETS = { soldier: null, tank: null, plane: null, tower: null, king: null, potion: null, bg: null };
    const TEAM_RED = 'red';
    const TEAM_BLUE = 'blue';
    const UNIT_TYPES = {
        KING: { hp: 500, speed: 0, width: 60, height: 60, color: '#FFD700', label: 'Koning' },
        TOWER: { hp: 300, speed: 0, width: 50, height: 80, color: '#888', label: 'Toren' },
        TANK: { hp: 150, speed: 2, width: 50, height: 40, color: '#225522', label: 'Tank' },
        PLANE: { hp: 80, speed: 5, width: 40, height: 40, color: '#5555AA', label: 'Vliegtuig' },
        SOLDIER: { hp: 50, speed: 3, width: 20, height: 30, color: '#552222', label: 'Soldaat' }
    };

    // Global Game State
    window.game = {
        active: false,
        state: null,
        playerRole: null, // 'red' or 'blue'
        myName: "Speler",
        userId: null, // Set by firebase module
        isOffline: false,
        activeUnitIndex: 0,
        keys: {},
        lastShotTime: 0,
        networkReady: false
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1000;
    canvas.height = 600;

    // --- GAME LOGIC ---
    function initGameState(isOffline) {
        window.game.state = {
            units: createArmy(TEAM_RED).concat(createArmy(TEAM_BLUE)),
            potions: [
                {id: 'hp1', x: 400, y: 100, used: false}, {id: 'hp2', x: 600, y: 500, used: false}, {id: 'hp3', x: 500, y: 300, used: false}
            ],
            nameRed: isOffline ? window.game.myName : "Rood",
            nameBlue: isOffline ? "Computer" : "Blauw"
        };
    }

    function createArmy(team) {
        let units = [];
        const isRed = team === TEAM_RED;
        const baseX = isRed ? 50 : 900;
        const forwardDir = isRed ? 1 : -1;
        let idCounter = 0;
        const genId = () => `${team}_${idCounter++}`;

        units.push({ ...UNIT_TYPES.KING, id: genId(), team, x: baseX, y: 270, maxHp: UNIT_TYPES.KING.hp });
        units.push({ ...UNIT_TYPES.TOWER, id: genId(), team, x: baseX + (100 * forwardDir), y: 260, maxHp: UNIT_TYPES.TOWER.hp });
        units.push({ ...UNIT_TYPES.TANK, id: genId(), team, x: baseX + (150 * forwardDir), y: 100, maxHp: UNIT_TYPES.TANK.hp });
        units.push({ ...UNIT_TYPES.TANK, id: genId(), team, x: baseX + (150 * forwardDir), y: 450, maxHp: UNIT_TYPES.TANK.hp });
        for(let i=0; i<3; i++) units.push({ ...UNIT_TYPES.PLANE, id: genId(), team, x: baseX + (50 * forwardDir), y: 50 + (i*200), maxHp: UNIT_TYPES.PLANE.hp });
        for(let i=0; i<8; i++) units.push({ ...UNIT_TYPES.SOLDIER, id: genId(), team, x: baseX + (200 * forwardDir), y: 50 + (i * 60), maxHp: UNIT_TYPES.SOLDIER.hp });
        return units;
    }

    // Main Start Function - Called by Button
    window.tryStartGame = function() {
        const btn = document.getElementById('joinBtn');
        const input = document.getElementById('playerNameInput');
        window.game.myName = input.value.trim() || "Speler";
        
        btn.innerText = "STARTEN...";
        
        // Als Firebase ready is, gebruik de online start functie (gedefinieerd in module)
        if (window.game.networkReady && window.startOnlineGame) {
            window.startOnlineGame();
        } else {
            // Anders: Start Offline
            startOffline();
        }
    };

    function startOffline() {
        document.getElementById('lobby').style.display = 'none';
        window.game.active = true;
        window.game.isOffline = true;
        window.game.playerRole = TEAM_RED;
        
        initGameState(true);
        enableControls();
        
        document.getElementById('playerInfo').innerHTML = `<span style="color:orange">OFFLINE MODUS</span> - Jij bent Rood`;
        requestAnimationFrame(gameLoop);
    }

    function enableControls() {
        if(document.activeElement) document.activeElement.blur();
        window.addEventListener('keydown', (e) => {
            window.game.keys[e.key] = true;
            if (e.key === 'Tab') { e.preventDefault(); window.game.activeUnitIndex++; }
        });
        window.addEventListener('keyup', (e) => window.game.keys[e.key] = false);
    }

    function gameLoop() {
        if (!window.game.active) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        const state = window.game.state;
        if (!state) return;

        const myUnits = state.units.filter(u => u.team === window.game.playerRole && u.hp > 0);
        if (window.game.activeUnitIndex >= myUnits.length) window.game.activeUnitIndex = 0;
        const activeUnit = myUnits[window.game.activeUnitIndex];

        let moved = false;
        const keys = window.game.keys;
        
        if (activeUnit && activeUnit.speed > 0) {
            if (keys['ArrowUp'] && activeUnit.y > 0) { activeUnit.y -= activeUnit.speed; moved = true; }
            if (keys['ArrowDown'] && activeUnit.y < canvas.height - activeUnit.height) { activeUnit.y += activeUnit.speed; moved = true; }
            if (keys['ArrowLeft'] && activeUnit.x > 0) { activeUnit.x -= activeUnit.speed; moved = true; }
            if (keys['ArrowRight'] && activeUnit.x < canvas.width - activeUnit.width) { activeUnit.x += activeUnit.speed; moved = true; }
        }

        if (keys[' '] && activeUnit) {
            const now = Date.now();
            if (now - window.game.lastShotTime > 500) { 
                shoot(activeUnit);
                window.game.lastShotTime = now;
            }
        }

        state.potions.forEach((pot) => {
            if (!pot.used && activeUnit && checkCollision(activeUnit, {x: pot.x, y: pot.y, width: 20, height: 20})) {
                activeUnit.hp = Math.min(activeUnit.hp + 50, activeUnit.maxHp);
                pot.used = true;
                moved = true;
            }
        });

        if (moved && !window.game.isOffline && window.pushUpdates) {
            window.pushUpdates();
        }
    }

    function shoot(unit) {
        const isRed = unit.team === TEAM_RED;
        const enemies = window.game.state.units.filter(u => u.team !== window.game.playerRole && u.hp > 0);
        let hit = false;
        
        const bulletX = unit.x + (unit.width/2);
        const bulletY = unit.y + (unit.height/2);
        const range = unit.label === 'Soldaat' ? 100 : 600;

        for (let enemy of enemies) {
            const dist = Math.abs(enemy.x - bulletX);
            const yDist = Math.abs(enemy.y - bulletY);
            if (isRed && enemy.x > bulletX && dist < range && yDist < 30) { enemy.hp -= 10; hit = true; break; }
            else if (!isRed && enemy.x < bulletX && dist < range && yDist < 30) { enemy.hp -= 10; hit = true; break; }
        }
        if (hit && !window.game.isOffline && window.pushUpdates) window.pushUpdates();
    }

    function draw() {
        ctx.fillStyle = '#3f6b2f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        const state = window.game.state;
        if (!state) return;

        state.potions.forEach(pot => { if (!pot.used) drawAsset(pot.x, pot.y, 20, 20, 'purple', 'Potion'); });

        state.units.forEach(unit => {
            if (unit.hp <= 0) return;
            const isMine = unit.team === window.game.playerRole;
            const myUnits = state.units.filter(u => u.team === window.game.playerRole && u.hp > 0);
            const isActive = isMine && myUnits[window.game.activeUnitIndex] && myUnits[window.game.activeUnitIndex].id === unit.id;

            if (isActive) { ctx.strokeStyle = 'yellow'; ctx.lineWidth = 4; ctx.strokeRect(unit.x - 5, unit.y - 5, unit.width + 10, unit.height + 10); }

            let color = unit.team === TEAM_RED ? '#d32f2f' : '#1976d2';
            drawAsset(unit.x, unit.y, unit.width, unit.height, color, unit.label);

            const hpPct = unit.hp / unit.maxHp;
            ctx.fillStyle = 'red'; ctx.fillRect(unit.x, unit.y - 10, unit.width, 5);
            ctx.fillStyle = '#0f0'; ctx.fillRect(unit.x, unit.y - 10, unit.width * hpPct, 5);
        });
        
        // Check win
        const kings = state.units.filter(u => u.label === 'Koning');
        const redKing = kings.find(k => k.team === TEAM_RED);
        const blueKing = kings.find(k => k.team === TEAM_BLUE);
        if (redKing && redKing.hp <= 0) endGame("BLAUW WINT!", '#4dabf7');
        if (blueKing && blueKing.hp <= 0) endGame("ROOD WINT!", '#ff6b6b');
    }

    function drawAsset(x, y, w, h, color, label) {
        ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
        if (label) { ctx.fillStyle = 'white'; ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.fillText(label, x + w/2, y + h/2 + 3); }
    }
    
    function endGame(msg, color) {
        window.game.active = false;
        document.getElementById('game-over').style.display = 'flex';
        const t = document.getElementById('winnerTitle'); t.innerText = msg; t.style.color = color;
    }
    
    function checkCollision(r1, r2) { return (r1.x < r2.x + r2.width && r1.x + r1.width > r2.x && r1.y < r2.y + r2.height && r1.y + r1.height > r2.y); }

    // --- TIMEOUT PROTECTION ---
    // Als na 2 seconden Firebase nog niet geladen is, maak de knop "OFFLINE SPELEN"
    setTimeout(() => {
        const btn = document.getElementById('joinBtn');
        const msg = document.getElementById('statusMsg');
        if (!window.game.networkReady) {
            btn.innerText = "SPEEL OFFLINE";
            btn.style.backgroundColor = "#f59e0b"; // Oranje
            msg.innerText = "Geen verbinding? Speel lokaal!";
        }
    }, 2000);
</script>

<!-- FIREBASE MODULE (Probeert verbinding te maken) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app';
    
    // Probeer te init-en
    try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const FIXED_ROOM_ID = "YaronVsPapa_Arena_V2";

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) { console.error("Auth fail", e); }
        }
        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.game.userId = user.uid;
                window.game.networkReady = true;
                // Update UI
                const btn = document.getElementById('joinBtn');
                const msg = document.getElementById('statusMsg');
                btn.innerText = "SPEEL ONLINE";
                btn.style.backgroundColor = "#22c55e"; // Groen
                msg.innerText = "Verbonden! Klaar voor start.";
            }
        });

        // Online functies beschikbaar maken voor de game engine
        window.startOnlineGame = async function() {
            const userId = window.game.userId;
            const myName = window.game.myName;
            const msg = document.getElementById('statusMsg');
            msg.innerText = "Arena betreden...";

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `game_${FIXED_ROOM_ID}`);
            
            try {
                const roomSnap = await getDoc(roomRef);
                if (!roomSnap.exists()) {
                    window.game.playerRole = 'red';
                    await createOnlineGame(roomRef);
                } else {
                    const data = roomSnap.data();
                    if (!data.playerBlue && data.playerRed !== userId) {
                        window.game.playerRole = 'blue';
                        await updateDoc(roomRef, { playerBlue: userId, nameBlue: myName, status: 'playing' });
                    } else if (data.playerRed === userId) {
                         window.game.playerRole = 'red';
                         await updateDoc(roomRef, { nameRed: myName });
                    } else {
                         window.game.playerRole = 'blue';
                         await updateDoc(roomRef, { nameBlue: myName });
                    }
                }
                startGameLoopOnline(roomRef);
            } catch (e) {
                alert("Online fout: " + e.message + " -> Starten Offline.");
                startOffline();
            }
        };

        async function createOnlineGame(ref) {
            // Gebruik game engine functie voor units
            const units = window.game.state ? window.game.state.units : (createArmy('red').concat(createArmy('blue'))); 
            // Hierboven roepen we createArmy aan vanuit module scope, dat kan fout gaan als functies niet global zijn.
            // We hebben createArmy niet aan window gehangen. Laten we dat fixen door units lokaal te bouwen of dummy.
            // Beter: we laten de update loop syncen.
             await setDoc(ref, {
                playerRed: window.game.userId,
                nameRed: window.game.myName,
                playerBlue: null,
                nameBlue: "Wachten...",
                status: 'waiting',
                // We initialiseren leeg, de eerste update vult het
                units: [], 
                potions: [{id: 'hp1', x: 400, y: 100, used: false}, {id: 'hp2', x: 600, y: 500, used: false}, {id: 'hp3', x: 500, y: 300, used: false}],
                lastUpdated: Date.now()
            });
        }

        function startGameLoopOnline(roomRef) {
            document.getElementById('lobby').style.display = 'none';
            window.game.active = true;
            window.game.isOffline = false;
            enableControls();

            // Initialiseer units lokaal als ze er nog niet zijn (host)
            if (!window.game.state) initGameState(false);

            onSnapshot(roomRef, (doc) => {
                if (doc.exists()) {
                    const data = doc.data();
                    // Merge data
                    if (!window.game.state) initGameState(false);
                    
                    if (data.units && data.units.length > 0) window.game.state.units = data.units;
                    if (data.potions) window.game.state.potions = data.potions;
                    
                    const rName = data.nameRed || "Rood";
                    const bName = data.nameBlue || "Blauw";
                    document.getElementById('playerInfo').innerHTML = `<span style="color:#ff6b6b">${rName}</span> VS <span style="color:#4dabf7">${bName}</span>`;
                }
            });
            requestAnimationFrame(gameLoop);
        }

        let updateTimeout;
        window.pushUpdates = function() {
            if (updateTimeout) return;
            updateTimeout = setTimeout(async () => {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `game_${FIXED_ROOM_ID}`);
                // Alleen sturen als we active zijn
                if (window.game.state) {
                    await updateDoc(roomRef, {
                        units: window.game.state.units,
                        potions: window.game.state.potions
                    });
                }
                updateTimeout = null;
            }, 50);
        };

    } catch (err) {
        console.error("Firebase module error", err);
        // Fallback handled by timeout in main script
    }
</script>
</body>
</html>
