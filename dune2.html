<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dune Odyssey: The Framework of Paradox</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            /* Gradient: Pale Yellow (#effac0) -> White -> Sky Blue -> Dark Deep Navy */
            background: linear-gradient(to top, 
                #effac0 0%, 
                #ffffff 10%, 
                #bae6fd 35%, 
                #075985 75%, 
                #020617 100%
            );
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* UI Overlays */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #020617;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #effac0;
            text-align: center;
            transition: opacity 1.5s ease;
        }

        #intro-text {
            font-size: 0.9rem;
            font-weight: 300;
            max-width: 400px;
            letter-spacing: 5px;
            margin-bottom: 40px;
            padding: 0 20px;
            text-transform: uppercase;
            line-height: 2.2;
        }

        .action-btn {
            background: transparent;
            border: 1px solid #effac0;
            color: #effac0;
            padding: 10px 35px;
            text-transform: uppercase;
            letter-spacing: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.75rem;
        }

        .action-btn:hover {
            background: #effac0;
            color: #020617;
        }

        #hud {
            position: absolute;
            top: 35px;
            left: 35px;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 2s;
        }

        .brand {
            color: #ff0000;
            border-left: 3px solid #993333;
            padding-left: 20px;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 900;
        }

        .brand p {
            margin: 5px 0 0;
            font-size: 0.6rem;
            opacity: 0.8;
            letter-spacing: 3px;
        }

        #faculty-screen {
            position: absolute;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #000;
            padding: 22px;
            pointer-events: none;
            display: none;
            z-index: 80;
            text-align: center;
            transform: translate(-50%, -120%);
            min-width: 220px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .neon-text {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 0.95rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .text-sphere { color: #1e3a8a; } /* Dark Blue */
        .text-tetra { color: #b91c1c; }  /* Red */
        .text-monolith { color: #000000; } /* Black */

        .sub-data { font-size: 0.5rem; color: #94a3b8; letter-spacing: 2px; font-family: monospace; }

        #audio-controls {
            position: absolute;
            bottom: 35px;
            right: 35px;
            z-index: 90;
            opacity: 0;
            transition: opacity 2s;
        }

        .hud-btn {
            background: #020617;
            border: none;
            color: #effac0;
            padding: 10px 20px;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .hud-btn:hover {
            transform: scale(1.05);
            background: #000;
        }
    </style>
</head>

<body>

    <audio id="bg-music" loop crossorigin="anonymous">
        <source src="assets/audio/MysteriousHeartbeat1.mp3" type="assets/audio/mpeg">
    </audio>

    <div id="intro-overlay">
        <div id="intro-text">Tonic for the Bones<br>The Paradox of the Framework</div>
        <button id="start-btn" class="action-btn">Enter</button>
    </div>

    <div id="hud">
        <div class="brand">
            <h1>Abstract<br>Frames</h1>
            <p>ADVERSITY IS YOUR TEACHER</p>
        </div>
    </div>

    <div id="audio-controls">
        <button class="hud-btn" onclick="toggleMusic()">AUDIO: <span id="music-status">OFF</span></button>
    </div>

    <div id="faculty-screen">
        <div id="screen-content" class="neon-text"></div>
        <div class="sub-data">FRAMEWORK PARAMETER ANALYSIS</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        let dunes, darkOrb, tetrahedron, monolith;
        let audioCtx, analyser, dataArray;
        let isAudioInit = false;
        let cinematicTarget = null;
        let lastZoomTime = Date.now();
        const ZOOM_INTERVAL = 11000;

        const POIs = [];
        const quotes = {
            sphere: ["THE DARK DEEP OBSERVER", "STILLNESS IN LIQUID BLUE", "MIDNIGHT REFLECTION", "A BLUE VOID"],
            tetra: ["SHARP RESISTANCE", "THE TRIANGLE OF ACTION", "A POINTED PARADOX", "GEOMETRIC WILL"],
            monolith: ["THE SILENT SENTINEL", "UNYIELDING FRAMEWORK", "ABSENCE OF LIGHT", "ETERNAL STRUCTURE"]
        };

        const screen = document.getElementById('faculty-screen');
        const screenContent = document.getElementById('screen-content');
        const bgMusic = document.getElementById('bg-music');

        function init() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(55, 45, 55);

            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.setClearColor(0x000000, 0); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2.3;

            // Stark Daylight Lighting
            const ambient = new THREE.AmbientLight(0xffeecc, 0.3);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xcc9922, 1.3);
            sun.position.set(50, 100, 30);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);

            createLandscape();
            createDarkOrb();
            createTetrahedron();
            createMonolith();

            window.addEventListener('resize', onResize);
            document.getElementById('start-btn').onclick = startExperience;
        }

        function createLandscape() {
            const geo = new THREE.PlaneGeometry(350, 350, 160, 160);
            const pos = geo.attributes.position;
            
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const z = Math.sin(x * 0.045) * Math.cos(y * 0.045) * 8 + 
                          Math.sin(x * 0.01) * 7;
                pos.setZ(i, z);
            }
            geo.computeVertexNormals();
            
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0xeffac0, 
                roughness: 1.0, 
                metalness: 0.0,
            });
            dunes = new THREE.Mesh(geo, mat);
            dunes.rotation.x = -Math.PI / 2;
            dunes.receiveShadow = true;
            scene.add(dunes);
        }

        function createDarkOrb() {
            const group = new THREE.Group();
            const mat = new THREE.MeshPhysicalMaterial({ 
                color: 0x000033, 
                emissive: 0x1e40af,
                emissiveIntensity: 0.15,
                roughness: 0.0, 
                transmission: 0.9,
                thickness: 3.0,
                clearcoat: 1.0
            });
            
            const orb = new THREE.Mesh(new THREE.SphereGeometry(4, 64, 64), mat);
            group.add(orb);

            group.position.set(-22, 7, -12);
            group.userData = { type: 'sphere', label: 'THE ORB' };
            scene.add(group);
            POIs.push(group);
            darkOrb = group;
        }

        function createTetrahedron() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0xef4444, 
                roughness: 0.1, 
                metalness: 0.4 
            });
            
            const tetra = new THREE.Mesh(new THREE.TetrahedronGeometry(5), mat);
            group.add(tetra);

            group.position.set(28, 6, -25);
            group.userData = { type: 'tetra', label: 'THE TRIANGLE' };
            scene.add(group);
            POIs.push(group);
            tetrahedron = group;
        }

        function createMonolith() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x000000, 
                roughness: 0.05, 
                metalness: 0.1 
            });
            
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(3, 14, 1.5), mat);
            group.add(pillar);

            group.position.set(10, 10, 35);
            group.rotation.y = Math.PI / 4;
            group.userData = { type: 'monolith', label: 'THE MONOLITH' };
            scene.add(group);
            POIs.push(group);
            monolith = group;
        }

        function toggleMusic() {
            if(!isAudioInit) initAudio();
            if(bgMusic.paused) {
                bgMusic.play();
                document.getElementById('music-status').innerText = "ON";
            } else {
                bgMusic.pause();
                document.getElementById('music-status').innerText = "OFF";
            }
        }

        function initAudio() {
            if (isAudioInit) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaElementSource(bgMusic);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isAudioInit = true;
        }

        function startExperience() {
            initAudio();
            bgMusic.play().then(() => {
                document.getElementById('music-status').innerText = "ON";
            }).catch(() => {});

            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.display = 'none';
                document.getElementById('hud').style.opacity = 1;
                document.getElementById('audio-controls').style.opacity = 1;
            }, 1500);
        }

        function updateUI(poi) {
            if(!poi) { screen.style.display = 'none'; return; }
            screen.style.display = 'block';
            const data = quotes[poi.userData.type];
            screenContent.innerText = data[Math.floor(Date.now()/3500 % data.length)];
            screenContent.className = 'neon-text text-' + poi.userData.type;

            const vector = poi.position.clone();
            vector.y += 12;
            vector.project(camera);
            screen.style.left = (vector.x * 0.5 + 0.5) * window.innerWidth + 'px';
            screen.style.top = (vector.y * -0.5 + 0.5) * window.innerHeight + 'px';
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            
            let bass = 0;
            if (isAudioInit && !bgMusic.paused) {
                analyser.getByteFrequencyData(dataArray);
                bass = (dataArray[0] + dataArray[1] + dataArray[2]) / (255 * 3);
                
                // Dunes high-contrast pulse
                if (dunes) {
                    const pos = dunes.geometry.attributes.position;
                    for (let i = 0; i < pos.count; i++) {
                        const originalZ = pos.getZ(i);
                        pos.setZ(i, originalZ + Math.sin(time*2.0 + i*0.04) * bass * 0.5);
                    }
                    dunes.geometry.attributes.position.needsUpdate = true;
                }

                // Orb Glow Pulse - Safety check for children and material
                if (darkOrb && darkOrb.children && darkOrb.children[0] && darkOrb.children[0].material) {
                    darkOrb.children[0].material.emissiveIntensity = 0.15 + (bass * 0.8);
                    darkOrb.scale.set(1 + bass * 0.15, 1 + bass * 0.15, 1 + bass * 0.15);
                }
                
                // Tetrahedron Vibration
                if (tetrahedron) {
                    tetrahedron.rotation.x += 0.02 + bass * 0.2;
                    tetrahedron.rotation.z += 0.01 + bass * 0.1;
                    tetrahedron.scale.set(1 + bass * 0.3, 1 + bass * 0.3, 1 + bass * 0.3);
                }

                // Monolith Shiver
                if (monolith) {
                    monolith.position.y = 10 + Math.sin(time * 5) * bass * 0.5;
                    monolith.rotation.y += 0.005 + bass * 0.03;
                }
            }

            // Cinematic Logic
            if (Date.now() - lastZoomTime > ZOOM_INTERVAL) {
                cinematicTarget = cinematicTarget ? null : POIs[Math.floor(Math.random() * POIs.length)];
                lastZoomTime = Date.now();
            }

            if (cinematicTarget) {
                controls.target.lerp(cinematicTarget.position, 0.05);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.4, 0.04);
                updateUI(cinematicTarget);
            } else {
                controls.target.lerp(new THREE.Vector3(0,0,0), 0.02);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.03);
                updateUI(null);
            }

            camera.updateProjectionMatrix();
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
