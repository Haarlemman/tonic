<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Study — Rolls-Royce Phantom Drophead & Fiat 500</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; background: #020202; touch-action: none; font-family: 'Georgia', serif; }
        
        #ui {
            position: absolute; bottom: 0; width: 100%; padding: 24px;
            display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            pointer-events: none;
        }
        .btn {
            pointer-events: all;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.85);
            padding: 11px 26px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 1px;
            font-size: 9px; letter-spacing: 3px;
            text-transform: uppercase; cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.25s;
        }
        .btn:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.45); }
        
        #label {
            position: absolute; top: 28px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.35);
            font-size: 10px; letter-spacing: 5px; text-transform: uppercase;
            pointer-events: none;
        }
        #hint {
            position: absolute; top: 60px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.18);
            font-size: 9px; letter-spacing: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="label">Car Study · Rolls-Royce Phantom Drophead Coupé &amp; Fiat 500</div>
    <div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>

    <div id="ui">
        <button class="btn" id="toggle">Driveway Context</button>
        <button class="btn" id="reset">Reset View</button>
        <button class="btn" id="lights">Warm Lights</button>
    </div>

    <script>
    let scene, camera, renderer, worldGroup;
    let rolls, fiat, house;
    let isSideBySide = false;
    let lightMode = 'default'; // default | warm | studio

    let camTarget = new THREE.Vector3(0, 1.5, 0);
    let camRadius = 42;
    let camTheta = 0.5;
    let camPhi = 1.2;

    window.onload = () => { init(); animate(); };

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1c22);
        scene.fog = new THREE.Fog(0x1a1c22, 50, 180);

        camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 1000);
        updateCam();

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.physicallyCorrectLights = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 2.2;
        document.body.appendChild(renderer.domElement);

        buildLighting();

        worldGroup = new THREE.Group();
        scene.add(worldGroup);

        // Ground
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222428, roughness: 0.95, metalness: 0 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), floorMat);
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
        worldGroup.add(floor);

        // Driveway with subtle concrete look
        const driveMat = new THREE.MeshStandardMaterial({ color: 0x2e3035, roughness: 0.82 });
        const driveway = new THREE.Mesh(new THREE.PlaneGeometry(72, 100), driveMat);
        driveway.rotation.x = -Math.PI / 2; driveway.position.set(0, 0.005, 15);
        driveway.receiveShadow = true; worldGroup.add(driveway);

        house = createHouseFacade();
        house.position.set(0, 0, -12);
        worldGroup.add(house);

        rolls = buildRollsRoyce();
        rolls.position.set(-10, 0, 12);
        worldGroup.add(rolls);

        fiat = buildFiat500();
        fiat.position.set(10, 0, 18);
        worldGroup.add(fiat);

        setupInteraction();
    }

    // ─── LIGHTING ──────────────────────────────────────────────────────────
    let lights = [];
    function buildLighting() {
        const amb = new THREE.AmbientLight(0xffffff, 0.9);
        amb.name = 'amb'; scene.add(amb); lights.push(amb);

        const sun = new THREE.DirectionalLight(0xfff8f0, 3.5);
        sun.position.set(20, 55, 20); sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1; sun.shadow.camera.far = 200;
        sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
        sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
        sun.name = 'sun'; scene.add(sun); lights.push(sun);

        const fill = new THREE.PointLight(0xd0e4ff, 2.8, 200);
        fill.position.set(-30, 18, -10); fill.name = 'fill';
        scene.add(fill); lights.push(fill);

        const bounce = new THREE.PointLight(0xfff5e0, 2.2, 150);
        bounce.position.set(15, 10, 40); bounce.name = 'bounce';
        scene.add(bounce); lights.push(bounce);

        const rim = new THREE.PointLight(0xffffff, 1.8, 120);
        rim.position.set(0, 20, -40); rim.name = 'rim';
        scene.add(rim); lights.push(rim);
    }

    // ─── HOUSE FACADE ──────────────────────────────────────────────────────
    function createHouseFacade() {
        const g = new THREE.Group();
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x3a3830, roughness: 0.88 });
        const darkMat  = new THREE.MeshStandardMaterial({ color: 0x181614 });

        // Main facade
        const facade = new THREE.Mesh(new THREE.BoxGeometry(80, 18, 3), stoneMat);
        facade.position.y = 9; facade.receiveShadow = true; g.add(facade);

        // Parapet top
        for (let x = -38; x <= 38; x += 4) {
            const merl = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2, 3), stoneMat);
            merl.position.set(x, 19, 0); g.add(merl);
        }

        // Columns
        for (let x of [-24, -12, 0, 12, 24]) {
            const col = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 18, 16), stoneMat);
            col.position.set(x, 9, 1.6); g.add(col);
        }

        // Windows
        for (let x of [-32, -20, -8, 8, 20, 32]) {
            const wFrame = new THREE.Mesh(new THREE.BoxGeometry(4, 6, 0.4), stoneMat);
            wFrame.position.set(x, 10, 1.6); g.add(wFrame);
            const wGlass = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 5.2),
                new THREE.MeshPhysicalMaterial({ color: 0x0a0a14, transmission: 0.7, roughness: 0.1 }));
            wGlass.position.set(x, 10, 1.85); g.add(wGlass);
        }

        // Central door
        const door = new THREE.Mesh(new THREE.BoxGeometry(3.5, 8, 0.3), darkMat);
        door.position.set(0, 4, 1.7); g.add(door);
        const arch = new THREE.Mesh(new THREE.TorusGeometry(1.75, 0.25, 8, 24, Math.PI), stoneMat);
        arch.position.set(0, 8, 1.7); arch.rotation.z = 0; g.add(arch);

        // Steps
        for (let i = 0; i < 4; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(8 - i, 0.25, 0.8 + i * 0.4), stoneMat);
            step.position.set(0, i * 0.25, 2.5 + i * 0.4); g.add(step);
        }

        return g;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ROLLS-ROYCE PHANTOM DROPHEAD COUPÉ
    // Wheels: torus r=0.82 tube=0.22 → centre y=1.04, bottom y=0 (ground)
    // ═══════════════════════════════════════════════════════════════════════
    function buildRollsRoyce() {
        const g = new THREE.Group();

        const body       = mat(0xc8a84b, 0.88, 0.12); // Champagne gold
        const bodyDark   = mat(0xb8962e, 0.85, 0.18);
        const chrome     = mat(0xf0e0a0, 1.0,  0.02);
        const darkChrome = mat(0x9a8040, 0.95, 0.08);
        const glass      = glassMat(0x0a0a20, 0.85);
        const rubber     = mat(0x0a0a0a, 0.0,  0.95);
        const softTop    = mat(0x1a1210, 0.0,  0.85);
        const leather    = mat(0x7a3010, 0.0,  0.65);
        const archMat    = mat(0x2a1e10, 0.0,  0.9);

        // ── Underbody (sits between wheel arches) ────────────────────
        // Front section (ahead of front wheels z=3.4)
        const ubF = new THREE.Mesh(new THREE.BoxGeometry(2.18, 0.9, 2.2), bodyDark);
        ubF.position.set(0, 0.55, 4.5); ubF.castShadow = true; g.add(ubF);
        // Middle section (between axles)
        const ubM = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.9, 3.2), bodyDark);
        ubM.position.set(0, 0.55, 0.4); ubM.castShadow = true; g.add(ubM);
        // Rear section (behind rear wheels z=-2.9)
        const ubR = new THREE.Mesh(new THREE.BoxGeometry(2.18, 0.9, 2.4), bodyDark);
        ubR.position.set(0, 0.55, -4.2); ubR.castShadow = true; g.add(ubR);

        // ── Wheel arch fenders — sit OVER the wheels ─────────────────
        // Each fender: a half-torus arch + flat panel on top
        const fenderPositions = [[-1.08,3.4],[1.08,3.4],[-1.08,-2.9],[1.08,-2.9]];
        fenderPositions.forEach(([fx, fz]) => {
            // Arch over tyre (tyre outer radius ~1.04, fender clears it)
            const arch = new THREE.Mesh(
                new THREE.TorusGeometry(1.08, 0.22, 16, 48, Math.PI),
                body
            );
            arch.rotation.y = Math.PI / 2;  // orient arch over wheel
            arch.rotation.z = Math.PI / 2;
            arch.position.set(fx, 1.04, fz);
            arch.castShadow = true;
            g.add(arch);

            // Flat fender top panel connecting arch to body
            const fTop = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.18, 1.8), body);
            fTop.position.set(fx < 0 ? fx - 0.01 : fx + 0.01, 2.04, fz);
            g.add(fTop);

            // Chrome fender lip
            const lip = new THREE.Mesh(
                new THREE.TorusGeometry(1.08, 0.045, 10, 48, Math.PI),
                chrome
            );
            lip.rotation.y = Math.PI / 2;
            lip.rotation.z = Math.PI / 2;
            lip.position.set(fx < 0 ? fx - 0.22 : fx + 0.22, 1.04, fz);
            g.add(lip);
        });

        // ── Main body panel ──────────────────────────────────────────
        const bodyMain = new THREE.Mesh(new THREE.BoxGeometry(2.18, 0.78, 9.4), body);
        bodyMain.position.set(0, 1.05, -0.1); bodyMain.castShadow = true; g.add(bodyMain);

        // ── Boot lid (clean flat, no protruding cylinder) ────────────
        const boot = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.14, 2.4), body);
        boot.position.set(0, 1.58, -3.8); g.add(boot);
        // Gentle crown crease along centre
        const bootRib = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.06, 2.3), body);
        bootRib.position.set(0, 1.65, -3.8); g.add(bootRib);
        // Rear panel (vertical face)
        const rearPanel = new THREE.Mesh(new THREE.BoxGeometry(2.14, 0.62, 0.18), body);
        rearPanel.position.set(0, 1.26, -5.0); g.add(rearPanel);

        // ── Bonnet / hood ────────────────────────────────────────────
        const bonnet = new THREE.Mesh(new THREE.BoxGeometry(2.08, 0.14, 3.8), body);
        bonnet.position.set(0, 1.72, 2.5); bonnet.castShadow = true; g.add(bonnet);
        const bonnetRib = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 3.6), chrome);
        bonnetRib.position.set(0, 1.8, 2.5); g.add(bonnetRib);

        // ── ROOF: open convertible — fabric roof folded behind seats ──
        // A-pillars supporting windscreen header
        mkPillar(g, body, -0.97, 2.2, 0.82, 0.13, 0.14, 0.95, 22, -13);
        mkPillar(g, body,  0.97, 2.2, 0.82, 0.13, 0.14, 0.95, 22,  13);
        // Windscreen header rail
        const wsHeader = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.1, 0.14), chrome);
        wsHeader.position.set(0, 2.66, 0.74); g.add(wsHeader);

        // Windscreen glass
        const ws = new THREE.Mesh(new THREE.PlaneGeometry(1.82, 1.06), glass);
        ws.position.set(0, 2.26, 0.84); ws.rotation.x = -0.38; g.add(ws);
        border(g, chrome, 0, 2.26, 0.84, 1.88, 1.1, -0.38);

        // Roof header bow (the curved frame visible at top of windscreen when open)
        const bow = new THREE.Mesh(new THREE.BoxGeometry(1.96, 0.09, 0.09), chrome);
        bow.position.set(0, 2.7, 0.3); g.add(bow);

        // ── Folded soft-top behind rear seats ─────────────────────────
        // Main fabric stack
        const topStack = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.32, 1.1), softTop);
        topStack.position.set(0, 1.84, -2.7); g.add(topStack);
        // Fabric ridge lines
        for (let i = 0; i < 6; i++) {
            const ridge = new THREE.Mesh(new THREE.BoxGeometry(1.88, 0.04, 0.05), mat(0x0c0804, 0, 0.95));
            ridge.position.set(0, 2.0, -2.35 - i * 0.14); g.add(ridge);
        }
        // Tonneau cover (body-colour panel over stacked hood)
        const tonneau = new THREE.Mesh(new THREE.BoxGeometry(1.92, 0.07, 1.12), body);
        tonneau.position.set(0, 2.01, -2.7); g.add(tonneau);
        // Chrome tonneau trim edge
        const tonnauTrim = new THREE.Mesh(new THREE.BoxGeometry(1.94, 0.04, 0.05), chrome);
        tonnauTrim.position.set(0, 2.05, -2.14); g.add(tonnauTrim);

        // ── Interior (visible since roof is open) ─────────────────────
        const dash = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.2, 0.65), mat(0x241408, 0, 0.5));
        dash.position.set(0, 1.72, 0.65); g.add(dash);
        const console_ = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.26, 2.0), mat(0x1e1008, 0.1, 0.5));
        console_.position.set(0, 1.62, -0.5); g.add(console_);
        // Front seats
        for (const sx of [-0.52, 0.52]) {
            const seat = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.12, 0.68), leather);
            seat.position.set(sx, 1.7, 0.05); g.add(seat);
            const sback = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.58, 0.11), leather);
            sback.position.set(sx, 2.0, -0.32); g.add(sback);
        }
        // Rear seats
        for (const sx of [-0.46, 0.46]) {
            const rseat = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.11, 0.6), leather);
            rseat.position.set(sx, 1.7, -1.65); g.add(rseat);
            const rsback = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.44, 0.1), leather);
            rsback.position.set(sx, 1.92, -1.96); g.add(rsback);
        }
        // Steering wheel
        const swRim = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.024, 10, 32), mat(0x111111, 0, 0.6));
        swRim.position.set(-0.5, 1.89, 0.4); swRim.rotation.x = 0.55; g.add(swRim);

        // ── Door tops (open air — just chrome beltline) ───────────────
        const dtL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.07, 4.4), chrome);
        dtL.position.set(-1.09, 1.76, -0.7); g.add(dtL);
        const dtR = dtL.clone(); dtR.position.x = 1.09; g.add(dtR);

        // ── Door panels ───────────────────────────────────────────────
        for (const dx of [-1.09, 1.09]) {
            const dp = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.75, 4.3), body);
            dp.position.set(dx, 1.4, -0.7); g.add(dp);
        }
        // Shut lines
        for (const dz of [0.75, -1.65]) {
            for (const dx of [-1.09, 1.09]) {
                const sl = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.8, 0.03), mat(0x000000, 0, 0.9));
                sl.position.set(dx, 1.35, dz); g.add(sl);
            }
        }

        // ── Sill trim ─────────────────────────────────────────────────
        for (const dx of [-1.09, 1.09]) {
            const sill = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.16, 9.0), chrome);
            sill.position.set(dx, 0.72, -0.3); g.add(sill);
        }

        // ── Waistline strip ───────────────────────────────────────────
        for (const dx of [-1.1, 1.1]) {
            const wl = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.065, 9.1), chrome);
            wl.position.set(dx, 1.64, -0.3); g.add(wl);
        }

        // ── Pantheon grille ───────────────────────────────────────────
        const gSurround = new THREE.Mesh(new THREE.BoxGeometry(2.02, 2.1, 0.36), chrome);
        gSurround.position.set(0, 1.52, 4.86); g.add(gSurround);
        const gRecess = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.9, 0.4), mat(0x040404, 0, 0.9));
        gRecess.position.set(0, 1.52, 4.87); g.add(gRecess);
        for (let i = -11; i <= 11; i++) {
            const slat = new THREE.Mesh(new THREE.BoxGeometry(0.065, 1.8, 0.12), chrome);
            slat.position.set(i * 0.082, 1.52, 5.01); g.add(slat);
        }
        const topBar = new THREE.Mesh(new THREE.BoxGeometry(2.06, 0.12, 0.38), chrome);
        topBar.position.set(0, 2.48, 4.86); g.add(topBar);

        // ── Front bumper ──────────────────────────────────────────────
        const fBumper = new THREE.Mesh(new THREE.BoxGeometry(2.28, 0.55, 0.55), body);
        fBumper.position.set(0, 0.65, 5.06); g.add(fBumper);
        const fBChr = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.13, 0.58), chrome);
        fBChr.position.set(0, 0.52, 5.06); g.add(fBChr);
        for (const x of [-0.82, 0.82]) {
            const fog = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.14, 0.1), mat(0xffeecc, 1, 0.1));
            fog.position.set(x, 0.62, 5.13); g.add(fog);
        }

        // ── Rear bumper ───────────────────────────────────────────────
        const rBumper = new THREE.Mesh(new THREE.BoxGeometry(2.28, 0.55, 0.55), body);
        rBumper.position.set(0, 0.65, -5.06); g.add(rBumper);
        const rBChr = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.13, 0.58), chrome);
        rBChr.position.set(0, 0.52, -5.06); g.add(rBChr);
        for (const x of [-0.62, 0.62]) {
            const exh = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.28, 20), darkChrome);
            exh.rotation.x = Math.PI/2; exh.position.set(x, 0.38, -5.18); g.add(exh);
        }

        // ── Headlights ────────────────────────────────────────────────
        for (const side of [-1, 1]) {
            const x = side * 0.88;
            const hC = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.42, 0.22), body);
            hC.position.set(x, 1.65, 4.89); g.add(hC);
            const drl = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.055, 0.06), new THREE.MeshBasicMaterial({ color: 0xf8fff0 }));
            drl.position.set(x, 1.82, 4.99); g.add(drl);
            const lens = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.28, 0.08), glassMat(0x88aacc, 0.6));
            lens.position.set(x, 1.62, 4.98); g.add(lens);
        }

        // ── Tail lights ───────────────────────────────────────────────
        for (const side of [-1, 1]) {
            const x = side * 0.9;
            const tl = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.68, 0.13), glassMat(0x660000, 0.4));
            tl.position.set(x, 1.58, -4.89); g.add(tl);
            const tlInner = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.58, 0.04), new THREE.MeshBasicMaterial({ color: 0x440000 }));
            tlInner.position.set(x, 1.58, -4.92); g.add(tlInner);
        }

        // ── Mirrors ───────────────────────────────────────────────────
        for (const side of [-1, 1]) {
            const mx = side * 1.24;
            const mB = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.18, 0.22), body);
            mB.position.set(mx, 1.94, 0.82); g.add(mB);
            const mH = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.22, 0.28), body);
            mH.position.set(mx + side * 0.2, 1.91, 0.82); g.add(mH);
            const mG = new THREE.Mesh(new THREE.PlaneGeometry(0.36, 0.18), glassMat(0x223344, 0.7));
            mG.rotation.y = side > 0 ? Math.PI/2 : -Math.PI/2;
            mG.position.set(mx + side * 0.42, 1.91, 0.82); g.add(mG);
        }

        // ── Spirit of Ecstasy ─────────────────────────────────────────
        const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.5, 16), chrome);
        ped.position.set(0, 2.56, 4.5); g.add(ped);
        const fig = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.07, 0.3, 12), chrome);
        fig.position.set(0, 2.96, 4.5); g.add(fig);
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.038, 0.13), chrome);
        arm.position.set(0, 3.06, 4.5); arm.rotation.y = 0.15; g.add(arm);

        // ── RR badge ──────────────────────────────────────────────────
        const badge = new THREE.Mesh(new THREE.CircleGeometry(0.16, 24), chrome);
        badge.position.set(0, 2.51, 5.05); g.add(badge);

        // ── Wheels ────────────────────────────────────────────────────
        [[-1.12,1.04,3.4],[1.12,1.04,3.4],[-1.12,1.04,-2.9],[1.12,1.04,-2.9]]
            .forEach(p => buildRRWheel(g, p, chrome, rubber));

        return g;
    }

    function buildRRWheel(g, pos, chrome, rubber) {
        const [x, y, z] = pos;
        const side = x < 0 ? 1 : -1;
        const tyre = new THREE.Mesh(new THREE.TorusGeometry(0.82, 0.22, 24, 64), rubber);
        tyre.rotation.y = Math.PI/2; tyre.position.set(x, y, z); tyre.castShadow = true; g.add(tyre);
        const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.12, 64), mat(0x1a1a1a, 0.8, 0.22));
        disc.rotation.z = Math.PI/2; disc.position.set(x + side * 0.06, y, z); g.add(disc);
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.15, 32), chrome);
        hub.rotation.z = Math.PI/2; hub.position.set(x + side * 0.13, y, z); g.add(hub);
        for (let i = 0; i < 20; i++) {
            const angle = (i / 20) * Math.PI * 2;
            const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.565, 0.042), chrome);
            spoke.position.set(x + side * 0.13, y + Math.sin(angle) * 0.5, z + Math.cos(angle) * 0.5);
            spoke.rotation.set(0, 0, angle); g.add(spoke);
        }
        const rim = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.045, 12, 64), chrome);
        rim.rotation.y = Math.PI/2; rim.position.set(x + side * 0.13, y, z); g.add(rim);
        const bdisc = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 0.04, 32), mat(0x333333, 0, 0.7));
        bdisc.rotation.z = Math.PI/2; bdisc.position.set(x - side * 0.04, y, z); g.add(bdisc);
        const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.22, 0.28), mat(0x888888, 0.5, 0.4));
        caliper.position.set(x - side * 0.01, y + 0.35, z); g.add(caliper);
    }


    // ═══════════════════════════════════════════════════════════════════════
    // FIAT 500
    // Wheels: torus r=0.36 tube=0.10 → centre y=0.46, bottom y=0 (ground)
    // ═══════════════════════════════════════════════════════════════════════
    function buildFiat500() {
        const g = new THREE.Group();

        const body   = mat(0xcc2222, 0.65, 0.22);
        const chrome = mat(0xdddddd, 1.0,  0.04);
        const glass  = glassMat(0x7aaabb, 0.75);
        const rubber = mat(0x0c0c0c, 0,    0.92);
        const black  = mat(0x080808, 0,    0.85);
        const inner  = mat(0x380e0e, 0,    0.85); // dark red wheel-arch liner

        // Wheel positions
        const wPos = [[-0.82,0.46,1.14],[0.82,0.46,1.14],[-0.82,0.46,-1.08],[0.82,0.46,-1.08]];

        // ── Lower body — sections between and around wheel arches ────
        // Centre underfloor (between axles, narrow to allow wheel-arch relief)
        const ubMid = new THREE.Mesh(new THREE.BoxGeometry(1.26, 0.8, 1.5), body);
        ubMid.position.set(0, 0.42, 0.05); g.add(ubMid);
        // Front nose block
        const ubFront = new THREE.Mesh(new THREE.BoxGeometry(1.54, 0.8, 0.8), body);
        ubFront.position.set(0, 0.42, 1.64); g.add(ubFront);
        // Rear tail block
        const ubRear = new THREE.Mesh(new THREE.BoxGeometry(1.54, 0.8, 0.65), body);
        ubRear.position.set(0, 0.42, -1.52); g.add(ubRear);

        // ── Wheel arch fenders — arched over wheels ───────────────────
        wPos.forEach(([wx, wy, wz]) => {
            // Arch half-torus over tyre (tyre outer radius 0.46, fender clears at 0.5)
            const arch = new THREE.Mesh(
                new THREE.TorusGeometry(0.5, 0.11, 14, 40, Math.PI),
                body
            );
            arch.rotation.y = Math.PI / 2;
            arch.rotation.z = Math.PI / 2;
            arch.position.set(wx, wy, wz);
            arch.castShadow = true;
            g.add(arch);

            // Chrome fender lip ring
            const lip = new THREE.Mesh(
                new THREE.TorusGeometry(0.5, 0.025, 10, 40, Math.PI),
                chrome
            );
            lip.rotation.y = Math.PI / 2;
            lip.rotation.z = Math.PI / 2;
            lip.position.set(wx < 0 ? wx - 0.1 : wx + 0.1, wy, wz);
            g.add(lip);

            // Dark arch liner (inner surface of wheel well)
            const liner = new THREE.Mesh(
                new THREE.TorusGeometry(0.46, 0.07, 12, 36, Math.PI),
                inner
            );
            liner.rotation.y = Math.PI / 2;
            liner.rotation.z = Math.PI / 2;
            liner.position.set(wx, wy, wz);
            g.add(liner);
        });

        // ── Main body bulge — egg-shaped ─────────────────────────────
        const fBulge = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 24), body);
        fBulge.scale.set(0.79, 0.46, 0.88); fBulge.position.set(0, 0.98, 0.66);
        fBulge.castShadow = true; g.add(fBulge);
        const rBulge = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 24), body);
        rBulge.scale.set(0.77, 0.44, 0.86); rBulge.position.set(0, 0.96, -0.76);
        rBulge.castShadow = true; g.add(rBulge);
        const midFill = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.88, 1.44), body);
        midFill.position.set(0, 0.94, -0.03); g.add(midFill);

        // ── Roof ──────────────────────────────────────────────────────
        const roofDome = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 24), body);
        roofDome.scale.set(0.75, 0.36, 0.8); roofDome.position.set(0, 1.6, -0.36);
        roofDome.castShadow = true; g.add(roofDome);
        const roofFill = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.38, 1.6), body);
        roofFill.position.set(0, 1.58, -0.36); g.add(roofFill);

        // ── Windscreen — recessed inside body ─────────────────────────
        // Sits slightly inward (z=0.76, not at the very nose)
        const ws = new THREE.Mesh(new THREE.PlaneGeometry(1.18, 0.68), glass);
        ws.position.set(0, 1.42, 0.76); ws.rotation.x = -0.52; g.add(ws);
        // A-pillar strips
        for (const s of [-1, 1]) {
            const ap = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.72, 0.055), chrome);
            ap.position.set(s * 0.62, 1.42, 0.74); ap.rotation.z = s * 0.18; ap.rotation.x = -0.52; g.add(ap);
        }

        // ── Side windows — recessed inside the body shell ─────────────
        // x = ±0.72 (inside the body width of ±0.79), not protruding outward
        for (const side of [-1, 1]) {
            // Main door window
            const sw = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.5), glass);
            sw.position.set(side * 0.72, 1.46, -0.25);
            sw.rotation.y = side > 0 ? -Math.PI/2 : Math.PI/2;
            g.add(sw);
            // Rear quarter window
            const qw = new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.34), glass);
            qw.position.set(side * 0.72, 1.42, -1.0);
            qw.rotation.y = side > 0 ? -Math.PI/2 : Math.PI/2;
            g.add(qw);
            // Window frame surround (chrome bead flush with body)
            const frame = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.58, 1.5), chrome);
            frame.position.set(side * 0.75, 1.48, -0.25); g.add(frame);
        }

        // Rear window
        const rw = new THREE.Mesh(new THREE.PlaneGeometry(1.12, 0.56), glass);
        rw.position.set(0, 1.44, -1.38); rw.rotation.x = 0.58; g.add(rw);

        // ── Round headlights ──────────────────────────────────────────
        for (const side of [-1, 1]) {
            const hx = side * 0.6;
            const bezel = new THREE.Mesh(new THREE.TorusGeometry(0.195, 0.054, 20, 48), chrome);
            bezel.position.set(hx, 1.09, 1.74); g.add(bezel);
            const lens = new THREE.Mesh(new THREE.CircleGeometry(0.145, 32), glassMat(0xeefff0, 0.55));
            lens.position.set(hx, 1.09, 1.76); g.add(lens);
            const ref = new THREE.Mesh(new THREE.CircleGeometry(0.08, 24), mat(0xddeeff, 0.9, 0.1));
            ref.position.set(hx, 1.09, 1.77); g.add(ref);
        }

        // ── Front bumper & grille ─────────────────────────────────────
        const fBumper = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.36, 0.36), body);
        fBumper.position.set(0, 0.56, 1.83); g.add(fBumper);
        const bChrT = new THREE.Mesh(new THREE.BoxGeometry(1.58, 0.09, 0.4), chrome);
        bChrT.position.set(0, 0.68, 1.83); g.add(bChrT);
        const bChrB = new THREE.Mesh(new THREE.BoxGeometry(1.58, 0.06, 0.4), chrome);
        bChrB.position.set(0, 0.41, 1.83); g.add(bChrB);
        const gFrame = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.22, 0.09), chrome);
        gFrame.position.set(0, 0.57, 1.97); g.add(gFrame);
        for (let i = -2; i <= 2; i++) {
            const slot = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.13, 0.05), black);
            slot.position.set(i * 0.14, 0.57, 1.99); g.add(slot);
        }
        const badgeF = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.11, 0.04), chrome);
        badgeF.position.set(0, 0.9, 1.98); g.add(badgeF);

        // ── Rear bumper & tail lights ─────────────────────────────────
        const rBumper = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.36, 0.36), body);
        rBumper.position.set(0, 0.56, -1.86); g.add(rBumper);
        const rBChr = new THREE.Mesh(new THREE.BoxGeometry(1.58, 0.09, 0.4), chrome);
        rBChr.position.set(0, 0.68, -1.86); g.add(rBChr);
        for (const side of [-1, 1]) {
            const tlB = new THREE.Mesh(new THREE.TorusGeometry(0.148, 0.04, 16, 36), chrome);
            tlB.position.set(side * 0.6, 1.12, -1.79); g.add(tlB);
            const tl = new THREE.Mesh(new THREE.CircleGeometry(0.11, 24), new THREE.MeshBasicMaterial({ color: 0x550000 }));
            tl.position.set(side * 0.6, 1.12, -1.78); g.add(tl);
        }
        const exh = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.2, 16), chrome);
        exh.rotation.x = Math.PI/2; exh.position.set(0, 0.42, -1.99); g.add(exh);

        // ── Sills ─────────────────────────────────────────────────────
        for (const side of [-1, 1]) {
            const sill = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.13, 3.2), black);
            sill.position.set(side * 0.78, 0.34, 0); g.add(sill);
        }

        // ── Mirrors ───────────────────────────────────────────────────
        for (const side of [-1, 1]) {
            const mx = side * 0.8;
            const mb = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.11, 0.09), body);
            mb.position.set(mx, 1.48, 0.7); g.add(mb);
            const mh = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.15, 0.2), body);
            mh.position.set(mx + side * 0.11, 1.46, 0.7); g.add(mh);
        }

        // ── Wheels ────────────────────────────────────────────────────
        wPos.forEach(p => buildFiatWheel(g, p, chrome, rubber));

        return g;
    }

    function buildFiatWheel(g, pos, chrome, rubber) {
        const [x, y, z] = pos;
        const side = x < 0 ? 1 : -1;
        const tyre = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.1, 20, 48), rubber);
        tyre.rotation.y = Math.PI/2; tyre.position.set(x, y, z); tyre.castShadow = true; g.add(tyre);
        const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.08, 48), mat(0x111111, 0.6, 0.35));
        disc.rotation.z = Math.PI/2; disc.position.set(x + side * 0.03, y, z); g.add(disc);
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.1, 24), chrome);
        hub.rotation.z = Math.PI/2; hub.position.set(x + side * 0.06, y, z); g.add(hub);
        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.22, 0.038), chrome);
            spoke.position.set(x + side * 0.06, y + Math.sin(angle) * 0.22, z + Math.cos(angle) * 0.22);
            spoke.rotation.set(0, 0, angle); g.add(spoke);
        }
        const rim = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.025, 10, 48), chrome);
        rim.rotation.y = Math.PI/2; rim.position.set(x + side * 0.06, y, z); g.add(rim);
        const bdisc = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.03, 28), mat(0x333333, 0, 0.7));
        bdisc.rotation.z = Math.PI/2; bdisc.position.set(x - side * 0.02, y, z); g.add(bdisc);
    }


    // ─── HELPERS ────────────────────────────────────────────────────────────
    function mat(color, metalness, roughness) {
        return new THREE.MeshStandardMaterial({ color, metalness, roughness });
    }
    function glassMat(color, transmission = 0.88) {
        return new THREE.MeshPhysicalMaterial({ color, metalness: 0.05, roughness: 0.06, transmission, transparent: true, opacity: 0.92 });
    }
    function cylinder(w, h, d, mat_) {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(h, h, w, 32), mat_);
        return m;
    }
    function mkPillar(g, mat_, x, y, z, w, d, h, rx, ry) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat_);
        m.position.set(x, y, z);
        m.rotation.x = THREE.MathUtils.degToRad(rx);
        m.rotation.y = THREE.MathUtils.degToRad(ry);
        g.add(m);
    }
    function border(g, mat_, x, y, z, w, h, rx) {
        const frame = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, 0.04), mat_);
        frame.position.set(x, y + h/2, z); frame.rotation.x = rx; g.add(frame);
        const frameB = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, 0.04), mat_);
        frameB.position.set(x, y - h/2, z); frameB.rotation.x = rx; g.add(frameB);
    }

    // ─── INTERACTION ────────────────────────────────────────────────────────
    function setupInteraction() {
        document.addEventListener('contextmenu', e => e.preventDefault());

        let dragging = false, button = 0;
        document.addEventListener('mousedown', e => {
            dragging = true; button = e.button;
            const onMove = mv => {
                if (!dragging) return;
                if (button === 0) {
                    camTheta -= mv.movementX * 0.006;
                    camPhi = Math.max(0.08, Math.min(Math.PI/2 - 0.06, camPhi - mv.movementY * 0.006));
                } else if (button === 2) {
                    const right = new THREE.Vector3(-Math.cos(camTheta), 0, Math.sin(camTheta));
                    const up = new THREE.Vector3(0, 1, 0);
                    camTarget.addScaledVector(right, -mv.movementX * camRadius * 0.0004);
                    camTarget.addScaledVector(up, mv.movementY * camRadius * 0.0004);
                }
                updateCam();
            };
            const onUp = () => { dragging = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });

        // Touch
        let lastTouch = null;
        document.addEventListener('touchstart', e => { if (e.touches.length === 1) lastTouch = e.touches[0]; });
        document.addEventListener('touchmove', e => {
            if (e.touches.length === 1 && lastTouch) {
                const dx = e.touches[0].clientX - lastTouch.clientX;
                const dy = e.touches[0].clientY - lastTouch.clientY;
                camTheta -= dx * 0.006;
                camPhi = Math.max(0.08, Math.min(Math.PI/2 - 0.06, camPhi - dy * 0.006));
                lastTouch = e.touches[0]; updateCam();
            }
        });

        document.addEventListener('wheel', e => {
            camRadius = Math.max(8, Math.min(160, camRadius + e.deltaY * 0.04));
            updateCam();
        }, { passive: true });

        document.getElementById('toggle').onclick = () => {
            isSideBySide = !isSideBySide;
            document.getElementById('toggle').innerText = isSideBySide ? 'Driveway Context' : 'Align Side-by-Side';
            if (isSideBySide) {
                rolls.position.set(-6, 0, 28); fiat.position.set(5.5, 0, 28);
                house.visible = false;
            } else {
                rolls.position.set(-10, 0, 12); fiat.position.set(10, 0, 18);
                house.visible = true;
            }
        };

        document.getElementById('reset').onclick = () => {
            camTarget.set(0, 1.5, 0); camRadius = 42; camTheta = 0.5; camPhi = 1.2; updateCam();
        };

        document.getElementById('lights').onclick = () => {
            const modes = ['default', 'warm', 'studio'];
            const idx = (modes.indexOf(lightMode) + 1) % 3;
            lightMode = modes[idx];
            document.getElementById('lights').innerText = ['Warm Lights', 'Studio Lights', 'Default Lights'][idx];
            applyLightMode();
        };
    }

    function applyLightMode() {
        scene.children.filter(c => c.isLight).forEach(l => scene.remove(l));
        scene.fog = new THREE.Fog(lightMode === 'studio' ? 0x0d1020 : 0x1a1c22, 50, 180);
        scene.background = new THREE.Color(lightMode === 'studio' ? 0x0d1020 : 0x1a1c22);

        if (lightMode === 'default') {
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const sun = new THREE.DirectionalLight(0xfff8f0, 3.5);
            sun.position.set(20, 55, 20); sun.castShadow = true;
            sun.shadow.mapSize.set(2048, 2048);
            sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
            sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
            scene.add(sun);
            const fill = new THREE.PointLight(0xd0e4ff, 2.8, 200);
            fill.position.set(-30, 18, -10); scene.add(fill);
            const bounce = new THREE.PointLight(0xfff5e0, 2.2, 150);
            bounce.position.set(15, 10, 40); scene.add(bounce);
            const rim = new THREE.PointLight(0xffffff, 1.8, 120);
            rim.position.set(0, 20, -40); scene.add(rim);
        } else if (lightMode === 'warm') {
            scene.add(new THREE.AmbientLight(0xff8833, 0.08));
            const warm = new THREE.PointLight(0xff9944, 2.5, 90);
            warm.position.set(-15, 22, 5); warm.castShadow = true; scene.add(warm);
            const warm2 = new THREE.PointLight(0xffcc66, 1.8, 70);
            warm2.position.set(18, 12, 30); scene.add(warm2);
            const cool = new THREE.PointLight(0x4488ff, 0.9, 100);
            cool.position.set(30, 30, -20); scene.add(cool);
        } else {
            scene.add(new THREE.AmbientLight(0xffffff, 0.04));
            const key = new THREE.SpotLight(0xffffff, 4.0, 120, Math.PI/7, 0.3);
            key.position.set(-18, 35, 18); key.castShadow = true;
            key.shadow.mapSize.set(2048, 2048); scene.add(key);
            const fill2 = new THREE.PointLight(0xaabbdd, 1.5, 100);
            fill2.position.set(30, 15, 15); scene.add(fill2);
            const rim = new THREE.PointLight(0xffffff, 2.0, 60);
            rim.position.set(0, 10, -30); scene.add(rim);
        }
    }

    function updateCam() {
        camera.position.set(
            camTarget.x + camRadius * Math.sin(camPhi) * Math.sin(camTheta),
            camTarget.y + camRadius * Math.cos(camPhi),
            camTarget.z + camRadius * Math.sin(camPhi) * Math.cos(camTheta)
        );
        camera.lookAt(camTarget);
    }

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    </script>
</body>
</html>
