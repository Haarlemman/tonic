<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poppy Field — Mosaic</title>
<style>
  :root {
    --bg: #e9e6da;
    --fg: #2a3324;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10130e;
      --fg: #c9d3bd;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10130e;
    --fg: #c9d3bd;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Iowan Old Style", Georgia, "Times New Roman", serif;
    overflow: hidden;
  }
  #stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    box-sizing: border-box;
  }
  #wrap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #frame {
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <div id="frame"><canvas id="c" width="1080" height="1920" aria-label="Animated mosaic of a poppy field seen from above"></canvas></div>
  </div>
</div>

<script>
(function () {
  const W = 1080, H = 1920, CS = 10;
  const COLS = W / CS, ROWS = H / CS;
  const SEED = 1970;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // ---------- tiny helpers ----------
  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry(SEED);

  function hash(x, y) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + SEED) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967295;
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function vnoise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = smooth(x - ix), fy = smooth(y - iy);
    const a = hash(ix, iy), b = hash(ix + 1, iy);
    const c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
    return (a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy;
  }
  function fbm(x, y) {
    return vnoise(x, y) * 0.55 + vnoise(x * 2.1 + 7.3, y * 2.1 + 3.1) * 0.3 + vnoise(x * 4.3 + 1.7, y * 4.3 + 9.2) * 0.15;
  }
  function sstep(a, b, x) {
    const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }
  function hsl(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [f(0) * 255, f(8) * 255, f(4) * 255];
  }

  // ---------- the field: static green base ----------
  const N = COLS * ROWS;
  const baseR = new Float32Array(N), baseG = new Float32Array(N), baseB = new Float32Array(N);
  const cellPh = new Float32Array(N);   // organic phase warp for the wind
  const cellR = new Float32Array(N);    // per-cell random for shimmer
  const dens = new Float32Array(N);     // poppy density map

  function pathX(y) { return 54 + 24 * Math.sin(y * 0.026 + 0.6) + 11 * Math.sin(y * 0.071 + 1.4); }

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = y * COLS + x;
      const n1 = fbm(x * 0.035, y * 0.035);
      const n2 = fbm(x * 0.14 + 50, y * 0.14 + 20);
      const r = hash(x, y);
      cellR[i] = r;
      cellPh[i] = n1;

      // a narrow, ragged footpath winds down the field
      const dist = Math.abs(x - pathX(y)) + (n2 - 0.5) * 7;
      const pm = sstep(2.5, 8.5, dist);       // 0 on the path, 1 in the field
      const onPath = 1 - pm;

      let hue = 76 + 48 * n1 + 14 * (n2 - 0.5);
      let sat = 36 + 30 * n2 + 12 * (r - 0.5);
      let lig = 19 + 22 * n1 + 12 * n2 + 7 * (r - 0.5);

      hue -= onPath * 16;
      sat -= onPath * 8;
      lig += onPath * 11;

      const c = hsl(hue, sat, lig);
      baseR[i] = c[0]; baseG[i] = c[1]; baseB[i] = c[2];

      // poppy density: drifting clumps, absent on the path
      const dn = fbm(x * 0.028 + 100, y * 0.028 + 40);
      dens[i] = (0.03 + Math.max(0, (dn - 0.38) * 1.7)) * pm;
    }
  }

  // ---------- poppies ----------
  const poppies = [];
  const redPalette = [];
  for (let k = 0; k < 8; k++) {
    redPalette.push(hsl(2 + rand() * 12, 82 + rand() * 14, 38 + rand() * 14));
  }
  const dark = hsl(350, 55, 16);

  const SHAPES = {
    1: [[0, 0, 1, 1]],
    2: [[0, 0, 1, 1], [1, 0, 0.9, 1], [0, 1, 0.8, 1]],
    3: [[0, 0, 0.9, 0.5], [1, 0, 0.75, 1], [-1, 0, 0.75, 1], [0, 1, 0.75, 1], [0, -1, 0.75, 1]]
  };

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = y * COLS + x;
      const p = Math.min(0.32, dens[i] * 0.22);
      if (rand() < p) {
        const q = rand();
        const size = q < 0.62 ? 1 : (q < 0.93 ? 2 : 3);
        poppies.push({
          x: x + 0.5 + (rand() - 0.5) * 0.9,
          y: y + 0.5 + (rand() - 0.5) * 0.9,
          size,
          ph: rand() * 6.283,
          amp: 0.7 + rand() * 0.6,
          col: redPalette[(rand() * redPalette.length) | 0]
        });
      }
    }
  }

  // ---------- buffers & render targets ----------
  const small = document.createElement('canvas');
  small.width = COLS; small.height = ROWS;
  const sctx = small.getContext('2d');
  const img = sctx.createImageData(COLS, ROWS);
  const px = img.data;

  const cov = new Float32Array(N);
  const cr = new Float32Array(N), cg = new Float32Array(N), cb = new Float32Array(N);

  // ---------- wind ----------
  function wind(x, y, t, ph) {
    return Math.sin(x * 0.045 + y * 0.018 - t * 0.9 + ph * 3.0) * 0.6 +
           Math.sin(x * 0.105 - y * 0.055 - t * 1.6 + ph * 6.0) * 0.4;
  }

  function splat(ix, iy, w, r, g, b) {
    if (ix < 0 || iy < 0 || ix >= COLS || iy >= ROWS || w <= 0) return;
    const i = iy * COLS + ix;
    cov[i] += w; cr[i] += w * r; cg[i] += w * g; cb[i] += w * b;
  }

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed = reduce ? 0.3 : 1;

  function frame(t) {
    cov.fill(0); cr.fill(0); cg.fill(0); cb.fill(0);

    // poppies -> coverage buffer (sub-tile positions are shared between neighbouring tiles)
    for (let k = 0; k < poppies.length; k++) {
      const p = poppies[k];
      const w = wind(p.x, p.y, t, 0.5);
      const sx = p.amp * (1.5 * w + 0.5 * Math.sin(t * 1.3 + p.ph));
      const sy = 0.55 * Math.sin(t * 0.9 + p.ph * 1.7) + 0.35 * w;
      const flutter = 1 + 0.09 * Math.sin(t * 2.2 + p.ph * 2);
      const shape = SHAPES[p.size];
      for (let s = 0; s < shape.length; s++) {
        const o = shape[s];
        const fx = p.x + sx + o[0] - 0.5, fy = p.y + sy + o[1] - 0.5;
        const ix = Math.floor(fx), iy = Math.floor(fy);
        const ax = fx - ix, ay = fy - iy;
        const wt = o[2];
        const c = o[3] === 1 ? p.col : dark;
        const r = c[0] * flutter, g = c[1] * flutter, b = c[2] * flutter;
        splat(ix,     iy,     wt * (1 - ax) * (1 - ay), r, g, b);
        splat(ix + 1, iy,     wt * ax * (1 - ay),       r, g, b);
        splat(ix,     iy + 1, wt * (1 - ax) * ay,       r, g, b);
        splat(ix + 1, iy + 1, wt * ax * ay,             r, g, b);
      }
    }

    // greens + wind shimmer, then blend poppies over
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const i = y * COLS + x;
        const w = wind(x, y, t, cellPh[i]);
        const shimmer = Math.sin(t * 2.0 + cellR[i] * 40) * 0.25;
        const f = 1 + 0.15 * w + 0.05 * shimmer;
        let r = baseR[i] * f + w * 5;
        let g = baseG[i] * f;
        let b = baseB[i] * f * 0.98;

        const cv = cov[i];
        if (cv > 0.001) {
          const a = Math.min(1, cv * 1.25);
          const inv = 1 / cv;
          r = r + (cr[i] * inv - r) * a;
          g = g + (cg[i] * inv - g) * a;
          b = b + (cb[i] * inv - b) * a;
        }
        const o = i * 4;
        px[o] = r > 255 ? 255 : r;
        px[o + 1] = g > 255 ? 255 : g;
        px[o + 2] = b > 255 ? 255 : b;
        px[o + 3] = 255;
      }
    }
    sctx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, W, H);
  }

  // ---------- loop (30 fps is plenty for a slow breeze) ----------
  let last = 0, clock = 0, prev = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    if (now - last < 33) return;
    const dt = Math.min(0.1, (now - prev) / 1000);
    prev = now; last = now;
    clock += dt * speed;
    frame(clock);
  }
  frame(0);
  requestAnimationFrame(loop);

  // ---------- fit to viewport ----------
  const wrap = document.getElementById('wrap');
  const frameEl = document.getElementById('frame');
  function fit() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const s = Math.min(w / W, h / H);
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
  }
  new ResizeObserver(fit).observe(wrap);
  fit();

})();
</script>
</body>
</html>
