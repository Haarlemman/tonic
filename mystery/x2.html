<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mystery Room - Refined Escher Box</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; font-family: monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; background: #fff; padding: 15px; border: 2px solid #000; box-shadow: 4px 4px 0px #000; }
        h1 { margin: 0 0 5px 0; font-size: 14px; text-transform: uppercase; }
        p { margin: 0; font-size: 11px; color: #444; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>The Mystery Room v2</h1>
        <p>• Left Click + Drag to Orbit</p>
        <p>• Scroll to Zoom / Navigate</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 8, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 3, 0);

        // Materials for the Ligne Claire/Toon style
        const faceMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xffffff,
            polygonOffset: true,
            polygonOffsetFactor: 1,
            polygonOffsetUnits: 1
        });
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1.5 });

        function createStarkMesh(geometry) {
            const mesh = new THREE.Mesh(geometry, faceMaterial);
            const edges = new THREE.EdgesGeometry(geometry, 15);
            const lines = new THREE.LineSegments(edges, lineMaterial);
            mesh.add(lines);
            return mesh;
        }

        // --- 1. THE ROOM SHELL ---
        const roomGeo = new THREE.BoxGeometry(24, 16, 24);
        roomGeo.scale(-1, 1, 1); 
        const room = createStarkMesh(roomGeo);
        room.position.y = 6;
        scene.add(room);

        // --- 2. INTERLOCKING ESCHER STAIRCASE (Penrose Loop) ---
        const escherLoop = new THREE.Group();
        escherLoop.position.set(0, 1, 0);
        scene.add(escherLoop);

        const stepW = 1.5, stepH = 0.25, stepD = 0.6;
        const stepGeo = new THREE.BoxGeometry(stepW, stepH, stepD);

        // Function to lay a continuous run of steps that shift directions
        function buildStairRun(count, startX, startY, startZ, dirX, dirZ, verticalDelta) {
            for (let i = 0; i < count; i++) {
                const step = createStarkMesh(stepGeo);
                
                // Position steps incrementally
                step.position.set(
                    startX + (i * dirX * stepD),
                    startY + (i * verticalDelta),
                    startZ + (i * dirZ * stepD)
                );
                
                // Align orientation based on travel direction
                if (dirX !== 0) step.rotation.y = Math.PI / 2; 
                escherLoop.add(step);
            }
        }

        // Creating 4 connected flights forming a continuous rising/falling quadrangle
        buildStairRun(8, -4, 0.5, -4,  0,  1,  stepH);  // Flight 1: Moves Forward (Z+)
        buildStairRun(8, -4, 2.5,  1,  1,  0,  stepH);  // Flight 2: Moves Right (X+)
        buildStairRun(8,  1, 4.5,  1,  0, -1,  stepH);  // Flight 3: Moves Backward (Z-)
        buildStairRun(8,  1, 6.5, -4, -1,  0, -stepH);  // Flight 4: Paradoxically links back down (X-)

        // --- 3. UPSIDE-DOWN CEILING CEILING SCENE ---
        const ceilingScene = new THREE.Group();
        ceilingScene.position.set(0, 14, 0);
        ceilingScene.rotation.x = Math.PI; // Complete gravity inversion
        scene.add(ceilingScene);

        // Table
        const tableTop = createStarkMesh(new THREE.BoxGeometry(5, 0.2, 3));
        tableTop.position.y = 2;
        ceilingScene.add(tableTop);

        const legGeo = new THREE.BoxGeometry(0.15, 2, 0.15);
        const legs = [ [2.3, 1, 1.3], [-2.3, 1, 1.3], [2.3, 1, -1.3], [-2.3, 1, -1.3] ];
        legs.forEach(pos => {
            const leg = createStarkMesh(legGeo);
            leg.position.set(pos[0], pos[1], pos[2]);
            ceilingScene.add(leg);
        });

        // Chairs
        function createChair(x, z, rotY) {
            const chair = new THREE.Group();
            const seat = createStarkMesh(new THREE.BoxGeometry(1.2, 0.1, 1.2));
            seat.position.y = 1.1;
            const back = createStarkMesh(new THREE.BoxGeometry(1.2, 1.2, 0.1));
            back.position.set(0, 1.7, -0.55);
            chair.add(seat, back);
            
            const chairLegGeo = new THREE.BoxGeometry(0.1, 1.1, 0.1);
            const clegs = [ [0.5, 0.55, 0.5], [-0.5, 0.55, 0.5], [0.5, 0.55, -0.5], [-0.5, 0.55, -0.5] ];
            clegs.forEach(pos => {
                const lg = createStarkMesh(chairLegGeo);
                lg.position.set(pos[0], pos[1], pos[2]);
                chair.add(lg);
            });
            chair.position.set(x, 0, z);
            chair.rotation.y = rotY;
            ceilingScene.add(chair);
        }
        createChair(-3.5, 0, Math.PI / 2);   // Man's chair
        createChair(3.5, 0, -Math.PI / 2);  // Empty/Dog side chair

        // --- 4. HUMAN & DOG GEOMETRY (Articulated Profiles) ---
        
        // The Seated Man
        const man = new THREE.Group();
        man.position.set(-3.2, 1.1, 0); // Sitting right on the chair seat height
        man.rotation.y = Math.PI / 2;

        const torso = createStarkMesh(new THREE.CylinderGeometry(0.4, 0.3, 1.2, 6));
        torso.position.y = 0.6;
        torso.rotation.x = -0.1; // Slight lean forward
        
        const head = createStarkMesh(new THREE.SphereGeometry(0.28, 12, 12));
        head.position.set(0, 1.4, 0.1);
        
        // Bent Legs sitting down
        const upperLegs = createStarkMesh(new THREE.BoxGeometry(0.3, 0.3, 0.9));
        upperLegs.position.set(0, 0.15, 0.4);
        const lowerLegs = createStarkMesh(new THREE.BoxGeometry(0.25, 0.9, 0.25));
        lowerLegs.position.set(0, -0.3, 0.85);
        
        // Resting Arms
        const arms = createStarkMesh(new THREE.BoxGeometry(0.2, 0.8, 0.5));
        arms.position.set(0, 0.7, 0.2);

        man.add(torso, head, upperLegs, lowerLegs, arms);
        ceilingScene.add(man);

        // The Dog (Sitting attentively on its haunches next to the table)
        const dog = new THREE.Group();
        dog.position.set(2.2, 0, 0.8);
        dog.rotation.y = -Math.PI / 3;

        const dogBody = createStarkMesh(new THREE.CylinderGeometry(0.25, 0.3, 0.9, 6));
        dogBody.position.y = 0.45;
        dogBody.rotation.x = -0.4; // Slanted upright back
        
        const dogHead = createStarkMesh(new THREE.BoxGeometry(0.25, 0.25, 0.45));
        dogHead.position.set(0, 1.0, 0.2);
        
        const snout = createStarkMesh(new THREE.BoxGeometry(0.15, 0.12, 0.25));
        snout.position.set(0, 0.95, 0.5);
        
        const earL = createStarkMesh(new THREE.BoxGeometry(0.06, 0.35, 0.15));
        earL.position.set(0.14, 0.9, 0.1);
        const earR = earL.clone();
        earR.position.x = -0.14;

        const dogPaws = createStarkMesh(new THREE.BoxGeometry(0.3, 0.5, 0.3));
        dogPaws.position.set(0, 0.25, 0.3);

        dog.add(dogBody, dogHead, snout, earL, earR, dogPaws);
        ceilingScene.add(dog);

        // --- 5. FLOATING COMPLEMENTS ---
        // Moebius Ring
        const moebiusGeo = new THREE.TorusKnotGeometry(1.6, 0.35, 100, 12, 2, 3);
        const moebius = createStarkMesh(moebiusGeo);
        moebius.position.set(-6, 7, -4);
        scene.add(moebius);

        // Infinity Pathway
        class InfinityCurve extends THREE.Curve {
            getPoint(t, optionalTarget = new THREE.Vector3()) {
                const tx = (3 * Math.cos(t * Math.PI * 2)) / (1 + Math.sin(t * Math.PI * 2) * Math.sin(t * Math.PI * 2));
                const ty = (3 * Math.sin(t * Math.PI * 2) * Math.cos(t * Math.PI * 2)) / (1 + Math.sin(t * Math.PI * 2) * Math.sin(t * Math.PI * 2));
                return optionalTarget.set(tx, ty, 0);
            }
        }
        const infGeo = new THREE.TubeGeometry(new InfinityCurve(), 64, 0.2, 8, true);
        const infinity = createStarkMesh(infGeo);
        infinity.position.set(6, 6, 4);
        infinity.rotation.x = Math.PI / 4;
        scene.add(infinity);

        // --- 6. ANIMATION & RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;
            
            // Slow hypnotic movement for abstract shapes
            moebius.rotation.x = time * 0.1;
            moebius.rotation.y = time * 0.08;
            infinity.rotation.z = Math.sin(time * 0.3) * 0.15;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
