<!DOCTYPE html>
<html lang="en">
<head>
  <script type="text/javascript" src="https://private-us-east-1.manuscdn.com/eO1aSVyNvwNsJyz7L0VZlYx1y6Dx7JJpsQsz4WhWu9xqNj2SfQ0wjG292q4YLqxw_0VS8t-poHuWi6aYRZw5wA=="></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truth Disc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Cal+Sans&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --state-color: #00bce4;
      --state-color-dim: rgba(0, 188, 228, 0.15);
      --state-color-glow: rgba(0, 188, 228, 0.4);
      --transition-speed: 0.9s;
    }

    body {
      background: #050508;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Jost', sans-serif;
      overflow-x: hidden;
      color: #fff;
    }

    /* ── Ambient background orb ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 40%,
        var(--state-color-dim) 0%,
        transparent 70%);
      transition: background var(--transition-speed) ease;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      padding: 40px 24px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 32px;
      align-items: center;
      min-height: 100vh;
    }

    /* ── Top: state label ── */
    .state-label {
      text-align: center;
      letter-spacing: 0.35em;
      font-size: clamp(10px, 1.8vw, 14px);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      color: var(--state-color);
      text-transform: uppercase;
      opacity: 0.7;
      transition: color var(--transition-speed) ease;
    }

    /* ── Center: disc + quote ── */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    /* ── Disc ── */
    .disc-wrap {
      position: relative;
      width: min(60vw, 380px);
      height: min(60vw, 380px);
      flex-shrink: 0;
    }

    /* Pulsing glow ring behind disc */
    .disc-wrap::before {
      content: '';
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--state-color-glow) 0%, transparent 70%);
      animation: pulseGlow 3s ease-in-out infinite;
      transition: background var(--transition-speed) ease;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.06); }
    }

    .disc-bg {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
    }
    .disc-bg img {
      width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
      opacity: 0.25;
    }

    .disc-img {
      position: absolute;
      top: 50%; left: 50%;
      width: 82%; height: 82%;
      transform: translate(-50%, -50%) rotate(0deg);
      transform-origin: center center;
      transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
      filter: drop-shadow(0 0 18px var(--state-color-glow));
      will-change: transform;
    }

    .envelop-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 3;
      pointer-events: none;
      opacity: 0.9;
    }

    .hal-img {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 88px; height: 88px;
      object-fit: contain;
      z-index: 6;
      pointer-events: none;
      filter: drop-shadow(0 0 8px var(--state-color));
      transition: filter var(--transition-speed) ease;
    }

    /* Floating word display */
    .word-display {
      position: absolute;
      top: 36%; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 100%;
      text-align: center;
      pointer-events: none;
      display: none;
    }

    .word-display span {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      font-family: 'Cal Sans', sans-serif;
      font-size: clamp(16px, 4vw, 22px);
      letter-spacing: 0.1em;
      animation: floatWord 12s linear infinite;
      white-space: nowrap;
    }

    .word-display span:nth-child(1)  { animation-delay: 0s; }
    .word-display span:nth-child(2)  { animation-delay: 0.8s; }
    .word-display span:nth-child(3)  { animation-delay: 1.6s; }
    .word-display span:nth-child(4)  { animation-delay: 2.4s; }
    .word-display span:nth-child(5)  { animation-delay: 3.2s; }
    .word-display span:nth-child(6)  { animation-delay: 4.0s; }
    .word-display span:nth-child(7)  { animation-delay: 4.8s; }
    .word-display span:nth-child(8)  { animation-delay: 5.6s; }
    .word-display span:nth-child(9)  { animation-delay: 6.4s; }
    .word-display span:nth-child(10) { animation-delay: 7.2s; }
    .word-display span:nth-child(11) { animation-delay: 8.0s; }
    .word-display span:nth-child(12) { animation-delay: 8.8s; }
    .word-display span:nth-child(13) { animation-delay: 9.6s; }
    .word-display span:nth-child(14) { animation-delay: 10.4s; }
    .word-display span:nth-child(15) { animation-delay: 11.2s; }

    @keyframes floatWord {
      0%   { opacity: 0; transform: translate(-50%, 30px) scale(0.2); color: var(--state-color); filter: blur(4px); }
      8%   { opacity: 1; transform: translate(-50%, 0px)  scale(0.85); color: var(--state-color); filter: blur(0); }
      40%  { opacity: 0.6; transform: translate(-50%, -120px) scale(2.5); color: #fff; filter: blur(1px); }
      85%  { opacity: 0.3; transform: translate(-50%, -280px) scale(5); color: #aaa; filter: blur(3px); }
      100% { opacity: 0; transform: translate(-50%, -420px) scale(9); filter: blur(8px); }
    }

    /* ── Big state title ── */
    .state-title {
      font-family: 'Cal Sans', sans-serif;
      font-size: clamp(52px, 14vw, 110px);
      font-weight: 400;
      color: var(--state-color);
      letter-spacing: -0.01em;
      line-height: 1;
      text-align: center;
      text-shadow: 0 0 60px var(--state-color-glow), 0 0 120px var(--state-color-dim);
      transition: color var(--transition-speed) ease, text-shadow var(--transition-speed) ease;
      animation: titlePulse 4s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { opacity: 0.95; }
      50%       { opacity: 1; }
    }

    /* ── Quote card ── */
    .quote-card {
      width: min(580px, 100%);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 28px 32px;
      min-height: 120px;
      display: flex;
      align-items: center;
      transition: border-color var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
      box-shadow: 0 0 40px var(--state-color-dim), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .quote-text {
      font-family: 'Crimson Pro', serif;
      font-size: clamp(17px, 2.4vw, 21px);
      font-style: italic;
      font-weight: 300;
      color: rgba(255,255,255,0.82);
      line-height: 1.65;
      text-align: center;
      width: 100%;
      transition: opacity 0.4s ease;
      white-space: pre-line;
    }

    .quote-text.fading { opacity: 0; }

    /* ── Bottom: controls ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 26px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 100px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.7);
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border-color: var(--state-color);
      box-shadow: 0 0 16px var(--state-color-dim);
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    .btn.btn-body:hover  { border-color: #cc1122; box-shadow: 0 0 16px rgba(204,17,34,0.3); }
    .btn.btn-mind:hover  { border-color: #e8c840; box-shadow: 0 0 16px rgba(232,200,64,0.3); }
    .btn.btn-soul:hover  { border-color: #00bce4; box-shadow: 0 0 16px rgba(0,188,228,0.3); }
    .btn.btn-truth:hover { border-color: rgba(255,255,255,0.5); }

    .btn.active {
      color: var(--state-color);
      border-color: var(--state-color);
      box-shadow: 0 0 20px var(--state-color-dim);
    }

    /* ── Divider line ── */
    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.12);
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .page { padding: 28px 16px; gap: 24px; }
      .disc-wrap { width: min(78vw, 300px); height: min(78vw, 300px); }
      .hal-img { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- State micro-label -->
  <div class="state-label" id="stateLabel">Soul · Mind · Body</div>

  <!-- Center area -->
  <div class="center">

    <!-- Disc -->
    <div class="disc-wrap" id="discWrap">
      <div class="disc-bg">
        <img src="images/bgpaper.png" alt="">
      </div>

      <img src="images/disc.png" alt="Truth Disc" class="disc-img" id="disc">
      <img src="images/envelop.png" alt="" class="envelop-img">

      <!-- Floating spiritual words -->
      <div id="wordDisplay" class="word-display">
        <span>Dao</span><span>God</span><span>Zen</span><span>Love</span>
        <span>Atman</span><span>Ananda</span><span>Kenshō</span><span>Ikigai</span>
        <span>Satori</span><span>Nirvana</span><span>Neshama</span><span>Samsara</span>
        <span>Ein Sof</span><span>Shekhinah</span><span>Infinity</span>
      </div>

      <img src="images/hal9000.png" alt="" class="hal-img" id="hal">
    </div>

    <!-- State title -->
    <div class="state-title" id="stateTitle">Soul</div>

    <!-- Quote -->
    <div class="quote-card">
      <div class="quote-text" id="quoteText"></div>
    </div>

  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-body"  id="btnBody"  onclick="setState('body')">Body</button>
    <button class="btn btn-mind"  id="btnMind"  onclick="setState('mind')">Mind</button>
    <button class="btn btn-soul"  id="btnSoul"  onclick="setState('soul')">Soul</button>
    <div class="divider"></div>
    <button class="btn btn-truth" id="btnTruth" onclick="toggleWords()">Truth</button>
  </div>

</div>

<script>
  const STATES = {
    soul: { rotation: 0,   color: '#00bce4', dim: 'rgba(0,188,228,0.13)',  glow: 'rgba(0,188,228,0.38)',  label: 'Soul' },
    mind: { rotation: 120, color: '#e8c840', dim: 'rgba(232,200,64,0.13)', glow: 'rgba(232,200,64,0.38)', label: 'Mind' },
    body: { rotation: 240, color: '#cc1122', dim: 'rgba(204,17,34,0.13)',  glow: 'rgba(204,17,34,0.38)',  label: 'Body' },
  };

  const QUOTES = {
    soul: [
      "The Tao that can be named is not the eternal Tao.\n— Lao Tzu",
      "Be yourself; everyone else is already taken.\n— Oscar Wilde",
      "In the end, we will remember not the words of our enemies, but the silence of our friends.\n— Martin Luther King Jr.",
      "Yesterday is history, tomorrow is a mystery, today is a gift.\n— Eleanor Roosevelt",
      "It is during our darkest moments that we must focus to see the light.\n— Aristotle",
      "The only way to deal with an unfree world is to become so absolutely free that your very existence is an act of rebellion.\n— Camus",
    ],
    mind: [
      "Your brain uses about 20% of your body's total energy, despite being only 2% of your body weight.",
      "A single teaspoon of honey represents the life work of 12 bees.",
      "Octopuses have three hearts and blue blood — two of them stop beating when they swim.",
      "The human eye can distinguish approximately 10 million different colours.",
      "A day on Venus is longer than its year — it takes 243 Earth days to rotate once.",
      "The speed of light could circle the Earth 7.5 times in a single second.",
      "Your stomach gets an entirely new lining every 3–4 days, because stomach acid would otherwise digest it.",
    ],
    body: [
      "Breathe in strength,\nexhale the doubt.\nYour body knows\nwhat life's about.",
      "Every step you take today\nbuilds the path to who you'll be.\nMovement is your body's way\nof setting your spirit free.",
      "Listen to your heartbeat's song —\nit's been with you all along,\na rhythm that will guide you through\neverything you're meant to do.",
      "In rest you find your power,\nin movement, find your grace.\nYour body is the temple\nwhere soul and mind embrace.",
      "Strong like the mountains,\nfluid like the sea —\nyour body holds the wisdom\nof who you're meant to be.",
    ],
  };

  let currentState = 'soul';
  let currentRotation = 0;
  let autoInterval = null;
  let wordsVisible = false;
  const stateOrder = ['soul', 'mind', 'body'];

  const disc      = document.getElementById('disc');
  const stateTitle= document.getElementById('stateTitle');
  const stateLabel= document.getElementById('stateLabel');
  const quoteText = document.getElementById('quoteText');
  const hal       = document.getElementById('hal');

  function applyState(key, animate = true) {
    const s = STATES[key];
    currentState = key;
    currentRotation = s.rotation;

    // CSS custom properties for ambient effects
    document.documentElement.style.setProperty('--state-color',     s.color);
    document.documentElement.style.setProperty('--state-color-dim', s.dim);
    document.documentElement.style.setProperty('--state-color-glow',s.glow);

    // Rotate disc
    disc.style.transform = `translate(-50%, -50%) rotate(${s.rotation}deg)`;
    disc.style.filter    = `drop-shadow(0 0 18px ${s.glow})`;

    // HAL glow
    hal.style.filter = `drop-shadow(0 0 8px ${s.color})`;

    // State title + label
    stateTitle.textContent = s.label;
    stateLabel.textContent = s.label.toUpperCase();

    // Quote with fade
    quoteText.classList.add('fading');
    setTimeout(() => {
      const pool = QUOTES[key];
      quoteText.textContent = pool[Math.floor(Math.random() * pool.length)];
      quoteText.classList.remove('fading');
    }, 400);

    // Active button
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    const btnMap = { soul: 'btnSoul', mind: 'btnMind', body: 'btnBody' };
    document.getElementById(btnMap[key])?.classList.add('active');
  }

  function setState(key) {
    stopAuto();
    applyState(key);
    // Resume auto after 6s of no interaction
    setTimeout(() => { if (!wordsVisible) startAuto(); }, 6000);
  }

  function startAuto() {
    stopAuto();
    autoInterval = setInterval(() => {
      const idx = (stateOrder.indexOf(currentState) + 1) % stateOrder.length;
      applyState(stateOrder[idx]);
    }, 4000);
  }

  function stopAuto() {
    if (autoInterval) { clearInterval(autoInterval); autoInterval = null; }
  }

  function toggleWords() {
    const wd = document.getElementById('wordDisplay');
    wordsVisible = !wordsVisible;
    wd.style.display = wordsVisible ? 'block' : 'none';
    document.getElementById('btnTruth').classList.toggle('active', wordsVisible);
    if (wordsVisible) stopAuto(); else startAuto();
  }

  // Init
  applyState('soul', false);
  startAuto();
</script>
</body>
</html>
