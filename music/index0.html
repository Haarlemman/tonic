<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonic for the Bones - Playlist Annotator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .spotify-gradient {
            background: linear-gradient(to bottom, #1e3a3a 0%, #121212 100%);
        }
    </style>
</head>
<body class="text-white">

    <div class="min-h-screen flex justify-center py-8 px-4">
        <div id="app-container" class="w-full max-w-md bg-[#121212] rounded-xl shadow-2xl overflow-hidden flex flex-col h-[92vh] border border-[#282828]">
            
            <!-- Spotify-style Header -->
            <div class="spotify-gradient p-6 shrink-0 relative">
                <div class="flex gap-4 items-end">
                    <div class="w-28 h-28 sm:w-32 sm:h-32 bg-[#282828] shadow-2xl flex items-center justify-center rounded-md overflow-hidden shrink-0">
                        <div class="bg-[#1DB954] p-6 rounded-full">
                            <i data-lucide="music" class="text-white w-10 h-10 sm:w-12 sm:h-12"></i>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1 min-w-0">
                        <span class="text-[10px] font-bold uppercase tracking-widest text-slate-300">Public Playlist</span>
                        <h1 class="text-xl sm:text-2xl font-black tracking-tight leading-none truncate">Tonic for the Bones</h1>
                        <p class="text-xs text-slate-400 mt-2 font-medium"><span id="track-count">17</span> tracks • <span class="text-white">showroomdummy</span></p>
                    </div>
                </div>
                
                <div class="mt-6 flex items-center gap-6">
                    <button class="w-12 h-12 bg-[#1DB954] rounded-full flex items-center justify-center hover:scale-105 transition-transform shadow-lg">
                        <i data-lucide="play" class="fill-black text-black w-6 h-6 ml-1"></i>
                    </button>
                    <i data-lucide="heart" class="text-[#1DB954] w-7 h-7"></i>
                    <i data-lucide="more-horizontal" class="text-slate-400 w-6 h-6"></i>
                </div>
            </div>

            <!-- Scrollable Tracks List -->
            <div id="tracks-list" class="flex-1 overflow-y-auto px-4 py-2 space-y-6 scrollbar-hide">
                <!-- Content generated by JS -->
            </div>

            <!-- Minimal Footer -->
            <div class="p-4 border-t border-[#282828] bg-[#121212] shrink-0 text-center">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">© Tonic for the Bones</p>
            </div>
        </div>
    </div>

    <script>
        const CATEGORIES = {
            framework: { name: "The Framework", icon: "hash", accent: "#1DB954", bg: "bg-[#181818]" },
            tonic: { name: "The Tonic", icon: "heart", accent: "#F43F5E", bg: "bg-[#1e1416]" },
            movement: { name: "Resilience & Movement", icon: "zap", accent: "#F59E0B", bg: "bg-[#1e1a12]" },
            creative: { name: "Creative Spark", icon: "book-open", accent: "#6366F1", bg: "bg-[#14151f]" }
        };

        // Edit this array to update your playlist content
        let tracks = [
            { id: '1', category: 'lament', title: "You Want It Darker", artist: "Leonard Cohen", background: "A meditation on faith and the 'hineni' moment. Fits the Jewish themes of the book.", spotifyUrl: "https://open.spotify.com/track/5o9mBKcxVVZAsnF5Cd4AJ7?si=103ef9df580d47a3", img: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&h=100&fit=crop" },
            { id: '2', category: 'framework', title: "Goldberg Variations", artist: "J.S. Bach", background: "The ultimate mathematical framework. Control within a strict structure.", spotifyUrl: "", img: "" },
            { id: '3', category: 'framework', title: "Everything In Its Right Place", artist: "Radiohead", background: "The paradox of order in a world of surprises.", spotifyUrl: "", img: "" },
            { id: '4', category: 'framework', title: "Once in a Lifetime", artist: "Talking Heads", background: "Reflecting on the 'twists and turns' of a life we didn't necessarily choose.", spotifyUrl: "", img: "" },
            { id: '5', category: 'tonic', title: "Blackbird", artist: "The Beatles", background: "For Yaron. A song about waiting for the moment to arise and find your wings.", spotifyUrl: "", img: "" },
            { id: '6', category: 'tonic', title: "Into My Arms", artist: "Nick Cave", background: "A song for Ailish. Pure, unadulterated protection and love.", spotifyUrl: "", img: "" },
            { id: '7', category: 'tonic', title: "Somewhere Over the Rainbow", artist: "Israel IZ", background: "Simple beauty to reach for.", spotifyUrl: "", img: "" },
            { id: '8', category: 'tonic', title: "Jerusalem of Gold", artist: "Naomi Shemer", background: "Connecting to my roots and history.", spotifyUrl: "", img: "" },
            { id: '9', category: 'movement', title: "Shake It Out", artist: "Florence + The Machine", background: "Addressing physical tremors through emotional release.", spotifyUrl: "", img: "" },
            { id: '10', category: 'movement', title: "Lazarus", artist: "David Bowie", background: "Facing mortality and physical change with defiance.", spotifyUrl: "", img: "" },
            { id: '11', category: 'movement', title: "Graceland", artist: "Paul Simon", background: "A journey of the bones and the spirit.", spotifyUrl: "", img: "" },
            { id: '12', category: 'movement', title: "So What", artist: "Miles Davis", background: "Cool under pressure. Movement that doesn't feel forced.", spotifyUrl: "", img: "" },
            { id: '13', category: 'movement', title: "Peace Piece", artist: "Bill Evans", background: "Finding the center of gravity.", spotifyUrl: "", img: "" },
            { id: '14', category: 'creative', title: "Spiegel im Spiegel", artist: "Arvo Pärt", background: "The repetitive structure I need when writing the 'Bones' chapters.", spotifyUrl: "", img: "" },
            { id: '15', category: 'creative', title: "Music for Airports", artist: "Brian Eno", background: "Ambient space for design thinking.", spotifyUrl: "", img: "" },
            { id: '16', category: 'creative', title: "Mi'Ma'amakim", artist: "Idan Raichel Project", background: "The deep creative well. 'Out of the depths'.", spotifyUrl: "", img: "" },
            { id: '17', category: 'creative', title: "Feeling Good", artist: "Nina Simone", background: "The mood for a successful day of finishing a difficult paragraph.", spotifyUrl: "", img: "" }
        ];

        function render() {
            const listEl = document.getElementById('tracks-list');
            listEl.innerHTML = '';
            document.getElementById('track-count').innerText = tracks.length;

            Object.keys(CATEGORIES).forEach(catKey => {
                const groupTracks = tracks.filter(t => t.category === catKey);
                if (groupTracks.length === 0) return;

                const catInfo = CATEGORIES[catKey];
                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="flex items-center gap-2 mb-3 border-b border-[#282828] pb-1">
                        <i data-lucide="${catInfo.icon}" class="w-3.5 h-3.5" style="color: ${catInfo.accent}"></i>
                        <h2 class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">${catInfo.name}</h2>
                    </div>
                    <div id="group-${catKey}" class="space-y-1"></div>
                `;
                listEl.appendChild(section);

                const groupContainer = section.querySelector(`#group-${catKey}`);
                groupTracks.forEach((track, idx) => {
                    const trackEl = document.createElement('div');
                    trackEl.className = `group flex flex-col rounded-md transition-colors hover:bg-[#ffffff08]`;
                    
                    trackEl.innerHTML = `
                        <div class="p-2 flex gap-3 items-start relative">
                            <div class="text-[11px] text-slate-500 w-4 pt-1 text-center font-medium">${idx + 1}</div>
                            <div class="w-10 h-10 bg-[#282828] rounded shrink-0 overflow-hidden shadow-md border border-[#ffffff10]">
                                ${track.img ? `<img src="${track.img}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center"><i data-lucide="music" class="w-4 h-4 text-slate-600"></i></div>`}
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-bold text-sm truncate pr-4">${track.title}</h3>
                                <p class="text-[11px] text-slate-400 truncate mb-2">${track.artist}</p>
                                <div class="text-[11px] leading-relaxed p-2 rounded-md ${catInfo.bg} border border-[#ffffff05] italic text-slate-300">
                                    ${track.background}
                                </div>
                                ${track.spotifyUrl ? `<a href="${track.spotifyUrl}" target="_blank" class="mt-2 inline-flex items-center gap-1 text-[9px] font-bold text-[#1DB954] uppercase hover:underline"><i data-lucide="external-link" class="w-2.5 h-2.5"></i> Open Spotify</a>` : ''}
                            </div>
                        </div>
                    `;
                    groupContainer.appendChild(trackEl);
                });
            });

            lucide.createIcons();
        }

        window.onload = render;
    </script>
</body>
</html>
