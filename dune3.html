<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evasive Nature</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            /* Gradient: Pale Yellow (#effac0) -> White -> Sky Blue -> Dark Deep Navy */
            background: linear-gradient(to top, 
                #effac0 0%, 
                #ffffff 10%, 
                #bae6fd 35%, 
                #075985 75%, 
                #020617 100%
            );
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* UI Overlays */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #020617;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #effac0;
            text-align: center;
            transition: opacity 1.5s ease;
        }

        #intro-text {
            font-size: 0.9rem;
            font-weight: 300;
            max-width: 400px;
            letter-spacing: 5px;
            margin-bottom: 40px;
            padding: 0 20px;
            text-transform: uppercase;
            line-height: 2.2;
        }

        .action-btn {
            background: transparent;
            border: 1px solid #effac0;
            color: #effac0;
            padding: 10px 35px;
            text-transform: uppercase;
            letter-spacing: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.75rem;
        }

        .action-btn:hover {
            background: #effac0;
            color: #020617;
        }

        #hud {
            position: absolute;
            top: 35px;
            left: 35px;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 2s;
        }

        .brand {
            color: #ff0000;
            border-left: 3px solid #993333;
            padding-left: 20px;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 900;
        }

        .brand p {
            margin: 5px 0 0;
            font-size: 0.6rem;
            opacity: 0.8;
            letter-spacing: 3px;
        }

        #faculty-screen {
            position: absolute;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #000;
            padding: 22px;
            pointer-events: none;
            display: none;
            z-index: 80;
            text-align: center;
            transform: translate(-50%, -120%);
            min-width: 220px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .neon-text {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 0.95rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .text-molecule { color: #1e3a8a; } /* Dark Blue */
        .text-pulsar { color: #b91c1c; }  /* Red */
        .text-monolith { color: #000000; } /* Black */
        .text-bone { color: #b45309; } /* Gold/Bronze */

        .sub-data { font-size: 0.5rem; color: #94a3b8; letter-spacing: 2px; font-family: monospace; }

        #audio-controls {
            position: absolute;
            bottom: 35px;
            right: 35px;
            z-index: 90;
            opacity: 0;
            transition: opacity 2s;
        }

        .hud-btn {
            background: #020617;
            border: none;
            color: #effac0;
            padding: 10px 20px;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .hud-btn:hover {
            transform: scale(1.05);
            background: #000;
        }
    </style>
</head>

<body>

    <!-- Audio handling: Attempt to play; if autoplay blocked, user button will trigger it -->
    <audio id="bg-music" loop crossorigin="anonymous">
        <source src="https://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg" type="assets/audio/ogg">
        <!-- Fallback to a reliable standard browser test sound if needed, but using a generic atmospheric track URL here for the example -->
    </audio>

    <div id="intro-overlay">
        <div id="intro-text">Evasive Nature<br>Tonic for the Bones</div>
        <button id="start-btn" class="action-btn">Enter Framework</button>
    </div>

    <div id="hud">
        <div class="brand">
            <h1>Paradox<br>Control</h1>
            <p>ADVERSITY IS YOUR TEACHER</p>
        </div>
    </div>

    <div id="audio-controls">
        <button class="hud-btn" onclick="toggleMusic()">AUDIO: <span id="music-status">OFF</span></button>
    </div>

    <div id="faculty-screen">
        <div id="screen-content" class="neon-text"></div>
        <div class="sub-data">ELEMENT ANALYSIS</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        let dunes, moleculeGroup, pulsarOrb, monolith, lightPulse, goldenBone;
        let electrons = []; // Store electron meshes for animation
        let audioCtx, analyser, dataArray;
        let isAudioInit = false;
        let cinematicTarget = null;
        let lastZoomTime = Date.now();
        const ZOOM_INTERVAL = 11000;

        const POIs = [];
        const quotes = {
            molecule: ["ATOMIC STRUCTURE", "THE BLUEPRINT OF LIFE", "CONSTANT MOTION", "MICROSCOPIC UNIVERSE"],
            pulsar: ["THE HEARTBEAT", "DARK RADIANCE", "CONTAINED CHAOS", "RED DWARF ENERGY"],
            monolith: ["THE SILENT TEACHER", "1 : 4 : 9", "EVOLUTION TRIGGER", "ABSENCE OF REFLECTION"],
            bone: ["ANCIENT REMAINS", "TONIC FOR THE BONES", "HIDDEN HISTORY", "BURIED TRUTH"]
        };

        const screen = document.getElementById('faculty-screen');
        const screenContent = document.getElementById('screen-content');
        const bgMusic = document.getElementById('bg-music');

        function init() {
            scene = new THREE.Scene();
            
            // Camera Setup
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(55, 30, 55); // Lowered slightly for flatter perspective

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.setClearColor(0x000000, 0); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.1; // Don't let camera go below ground

            // Lighting
            const ambient = new THREE.AmbientLight(0xffeecc, 0.4);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(50, 80, 30);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            sun.shadow.camera.near = 0.5;
            sun.shadow.camera.far = 500;
            // Widen shadow camera
            const d = 100;
            sun.shadow.camera.left = -d;
            sun.shadow.camera.right = d;
            sun.shadow.camera.top = d;
            sun.shadow.camera.bottom = -d;
            scene.add(sun);

            // Create Elements
            createFlatDunes();
            createMolecule();
            createPulsatingRedBall();
            create2001Monolith();
            createEasterEgg();

            window.addEventListener('resize', onResize);
            document.getElementById('start-btn').onclick = startExperience;
        }

        function createFlatDunes() {
            const geo = new THREE.PlaneGeometry(450, 450, 180, 180);
            const pos = geo.attributes.position;
            
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                // Flatter calculation: Reduced multipliers from 8/7 to 2.5/2
                const z = Math.sin(x * 0.03) * Math.cos(y * 0.03) * 2.5 + 
                          Math.sin(x * 0.01) * Math.cos(y * 0.02) * 2.0;
                pos.setZ(i, z);
            }
            geo.computeVertexNormals();
            
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0xeffac0, 
                roughness: 0.9, 
                metalness: 0.05,
            });
            dunes = new THREE.Mesh(geo, mat);
            dunes.rotation.x = -Math.PI / 2;
            dunes.receiveShadow = true;
            dunes.castShadow = false;
            scene.add(dunes);
        }

        function createMolecule() {
            moleculeGroup = new THREE.Group();
            
            // Nucleus
            const nucleusGeo = new THREE.SphereGeometry(2.5, 32, 32);
            const nucleusMat = new THREE.MeshPhysicalMaterial({
                color: 0x1e3a8a, // Deep Blue
                emissive: 0x0c4a6e,
                emissiveIntensity: 0.5,
                roughness: 0.2,
                metalness: 0.8,
                clearcoat: 1.0
            });
            const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
            nucleus.castShadow = true;
            moleculeGroup.add(nucleus);

            // Electrons
            const electronGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const electronMat = new THREE.MeshBasicMaterial({ color: 0xbae6fd });
            
            // Create 3 orbiting electrons
            for(let i=0; i<3; i++) {
                const pivot = new THREE.Group();
                const electron = new THREE.Mesh(electronGeo, electronMat);
                // Offset electron from center
                electron.position.set(4 + i, 0, 0); 
                pivot.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0); // Random initial orbit planes
                pivot.add(electron);
                moleculeGroup.add(pivot);
                electrons.push({ pivot: pivot, speed: 0.05 + Math.random() * 0.05 });
            }

            moleculeGroup.position.set(-25, 8, -15);
            moleculeGroup.userData = { type: 'molecule', label: 'THE ATOM' };
            scene.add(moleculeGroup);
            POIs.push(moleculeGroup);
        }

        function createPulsatingRedBall() {
            const group = new THREE.Group();
            
            // The Dark Red Sphere
            const geo = new THREE.SphereGeometry(4.5, 64, 64);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0x330000, // Dark Red base
                emissive: 0xff0000, // Bright Red glow
                emissiveIntensity: 0.2,
                roughness: 0.4,
                metalness: 0.3,
                clearcoat: 0.4
            });
            pulsarOrb = new THREE.Mesh(geo, mat);
            pulsarOrb.castShadow = true;
            group.add(pulsarOrb);

            // Internal Light
            lightPulse = new THREE.PointLight(0xff0000, 1, 30);
            group.add(lightPulse);

            group.position.set(28, 6, -25);
            group.userData = { type: 'pulsar', label: 'THE PULSAR' };
            scene.add(group);
            POIs.push(group);
        }

        function create2001Monolith() {
            const group = new THREE.Group();
            
            // 2001 Ratio: 1:4:9 (Depth, Width, Height)
            // Scaling it to be visible but imposing: 2 x 8 x 18
            const geo = new THREE.BoxGeometry(8, 18, 2); 
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x050505, // Almost pure black
                roughness: 0.05, // Highly polished
                metalness: 0.8,  // Metallic look
            });
            
            const pillar = new THREE.Mesh(geo, mat);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            // Lift it so it sits on the sand (Height is 18, so center is at 9)
            // But we want it partially buried or standing tall. Let's stand it tall.
            pillar.position.y = 0; 
            group.add(pillar);

            group.position.set(5, 9, 35);
            group.rotation.y = Math.PI / 6; // Angled slightly
            group.userData = { type: 'monolith', label: 'THE MONOLITH' };
            scene.add(group);
            POIs.push(group);
            monolith = group;
        }

        function createEasterEgg() {
            // A "Golden Bone" - Cylinder, half buried
            const geo = new THREE.CylinderGeometry(0.4, 0.4, 4, 16);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0xDAA520, // Goldenrod
                roughness: 0.3,
                metalness: 0.8
            });
            goldenBone = new THREE.Mesh(geo, mat);
            goldenBone.rotation.z = Math.PI / 4;
            goldenBone.rotation.y = Math.random() * Math.PI;
            
            // Position it near the Red Ball but slightly hidden
            const eggGroup = new THREE.Group();
            eggGroup.add(goldenBone);
            eggGroup.position.set(32, 1, -20); // Low y to be buried
            
            eggGroup.userData = { type: 'bone', label: 'THE ARTIFACT' };
            scene.add(eggGroup);
            
            // Add to POIs with very low probability in main loop, but here for reference
            POIs.push(eggGroup);
        }

        function toggleMusic() {
            if(!isAudioInit) initAudio();
            if(bgMusic.paused) {
                bgMusic.play().catch(e => console.log("Audio play failed", e));
                document.getElementById('music-status').innerText = "ON";
            } else {
                bgMusic.pause();
                document.getElementById('music-status').innerText = "OFF";
            }
        }

        function initAudio() {
            if (isAudioInit) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(bgMusic);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioInit = true;
            } catch(e) {
                console.warn("Audio Context init failed (likely CORS or Interaction)", e);
            }
        }

        function startExperience() {
            initAudio();
            bgMusic.play().then(() => {
                document.getElementById('music-status').innerText = "ON";
            }).catch(() => {
                document.getElementById('music-status').innerText = "OFF (Click Audio)";
            });

            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.display = 'none';
                document.getElementById('hud').style.opacity = 1;
                document.getElementById('audio-controls').style.opacity = 1;
            }, 1500);
        }

        function updateUI(poi) {
            if(!poi) { screen.style.display = 'none'; return; }
            screen.style.display = 'block';
            const type = poi.userData.type;
            const data = quotes[type];
            if(data) {
                screenContent.innerText = data[Math.floor(Date.now()/3500 % data.length)];
                screenContent.className = 'neon-text text-' + type;
                
                const vector = poi.position.clone();
                vector.y += (type === 'monolith' ? 12 : 8); // Adjust label height based on object
                vector.project(camera);
                
                // Keep screen within bounds
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
                
                screen.style.left = x + 'px';
                screen.style.top = y + 'px';
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            
            let bass = 0;
            let mid = 0;
            
            if (isAudioInit && !bgMusic.paused) {
                analyser.getByteFrequencyData(dataArray);
                // Bass frequencies (0-2)
                bass = (dataArray[0] + dataArray[1] + dataArray[2]) / (255 * 3);
                // Mid frequencies (10-15)
                mid = (dataArray[10] + dataArray[11] + dataArray[12]) / (255 * 3);
                
                // Subtle Dune breathing
                if (dunes) {
                    // Only very subtle vertical shift, preserving flatness
                    dunes.position.y = Math.sin(time) * bass * 0.2;
                }

                // MOLECULE Animation
                if (moleculeGroup) {
                    // Rotate entire group slowly
                    moleculeGroup.rotation.y += 0.005;
                    moleculeGroup.rotation.z += 0.002;
                    
                    // Animate Electrons orbit
                    electrons.forEach((e, idx) => {
                        // Increase speed with mid-range audio frequencies
                        e.pivot.rotation.x += e.speed + (mid * 0.2);
                        e.pivot.rotation.y += e.speed + (mid * 0.2);
                    });
                    
                    // Nucleus pulse
                    if(moleculeGroup.children[0]) {
                         moleculeGroup.children[0].scale.setScalar(1 + bass * 0.2);
                    }
                }
                
                // RED PULSAR Animation
                if (pulsarOrb && lightPulse) {
                    // Expansion pulse
                    const scale = 1 + Math.sin(time * 3) * 0.1 + (bass * 0.4);
                    pulsarOrb.scale.set(scale, scale, scale);
                    
                    // Glow intensity pulse
                    pulsarOrb.material.emissiveIntensity = 0.2 + Math.abs(Math.sin(time * 2)) * 0.5 + bass;
                    lightPulse.intensity = 1 + bass * 2;
                }

                // MONOLITH Animation
                if (monolith) {
                    // It stays mostly still (The "Silent Sentinel")
                    // Maybe a very slow vertical drift
                    monolith.position.y = 9 + Math.sin(time * 0.5) * 0.2;
                    
                    // Reacts to low bass by slightly increasing metalness/reflection
                    // Or maybe a slight rotation
                    // monolith.rotation.y = (Math.PI / 6) + Math.sin(time) * 0.02;
                }
            } else {
                // Idle animations if no music
                if (moleculeGroup) {
                    moleculeGroup.rotation.y += 0.005;
                    electrons.forEach(e => {
                        e.pivot.rotation.x += e.speed;
                        e.pivot.rotation.y += e.speed;
                    });
                }
                if (pulsarOrb) {
                    const scale = 1 + Math.sin(time * 2) * 0.1;
                    pulsarOrb.scale.set(scale, scale, scale);
                    pulsarOrb.material.emissiveIntensity = 0.2 + Math.abs(Math.sin(time * 2)) * 0.3;
                }
            }

            // Cinematic Logic
            if (Date.now() - lastZoomTime > ZOOM_INTERVAL) {
                // Randomly pick a target, occasionally pick null (wide shot)
                const rand = Math.random();
                if(rand < 0.25) cinematicTarget = null;
                else cinematicTarget = POIs[Math.floor(Math.random() * POIs.length)];
                
                lastZoomTime = Date.now();
            }

            if (cinematicTarget) {
                // Smooth follow
                const targetPos = cinematicTarget.position.clone();
                controls.target.lerp(targetPos, 0.03);
                
                // Zoom in slightly based on object size
                let targetZoom = 1.4;
                if(cinematicTarget.userData.type === 'monolith') targetZoom = 1.2;
                if(cinematicTarget.userData.type === 'bone') targetZoom = 2.5; // Zoom close for the small egg
                
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, targetZoom, 0.02);
                updateUI(cinematicTarget);
            } else {
                // Return to wide
                controls.target.lerp(new THREE.Vector3(0,0,0), 0.02);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.02);
                updateUI(null);
            }

            camera.updateProjectionMatrix();
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
