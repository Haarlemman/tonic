<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D</title>
<style>
    body { margin:0; background:#000; overflow:hidden; display:flex; justify-content:center; align-items:center; height:100vh; }
    .atom-container { position:relative; width:600px; height:600px; }

    .nucleus {
        position:absolute; top:50%; left:50%;
        width:160px; height:160px; margin:-80px 0 0 -80px;
        background:radial-gradient(circle, #ffcc00, #fff 80%, #ffea88);
        border-radius:50%;
        box-shadow:0 0 70px #ffffff, 0 0 140px #ffffcc, 0 0 240px #ffea88, 0 0 380px rgba(255,255,200,1.8);
        z-index:500;
    }

    .electron {
        position:absolute; width:40px; height:40px; border-radius:50%; margin:-20px 0 0 -20px;
        z-index:600; pointer-events:none;
    }
    #e1 { background:radial-gradient(circle at 30% 30%, #ffffff, #ff2244); box-shadow:0 0 45px #ff4466, inset -8px -8px 20px #900; }
    #e2 { background:radial-gradient(circle at 30% 30%, #ffffff, #3388ff); box-shadow:0 0 45px #55aaff, inset -8px -8px 20px #0066cc; }
    #e3 { background:radial-gradient(circle at 30% 30%, #ffffff, #ffdd22); box-shadow:0 0 45px #ffee66, inset -8px -8px 20px #ccaa00; }

    canvas { position:absolute; inset:0; pointer-events:none; z-index:400; }
    .trail-front { position:absolute; inset:0; pointer-events:none; z-index:550; }
</style>
</head>
<body>
<div class="atom-container">
    <div class="electron" id="e1"></div>
    <div class="electron" id="e2"></div>
    <div class="electron" id="e3"></div>
    <canvas id="trails" width="600" height="600"></canvas>
    <div class="nucleus"></div>
    <canvas id="trailsFront" width="600" height="600" class="trail-front"></canvas>
</div>

<script>
// ██████████████████  EASY TWEAK SETTINGS — CHANGE ONLY THESE  ██████████████████
let speed = 0.018;           // 0.008 = slow, 0.018 = normal, 0.04 = fast
let startOffset = 90;         // 0–360 → rotates the whole system at start
const trailFade = 0.03;      // smaller = longer trails (0.03 = very long)
const trailThickness = 1.0;  // 1.0 = thin, 3.0 = thick
// ███████████████████████████████████████████████████████████████████████████████

const canvas = document.getElementById('trails');
const ctx = canvas.getContext('2d');
const canvasFront = document.getElementById('trailsFront');
const ctxFront = canvasFront.getContext('2d');
ctx.lineWidth = trailThickness;
ctx.lineCap = 'round';
ctxFront.lineWidth = trailThickness;
ctxFront.lineCap = 'round';

const radius = 240;
const centerX = 300;
const centerY = 300;

const electrons = [
    { el: document.getElementById('e1'), color: '#ff4466', offset:   0 + startOffset, tilt: 0,               flatten: 0.88 },
    { el: document.getElementById('e2'), color: '#55aaff', offset: 120 + startOffset, tilt: 60*Math.PI/180, flatten: 0.65 },
    { el: document.getElementById('e3'), color: '#ffee66', offset: 240 + startOffset, tilt: 120*Math.PI/180, flatten: 0.65 }
];

let time = 0;

function animate() {
    time += speed;

    ctx.fillStyle = `rgba(0,0,0,${trailFade})`;
    ctx.fillRect(0,0,600,600);
    ctxFront.fillStyle = `rgba(0,0,0,${trailFade})`;
    ctxFront.fillRect(0,0,600,600);

    electrons.forEach(e => {
        const angle = time + e.offset * Math.PI / 180;

        // Create elliptical orbit
        let x = Math.cos(angle) * radius;
        let y = Math.sin(angle) * radius * (1 - e.flatten);
        let z = 0;

        // Apply 3D rotation around Y-axis (tilt)
        const cosT = Math.cos(e.tilt);
        const sinT = Math.sin(e.tilt);
        const rotX = x * cosT - z * sinT;
        const rotZ = x * sinT + z * cosT;
        
        // Apply rotation around X-axis for more separation
        const xRot = Math.cos(e.tilt * 0.5);
        const yRot = Math.sin(e.tilt * 0.5);
        const finalY = y * xRot + rotZ * yRot;
        const finalZ = -y * yRot + rotZ * xRot;

        const scale = 1 + finalZ * 0.0015;

        e.el.style.left   = (centerX + rotX) + 'px';
        e.el.style.top    = (centerY + finalY)   + 'px';
        e.el.style.transform = `scale(${scale})`;
        e.el.style.zIndex = finalZ < 0 ? 400 : 600;

        // Draw trail on appropriate canvas based on depth
        const trailCtx = finalZ < 0 ? ctx : ctxFront;
        
        // thin glowing trail
        trailCtx.globalAlpha = 0.35;
        trailCtx.strokeStyle = e.color;
        trailCtx.beginPath();
        trailCtx.moveTo(centerX + rotX, centerY + finalY);
        trailCtx.lineTo(centerX + rotX + 0.01, centerY + finalY + 0.01);
        trailCtx.stroke();

        // tiny glow dot (doesn't cover the ball)
        trailCtx.globalAlpha = 0.05;
        trailCtx.beginPath();
        trailCtx.arc(centerX + rotX, centerY + finalY, 3, 0, Math.PI*2);
        trailCtx.fillStyle = e.color;
        trailCtx.fill();
    });

    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
