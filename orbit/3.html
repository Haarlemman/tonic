<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Atomic Orbits</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
        }

        .scene {
            width: 300px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateScene 20s infinite linear;
        }

        @keyframes rotateScene {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .sun {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #fff, #ffff99);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 40px #ffff66, 0 0 80px #ffcc00;
            z-index: 10;
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
        }

        .path {
            position: absolute;
            border: 2px solid;
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        .electron {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            position: absolute;
            top: -9px;
            left: 50%;
            margin-left: -9px;
            box-shadow: 0 0 15px currentColor;
        }

        /* Red orbit - equatorial plane */
        .orbit.red {
            width: 220px;
            height: 220px;
            margin: -110px 0 0 -110px;
            animation: spinRed 3s infinite linear;
        }

        .path.red {
            width: 220px;
            height: 220px;
            margin: -110px 0 0 -110px;
            border-color: rgba(255, 0, 0, 0.6);
        }

        .electron.red {
            background: #ff0000;
        }

        @keyframes spinRed {
            from { transform: rotateZ(0deg); }
            to { transform: rotateZ(360deg); }
        }

        /* Blue orbit - inclined ~60° */
        .orbit.blue {
            width: 260px;
            height: 260px;
            margin: -130px 0 0 -130px;
            transform: rotateX(60deg);
            animation: spinBlue 4s infinite linear;
        }

        .path.blue {
            width: 260px;
            height: 260px;
            margin: -130px 0 0 -130px;
            border-color: rgba(0, 0, 255, 0.6);
            transform: rotateX(60deg);
        }

        .electron.blue {
            background: #0000ff;
        }

        @keyframes spinBlue {
            from { transform: rotateX(60deg) rotateZ(0deg); }
            to { transform: rotateX(60deg) rotateZ(360deg); }
        }

        /* Yellow orbit - inclined ~120° (almost vertical) */
        .orbit.yellow {
            width: 300px;
            height: 300px;
            margin: -150px 0 0 -150px;
            transform: rotateX(120deg);
            animation: spinYellow 5s infinite linear;
        }

        .path.yellow {
            width: 300px;
            height: 300px;
            margin: -150px 0 0 -150px;
            border-color: rgba(255, 255, 0, 0.6);
            transform: rotateX(120deg);
        }

        .electron.yellow {
            background: #ffff00;
        }

        @keyframes spinYellow {
            from { transform: rotateX(120deg) rotateZ(0deg); }
            to { transform: rotateX(120deg) rotateZ(360deg); }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="sun"></div>

        <!-- Red orbit (equatorial) -->
        <div class="orbit red">
            <div class="path red"></div>
            <div class="electron red"></div>
        </div>

        <!-- Blue orbit (inclined) -->
        <div class="orbit blue">
            <div class="path blue"></div>
            <div class="electron blue"></div>
        </div>

        <!-- Yellow orbit (steeply inclined) -->
        <div class="orbit yellow">
            <div class="path yellow"></div>
            <div class="electron yellow"></div>
        </div>
    </div>
</body>
</html>
