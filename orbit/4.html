<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Atomic Orbits – Fixed Sun, 120° Inclinations</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
        }

        .scene {
            width: 400px;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
        }

        .sun {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #ffffcc);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(0);
            box-shadow: 
                0 0 30px #ffff99,
                0 0 60px #ffcc00,
                0 0 90px #ff9900;
            z-index: 100;
        }

        .orbit-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .orbit-path {
            position: absolute;
            border: 1.5px solid;
            border-radius: 50%;
            opacity: 0.5;
            transform-style: preserve-3d;
        }

        .electron {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: absolute;
            top: -10px;
            left: 50%;
            margin-left: -10px;
            box-shadow: 0 0 20px currentColor;
            transform-style: preserve-3d;
        }

        /* Orbit 1: Red – 0° (equatorial) */
        .orbit1 {
            width: 240px;
            height: 240px;
            margin: -120px 0 0 -120px;
            animation: spin1 3s infinite linear;
        }
        .path1 { width: 240px; height: 240px; margin: -120px 0 0 -120px; border-color: #ff0000; }
        .electron1 { background: #ff0000; color: #ff3333; }

        @keyframes spin1 {
            from { transform: rotateZ(0deg); }
            to { transform: rotateZ(360deg); }
        }

        /* Orbit 2: Blue – 120° inclination */
        .orbit2-container {
            transform: rotateY(120deg);
        }
        .orbit2 {
            width: 280px;
            height: 280px;
            margin: -140px 0 0 -140px;
            animation: spin2 4s infinite linear;
        }
        .path2 { 
            width: 280px; height: 280px; margin: -140px 0 0 -140px; 
            border-color: #0000ff; 
            transform: rotateX(90deg);
        }
        .electron2 { background: #0000ff; color: #3333ff; }

        @keyframes spin2 {
            from { transform: rotateX(90deg) rotateZ(0deg); }
            to { transform: rotateX(90deg) rotateZ(360deg); }
        }

        /* Orbit 3: Yellow – 240° inclination (120° from each other) */
        .orbit3-container {
            transform: rotateY(240deg);
        }
        .orbit3 {
            width: 320px;
            height: 320px;
            margin: -160px 0 0 -160px;
            animation: spin3 5s infinite linear;
        }
        .path3 { 
            width: 320px; height: 320px; margin: -160px 0 0 -160px; 
            border-color: #ffff00; 
            transform: rotateX(90deg);
        }
        .electron3 { background: #ffff00; color: #ffff33; }

        @keyframes spin3 {
            from { transform: rotateX(90deg) rotateZ(0deg); }
            to { transform: rotateX(90deg) rotateZ(360deg); }
        }
    </style>
</head>
<body>
    <div class="scene">
        <!-- Fixed Sun -->
        <div class="sun"></div>

        <!-- Red Orbit (0°) -->
        <div class="orbit-container">
            <div class="orbit-path path1"></div>
            <div class="orbit1"><div class="electron electron1"></div></div>
        </div>

        <!-- Blue Orbit (120°) -->
        <div class="orbit-container orbit2-container">
            <div class="orbit-path path2"></div>
            <div class="orbit2"><div class="electron electron2"></div></div>
        </div>

        <!-- Yellow Orbit (240°) -->
        <div class="orbit-container orbit3-container">
            <div class="orbit-path path3"></div>
            <div class="orbit3"><div class="electron electron3"></div></div>
        </div>
    </div>
</body>
</html>
