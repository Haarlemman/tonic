<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atom Orbit Animation</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  svg {
    width: 80vmin;
    height: 80vmin;
  }
  .nucleus {
    filter: drop-shadow(0 0 20px white);
  }
  .orbit {
    fill: none;
    stroke: #666;
    stroke-width: 2;
    opacity: 0.4;
  }
  .orbit.orange { stroke: #ff8a2d; filter: drop-shadow(0 0 6px #ff8a2d); }
  .orbit.red    { stroke: #ff3a3a; filter: drop-shadow(0 0 6px #ff3a3a); }
  .orbit.blue   { stroke: #2da8ff; filter: drop-shadow(0 0 6px #2da8ff); }

  .electron {
    r: 4;
  }
  .electron.yellow { fill: #ffd452; filter: drop-shadow(0 0 10px #ffd452); }
  .electron.red    { fill: #ff5a5a; filter: drop-shadow(0 0 10px #ff5a5a); }
  .electron.blue   { fill: #3aa8ff; filter: drop-shadow(0 0 10px #3aa8ff); }
</style>
</head>
<body>
<svg viewBox="-50 -50 100 100">
  <!-- nucleus -->
  <circle class="nucleus" cx="0" cy="0" r="10" fill="white"/>

  <!-- orbits (same ellipse, rotated 120° apart) -->
  <ellipse class="orbit orange" cx="0" cy="0" rx="40" ry="20" transform="rotate(0)"/>
  <ellipse class="orbit red"    cx="0" cy="0" rx="40" ry="20" transform="rotate(120)"/>
  <ellipse class="orbit blue"   cx="0" cy="0" rx="40" ry="20" transform="rotate(240)"/>

  <!-- invisible paths for motion -->
  <path id="path1" d="M 40 0 A 40 20 0 1 1 -40 0 A 40 20 0 1 1 40 0" fill="none"/>
  <path id="path2" d="M 40 0 A 40 20 0 1 1 -40 0 A 40 20 0 1 1 40 0" fill="none" transform="rotate(120)"/>
  <path id="path3" d="M 40 0 A 40 20 0 1 1 -40 0 A 40 20 0 1 1 40 0" fill="none" transform="rotate(240)"/>

  <!-- electrons -->
  <circle class="electron yellow">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath xlink:href="#path1"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.7;0.71;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle class="electron red">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath xlink:href="#path2"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.7;0.71;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle class="electron blue">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath xlink:href="#path3"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.7;0.71;1" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
</body>
</html>
