<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Atom – Solid Electrons + Brighter Trails</title>
<style>
    body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
    .atom-container { position:relative; width:600px; height:600px; }
    .nucleus {
        position:absolute; top:50%; left:50%;
        width:160px; height:160px; margin:-80px 0 0 -80px;
        background:radial-gradient(circle,#fff,#ffeb3b);
        border-radius:50%;
        box-shadow:0 0 80px #ffeb3b, 0 0 120px #ff9800;
        z-index:100;
    }
    .electron {
        position:absolute;
        width:36px; height:36px;
        border-radius:50%;
        margin:-18px 0 0 -18px;
    }
    /* Fully solid, rich electrons again */
    #e1 { background:radial-gradient(circle at 30% 30%, #fff, #f44336); box-shadow:0 0 30px #ff3366, inset -6px -6px 15px #900; }
    #e2 { background:radial-gradient(circle at 30% 30%, #fff, #4488ff); box-shadow:0 0 30px #4488ff, inset -6px -6px 15px #0033aa; }
    #e3 { background:radial-gradient(circle at 30% 30%, #fff, #ffeb3b); box-shadow:0 0 30px #ffeb3b, inset -6px -6px 15px #cc9900; }

    canvas { position:absolute; inset:0; pointer-events:none; }
</style>
</head>
<body>
<div class="atom-container">
    <div class="electron" id="e1"></div>
    <div class="electron" id="e2"></div>
    <div class="electron" id="e3"></div>
    <canvas id="trails" width="600" height="600"></canvas>
    <div class="nucleus"></div>
</div>

<script>
const canvas = document.getElementById('trails');
const ctx = canvas.getContext('2d');
const radius = 240;
const centerX = 300;
const centerY = 300;

const electrons = [
    { el: document.getElementById('e1'), color: '#ff3366', offset: 0,   tilt: 0                      },
    { el: document.getElementById('e2'), color: '#4488ff', offset: 120, tilt: 120 * Math.PI / 180 },
    { el: document.getElementById('e3'), color: '#ffeb3b', offset: 240, tilt: 240 * Math.PI / 180 }
];

let time = 0;

// Trail settings — a bit more visible now
ctx.globalAlpha = 0.18;   // was 0.09 → trails twice as strong
ctx.lineWidth = 2.5;

function animate() {
    time += 0.018;

    // Gentle fade (keeps trails visible longer)
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0,0,600,600);

    electrons.forEach(e => {
        const angle = time + e.offset * Math.PI / 180;

        let x = Math.cos(angle) * radius;
        let y = Math.sin(angle) * radius * 0.7;
        let z = Math.sin(angle) * radius * Math.sin(Math.PI / 3);

        const cosT = Math.cos(e.tilt);
        const sinT = Math.sin(e.tilt);
        const rotX =  x * cosT + z * sinT;
        const rotZ = -x * sinT + z * cosT;

        // Very subtle depth cues only
        const scale = 1 + rotZ * 0.0010;
        const brightness = 1 + rotZ * 0.0008;

        e.el.style.left = (centerX + rotX) + 'px';
        e.el.style.top  = (centerY + y)   + 'px';
        e.el.style.transform = `scale(${scale})`;
        e.el.style.filter = `brightness(${brightness})`;
        e.el.style.zIndex = rotZ > 0 ? 200 : 10;

        // Draw brighter trail segment
        ctx.strokeStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(centerX + rotX, centerY + y);
        ctx.lineTo(centerX + rotX, centerY + y); // single point with thickness = small glowing dot
        ctx.stroke();

        // Extra tiny glow burst every frame for smoother trail
        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.arc(centerX + rotX, centerY + y, 4, 0, Math.PI*2);
        ctx.fillStyle = e.color;
        ctx.fill();
        ctx.globalAlpha = 0.18;
    });

    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
