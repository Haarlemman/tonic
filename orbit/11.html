<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atom Animation (Front/Behind)</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .scene {
    position: relative;
    width: 80vmin;
    height: 80vmin;
  }

  .nucleus {
    position: absolute;
    left: 50%; top: 50%;
    width: 12vmin; height: 12vmin;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, white 0%, #ccc 100%);
    box-shadow: 0 0 30px white, 0 0 60px rgba(255,255,255,0.3);
    z-index: 10;
  }

  .orbit {
    position: absolute;
    left: 50%; top: 50%;
    width: 100%; height: 100%;
    transform-origin: center;
  }

  .electron {
    position: absolute;
    width: 4vmin; height: 4vmin;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* Yellow electron on orange orbit */
  .electron.yellow {
    background: radial-gradient(circle at 30% 30%, #fff7d6 0%, #ffe48a 55%, #ffd452 100%);
    box-shadow: 0 0 12px #ffd452;
    animation: orbitYellow 8s linear infinite;
  }

  /* Red electron on red orbit */
  .electron.red {
    background: radial-gradient(circle at 30% 30%, #ffe4e4 0%, #ff9d9d 55%, #ff5a5a 100%);
    box-shadow: 0 0 12px #ff5a5a;
    animation: orbitRed 10s linear infinite;
  }

  /* Blue electron on blue orbit */
  .electron.blue {
    background: radial-gradient(circle at 30% 30%, #dff2ff 0%, #8fd2ff 55%, #3aa8ff 100%);
    box-shadow: 0 0 12px #3aa8ff;
    animation: orbitBlue 12s linear infinite;
  }

  /* Keyframes: 70% visible, 30% hidden */
  @keyframes orbitYellow {
    0%   { left: 100%; top: 50%; opacity: 1; }
    70%  { left: 0%;   top: 50%; opacity: 1; }
    71%  { opacity: 0; }
    100% { opacity: 0; }
  }

  @keyframes orbitRed {
    0%   { left: 50%; top: 0%; opacity: 1; }
    70%  { left: 50%; top: 100%; opacity: 1; }
    71%  { opacity: 0; }
    100% { opacity: 0; }
  }

  @keyframes orbitBlue {
    0%   { left: 0%; top: 50%; opacity: 1; }
    70%  { left: 100%; top: 50%; opacity: 1; }
    71%  { opacity: 0; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="nucleus"></div>
    <div class="orbit">
      <div class="electron yellow"></div>
    </div>
    <div class="orbit">
      <div class="electron red"></div>
    </div>
    <div class="orbit">
      <div class="electron blue"></div>
    </div>
  </div>
</body>
</html>
