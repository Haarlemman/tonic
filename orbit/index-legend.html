<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D World</title>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400&display=swap" rel="stylesheet">
<style>
    body { 
        margin:0; 
        background:#000; 
        overflow:hidden; 
        display:flex; 
        justify-content:center; 
        align-items:center; 
        height:100vh; 
        font-family: 'Overpass', sans-serif;
    }
    .atom-container { 
        position:relative; 
        width:600px; 
        height:600px; 
    }
    .nucleus {
        position:absolute; top:50%; left:50%;
        width:180px; height:180px; margin:-90px 0 0 -90px;
        background:radial-gradient(circle, #000, #333 80%, #666);
        border-radius:50%;
        box-shadow:0 0 90px #ccc, 0 0 180px #ffea88, 0 0 300px rgba(0,0,0,0.8);
        z-index:500;
    }
    .electron {
        position:absolute; width:40px; height:40px; border-radius:50%; margin:-20px 0 0 -20px;
        pointer-events:none;
    }
    #e1 { background:radial-gradient(circle at 30% 30%, #ff0000, #ff2244); box-shadow:0 0 55px #ff4466, inset -8px -8px 20px #900; }
    #e2 { background:radial-gradient(circle at 30% 30%, #0000ff, #33889f); box-shadow:0 0 55px #55aa99, inset -8px -8px 20px #0066cc; }
    #e3 { background:radial-gradient(circle at 30% 30%, #ffff00, #ffdd22); box-shadow:0 0 55px #ffee66, inset -8px -8px 20px #ccaa00; }
    canvas { position:absolute; inset:0; pointer-events:none; }
    .trail-front { z-index:550; }

    /* Legend */
    .legend {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(10, 10, 30, 0.75);
        padding: 16px 20px;
        border-radius: 14px;
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 14px;
        line-height: 1.9;
        z-index: 1000;
        box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        border: 1px solid rgba(120, 120, 255, 0.15);
    }
    .legend-item {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .legend-color {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        box-shadow: 0 0 16px;
    }
</style>
</head>
<body>
<div class="atom-container">
    <div class="electron" id="e1"></div>
    <div class="electron" id="e2"></div>
    <div class="electron" id="e3"></div>
    <canvas id="trailsBack"  width="600" height="600"></canvas>
    <div class="nucleus"></div>
    <canvas id="trailsFront" width="600" height="600" class="trail-front"></canvas>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#ff3355; box-shadow:0 0 12px #ff6688;"></div>Art, Music & Literature</div>
        <div class="legend-item"><div class="legend-color" style="background:#ffdd33; box-shadow:0 0 12px #ffee99;"></div>Science & Technology</div>
        <div class="legend-item"><div class="legend-color" style="background:#4488ff; box-shadow:0 0 12px #88bbff;"></div>Soul, Spirit</div>
    </div>
</div>

<script>
const baseSpeed      = 0.04;
const trailFade      = 0.009;
const trailThickness = 3.5;

const canvasBack  = document.getElementById('trailsBack');
const ctxBack     = canvasBack.getContext('2d');
const canvasFront = document.getElementById('trailsFront');
const ctxFront    = canvasFront.getContext('2d');
ctxBack.lineWidth = ctxFront.lineWidth = trailThickness;
ctxBack.lineCap = ctxFront.lineCap = 'round';

const centerX = 300;
const centerY = 300;
const nucleusRadius = 90;

// ==================== TRUE 3-AXIS CONTROL ====================
const electrons = [
    { el: document.getElementById('e1'), color: '#ff3355', speedMultiplier: 1,    radius: 225,
      inclinationDeg: 90, planeRotDeg:   7, rollDeg:   0 },   // red → Art

    { el: document.getElementById('e2'), color: '#4488ff', speedMultiplier: 0.75, radius: 210,
      inclinationDeg: 15, planeRotDeg:  95, rollDeg:  55 },   // blue → Domain of the soul

    { el: document.getElementById('e3'), color: '#ffdd33', speedMultiplier: 3,    radius: 210,
      inclinationDeg: 15, planeRotDeg: 115, rollDeg: -55 }    // yellow → Science
];

// Pre-convert degrees to radians
electrons.forEach(e => {
    const rad = deg => deg * Math.PI / 180;
    e.i = rad(e.inclinationDeg);
    e.r = rad(e.planeRotDeg);
    e.o = rad(e.rollDeg);
});

let time = 0;
function animate() {
    time += baseSpeed;

    ctxBack.fillStyle  = `rgba(0,0,0,${trailFade})`; ctxBack.fillRect(0,0,600,600);
    ctxFront.fillStyle = `rgba(0,0,0,${trailFade})`; ctxFront.fillRect(0,0,600,600);

    electrons.forEach(e => {
        const a = time * e.speedMultiplier;

        // Local orbit
        let x = Math.cos(a) * e.radius;
        let y = Math.sin(a) * e.radius;
        let z = 0;

        // Inclination
        const tx = x * Math.cos(e.i) + z * Math.sin(e.i);
        z = -x * Math.sin(e.i) + z * Math.cos(e.i);
        x = tx;

        // Plane rotation (around Y)
        const tx2 = x * Math.cos(e.r) - z * Math.sin(e.r);
        z = x * Math.sin(e.r) + z * Math.cos(e.r);
        x = tx2;

        // Roll (around Z – line of sight)
        const tx3 = x * Math.cos(e.o) - y * Math.sin(e.o);
        const ty3 = x * Math.sin(e.o) + y * Math.cos(e.o);
        x = tx3; y = ty3;

        // Perspective scaling
        const scale = 1 + z * 0.0038;
        const screenX = centerX + x;
        const screenY = centerY + y;

        e.el.style.left = screenX + 'px';
        e.el.style.top  = screenY + 'px';
        e.el.style.transform = `scale(${scale})`;

        // Hide behind nucleus
        const behind = z < -20 && Math.hypot(x, y) < nucleusRadius + 20;
        e.el.style.zIndex = behind ? 400 : 600;

        // Trails (back canvas for behind, front for in front)
        const ctx = z < 0 ? ctxBack : ctxFront;
        ctx.globalAlpha = 0.6;
        ctx.strokeStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(screenX, screenY);
        ctx.lineTo(screenX + 0.1, screenY + 0.1);
        ctx.stroke();
    });

    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
