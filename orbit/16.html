<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atom Orbit Animation</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  svg {
    width: 80vmin;
    height: 80vmin;
  }
  .nucleus {
    filter: drop-shadow(0 0 25px white);
  }
  .orbit {
    fill: none;
    stroke-width: 2;
    opacity: 0.6;
  }
  .orbit.orange { stroke: #ff8a2d; filter: drop-shadow(0 0 6px #ff8a2d); }
  .orbit.red    { stroke: #ff3a3a; filter: drop-shadow(0 0 6px #ff3a3a); }
  .orbit.blue   { stroke: #2da8ff; filter: drop-shadow(0 0 6px #2da8ff); }

  .electron { r: 4; }
  .electron.yellow { fill: #ffd452; filter: drop-shadow(0 0 10px #ffd452); }
  .electron.red    { fill: #ff5a5a; filter: drop-shadow(0 0 10px #ff5a5a); }
  .electron.blue   { fill: #3aa8ff; filter: drop-shadow(0 0 10px #3aa8ff); }
</style>
</head>
<body>
<svg viewBox="-60 -60 120 120">
  <!-- larger nucleus -->
  <circle class="nucleus" cx="0" cy="0" r="20" fill="white"/>

  <!-- equal, flatter orbits -->
  <ellipse class="orbit orange" cx="0" cy="0" rx="28" ry="14" transform="rotate(0)"/>
  <ellipse class="orbit red"    cx="0" cy="0" rx="28" ry="14" transform="rotate(120)"/>
  <ellipse class="orbit blue"   cx="0" cy="0" rx="28" ry="14" transform="rotate(240)"/>

  <!-- invisible paths for motion -->
  <path id="path1" d="M 28 0 A 28 14 0 1 1 -28 0 A 28 14 0 1 1 28 0" fill="none"/>
  <path id="path2" d="M 28 0 A 28 14 0 1 1 -28 0 A 28 14 0 1 1 28 0" fill="none" transform="rotate(120)"/>
  <path id="path3" d="M 28 0 A 28 14 0 1 1 -28 0 A 28 14 0 1 1 28 0" fill="none" transform="rotate(240)"/>

  <!-- electrons on their respective paths -->
  <circle class="electron yellow">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath xlink:href="#path1"/>
    </animateMotion>
