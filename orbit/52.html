<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Atom – Exact Good Color #4a1644</title>
<style>
    body{margin:0;background:#4a1644;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
    .atom-container{position:relative;width:600px;height:600px}
    canvas{position:absolute;inset:0;pointer-events:none;background:transparent}
    .nucleus{
        position:absolute;top:50%;left:50%;
        width:180px;height:180px;margin:-90px 0 0 -90px;
        background:radial-gradient(circle,#fffc00,#000201 60%,#1266ae);
        border-radius:50%;
        box-shadow:0 0 90px #e00f43,0 0 180px #e00f43,0 0 300px rgba(224,15,67,.6);
        z-index:500;
    }
    .electron{position:absolute;width:40px;height:40px;border-radius:50%;margin:-20px 0 0 -20px;pointer-events:none}
    #e1{background:radial-gradient(circle at 30% 30%,#ff0000,#ff2244);box-shadow:0 0 55px #ff4466,inset -8px -8px 20px #900}
    #e2{background:radial-gradient(circle at 30% 30%,#0000ff,#33889f);box-shadow:0 0 55px #55aa99,inset -8px -8px 20px #0066cc}
    #e3{background:radial-gradient(circle at 30% 30%,#ffff00,#ffdd22);box-shadow:0 0 55px #ffee66,inset -8px -8px 20px #ccaa00}
    .trail-front{z-index:550}
</style>
</head>
<body>
<div class="atom-container">
    <div class="electron" id="e1"></div>
    <div class="electron" id="e2"></div>
    <div class="electron" id="e3"></div>
    <canvas id="trailsBack" width="600" height="600"></canvas>
    <div class="nucleus"></div>
    <canvas id="trailsFront" width="600" height="600" class="trail-front"></canvas>
</div>

<script>
const baseSpeed = 0.04;
const trailFade = 0.025;                 // this is the magic number that works everywhere
const trailThickness = 3.5;

const canvasBack = document.getElementById('trailsBack');
const ctxBack = canvasBack.getContext('2d');
const canvasFront = document.getElementById('trailsFront');
const ctxFront = canvasFront.getContext('2d');
ctxBack.lineWidth = ctxFront.lineWidth = trailThickness;
ctxBack.lineCap = ctxFront.lineCap = 'round';

const centerX = 300, centerY = 300, nucleusRadius = 90;

const electrons = [
    {el:document.getElementById('e1'),color:'#ff3355',speedMultiplier:1,radius:225,inclinationDeg:90,planeRotDeg:7,rollDeg:0},
    {el:document.getElementById('e2'),color:'#4488ff',speedMultiplier:0.75,radius:210,inclinationDeg:15,planeRotDeg:95,rollDeg:55},
    {el:document.getElementById('e3'),color:'#ffdd33',speedMultiplier:3,radius:210,inclinationDeg:15,planeRotDeg:115,rollDeg:-55}
];

electrons.forEach(e => {
    const r = d => d * Math.PI / 180;
    e.i = r(e.inclinationDeg); e.r = r(e.planeRotDeg); e.o = r(e.rollDeg);
});

let firstFrame = true;
let time = 0;
function animate() {
    time += baseSpeed;

    // First frame: solid fill to force the colour in every browser
    if (firstFrame) {
        ctxBack.fillStyle = '#4a1644';
        ctxBack.fillRect(0,0,600,600);
        ctxFront.fillStyle = '#4a1644';
        ctxFront.fillRect(0,0,600,600);
        firstFrame = false;
    }

    // Normal fade with exact same colour
    ctxBack.fillStyle = 'rgba(74,22,68,0.025)';
    ctxBack.fillRect(0,0,600,600);
    ctxFront.fillStyle = 'rgba(74,22,68,0.025)';
    ctxFront.fillRect(0,0,600,600);

    electrons.forEach(e => {
        const a = time * e.speedMultiplier;
        let x = Math.cos(a) * e.radius;
        let y = Math.sin(a) * e.radius;
        let z = 0;

        let tx = x * Math.cos(e.i) + z * Math.sin(e.i);
        z = -x * Math.sin(e.i) + z * Math.cos(e.i);
        x = tx;

        tx = x * Math.cos(e.r) - z * Math.sin(e.r);
        z = x * Math.sin(e.r) + z * Math.cos(e.r);
        x = tx;

        tx = x * Math.cos(e.o) - y * Math.sin(e.o);
        let ty = x * Math.sin(e.o) + y * Math.cos(e.o);
        x = tx; y = ty;

        const scale = 1 + z * 0.0038;
        const sx = centerX + x;
        const sy = centerY + y;

        e.el.style.left = sx + 'px';
        e.el.style.top = sy + 'px';
        e.el.style.transform = `scale(${scale})`;

        const behind = z < -20 && Math.hypot(x,y) < nucleusRadius + 20;
        e.el.style.zIndex = behind ? 400 : 600;

        const ctx = z < 0 ? ctxBack : ctxFront;
        ctx.globalAlpha = 0.6;
        ctx.strokeStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(sx+0.1,sy+0.1);
        ctx.stroke();
    });

    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
