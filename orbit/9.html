<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stylized Atom Animation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: 80vmin;
      height: 80vmin;
    }

    .nucleus {
      position: absolute;
      left: 50%; top: 50%;
      width: 12vmin;
      height: 12vmin;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, white 0%, #ccc 100%);
      box-shadow: 0 0 30px white, 0 0 60px rgba(255,255,255,0.3);
      z-index: 10;
    }

    .orbit-group {
      position: absolute;
      left: 50%; top: 50%;
      width: 100%;
      height: 100%;
      transform-origin: center;
    }

    .orbit-path {
      position: absolute;
      left: 50%; top: 50%;
      width: 80%;
      height: 50%;
      border: 2px solid;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.6;
      filter: drop-shadow(0 0 6px currentColor);
    }

    .electron {
      position: absolute;
      width: 4vmin;
      height: 4vmin;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: orbitMotion 12s linear infinite;
    }

    .group1 .orbit-path { color: #ff8a2d; transform: translate(-50%, -50%) rotate(0deg); }
    .group2 .orbit-path { color: #ff3a3a; transform: translate(-50%, -50%) rotate(120deg); }
    .group3 .orbit-path { color: #2da8ff; transform: translate(-50%, -50%) rotate(240deg); }

    .group1 .electron {
      background: radial-gradient(circle at 30% 30%, #fff7d6 0%, #ffe48a 55%, #ffd452 100%);
      box-shadow: 0 0 12px #ffd452;
      animation-duration: 12s;
    }

    .group2 .electron {
      background: radial-gradient(circle at 30% 30%, #ffe4e4 0%, #ff9d9d 55%, #ff5a5a 100%);
      box-shadow: 0 0 12px #ff5a5a;
      animation-duration: 10s;
    }

    .group3 .electron {
      background: radial-gradient(circle at 30% 30%, #dff2ff 0%, #8fd2ff 55%, #3aa8ff 100%);
      box-shadow: 0 0 12px #3aa8ff;
      animation-duration: 8s;
    }

    @keyframes orbitMotion {
      0%   { top: 50%; left: 100%; opacity: 1; z-index: 5; }
      25%  { top: 100%; left: 50%; opacity: 0.4; z-index: 3; }
      50%  { top: 50%; left: 0%;   opacity: 0.1; z-index: 1; }
      75%  { top: 0%;   left: 50%; opacity: 0.4; z-index: 3; }
      100% { top: 50%; left: 100%; opacity: 1; z-index: 5; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="nucleus"></div>

    <div class="orbit-group group1">
      <div class="orbit-path"></div>
      <div class="electron"></div>
    </div>

    <div class="orbit-group group2">
      <div class="orbit-path"></div>
      <div class="electron"></div>
    </div>

    <div class="orbit-group group3">
      <div class="orbit-path"></div>
      <div class="electron"></div>
    </div>
  </div>
</body>
</html>
