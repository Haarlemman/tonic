<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stylized Atom Animation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: 80vmin;
      height: 80vmin;
      transform-style: preserve-3d;
    }

    .nucleus {
      position: absolute;
      left: 50%; top: 50%;
      width: 12vmin;
      height: 12vmin;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, white 0%, #ccc 100%);
      box-shadow: 0 0 30px white, 0 0 60px rgba(255,255,255,0.3);
      z-index: 10;
    }

    .orbit {
      position: absolute;
      left: 50%; top: 50%;
      width: 100%;
      height: 100%;
      transform-origin: center;
      animation: rotate 12s linear infinite;
    }

    .orbit:nth-child(2) { transform: rotate(0deg) rotateX(60deg); animation-duration: 12s; }
    .orbit:nth-child(3) { transform: rotate(120deg) rotateX(60deg); animation-duration: 10s; }
    .orbit:nth-child(4) { transform: rotate(240deg) rotateX(60deg); animation-duration: 8s; }

    .electron {
      position: absolute;
      width: 4vmin;
      height: 4vmin;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: orbitPath 12s linear infinite;
    }

    .orbit:nth-child(2) .electron {
      background: radial-gradient(circle at 30% 30%, #fff 0%, #3aa8ff 100%);
      box-shadow: 0 0 12px #3aa8ff;
      animation-duration: 12s;
    }

    .orbit:nth-child(3) .electron {
      background: radial-gradient(circle at 30% 30%, #fff 0%, #ff5a5a 100%);
      box-shadow: 0 0 12px #ff5a5a;
      animation-duration: 10s;
    }

    .orbit:nth-child(4) .electron {
      background: radial-gradient(circle at 30% 30%, #fff 0%, #ffd452 100%);
      box-shadow: 0 0 12px #ffd452;
      animation-duration: 8s;
    }

    @keyframes rotate {
      from { transform: rotateY(0deg) rotateX(60deg); }
      to   { transform: rotateY(360deg) rotateX(60deg); }
    }

    @keyframes orbitPath {
      0%   { top: 50%; left: 100%; opacity: 1; z-index: 5; }
      25%  { top: 100%; left: 50%; opacity: 0.4; z-index: 3; }
      50%  { top: 50%; left: 0%;   opacity: 0.1; z-index: 1; }
      75%  { top: 0%;   left: 50%; opacity: 0.4; z-index: 3; }
      100% { top: 50%; left: 100%; opacity: 1; z-index: 5; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="nucleus"></div>
    <div class="orbit">
      <div class="electron"></div>
    </div>
    <div class="orbit">
      <div class="electron"></div>
    </div>
    <div class="orbit">
      <div class="electron"></div>
    </div>
  </div>
</body>
</html>
