<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Animated Atom Scene</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#000000;
      --nucleus:#ffffff;
      --electron-blue:#3aa8ff;
      --electron-red:#ff5a5a;
      --electron-yellow:#ffd452;
      --orbit-orange:#ff8a2d;
      --orbit-red:#ff3a3a;
      --orbit-blue:#2da8ff;

      --glow-strong: 0 0 18px rgba(255,255,255,0.65), 0 0 36px rgba(255,255,255,0.35);
      --glow-soft:   0 0 8px rgba(255,255,255,0.35),  0 0 18px rgba(255,255,255,0.20);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
      color: #ddd;
    }

    .wrap {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 2vmin;
    }

    /* Container scales responsively */
    .stage {
      width: min(80vmin, 900px);
      height: min(80vmin, 900px);
      position: relative;
      filter: saturate(1.05) contrast(1.05);
    }

    /* Soft vignette for depth */
    .vignette {
      position: absolute;
      inset: -10%;
      pointer-events: none;
      background:
        radial-gradient(120% 120% at 50% 50%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.35) 100%);
      mix-blend-mode: soft-light;
    }

    /* Nucleus with breathing glow */
    .nucleus {
      position: absolute;
      left: 50%; top: 50%;
      width: 18%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 45% 45%, #ffffff 0%, #f7f7f7 55%, #d9d9d9 100%);
      box-shadow: var(--glow-strong);
      animation: breathe 6s ease-in-out infinite;
    }

    .nucleus::after {
      content: "";
      position: absolute;
      inset: -20%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0) 70%);
      filter: blur(12px);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* Orbits (elliptical outlines) */
    .orbit {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: none;
      box-shadow: none;
    }

    /* Each orbit is a stroked ellipse via outline (SVG would be cleaner but CSS keeps it single-file) */
    .orbit::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid currentColor;
      opacity: 0.85;
      filter: drop-shadow(0 0 6px currentColor);
    }

    .orbit.orange { width: 82%; height: 58%; color: var(--orbit-orange); transform: translate(-50%, -50%) rotate(12deg); }
    .orbit.red    { width: 64%; height: 44%; color: var(--orbit-red);    transform: translate(-50%, -50%) rotate(-22deg); }
    .orbit.blue   { width: 48%; height: 34%; color: var(--orbit-blue);   transform: translate(-50%, -50%) rotate(37deg); }

    /* Electron carriers rotate to move electrons along the ellipse path */
    .carrier {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      transform-origin: center;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform;
    }

    .carrier.orange { width: 82%; height: 58%; animation-name: spin-orange; animation-duration: 12s; }
    .carrier.red    { width: 64%; height: 44%; animation-name: spin-red;    animation-duration: 9s;  }
    .carrier.blue   { width: 48%; height: 34%; animation-name: spin-blue;   animation-duration: 7s;  }

    /* Electron */
    .electron {
      position: absolute;
      width: 3.8%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      box-shadow: var(--glow-soft);
      transform: translate(-50%, -50%);
      /* subtle scale shimmer */
      animation: shimmer 3.5s ease-in-out infinite;
    }

    .electron.blue   { background: radial-gradient(circle at 35% 35%, #dff2ff 0%, #8fd2ff 55%, #3aa8ff 100%); }
    .electron.red    { background: radial-gradient(circle at 35% 35%, #ffe4e4 0%, #ff9d9d 55%, #ff5a5a 100%); }
    .electron.yellow { background: radial-gradient(circle at 35% 35%, #fff7d6 0%, #ffe48a 55%, #ffd452 100%); }

    /* Position electrons on ellipse: use parametric angle via child offsets */
    /* We place each electron at one edge of the carrier box and let rotation move it around */
    .electron.pos-a { left: 50%; top: 0%; }
    .electron.pos-b { left: 100%; top: 50%; }
    .electron.pos-c { left: 0%; top: 50%; }

    /* Path glow accent following electrons (subtle) */
    .trail {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(6px);
      mix-blend-mode: screen;
      opacity: 0.08;
    }
    .trail.orange { background: conic-gradient(from 0deg, rgba(255,138,45,0.35), rgba(255,138,45,0)); }
    .trail.red    { background: conic-gradient(from 0deg, rgba(255,58,58,0.35), rgba(255,58,58,0));  }
    .trail.blue   { background: conic-gradient(from 0deg, rgba(45,168,255,0.35), rgba(45,168,255,0)); }

    /* Keyframes */
    @keyframes spin-orange { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes spin-red    { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes spin-blue   { to { transform: translate(-50%, -50%) rotate(360deg); } }

    @keyframes shimmer {
      0%, 100% { transform: translate(-50%, -50%) scale(1);    filter: drop-shadow(0 0 8px rgba(255,255,255,0.25)); }
      50%      { transform: translate(-50%, -50%) scale(1.06); filter: drop-shadow(0 0 12px rgba(255,255,255,0.45)); }
    }

    @keyframes breathe {
      0%, 100% { box-shadow: var(--glow-strong); transform: translate(-50%, -50%) scale(1); }
      50%      { box-shadow: 0 0 24px rgba(255,255,255,0.75), 0 0 60px rgba(255,255,255,0.45);
                 transform: translate(-50%, -50%) scale(1.04); }
    }

    /* Gentle camera drift for the whole scene */
    .stage {
      animation: drift 20s ease-in-out infinite;
    }
    @keyframes drift {
      0%,100% { transform: translate3d(0,0,0) scale(1); }
      25%     { transform: translate3d(0,-0.6vmin,0) scale(1.01); }
      50%     { transform: translate3d(0.5vmin,0.4vmin,0) scale(1.015); }
      75%     { transform: translate3d(-0.4vmin,-0.3vmin,0) scale(1.007); }
    }

    /* Accessibility: reduce motion preference */
    @media (prefers-reduced-motion: reduce) {
      .stage, .carrier, .nucleus, .electron { animation: none !important; }
    }

    /* Simple caption */
    .caption {
      position: absolute;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      color: #9aa9b6;
      opacity: 0.75;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage" aria-label="Animated atom with three electrons orbiting a glowing nucleus">
      <div class="vignette" aria-hidden="true"></div>
      <div class="nucleus" role="img" aria-label="Glowing atomic nucleus"></div>

      <!-- Orange orbit -->
      <div class="orbit orange" aria-hidden="true"></div>
      <div class="carrier orange" aria-hidden="true">
        <div class="trail orange"></div>
        <div class="electron yellow pos-a" aria-hidden="true"></div>
      </div>

      <!-- Red orbit -->
      <div class="orbit red" aria-hidden="true"></div>
      <div class="carrier red" aria-hidden="true">
        <div class="trail red"></div>
        <div class="electron red pos-b" aria-hidden="true"></div>
      </div>

      <!-- Blue orbit -->
      <div class="orbit blue" aria-hidden="true"></div>
      <div class="carrier blue" aria-hidden="true">
        <div class="trail blue"></div>
        <div class="electron blue pos-c" aria-hidden="true"></div>
      </div>

      <div class="caption">Atomic scene — electrons orbiting a glowing nucleus</div>
    </div>
  </div>

  <script>
    // Optional: staggered orbit speeds for organic variability.
    // Slight randomization on load so each refresh feels a bit different.
    (function(){
      const carriers = document.querySelectorAll('.carrier');
      carriers.forEach((c, i) => {
        const base = parseFloat(getComputedStyle(c).animationDuration);
        const jitter = (Math.random() * 0.8) - 0.4; // -0.4s..+0.4s
        c.style.animationDuration = (base + jitter).toFixed(2) + 's';
        // Offset the starting angle
        const startDeg = Math.floor(Math.random() * 360);
        c.style.transform = `translate(-50%, -50%) rotate(${startDeg}deg)`;
      });
    })();
  </script>
</body>
</html>
