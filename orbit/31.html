<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Atom with Z-Indexing</title>
<style>
    body { 
        margin: 0; 
        background: #000; 
        overflow: hidden; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        font-family: 'Inter', sans-serif;
    }
    .atom-container { 
        position: relative; 
        /* Use viewport units for better scaling on different screens */
        width: 90vmin; 
        height: 90vmin;
        max-width: 600px;
        max-height: 600px;
    }

    .nucleus {
        position: absolute; 
        top: 50%; 
        left: 50%;
        /* Use percentages for responsive sizing relative to the container */
        width: 26.67%; /* 160px / 600px */
        height: 26.67%; /* 160px / 600px */
        margin: -13.335% 0 0 -13.335%; /* Half of width/height */
        background: radial-gradient(circle, #ffcc00, #fff 80%, #ffea88);
        border-radius: 50%;
        box-shadow: 0 0 70px #ffffff, 0 0 140px #ffffcc, 0 0 240px #ffea88, 0 0 380px rgba(255, 255, 200, 1.8);
        /* Nucleus is the center, z-index 500 */
        z-index: 500;
    }

    .electron {
        position: absolute; 
        /* Use percentages for responsive sizing */
        width: 6.67%; /* 40px / 600px */
        height: 6.67%; /* 40px / 600px */
        margin: -3.335% 0 0 -3.335%; /* Half of width/height */
        border-radius: 50%;
        /* Electrons start in front */
        z-index: 600; 
        pointer-events: none;
    }
    #e1 { background: radial-gradient(circle at 30% 30%, #ffffff, #ff2244); box-shadow: 0 0 45px #ff4466, inset -8px -8px 20px #900; }
    #e2 { background: radial-gradient(circle at 30% 30%, #ffffff, #3388ff); box-shadow: 0 0 45px #55aaff, inset -8px -8px 20px #0066cc; }
    #e3 { background: radial-gradient(circle at 30% 30%, #ffffff, #ffdd22); box-shadow: 0 0 45px #ffee66, inset -8px -8px 20px #ccaa00; }

    canvas { 
        position: absolute; 
        inset: 0; 
        pointer-events: none; 
        /* Trails are in the back */
        z-index: 400; 
        width: 100%;
        height: 100%;
    }
</style>
</head>
<body>

<div class="atom-container" id="atom-container">
    <div class="electron" id="e1"></div>
    <div class="electron" id="e2"></div>
    <div class="electron" id="e3"></div>
    <!-- Canvas will be resized by JS -->
    <canvas id="trails"></canvas>
    <div class="nucleus"></div>
</div>

<script>
// ██████████████████  EASY TWEAK SETTINGS – CHANGE ONLY THESE  ██████████████████
let speed = 0.018;           // 0.008 = slow, 0.018 = normal, 0.04 = fast
let startOffset = 90;         // 0–360 → rotates the whole system at start
const trailFade = 0.03;      // smaller = longer trails (0.03 = very long)
const trailThickness = 1.0;  // 1.0 = thin, 3.0 = thick
// █████████████████████████████████████████████████████████████████████████████

const container = document.getElementById('atom-container');
const canvas = document.getElementById('trails');
const ctx = canvas.getContext('2d');

let radius;
let centerX;
let centerY;

// Updated configuration to maintain 120-degree separation (symmetry)
// but rotated the entire system by 15 degrees for better visual separation.
const electrons = [
    { el: document.getElementById('e1'), color: '#ff4466', offset:   0 + startOffset, tilt: 15 * Math.PI / 180,  flatten: 0.88 }, // Red (Original 0 + 15)
    { el: document.getElementById('e2'), color: '#55aaff', offset: 120 + startOffset, tilt: 135 * Math.PI / 180, flatten: 0.65 }, // Blue (Original 120 + 15)
    { el: document.getElementById('e3'), color: '#ffee66', offset: 240 + startOffset, tilt: 255 * Math.PI / 180, flatten: 0.65 }  // Yellow (Original 240 + 15)
];

let time = 0;

function resizeCanvas() {
    // Get the dimensions of the container
    const containerRect = container.getBoundingClientRect();
    
    // Set canvas logical size to its container's size
    canvas.width = containerRect.width;
    canvas.height = containerRect.height;

    // Recalculate center and radius based on new size
    // Use 40% of the smallest dimension as the main orbit radius
    radius = Math.min(canvas.width, canvas.height) * 0.4; 
    centerX = canvas.width / 2;
    centerY = canvas.height / 2;

    // Set canvas context styles
    ctx.lineWidth = trailThickness;
    ctx.lineCap = 'round';
    
    // Clear and redraw trails immediately on resize
    ctx.fillStyle = `rgba(0,0,0,1)`; // Solid black clear
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function animate() {
    time += speed;

    // Fade the trails
    ctx.fillStyle = `rgba(0,0,0,${trailFade})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    electrons.forEach(e => {
        const angle = time + e.offset * Math.PI / 180;

        // Calculate base 3D coordinates
        let x = Math.cos(angle) * radius;
        let y = Math.sin(angle) * radius * (1 - e.flatten);
        let z = Math.sin(angle) * radius * Math.sin(Math.PI / 3);

        // Apply tilt rotation
        const cosT = Math.cos(e.tilt);
        const sinT = Math.sin(e.tilt);
        const rotX = x * cosT + z * sinT;
        const rotZ = -x * sinT + z * cosT; // This is our Z-depth coordinate

        // Apply perspective scaling
        const scale = 1 + rotZ * 0.0015;

        // Set 2D position and scale
        e.el.style.left   = (centerX + rotX) + 'px';
        e.el.style.top    = (centerY + y)   + 'px';
        e.el.style.transform = `scale(${scale})`;

        // ★★★ Z-INDEX FIX ★★★
        // If rotZ is negative, the electron is "behind" the center.
        if (rotZ < 0) {
            e.el.style.zIndex = 490; // Behind nucleus (500)
        } else {
            e.el.style.zIndex = 600; // In front of nucleus
        }
        // ★★★ END OF FIX ★★★

        // Draw thin glowing trail
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(centerX + rotX, centerY + y);
        ctx.lineTo(centerX + rotX + 0.01, centerY + y + 0.01); // A tiny line for the trail dot
        ctx.stroke();

        // Draw tiny glow dot (doesn’t cover the ball)
        ctx.globalAlpha = 0.05;
        ctx.beginPath();
        ctx.arc(centerX + rotX, centerY + y, 3, 0, Math.PI * 2);
        ctx.fillStyle = e.color;
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

// Initial setup
window.addEventListener('resize', resizeCanvas);
resizeCanvas(); // Call once on load
animate();      // Start the animation
</script>
</body>
</html>
