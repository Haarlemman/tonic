<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Atom orbit with true front/behind occlusion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #cfd6e6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
    }
    .wrap {
      width: min(86vmin, 900px);
      height: min(86vmin, 900px);
    }
    /* Soft scene glow for painterly feel */
    svg {
      filter: saturate(1.06) contrast(1.06);
    }
    .nucleus-glow {
      filter: blur(24px);
      opacity: 0.55;
    }
    .orbit {
      fill: none;
      stroke-width: 2.5;
      opacity: 0.9;
    }
    .orbit.orange { stroke: #ff8a2d; filter: drop-shadow(0 0 6px #ff8a2d); }
    .orbit.red    { stroke: #ff3a3a; filter: drop-shadow(0 0 6px #ff3a3a); }
    .orbit.blue   { stroke: #2da8ff; filter: drop-shadow(0 0 6px #2da8ff); }

    .electron { stroke: none; }
    .electron.blue   { fill: url(#gradBlue);   filter: drop-shadow(0 0 10px rgba(58,168,255,0.85)); }
    .electron.red    { fill: url(#gradRed);    filter: drop-shadow(0 0 10px rgba(255,90,90,0.85)); }
    .electron.yellow { fill: url(#gradYellow); filter: drop-shadow(0 0 10px rgba(255,212,82,0.85)); }

    .caption {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      color: #99a6b3;
      opacity: 0.75;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="-50 -50 100 100" width="100%" height="100%" aria-label="Stylized atom with three inclined elliptical orbits">
      <!-- Gradients for electrons -->
      <defs>
        <radialGradient id="gradBlue" cx="35%" cy="35%">
          <stop offset="0%"  stop-color="#dff2ff"/>
          <stop offset="55%" stop-color="#8fd2ff"/>
          <stop offset="100%" stop-color="#3aa8ff"/>
        </radialGradient>
        <radialGradient id="gradRed" cx="35%" cy="35%">
          <stop offset="0%"  stop-color="#ffe4e4"/>
          <stop offset="55%" stop-color="#ff9d9d"/>
          <stop offset="100%" stop-color="#ff5a5a"/>
        </radialGradient>
        <radialGradient id="gradYellow" cx="35%" cy="35%">
          <stop offset="0%"  stop-color="#fff7d6"/>
          <stop offset="55%" stop-color="#ffe48a"/>
          <stop offset="100%" stop-color="#ffd452"/>
        </radialGradient>
      </defs>

      <!-- Nucleus glow backdrop -->
      <circle class="nucleus-glow" cx="0" cy="0" r="12" fill="white"/>

      <!-- Orbits (ellipses), tilted 120° apart -->
      <g id="orbits">
        <ellipse class="orbit orange" cx="0" cy="0" rx="33" ry="23" transform="rotate(12)"/>
        <ellipse class="orbit red"    cx="0" cy="0" rx="26" ry="18" transform="rotate(-108)"/>
        <ellipse class="orbit blue"   cx="0" cy="0" rx="19" ry="13" transform="rotate(132)"/>
      </g>

      <!-- Nucleus -->
      <g id="nucleus">
        <circle cx="0" cy="0" r="9.5" fill="url(#nucleusFill)" />
      </g>
      <defs>
        <radialGradient id="nucleusFill" cx="45%" cy="45%">
          <stop offset="0%"  stop-color="#ffffff"/>
          <stop offset="55%" stop-color="#f7f7f7"/>
          <stop offset="100%" stop-color="#d9d9d9"/>
        </radialGradient>
      </defs>

      <!-- Electron layers: back and front, so we can reorder reliably -->
      <g id="back-layer"></g>
      <g id="front-layer"></g>
    </svg>
    <div class="caption">Electrons orbiting a glowing nucleus with true occlusion</div>
  </div>

  <script>
    // Scene parameters tuned to resemble your uploaded still
    const nucleus = { x: 0, y: 0, r: 9.5 };
    const electrons = [
      {
        colorClass: 'yellow',   // outer (orange path)
        rx: 33, ry: 23, tiltDeg: 12, speed: 0.9, radius: 2.3
      },
      {
        colorClass: 'red',      // mid (red path)
        rx: 26, ry: 18, tiltDeg: -108, speed: 1.15, radius: 2.3
      },
      {
        colorClass: 'blue',     // inner (blue path)
        rx: 19, ry: 13, tiltDeg: 132, speed: 1.35, radius: 2.3
      }
    ];

    // Create electron nodes once (front/back clones for reliable layering)
    const svgNS = 'http://www.w3.org/2000/svg';
    const frontLayer = document.getElementById('front-layer');
    const backLayer  = document.getElementById('back-layer');

    const nodes = electrons.map((e) => {
      const front = document.createElementNS(svgNS, 'circle');
      front.setAttribute('r', e.radius);
      front.setAttribute('class', `electron ${e.colorClass}`);
      frontLayer.appendChild(front);

      const back = document.createElementNS(svgNS, 'circle');
      back.setAttribute('r', e.radius);
      back.setAttribute('class', `electron ${e.colorClass}`);
      backLayer.appendChild(back);

      // Start hidden to prevent flicker
      front.style.opacity = '0';
      back.style.opacity  = '0';
      return { e, front, back, phase: Math.random() * Math.PI * 2 };
    });

    // Utility: rotate a 2D point by degrees
    function rotate(x, y, deg) {
      const rad = deg * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      return { x: x * cos - y * sin, y: x * sin + y * cos };
    }

    // Depth cue: project a simple pseudo-3D "z" using ellipse param and tilt
    // z ~ sin(t) scaled by tilt amount; sign indicates front/back
    function depthZ(t, tiltDeg) {
      const tilt = Math.sin(Math.abs(tiltDeg) * Math.PI / 180); // 0..1
      return Math.sin(t) * tilt;
    }

    // Overlap check: is electron within nucleus disc?
    function overlapsNucleus(px, py, rElectron) {
      const dx = px - nucleus.x;
      const dy = py - nucleus.y;
      const dist2 = dx*dx + dy*dy;
      const R = nucleus.r + rElectron * 0.85; // slight bias so it fully disappears
      return dist2 <= R*R;
    }

    let last = performance.now();
    function animate(now) {
      const dt = Math.min(0.05, (now - last) / 1000); // seconds
      last = now;

      nodes.forEach((n) => {
        const e = n.e;
        n.phase += dt * e.speed * 1.2; // angular velocity
        const t = n.phase;

        // Parametric ellipse (unrotated)
        const ex = e.rx * Math.cos(t);
        const ey = e.ry * Math.sin(t);

        // Rotate ellipse to its tilt angle (visual plane orientation)
        const p = rotate(ex, ey, e.tiltDeg);

        // Depth calculation: sign indicates front/back relative to viewer
        const z = depthZ(t, e.tiltDeg);

        const isBehind = z < 0;
        const hiddenByNucleus = isBehind && overlapsNucleus(p.x, p.y, e.radius);

        // Place both circles; show only the appropriate layer
        n.front.setAttribute('cx', p.x);
        n.front.setAttribute('cy', p.y);
        n.back.setAttribute('cx', p.x);
        n.back.setAttribute('cy', p.y);

        if (hiddenByNucleus) {
          // Fully disappear when behind and occluded by nucleus
          n.front.style.opacity = '0';
          n.back.style.opacity  = '0';
        } else {
          // Soft depth cue: front brighter, back dimmer
          const baseFront = 1.0;
          const baseBack  = 0.45;

          if (isBehind) {
            n.front.style.opacity = '0';
            n.back.style.opacity  = baseBack;
          } else {
            n.front.style.opacity = baseFront;
            n.back.style.opacity  = '0';
          }
        }
      });

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
