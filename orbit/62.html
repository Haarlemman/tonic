<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crushed&display=swap" rel="stylesheet">
<style>
    body { margin:0; background:#000; overflow:hidden; display:flex; justify-content:center; align-items:center; height:100vh; }
    .atom-container { position:relative; width:600px; height:600px; }
    .nucleus {
        position:absolute; top:50%; left:50%;
        width:180px; height:180px; margin:-90px 0 0 -90px;
        z-index:500;
        display:flex;
        align-items:center;
        justify-content:center;
		filter: drop-shadow(0 0 0.75rem rgb(214, 21, 68));
    }
    .nucleus img {
        width:100%;
        height:100%;
        object-fit:contain;
    }
    .electron {
        position:absolute; width:40px; height:40px; border-radius:50%; margin:-20px 0 0 -20px;
        pointer-events:none;
    }
 /*   .label {
        position:absolute;
        font-family:'Crushed', cursive;
        font-size:18px;
        color:#fff;
        text-shadow:0 0 8px rgba(0,0,0,0.8);
        pointer-events:none;
        white-space:nowrap;
        transform:translate(-50%, 10px);
    }
	*/
    #e1 { background:radial-gradient(circle at 30% 30%, #ff0000, #ff2244); box-shadow:0 0 55px #ff4466, inset -8px -8px 20px #900; }
    #e2 { background:radial-gradient(circle at 30% 30%, #0000ff, #33889f); box-shadow:0 0 55px #55aa99, inset -8px -8px 20px #0066cc; }
    #e3 { background:radial-gradient(circle at 30% 30%, #ffff00, #ffdd22); box-shadow:0 0 55px #ffee66, inset -8px -8px 20px #ccaa00; }
    canvas { position:absolute; inset:0; pointer-events:none; }
    .trail-front { z-index:550; }
</style>
</head>
<body>
<div class="atom-container">
    <div class="electron" id="e1"></div>
    <div class="label" id="label1">Body</div>
    <div class="electron" id="e2"></div>
    <div class="label" id="label2">Soul</div>
    <div class="electron" id="e3"></div>
    <div class="label" id="label3">Mind</div>
    <canvas id="trailsBack"  width="600" height="600"></canvas>
    <div class="nucleus">
        <img src="images/dophet.png" alt="Face">
    </div>
    <canvas id="trailsFront" width="600" height="600" class="trail-front"></canvas>
</div>

<script>
const baseSpeed      = 0.04;
const trailFade      = 0.009;
const trailThickness = 3.5;

const canvasBack  = document.getElementById('trailsBack');
const ctxBack     = canvasBack.getContext('2d');
const canvasFront = document.getElementById('trailsFront');
const ctxFront    = canvasFront.getContext('2d');
ctxBack.lineWidth = ctxFront.lineWidth = trailThickness;
ctxBack.lineCap = ctxFront.lineCap = 'round';

const centerX = 300;
const centerY = 300;
const nucleusRadius = 90;

const electrons = [
    { el: document.getElementById('e1'), label: document.getElementById('label1'), 
	 color: '#ff3355', 
	 speedMultiplier: 1,  radius: 225,
      inclinationDeg: 90, planeRotDeg: 7, 
	   rollDeg:   0 },   // red

    { el: document.getElementById('e2'), label: document.getElementById('label2'), color: '#4488ff', 
	 speedMultiplier: 0.5, radius: 290,
      inclinationDeg: 15, planeRotDeg: 95, 
	   rollDeg:   55 },   // blue

    { el: document.getElementById('e3'), label: document.getElementById('label3'), color: '#ffdd33', 
	 speedMultiplier: 3, radius: 180,
      inclinationDeg: 15, planeRotDeg: 110, 
	   rollDeg:  -60 }    // yellow
];

// Pre-convert all angles
electrons.forEach(e => {
    const rad = deg => deg * Math.PI / 180;
    e.i = rad(e.inclinationDeg);
    e.r = rad(e.planeRotDeg);
    e.o = rad(e.rollDeg);   // "o" for roll (orbit roll)
});

let time = 0;
function animate() {
    time += baseSpeed;

    ctxBack.fillStyle  = `rgba(0,0,0,${trailFade})`; ctxBack.fillRect(0,0,600,600);
    ctxFront.fillStyle = `rgba(0,0,0,${trailFade})`; ctxFront.fillRect(0,0,600,600);

    electrons.forEach(e => {
        const a = time * e.speedMultiplier;

        // 1. Local circular motion
        let x = Math.cos(a) * e.radius;
        let y = Math.sin(a) * e.radius;
        let z = 0;

        // 2. Apply inclination (tilt from horizontal)
        const tx = x * Math.cos(e.i) + z * Math.sin(e.i);
        z        = -x * Math.sin(e.i) + z * Math.cos(e.i);
        x = tx;

        // 3. Apply plane rotation (safe dial – around Y)
        const tx2 = x * Math.cos(e.r) - z * Math.sin(e.r);
        z         = x * Math.sin(e.r) + z * Math.cos(e.r);
        x = tx2;

        // 4. NEW: Apply roll – rotation around line of sight (Z axis)
        const tx3 = x * Math.cos(e.o) - y * Math.sin(e.o);
        const ty3 = x * Math.sin(e.o) + y * Math.cos(e.o);
        x = tx3; y = ty3;

        // Perspective + screen
        const scale = 1 + z * 0.0038;
        const screenX = centerX + x;
        const screenY = centerY + y;

        e.el.style.left = screenX + 'px';
        e.el.style.top  = screenY + 'px';
        e.el.style.transform = `scale(${scale})`;

        // Position and scale the label
        e.label.style.left = screenX + 'px';
        e.label.style.top  = (screenY + 30) + 'px';
        e.label.style.transform = `translate(-50%, 0) scale(${scale})`;

        const behind = z < -20 && Math.hypot(x, y) < nucleusRadius + 20;
        e.el.style.zIndex = behind ? 400 : 600;
        e.label.style.zIndex = e.el.style.zIndex;

        const ctx = z < 0 ? ctxBack : ctxFront;
        ctx.globalAlpha = 0.6;
        ctx.strokeStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(screenX, screenY);
        ctx.lineTo(screenX + 0.1, screenY + 0.1);
        ctx.stroke();
    });

    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
