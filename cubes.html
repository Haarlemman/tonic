<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The University of Free Will</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --ink: #111111;
            --red: #ff3300;
            --yellow: #ffcc00;
            --blue: #0033cc;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            opacity: 1;
            transition: opacity 0.5s ease;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* Intro Overlay */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            transition: opacity 1.5s ease, visibility 1.5s;
        }

        #intro-text {
            font-size: 1.3rem;
            font-weight: normal;
            max-width: 650px;
            min-height: 120px;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 0 20px;
            letter-spacing: 1px;
            transition: opacity 0.8s ease;
        }

        /* TWEAKED BUTTON ANIMATION - 2 SECOND FADE ONLY */
        .intro-btns {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .intro-btns.visible {
            opacity: 1;
        }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: white;
            padding: 15px 45px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
            min-width: 260px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .action-btn:hover {
            background: white;
            color: black;
            border-color: white;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        /* Faculty Screen Overlay */
        #faculty-screen {
            position: absolute;
            width: 280px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 80;
            opacity: 0;
            transition: opacity 0.4s ease;
            text-align: center;
            transform: translate(-50%, -120%);
        }

        #faculty-screen.active {
            display: flex;
            opacity: 1;
        }

        .neon-text {
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.4;

            min-height: 3.5em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neon-art { color: #ff3e3e; text-shadow: 0 0 10px #ef4444; }
        .neon-science { color: #3e9bff; text-shadow: 0 0 10px #3b82f6; }
        .neon-spirit { color: #ffff3e; text-shadow: 0 0 10px #facc15; }

        .screen-sub {
            color: #555;
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }

        /* HUD */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
            z-index: 50;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .brand-box {
            background: #111;
            color: white;
            padding: 15px 25px;
            display: inline-block;
            pointer-events: auto;
            border-left: 5px solid #ffcc00;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            text-transform: uppercase;
            line-height: 1.1;
            font-weight: normal;
        }

        .sub-brand {
            font-size: 0.65rem;
            margin-top: 6px;
            letter-spacing: 2px;
            color: #888;
        }

        .status-box {
            pointer-events: auto;
            display: flex;
            gap: 10px;
        }

        .hud-btn {
            background: #111;
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.7rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .hud-btn:hover {
            background: white;
            color: black;
            border-color: white;
        }

        #general-menu {
            position: absolute;
            top: 85px;
            right: 30px;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            width: 200px;
            display: none;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        #general-menu.active {
            display: flex;
        }

        .menu-link {
            color: #888;
            text-decoration: none;
            font-size: 0.75rem;
            padding: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }

        .menu-link:hover { color: white; padding-left: 15px; }

        .controls-box {
            font-size: 0.7rem;
            color: #eee;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            max-width: 240px;
            backdrop-filter: blur(10px);
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .key { font-weight: bold; color: #888; }

        .directory-box {
            pointer-events: auto;
            text-align: right;
        }

        .building-tag {
            display: block;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 16px;
            margin-bottom: 6px;
            font-size: 0.75rem;
            text-transform: uppercase;
            border-right: 5px solid #444;
            transition: all 0.3s;
            cursor: pointer;
            color: #eee;
            border-left: 1px solid rgba(255,255,255,0.1);
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .tag-red { border-right-color: #ff3300; }
        .tag-blue { border-right-color: #0033cc; }
        .tag-yellow { border-right-color: #ffcc00; }

        .building-tag:hover {
            transform: translateX(-10px);
            background: white;
            color: black;
            border-right-width: 10px;
        }
    </style>
</head>

<body>
    <audio id="bg-music" loop crossorigin="anonymous">
        <source src="audio/MysteriousHeartbeat1.mp3" type="audio/mpeg">
    </audio>

    <div id="intro-overlay">
        <div id="intro-text"></div>
        <div class="intro-btns" id="intro-btn-container">
            <!-- Changed text to "Initiate" -->
            <button id="skip-btn" class="action-btn">Initiate</button>
        </div>
    </div>

    <div id="faculty-screen">
        <div id="screen-content" class="neon-text"></div>
        <div class="screen-sub">FACULTY DATA FEED</div>
    </div>

    <div id="hud-layer">
        <div style="display:flex; justify-content:space-between; align-items: flex-start;">
            <div class="brand-box">
                <h1>University<br>of Free Will</h1>
                <div class="sub-brand">ADVERSITY IS YOUR TEACHER</div>
            </div>
            <div class="status-box">
                <button class="hud-btn" onclick="toggleMusic()" id="music-toggle">Audio: Off</button>
                <button class="hud-btn" onclick="toggleMenu()">Menu</button>
            </div>
            <div id="general-menu">
                <div style="color:#666; font-size:0.55rem; padding:10px; border-bottom:1px solid #333; margin-bottom:10px; letter-spacing: 2px;">CAMPUS DIRECTORY</div>
                <a href="#" class="menu-link" onclick="toggleMenu()">Info Desk</a>
                <a href="#" class="menu-link" onclick="focusBuilding('art')">Artistic Core</a>
                <a href="#" class="menu-link" onclick="focusBuilding('science')">Scientific Method</a>
                <a href="#" class="menu-link" onclick="focusBuilding('spirit')">Spiritual Path</a>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
            <div class="controls-box">
                <div style="border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:10px; padding-bottom:5px; color:#666; font-weight:bold; font-size:0.6rem; letter-spacing: 2px;">
                    AUDIO-KINETIC FEED</div>
                <div class="control-row"><span class="key">BEAT SYNC</span> <span>ACTIVE</span></div>
                <div class="control-row"><span class="key">AUTO-TOUR</span> <span>ENGAGED</span></div>
                <div class="control-row"><span class="key">ORBITING</span> <span>L-DRAG</span></div>
            </div>

            <div class="directory-box">
                <div class="building-tag tag-red" onclick="focusBuilding('art')">Beauty</div>
                <div class="building-tag tag-blue" onclick="focusBuilding('science')">Knowledge</div>
                <div class="building-tag tag-yellow" onclick="focusBuilding('spirit')">Wisdom</div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, raycaster, mouse, controls;
        let specialBlocks = [];

        let audioCtx, analyser, dataArray;
        let audioInitialized = false;
        let beatLevel = 0;

        let introActive = true;
        let skipRequested = false;
        let cinematicTarget = null;
        let lastZoomTime = 0;
        let lastQuoteTime = 0;
        const ZOOM_INTERVAL = 14000;

        const QUOTE_INTERVAL = 2500;

        const introTextEl = document.getElementById('intro-text');
        const skipBtn = document.getElementById('skip-btn');
        const hudLayer = document.getElementById('hud-layer');
        const bgMusic = document.getElementById('bg-music');
        const musicToggleBtn = document.getElementById('music-toggle');
        const facultyScreen = document.getElementById('faculty-screen');
        const screenContent = document.getElementById('screen-content');
        const generalMenu = document.getElementById('general-menu');

        const facultyData = {
            art: { quotes: ["UNUSUAL IS BEAUTY", "TO CREATE IS TO LIVE", "ESTHETICS OF THE SOUL", "FORM FOLLOWS FREEDOM", "THE CANVAS BLEEDS", "MIND IS THE BRUSH"], class: "neon-art", quoteIndex: 0 },
            science: { quotes: ["FREE WILL IS A PARADOX", "THE ANSWER IS WHERE YOU ARE NOT LOOKING", "THE MORE YOU KNOW, THE LESS YOU UNDERSTAND", "REALITY IS RELATIVE", "ENTROPY IS A BEGINNING"], class: "neon-science", quoteIndex: 0 },
            spirit: { quotes: ["ADVERSITY IS YOUR TEACHER", "LETTING GO IS POWER", "SILENCE SPEAKS VOLUMES", "WISDOM THROUGH SURRENDER", "THE VOID STARES BACK", "EGOS ARE NULL"], class: "neon-spirit", quoteIndex: 0 }
        };

        const introQuotes = [
            "Welcome to the University of Free Will.",
            "A place of knowledge, wisdom and beauty.",
            "Where letting go of control equals freedom.",
            "And where adversity becomes your teacher."
        ];

        window.onload = function () {
            init();
            animate();
            runIntroSequence();
            skipBtn.onclick = (e) => { e.stopPropagation(); startExperience(); };
        };

        function toggleMenu() { generalMenu.classList.toggle('active'); }

        function toggleMusic() {
            if (!audioInitialized) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (bgMusic.paused) { bgMusic.play(); musicToggleBtn.innerText = "Audio: On"; } 
            else { bgMusic.pause(); musicToggleBtn.innerText = "Audio: Off"; }
        }

        async function runIntroSequence() {
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;
            
            // Trigger 2-second fade-in immediately
            document.getElementById('intro-btn-container').classList.add('visible');

            for (let quote of introQuotes) {
                if (skipRequested) break;
                introTextEl.style.opacity = 0;
                await new Promise(r => setTimeout(r, 800));
                if (skipRequested) break;
                introTextEl.innerText = quote;
                introTextEl.style.opacity = 1;
                await new Promise(r => setTimeout(r, 3500));
            }
        }

        function initAudio() {
            if (audioInitialized) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(bgMusic);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioInitialized = true;
            } catch (e) { console.log("Audio Error:", e); }
        }

        function startExperience() {
            skipRequested = true;
            introActive = false;
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            bgMusic.volume = 0.5;
            bgMusic.play().catch(() => { });
            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                hudLayer.style.opacity = 1;
                lastZoomTime = Date.now();
            }, 1500);
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 22);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.4;
            controls.enablePan = false;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(10, 20, 10);
            scene.add(pointLight);

            // Re-creating the 3 "Imperfect" Faculty Blocks (prismatic wireframes)
            // Beauty: Red Prismatic Box
            createBuilding(-8, 2, 0, 0xff3300, "art", "Beauty", [3.2, 5, 2.8]);
            // Knowledge: Blue Prismatic Box
            createBuilding(8, -1, 2, 0x0033cc, "science", "Knowledge", [4.5, 3.5, 4.5]);
            // Wisdom: Yellow Prismatic Box
            createBuilding(0, 10, -7, 0xffcc00, "spirit", "Wisdom", [2.5, 8, 2.5]);

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', onMouseMove, false);
        }

        function createBuilding(x, y, z, color, type, label, size) {
            const geo = new THREE.BoxGeometry(...size);
            const mat = new THREE.MeshPhongMaterial({ 
                color: color, 
                wireframe: true,
                emissive: color,
                emissiveIntensity: 0.6,
                transparent: true,
                opacity: 0.8
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.userData = { type, label };
            scene.add(mesh);
            specialBlocks.push(mesh);
        }

        function focusBuilding(type) {
            if (generalMenu.classList.contains('active')) toggleMenu();
            const b = specialBlocks.find(b => b.userData.type === type);
            if (b) {
                cinematicTarget = b;
                lastZoomTime = Date.now();
                lastQuoteTime = Date.now();
                updateFacultyScreen(type);
                facultyScreen.classList.add('active');
            }
        }

        function updateFacultyScreen(type) {
            const data = facultyData[type];
            if (!data) return;
            screenContent.className = 'neon-text ' + data.class;
            screenContent.innerText = data.quotes[data.quoteIndex];
            data.quoteIndex = (data.quoteIndex + 1) % data.quotes.length;
        }

        function onMouseMove(event) {
            if (introActive) return;
            mouse = mouse || new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster = raycaster || new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(specialBlocks);
            if (intersects.length > 0) {
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = Date.now();
            
            if (audioInitialized && !bgMusic.paused) {
                analyser.getByteFrequencyData(dataArray);
                let bass = 0; for (let i = 0; i < 16; i++) bass += dataArray[i];
                beatLevel = (bass / 16 / 255);
            }

            specialBlocks.forEach((c, idx) => {
                c.rotation.x += 0.008 + (idx * 0.003);
                c.rotation.y += 0.012;
                // Asymmetric pulse based on beat
                const s = 1 + (beatLevel * (0.15 + idx * 0.1));
                c.scale.set(s, s, s);
            });

            if (!introActive && now - lastZoomTime > ZOOM_INTERVAL) {
                if (cinematicTarget) { cinematicTarget = null; facultyScreen.classList.remove('active'); }
                else { focusBuilding(specialBlocks[Math.floor(Math.random() * specialBlocks.length)].userData.type); }
                lastZoomTime = now;
            }

            if (cinematicTarget) {
                controls.target.lerp(cinematicTarget.position.clone(), 0.08);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.4, 0.04);
                if (now - lastQuoteTime > QUOTE_INTERVAL) { updateFacultyScreen(cinematicTarget.userData.type); lastQuoteTime = now; }
                const vector = cinematicTarget.position.clone();
                vector.project(camera);
                facultyScreen.style.left = (vector.x * .5 + .5) * window.innerWidth + 'px';
                facultyScreen.style.top = (vector.y * -.5 + .5) * window.innerHeight + 'px';
            } else {
                controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.03);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.03);
            }

            camera.updateProjectionMatrix();
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
