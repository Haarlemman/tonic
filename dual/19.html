<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWIN CITY | The Circular Paradox</title>
    <style>
        :root {
            --day-grad: linear-gradient(to bottom, #001a4d 0%, #4dabff 100%);
            --night-grad: linear-gradient(to bottom, #000000 0%, #1a0b3c 100%);
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: var(--day-grad);
            transition: background 1.2s ease-in-out;
            font-family: 'Inter', sans-serif;
        }

        #stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        #stars.visible {
            opacity: 1;
        }

        .star {
            position: absolute;
        }

        @keyframes blink {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        #canvas-container { 
            width: 100%; 
            height: 100%; 
            display: block; 
            background: transparent;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        #hud {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }

        h1 { 
            font-size: 1.2rem; 
            font-weight: 900; 
            letter-spacing: 14px; 
            text-transform: uppercase; 
            margin: 0;
            border-left: 6px solid #f1c40f;
            padding-left: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 9px;
            letter-spacing: 6px;
            color: rgba(255,255,255,0.9);
            margin-top: 8px;
            padding-left: 26px;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="stars"></div>
    
    <div id="hud">
        <h1>Twin City</h1>
        <div class="subtitle" id="side-indicator">Circular • Paradox • Rhythm</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let ambientLight, sun, nightLight;
        let upperGroup, lowerGroup;
        let upperTrails = [], lowerTrails = [];
        let lastSide = null;
        let mouseX = 0, mouseY = 0;

        const NEON_PALETTE = [0x00ffff, 0xff00ff, 0x00ff00, 0xffff00];

        window.onload = init;

        function init() {
            // Create stars in DOM
            const starsContainer = document.getElementById('stars');
            console.log('Stars container:', starsContainer);
            
            if (starsContainer) {
                for (let i = 0; i < 200; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    const size = (1 + Math.random() * 2) + 'px';
                    star.style.width = size;
                    star.style.height = size;
                    star.style.backgroundColor = Math.random() < 0.5 ? '#9933ff' : '#00ffff';
                    star.style.animation = 'blink ' + (1 + Math.random() * 2) + 's infinite ease-in-out';
                    starsContainer.appendChild(star);
                }
                console.log('Created', starsContainer.children.length, 'stars');
            }
            
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x4dabff, 100, 3500);

            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(400, 400, 400);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000, 0); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minPolarAngle = 0;
            controls.maxPolarAngle = Math.PI;

            ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambientLight);
            
            sun = new THREE.DirectionalLight(0xffffff, 1.6);
            sun.position.set(100, 500, 100);
            scene.add(sun);

            nightLight = new THREE.PointLight(0x6633ff, 4.5, 2500);
            nightLight.position.set(0, -300, 0);
            scene.add(nightLight);

            upperGroup = new THREE.Group();
            lowerGroup = new THREE.Group();
            scene.add(upperGroup);
            scene.add(lowerGroup);

            buildWorld();

            window.addEventListener('resize', onResize);
            animate();
        }

        function buildWorld() {
            const rings = 6;
            const ringSpacing = 12;
            const cityEdgeRadius = (rings + 1) * ringSpacing;
            const roadRadius = cityEdgeRadius + 22;

            const dividerRadius = roadRadius + 40;
            const baseFloor = new THREE.Mesh(
                new THREE.CircleGeometry(dividerRadius, 64),
                new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })
            );
            baseFloor.rotation.x = Math.PI / 2;
            scene.add(baseFloor);

            const whiteRing = new THREE.Mesh(
                new THREE.RingGeometry(cityEdgeRadius + 2, roadRadius - 6, 64),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, metalness: 0 })
            );
            whiteRing.rotation.x = -Math.PI / 2;
            whiteRing.position.y = 0.12;
            upperGroup.add(whiteRing);

            const innerRing = new THREE.Mesh(
                new THREE.TorusGeometry(12, 0.8, 16, 64),
                new THREE.MeshBasicMaterial({ color: 0x000000 })
            );
            innerRing.rotation.x = Math.PI / 2;
            innerRing.position.y = 0.18;
            upperGroup.add(innerRing);

            const roadGeom = new THREE.TorusGeometry(roadRadius, 4.5, 16, 128);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
            
            const uRoad = new THREE.Mesh(roadGeom, roadMat);
            uRoad.rotation.x = Math.PI / 2; 
            uRoad.position.y = 0.35;
            upperGroup.add(uRoad);
            
            const lRoad = new THREE.Mesh(roadGeom, roadMat);
            lRoad.rotation.x = Math.PI / 2; 
            lRoad.position.y = -0.35;
            lowerGroup.add(lRoad);

            for (let i = 0; i < 3; i++) {
                const neonLane = new THREE.Mesh(
                    new THREE.TorusGeometry(roadRadius + (i-1)*2, 0.1, 8, 128),
                    new THREE.MeshStandardMaterial({ color: NEON_PALETTE[i], emissive: NEON_PALETTE[i], emissiveIntensity: 4 })
                );
                neonLane.rotation.x = Math.PI / 2;
                neonLane.position.y = -0.45;
                lowerGroup.add(neonLane);
            }

            const dayBuildingColors = [
                0x1a3a52, 0x2c4a5e, 0x1e384a, 0x263d50, 0x1f3544, 0x243848, 0x2a4458, 0x1c3240,
                0x4a3a2a, 0x3e2e1e, 0x3a2818, 0x2e1f12, 0x4d3d2d, 0x5a4a3a, 0x362614, 0x4b3b2b,
                0x3a2e2a, 0x4a3e3a, 0x2e2218, 0x3e3228, 0x4e4238, 0x382c22, 0x4c4034, 0x2c201a,
                0x5a4a2a, 0x6a5a3a, 0x4a3a1a, 0x7a6a4a, 0x5e4e2e, 0x6e5e3e, 0x4e3e1e, 0x5a4a2e
            ];
            
            for (let r = 2; r <= rings + 1; r++) {
                const radius = r * ringSpacing;
                const count = Math.floor(radius * 0.9);
                const heightMultiplier = (rings + 2 - r) / rings;
                
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const px = Math.cos(angle) * radius;
                    const pz = Math.sin(angle) * radius;

                    const baseHeight = 8 + Math.random() * 15;
                    const hT = baseHeight * (0.5 + heightMultiplier * 2);
                    const w = 3.5 + Math.random() * 2;
                    const d = 3.5 + Math.random() * 2;
                    const dayHouse = new THREE.Group();
                    const buildingColor = dayBuildingColors[Math.floor(Math.random() * dayBuildingColors.length)];
                    const box = new THREE.Mesh(new THREE.BoxGeometry(w, hT, d), new THREE.MeshStandardMaterial({ color: buildingColor, roughness: 0.9, metalness: 0 }));
                    box.position.y = hT / 2;
                    dayHouse.add(box);
                    
                    for(let j=0; j<Math.floor(hT/4); j++) {
                        const winCol = Math.random() > 0.7 ? 0xffd700 : 0xd4a520;
                        const dot = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.12), new THREE.MeshBasicMaterial({ color: winCol }));
                        const side = Math.random() > 0.5 ? 1 : -1;
                        dot.position.set((Math.random()-0.5)*w*0.8, Math.random()*hT, (d/2 + 0.08)*side);
                        dayHouse.add(dot);
                    }
                    dayHouse.position.set(px, 0.05, pz);
                    dayHouse.rotation.y = -angle;
                    upperGroup.add(dayHouse);

                    const hB = 10 + Math.random() * 45;
                    const nHouse = new THREE.Group();
                    const bBox = new THREE.Mesh(new THREE.BoxGeometry(4.5, hB, 4.5), new THREE.MeshStandardMaterial({ color: 0x010105 }));
                    bBox.position.y = -hB / 2;
                    nHouse.add(bBox);
                    
                    const neonCol = NEON_PALETTE[Math.floor(Math.random() * NEON_PALETTE.length)];
                    const win = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.7, 4.6), new THREE.MeshStandardMaterial({ color: neonCol, emissive: neonCol, emissiveIntensity: 12 }));
                    win.position.y = -Math.random() * hB;
                    nHouse.add(win);
                    
                    nHouse.position.set(px, -0.05, pz);
                    nHouse.rotation.y = -angle;
                    lowerGroup.add(nHouse);
                }
            }

            const beamGroup = new THREE.Group();
            const redBase = new THREE.Mesh(new THREE.CylinderGeometry(5.5, 5.5, 18, 32), new THREE.MeshBasicMaterial({ color: 0x9e0000 }));
            redBase.position.y = 9;
            beamGroup.add(redBase);
            
            const yellowCore = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 1400, 32), new THREE.MeshBasicMaterial({ color: 0xffe600, transparent: true, opacity: 0.8 }));
            yellowCore.position.y = 700;
            beamGroup.add(yellowCore);
            
            const yellowGlow = new THREE.Mesh(new THREE.CylinderGeometry(18, 2, 1400, 32), new THREE.MeshBasicMaterial({ 
                color: 0xffaa00, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending 
            }));
            yellowGlow.position.y = 700;
            beamGroup.add(yellowGlow);

            const yellowOuterGlow = new THREE.Mesh(new THREE.CylinderGeometry(30, 5, 1400, 32), new THREE.MeshBasicMaterial({ 
                color: 0xffaa00, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending 
            }));
            yellowOuterGlow.position.y = 700;
            beamGroup.add(yellowOuterGlow);
            
            const violetCore = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 1400, 32), new THREE.MeshBasicMaterial({ color: 0x7700ff, transparent: true, opacity: 0.7 }));
            violetCore.position.y = -700;
            beamGroup.add(violetCore);
            
            const violetGlow = new THREE.Mesh(new THREE.CylinderGeometry(20, 3, 1400, 32), new THREE.MeshBasicMaterial({ 
                color: 0x4400ff, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending 
            }));
            violetGlow.position.y = -700;
            beamGroup.add(violetGlow);

            const violetOuterGlow = new THREE.Mesh(new THREE.CylinderGeometry(35, 6, 1400, 32), new THREE.MeshBasicMaterial({ 
                color: 0x4400ff, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending 
            }));
            violetOuterGlow.position.y = -700;
            beamGroup.add(violetOuterGlow);
            
            scene.add(beamGroup);

            const mCols = [0xdc143c, 0xffd700, 0x0047ab, 0xdc143c, 0xffd700, 0x0047ab, 0xdc143c, 0x0047ab];
            const vehiclesPerLane = 40;
            for (let lane = 0; lane < 2; lane++) {
                const inner = lane === 0;
                const laneRadius = roadRadius + (inner ? -10 : 10);
                for (let i = 0; i < vehiclesPerLane; i++) {
                    const angle = (i / vehiclesPerLane) * Math.PI * 2;
                    const speed = (0.006 + Math.random() * 0.006) * (inner ? 1 : -1);
                    const car = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 7), new THREE.MeshBasicMaterial({ color: mCols[i % mCols.length] }));
                    car.userData = { angle: angle, speed: speed, radius: laneRadius, y: 3.5 };
                    upperGroup.add(car);
                    upperTrails.push(car);
                }
            }
            
            for (let lane = 0; lane < 2; lane++) {
                const inner = lane === 0;
                const laneRadius = roadRadius + (inner ? -12 : 12);
                const trailsPerLane = 12;
                for (let i = 0; i < trailsPerLane; i++) {
                    const angle = (i / trailsPerLane) * Math.PI * 2;
                    const col = NEON_PALETTE[i % NEON_PALETTE.length];
                    const speed = (0.035 + Math.random() * 0.045) * (inner ? 1 : -1);
                    
                    const trailGroup = new THREE.Group();
                    
                    // Create curved trail following the circle - much longer
                    const trailSegments = 35;
                    const trailArcLength = 0.35; // Longer arc length
                    
                    for (let seg = 0; seg < trailSegments; seg++) {
                        const segmentProgress = seg / trailSegments;
                        const segmentAngle = -segmentProgress * trailArcLength * (inner ? 1 : -1);
                        const segmentOpacity = 1 - segmentProgress * 0.9;
                        const segmentWidth = 2.0 - segmentProgress * 1.0;
                        
                        const trail = new THREE.Mesh(
                            new THREE.BoxGeometry(segmentWidth, 0.5, 1.2),
                            new THREE.MeshBasicMaterial({ 
                                color: col, 
                                transparent: true, 
                                opacity: segmentOpacity,
                                blending: THREE.AdditiveBlending
                            })
                        );
                        
                        const x = Math.cos(segmentAngle) * laneRadius;
                        const z = Math.sin(segmentAngle) * laneRadius;
                        trail.position.set(x, 0, z);
                        trail.rotation.y = -segmentAngle + Math.PI / 2;
                        
                        trailGroup.add(trail);
                    }
                    
                    trailGroup.userData = { angle: angle, speed: speed, radius: laneRadius, y: -3.5 };
                    lowerGroup.add(trailGroup);
                    lowerTrails.push(trailGroup);
                }
            }
            
            for (let i = 0; i < 200; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const dist = 800 + Math.random() * 400;
                const star = new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 1.5, 1.5),
                    new THREE.MeshBasicMaterial({ 
                        color: 0x9933ff, 
                        transparent: true, 
                        opacity: 0.6 + Math.random() * 0.4 
                    })
                );
                star.position.set(
                    Math.sin(phi) * Math.cos(theta) * dist,
                    -Math.abs(Math.cos(phi) * dist),
                    Math.sin(phi) * Math.sin(theta) * dist
                );
                lowerGroup.add(star);
            }
        }

        function updateEnvironment() {
            const y = camera.position.y;
            const isDay = y > 0;
            if (isDay === lastSide) return;
            lastSide = isDay;

            const body = document.body;
            const starsContainer = document.getElementById('stars');
            if (isDay) {
                body.style.background = "var(--day-grad)";
                body.classList.remove('night');
                starsContainer.classList.remove('visible');
                scene.fog.color.set(0x4dabff);
                ambientLight.intensity = 1.4;
                sun.intensity = 2.0;
                nightLight.intensity = 0;
                upperGroup.visible = true;
                lowerGroup.visible = false;
            } else {
                body.style.background = "var(--night-grad)";
                body.classList.add('night');
                starsContainer.classList.add('visible');
                scene.fog.color.set(0x1a0b3c);
                ambientLight.intensity = 0.2;
                sun.intensity = 0;
                nightLight.intensity = 6.0;
                upperGroup.visible = false;
                lowerGroup.visible = true;
            }
            document.getElementById('side-indicator').innerText = isDay ? "UPPER WORLD • CERULEAN GRADIENT" : "NETHER WORLD • NEON PULSE";
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateEnvironment();

            const azimuthal = controls.getAzimuthalAngle();
            const polar = controls.getPolarAngle();
            mouseX = azimuthal / Math.PI; // -1 to 1
            mouseY = (polar / Math.PI) * 2 - 1; // -1 top to 1 bottom

            const starsContainer = document.getElementById('stars');
            if (starsContainer.classList.contains('visible')) {
                const stars = Array.from(starsContainer.children);
                stars.forEach(star => {
                    const depth = (parseFloat(star.style.width) - 1) / 2 * 10 + 5; // 5-15px max shift
                    const shiftX = mouseX * depth * 10; // Adjust multiplier if needed
                    const shiftY = mouseY * depth * 10;
                    star.style.transform = `translate(${shiftX}px, ${shiftY}px)`;
                });
            }

            const move = (trails) => {
                trails.forEach(t => {
                    if(t.parent.visible) {
                        t.userData.angle += t.userData.speed;
                        
                        // Update entire group position
                        t.position.y = t.userData.y;
                        t.rotation.y = -t.userData.angle;
                        
                        // For trail groups, update each segment's position relative to the group
                        if (t.children.length > 1 && t.children[0].geometry.type === 'BoxGeometry') {
                            const isTrail = t.children.length > 15;
                            if (isTrail) {
                                // Recalculate trail segment positions in circular path
                                const inner = t.userData.speed > 0;
                                const trailArcLength = 0.35;
                                t.children.forEach((segment, idx) => {
                                    const segmentProgress = idx / t.children.length;
                                    const segmentAngle = -segmentProgress * trailArcLength * (inner ? 1 : -1);
                                    const x = Math.cos(segmentAngle) * t.userData.radius;
                                    const z = Math.sin(segmentAngle) * t.userData.radius;
                                    segment.position.set(x, 0, z);
                                    segment.rotation.y = -segmentAngle + Math.PI / 2;
                                });
                            }
                        } else {
                            // Simple vehicles
                            t.position.x = Math.cos(t.userData.angle) * t.userData.radius;
                            t.position.z = Math.sin(t.userData.angle) * t.userData.radius;
                            t.rotation.y = -t.userData.angle + (t.userData.speed > 0 ? 0 : Math.PI);
                        }
                    }
                });
            };

            move(upperTrails);
            move(lowerTrails);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
