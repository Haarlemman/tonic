<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWIN CITY | The Circular Paradox</title>
    <style>
        :root {
            /* REVERSED Day Gradient: Dark at horizon (bottom), Light at top */
            --day-grad: linear-gradient(to top, #000c24 0%, #001a4d 25%, #4dabff 100%);
            /* Night Gradient: Absolute black at horizon, deep electric indigo-violet */
            --night-grad: linear-gradient(to bottom, #000000 0%, #050010 20%, #1e0f3c 100%);
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: var(--day-grad);
            transition: background 1.5s ease-in-out;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container { 
            width: 100%; 
            height: 100%; 
            display: block; 
            background: transparent;
        }

        #hud {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }

        h1 { 
            font-size: 1.2rem; 
            font-weight: 900; 
            letter-spacing: 14px; 
            text-transform: uppercase; 
            margin: 0;
            border-left: 6px solid #f1c40f;
            padding-left: 20px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .subtitle {
            font-size: 9px;
            letter-spacing: 6px;
            color: rgba(255,255,255,0.9);
            margin-top: 8px;
            padding-left: 26px;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1>Twin City</h1>
        <div class="subtitle" id="side-indicator">Circular • Paradox • Rhythm</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let ambientLight, sun, nightLight;
        let upperGroup, lowerGroup;
        let upperTrails = [], lowerTrails = [];
        let digitalStars = [];
        let lastSide = null;

        const NEON_PALETTE = [0x00f2ff, 0xff00ff, 0x00ff00, 0xffee00];
        const DAY_PALETTE = [0x444444, 0x333333, 0x222222, 0x555566, 0x4a3a3a, 0x606060];

        window.onload = init;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000c24, 200, 4500);

            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(350, 350, 350);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000, 0); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Day Lights
            ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            
            sun = new THREE.DirectionalLight(0xffffff, 1.8);
            sun.position.set(200, 600, 200);
            scene.add(sun);

            // Night side fill
            nightLight = new THREE.PointLight(0x7733ff, 4.0, 3000);
            nightLight.position.set(0, -500, 0);
            scene.add(nightLight);

            upperGroup = new THREE.Group();
            lowerGroup = new THREE.Group();
            scene.add(upperGroup);
            scene.add(lowerGroup);

            buildWorld();

            window.addEventListener('resize', onResize);
            animate();
        }

        function buildWorld() {
            const rings = 8;
            const ringSpacing = 12;
            const cityEdgeRadius = (rings + 1) * ringSpacing;
            const roadRadius = cityEdgeRadius + 26;

            // 1. FLOOR DIVIDER
            const dividerRadius = roadRadius + 80;
            const baseFloor = new THREE.Mesh(
                new THREE.CircleGeometry(dividerRadius, 64),
                new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })
            );
            baseFloor.rotation.x = Math.PI / 2;
            scene.add(baseFloor);

            // 2. WHITE AVENUE RING (Day side only - between houses and road)
            const whiteRing = new THREE.Mesh(
                new THREE.RingGeometry(cityEdgeRadius + 2, roadRadius - 6, 64),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, metalness: 0 })
            );
            whiteRing.rotation.x = -Math.PI / 2;
            whiteRing.position.y = 0.2; 
            upperGroup.add(whiteRing);

            // 3. INNER BLACK RING
            const innerRing = new THREE.Mesh(
                new THREE.TorusGeometry(14, 1.2, 16, 64),
                new THREE.MeshBasicMaterial({ color: 0x000000 })
            );
            innerRing.rotation.x = Math.PI / 2;
            innerRing.position.y = 0.3;
            upperGroup.add(innerRing);

            // 4. MAIN ROADS
            const roadGeom = new THREE.TorusGeometry(roadRadius, 5.0, 16, 128);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.6 });
            
            const uRoad = new THREE.Mesh(roadGeom, roadMat);
            uRoad.rotation.x = Math.PI / 2; uRoad.position.y = 0.5;
            upperGroup.add(uRoad);
            
            const lRoad = new THREE.Mesh(roadGeom, roadMat);
            lRoad.rotation.x = Math.PI / 2; lRoad.position.y = -0.5;
            lowerGroup.add(lRoad);

            // 5. DIGITAL STARS (Glitchy Background bits)
            for (let i = 0; i < 500; i++) {
                const starSize = 1.2 + Math.random() * 2.0;
                const star = new THREE.Mesh(
                    new THREE.PlaneGeometry(starSize, starSize),
                    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 + Math.random() * 0.8 })
                );
                const phi = Math.random() * Math.PI * 2;
                const theta = (Math.random() * 0.4 + 0.6) * Math.PI; 
                const r = 3000 + Math.random() * 1000;
                star.position.set(r * Math.sin(theta) * Math.cos(phi), r * Math.cos(theta), r * Math.sin(theta) * Math.sin(phi));
                star.lookAt(0,0,0);
                star.userData = { originalOpacity: star.material.opacity, flickerSpeed: 0.1 + Math.random() * 0.3 };
                lowerGroup.add(star);
                digitalStars.push(star);
            }

            // 6. BUILDINGS (Growth towards center + Varied Shapes)
            for (let r = 2; r <= rings + 1; r++) {
                const radius = r * ringSpacing;
                const heightFactor = (rings + 2 - r) / rings; 
                const count = Math.floor(radius * 0.85);

                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const px = Math.cos(angle) * radius;
                    const pz = Math.sin(angle) * radius;

                    // --- DAY BUILDINGS (BEAUTIFULLY VARIED) ---
                    const hT = 10 + (heightFactor * 55) + (Math.random() * 15);
                    const w = 3.5 + Math.random() * 5;
                    const d = 3.5 + Math.random() * 5;
                    const color = DAY_PALETTE[Math.floor(Math.random() * DAY_PALETTE.length)];
                    
                    const dayHouse = new THREE.Group();
                    const box = new THREE.Mesh(new THREE.BoxGeometry(w, hT, d), new THREE.MeshStandardMaterial({ color, roughness: 0.9 }));
                    box.position.y = hT / 2;
                    dayHouse.add(box);

                    // Varied Architecture: Secondary blocks or side-wings
                    if (Math.random() > 0.6) {
                        const sW = w * (0.4 + Math.random() * 0.4);
                        const sH = hT * (0.3 + Math.random() * 0.5);
                        const sD = d * (0.4 + Math.random() * 0.4);
                        const sideBox = new THREE.Mesh(new THREE.BoxGeometry(sW, sH, sD), new THREE.MeshStandardMaterial({ color, roughness: 0.9 }));
                        // Place either on top or slightly protruding from a side
                        if (Math.random() > 0.5) {
                            sideBox.position.y = hT + sH/2 - 1;
                        } else {
                            sideBox.position.set((w/2) * (Math.random() > 0.5 ? 1 : -1), sH/2, 0);
                        }
                        dayHouse.add(sideBox);
                    }

                    // Window dot texture for rhythmic complexity
                    for(let j=0; j<Math.floor(hT/4); j++) {
                        const dotMat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.92 ? 0xf1c40f : 0xdddddd });
                        const dot = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.15), dotMat);
                        const side = Math.random() > 0.5 ? 1 : -1;
                        dot.position.set((Math.random()-0.5)*w*0.8, Math.random()*hT, (d/2 + 0.1)*side);
                        dayHouse.add(dot);
                    }
                    dayHouse.position.set(px, 0.1, pz);
                    dayHouse.rotation.y = -angle;
                    upperGroup.add(dayHouse);

                    // --- NIGHT HOUSES ---
                    const hB = 14 + (heightFactor * 75) + (Math.random() * 20);
                    const nHouse = new THREE.Group();
                    const bBox = new THREE.Mesh(new THREE.BoxGeometry(5.0, hB, 5.0), new THREE.MeshStandardMaterial({ color: 0x020208 }));
                    bBox.position.y = -hB / 2;
                    nHouse.add(bBox);
                    const neonCol = NEON_PALETTE[Math.floor(Math.random() * NEON_PALETTE.length)];
                    const win = new THREE.Mesh(new THREE.BoxGeometry(5.1, 1.2, 5.1), new THREE.MeshStandardMaterial({ color: neonCol, emissive: neonCol, emissiveIntensity: 10 }));
                    win.position.y = -Math.random() * hB;
                    nHouse.add(win);
                    nHouse.position.set(px, -0.1, pz);
                    nHouse.rotation.y = -angle;
                    lowerGroup.add(nHouse);
                }
            }

            // 7. CENTRAL BEAM (Radiant & Focused)
            const beamGroup = new THREE.Group();
            const redBase = new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 26, 32), new THREE.MeshBasicMaterial({ color: 0x9e0000 }));
            redBase.position.y = 13;
            beamGroup.add(redBase);
            const yellowCore = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 2000, 32), new THREE.MeshBasicMaterial({ color: 0xfff000 }));
            yellowCore.position.y = 1000;
            beamGroup.add(yellowCore);
            const yellowGlow = new THREE.Mesh(new THREE.CylinderGeometry(35, 2.5, 2000, 32), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending }));
            yellowGlow.position.y = 1000;
            beamGroup.add(yellowGlow);
            const violetCore = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 2000, 32), new THREE.MeshBasicMaterial({ color: 0x9900ff }));
            violetCore.position.y = -1000;
            beamGroup.add(violetCore);
            const violetGlow = new THREE.Mesh(new THREE.CylinderGeometry(40, 4, 2000, 32), new THREE.MeshBasicMaterial({ color: 0x6600ff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending }));
            violetGlow.position.y = -1000;
            beamGroup.add(violetGlow);
            scene.add(beamGroup);

            // 8. TRAFFIC
            const mCols = [0x9e0000, 0xf1c40f, 0x2980b9, 0xffffff];
            for (let i = 0; i < 200; i++) {
                const car = new THREE.Mesh(new THREE.BoxGeometry(5.5, 1.8, 9), new THREE.MeshBasicMaterial({ color: mCols[i % 4] }));
                const inner = Math.random() > 0.5;
                car.userData = { angle: Math.random()*6.28, speed: (0.003+Math.random()*0.005)*(inner?1:-1), radius: roadRadius+(inner?-12:12), y: 6.5 }; // High enough to stop flicker
                upperGroup.add(car);
                upperTrails.push(car);
            }
            // NIGHT NEON LINE-STREAKS
            for (let i = 0; i < 500; i++) {
                const col = NEON_PALETTE[i % NEON_PALETTE.length];
                const streak = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 0.6, 35), 
                    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending })
                );
                const inner = Math.random() > 0.5;
                streak.userData = { 
                    angle: Math.random()*6.28, 
                    speed: (0.025+Math.random()*0.045)*(inner?1:-1), 
                    radius: roadRadius+(inner?-14:14), 
                    y: -6.5,
                    pulsePhase: Math.random() * Math.PI * 2
                };
                lowerGroup.add(streak);
                lowerTrails.push(streak);
            }
        }

        function updateEnvironment() {
            const y = camera.position.y;
            const isDay = y > 0;
            if (isDay === lastSide) return;
            lastSide = isDay;

            const body = document.body;
            if (isDay) {
                body.style.background = "var(--day-grad)";
                scene.fog.color.set(0x000c24);
                ambientLight.intensity = 1.4;
                sun.intensity = 2.0;
                nightLight.intensity = 0;
                upperGroup.visible = true;
                lowerGroup.visible = false;
            } else {
                body.style.background = "var(--night-grad)";
                scene.fog.color.set(0x000000);
                ambientLight.intensity = 0.2;
                sun.intensity = 0;
                nightLight.intensity = 5.0;
                upperGroup.visible = false;
                lowerGroup.visible = true;
            }
            document.getElementById('side-indicator').innerText = isDay ? "UPPER WORLD • SKYWARD LIGHT" : "NETHER WORLD • DIGITAL PULSE";
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateEnvironment();

            const time = performance.now() * 0.001;

            // Move Upper Traffic
            upperTrails.forEach(t => {
                if(upperGroup.visible) {
                    t.userData.angle += t.userData.speed;
                    t.position.set(Math.cos(t.userData.angle) * t.userData.radius, t.userData.y, Math.sin(t.userData.angle) * t.userData.radius);
                    t.rotation.y = -t.userData.angle + (t.userData.speed > 0 ? 0 : Math.PI);
                }
            });

            // Move Lower Traffic (Streaks)
            lowerTrails.forEach(t => {
                if(lowerGroup.visible) {
                    t.userData.angle += t.userData.speed;
                    t.position.set(Math.cos(t.userData.angle) * t.userData.radius, t.userData.y, Math.sin(t.userData.angle) * t.userData.radius);
                    t.rotation.y = -t.userData.angle + (t.userData.speed > 0 ? 0 : Math.PI);
                    // Pulsating pulse
                    const pulse = Math.sin(time * 8 + t.userData.pulsePhase) * 0.4 + 0.6;
                    t.material.opacity = pulse;
                }
            });

            // Digital Stars Glitch logic
            digitalStars.forEach(s => {
                if(lowerGroup.visible) {
                    s.material.opacity = s.userData.originalOpacity * (0.4 + 0.6 * Math.sin(time * s.userData.flickerSpeed * 25));
                    if (Math.random() > 0.998) {
                        s.material.opacity = 1.0;
                        s.scale.set(1.8, 1.8, 1);
                    } else if (Math.random() > 0.998) {
                        s.scale.set(0.1, 0.1, 1);
                    } else {
                        s.scale.set(1, 1, 1);
                    }
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
