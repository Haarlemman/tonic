<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWIN CITY</title>
    <style>
        :root {
            --day-grad: linear-gradient(to bottom, #001122 0%, #4dabff 30%, #ffcc00 47%, #001122 52%, #000000 100%);
            --night-grad: linear-gradient(to bottom, #000 0%, #1a0b3c 100%);
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: var(--day-grad) 50% 50% / 200% 200%;
            transition: background 1.2s ease-in-out;
            font-family: 'Inter', sans-serif;
        }

        #stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        #stars.visible {
            opacity: 1;
        }

        .star {
            position: absolute;
        }

        /* Screen Overlay for Lens Flare / Light Bloom */
        #light-bloom {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            background: radial-gradient(circle at center, rgba(200,150,30,0.4) 0%, rgba(150,100,10,0.3) 40%, transparent 70%);
            mix-blend-mode: screen;
            transition: opacity 0.5s ease;
        }

        @keyframes blink {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        #canvas-container { 
            width: 100%; 
            height: 100%; 
            display: block; 
            background: transparent;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        #hud {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }

        h1 { 
            font-size: 1.2rem; 
            font-weight: 900; 
            letter-spacing: 14px; 
            text-transform: uppercase; 
            margin: 0;
            border-left: 6px solid #f1c40f;
            padding-left: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 9px;
            letter-spacing: 6px;
            color: rgba(255,255,255,0.9);
            margin-top: 8px;
            padding-left: 26px;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="stars"></div>
    <div id="light-bloom"></div>
    
    <div id="hud">
        <h1>Twin City</h1>
        <div class="subtitle" id="side-indicator">ART • SCIENCE • SPIRIT</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let ambientLight, sun, nightLight;
        let upperGroup, lowerGroup, beamGroup;
        let upperTrails = [], lowerTrails = [];
        let lastSide = null;
        let mouseX = 0, mouseY = 0;

        const NEON_PALETTE = [0x00ffff, 0xff00ff, 0x00ff00, 0xffff00];

        window.onload = init;

        function init() {
            const starsContainer = document.getElementById('stars');
            if (starsContainer) {
                for (let i = 0; i < 200; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    const size = (1 + Math.random() * 2) + 'px';
                    star.style.width = size;
                    star.style.height = size;
                    star.style.backgroundColor = Math.random() < 0.5 ? '#9933ff' : '#00ffff';
                    star.style.animation = 'blink ' + (1 + Math.random() * 2) + 's infinite ease-in-out';
                    starsContainer.appendChild(star);
                }
            }
            
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x4dabff, 100, 3500);

            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(400, 400, 400);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000, 0); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambientLight);
            
            sun = new THREE.DirectionalLight(0xffffff, 1.6);
            sun.position.set(100, 500, 100);
            scene.add(sun);

            nightLight = new THREE.PointLight(0x6633ff, 4.5, 2500);
            nightLight.position.set(0, -300, 0);
            scene.add(nightLight);

            upperGroup = new THREE.Group();
            lowerGroup = new THREE.Group();
            scene.add(upperGroup);
            scene.add(lowerGroup);

            buildWorld();

            window.addEventListener('resize', onResize);
            animate();
        }

        function buildWorld() {
            const rings = 6;
            const ringSpacing = 12;
            const cityEdgeRadius = (rings + 1) * ringSpacing;
            const roadRadius = cityEdgeRadius + 22;
            const dividerRadius = roadRadius + 40;

            const baseFloor = new THREE.Mesh(
                new THREE.CircleGeometry(dividerRadius, 64),
                new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })
            );
            baseFloor.rotation.x = Math.PI / 2;
            scene.add(baseFloor);

            const whiteRing = new THREE.Mesh(
                new THREE.RingGeometry(cityEdgeRadius + 2, roadRadius - 6, 64),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, metalness: 0 })
            );
            whiteRing.rotation.x = -Math.PI / 2;
            whiteRing.position.y = 0.12;
            upperGroup.add(whiteRing);

            const roadGeom = new THREE.TorusGeometry(roadRadius, 4.5, 16, 128);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
            
            const uRoad = new THREE.Mesh(roadGeom, roadMat);
            uRoad.rotation.x = Math.PI / 2; 
            uRoad.position.y = 0.35;
            upperGroup.add(uRoad);
            
            const lRoad = new THREE.Mesh(roadGeom, roadMat);
            lRoad.rotation.x = Math.PI / 2; 
            lRoad.position.y = -0.35;
            lowerGroup.add(lRoad);

            const dayBuildingColors = [
                0x1a3a52, 0x2c4a5e, 0x1e384a, 0x263d50, 0x1f3544, 0x243848, 0x2a4458, 0x1c3240,
                0x4a3a2a, 0x3e2e1e, 0x3a2818, 0x2e1f12, 0x4d3d2d, 0x5a4a3a, 0x362614, 0x4b3b2b
            ];

            for (let r = 2; r <= rings + 1; r++) {
                const radius = r * ringSpacing;
                const count = Math.floor(radius * 0.9);
                const heightMultiplier = (rings + 2 - r) / rings;
                
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const px = Math.cos(angle) * radius;
                    const pz = Math.sin(angle) * radius;

                    const baseHeight = 8 + Math.random() * 15;
                    const hT = baseHeight * (0.5 + heightMultiplier * 2);
                    const w = 3.5 + Math.random() * 2;
                    const d = 3.5 + Math.random() * 2;
                    const dayHouse = new THREE.Group();
                    const buildingColor = dayBuildingColors[Math.floor(Math.random() * dayBuildingColors.length)];
                    const box = new THREE.Mesh(new THREE.BoxGeometry(w, hT, d), new THREE.MeshStandardMaterial({ color: buildingColor, roughness: 0.9 }));
                    box.position.y = hT / 2;
                    dayHouse.add(box);
                    
                    for(let j=0; j<Math.floor(hT/4); j++) {
                        const winCol = Math.random() > 0.7 ? 0xffd700 : 0xd4a520;
                        const dot = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.12), new THREE.MeshBasicMaterial({ color: winCol }));
                        const side = Math.random() > 0.5 ? 1 : -1;
                        dot.position.set((Math.random()-0.5)*w*0.8, Math.random()*hT, (d/2 + 0.08)*side);
                        dayHouse.add(dot);
                    }
                    dayHouse.position.set(px, 0.05, pz);
                    dayHouse.rotation.y = -angle;
                    upperGroup.add(dayHouse);

                    const nightHeightMultiplier = (rings + 2 - r) / rings * 2.5; // Make inner rings taller
                    const hB = (10 + Math.random() * 45) * nightHeightMultiplier;
                    const nHouse = new THREE.Group();
                    const bBox = new THREE.Mesh(new THREE.BoxGeometry(4.5, hB, 4.5), new THREE.MeshStandardMaterial({ color: 0x010105 }));
                    bBox.position.y = -hB / 2;
                    nHouse.add(bBox);
                    
                    const neonCol = NEON_PALETTE[Math.floor(Math.random() * NEON_PALETTE.length)];
                    const win = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.7, 4.6), new THREE.MeshStandardMaterial({ color: neonCol, emissive: neonCol, emissiveIntensity: 12 }));
                    win.position.y = -Math.random() * hB;
                    nHouse.add(win);
                    
                    nHouse.position.set(px, -0.05, pz);
                    nHouse.rotation.y = -angle;
                    lowerGroup.add(nHouse);
                }
            }

            // Central Paradox Beam - Dual Color Architecture
            beamGroup = new THREE.Group();
            
            // DAY (UPPER) BEAM: Golden Yellow Core + Glow
            const upCore = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1000, 32), new THREE.MeshBasicMaterial({ 
                color: 0xffcc00, 
                transparent: true, 
                opacity: 0.9 
            }));
            upCore.position.y = 500;
            beamGroup.add(upCore);

            const upGlow = new THREE.Mesh(new THREE.CylinderGeometry(40, 5, 1000, 32, 1, true), new THREE.MeshBasicMaterial({ 
                color: 0xffcc33, 
                transparent: true, 
                opacity: 0.3, // Increased opacity for more glow
                blending: THREE.AdditiveBlending, 
                side: THREE.DoubleSide 
            }));
            upGlow.position.y = 500;
            beamGroup.add(upGlow);

            // Additional outer glow layer for more neon effect
            const upOuterGlow = new THREE.Mesh(new THREE.CylinderGeometry(60, 10, 1000, 32, 1, true), new THREE.MeshBasicMaterial({ 
                color: 0xffcc33, 
                transparent: true, 
                opacity: 0.15, 
                blending: THREE.AdditiveBlending, 
                side: THREE.DoubleSide 
            }));
            upOuterGlow.position.y = 500;
            beamGroup.add(upOuterGlow);

            // NIGHT (LOWER) BEAM: Thin Neon Purple Core + Glow
            const downCorePurple = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 1000, 32), new THREE.MeshBasicMaterial({ 
                color: 0x9900ff, 
                transparent: true, 
                opacity: 0.7 
            }));
            downCorePurple.position.y = -500;
            beamGroup.add(downCorePurple);

            const downGlow = new THREE.Mesh(new THREE.CylinderGeometry(20, 3, 1000, 32, 1, true), new THREE.MeshBasicMaterial({ 
                color: 0x4400ff, 
                transparent: true, 
                opacity: 0.35, // Increased opacity for more glow
                blending: THREE.AdditiveBlending, 
                side: THREE.DoubleSide 
            }));
            downGlow.position.y = -500;
            beamGroup.add(downGlow);

            // Additional outer glow layer for more neon effect
            const downOuterGlow = new THREE.Mesh(new THREE.CylinderGeometry(40, 6, 1000, 32, 1, true), new THREE.MeshBasicMaterial({ 
                color: 0x4400ff, 
                transparent: true, 
                opacity: 0.2, 
                blending: THREE.AdditiveBlending, 
                side: THREE.DoubleSide 
            }));
            downOuterGlow.position.y = -500;
            beamGroup.add(downOuterGlow);
            
            scene.add(beamGroup);

            // Add visual sun
            const sunGeometry = new THREE.SphereGeometry(30, 32, 32);
            const sunMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffff00, 
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
            sunMesh.position.set(200, 600, 200); // Positioned high and offset
            upperGroup.add(sunMesh);

            // Add sun glow
            const sunGlowGeometry = new THREE.SphereGeometry(50, 32, 32);
            const sunGlowMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffaa00, 
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });
            const sunGlow = new THREE.Mesh(sunGlowGeometry, sunGlowMaterial);
            sunGlow.position.copy(sunMesh.position);
            upperGroup.add(sunGlow);

            // Vehicles with Randomized Speeds
            const mCols = [0xdc143c, 0xffd700, 0x0047ab];
            for (let lane = 0; lane < 2; lane++) {
                const laneRadius = roadRadius + (lane === 0 ? -10 : 10);
                for (let i = 0; i < 40; i++) {
                    const car = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 7), new THREE.MeshBasicMaterial({ color: mCols[i % mCols.length] }));
                    const speed = 0.004 + Math.random() * 0.012;
                    car.userData = { angle: (i / 40) * Math.PI * 2, speed: speed, radius: laneRadius, y: 3.5 };
                    upperGroup.add(car);
                    upperTrails.push(car);
                }
            }

            for (let lane = 0; lane < 2; lane++) {
                const inner = lane === 0;
                const laneRadius = roadRadius + (inner ? -12 : 12);
                for (let i = 0; i < 12; i++) {
                    const trailGroup = new THREE.Group();
                    const col = NEON_PALETTE[i % NEON_PALETTE.length];
                    const trailSegments = 35;
                    const trailArcLength = 0.35;
                    
                    for (let seg = 0; seg < trailSegments; seg++) {
                        const segmentProgress = seg / trailSegments;
                        const segmentAngle = -segmentProgress * trailArcLength * (inner ? 1 : -1);
                        const trail = new THREE.Mesh(new THREE.BoxGeometry(2.0 - segmentProgress, 0.5, 1.2), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 1 - segmentProgress * 0.9, blending: THREE.AdditiveBlending }));
                        const x = Math.cos(segmentAngle) * laneRadius;
                        const z = Math.sin(segmentAngle) * laneRadius;
                        trail.position.set(x, 0, z);
                        trail.rotation.y = -segmentAngle + Math.PI / 2;
                        trailGroup.add(trail);
                    }
                    const speed = (0.025 + Math.random() * 0.045) * (inner ? 1 : -1);
                    trailGroup.userData = { angle: (i / 12) * Math.PI * 2, speed: speed, radius: laneRadius, y: -3.5 };
                    lowerGroup.add(trailGroup);
                    lowerTrails.push(trailGroup);
                }
            }
        }

        function updateEnvironment() {
            const y = camera.position.y;
            const isDay = y > 0;
            
            // Screen Bloom Color Coordination
            const camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);
            const dot = Math.abs(camDir.dot(new THREE.Vector3(0, 1, 0)));
            const distToCenter = new THREE.Vector3(camera.position.x, 0, camera.position.z).length();
            const bloomEl = document.getElementById('light-bloom');
            
            if (distToCenter < 160) {
                const intensity = Math.pow(dot, 5) * 2.2;
                bloomEl.style.opacity = Math.min(intensity, 0.9);
                const color = isDay ? "rgba(255,200,50,0.5)" : "rgba(140,50,255,0.4)";
                bloomEl.style.background = `radial-gradient(circle at center, ${color} 0%, transparent 80%)`;
            } else {
                bloomEl.style.opacity = 0;
            }

            if (isDay === lastSide) return;
            lastSide = isDay;

            const body = document.body;
            const starsContainer = document.getElementById('stars');
            if (isDay) {
                body.style.backgroundImage = "var(--day-grad)";
                starsContainer.classList.remove('visible');
                scene.fog.color.set(0x4dabff);
                ambientLight.intensity = 1.4;
                sun.intensity = 2.0;
                nightLight.intensity = 0;
                upperGroup.visible = true;
                lowerGroup.visible = false;
            } else {
                body.style.backgroundImage = "var(--night-grad)";
                starsContainer.classList.add('visible');
                scene.fog.color.set(0x1a0b3c);
                ambientLight.intensity = 0.2;
                sun.intensity = 0;
                nightLight.intensity = 6.0;
                upperGroup.visible = false;
                lowerGroup.visible = true;
            }
            document.getElementById('side-indicator').innerText = isDay ? "UPPER WORLD • VIRTUE" : "NETHER WORLD • VICE";
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateEnvironment();

            // Parallax
            const azimuthal = controls.getAzimuthalAngle();
            const polar = controls.getPolarAngle();
            mouseX = azimuthal / Math.PI;
            mouseY = (polar / Math.PI) * 2 - 1;

            const body = document.body;
            const parallaxStrength = 15; // Adjust for desired effect
            body.style.backgroundPosition = `${50 + mouseX * parallaxStrength}% ${50 + mouseY * parallaxStrength}%`;

            const starsContainer = document.getElementById('stars');
            if (starsContainer.classList.contains('visible')) {
                const stars = Array.from(starsContainer.children);
                stars.forEach(star => {
                    const depth = (parseFloat(star.style.width) - 1) / 2 * 10 + 5;
                    star.style.transform = `translate(${mouseX * depth * 10}px, ${mouseY * depth * 10}px)`;
                });
            }

            // Beam Shimmer
            if (beamGroup) {
                beamGroup.children.forEach((child, i) => {
                    if (child.geometry.type === 'CylinderGeometry' && child.material.transparent) {
                        child.rotation.y += 0.005 * (i % 2 === 0 ? 1 : -1);
                        child.scale.x = 1 + Math.sin(Date.now() * 0.002 + i) * 0.08;
                        child.scale.z = 1 + Math.sin(Date.now() * 0.002 + i) * 0.08;
                    }
                });
            }

            const move = (trails) => {
                trails.forEach(t => {
                    if(t.parent.visible) {
                        t.userData.angle += t.userData.speed;
                        t.position.y = t.userData.y;
                        t.rotation.y = -t.userData.angle;
                        if (t.children.length <= 1) { // Simple cars
                            t.position.x = Math.cos(t.userData.angle) * t.userData.radius;
                            t.position.z = Math.sin(t.userData.angle) * t.userData.radius;
                            t.rotation.y = -t.userData.angle + (t.userData.speed > 0 ? 0 : Math.PI);
                        }
                    }
                });
            };

            move(upperTrails);
            move(lowerTrails);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
