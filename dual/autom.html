<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWIN CITY | AUTOMATED</title>
    <style>
        :root {
            --day-grad: linear-gradient(to bottom,
                    rgba(0, 17, 34, 0) 0%,
                    rgba(0, 150, 255, 0.95) 25%,
                    rgba(30, 100, 240, 0.98) 47%,
                    rgba(0, 20, 180, 0.9) 65%,
                    rgba(0, 10, 100, 0.7) 85%,
                    rgba(0, 33, 100, 0) 100%);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101223;
            font-family: 'Inter', sans-serif;
        }

        #day-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: var(--day-grad);
            background-size: 200% 200%;
            background-position: 50% 50%;
            transition: opacity 0.6s ease-in-out, transform 0.3s ease-out;
            transform-origin: center center;
        }

        #day-bg.hidden { opacity: 0; }

        #stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.6s ease-in-out, transform 0.3s ease-out;
            transform-origin: center center;
        }

        #stars.visible { opacity: 1; }

        .star {
            position: absolute;
            transition: transform 0.3s ease-out;
            border-radius: 50%;
        }

        #hud {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }

        #hud.day-mode { color: #ffffff; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); }
        #hud.night-mode { color: #e0b0ff; text-shadow: 0 0 10px #bf00ff; }

        h1 {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 14px;
            text-transform: uppercase;
            margin: 0;
            border-left: 6px solid #f1c40f;
            padding-left: 20px;
        }

        .subtitle {
            font-size: 10px;
            letter-spacing: 4px;
            margin-top: 8px;
            padding-left: 26px;
            font-weight: 700;
            text-transform: uppercase;
        }

        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 2; }
    </style>
</head>

<body>
    <div id="day-bg"></div>
    <div id="stars"></div>
    <div id="hud">
        <h1>Twin City</h1>
        <div class="subtitle" id="side-indicator">ART • SCIENCE • SPIRIT</div>
    </div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- PASTE YOUR DATA HERE ---
        // Click "Copy Path Data" in the recorder and paste between the brackets below.
        const ANIMATION_DATA = []; 

        let scene, camera, renderer, upperGroup, lowerGroup, lastSide, upperTrails = [];
        let playbackIndex = 0;

        window.onload = () => {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x4dabff, 100, 3500);
            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 10000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Rebuild the world (Logic matches exactly)
            const ambient = new THREE.AmbientLight(0xffeeaa, 1.3); scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffeedd, 1.6); sun.position.set(100,500,100); scene.add(sun);
            const night = new THREE.PointLight(0x6633ff, 4.5, 2500); night.position.set(0,-300,0); scene.add(night);

            upperGroup = new THREE.Group(); lowerGroup = new THREE.Group();
            scene.add(upperGroup); scene.add(lowerGroup);
            
            // Build simple version of the city geometry
            const rings = 6, ringSpacing = 12, roadRadius = (rings + 1) * ringSpacing + 22;
            for (let r = 2; r <= rings + 1; r++) {
                const radius = r * ringSpacing, count = Math.floor(radius * 0.9);
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2, px = Math.cos(angle) * radius, pz = Math.sin(angle) * radius;
                    const hT = (8 + Math.random() * 25);
                    const upBox = new THREE.Mesh(new THREE.BoxGeometry(4, hT, 4), new THREE.MeshStandardMaterial({ color: 0x1a3a52 }));
                    upBox.position.set(px, hT/2, pz); upperGroup.add(upBox);
                    const hB = (15 + Math.random() * 50);
                    const loBox = new THREE.Mesh(new THREE.BoxGeometry(4.5, hB, 4.5), new THREE.MeshStandardMaterial({ color: 0x010105 }));
                    loBox.position.set(px, -hB/2, pz); lowerGroup.add(loBox);
                }
            }

            animate();
        };

        function animate() {
            requestAnimationFrame(animate);

            if (ANIMATION_DATA.length > 0) {
                const d = ANIMATION_DATA[playbackIndex];
                camera.position.set(d.p[0], d.p[1], d.p[2]);
                camera.lookAt(d.t[0], d.t[1], d.t[2]);
                playbackIndex = (playbackIndex + 1) % ANIMATION_DATA.length;
            }

            const y = camera.position.y, isDay = y > 0;
            if (isDay !== lastSide) {
                lastSide = isDay; document.getElementById('day-bg').className = isDay ? '' : 'hidden';
                document.getElementById('hud').className = isDay ? 'day-mode' : 'night-mode';
                document.getElementById('side-indicator').innerText = isDay ? "UPPER WORLD" : "NETHER WORLD";
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
