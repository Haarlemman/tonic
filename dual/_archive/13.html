<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWIN CITY | The Circular Paradox</title>
  <style>
    :root{
      --day-grad: linear-gradient(to top, #000c24 0%, #001a4d 25%, #4dabff 100%);
      --night-grad: linear-gradient(to bottom, #000000 0%, #050010 20%, #1e0f3c 100%);
    }
    html, body{
      margin:0; padding:0; width:100%; height:100%;
      overflow:hidden;
      background: var(--day-grad);
      transition: background 1.5s ease-in-out;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #canvas-container{ position:fixed; inset:0; }
    canvas{ display:block; }

    #hud{
      position:fixed;
      top:24px; left:24px;
      color:#fff;
      z-index:10;
      pointer-events:none;
      user-select:none;
      text-shadow: 0 4px 15px rgba(0,0,0,.6);
    }
    h1{
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 12px;
      text-transform: uppercase;
      margin: 0;
      border-left: 6px solid #f1c40f;
      padding-left: 16px;
    }
    .subtitle{
      font-size: 9px;
      letter-spacing: 5px;
      margin-top: 8px;
      padding-left: 22px;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(255,255,255,.92);
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Twin City</h1>
    <div class="subtitle" id="side-indicator">Circular • Paradox • Rhythm</div>
  </div>

  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let ambientLight, sun, nightLight;
    let upperGroup, lowerGroup;
    let upperCars = [];
    let tronArcs = [];
    let starsPoints = null;
    let lastSide = null;

    const NEON_PALETTE = [0x00f2ff, 0xff00ff, 0x00ff00, 0xffee00];
    const DAY_PALETTE  = [0x444444, 0x333333, 0x222222, 0x555566, 0x4a3a3a, 0x606060];

    window.addEventListener("load", init);

    function init(){
      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x000c24, 200, 4500);

      camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 10000);
      camera.position.set(350, 350, 350);

      renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);
      document.getElementById("canvas-container").appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      sun = new THREE.DirectionalLight(0xffffff, 1.8);
      sun.position.set(200, 600, 200);
      scene.add(sun);

      nightLight = new THREE.PointLight(0x7733ff, 4.0, 3000);
      nightLight.position.set(0, -500, 0);
      scene.add(nightLight);

      upperGroup = new THREE.Group();
      lowerGroup = new THREE.Group();
      scene.add(upperGroup);
      scene.add(lowerGroup);

      buildWorld();

      window.addEventListener("resize", onResize);
      animate();
    }

    function buildWorld(){
      const rings = 8;
      const ringSpacing = 12;
      const cityEdgeRadius = (rings + 1) * ringSpacing;
      const roadRadius = cityEdgeRadius + 26;

      // 1) floor divider
      const dividerRadius = roadRadius + 80;
      const baseFloor = new THREE.Mesh(
        new THREE.CircleGeometry(dividerRadius, 64),
        new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })
      );
      baseFloor.rotation.x = Math.PI / 2;
      scene.add(baseFloor);

      // 2) day white avenue ring
      const whiteRing = new THREE.Mesh(
        new THREE.RingGeometry(cityEdgeRadius + 2, roadRadius - 6, 64),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, metalness: 0 })
      );
      whiteRing.rotation.x = -Math.PI / 2;
      whiteRing.position.y = 0.2;
      upperGroup.add(whiteRing);

      // 3) inner ring
      const innerRing = new THREE.Mesh(
        new THREE.TorusGeometry(14, 1.2, 16, 64),
        new THREE.MeshBasicMaterial({ color: 0x000000 })
      );
      innerRing.rotation.x = Math.PI / 2;
      innerRing.position.y = 0.3;
      upperGroup.add(innerRing);

      // 4) roads (polygon offset to avoid z-fight)
      const roadGeom = new THREE.TorusGeometry(roadRadius, 5.0, 16, 128);
      const roadMat = new THREE.MeshStandardMaterial({
        color: 0x080808,
        roughness: 0.6,
        polygonOffset: true,
        polygonOffsetFactor: 1,
        polygonOffsetUnits: 1
      });

      const uRoad = new THREE.Mesh(roadGeom, roadMat);
      uRoad.rotation.x = Math.PI / 2;
      uRoad.position.y = 0.5;
      upperGroup.add(uRoad);

      const lRoad = new THREE.Mesh(roadGeom, roadMat);
      lRoad.rotation.x = Math.PI / 2;
      lRoad.position.y = -0.5;
      lowerGroup.add(lRoad);

      // 5) STARS (Points) — visible, not glitchy
      starsPoints = makeStarsPoints(2200, 5000); // (count, radius)
      // Keep stars on night side only, but NOT fogged
      starsPoints.material.fog = false;
      starsPoints.renderOrder = 1;
      lowerGroup.add(starsPoints);

      // 6) buildings (same as your original vibe)
      for (let r = 2; r <= rings + 1; r++){
        const radius = r * ringSpacing;
        const heightFactor = (rings + 2 - r) / rings;
        const count = Math.floor(radius * 0.85);

        for (let i = 0; i < count; i++){
          const angle = (i / count) * Math.PI * 2;
          const px = Math.cos(angle) * radius;
          const pz = Math.sin(angle) * radius;

          // day buildings
          const hT = 10 + (heightFactor * 55) + (Math.random() * 15);
          const w = 3.5 + Math.random() * 5;
          const d = 3.5 + Math.random() * 5;
          const color = DAY_PALETTE[Math.floor(Math.random() * DAY_PALETTE.length)];

          const dayHouse = new THREE.Group();
          const box = new THREE.Mesh(
            new THREE.BoxGeometry(w, hT, d),
            new THREE.MeshStandardMaterial({ color, roughness: 0.9 })
          );
          box.position.y = hT / 2;
          dayHouse.add(box);

          if (Math.random() > 0.6){
            const sW = w * (0.4 + Math.random() * 0.4);
            const sH = hT * (0.3 + Math.random() * 0.5);
            const sD = d * (0.4 + Math.random() * 0.4);
            const sideBox = new THREE.Mesh(
              new THREE.BoxGeometry(sW, sH, sD),
              new THREE.MeshStandardMaterial({ color, roughness: 0.9 })
            );
            if (Math.random() > 0.5) sideBox.position.y = hT + sH/2 - 1;
            else sideBox.position.set((w/2) * (Math.random() > 0.5 ? 1 : -1), sH/2, 0);
            dayHouse.add(sideBox);
          }

          for (let j=0; j<Math.floor(hT/4); j++){
            const dotMat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.92 ? 0xf1c40f : 0xdddddd });
            const dot = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.15), dotMat);
            const side = Math.random() > 0.5 ? 1 : -1;
            dot.position.set((Math.random()-0.5)*w*0.8, Math.random()*hT, (d/2 + 0.1)*side);
            dayHouse.add(dot);
          }

          dayHouse.position.set(px, 0.1, pz);
          dayHouse.rotation.y = -angle;
          upperGroup.add(dayHouse);

          // night buildings
          const hB = 14 + (heightFactor * 75) + (Math.random() * 20);
          const nHouse = new THREE.Group();
          const bBox = new THREE.Mesh(
            new THREE.BoxGeometry(5.0, hB, 5.0),
            new THREE.MeshStandardMaterial({ color: 0x020208 })
          );
          bBox.position.y = -hB / 2;
          nHouse.add(bBox);

          const neonCol = NEON_PALETTE[Math.floor(Math.random() * NEON_PALETTE.length)];
          const win = new THREE.Mesh(
            new THREE.BoxGeometry(5.1, 1.2, 5.1),
            new THREE.MeshStandardMaterial({ color: neonCol, emissive: neonCol, emissiveIntensity: 10 })
          );
          win.position.y = -Math.random() * hB;
          nHouse.add(win);

          nHouse.position.set(px, -0.1, pz);
          nHouse.rotation.y = -angle;
          lowerGroup.add(nHouse);
        }
      }

      // 7) central beam (keep your vibe)
      const beamGroup = new THREE.Group();
      const redBase = new THREE.Mesh(
        new THREE.CylinderGeometry(7, 7, 26, 32),
        new THREE.MeshBasicMaterial({ color: 0x9e0000 })
      );
      redBase.position.y = 13;
      beamGroup.add(redBase);

      const violetCore = new THREE.Mesh(
        new THREE.CylinderGeometry(4, 4, 2000, 32),
        new THREE.MeshBasicMaterial({ color: 0x9900ff })
      );
      violetCore.position.y = -1000;
      beamGroup.add(violetCore);

      const violetGlow = new THREE.Mesh(
        new THREE.CylinderGeometry(45, 4, 2000, 32),
        new THREE.MeshBasicMaterial({
          color: 0x6600ff,
          transparent: true,
          opacity: 0.22,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      violetGlow.position.y = -1000;
      beamGroup.add(violetGlow);

      scene.add(beamGroup);

      // 8) day cars (solid)
      const mCols = [0x9e0000, 0xf1c40f, 0x2980b9, 0xffffff];
      for (let i=0; i<180; i++){
        const car = new THREE.Mesh(
          new THREE.BoxGeometry(5.5, 1.8, 9),
          new THREE.MeshBasicMaterial({ color: mCols[i % 4] })
        );
        const inner = Math.random() > 0.5;
        car.userData = {
          angle: Math.random() * Math.PI * 2,
          speed: (0.003 + Math.random()*0.005) * (inner ? 1 : -1),
          radius: roadRadius + (inner ? -12 : 12),
          y: 10.0
        };
        upperGroup.add(car);
        upperCars.push(car);
      }

      // 9) TRON NIGHT "CARS" — arc segments like your screenshot
      // Two-layer neon: core + larger glow
      const tronCount = 72;
      for (let i=0; i<tronCount; i++){
        const col = NEON_PALETTE[i % NEON_PALETTE.length];

        const arcLen = 0.25 + Math.random()*0.55; // segment length (radians)
        const tubeCore = 0.75;                    // thickness
        const tubeGlow = 2.2;                     // glow thickness
        const radius = roadRadius + (Math.random() > 0.5 ? 14 : -14);

        const seg = new THREE.Group();

        const core = new THREE.Mesh(
          new THREE.TorusGeometry(radius, tubeCore, 10, 48, arcLen),
          new THREE.MeshBasicMaterial({
            color: col,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: false
          })
        );

        const glow = new THREE.Mesh(
          new THREE.TorusGeometry(radius, tubeGlow, 10, 48, arcLen),
          new THREE.MeshBasicMaterial({
            color: col,
            transparent: true,
            opacity: 0.18,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: false
          })
        );

        seg.add(glow);
        seg.add(core);

        // Make it sit above the road plane (no z-fight)
        seg.rotation.x = Math.PI / 2;
        seg.position.y = -14.0;

        // Movement: rotate around Y by changing seg.rotation.y in animate
        seg.userData = {
          baseAngle: Math.random() * Math.PI * 2,
          speed: (0.012 + Math.random()*0.02) * (Math.random() > 0.5 ? 1 : -1),
          wobble: Math.random() * Math.PI * 2
        };

        seg.renderOrder = 50;
        lowerGroup.add(seg);
        tronArcs.push(seg);
      }
    }

    function makeStarsPoints(count, radius){
      const positions = new Float32Array(count * 3);

      for (let i=0; i<count; i++){
        // random points on a sphere shell
        const u = Math.random();
        const v = Math.random();
        const theta = 2 * Math.PI * u;
        const phi = Math.acos(2 * v - 1);

        const r = radius + Math.random() * 1200;

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.cos(phi);
        const z = r * Math.sin(phi) * Math.sin(theta);

        positions[i*3+0] = x;
        positions[i*3+1] = y;
        positions[i*3+2] = z;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));

      const mat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 3.0,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.9,
        depthWrite: false,
        depthTest: false
      });

      const pts = new THREE.Points(geo, mat);
      return pts;
    }

    function updateEnvironment(){
      const isDay = camera.position.y > 0;
      if (isDay === lastSide) return;
      lastSide = isDay;

      if (isDay){
        document.body.style.background = "var(--day-grad)";
        scene.fog.color.set(0x000c24);
        ambientLight.intensity = 1.4;
        sun.intensity = 2.0;
        nightLight.intensity = 0;

        upperGroup.visible = true;
        lowerGroup.visible = false;
      } else {
        document.body.style.background = "var(--night-grad)";
        scene.fog.color.set(0x000000);
        ambientLight.intensity = 0.18;
        sun.intensity = 0;
        nightLight.intensity = 5.0;

        upperGroup.visible = false;
        lowerGroup.visible = true;
      }

      document.getElementById("side-indicator").innerText =
        isDay ? "UPPER WORLD • SKYWARD LIGHT" : "NETHER WORLD • TRON PULSE";
    }

    function onResize(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(){
      requestAnimationFrame(animate);
      controls.update();
      updateEnvironment();

      // day cars
      if (upperGroup.visible){
        for (const c of upperCars){
          c.userData.angle += c.userData.speed;
          c.position.set(
            Math.cos(c.userData.angle) * c.userData.radius,
            c.userData.y,
            Math.sin(c.userData.angle) * c.userData.radius
          );
          c.rotation.y = -c.userData.angle + (c.userData.speed > 0 ? 0 : Math.PI);
        }
      }

      // tron arcs (night)
      if (lowerGroup.visible){
        const t = performance.now() * 0.001;
        for (const seg of tronArcs){
          seg.userData.baseAngle += seg.userData.speed;
          // rotate around vertical axis (y) while lying flat (x = pi/2)
          seg.rotation.y = seg.userData.baseAngle;

          // tiny breathing motion (not flicker)
          seg.position.y = -14.0 + Math.sin(t * 1.2 + seg.userData.wobble) * 0.25;
        }

        // subtle star twinkle (no popping / glitch)
        if (starsPoints){
          starsPoints.material.opacity = 0.75 + 0.25 * Math.sin(t * 0.6);
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
