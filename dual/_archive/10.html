<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWIN CITY | The Circular Paradox</title>
    <style>
        :root {
            /* More pronounced Day Gradient: Deep Navy to Punchy Sky Blue */
            --day-grad: linear-gradient(to bottom, #001a4d 0%, #4dabff 100%);
            /* More pronounced Night Gradient: Black to Deep Electric Indigo */
            --night-grad: linear-gradient(to bottom, #000000 0%, #1a0b3c 100%);
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: var(--day-grad);
            transition: background 1.2s ease-in-out;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container { 
            width: 100%; 
            height: 100%; 
            display: block; 
            background: transparent;
        }

        #hud {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }

        h1 { 
            font-size: 1.2rem; 
            font-weight: 900; 
            letter-spacing: 14px; 
            text-transform: uppercase; 
            margin: 0;
            border-left: 6px solid #f1c40f;
            padding-left: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 9px;
            letter-spacing: 6px;
            color: rgba(255,255,255,0.9);
            margin-top: 8px;
            padding-left: 26px;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1>Twin City</h1>
        <div class="subtitle" id="side-indicator">Circular • Paradox • Rhythm</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let ambientLight, sun, nightLight;
        let upperGroup, lowerGroup;
        let upperTrails = [], lowerTrails = [];
        let lastSide = null;

        const NEON_PALETTE = [0x00f2ff, 0xff00ff, 0x00ff00, 0xffee00];

        window.onload = init;

        function init() {
            scene = new THREE.Scene();
            
            scene.fog = new THREE.Fog(0x4dabff, 100, 3500);

            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(280, 280, 280);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000, 0); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights
            ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambientLight);
            
            sun = new THREE.DirectionalLight(0xffffff, 1.6);
            sun.position.set(100, 500, 100);
            scene.add(sun);

            nightLight = new THREE.PointLight(0x6633ff, 2.5, 2500);
            nightLight.position.set(0, -300, 0);
            scene.add(nightLight);

            upperGroup = new THREE.Group();
            lowerGroup = new THREE.Group();
            scene.add(upperGroup);
            scene.add(lowerGroup);

            buildWorld();

            window.addEventListener('resize', onResize);
            animate();
        }

        function buildWorld() {
            const rings = 6;
            const ringSpacing = 12;
            const cityEdgeRadius = (rings + 1) * ringSpacing;
            const roadRadius = cityEdgeRadius + 22;

            // 1. FLOOR DIVIDER (Solid Black Core)
            const dividerRadius = roadRadius + 40;
            const baseFloor = new THREE.Mesh(
                new THREE.CircleGeometry(dividerRadius, 64),
                new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })
            );
            baseFloor.rotation.x = Math.PI / 2;
            scene.add(baseFloor);

            // 2. WHITE AVENUE RING (Day side only)
            const whiteRing = new THREE.Mesh(
                new THREE.RingGeometry(cityEdgeRadius + 2, roadRadius - 6, 64),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, metalness: 0 })
            );
            whiteRing.rotation.x = -Math.PI / 2;
            whiteRing.position.y = 0.12;
            upperGroup.add(whiteRing);

            // 3. INNER BLACK RING (Center buffer)
            const innerRing = new THREE.Mesh(
                new THREE.TorusGeometry(12, 0.8, 16, 64),
                new THREE.MeshBasicMaterial({ color: 0x000000 })
            );
            innerRing.rotation.x = Math.PI / 2;
            innerRing.position.y = 0.18;
            upperGroup.add(innerRing);

            // 4. MAIN ROADS (Structural rings with neon details for night)
            const roadGeom = new THREE.TorusGeometry(roadRadius, 4.5, 16, 128);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
            
            const uRoad = new THREE.Mesh(roadGeom, roadMat);
            uRoad.rotation.x = Math.PI / 2; uRoad.position.y = 0.35;
            upperGroup.add(uRoad);
            
            const lRoad = new THREE.Mesh(roadGeom, roadMat);
            lRoad.rotation.x = Math.PI / 2; lRoad.position.y = -0.35;
            lowerGroup.add(lRoad);

            // Neon road glow strips (Night side)
            for (let i = 0; i < 3; i++) {
                const neonLane = new THREE.Mesh(
                    new THREE.TorusGeometry(roadRadius + (i-1)*2, 0.1, 8, 128),
                    new THREE.MeshStandardMaterial({ color: NEON_PALETTE[i], emissive: NEON_PALETTE[i], emissiveIntensity: 2 })
                );
                neonLane.rotation.x = Math.PI / 2;
                neonLane.position.y = -0.45;
                lowerGroup.add(neonLane);
            }

            // 5. BUILDINGS
            const topMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.85 });
            const dotMat = new THREE.MeshBasicMaterial({ color: 0xcccccc });

            for (let r = 2; r <= rings + 1; r++) {
                const radius = r * ringSpacing;
                const count = Math.floor(radius * 0.9);
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const px = Math.cos(angle) * radius;
                    const pz = Math.sin(angle) * radius;

                    // DAY BUILDINGS (Grey + Textured dots)
                    const hT = 5 + Math.random() * 20;
                    const w = 3.5 + Math.random() * 2;
                    const d = 3.5 + Math.random() * 2;
                    const dayHouse = new THREE.Group();
                    const box = new THREE.Mesh(new THREE.BoxGeometry(w, hT, d), topMat);
                    box.position.y = hT / 2;
                    dayHouse.add(box);
                    for(let j=0; j<Math.floor(hT/4); j++) {
                        const winCol = Math.random() > 0.9 ? 0xf1c40f : 0xaaaaaa;
                        const dot = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.12), new THREE.MeshBasicMaterial({ color: winCol }));
                        const side = Math.random() > 0.5 ? 1 : -1;
                        dot.position.set((Math.random()-0.5)*w*0.8, Math.random()*hT, (d/2 + 0.08)*side);
                        dayHouse.add(dot);
                    }
                    dayHouse.position.set(px, 0.05, pz);
                    dayHouse.rotation.y = -angle;
                    upperGroup.add(dayHouse);

                    // NIGHT BUILDINGS (Black + Varied Neon Windows)
                    const hB = 10 + Math.random() * 45;
                    const nHouse = new THREE.Group();
                    const bBox = new THREE.Mesh(new THREE.BoxGeometry(4.5, hB, 4.5), new THREE.MeshStandardMaterial({ color: 0x010105 }));
                    bBox.position.y = -hB / 2;
                    nHouse.add(bBox);
                    
                    const neonCol = NEON_PALETTE[Math.floor(Math.random() * NEON_PALETTE.length)];
                    const win = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.7, 4.6), new THREE.MeshStandardMaterial({ color: neonCol, emissive: neonCol, emissiveIntensity: 6 }));
                    win.position.y = -Math.random() * hB;
                    nHouse.add(win);
                    
                    nHouse.position.set(px, -0.05, pz);
                    nHouse.rotation.y = -angle;
                    lowerGroup.add(nHouse);
                }
            }

            // 6. RADIANT CENTRAL BEAM (Restored Glow/Gradient)
            const beamGroup = new THREE.Group();
            // Upper Beam
            const redBase = new THREE.Mesh(new THREE.CylinderGeometry(5.5, 5.5, 18, 32), new THREE.MeshBasicMaterial({ color: 0x9e0000 }));
            redBase.position.y = 9;
            beamGroup.add(redBase);
            const yellowCore = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 1400, 32), new THREE.MeshBasicMaterial({ color: 0xffe600 }));
            yellowCore.position.y = 700;
            beamGroup.add(yellowCore);
            
            const yellowGlow = new THREE.Mesh(new THREE.CylinderGeometry(18, 2, 1400, 32), new THREE.MeshBasicMaterial({ 
                color: 0xffaa00, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending 
            }));
            yellowGlow.position.y = 700;
            beamGroup.add(yellowGlow);

            // Lower Beam
            const violetCore = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 1400, 32), new THREE.MeshBasicMaterial({ color: 0x7700ff }));
            violetCore.position.y = -700;
            beamGroup.add(violetCore);
            
            const violetGlow = new THREE.Mesh(new THREE.CylinderGeometry(20, 3, 1400, 32), new THREE.MeshBasicMaterial({ 
                color: 0x4400ff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending 
            }));
            violetGlow.position.y = -700;
            beamGroup.add(violetGlow);
            
            scene.add(beamGroup);

            // 7. TRAFFIC (Restored variation)
            const mCols = [0x9e0000, 0xf1c40f, 0x2980b9, 0xffffff];
            for (let i = 0; i < 150; i++) {
                const inner = Math.random() > 0.5;
                const car = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 7), new THREE.MeshBasicMaterial({ color: mCols[i % 4] }));
                car.userData = { angle: Math.random()*6.28, speed: (0.003+Math.random()*0.004)*(inner?1:-1), radius: roadRadius+(inner?-10:10), y: 3.5 };
                upperGroup.add(car);
                upperTrails.push(car);
            }
            // Multi-colored Neon Traffic for Dark World
            for (let i = 0; i < 500; i++) {
                const inner = Math.random() > 0.5;
                const col = NEON_PALETTE[i % NEON_PALETTE.length];
                const car = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 30), new THREE.MeshStandardMaterial({ 
                    color: col, emissive: col, emissiveIntensity: 25 
                }));
                car.userData = { angle: Math.random()*6.28, speed: (0.025+Math.random()*0.04)*(inner?1:-1), radius: roadRadius+(inner?-12:12), y: -3.5 };
                lowerGroup.add(car);
                lowerTrails.push(car);
            }
        }

        function updateEnvironment() {
            const y = camera.position.y;
            const isDay = y > 0;
            if (isDay === lastSide) return;
            lastSide = isDay;

            const body = document.body;
            if (isDay) {
                body.style.background = "var(--day-grad)";
                scene.fog.color.set(0x4dabff);
                ambientLight.intensity = 1.4;
                sun.intensity = 2.0;
                nightLight.intensity = 0;
                upperGroup.visible = true;
                lowerGroup.visible = false;
            } else {
                body.style.background = "var(--night-grad)";
                scene.fog.color.set(0x1a0b3c);
                ambientLight.intensity = 0.2;
                sun.intensity = 0;
                nightLight.intensity = 4.0;
                upperGroup.visible = false;
                lowerGroup.visible = true;
            }
            document.getElementById('side-indicator').innerText = isDay ? "UPPER WORLD • CERULEAN GRADIENT" : "NETHER WORLD • NEON PULSE";
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateEnvironment();

            const move = (trails) => {
                trails.forEach(t => {
                    if(t.parent.visible) {
                        t.userData.angle += t.userData.speed;
                        t.position.x = Math.cos(t.userData.angle) * t.userData.radius;
                        t.position.z = Math.sin(t.userData.angle) * t.userData.radius;
                        t.position.y = t.userData.y;
                        t.rotation.y = -t.userData.angle + (t.userData.speed > 0 ? 0 : Math.PI);
                    }
                });
            };

            move(upperTrails);
            move(lowerTrails);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
