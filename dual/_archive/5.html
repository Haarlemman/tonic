<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWIN CITY | The Upper and Nether Worlds</title>
    <style>
        :root {
            --sky-day: #ffffff;
            --sky-day-accent: #f0f4f8;
            --sky-night: #020205;
            --mondrian-red: #8b0000;
            --mondrian-yellow: #f1c40f;
            --mondrian-blue: #2980b9;
            --tron-cyan: #00f2ff;
            --tron-magenta: #ff00ff;
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* Responsive Background Layer */
        #bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--sky-day);
            z-index: -1;
            transition: background 0.6s ease;
        }

        #canvas-container { width: 100%; height: 100%; display: block; }

        #hud {
            position: absolute;
            top: 40px;
            left: 40px;
            color: #000;
            pointer-events: none;
            z-index: 10;
            transition: color 0.6s ease;
        }

        h1 { 
            font-size: 1.6rem; 
            font-weight: 900; 
            letter-spacing: 14px; 
            text-transform: uppercase; 
            margin: 0;
            border-left: 6px solid #8b0000;
            padding-left: 20px;
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 5px;
            color: #555;
            margin-top: 10px;
            padding-left: 26px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* 3D Space Labels */
        .label {
            position: absolute;
            color: white;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            transform: translate(-50%, -50%);
            white-space: nowrap;
            backdrop-filter: blur(4px);
            border-radius: 2px;
        }

        #popup {
            position: absolute;
            display: none;
            background: #fff;
            border: 4px solid #000;
            padding: 24px;
            color: #000;
            font-size: 13px;
            width: 240px;
            pointer-events: none;
            z-index: 100;
            box-shadow: 15px 15px 0px rgba(0,0,0,0.1);
        }

        .controls {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: rgba(0,0,0,0.4);
            font-size: 10px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <div id="hud">
        <h1>Twin City</h1>
        <div class="subtitle" id="side-indicator">Upper & Nether World</div>
    </div>

    <div id="popup">
        <strong id="p-title" style="display:block; margin-bottom: 8px; font-size: 16px; text-transform: uppercase; border-bottom: 4px solid #000; padding-bottom: 8px;"></strong>
        <span id="p-desc" style="color: #444; display: block; margin-bottom: 16px; line-height: 1.6; font-weight: 600;"></span>
        <div style="font-size: 10px; color: #000; letter-spacing: 2px; font-weight: 900; background: #eee; padding: 5px; text-align: center;">[ STATUS: OBSERVING ]</div>
    </div>

    <div class="controls" id="control-hint">
        DRAG: ORBIT • RIGHT-DRAG: PAN • SCROLL: ZOOM
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        let ambientLight, sun;
        let interactiveObjects = [];
        let labels = [];
        let chaosTrails = [];
        let roadRing;

        const WORLD_DATA = [
            { id: 'art', side: 'top', name: 'Art', title: 'The Deep Vault', desc: 'A heavy maroon containment of aesthetic resonance.', color: 0x8b0000, x: 0, z: 0 },
            { id: 'science', side: 'top', name: 'Science', title: 'The Automaton', desc: 'A static robotic observer of geometric and mathematical laws.', color: 0x34495e, x: 10, z: -10 },
            { id: 'spirit', side: 'top', name: 'Spirit', title: 'The Beam', desc: 'A bridge reaching through the framework, dissolving into the white sky.', color: 0xffcc00, x: -10, z: 10 },
            
            { id: 'trauma', side: 'bottom', name: 'Trauma', title: 'Submerged Root', desc: 'The anchor of historical pain beneath the framework.', color: 0x5d3fd3, x: 0, z: 0 },
            { id: 'identity', side: 'bottom', name: 'Identity', title: 'Mirror Hall', desc: 'The fragmented shadows of the perceived self.', color: 0x2c3e50, x: 10, z: -10 },
            { id: 'control', side: 'bottom', name: 'Control', title: 'The Iron Pillar', desc: 'Rigid prevention of systemic collapse.', color: 0x111111, x: -10, z: 10 }
        ];

        window.onload = init;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0xffffff, 50, 450);

            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.set(130, 110, 130);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // OrbitControls - COMPLETELY UNLOCKED
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minPolarAngle = 0;
            controls.maxPolarAngle = Math.PI; // Total freedom to flip underneath

            ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            
            sun = new THREE.DirectionalLight(0xffffff, 1.4);
            sun.position.set(50, 150, 50);
            sun.castShadow = true;
            scene.add(sun);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            buildWorld();

            window.addEventListener('resize', onResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);

            animate();
        }

        function buildWorld() {
            const gridSize = 22;
            const spacing = 2.4;
            const offset = (gridSize * spacing) / 2;

            // Definition: Darkened slate for contrast against white
            const topBlockMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.5 });
            const botBlockMat = new THREE.MeshStandardMaterial({ color: 0x0a0a1a, roughness: 0.9 });

            for (let x = 0; x < gridSize; x++) {
                for (let z = 0; z < gridSize; z++) {
                    const px = x * spacing - offset;
                    const pz = z * spacing - offset;

                    const isReserved = WORLD_DATA.some(d => Math.abs(d.x - px/spacing) < 0.6 && Math.abs(d.z - pz/spacing) < 0.6);
                    if (isReserved) continue;

                    // UPPER CITY
                    const hTop = 1 + Math.random() * 8;
                    const topBlock = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1, 1.6), topBlockMat);
                    topBlock.scale.set(1, hTop, 1);
                    topBlock.position.set(px, hTop/2 + 0.1, pz);
                    topBlock.castShadow = true;
                    scene.add(topBlock);

                    // NETHER CITY
                    const hBot = 1 + Math.random() * 10;
                    const botBlock = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1, 1.6), botBlockMat);
                    botBlock.scale.set(1, hBot, 1);
                    botBlock.position.set(px, -(hBot/2 + 0.1), pz);
                    scene.add(botBlock);

                    if (x % 5 === 0 && z % 5 === 0) createStreetlight(px + 1, pz + 1);
                }
            }

            WORLD_DATA.forEach(d => createSpecial(d));

            // THE RING ROAD
            const roadRadius = offset + 15;
            roadRing = new THREE.Mesh(
                new THREE.TorusGeometry(roadRadius, 2.0, 12, 128),
                new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 1 })
            );
            roadRing.rotation.x = Math.PI / 2;
            scene.add(roadRing);

            // Trails
            const mondrianColors = [0xc0392b, 0xf1c40f, 0x2980b9]; 
            const tronColors = [0x00f2ff, 0xff00ff]; 
            
            for (let i = 0; i < 35; i++) {
                const trail = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 3.5), new THREE.MeshBasicMaterial());
                trail.userData = { 
                    angle: (i / 35) * Math.PI * 2, 
                    speed: 0.003 + Math.random() * 0.015, 
                    radius: roadRadius,
                    dayColor: mondrianColors[i % 3],
                    nightColor: tronColors[i % 2]
                };
                scene.add(trail);
                chaosTrails.push(trail);
            }

            // The Threshold
            const threshold = new THREE.Mesh(
                new THREE.PlaneGeometry(1500, 1500),
                new THREE.MeshStandardMaterial({ color: 0x000000, transparent: true, opacity: 0.5 })
            );
            threshold.rotation.x = -Math.PI / 2;
            scene.add(threshold);
        }

        function createStreetlight(x, z) {
            const pole = new THREE.Mesh(new THREE.BoxGeometry(0.15, 45, 0.15), new THREE.MeshStandardMaterial({color: 0x111111}));
            pole.position.set(x, 0, z);
            scene.add(pole);

            const lDay = new THREE.PointLight(0xfff5e6, 2.5, 30);
            lDay.position.set(x, 15, z);
            scene.add(lDay);

            const lNight = new THREE.PointLight(0x00d2ff, 3.0, 30);
            lNight.position.set(x, -15, z);
            scene.add(lNight);
        }

        function createSpecial(data) {
            const spacing = 2.4;
            const x = data.x * spacing;
            const z = data.z * spacing;
            let mesh;

            if (data.id === 'spirit') {
                const vertexShader = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
                const fragmentShader = `varying vec2 vUv; uniform vec3 color; void main() { float alpha = pow(1.0 - vUv.y, 3.5); gl_FragColor = vec4(color, alpha * 0.9); }`;
                const shaderMat = new THREE.ShaderMaterial({
                    uniforms: { color: { value: new THREE.Color(data.color) } },
                    vertexShader, fragmentShader, transparent: true
                });
                mesh = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.8, 160, 32, 1, true), shaderMat);
                mesh.position.set(x, 80, z);
            } else if (data.id === 'science') {
                // STATIC ROBOT sentinel
                mesh = new THREE.Group();
                const torso = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.5, 1.6), new THREE.MeshStandardMaterial({color: 0x555566}));
                const head = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.5, 1.8), new THREE.MeshStandardMaterial({color: 0x00d2ff, emissive: 0x00d2ff, emissiveIntensity: 0.4}));
                head.position.y = 2.5;
                const visor = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.25, 0.1), new THREE.MeshBasicMaterial({color: 0xffffff}));
                visor.position.set(0, 2.6, 0.91);
                const legL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 3.5, 0.8), new THREE.MeshStandardMaterial({color: 0x222222}));
                legL.position.set(-0.8, -2.5, 0);
                const legR = new THREE.Mesh(new THREE.BoxGeometry(0.8, 3.5, 0.8), new THREE.MeshStandardMaterial({color: 0x222222}));
                legR.position.set(0.8, -2.5, 0);
                mesh.add(torso, head, visor, legL, legR);
                mesh.position.set(x, 4.2, z);
            } else if (data.id === 'art') {
                // ROUNDED DEEP RED VAULT
                mesh = new THREE.Group();
                const base = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 16, 32), new THREE.MeshStandardMaterial({color: data.color, roughness: 0.2}));
                const dome = new THREE.Mesh(new THREE.SphereGeometry(3.2, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({color: data.color, roughness: 0.2}));
                dome.position.y = 8;
                mesh.add(base, dome);
                mesh.position.set(x, 8, z);
            } else if (data.id === 'trauma') {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(8, 35, 8), new THREE.MeshStandardMaterial({color: data.color, emissive: data.color, emissiveIntensity: 0.2}));
                mesh.position.set(x, -17.5, z);
            } else if (data.id === 'identity') {
                mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(7), new THREE.MeshStandardMaterial({color: data.color, wireframe: true, emissive: data.color, emissiveIntensity: 0.5}));
                mesh.position.set(x, -10, z);
            } else if (data.id === 'control') {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(4, 60, 4), new THREE.MeshStandardMaterial({color: data.color, metalness: 1, roughness: 0.05}));
                mesh.position.set(x, -30, z);
            }

            mesh.userData = data;
            scene.add(mesh);
            interactiveObjects.push(mesh);

            const label = document.createElement('div');
            label.className = 'label';
            label.innerText = data.name;
            document.body.appendChild(label);
            labels.push({ el: label, pos: new THREE.Vector3(x, data.side === 'top' ? 45 : -45, z) });
        }

        function updateEnvironment() {
            // Factor: Switch based on polar angle (elevation)
            // 0 (Top Pole) to PI (Bottom Pole). Threshold is PI/2
            const polarAngle = controls.getPolarAngle();
            const factor = polarAngle < (Math.PI / 2) ? 1 : 0; // Immediate switch

            ambientLight.intensity = factor === 1 ? 1.0 : 0.4;
            sun.intensity = factor === 1 ? 1.6 : 0.2;
            
            const skyColor = factor === 1 ? new THREE.Color(0xffffff) : new THREE.Color(0x000000);
            scene.fog.color.copy(skyColor);

            const bg = document.getElementById('bg-layer');
            const hud = document.getElementById('hud');
            const hint = document.getElementById('control-hint');
            
            if (factor === 1) {
                bg.style.background = `var(--sky-day)`;
                bg.style.opacity = 1;
                hud.style.color = "#000";
                hint.style.color = "rgba(0,0,0,0.5)";
                roadRing.material.emissive.set(0x000000);
                document.getElementById('side-indicator').innerText = "UPPER WORLD • CONSCIOUS FRAMEWORK";
            } else {
                bg.style.background = `var(--sky-night)`;
                bg.style.opacity = 0; 
                hud.style.color = "#fff";
                hint.style.color = "rgba(255,255,255,0.4)";
                roadRing.material.emissive.set(0x003366); 
                document.getElementById('side-indicator').innerText = "NETHER WORLD • SUBMERGED TRUTHS";
            }

            const popup = document.getElementById('popup');
            if (factor === 1) {
                popup.style.background = "#fff";
                popup.style.color = "#000";
                popup.style.border = "4px solid #000";
            } else {
                popup.style.background = "#000";
                popup.style.color = "#fff";
                popup.style.border = "1px solid #00f2ff";
            }

            chaosTrails.forEach(t => {
                if (factor === 1) {
                    t.material.color.set(t.userData.dayColor);
                    t.scale.set(1.6, 1, 1.6);
                } else {
                    t.material.color.set(t.userData.nightColor);
                    t.scale.set(0.2, 1, 9.0);
                }
            });
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            checkRaycast(event);
        }

        function checkRaycast(event) {
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactiveObjects, true);
            const pop = document.getElementById('popup');

            if (hits.length > 0) {
                let obj = hits[0].object;
                while(obj.parent && !obj.userData.id) obj = obj.parent;
                const d = obj.userData;
                pop.style.display = 'block';
                pop.style.left = (event.clientX + 20) + 'px';
                pop.style.top = (event.clientY + 20) + 'px';
                document.getElementById('p-title').innerText = d.title;
                document.getElementById('p-title').style.color = (camera.position.y > 0) ? '#' + d.color.toString(16).padStart(6, '0') : "#fff";
                document.getElementById('p-desc').innerText = d.desc;
                document.body.style.cursor = 'pointer';
            } else {
                pop.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        }

        function onClick() {
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactiveObjects, true);
            if (hits.length > 0) {
                let obj = hits[0].object;
                while(obj.parent && !obj.userData.id) obj = obj.parent;
                obj.scale.set(1.2, 1.2, 1.2);
                setTimeout(() => obj.scale.set(1, 1, 1), 200);
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateEnvironment();

            labels.forEach(l => {
                const v = l.pos.clone().project(camera);
                if (v.z > 1) l.el.style.display = 'none';
                else {
                    l.el.style.display = 'block';
                    l.el.style.left = `${(v.x * 0.5 + 0.5) * window.innerWidth}px`;
                    l.el.style.top = `${(v.y * -0.5 + 0.5) * window.innerHeight}px`;
                }
            });

            interactiveObjects.forEach(obj => {
                const id = obj.userData.id;
                if (id === 'identity') {
                    obj.rotation.x += 0.003;
                    obj.rotation.y += 0.001;
                }
                if (id === 'spirit') {
                    obj.rotation.y += 0.01;
                }
            });

            chaosTrails.forEach(t => {
                t.userData.angle += t.userData.speed;
                t.position.x = Math.cos(t.userData.angle) * t.userData.radius;
                t.position.z = Math.sin(t.userData.angle) * t.userData.radius;
                t.rotation.y = -t.userData.angle;
                t.position.y = 0.5;
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
