<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWIN CITY | The Upper and Nether Worlds</title>
    <style>
        :root {
            /* Pure High-Key Daylight */
            --sky-day-top: #ffffff;
            --sky-day-bottom: #f8faff;
            /* Absolute Nether Dark */
            --sky-night-top: #000000;
            --sky-night-bottom: #050512;
            
            --mondrian-red: #d63031;
            --mondrian-yellow: #f1c40f;
            --mondrian-blue: #0984e3;
            --neon-cyan: #00f2ff;
            --neon-magenta: #ff00ff;
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }

        /* Responsive Background Layer */
        #bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, var(--sky-day-top) 0%, var(--sky-day-bottom) 100%);
            z-index: -1;
            transition: opacity 0.4s ease-in-out;
        }

        #canvas-container { width: 100%; height: 100%; display: block; }

        #hud {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #000;
            pointer-events: none;
            z-index: 10;
            transition: color 0.4s ease;
        }

        h1 { 
            font-size: 1.4rem; 
            font-weight: 900; 
            letter-spacing: 12px; 
            text-transform: uppercase; 
            margin: 0;
            border-left: 5px solid var(--mondrian-red);
            padding-left: 20px;
        }

        .subtitle {
            font-size: 10px;
            letter-spacing: 5px;
            color: #333;
            margin-top: 10px;
            padding-left: 25px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .label {
            position: absolute;
            color: white;
            font-size: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            transform: translate(-50%, -50%);
            white-space: nowrap;
            backdrop-filter: blur(4px);
            border-radius: 2px;
        }

        #popup {
            position: absolute;
            display: none;
            background: rgba(255, 255, 255, 0.98);
            border: 3px solid #000;
            padding: 20px;
            color: #000;
            font-size: 12px;
            width: 230px;
            pointer-events: none;
            z-index: 100;
            box-shadow: 12px 12px 0px rgba(0,0,0,0.15);
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(0,0,0,0.5);
            font-size: 9px;
            letter-spacing: 1px;
            pointer-events: none;
            transition: color 0.4s ease;
        }
    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <div id="hud">
        <h1>Twin City</h1>
        <div class="subtitle" id="side-indicator">Upper & Nether World</div>
    </div>

    <div id="popup">
        <strong id="p-title" style="display:block; margin-bottom: 5px; font-size: 14px; text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 5px;"></strong>
        <span id="p-desc" style="color: #333; display: block; margin-bottom: 12px; line-height: 1.5; font-weight: 600;"></span>
        <div style="font-size: 9px; color: #000; letter-spacing: 2px; font-weight: 900;">[ STATUS: ACTIVE ]</div>
    </div>

    <div class="controls" id="control-hint">
        DRAG: ROTATE (NO LIMITS) • RIGHT-DRAG: PAN • SCROLL: ZOOM
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        let ambientLight, sun;
        let interactiveObjects = [];
        let labels = [];
        let chaosTrails = [];
        let roadRing;

        const WORLD_DATA = [
            { id: 'art', side: 'top', name: 'Art', title: 'The Vault', desc: 'Deep red containment of aesthetic frequency.', color: 0x8b0000, x: 0, z: 0 },
            { id: 'science', side: 'top', name: 'Science', title: 'The Automaton', desc: 'A robotic sentinel observing mathematical logic.', color: 0x2c3e50, x: 8, z: -8 },
            { id: 'spirit', side: 'top', name: 'Spirit', title: 'The Beam', desc: 'A singular bridge dissolving into the infinite.', color: 0xffcc00, x: -8, z: 8 },
            
            { id: 'trauma', side: 'bottom', name: 'Trauma', title: 'Submerged Root', desc: 'The anchor of pain beneath the framework.', color: 0x5d3fd3, x: 0, z: 0 },
            { id: 'identity', side: 'bottom', name: 'Identity', title: 'Mirror Hall', desc: 'Fragmented echoes of the perceived self.', color: 0x2f3542, x: 8, z: -8 },
            { id: 'control', side: 'bottom', name: 'Control', title: 'Iron Pillar', desc: 'The rigid prevention of total collapse.', color: 0x111111, x: -8, z: 8 }
        ];

        window.onload = init;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0xffffff, 10, 500);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.set(120, 100, 120);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // OrbitControls - Fully unlocked
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minPolarAngle = 0;
            controls.maxPolarAngle = Math.PI; // Full range allowed

            ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);
            
            sun = new THREE.DirectionalLight(0xffffff, 1.4);
            sun.position.set(50, 120, 50);
            sun.castShadow = true;
            scene.add(sun);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            buildWorld();

            window.addEventListener('resize', onResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);

            animate();
        }

        function buildWorld() {
            const gridSize = 20;
            const spacing = 2.2;
            const offset = (gridSize * spacing) / 2;

            // Architecture: Darkened slate for visibility against white
            const topBlockMat = new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.5 });
            const botBlockMat = new THREE.MeshStandardMaterial({ color: 0x0a0a18, roughness: 0.8 });

            for (let x = 0; x < gridSize; x++) {
                for (let z = 0; z < gridSize; z++) {
                    const px = x * spacing - offset;
                    const pz = z * spacing - offset;

                    const isReserved = WORLD_DATA.some(d => Math.abs(d.x - px/spacing) < 0.6 && Math.abs(d.z - pz/spacing) < 0.6);
                    if (isReserved) continue;

                    // UPPER CITY
                    const hTop = 0.5 + Math.random() * 6.5;
                    const topBlock = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1, 1.6), topBlockMat);
                    topBlock.scale.set(1, hTop, 1);
                    topBlock.position.set(px, hTop/2 + 0.1, pz);
                    topBlock.castShadow = true;
                    scene.add(topBlock);

                    // NETHER CITY
                    const hBot = 0.5 + Math.random() * 9;
                    const botBlock = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1, 1.6), botBlockMat);
                    botBlock.scale.set(1, hBot, 1);
                    botBlock.position.set(px, -(hBot/2 + 0.1), pz);
                    scene.add(botBlock);

                    if (x % 5 === 0 && z % 5 === 0) createLightPole(px + 1, pz + 1);
                }
            }

            WORLD_DATA.forEach(d => createSpecial(d));

            // THE RING ROAD
            const roadRadius = offset + 12;
            roadRing = new THREE.Mesh(
                new THREE.TorusGeometry(roadRadius, 2.0, 8, 128),
                new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 1, emissive: 0x000000 })
            );
            roadRing.rotation.x = Math.PI / 2;
            scene.add(roadRing);

            // Dynamic Chaos Trails
            const mondrianColors = [0xe74c3c, 0xf1c40f, 0x2980b9]; 
            const tronColors = [0x00f2ff, 0xff00ff]; 
            
            for (let i = 0; i < 32; i++) {
                const trail = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 3.0), new THREE.MeshBasicMaterial());
                trail.userData = { 
                    angle: (i / 32) * Math.PI * 2, 
                    speed: 0.004 + Math.random() * 0.012, 
                    radius: roadRadius,
                    dayColor: mondrianColors[i % 3],
                    nightColor: tronColors[i % 2]
                };
                scene.add(trail);
                chaosTrails.push(trail);
            }

            // Central Horizon Plane
            const horizon = new THREE.Mesh(
                new THREE.PlaneGeometry(1200, 1200),
                new THREE.MeshStandardMaterial({ color: 0x000000, transparent: true, opacity: 0.5 })
            );
            horizon.rotation.x = -Math.PI / 2;
            scene.add(horizon);
        }

        function createLightPole(x, z) {
            const pole = new THREE.Mesh(new THREE.BoxGeometry(0.12, 40, 0.12), new THREE.MeshStandardMaterial({color: 0x111111}));
            pole.position.set(x, 0, z);
            scene.add(pole);

            const lDay = new THREE.PointLight(0xfff5e6, 2.4, 25);
            lDay.position.set(x, 12, z);
            scene.add(lDay);

            const lNight = new THREE.PointLight(0x00d2ff, 2.8, 25);
            lNight.position.set(x, -12, z);
            scene.add(lNight);
        }

        function createSpecial(data) {
            const spacing = 2.2;
            const x = data.x * spacing;
            const z = data.z * spacing;
            let mesh;

            if (data.id === 'spirit') {
                const vertexShader = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
                const fragmentShader = `varying vec2 vUv; uniform vec3 color; void main() { float alpha = pow(1.0 - vUv.y, 4.0); gl_FragColor = vec4(color, alpha * 0.95); }`;
                const shaderMat = new THREE.ShaderMaterial({
                    uniforms: { color: { value: new THREE.Color(data.color) } },
                    vertexShader, fragmentShader, transparent: true
                });
                mesh = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 140, 32, 1, true), shaderMat);
                mesh.position.set(x, 70, z);
            } else if (data.id === 'science') {
                // STATIC ROBOT AUTOMATON
                mesh = new THREE.Group();
                const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2.8, 1.4), new THREE.MeshStandardMaterial({color: 0x555566}));
                const head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 1.5), new THREE.MeshStandardMaterial({color: 0x00d2ff, emissive: 0x00d2ff, emissiveIntensity: 0.5}));
                head.position.y = 2.0;
                const eye = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.1), new THREE.MeshBasicMaterial({color: 0xffffff}));
                eye.position.set(0, 2.1, 0.76);
                const legL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.8, 0.6), new THREE.MeshStandardMaterial({color: 0x111111}));
                legL.position.set(-0.6, -1.8, 0);
                const legR = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.8, 0.6), new THREE.MeshStandardMaterial({color: 0x111111}));
                legR.position.set(0.6, -1.8, 0);
                mesh.add(torso, head, eye, legL, legR);
                mesh.position.set(x, 3.2, z);
            } else if (data.id === 'art') {
                // DEEP RED VAULT (Rounded)
                mesh = new THREE.Group();
                const base = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.8, 14, 32), new THREE.MeshStandardMaterial({color: 0x8b0000, roughness: 0.3}));
                const dome = new THREE.Mesh(new THREE.SphereGeometry(2.8, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({color: 0x8b0000, roughness: 0.3}));
                dome.position.y = 7;
                mesh.add(base, dome);
                mesh.position.set(x, 7, z);
            } else if (data.id === 'trauma') {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(7, 30, 7), new THREE.MeshStandardMaterial({color: data.color, emissive: data.color, emissiveIntensity: 0.2}));
                mesh.position.set(x, -15, z);
            } else if (data.id === 'identity') {
                mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(6), new THREE.MeshStandardMaterial({color: data.color, wireframe: true, emissive: data.color, emissiveIntensity: 0.4}));
                mesh.position.set(x, -10, z);
            } else if (data.id === 'control') {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(3.5, 50, 3.5), new THREE.MeshStandardMaterial({color: data.color, metalness: 1, roughness: 0.05}));
                mesh.position.set(x, -25, z);
            }

            mesh.userData = data;
            scene.add(mesh);
            interactiveObjects.push(mesh);

            const label = document.createElement('div');
            label.className = 'label';
            label.innerText = data.name;
            document.body.appendChild(label);
            labels.push({ el: label, pos: new THREE.Vector3(x, data.side === 'top' ? 40 : -40, z) });
        }

        function updateEnvironment() {
            // Factor calculation with a clearer threshold for "switching"
            const limit = 25;
            let factor = (camera.position.y + limit) / (limit * 2);
            factor = Math.max(0, Math.min(1, factor));

            // Lighting intensity reacts strongly to side
            ambientLight.intensity = 0.4 + (factor * 1.0);
            sun.intensity = 0.2 + (factor * 1.8);
            
            const skyDay = new THREE.Color(0xffffff);
            const skyNight = new THREE.Color(0x000000);
            scene.fog.color.lerpColors(skyNight, skyDay, factor);

            const bg = document.getElementById('bg-layer');
            const hud = document.getElementById('hud');
            const hint = document.getElementById('control-hint');
            
            if (camera.position.y >= 0) {
                bg.style.background = `linear-gradient(to bottom, var(--sky-day-top) 0%, var(--sky-day-bottom) 100%)`;
                bg.style.opacity = 1;
                hud.style.color = "#000";
                hint.style.color = "rgba(0,0,0,0.5)";
                roadRing.material.emissive.set(0x000000);
                document.getElementById('side-indicator').innerText = "UPPER WORLD • BOOGIE WOOGIE";
            } else {
                bg.style.background = `linear-gradient(to bottom, var(--sky-night-top) 0%, var(--sky-night-bottom) 100%)`;
                bg.style.opacity = 0; // Pure Black
                hud.style.color = "#fff";
                hint.style.color = "rgba(255,255,255,0.4)";
                roadRing.material.emissive.set(0x003366); // Neon Ring
                document.getElementById('side-indicator').innerText = "NETHER WORLD • TRON NEON";
            }

            // Interactive popup theming
            const popup = document.getElementById('popup');
            if (camera.position.y > 0) {
                popup.style.background = "#fff";
                popup.style.color = "#000";
                popup.style.border = "3px solid #000";
            } else {
                popup.style.background = "#000";
                popup.style.color = "#fff";
                popup.style.border = "1px solid #00f2ff";
            }

            // Update Chaos Trails
            chaosTrails.forEach(t => {
                if (camera.position.y >= 0) {
                    t.material.color.set(t.userData.dayColor);
                    t.scale.set(1.6, 1, 1.6);
                } else {
                    t.material.color.set(t.userData.nightColor);
                    t.scale.set(0.2, 1, 8.0); // Fast streaks for Tron
                }
            });
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            checkRaycast(event);
        }

        function checkRaycast(event) {
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactiveObjects, true);
            const pop = document.getElementById('popup');

            if (hits.length > 0) {
                let obj = hits[0].object;
                while(obj.parent && !obj.userData.id) obj = obj.parent;
                const d = obj.userData;
                pop.style.display = 'block';
                pop.style.left = (event.clientX + 20) + 'px';
                pop.style.top = (event.clientY + 20) + 'px';
                document.getElementById('p-title').innerText = d.title;
                document.getElementById('p-title').style.color = (camera.position.y > 0) ? '#' + d.color.toString(16).padStart(6, '0') : "#fff";
                document.getElementById('p-desc').innerText = d.desc;
                document.body.style.cursor = 'pointer';
            } else {
                pop.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        }

        function onClick() {
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactiveObjects, true);
            if (hits.length > 0) {
                let obj = hits[0].object;
                while(obj.parent && !obj.userData.id) obj = obj.parent;
                obj.scale.set(1.2, 1.2, 1.2);
                setTimeout(() => obj.scale.set(1, 1, 1), 200);
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateEnvironment();

            labels.forEach(l => {
                const v = l.pos.clone().project(camera);
                if (v.z > 1) l.el.style.display = 'none';
                else {
                    l.el.style.display = 'block';
                    l.el.style.left = `${(v.x * 0.5 + 0.5) * window.innerWidth}px`;
                    l.el.style.top = `${(v.y * -0.5 + 0.5) * window.innerHeight}px`;
                }
            });

            interactiveObjects.forEach(obj => {
                const id = obj.userData.id;
                if (id === 'identity') {
                    obj.rotation.x += 0.004;
                    obj.rotation.y += 0.002;
                }
                if (id === 'spirit') {
                    obj.rotation.y += 0.01;
                }
            });

            chaosTrails.forEach(t => {
                t.userData.angle += t.userData.speed;
                t.position.x = Math.cos(t.userData.angle) * t.userData.radius;
                t.position.z = Math.sin(t.userData.angle) * t.userData.radius;
                t.rotation.y = -t.userData.angle;
                t.position.y = 0.4;
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
