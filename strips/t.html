<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Test CSV Loader</title>
</head>
<body>
  <h1>CSV Test</h1>
  <div id="output">Loading…</div>

  <script>
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-AJ2_vyyxvfpdRPd3v6MXbbI8bPF7-fLNpQx7jOGnm8mXoIhh-Gkza5xMtG8WKUHGy5ILCkBT5L-R/pub?gid=1026598690&single=true&output=csv";

    fetch(url)
      .then(r => r.text())
      .then(text => {
        document.getElementById("output").innerText = text.slice(0, 500); // show first 500 chars
      })
      .catch(err => {
        document.getElementById("output").innerText = "Error: " + err;
      });
  </script>
</body>
</html>
