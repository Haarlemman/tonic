                grid.innerHTML = html;
            } catch (err) {
                console.error('Error rendering comics:', err);
                grid.innerHTML = `<p class="error-message">Fout bij laden: ${err.message}</p>`;
            }
        }

        function toggleComicSelection(comicId) {
            if (selectedComics.has(comicId)) {
                selectedComics.delete(comicId);
            } else {
                selectedComics.add(comicId);
            }
            updateBuyButton();
            document.querySelectorAll('.comic-card').forEach(item => {
                item.classList.toggle('selected', selectedComics.has(item.dataset.id));
            });
        }

        function updateBuyButton() {
            const buyButton = document.getElementById('buyBtn');
            const badge = document.getElementById('badge');
            if (!buyButton || !badge) return;
            const count = selectedComics.size;
            badge.textContent = count;
            badge.style.display = count > 0 ? 'inline-flex' : 'none';
            buyButton.disabled = count === 0;
            buyButton.onclick = () => {
                if (count > 0) {
                    const selected = Array.from(selectedComics).join(', ');
                    window.location.href = `mailto:${CONTACT_EMAIL}?subject=Comic Purchase Inquiry&body=Interested in comics: ${selected}`;
                }
            };
        }

        function showImagePopup(src, alt) {
            const popup = document.getElementById('popup');
            const popImg = document.getElementById('popimg');
            if (!popup || !popImg) return;
            popImg.src = src;
            popImg.alt = alt || '';
            popup.classList.add('show');
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, rendering comics for:', CATEGORY);
            renderComics();
        });
    </script>
</body>
</html>
