<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suske en Wiske (4 kleurenreeks) - David Enker Strip Collectie</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        :root {
            --primary-color: #FF6B6B;
            --secondary-color: #FF8E53;
        }
    </style>
</head>
<body class="comic-page" data-category="suske-wiske">
    <div class="container">
        <div class="header">
            <button class="back-button" onclick="window.location.href='index.html'">← Terug</button>
            <h1>📚 Suske en Wiske</h1>
            <p>4 kleurenreeks • David Enker's Collectie</p>
        </div>

        <div id="grid" class="loading">
            <p>Bezig met laden van de collectie...</p>
        </div>

        <!-- Buy Button -->
        <button id="buyBtn" class="buy-button" disabled>
            Koop Geselecteerde Comics
            <span id="badge" class="selected-count" style="display: none;">0</span>
        </button>

        <!-- Image Popup -->
        <div id="popup" class="image-popup" onclick="comicsManager.closePopup()">
            <img id="popimg" src="" alt="">
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Initialize the page when loaded
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof comicsManager !== 'undefined') {
                comicsManager.loadCategoryComics('suske-wiske');
            }
        });
    </script>
</body>
</html>
