<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Universe - Final Collapse</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;600&family=Space+Grotesk:wght@300;700&display=swap');

        body {
            margin: 0;
            background-color: #000;
            color: #FFF;
            font-family: 'Jost', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        canvas { display: block; }

        /* --- UI LAYER --- */
        #info-panel {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
            opacity: 0; 
            transition: opacity 1s ease-in;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding-bottom: 50px;
        }

        #phase-display {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            color: #0ff; 
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            min-height: 1.5em; 
        }

        .slider-wrapper {
            width: 70%;
            max-width: 800px;
            pointer-events: auto;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .slider-wrapper:hover { opacity: 1; }

        input[type=range] {
            width: 100%;
            accent-color: #0ff;
            height: 2px;
            background: rgba(0, 255, 255, 0.2);
            appearance: none;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 14px; height: 14px;
            background: #000;
            border: 2px solid #0ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px #0ff;
        }

        /* --- START SCREEN --- */
        #start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease-out; 
        }

          #ignite-btn {
            background: #EEFF11;
            color: #000;
            font-family: 'Space Grotesk', monospace;
            font-size: 1rem;
   	        font-weight: 700;
            letter-spacing: 6px;
            padding: 10px 20px;
            border: 2px solid #fff;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        #ignite-btn:hover {
            background: #045DF5;
            color: #000;
 		    border: 2px solid #00D6FF;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

    </style>
</head>
<body>

    <div id="start-screen">
        <button id="ignite-btn">START BIG BANG</button>
    </div>

    <div id="canvas-container">
        <canvas id="wireCanvas"></canvas>
    </div>

    <div id="info-panel">
        <div id="phase-display">SYSTEM INITIALIZED</div>
        <div class="slider-wrapper">
            <input type="range" id="depthSlider" min="0" max="16500" value="0" step="1">
        </div>
    </div>

    <!-- AUDIO ASSETS -->
    <audio id="audio-boom" src="boom.mp3" preload="auto"></audio>
    <audio id="audio-stellar" src="stellar.mp3" preload="auto" loop></audio>
    <audio id="audio-stofzuiger" src="stofzuiger.mp3" preload="auto"></audio>

    <script>
        // ==========================================
        //       --- MASTER CONTROL BOARD ---
        // ==========================================
        
        const TIMING = {
            // -- DISTANCES (Z-Depth Units) --
            WORLD_END: 16500,  
            
            // Where the slow-motion braking begins
            BRAKE_START: 11000, 
            
            // ** EARLY SUCK **: Red lines start streaming in much earlier (Moved to 9500)
            SUCK_START: 9500,

            // ** COLLAPSE **: When the huge horizon snaps shut
            COLLAPSE_START: 15200,

            // Audio: Where fade begins
            AUDIO_FADE_START: 16200, 
            AUDIO_FADE_DURATION: 10, 
            
            // Audio: The vacuum/cutoff sound begins
            AUDIO_VACUUM_START: 15500,

            // -- TIME DURATIONS (Milliseconds) --
            INTRO_DURATION_MS: 2000, 
            OUTRO_FADE_MS: 2000, 
            OUTRO_BLACK_MS: 2000,

            BOOM_START_DELAY_MS: 800,
            STELLAR_START_DELAY_MS: 0 
        };

        const FL = 500; 
        
        // ==========================================
        
        const canvas = document.getElementById('wireCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const slider = document.getElementById('depthSlider');
        const phaseEl = document.getElementById('phase-display');
        const infoPanel = document.getElementById('info-panel');
        const startScreen = document.getElementById('start-screen');
        const igniteBtn = document.getElementById('ignite-btn');

        const soundBoom = document.getElementById('audio-boom');
        const soundStellar = document.getElementById('audio-stellar');
        const soundStofzuiger = document.getElementById('audio-stofzuiger');

        slider.max = TIMING.WORLD_END;

        let width, height, cx, cy;
        let scrollPos = 0;
        let targetScroll = 0;
        let time = 0;

        let appState = 'IDLE'; 
        let stateTimerStart = 0;
        
        let lastInteraction = Date.now();
        const IDLE_DELAY = 1000;
        let isAutoPlaying = false;
        let vacuumPlaying = false;

        // --- SEQUENCE CONTROLLER ---
        igniteBtn.addEventListener('click', () => {
            playPing();
            igniteBtn.style.opacity = 0; 
            igniteBtn.style.pointerEvents = 'none';
            startIntroSequence();
        });

        function startIntroSequence() {
            appState = 'FLICKER';
            stateTimerStart = Date.now();
            startScreen.style.opacity = 0;
            setTimeout(() => { startScreen.style.display = 'none'; }, 500);
        }

        function launchUniverse() {
            appState = 'RUNNING';
            infoPanel.style.opacity = 1; 

            setTimeout(() => {
                if (appState === 'RUNNING') {
                    soundBoom.volume = 1.0; 
                    soundBoom.play().catch(e => console.log("Boom failed", e));
                }
            }, TIMING.BOOM_START_DELAY_MS);

            setTimeout(() => {
                if (appState === 'RUNNING') {
                    soundStellar.volume = 0.7; 
                    soundStellar.play().catch(e => console.log("Stellar failed", e));
                }
            }, TIMING.STELLAR_START_DELAY_MS);

            isAutoPlaying = true;
            lastInteraction = Date.now() - IDLE_DELAY - 100;
        }

        function startOutroSequence() {
            appState = 'OUTRO';
            stateTimerStart = Date.now();
            soundStofzuiger.pause();
            soundStofzuiger.currentTime = 0;
            vacuumPlaying = false;
            soundStellar.pause();
            soundStellar.currentTime = 0;
            soundBoom.pause();
            infoPanel.style.opacity = 0; 
        }

        function resetAndLoop() {
            targetScroll = 0;
            scrollPos = 0;
            vacuumPlaying = false;
            launchUniverse();
        }

        // --- AUDIO ENGINE ---
        function updateAudioEngine(z) {
            if (appState !== 'RUNNING') return; 

            if (z < TIMING.AUDIO_VACUUM_START) {
                if (vacuumPlaying) {
                    soundStofzuiger.pause();
                    soundStofzuiger.currentTime = 0;
                    vacuumPlaying = false;
                }
                
                if (z < TIMING.AUDIO_FADE_START) {
                    soundStellar.volume = 0.6;
                } else {
                    let fadeProgress = (z - TIMING.AUDIO_FADE_START) / TIMING.AUDIO_FADE_DURATION;
                    soundStellar.volume = Math.max(0, 0.6 * (1 - fadeProgress));
                }
            
            } else {
                soundStellar.volume = 0;
                
                if (!vacuumPlaying) {
                    soundStofzuiger.currentTime = 0;
                    soundStofzuiger.volume = 0;
                    soundStofzuiger.playbackRate = 0.8;
                    soundStofzuiger.play();
                    vacuumPlaying = true;
                }
                const vacProgress = Math.min(1, (z - TIMING.AUDIO_VACUUM_START) / (TIMING.WORLD_END - TIMING.AUDIO_VACUUM_START));
                soundStofzuiger.volume = vacProgress;
                soundStofzuiger.playbackRate = 0.8 + (vacProgress * 0.8);
            }
        }

        // --- DRAW LOOP ---
        function draw() {
            time += 0.02;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            if (appState === 'IDLE') {
                ctx.fillStyle = '#00cc00';
                ctx.beginPath(); 
                ctx.arc(cx, cy, 2 + Math.sin(time*2), 0, Math.PI*2); 
                ctx.fill();
            }
            
            else if (appState === 'FLICKER') {
                let elapsed = Date.now() - stateTimerStart;
                if (elapsed > TIMING.INTRO_DURATION_MS) {
                    launchUniverse();
                } else {
                    let progress = elapsed / TIMING.INTRO_DURATION_MS;
                    let shake = progress * 4;
                    let xOff = (Math.random() - 0.5) * shake;
                    let yOff = (Math.random() - 0.5) * shake;
                    let flicker = Math.random() > (0.3 * progress) ? 1 : 0.2;
                    let r = 3 + Math.random() * 2 * progress;

                    ctx.fillStyle = '#CCDD00';
                    ctx.globalAlpha = flicker;
                    ctx.beginPath();
                    ctx.arc(cx + xOff, cy + yOff, r, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            else if (appState === 'RUNNING') {
                updatePhysics();
                updateAudioEngine(scrollPos);
                updateTitle(scrollPos);
                drawWorld();
            }

            else if (appState === 'OUTRO') {
                let elapsed = Date.now() - stateTimerStart;
                if (elapsed < TIMING.OUTRO_FADE_MS) {
                    let fadeProgress = elapsed / TIMING.OUTRO_FADE_MS; 
                    let alpha = Math.max(0, 1 - fadeProgress);
                    ctx.fillStyle = '#112266';
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 3, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                } 
                else if (elapsed >= (TIMING.OUTRO_FADE_MS + TIMING.OUTRO_BLACK_MS)) {
                    resetAndLoop();
                }
            }

            requestAnimationFrame(draw);
        }

        function updatePhysics() {
            if (Date.now() - lastInteraction > IDLE_DELAY) {
                if(!isAutoPlaying) isAutoPlaying = true;
                
                let speed = 15;
                if (targetScroll > TIMING.BRAKE_START) {
                    let brakeDist = TIMING.WORLD_END - TIMING.BRAKE_START;
                    let progress = (targetScroll - TIMING.BRAKE_START) / brakeDist;
                    if (progress > 1) progress = 1;
                    speed = 15 - (progress * 13); 
                }

                targetScroll += speed;

                if (targetScroll >= TIMING.WORLD_END) {
                    targetScroll = TIMING.WORLD_END;
                    startOutroSequence();
                    return;
                }
                slider.value = targetScroll;
            }
            scrollPos = lerp(scrollPos, targetScroll, 0.1);
        }

        function calculateSuckFactor(pos) {
            // New Suck Logic: Starts earlier
            if (pos < TIMING.SUCK_START) return 0;
            
            // Phase 1: Buildup (Stars start drifting)
            if (pos < TIMING.COLLAPSE_START) {
                // Linear drift up to 0.2 intensity
                return (pos - TIMING.SUCK_START) / (TIMING.COLLAPSE_START - TIMING.SUCK_START) * 0.3; 
            }
            
            // Phase 2: Collapse (Violent)
            let collapseProgress = (pos - TIMING.COLLAPSE_START) / (TIMING.WORLD_END - TIMING.COLLAPSE_START);
            // Exponential spike
            return 0.3 + (Math.pow(collapseProgress, 2) * 0.7);
        }

        function drawWorld() {
            // STRICT CLEAN START FIX:
            // Only draw singularity before z=1150.
            if (scrollPos < 1150) {
                 if (objects.length === 0) return;
                 let s = objects[0]; 
                 
                 let relZ = s.z - scrollPos;
                 if (relZ < 10) return; 
                 
                 let scale = FL / relZ;
                 let x2d = cx + s.x * scale;
                 let y2d = cy + s.y * scale;
                 let pulse = 2 * scale + Math.sin(time*20) * 2;
                 
                 // Fix negative pulse crash
                 if (pulse < 0.1) pulse = 0.1;

                 ctx.fillStyle = '#FFF';
                 ctx.beginPath(); ctx.arc(x2d, y2d, pulse, 0, Math.PI*2); ctx.fill();
                 return; // STOP DRAWING ANYTHING ELSE
            }

            let suckFactor = calculateSuckFactor(scrollPos);

            // --- DRAW STARS (Red Lines) ---
            if (scrollPos > 1150) {
                drawStars(suckFactor);
            }

            ctx.strokeStyle = '#ffeecc';
            ctx.lineWidth = 1; 

            objects.forEach(obj => {
                let relZ = obj.z - scrollPos;
                
                // FORCE HORIZON HIDDEN until late game to avoid it appearing at start
                if (obj.type === 'horizon') {
                    if (scrollPos < 10000) return; // Strict Hiding
                } else {
                    if (relZ < 10 || relZ > 3500) return; 
                    let scale = FL / relZ;
                    if (scale > 20) return; 
                }
                
                // Scale calculation
                let scale = FL / relZ;
                
                // Standard Projection
                let x2d = cx + obj.x * scale;
                let y2d = cy + obj.y * scale;
                
                // --- SUCK/COLLAPSE LOGIC ---
                if (obj.type !== 'horizon' && suckFactor > 0) {
                    x2d = lerp(x2d, cx, suckFactor);
                    y2d = lerp(y2d, cy, suckFactor);
                    let ang = Math.atan2(y2d-cy, x2d-cx) + suckFactor * 2; 
                    let dist = Math.sqrt((x2d-cx)**2 + (y2d-cy)**2);
                    x2d = cx + Math.cos(ang)*dist;
                    y2d = cy + Math.sin(ang)*dist;
                }

                // Opacity
                let alpha = Math.min(1, (3500 - relZ) / 1000); 
                
                // Fade out normal objects during collapse
                if (scrollPos > TIMING.COLLAPSE_START && obj.type !== 'horizon') {
                    alpha *= (1 - (scrollPos - TIMING.COLLAPSE_START) / 1000);
                }
                
                ctx.globalAlpha = Math.max(0, alpha);

                // --- OBJECT DRAWING ---

                if (obj.type === 'singularity') {
                    let pulse = 2 * scale;
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(x2d, y2d, pulse, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'bang') {
                    // BIGGER BANG: Adjusted divisor to 600 (was 800) and Multiplier to 4000 (was 2000)
                    let progress = (scrollPos - 1100) / 600; 
                    if (progress < 0) progress = 0;
                    
                    let burst = Math.pow(progress, 2) * 4000; 
                    
                    if (burst > 0) {
                        let ex = x2d + Math.cos(obj.angle) * burst * scale;
                        let ey = y2d + Math.sin(obj.angle) * burst * scale;
                        // Longer tails
                        let tx = x2d + Math.cos(obj.angle) * (burst - obj.len*2) * scale;
                        let ty = y2d + Math.sin(obj.angle) * (burst - obj.len*2) * scale;
                        
                        ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(ex, ey); ctx.stroke();
                        ctx.lineWidth = 1;
                    }
                } 
                else if (obj.type === 'atom') {
                    let r = obj.r * scale;
                    let minorR = r * 0.5; 
                    ctx.lineWidth = 2;
                    for(let i=0; i<3; i++) {
                        ctx.beginPath(); 
                        let angleTilt = (Math.PI/3)*i; 
                        ctx.ellipse(x2d, y2d, r, minorR, angleTilt + time*0.5, 0, Math.PI*2);
                        ctx.strokeStyle = `rgba(50, 200, 255, 0.6)`; 
                        ctx.stroke();
                        if (i < 2) {
                            let speed = (i === 0) ? time * 3 : time * 4 + 2; 
                            let ex_local = r * Math.cos(speed);
                            let ey_local = minorR * Math.sin(speed);
                            let rotation = angleTilt + time*0.5;
                            let ex_rot = ex_local * Math.cos(rotation) - ey_local * Math.sin(rotation);
                            let ey_rot = ex_local * Math.sin(rotation) + ey_local * Math.cos(rotation);
                            let electronX = x2d + ex_rot;
                            let electronY = y2d + ey_rot;
                            ctx.fillStyle = '#fff'; 
                            ctx.beginPath(); ctx.arc(electronX, electronY, 2*scale, 0, Math.PI*2); ctx.fill(); 
                            ctx.fillStyle = 'rgba(0, 255, 255, 0.8)';
                            ctx.beginPath(); ctx.arc(electronX, electronY, 4*scale, 0, Math.PI*2); ctx.fill(); 
                        }
                    }
                    let pulse = Math.sin(time * 10) * 2;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "#00ddee";
                    ctx.fillStyle = '#ccffff';
                    ctx.beginPath(); ctx.arc(x2d, y2d, (8 + pulse)*scale, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.lineWidth = 1;
                }
                else if (obj.type === 'dna') {
                    let w = obj.width * scale;
                    let twistSpeed = time * 2;
                    let strandTwist = obj.index * 0.3;
                    let tumbleAngle = time * 0.5;
                    let phase = strandTwist + twistSpeed;
                    let localX = Math.sin(phase) * w;
                    let rx1 = localX * Math.cos(tumbleAngle);
                    let ry1 = localX * Math.sin(tumbleAngle);
                    let rx2 = -localX * Math.cos(tumbleAngle);
                    let ry2 = -localX * Math.sin(tumbleAngle);
                    let px1 = x2d + rx1;
                    let py1 = y2d + ry1;
                    let px2 = x2d + rx2;
                    let py2 = y2d + ry2;
                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(px1 - scale, py1 - scale, 2*scale, 2*scale); 
                    ctx.fillRect(px2 - scale, py2 - scale, 2*scale, 2*scale); 
                    if (obj.index % 2 === 0) {
                        ctx.beginPath(); ctx.moveTo(px1, py1); ctx.lineTo(px2, py2);
                        ctx.strokeStyle = '#cc9900'; ctx.stroke();
                    }
                }
                else if (obj.type === 'quantum') {
                    let jx = x2d + (Math.sin(time*5 + obj.phase)*10*scale);
                    let jy = y2d + (Math.cos(time*5 + obj.phase)*10*scale);
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(jx, jy, 1.5*scale, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'node') {
                    ctx.strokeStyle = '#0000FF';
                    for(let k=0; k<3; k++) {
                        let a = (Math.PI*2/3)*k + time*0.2;
                        let len = 30 * scale;
                        ctx.beginPath(); ctx.moveTo(x2d, y2d); ctx.lineTo(x2d + Math.cos(a)*len, y2d + Math.sin(a)*len); ctx.stroke();
                    }
                    ctx.beginPath(); ctx.arc(x2d, y2d, 4*scale, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'fib') {
                    let r = Math.sqrt(obj.x*obj.x + obj.y*obj.y);
                    let baseAng = Math.atan2(obj.y, obj.x);
                    let finalAng = baseAng + time * 0.5;
                    let rotX = r * Math.cos(finalAng);
                    let rotY = r * Math.sin(finalAng);
                    let finalX = cx + rotX * scale;
                    let finalY = cy + rotY * scale;
                    if (suckFactor > 0) {
                         finalX = lerp(finalX, cx, suckFactor);
                         finalY = lerp(finalY, cy, suckFactor);
                    }
                    ctx.fillStyle = '#ccff33';
                    let dotSize = (1.5 + (obj.idx/50)) * scale;
                    ctx.beginPath(); ctx.arc(finalX, finalY, dotSize, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'geo') {
                    let r = obj.r * scale;
                    ctx.strokeStyle = '#0066cc';
                    ctx.save();
                    ctx.translate(x2d, y2d); ctx.rotate(time * 0.5);
                    ctx.beginPath();
                    ctx.moveTo(0, -r); ctx.lineTo(r*0.866, r*0.5); ctx.lineTo(-r*0.866, r*0.5);
                    ctx.closePath(); ctx.stroke();
                    ctx.rotate(time * 0.2);
                    ctx.strokeRect(-r*0.7, -r*0.7, r*1.4, r*1.4);
                    ctx.beginPath(); ctx.arc(0, 0, r*0.5, 0, Math.PI*2); ctx.stroke();
                    ctx.restore();
                }
                else if (obj.type === 'tesseract') {
                    let s = obj.s * scale;
                    ctx.strokeStyle = '#ff3399';
                    ctx.save();
                    ctx.translate(x2d, y2d);
                    ctx.rotate(time);
                    ctx.strokeRect(-s/2, -s/2, s, s);
                    ctx.rotate(time);
                    let is = s * 0.5;
                    ctx.strokeRect(-is/2, -is/2, is, is); 
                    ctx.beginPath();
                    ctx.moveTo(-s/2, -s/2); ctx.lineTo(-is/2, -is/2);
                    ctx.moveTo(s/2, -s/2); ctx.lineTo(is/2, -is/2);
                    ctx.moveTo(s/2, s/2); ctx.lineTo(is/2, is/2);
                    ctx.moveTo(-s/2, s/2); ctx.lineTo(-is/2, is/2);
                    ctx.stroke();
                    ctx.restore();
                }
                else if (obj.type === 'solar') {
                    let r = obj.r * scale;
                    ctx.strokeStyle = '#ffdd00';
                    ctx.beginPath(); ctx.arc(x2d, y2d, 10*scale, 0, Math.PI*2); ctx.stroke();
                    for(let i=1; i<5; i++) {
                        let or = (r/5)*i;
                        ctx.beginPath(); ctx.ellipse(x2d, y2d, or, or*0.4, time*0.1, 0, Math.PI*2); ctx.stroke();
                    }
                }
                else if (obj.type === 'web') {
                    let r = obj.size * scale;
                    ctx.fillStyle = '#336699';
                    ctx.beginPath(); ctx.arc(x2d, y2d, r, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(x2d, y2d); ctx.lineTo(cx, cy); 
                    ctx.globalAlpha = alpha * 0.2; ctx.stroke();
                }
                else if (obj.type === 'horizon') {
                    ctx.globalAlpha = 1.0; 
                    let r = obj.r * scale;

                    // ** CONTRACT LOGIC **
                    if (scrollPos > TIMING.COLLAPSE_START) {
                        let collapseProg = (scrollPos - TIMING.COLLAPSE_START) / (TIMING.WORLD_END - TIMING.COLLAPSE_START);
                        let shrink = Math.max(0, 1 - collapseProg * 1.5); 
                        r *= shrink;
                    }

                    if (r < 0.1) return; 

                    ctx.fillStyle = '#000'; 
                    ctx.beginPath(); ctx.arc(x2d, y2d, r, 0, Math.PI*2); ctx.fill();
                    
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#fff';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(x2d, y2d, r, 0, Math.PI*2); ctx.stroke();
                    ctx.shadowBlur = 0;

                    ctx.strokeStyle = '#ccccff';
                    ctx.lineWidth = 1;
                    
                    ctx.save();
                    ctx.translate(x2d, y2d);
                    ctx.scale(1, 0.1); 
                    ctx.rotate(time * 0.2 + Math.sin(time)*0.1);
                    ctx.beginPath(); ctx.arc(0, 0, r * 2.0, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(0, 0, r * 2.8, 0, Math.PI*2); ctx.stroke();
                    ctx.restore();
                }
            });
            ctx.globalAlpha = 1;
        }

        function drawStars(suckFactor) {
            ctx.fillStyle = '#cccc33';
            
            // STRICT CLEAN START for Stars
            if (scrollPos < 1150) return;

            stars.forEach(s => {
                let relativeZ = (s.z + s.zOffset - scrollPos);
                while (relativeZ < 0) relativeZ += TIMING.WORLD_END;
                while (relativeZ > 4000) relativeZ -= 4000; 

                if (relativeZ < 10) return;

                let scale = FL / relativeZ;
                if (scale > 20) return;

                let x2d = cx + s.x * scale;
                let y2d = cy + s.y * scale;
                let size = (scale > 3) ? 3 : scale;

                if (suckFactor > 0) {
                    let dx = x2d - cx;
                    let dy = y2d - cy;
                    
                    let factor = Math.max(0, 1 - suckFactor * 0.9);
                    let sx = cx + dx * factor;
                    let sy = cy + dy * factor;

                    ctx.globalAlpha = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    
                    let streakLen = suckFactor * 0.5; 
                    ctx.lineTo(sx - dx*streakLen, sy - dy*streakLen);
                    
                    ctx.strokeStyle = '#cc0000'; // RED LINES
                    ctx.lineWidth = size;
                    ctx.stroke();

                } else {
                    ctx.globalAlpha = Math.min(1, relativeZ / 1500);
                    ctx.fillRect(x2d, y2d, size, size);
                }
            });
        }

        // --- DECODER EFFECT ---
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";
        let currentText = "SYSTEM INITIALIZED";
        let decodeInterval = null;

        function setDecoderText(newText) {
            if (currentText === newText) return;
            currentText = newText;
            
            let iteration = 0;
            clearInterval(decodeInterval);
            
            decodeInterval = setInterval(() => {
                phaseEl.innerText = newText
                    .split("")
                    .map((letter, index) => {
                        if(index < iteration) return newText[index];
                        return chars[Math.floor(Math.random() * chars.length)];
                    })
                    .join("");
                
                if(iteration >= newText.length) { 
                    clearInterval(decodeInterval);
                    phaseEl.innerText = newText; 
                }
                
                iteration += 1/2; 
            }, 30);
        }

        function updateTitle(z) {
            let n = "VOID";
            if (z > 800) n = "IGNITION";
            if (z > 1800) n = "QUANTUM";
            if (z > 2800) n = "ATOMIC";
            if (z > 4400) n = "BIOLOGIC"; // Delayed further (was 4200)
            if (z > 5800) n = "NEURAL";   // Delayed (was 5200)
            if (z > 6800) n = "SEQUENCE";
            if (z > 7800) n = "GEOMETRY";
            if (z > 8800) n = "PARADOX";
            if (z > 9800) n = "STELLAR";
            if (z > 10800) n = "GALACTIC";
            if (z > 12000) n = "EVENT HORIZON";
            if (z > 15500) n = "SINGULARITY"; 
            setDecoderText(n);
        }

        let audioCtx = null;
        function playPing() {
            if(!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        setInterval(() => {
            if (appState !== 'RUNNING') return;
            if (!currentText || (decodeInterval !== null && decodeInterval._id !== null)) return;
            if(Math.random() > 0.8) {
                const arr = currentText.split("");
                const idx = Math.floor(Math.random() * arr.length);
                if (arr[idx] === ' ') return; 
                arr[idx] = chars[Math.floor(Math.random() * chars.length)];
                phaseEl.innerText = arr.join("");
                setTimeout(() => { phaseEl.innerText = currentText; }, 100);
            }
        }, 800);
        
        // --- INIT OBJECTS ---
        let objects = [];
        let stars = [];

        function initWorld() {
            objects = [];
            stars = [];

            // 1. STARFIELD
            for(let i=0; i<300; i++) {
                stars.push({
                    x: (Math.random()-0.5) * 5000,
                    y: (Math.random()-0.5) * 5000,
                    z: Math.random() * 2000,
                    zOffset: Math.random() * TIMING.WORLD_END 
                });
            }

            // --- STAGE OBJECTS ---
            objects.push({ type: 'singularity', z: 1200, x: 0, y: 0 });

            for(let i=0; i<60; i++) {
                objects.push({
                    type: 'bang', z: 1200, 
                    x: 0, y: 0, 
                    angle: Math.random() * Math.PI * 2,
                    speed: 2 + Math.random()*8, 
                    len: 50 + Math.random()*200
                });
            }

            for(let i=0; i<80; i++) {
                objects.push({
                    type: 'quantum', z: 2400 + (Math.random()-0.5)*500,
                    x: (Math.random()-0.5)*400, y: (Math.random()-0.5)*400,
                    phase: Math.random() * Math.PI * 2
                });
            }

            // ATOM at 3400. 
            objects.push({ type: 'atom', z: 3400, x: 0, y: 0, r: 25 });

            // Pushed DNA further to 5800 (was 5200) to extend Atom phase
            for(let i=0; i<60; i++) {
                objects.push({
                    type: 'dna', z: 5800 + (i * 12), 
                    x: 0, y: 0, index: i, width: 100
                });
            }

            for(let i=0; i<15; i++) {
                objects.push({
                    type: 'node', z: 6800 + (Math.random()-0.5)*600,
                    x: (Math.random()-0.5)*600, y: (Math.random()-0.5)*600,
                    size: 2 + Math.random()*4
                });
            }

            const goldenAngle = Math.PI * (3 - Math.sqrt(5));
            for(let i=0; i<150; i++) {
                let r = Math.sqrt(i) * 35; 
                let theta = i * goldenAngle;
                objects.push({
                    type: 'fib', z: 7800,
                    x: r * Math.cos(theta), 
                    y: r * Math.sin(theta),
                    idx: i
                });
            }

            objects.push({ type: 'geo', z: 8800, x: 0, y: 0, r: 250 });
            objects.push({ type: 'tesseract', z: 9800, x: 0, y: 0, s: 300 });
            objects.push({ type: 'solar', z: 10800, x: 0, y: 0, r: 400 });

            for(let i=0; i<25; i++) {
                objects.push({
                    type: 'web', z: 11800 + (Math.random()-0.5)*1000,
                    x: (Math.random()-0.5)*1000, y: (Math.random()-0.5)*1000,
                    size: 10 + Math.random()*20
                });
            }

            // HUGE RADIUS for Horizon (1000)
            objects.push({ type: 'horizon', z: TIMING.WORLD_END, x: 0, y: 0, r: 1000 });
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2;
        }

        function interact() {
            if(appState !== 'RUNNING') return; 
            lastInteraction = Date.now();
            isAutoPlaying = false;
        }

        slider.addEventListener('input', (e) => {
            targetScroll = parseFloat(e.target.value);
            interact();
        });

        window.addEventListener('wheel', (e) => {
            targetScroll += e.deltaY;
            targetScroll = Math.max(0, Math.min(TIMING.WORLD_END, targetScroll));
            slider.value = targetScroll;
            interact();
        });

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        initWorld();
        resize();
        window.addEventListener('resize', resize);
        requestAnimationFrame(draw);

    </script>
</body>
</html>
