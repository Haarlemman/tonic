<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Universe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;600&family=Space+Grotesk:wght@300;700&display=swap');

        body {
            margin: 0;
            background-color: #000;
            color: #FFF;
            font-family: 'Jost', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        canvas { display: block; }

        /* --- UI LAYER --- */
        #info-panel {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
            opacity: 0; 
            transition: opacity 1s ease-in;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding-bottom: 50px;
        }

        #phase-display {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            color: #0ff; 
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            min-height: 1.5em; 
        }

        .slider-wrapper {
            width: 70%;
            max-width: 800px;
            pointer-events: auto;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .slider-wrapper:hover { opacity: 1; }

        input[type=range] {
            width: 100%;
            accent-color: #0ff;
            height: 2px;
            background: rgba(0, 255, 255, 0.2);
            appearance: none;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 14px; height: 14px;
            background: #000;
            border: 2px solid #0ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px #0ff;
        }

        /* --- START SCREEN --- */
        #start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease-out; 
        }

        #ignite-btn {
            background: transparent;
            color: #FFF;
            font-family: 'Space Grotesk', monospace;
            font-size: 1.5rem;
            letter-spacing: 6px;
            padding: 20px 40px;
            border: 2px solid #FFF;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        #ignite-btn:hover {
            background: #FFF;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

    </style>
</head>
<body>

    <div id="start-screen">
        <button id="ignite-btn">[ IGNITE UNIVERSE ]</button>
    </div>

    <div id="canvas-container">
        <canvas id="wireCanvas"></canvas>
    </div>

    <div id="info-panel">
        <div id="phase-display">SYSTEM INITIALIZED</div>
        <div class="slider-wrapper">
            <input type="range" id="depthSlider" min="0" max="15500" value="0" step="1">
        </div>
    </div>

    <!-- AUDIO ASSETS -->
    <!-- We use JS to control them, but declaring here can help preloading -->
    <audio id="audio-boom" src="boom.mp3" preload="auto"></audio>
    <audio id="audio-stellar" src="stellar.mp3" preload="auto" loop></audio>
    <audio id="audio-stofzuiger" src="stofzuiger.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('wireCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const slider = document.getElementById('depthSlider');
        const phaseEl = document.getElementById('phase-display');
        const infoPanel = document.getElementById('info-panel');
        const startScreen = document.getElementById('start-screen');
        const igniteBtn = document.getElementById('ignite-btn');

        // Audio Elements
        const soundBoom = document.getElementById('audio-boom');
        const soundStellar = document.getElementById('audio-stellar');
        const soundStofzuiger = document.getElementById('audio-stofzuiger');

        let width, height, cx, cy;
        let scrollPos = 0;
        let targetScroll = 0;
        let time = 0;

        // State
        let universeStarted = false;
        let lastInteraction = Date.now();
        const IDLE_DELAY = 3000;
        let isAutoPlaying = false;
        
        // Audio State
        let vacuumPlaying = false;

        // --- SEQUENCE HANDLER ---
        igniteBtn.addEventListener('click', () => {
            // 1. Play Boom Immediately
            soundBoom.volume = 1.0;
            soundBoom.play().catch(e => console.log("Audio play failed", e));
            
            igniteBtn.style.opacity = 0; 
            igniteBtn.style.pointerEvents = 'none';
            
            // 2. Wait 1.0s then launch
            setTimeout(() => {
                launchUniverse(); 
            }, 1000);
        });

        function launchUniverse() {
            universeStarted = true;
            
            // Fade out start screen
            startScreen.style.opacity = 0;
            setTimeout(() => { startScreen.style.display = 'none'; }, 500);
            
            infoPanel.style.opacity = 1; 

            // Start Stellar Loop
            soundStellar.volume = 0.6; // Background level
            soundStellar.play();

            // Kickstart auto-play
            isAutoPlaying = true;
            lastInteraction = Date.now() - IDLE_DELAY - 100;
        }

        // --- AUDIO ENGINE ---
        function updateAudioEngine(z) {
            // --- THE VACUUM SEQUENCE ---
            // Visual suck starts at 11500
            // Reset at 15500
            
            if (z > 11500) {
                // If vacuum isn't playing yet, start it
                if (!vacuumPlaying) {
                    soundStofzuiger.currentTime = 0;
                    soundStofzuiger.volume = 0;
                    soundStofzuiger.play();
                    vacuumPlaying = true;
                }

                // Calculate intensity (0 to 1)
                const progress = Math.min(1, (z - 11500) / 4000);
                
                // Volume Ramp
                soundStofzuiger.volume = Math.min(1, progress); // Linear fade in
                
                // Stellar Fade Out (Crossfade)
                soundStellar.volume = Math.max(0, 0.6 * (1 - progress));

                // Optional: Pitch Shift (if browser supports playbackRate)
                // We want it to sound like it's straining/revving up
                soundStofzuiger.playbackRate = 0.8 + (progress * 0.4); // 0.8x to 1.2x speed

            } else {
                // Not in suck zone
                if (vacuumPlaying) {
                    // We just reset or scrolled back
                    soundStofzuiger.pause();
                    soundStofzuiger.currentTime = 0;
                    vacuumPlaying = false;
                    soundStellar.volume = 0.6; // Restore music
                    soundStellar.playbackRate = 1.0;
                }
            }
        }

        // --- DECODER EFFECT ---
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";
        let currentText = "SYSTEM INITIALIZED";
        let decodeInterval = null;

        function setDecoderText(newText) {
            if (currentText === newText) return;
            currentText = newText;
            
            let iteration = 0;
            clearInterval(decodeInterval);
            
            decodeInterval = setInterval(() => {
                phaseEl.innerText = newText
                    .split("")
                    .map((letter, index) => {
                        if(index < iteration) return newText[index];
                        return chars[Math.floor(Math.random() * chars.length)];
                    })
                    .join("");
                
                if(iteration >= newText.length) { 
                    clearInterval(decodeInterval);
                    phaseEl.innerText = newText; 
                }
                
                iteration += 1/2; 
            }, 30);
        }

        setInterval(() => {
            if (!currentText || (decodeInterval !== null && decodeInterval._id !== null)) return;
            if(Math.random() > 0.8 && universeStarted) {
                const arr = currentText.split("");
                const idx = Math.floor(Math.random() * arr.length);
                if (arr[idx] === ' ') return; 
                arr[idx] = chars[Math.floor(Math.random() * chars.length)];
                phaseEl.innerText = arr.join("");
                setTimeout(() => { phaseEl.innerText = currentText; }, 100);
            }
        }, 800);


        // --- 3D ENGINE CONFIG ---
        const FL = 500; 
        const WORLD_END = 15500; 
        
        let objects = [];
        let stars = [];

        function initWorld() {
            objects = [];
            stars = [];

            // 1. STARFIELD
            for(let i=0; i<300; i++) {
                stars.push({
                    x: (Math.random()-0.5) * 5000,
                    y: (Math.random()-0.5) * 5000,
                    z: Math.random() * 2000,
                    zOffset: Math.random() * WORLD_END 
                });
            }

            // --- STAGE OBJECTS ---
            objects.push({ type: 'singularity', z: 600, x: 0, y: 0 });

            for(let i=0; i<60; i++) {
                objects.push({
                    type: 'bang', z: 1200, 
                    x: 0, y: 0, 
                    angle: Math.random() * Math.PI * 2,
                    speed: 2 + Math.random()*8, 
                    len: 50 + Math.random()*200
                });
            }

            for(let i=0; i<80; i++) {
                objects.push({
                    type: 'quantum', z: 2400 + (Math.random()-0.5)*500,
                    x: (Math.random()-0.5)*400, y: (Math.random()-0.5)*400,
                    phase: Math.random() * Math.PI * 2
                });
            }

            objects.push({ type: 'atom', z: 3400, x: 0, y: 0, r: 180 });

            for(let i=0; i<60; i++) {
                objects.push({
                    type: 'dna', z: 4400 + (i * 12), 
                    x: 0, y: 0, index: i, width: 100
                });
            }

            for(let i=0; i<15; i++) {
                objects.push({
                    type: 'node', z: 5400 + (Math.random()-0.5)*600,
                    x: (Math.random()-0.5)*600, y: (Math.random()-0.5)*600,
                    size: 2 + Math.random()*4
                });
            }

            const goldenAngle = Math.PI * (3 - Math.sqrt(5));
            for(let i=0; i<150; i++) {
                let r = Math.sqrt(i) * 35; 
                let theta = i * goldenAngle;
                objects.push({
                    type: 'fib', z: 6400,
                    x: r * Math.cos(theta), 
                    y: r * Math.sin(theta),
                    idx: i
                });
            }

            objects.push({ type: 'geo', z: 7400, x: 0, y: 0, r: 250 });
            objects.push({ type: 'tesseract', z: 8400, x: 0, y: 0, s: 300 });
            objects.push({ type: 'solar', z: 9400, x: 0, y: 0, r: 400 });

            for(let i=0; i<25; i++) {
                objects.push({
                    type: 'web', z: 10800 + (Math.random()-0.5)*1000,
                    x: (Math.random()-0.5)*1000, y: (Math.random()-0.5)*1000,
                    size: 10 + Math.random()*20
                });
            }

            // HORIZON MOVED TO END
            objects.push({ type: 'horizon', z: 15500, x: 0, y: 0, r: 150 });
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2;
        }

        function interact() {
            if(!universeStarted) return; 
            lastInteraction = Date.now();
            isAutoPlaying = false;
        }

        slider.addEventListener('input', (e) => {
            targetScroll = parseFloat(e.target.value);
            interact();
        });

        window.addEventListener('wheel', (e) => {
            targetScroll += e.deltaY;
            targetScroll = Math.max(0, Math.min(WORLD_END + 1000, targetScroll));
            slider.value = targetScroll;
            interact();
        });

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // --- DRAW LOOP ---
        function draw() {
            if (universeStarted && Date.now() - lastInteraction > IDLE_DELAY) {
                if(!isAutoPlaying) isAutoPlaying = true;
                
                // --- SLOW MOTION BRAKING ---
                // Start speed: 15
                // End speed: 2 (Heavy Slow mo)
                // Start braking at: 11500 (Closing the gap)
                // Distance to brake over: 4000
                
                let speed = 15;
                if (targetScroll > 11500) {
                    let progress = (targetScroll - 11500) / 4000;
                    if (progress > 1) progress = 1;
                    speed = 15 - (progress * 13); 
                }

                targetScroll += speed;

                if (targetScroll >= WORLD_END) {
                    targetScroll = 0; 
                    scrollPos = 0; 
                    // Hard cut audio on loop
                    if(vacuumPlaying) {
                        soundStofzuiger.pause();
                        soundStofzuiger.currentTime = 0;
                        vacuumPlaying = false;
                        soundStellar.volume = 0.6;
                    }
                }
                slider.value = targetScroll;
            }

            scrollPos = lerp(scrollPos, targetScroll, 0.1);
            time += 0.02;

            if (universeStarted) updateAudioEngine(scrollPos);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            if (!universeStarted) {
                ctx.fillStyle = '#FFF';
                ctx.beginPath(); 
                ctx.arc(cx, cy, 2 + Math.sin(time*2), 0, Math.PI*2); 
                ctx.fill();
                requestAnimationFrame(draw);
                return;
            }

            updateTitle(scrollPos);

            // --- VISUAL FADE ---
            // Fade late: 14500 to 15500
            let globalOpacity = 1;
            if (scrollPos > 14500) {
                globalOpacity = Math.max(0, (15500 - scrollPos) / 1000);
            }

            if (globalOpacity <= 0.01) {
                requestAnimationFrame(draw);
                return; 
            }

            // --- DRAW STARS ---
            if (scrollPos > 1200) {
                drawStars(globalOpacity);
            }

            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 1.5; 

            objects.forEach(obj => {
                let relZ = obj.z - scrollPos;
                
                if (scrollPos < 800) {
                    if (obj.type !== 'singularity' && obj.type !== 'bang') return;
                }
                
                // Horizon Cull
                if (obj.type === 'horizon' && scrollPos > 15300) return;

                if (relZ < 10 || relZ > 3500) return; 

                let scale = FL / relZ;
                if (scale > 20) return; 

                let x2d = cx + obj.x * scale;
                let y2d = cy + obj.y * scale;
                
                let alpha = Math.min(1, (3500 - relZ) / 1000) * globalOpacity; 
                
                // --- SUCK LOGIC (11500 -> 15500) ---
                if (scrollPos > 11500 && obj.type !== 'horizon') {
                    let suck = Math.min(1.0, (scrollPos - 11500) / 4000);
                    x2d = lerp(x2d, cx, suck);
                    y2d = lerp(y2d, cy, suck);
                    let ang = Math.atan2(y2d-cy, x2d-cx) + suck * 2; 
                    let dist = Math.sqrt((x2d-cx)**2 + (y2d-cy)**2);
                    x2d = cx + Math.cos(ang)*dist;
                    y2d = cy + Math.sin(ang)*dist;
                }

                ctx.globalAlpha = alpha;

                if (obj.type === 'singularity') {
                    let pulse = 2 * scale;
                    if (scrollPos > 100) pulse += Math.sin(time*20) * 2;
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(x2d, y2d, pulse, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'bang') {
                    let progress = (scrollPos - 600) / 800; 
                    if (progress < 0) progress = 0;
                    let burst = Math.pow(progress, 2) * 2000;
                    if (burst > 0) {
                        let ex = x2d + Math.cos(obj.angle) * burst * scale;
                        let ey = y2d + Math.sin(obj.angle) * burst * scale;
                        let tailLen = obj.len * scale;
                        let tx = x2d + Math.cos(obj.angle) * (burst - obj.len) * scale;
                        let ty = y2d + Math.sin(obj.angle) * (burst - obj.len) * scale;
                        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(ex, ey); ctx.stroke();
                    }
                } 
                else if (obj.type === 'quantum') {
                    let jx = x2d + (Math.sin(time*5 + obj.phase)*10*scale);
                    let jy = y2d + (Math.cos(time*5 + obj.phase)*10*scale);
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(jx, jy, 1.5*scale, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'atom') {
                    let r = obj.r * scale;
                    let minorR = r * 0.5; 
                    for(let i=0; i<3; i++) {
                        ctx.beginPath(); 
                        let angleTilt = (Math.PI/3)*i; 
                        ctx.ellipse(x2d, y2d, r, minorR, angleTilt + time*0.5, 0, Math.PI*2);
                        ctx.strokeStyle = `rgba(255,255,255,0.3)`; 
                        ctx.stroke();
                        if (i < 2) {
                            let speed = (i === 0) ? time * 3 : time * 4 + 2; 
                            let ex_local = r * Math.cos(speed);
                            let ey_local = minorR * Math.sin(speed);
                            let rotation = angleTilt + time*0.5;
                            let ex_rot = ex_local * Math.cos(rotation) - ey_local * Math.sin(rotation);
                            let ey_rot = ex_local * Math.sin(rotation) + ey_local * Math.cos(rotation);
                            let electronX = x2d + ex_rot;
                            let electronY = y2d + ey_rot;
                            ctx.fillStyle = '#0ff'; 
                            ctx.beginPath(); ctx.arc(electronX, electronY, 4*scale, 0, Math.PI*2); ctx.fill();
                            ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
                            ctx.beginPath(); ctx.arc(electronX, electronY, 8*scale, 0, Math.PI*2); ctx.fill();
                        }
                    }
                    ctx.strokeStyle = '#FFF';
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(x2d, y2d, 5*scale, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'dna') {
                    let w = obj.width * scale;
                    let twistSpeed = time * 2;
                    let strandTwist = obj.index * 0.3;
                    let tumbleAngle = time * 0.5;
                    let phase = strandTwist + twistSpeed;
                    let localX = Math.sin(phase) * w;
                    let rx1 = localX * Math.cos(tumbleAngle);
                    let ry1 = localX * Math.sin(tumbleAngle);
                    let rx2 = -localX * Math.cos(tumbleAngle);
                    let ry2 = -localX * Math.sin(tumbleAngle);
                    let px1 = x2d + rx1;
                    let py1 = y2d + ry1;
                    let px2 = x2d + rx2;
                    let py2 = y2d + ry2;
                    ctx.fillStyle = '#FFF';
                    ctx.fillRect(px1 - scale, py1 - scale, 2*scale, 2*scale); 
                    ctx.fillRect(px2 - scale, py2 - scale, 2*scale, 2*scale); 
                    if (obj.index % 2 === 0) {
                        ctx.beginPath(); ctx.moveTo(px1, py1); ctx.lineTo(px2, py2);
                        ctx.strokeStyle = '#FFF'; ctx.stroke();
                    }
                }
                else if (obj.type === 'node') {
                    ctx.strokeStyle = '#FFF';
                    for(let k=0; k<3; k++) {
                        let a = (Math.PI*2/3)*k + time*0.2;
                        let len = 30 * scale;
                        ctx.beginPath(); ctx.moveTo(x2d, y2d); ctx.lineTo(x2d + Math.cos(a)*len, y2d + Math.sin(a)*len); ctx.stroke();
                    }
                    ctx.beginPath(); ctx.arc(x2d, y2d, 4*scale, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'fib') {
                    let r = Math.sqrt(obj.x*obj.x + obj.y*obj.y);
                    let baseAng = Math.atan2(obj.y, obj.x);
                    let finalAng = baseAng + time * 0.5;
                    let rotX = r * Math.cos(finalAng);
                    let rotY = r * Math.sin(finalAng);
                    let finalX = cx + rotX * scale;
                    let finalY = cy + rotY * scale;
                    ctx.fillStyle = '#FFF';
                    let dotSize = (1.5 + (obj.idx/50)) * scale;
                    ctx.beginPath(); ctx.arc(finalX, finalY, dotSize, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'geo') {
                    let r = obj.r * scale;
                    ctx.strokeStyle = '#FFF';
                    ctx.save();
                    ctx.translate(x2d, y2d); ctx.rotate(time * 0.5);
                    ctx.beginPath();
                    ctx.moveTo(0, -r); ctx.lineTo(r*0.866, r*0.5); ctx.lineTo(-r*0.866, r*0.5);
                    ctx.closePath(); ctx.stroke();
                    ctx.rotate(time * 0.2);
                    ctx.strokeRect(-r*0.7, -r*0.7, r*1.4, r*1.4);
                    ctx.beginPath(); ctx.arc(0, 0, r*0.5, 0, Math.PI*2); ctx.stroke();
                    ctx.restore();
                }
                else if (obj.type === 'tesseract') {
                    let s = obj.s * scale;
                    ctx.strokeStyle = '#FFF';
                    ctx.save();
                    ctx.translate(x2d, y2d);
                    ctx.rotate(time);
                    ctx.strokeRect(-s/2, -s/2, s, s);
                    ctx.rotate(time);
                    let is = s * 0.5;
                    ctx.strokeRect(-is/2, -is/2, is, is); 
                    ctx.beginPath();
                    ctx.moveTo(-s/2, -s/2); ctx.lineTo(-is/2, -is/2);
                    ctx.moveTo(s/2, -s/2); ctx.lineTo(is/2, -is/2);
                    ctx.moveTo(s/2, s/2); ctx.lineTo(is/2, is/2);
                    ctx.moveTo(-s/2, s/2); ctx.lineTo(-is/2, is/2);
                    ctx.stroke();
                    ctx.restore();
                }
                else if (obj.type === 'solar') {
                    let r = obj.r * scale;
                    ctx.strokeStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(x2d, y2d, 10*scale, 0, Math.PI*2); ctx.stroke();
                    for(let i=1; i<5; i++) {
                        let or = (r/5)*i;
                        ctx.beginPath(); ctx.ellipse(x2d, y2d, or, or*0.4, time*0.1, 0, Math.PI*2); ctx.stroke();
                    }
                }
                else if (obj.type === 'web') {
                    let r = obj.size * scale;
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(x2d, y2d, r, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(x2d, y2d); ctx.lineTo(cx, cy); 
                    ctx.globalAlpha = alpha * 0.2; ctx.stroke();
                }
                else if (obj.type === 'horizon') {
                    let r = obj.r * scale;
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(x2d, y2d, r, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#FFF';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(x2d, y2d, r, 0, Math.PI*2); ctx.stroke();
                    ctx.save();
                    ctx.translate(x2d, y2d);
                    ctx.scale(1, 0.1); 
                    ctx.rotate(time * 0.2 + Math.sin(time)*0.1);
                    ctx.beginPath(); ctx.arc(0, 0, r * 2.0, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(0, 0, r * 2.8, 0, Math.PI*2); ctx.stroke();
                    ctx.restore();
                }
            });

            ctx.globalAlpha = 1;
            requestAnimationFrame(draw);
        }

        function drawStars(opacity) {
            ctx.fillStyle = '#FFF';
            stars.forEach(s => {
                let relativeZ = (s.z + s.zOffset - scrollPos);
                while (relativeZ < 0) relativeZ += WORLD_END;
                while (relativeZ > 2000) relativeZ -= 2000; 

                if (relativeZ < 10) return;

                let scale = FL / relativeZ;
                
                if (scale > 20) return;

                let x2d = cx + s.x * scale;
                let y2d = cy + s.y * scale;
                let size = (scale > 3) ? 3 : scale;

                // --- IMPLOSION STREAKS ---
                // Starts at 11500 (Overlapping with Galaxy End)
                if (scrollPos > 11500) {
                    // Distribute over 4000 units
                    let suck = (scrollPos - 11500) / 4000; 
                    
                    // Radial Streak Logic:
                    let dx = x2d - cx;
                    let dy = y2d - cy;
                    
                    // Pull stars to center
                    let factor = Math.max(0, 1 - suck * 0.8);
                    let sx = cx + dx * factor;
                    let sy = cy + dy * factor;

                    ctx.globalAlpha = opacity;
                    // Draw lines pointing to center
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    
                    // Length grows with suck
                    let streakLen = suck * 0.3; 
                    ctx.lineTo(sx - dx*streakLen, sy - dy*streakLen);
                    ctx.strokeStyle = '#FFF';
                    ctx.lineWidth = size;
                    ctx.stroke();

                } else {
                    ctx.globalAlpha = Math.min(1, relativeZ / 1500) * opacity;
                    ctx.fillRect(x2d, y2d, size, size);
                }
            });
        }

        function updateTitle(z) {
            let n = "VOID";
            if (z > 800) n = "IGNITION";
            if (z > 1800) n = "QUANTUM";
            if (z > 2800) n = "ATOMIC";
            if (z > 3800) n = "BIOLOGIC";
            if (z > 4800) n = "NEURAL";
            if (z > 5800) n = "SEQUENCE";
            if (z > 6800) n = "GEOMETRY";
            if (z > 7800) n = "PARADOX";
            if (z > 8800) n = "STELLAR";
            if (z > 9800) n = "GALACTIC";
            if (z > 11500) n = "EVENT HORIZON";
            setDecoderText(n);
        }

        initWorld();
        resize();
        window.addEventListener('resize', resize);
        requestAnimationFrame(draw);

    </script>
</body>
</html>
