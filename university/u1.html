<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonic for the Bones | Kinetic Narrative</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Special+Elite&display=swap');

        :root {
            --bg-color: #0d0d0d;
            --accent-yellow: #f9b233;
            --paper-texture: url('https://www.transparenttextures.com/patterns/stardust.png');
            --font-mono: 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Oswald', sans-serif;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            touch-action: none;
        }

        /* Saul Bass Texture Overlay */
        #stage::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--paper-texture);
            opacity: 0.15;
            pointer-events: none;
            z-index: 40;
        }

        #stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* Sharper perspective */
            z-index: 10;
        }

        /* --- Brand & HUD - Ultra Minimal --- */
        #hud-layer {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            box-sizing: border-box;
            z-index: 100;
        }

        .brand-box {
            background: rgba(255, 255, 255, 0.35); 
            color: #111; 
            padding: 6px 12px;
            display: inline-block;
            pointer-events: auto;
            border-left: 3px solid var(--accent-yellow);
            transition: all 0.3s ease;
            text-decoration: none;
            backdrop-filter: blur(4px); 
        }

        .brand-box h1 {
            margin: 0;
            font-size: 0.75rem; /* Even smaller logo */
            text-transform: uppercase;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sub-brand {
            font-family: var(--font-mono);
            font-size: 0.45rem;
            margin-top: 2px;
            color: #222;
        }

        .hud-btn {
            background: #111;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.55rem;
            transition: 0.2s;
            pointer-events: auto;
        }

        /* --- Kinetic Text Styles --- */
        .kinetic-text {
            position: absolute;
            top: 50%;
            left: 50%;
            white-space: nowrap;
            text-transform: uppercase;
            line-height: 0.85;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
            transform-style: preserve-3d;
            transition: opacity 0.4s ease-out;
            transform-origin: center center;
        }

        /* Stroboscope Effect Styles */
        @keyframes strobeGhost {
            0%, 100% { opacity: 0; filter: blur(15px); transform: translate(-50%, -50%) scale(0.85); }
            15%, 85% { opacity: 1; filter: blur(0); transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.25; transform: translate(-50%, -50%) scale(1.15); }
        }

        .strobe-container {
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        .strobe-layer {
            position: absolute;
            animation: strobeGhost 4s infinite ease-in-out;
            mix-blend-mode: screen;
            white-space: nowrap;
        }

        .word-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .active { opacity: 1; }

        #start-overlay {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }

        .btn-bass {
            border: 4px solid white; padding: 15px 40px; font-size: 1.5rem;
            background: none; color: white; text-transform: uppercase; letter-spacing: 5px; transition: 0.3s;
        }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="beginSequence()">
        <button class="btn-bass">Sync & Play</button>
        <p class="mt-4 text-gray-500 uppercase tracking-widest text-xs">Tonic for the Bones</p>
    </div>

    <div id="hud-layer">
        <div style="display:flex; justify-content:space-between; align-items: flex-start;">
            <div class="brand-box">
                <h1>University<br>of Free Will</h1>
                <div class="sub-brand">ADVERSITY IS YOUR TEACHER</div>
            </div>
            <button class="hud-btn">Menu</button>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
            <div id="ui-info" style="font-family:'Special Elite', cursive; font-size:0.55rem; color:#444;">
                SYNC: <span id="time-display">0:00:00</span>
            </div>
            <div id="audio-status" style="font-family:'Special Elite', sans-serif; font-size:0.5rem; color:var(--accent-yellow); text-transform:uppercase;">
                Saul Bass Style: ACTIVE
            </div>
        </div>
    </div>

    <div id="stage"></div>

    <audio id="bg-music" crossorigin="anonymous">
        <source src="audio/MysteriousHeartbeat2.mp3" type="audio/mpeg">
    </audio>

    <script>
        const stage = document.getElementById('stage');
        const timeDisplay = document.getElementById('time-display');
        const music = document.getElementById('bg-music');

        let audioCtx, analyser, dataArray;
        let isAudioInit = false;
        let beatIntensity = 0;
        let activeElements = [];
        let startTime = 0;
        let isRunning = false;
        let currentSlot = 0;

        // Saul Bass Palette
        const saulPalette = [
            "#d92d20", // Red
            "#f9b233", // Warm Yellow
            "#004a99", // Deep Blue
            "#eb5e28", // Burnt Orange
            "#fffcf2", // Off White
            "#6b705c", // Muted Greenish Grey
            "#f4a261"  // Sandy Orange
        ];

        const narrative = [
            { time: "0:00:00", text: "When life takes" },
            { time: "0:03:00", text: "instead of gives" },
            { time: "0:04:29", text: "an illness" },
            { time: "0:07:00", text: "or worse" },
            { time: "0:11:16", text: "the world" },
            { time: "0:13:00", text: "turns upside down", special: "flip" },
            { time: "0:19:18", text: "you're left wondering", special: "stack" },
            { time: "0:23:20", text: "what to do." },
            { time: "0:29:00", text: "Luckily" },
            { time: "0:31:00", text: "there is a way" },
            { time: "0:33:00", text: "to laugh" },
            { time: "0:35:00", text: "in the face of adversity", special: "stack" },
            { time: "0:37:00", text: "all it requires" },
            { time: "0:39:00", text: "is" },
            { time: "0:40:00", text: "a shift" },
            { time: "0:41:00", text: "in thinking" },
            { time: "0:42:00", text: "feeling" },
            { time: "0:43:00", text: "and knowing." },
            { time: "0:45:00", text: "A leap of faith", special: "stack" },
            { time: "0:47:00", text: "embrace the pain" },
            { time: "0:48:00", text: "accept your path" },
            { time: "0:49:00", text: "create" },
            { time: "0:50:00", text: "communicate" },
            { time: "0:51:00", text: "concentrate" },
            { time: "0:52:00", text: "and let go" },
            { time: "0:53:00", text: "it will be" },
            { time: "0:54:00", text: "a balm" },
            { time: "0:55:00", text: "for the soul" },
            { time: "0:56:00", text: "a tonic" },
            { time: "0:57:29", text: "for the bones." }
        ];

        const epilogueWords = ["ART", "WISDOM", "LOVE", "TRUTH", "TIME", "GRACE", "CREATION", "MEMORY", "SOLACE", "UNDERSTANDING", "PERSPECTIVE", "FREEDOM"];

        function parseTime(timeStr) {
            const parts = timeStr.split(':');
            return (parseInt(parts[0]) * 60) + parseInt(parts[1]) + (parseInt(parts[2]) / 30);
        }

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(music);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioInit = true;
            } catch (e) {
                console.warn("Audio Context init failed.");
            }
        }

        function beginSequence() {
            document.getElementById('start-overlay').style.display = 'none';
            initAudio();
            music.play().catch(() => {});
            startTime = performance.now();
            isRunning = true;
            requestAnimationFrame(tick);
        }

        function tick() {
            if (!isRunning) return;
            let elapsed = music.currentTime;
            if (elapsed === 0 || isNaN(elapsed)) {
                elapsed = (performance.now() - startTime) / 1000;
            }
            updateDisplay(elapsed);
            processTimeline(elapsed);
            handleEpilogue(elapsed);
            updateVisuals(elapsed);
            requestAnimationFrame(tick);
        }

        function processTimeline(elapsed) {
            narrative.forEach((item, index) => {
                const triggerPoint = parseTime(item.time);
                if (elapsed >= triggerPoint && !item.played) {
                    item.played = true;
                    spawnText(item, index, elapsed);
                }
            });
        }

        function handleEpilogue(elapsed) {
            if (elapsed > 61) {
                const beatCheck = isAudioInit ? beatIntensity > 0.4 : true;
                if (beatCheck && (elapsed - lastBeatSpawn) > 1.4) {
                    const word = epilogueWords[Math.floor(Math.random() * epilogueWords.length)];
                    spawnText({ text: word, special: "epilogue", duration: 7 }, Math.floor(Math.random()*100), elapsed);
                    lastBeatSpawn = elapsed;
                }
            }
        }

        function updateDisplay(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            const f = Math.floor((seconds % 1) * 30);
            timeDisplay.innerText = `${m}:${s.toString().padStart(2, '0')}:${f.toString().padStart(2, '0')}`;
        }

        function spawnText(item, index, triggerTime) {
            const el = document.createElement('div');
            el.className = 'kinetic-text';
            
            const isMobile = window.innerWidth < 768;
            // Slightly bigger base size (+10%)
            const baseFontSize = isMobile ? 13.5 : 10;
            const lengthScale = Math.max(0.5, 1 - (item.text.length * 0.035));
            el.style.fontSize = (baseFontSize * lengthScale) + "vw";

            if (item.special === "epilogue") {
                el.classList.add('strobe-container');
                const layerCount = 6;
                for (let i = 0; i < layerCount; i++) {
                    const layer = document.createElement('div');
                    layer.className = 'strobe-layer';
                    layer.innerText = item.text;
                    layer.style.color = saulPalette[Math.floor(Math.random() * saulPalette.length)];
                    layer.style.animationDelay = `${i * -0.6}s`;
                    el.appendChild(layer);
                }
            } else if (item.special === 'stack') {
                el.classList.add('word-stack');
                item.text.split(' ').forEach((w, i) => {
                    const s = document.createElement('span');
                    s.innerText = w;
                    s.style.marginLeft = (i * 20) + 'px';
                    s.style.color = saulPalette[Math.floor(Math.random() * saulPalette.length)];
                    el.appendChild(s);
                });
            } else {
                el.innerText = item.text;
                el.style.color = saulPalette[Math.floor(Math.random() * saulPalette.length)];
            }

            // Increased Perspective Rotation (+10% approx)
            const ry = (index % 2 === 0 ? -54 : 54) + (Math.random() * 12 - 6); 
            const rx = (Math.random() * 32 - 16);
            const rz = (Math.random() * 10 - 5) + (item.special === 'flip' ? 180 : 0);
            
            const horizontalSafe = isMobile ? 14 : 20;
            const targetX = (Math.random() * horizontalSafe - (horizontalSafe / 2)); 
            const startX = (ry > 0 ? -110 : 110); 
            const exitX = (ry > 0 ? 120 : -120);
            
            const verticalSlots = [-24, -12, 0, 12, 24];
            const startY = verticalSlots[currentSlot % verticalSlots.length] + (Math.random() * 3 - 1.5);
            currentSlot++;

            stage.appendChild(el);

            activeElements.push({
                dom: el,
                rx, ry, rz,
                startX, startY, exitX, targetX,
                spawnTime: triggerTime,
                duration: item.duration || 2.8
            });

            setTimeout(() => el.classList.add('active'), 20);
        }

        function updateVisuals(elapsed) {
            if (isAudioInit) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i=0; i<4; i++) sum += dataArray[i];
                beatIntensity = (sum / 4) / 255;
            }

            const timeNow = performance.now() * 0.002;
            const pulse = 1 + (beatIntensity * 0.12);

            activeElements.forEach((item, idx) => {
                const localTime = elapsed - item.spawnTime;
                let currentX = item.targetX, currentZ = 0, currentScale = 1;
                const entryD = 0.6, exitD = 0.6;  
                
                if (localTime < entryD) {
                    const t = localTime / entryD;
                    const eased = 1 - Math.pow(1 - t, 3); 
                    currentX = item.startX + (item.targetX - item.startX) * eased;
                    currentZ = -1300 * (1 - eased);
                    currentScale = 0.4 + (0.6 * eased);
                } else if (localTime > item.duration - exitD) {
                    const t = (localTime - (item.duration - exitD)) / exitD;
                    const eased = Math.pow(t, 3);
                    currentX = item.targetX + (item.exitX - item.targetX) * eased;
                    currentZ = 1300 * eased;
                    currentScale = 1 + (3 * eased); 
                    if (t >= 1) {
                        item.dom.remove();
                        activeElements = activeElements.filter(a => a !== item);
                        return;
                    }
                }
                
                const floatX = Math.sin(timeNow + idx) * 8;
                const floatY = Math.cos(timeNow * 0.7 + idx) * 6;
                
                item.dom.style.transform = `
                    translate(-50%, -50%)
                    translate3d(calc(${currentX}vw + ${floatX}px), calc(${item.startY}vh + ${floatY}px), ${currentZ}px)
                    rotateX(${item.rx}deg) rotateY(${item.ry}deg) rotateZ(${item.rz}deg)
                    scale(${currentScale * pulse})
                `;
            });
        }
    </script>
</body>
</html>
