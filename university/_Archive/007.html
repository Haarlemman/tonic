<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The University of Free Will</title>
  <style>
        body { margin: 0; overflow: hidden; background-color: #475569; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; opacity: 1; transition: opacity 0.5s ease; }
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        
        /* Original Intro Overlay Preserved */
        #intro-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.25); backdrop-filter: blur(8px);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; transition: opacity 1.5s ease, visibility 1.5s;
        }
        #intro-text { font-size: 1.5rem; font-weight: 300; max-width: 600px; min-height: 100px; line-height: 1.6; margin-bottom: 40px; padding: 0 20px; letter-spacing: 1px; transition: opacity 0.8s ease; font-style: italic; }
        #enter-btn { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 12px 30px; text-transform: uppercase; letter-spacing: 3px; cursor: pointer; font-size: 0.8rem; transition: all 0.3s ease; opacity: 0; pointer-events: none; }
        #enter-btn:hover { background: white; color: #1e293b; border-color: white; }

        /* Original Tooltip and Highlight Classes Preserved */
        #tooltip { position: absolute; padding: 10px 15px; background: rgba(15, 23, 42, 0.95); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; pointer-events: none; display: none; font-size: 11px; font-weight: 700; letter-spacing: 1px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4); transform: translate(-50%, -100%); margin-top: -15px; z-index: 10; }
        .highlight-art { color: #fff; text-decoration: underline #ef4444; }
        .highlight-science { color: #fff; text-decoration: underline #4444ef; }
        .highlight-spirit { color: #fff; text-decoration: underline #efef44; }
        .highlight-register { color: #fff; text-decoration: underline #ef44ef; }
   	    .highlight-info { color: #fff; text-decoration: underline #44ef44; }

        /* --- THE HUD OVERLAY --- */
        .hud-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 30px; box-sizing: border-box; opacity: 0; transition: opacity 1s ease;
        }
        .brand-box { background: #111; color: white; padding: 15px 25px; display: inline-block; pointer-events: auto; border-left: 5px solid #ffcc00; }
        .brand-box h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; line-height: 1; }
        .sub-brand { font-family: 'Courier New'; font-size: 0.7rem; margin-top: 5px; }
        .status-box { pointer-events: auto; text-align: right; }
        .btn-login { background: #ff3300; color: white; border: none; padding: 10px 20px; font-weight: bold; text-transform: uppercase; cursor: pointer; font-size: 0.8rem; }
        .controls-box { font-family: 'Courier New', monospace; font-size: 0.75rem; color: #666; background: rgba(255,255,255,0.8); padding: 15px; border: 1px solid #ccc; pointer-events: auto; max-width: 250px; }
        .control-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .key { font-weight: bold; color: #111; }
        .directory-box { pointer-events: auto; text-align: right; }
        .building-tag { display: block; background: white; padding: 8px 15px; margin-bottom: 5px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; border-right: 5px solid #ccc; transition: transform 0.2s; cursor: pointer; }
        .tag-red { border-color: #ff3300; }
        .tag-blue { border-color: #0033cc; }
        .tag-yellow { border-color: #ffcc00; }
        .building-tag:hover { transform: translateX(-10px); background: #111; color: white; }

        #skip-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); background: none; border: none; cursor: pointer; font-size: 0.7rem; letter-spacing: 2px; z-index: 101; text-transform: uppercase; }
    </style>
 </head>
 <body>
  <audio id="explore-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>
  
  <button id="skip-btn" onclick="bypassIntro()">[ skip >> ]</button>

  <div id="intro-overlay">
    <div id="intro-text"></div>
    <button id="enter-btn">Explore Campus</button>
  </div>

  <div class="hud-layer" id="main-hud">
    <div style="display:flex; justify-content:space-between;">
        <div class="brand-box">
            <h1>University<br>of Free Will</h1>
            <div class="sub-brand">ART // SCIENCE // SPIRIT</div>
        </div>
        <div class="status-box">
            <button class="btn-login" onclick="alert('Student ID Required')">Insert Student ID</button>
        </div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div class="controls-box">
            <div style="border-bottom:1px solid #ccc; margin-bottom:10px; padding-bottom:5px;">CAMPUS NAVIGATION</div>
            <div class="control-row"><span class="key">L-CLICK + DRAG</span> <span>ROTATE</span></div>
            <div class="control-row"><span class="key">R-CLICK + DRAG</span> <span>PAN</span></div>
            <div class="control-row"><span class="key">SCROLL</span> <span>ZOOM</span></div>
        </div>
        <div class="directory-box">
            <div class="building-tag tag-red" onclick="alert('Focus Art')">Dept. of Art</div>
            <div class="building-tag tag-blue" onclick="alert('Focus Science')">Dept. of Science</div>
            <div class="building-tag tag-yellow" onclick="alert('Focus Spirit')">Dept. of Spirit</div>
        </div>
    </div>
  </div>

  <div id="tooltip"></div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
        // --- ALL ORIGINAL CODE RESTORED EXACTLY ---
        let scene, camera, renderer, raycaster, mouse, controls;
        let specialBlocks = [];
        let leaderLines = [];
        let atomGroup, registryMesh, spiritBeam, spiritGlowVolume;
        let introActive = true;
        const tooltip = document.getElementById('tooltip');
        const introTextEl = document.getElementById('intro-text');
        const enterBtn = document.getElementById('enter-btn');

        const GRID_SIZE = 14;
        const SPACING = 1.6;

        const introQuotes = [
            "Welcome to the University of Free Will.",
            "A framework of knowledge, wisdom and beauty",
            "Where the more you learn, the more you realize you know nothing.",
            "Where letting go of control equals freedom",
            "And where adversity becomes your teacher."
        ];
        
        window.onload = function() {
            init();
            animate();
            runIntroSequence();
        };

        async function runIntroSequence() {
            controls.autoRotate = true;
            controls.autoRotateSpeed = 2.0;
            for (let quote of introQuotes) {
                if(!introActive) break;
                introTextEl.style.opacity = 0;
                await new Promise(r => setTimeout(r, 800));
                if(!introActive) break;
                introTextEl.innerText = quote;
                introTextEl.style.opacity = 1;
                await new Promise(r => setTimeout(r, 3000));
            }
            if(introActive) {
                enterBtn.style.opacity = 1;
                enterBtn.style.pointerEvents = 'auto';
            }
        }

        function bypassIntro() {
            if(!introActive) return;
            introActive = false;
            controls.autoRotate = false;
            document.getElementById('explore-sound').play().catch(()=>{});
            document.getElementById('intro-overlay').style.opacity = 0;
            document.getElementById('skip-btn').style.display = 'none';
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                document.getElementById('main-hud').style.opacity = 1;
            }, 1000);
        }

        enterBtn.onclick = bypassIntro;

        // --- THE REST OF YOUR ORIGINAL CODE FOLLOWS UNTOUCHED ---
        function createTextSprite(text, color = "#ffffff", isIcon = false) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024;
            canvas.height = 256;
            if (!isIcon) {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                if (ctx.roundRect) { ctx.roundRect(200, 64, 624, 128, 12); } else { ctx.fillRect(200, 64, 624, 128); }
                ctx.fill();
            }
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = color;
            if (isIcon && text === "i") {
                ctx.lineWidth = 14; ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(512, 128, 80, 0, Math.PI * 2); ctx.stroke();
                ctx.font = 'Bold 80px Inter, Arial'; ctx.fillText("i", 512, 132);
            } else {
                ctx.font = 'Bold 48px Inter, Arial'; ctx.fillText(text, 512, 128);
            }
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false, depthWrite: false });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(7.5, 1.875, 1);
            sprite.renderOrder = 999;
            return sprite;
        }

        function createGradientTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 256, 0, 0);
            grad.addColorStop(0, 'white');
            grad.addColorStop(0.7, 'rgba(255,255,255,0.2)');
            grad.addColorStop(1, 'black');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1, 256);
            return new THREE.CanvasTexture(canvas);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x475569); 
            scene.fog = new THREE.Fog(0x475569, 30, 110);
            const aspect = window.innerWidth / window.innerHeight;
            const d = 16;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(40, 40, 40);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(20, 50, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            scene.add(mainLight);
            createCampus();
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('click', onMouseClick, false);
        }

        function createCampus() {
            const boxGeom = new THREE.BoxGeometry(1, 1, 1);
            const gradTexture = createGradientTexture();
            const materials = {
                campus: new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.7 }),
                museumWhite: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.1 }),
                museumRed: new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4, metalness: 0.2 }),
                science: new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8, emissiveIntensity: 0.3 }),
                spiritNeon: new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xfacc15, emissiveIntensity: 12, transparent: true, alphaMap: gradTexture }),
                spiritGlow: new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending, alphaMap: gradTexture }),
                register: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.5 }),
                info: new THREE.MeshStandardMaterial({ color: 0x10b981 }),
                dottedLine: new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.2, gapSize: 0.2, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending })
            };
            const centerOffset = (GRID_SIZE * SPACING) / 2;

            for (let x = 0; x < GRID_SIZE; x++) {
                for (let z = 0; z < GRID_SIZE; z++) {
                    let type = "campus", labelText = "", link = null, mesh, labelY = 0;

                    if (x === 6 && z === 7) {
                        type = "art"; labelText = "BEAUTY"; link = "art.html"; labelY = 7.5;
                        mesh = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.BoxGeometry(0.8, 6.5, 0.8), materials.museumRed);
                        core.rotation.z = 0.1; core.position.y = 3.25; mesh.add(core);
                        const shards = [{ size: [4.5, 0.8, 3], pos: [0, 1.5, 0], rot: [0.2, 0.1, 0.1] }, { size: [3, 0.8, 5], pos: [-0.5, 3.8, 0.5], rot: [-0.3, -0.4, 0.1] }, { size: [5.5, 0.4, 2.5], pos: [0.8, 2.6, -0.2], rot: [0.1, 0.6, -0.2] }, { size: [2, 0.5, 2], pos: [0, 5.8, 0], rot: [0, 0, 0.5] }];
                        shards.forEach(s => { const shard = new THREE.Mesh(new THREE.BoxGeometry(...s.size), materials.museumWhite); shard.position.set(...s.pos); shard.rotation.set(...s.rot); mesh.add(shard); });
                    } else if (x === 10 && z === 3) {
                        type = "science"; labelText = "KNOWLEDGE"; link = "science.html"; labelY = 7.5;
                        mesh = new THREE.Group();
                        const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 1.2, 3, 4), materials.campus);
                        pedestal.position.y = 1.5; mesh.add(pedestal);
                        atomGroup = new THREE.Group();
                        const nucleus = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 24), materials.science); atomGroup.add(nucleus);
                        const ringGeom = new THREE.TorusGeometry(1.4, 0.05, 12, 64); const ringMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.8 });
                        const r1 = new THREE.Mesh(ringGeom, ringMat); const r2 = new THREE.Mesh(ringGeom, ringMat); r2.rotation.x = Math.PI / 2; const r3 = new THREE.Mesh(ringGeom, ringMat); r3.rotation.y = Math.PI / 2;
                        atomGroup.add(r1, r2, r3); atomGroup.position.y = 4.8; mesh.add(atomGroup);
                    } else if (x === 3 && z === 10) {
                        type = "spirit"; labelText = "WISDOM"; link = "spirit.html"; labelY = 0.6;
                        mesh = new THREE.Group();
                        spiritBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.4, 18, 32), materials.spiritNeon); spiritBeam.position.y = 9; mesh.add(spiritBeam);
                        spiritGlowVolume = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.9, 18, 32), materials.spiritGlow); spiritGlowVolume.position.y = 9; mesh.add(spiritGlowVolume);
                        const light = new THREE.PointLight(0xfacc15, 8, 6); light.decay = 2; light.position.y = 1.5; mesh.add(light);
                    } else if (x === 2 && z === 2) {
                        type = "register"; labelText = "REGISTRY"; link = "registry.html"; labelY = 4.5;
                        mesh = new THREE.Group();
                        const standBody = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.4, 1.4), materials.register.clone()); standBody.position.y = 1.2; standBody.userData.isRainbow = true; mesh.add(standBody);
                        const counter = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.5), materials.campus); counter.position.set(0, 1.1, 0.5); mesh.add(counter);
                        const roofGroup = new THREE.Group(); const roofPlank = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.15, 1.8), materials.register.clone()); roofPlank.rotation.x = 0.15; roofPlank.userData.isRainbow = true; roofGroup.add(roofPlank); roofGroup.position.set(0, 2.5, 0.1); mesh.add(roofGroup);
                        registryMesh = mesh;
                    } else if (x === 11 && z === 11) {
                        type = "info"; labelText = "INFO DESK"; link = "info.html"; labelY = 7.2;
                        mesh = new THREE.Group();
                        const base = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.8, 1.4), materials.info); base.position.y = 1.4; mesh.add(base);
                        const signDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.1, 32), new THREE.MeshStandardMaterial({color: 0xffffff})); signDisc.rotation.x = Math.PI / 2; signDisc.position.set(1.0, 3.5, 1.0); mesh.add(signDisc);
                        const iIcon = createTextSprite("i", "#10b981", true); iIcon.scale.set(0.8, 0.8, 1); iIcon.position.set(1.0, 3.5, 1.06); mesh.add(iIcon);
                    } else {
                        let height = 0.4 + Math.random() * 1.1; mesh = new THREE.Mesh(boxGeom, materials.campus); mesh.scale.set(1, height, 1); mesh.position.y = height / 2;
                    }

                    mesh.position.x = x * SPACING - centerOffset;
                    mesh.position.z = z * SPACING - centerOffset;
                    mesh.traverse(child => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
                    mesh.userData = { type, label: labelText || type, link: link };
                    scene.add(mesh);

                    if (type !== "campus") {
                        specialBlocks.push(mesh);
                        const labelSprite = createTextSprite(labelText, (type === 'spirit' ? '#fef08a' : '#ffffff'));
                        const forwardOffset = (type === 'spirit') ? 3.5 : 1.2;
                        labelSprite.position.set(mesh.position.x + forwardOffset, labelY, mesh.position.z + forwardOffset);
                        scene.add(labelSprite);
                        const linePoints = [new THREE.Vector3(mesh.position.x, 0.5, mesh.position.z), new THREE.Vector3(labelSprite.position.x, labelSprite.position.y, labelSprite.position.z)];
                        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(linePoints), materials.dottedLine.clone()); line.computeLineDistances();
                        scene.add(line); leaderLines.push(line);
                    }
                }
            }
            const plane = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 1 }));
            plane.rotation.x = -Math.PI / 2; plane.receiveShadow = true; scene.add(plane);
            const grid = new THREE.GridHelper(60, 40, 0x334155, 0x1e293b); grid.position.y = 0.05; scene.add(grid);
        }

        function onMouseMove(event) {
            if (introActive) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(specialBlocks, true);
            if (intersects.length > 0) {
                let target = intersects[0].object; while (target.parent && !target.userData.type) target = target.parent;
                document.body.style.cursor = 'pointer'; tooltip.style.display = 'block'; tooltip.style.left = event.clientX + 'px'; tooltip.style.top = event.clientY + 'px';
                tooltip.innerHTML = `<span class="highlight-${target.userData.type}">${target.userData.label}</span>`;
            } else { document.body.style.cursor = 'grab'; tooltip.style.display = 'none'; }
        }

        function onMouseClick() {
            if (introActive) return;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(specialBlocks, true);
            if (intersects.length > 0) {
                let target = intersects[0].object; while (target.parent && !target.userData.type) target = target.parent;
                if (target.userData.link) { window.location.href = target.userData.link; }
            }
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight; const d = 16;
            camera.left = -d * aspect; camera.right = d * aspect; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            const time = Date.now() * 0.001;
            if (atomGroup) { atomGroup.rotation.y += 0.02; atomGroup.rotation.z += 0.01; atomGroup.position.y += Math.sin(time * 2) * 0.005; }
            if (registryMesh) { registryMesh.traverse(child => { if (child.isMesh && child.userData.isRainbow) { child.material.color.setHSL((time * 0.2) % 1, 0.7, 0.6); } }); }
            if (spiritBeam) { const s = 1 + Math.sin(time * 4) * 0.03; spiritBeam.scale.set(s, 1, s); spiritGlowVolume.material.opacity = 0.1 + Math.sin(time * 3) * 0.05; }
            leaderLines.forEach(line => { line.material.dashOffset -= 0.01; line.material.opacity = 0.5 + Math.sin(time * 2) * 0.2; });
            specialBlocks.forEach(b => { if (b.userData.type === "art") { b.children.forEach((child, i) => { if (i > 0 && child.isMesh) child.position.y += Math.sin(time + i) * 0.0015; }); } });
            renderer.render(scene, camera);
        }
    </script>
 </body>
</html>
