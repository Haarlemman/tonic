<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The University of Free Will</title>
  <style>
        body { margin: 0; overflow: hidden; background-color: #475569; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        
        /* --- INTRO OVERLAY --- */
        #intro-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; transition: opacity 1.5s ease, visibility 1.5s;
        }
        #intro-text { font-size: 1.5rem; font-weight: 300; max-width: 600px; min-height: 100px; line-height: 1.6; margin-bottom: 40px; font-style: italic; transition: opacity 0.8s ease; }
        
        #enter-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.4); color: white;
            padding: 12px 30px; text-transform: uppercase; letter-spacing: 3px; cursor: pointer;
            font-size: 0.8rem; transition: all 0.3s ease; opacity: 0; pointer-events: none;
        }
        #enter-btn:hover { background: white; color: #1e293b; }

        #skip-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.5); background: none; border: none;
            cursor: pointer; font-size: 0.7rem; letter-spacing: 2px; z-index: 101; text-transform: uppercase;
        }

        /* --- THE HUD (From guide.html) --- */
        .hud-element { position: absolute; z-index: 5; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; }
        .hud-active { opacity: 1; pointer-events: auto; }

        #brand-box { top: 30px; left: 30px; background: #111; color: white; padding: 15px 25px; border-left: 5px solid #ef4444; }
        #brand-box h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; line-height: 1; letter-spacing: 2px; }
        
        #status-box { top: 30px; right: 30px; }
        .btn-login { background: #ef4444; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }

        #controls-box { 
            bottom: 30px; left: 30px; background: rgba(255,255,255,0.85); 
            padding: 15px; font-family: 'Courier New', monospace; font-size: 0.75rem; 
            border: 1px solid #ccc; color: #111; backdrop-filter: blur(4px);
        }
        .control-row { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 5px; }
        .key { font-weight: bold; }

        #directory-box { bottom: 30px; right: 30px; text-align: right; }
        .building-tag { 
            display: block; background: white; padding: 8px 15px; margin-bottom: 5px; 
            font-size: 0.8rem; font-weight: bold; text-transform: uppercase; border-right: 5px solid #ccc;
            cursor: pointer; transition: transform 0.2s;
        }
        .tag-red { border-color: #ef4444; }
        .tag-blue { border-color: #3b82f6; }
        .tag-yellow { border-color: #facc15; }
        .building-tag:hover { transform: translateX(-10px); background: #111; color: white; }

        /* Tooltip style */
        #tooltip {
            position: absolute; padding: 10px 15px; background: rgba(15, 23, 42, 0.95);
            color: #fff; border: 1px solid rgba(255,255,255,0.15); display: none;
            font-size: 11px; font-weight: 700; transform: translate(-50%, -100%); margin-top: -15px; z-index: 10;
        }
    </style>
 </head>
 <body>

  <audio id="explore-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

  <button id="skip-btn" onclick="endIntro()">[ Skip Animation >> ]</button>

  <div id="intro-overlay">
    <div id="intro-text"></div>
    <button id="enter-btn">Explore Campus</button>
  </div>

  <div id="brand-box" class="hud-element">
      <h1>University<br>of Free Will</h1>
      <div style="font-family: 'Courier New'; font-size: 0.7rem; margin-top: 5px; opacity: 0.8;">ART // SCIENCE // SPIRIT</div>
  </div>

  <div id="status-box" class="hud-element">
      <button class="btn-login" onclick="alert('Student ID Required')">Insert Student ID</button>
  </div>

  <div id="controls-box" class="hud-element">
      <div style="border-bottom:1px solid #ccc; margin-bottom:10px; padding-bottom:5px; font-weight: bold;">CAMPUS NAVIGATION</div>
      <div class="control-row"><span class="key">L-CLICK</span> <span>ROTATE</span></div>
      <div class="control-row"><span class="key">R-CLICK</span> <span>PAN</span></div>
      <div class="control-row"><span class="key">SCROLL</span> <span>ZOOM</span></div>
  </div>

  <div id="directory-box" class="hud-element">
      <div class="building-tag tag-red" onclick="focusBuilding('art')">Dept. of Art (Beauty)</div>
      <div class="building-tag tag-blue" onclick="focusBuilding('science')">Dept. of Science (Knowledge)</div>
      <div class="building-tag tag-yellow" onclick="focusBuilding('spirit')">Dept. of Spirit (Wisdom)</div>
  </div>

  <div id="tooltip"></div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
        // --- 3D ENGINE VARIABLES ---
        let scene, camera, renderer, raycaster, mouse, controls;
        let specialBlocks = [];
        let atomGroup, spiritBeam, spiritGlowVolume;
        let introActive = true;
        const tooltip = document.getElementById('tooltip');
        const introTextEl = document.getElementById('intro-text');
        const enterBtn = document.getElementById('enter-btn');

        const introQuotes = [
            "Welcome to the University of Free Will.",
            "A framework of knowledge, wisdom and beauty.",
            "Where the more you learn, the more you realize you know nothing.",
            "Where letting go of control equals freedom.",
            "And where adversity becomes your teacher."
        ];
        
        window.onload = () => {
            init();
            animate();
            runIntroSequence();
        };

        async function runIntroSequence() {
            for (let quote of introQuotes) {
                if (!introActive) break;
                introTextEl.style.opacity = 0;
                await new Promise(r => setTimeout(r, 800));
                if (!introActive) break;
                introTextEl.innerText = quote;
                introTextEl.style.opacity = 1;
                await new Promise(r => setTimeout(r, 2800));
            }
            if (introActive) {
                enterBtn.style.opacity = 1;
                enterBtn.style.pointerEvents = 'auto';
            }
        }

        function endIntro() {
            if (!introActive) return;
            introActive = false;

            // Sound logic
            const sound = document.getElementById('explore-sound');
            sound.volume = 0.3;
            sound.play().catch(() => {});

            // UI Transitions
            document.getElementById('intro-overlay').style.opacity = 0;
            document.getElementById('skip-btn').style.display = 'none';
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                document.querySelectorAll('.hud-element').forEach(el => el.classList.add('hud-active'));
                controls.autoRotate = false;
            }, 1000);
        }

        enterBtn.onclick = endIntro;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x475569); 
            scene.fog = new THREE.Fog(0x475569, 30, 110);

            const aspect = window.innerWidth / window.innerHeight;
            const d = 16;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(40, 40, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.5;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(20, 50, 10);
            light.castShadow = true;
            scene.add(light);

            createCampus();

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);
        }

        function createCampus() {
            const GRID_SIZE = 14;
            const SPACING = 1.6;
            const centerOffset = (GRID_SIZE * SPACING) / 2;

            const matArt = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const matWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const matScience = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });

            for (let x = 0; x < GRID_SIZE; x++) {
                for (let z = 0; z < GRID_SIZE; z++) {
                    let mesh;
                    let type = "campus";

                    // Art Building
                    if (x === 6 && z === 7) {
                        type = "art";
                        mesh = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.BoxGeometry(0.8, 6, 0.8), matArt);
                        core.position.y = 3;
                        mesh.add(core);
                        // Floating shards
                        for(let i=0; i<3; i++) {
                            const shard = new THREE.Mesh(new THREE.BoxGeometry(4, 0.5, 2), matWhite);
                            shard.position.y = 2 + i*1.5;
                            shard.rotation.y = i;
                            mesh.add(shard);
                        }
                    } 
                    // Science Building
                    else if (x === 10 && z === 3) {
                        type = "science";
                        mesh = new THREE.Group();
                        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1, 3, 4), matWhite);
                        base.position.y = 1.5;
                        mesh.add(base);
                        atomGroup = new THREE.Group();
                        const nuke = new THREE.Mesh(new THREE.SphereGeometry(0.6), matScience);
                        atomGroup.add(nuke);
                        atomGroup.position.y = 5;
                        mesh.add(atomGroup);
                    }
                    // Spirit Building
                    else if (x === 3 && z === 10) {
                        type = "spirit";
                        mesh = new THREE.Group();
                        const beamGeom = new THREE.CylinderGeometry(0.1, 0.3, 20);
                        spiritBeam = new THREE.Mesh(beamGeom, new THREE.MeshBasicMaterial({color: 0xffff00}));
                        spiritBeam.position.y = 10;
                        mesh.add(spiritBeam);
                    }
                    // Generic Campus Blocks
                    else {
                        const h = 0.5 + Math.random() * 1;
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1, h, 1), new THREE.MeshStandardMaterial({color: 0xd1d5db}));
                        mesh.position.y = h/2;
                    }

                    mesh.position.x = x * SPACING - centerOffset;
                    mesh.position.z = z * SPACING - centerOffset;
                    mesh.userData = { type };
                    if(type !== "campus") specialBlocks.push(mesh);
                    scene.add(mesh);
                }
            }

            // Floor
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({color: 0x1e293b}));
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);
        }

        function onMouseMove(e) {
            if (introActive) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(specialBlocks, true);
            if (hits.length > 0) {
                document.body.style.cursor = 'pointer';
                tooltip.style.display = 'block';
                tooltip.style.left = e.clientX + 'px';
                tooltip.style.top = e.clientY + 'px';
                tooltip.innerText = hits[0].object.parent.userData.type || "Building";
            } else {
                document.body.style.cursor = 'grab';
                tooltip.style.display = 'none';
            }
        }

        function onMouseClick() {
            if (introActive) return;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(specialBlocks, true);
            if (hits.length > 0) {
                alert("Entering " + hits[0].object.parent.userData.type);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            const time = Date.now() * 0.001;
            if (atomGroup) atomGroup.rotation.y += 0.05;
            if (spiritBeam) spiritBeam.scale.x = 1 + Math.sin(time*5)*0.2;
            renderer.render(scene, camera);
        }
    </script>
 </body>
</html>
