<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The University of Free Will | Campus Model</title>
<style>
    /* --- SWISS MODERNIST PALETTE [Sources 1, 2, 17] --- */
    :root {
        --ground: #e0e0e0;     /* Industrial Grey */
        --ink: #111111;        /* Deep Black */
        --red: #ff3300;        /* Signal Red (Rothko) */
        --blue: #0033cc;       /* Process Blue (Rand) */
        --yellow: #ffcc00;     /* Warning Yellow */
        --gold: #D4AF37;       /* The Tonic */
        --grid-line: rgba(0,0,0,0.1);
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--ground);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    /* --- UI OVERLAY (Flat Design) --- */
    header {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 100;
        pointer-events: none;
    }

    h1 {
        font-size: 3rem;
        text-transform: uppercase;
        line-height: 0.8;
        letter-spacing: -2px;
        color: var(--ink);
        margin: 0;
    }

    .subtitle {
        font-family: 'Courier New', monospace;
        background: var(--ink);
        color: white;
        padding: 2px 5px;
        font-size: 0.8rem;
    }

    /* --- THE ISOMETRIC SCENE --- */
    .scene {
        position: relative;
        width: 800px;
        height: 800px;
        transform: rotateX(60deg) rotateZ(-45deg);
        transform-style: preserve-3d;
        transition: transform 0.5s ease;
    }

    /* THE FLOOR GRID [Source 165] */
    .floor {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
            linear-gradient(var(--grid-line) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 40px 40px;
        background-color: #f4f4f0;
        box-shadow: 20px 20px 50px rgba(0,0,0,0.2);
        border: 10px solid var(--ink);
    }

    /* --- BUILDING BASE CLASS (The Cube) --- */
    .building {
        position: absolute;
        transform-style: preserve-3d;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .building:hover {
        transform: translateZ(20px); /* Lift up on hover */
    }

    /* Faces of the cubes */
    .face {
        position: absolute;
        border: 1px solid rgba(0,0,0,0.1);
    }
    .face-top { transform: rotateX(0deg) translateZ(var(--h)); transform-origin: top left; }
    .face-front { transform: rotateX(-90deg) translateZ(var(--d)) translateY(var(--h)); transform-origin: bottom center; }
    .face-side { transform: rotateY(90deg) translateX(var(--w)); transform-origin: top right; }

    /* --- 1. THE MUSEUM (ART/BODY) --- */
    /* A Red Bauhaus Block [Source 2, 19] */
    .museum {
        width: 120px; height: 120px; /* Footprint */
        top: 500px; left: 200px;
        --h: 60px; --w: 120px; --d: 0px; /* Height */
    }
    .museum .face { background: var(--red); }
    .museum .face-top { background: #ff5522; display: flex; align-items: center; justify-content: center; }
    
    /* Label on roof */
    .museum-label {
        font-weight: bold; font-size: 2rem; color: rgba(0,0,0,0.2); transform: rotate(-90deg);
    }

    /* --- 2. THE SCIENCE LAB (MIND/FUTURE) --- */
    /* A Paul Rand Punch Card Tower [Source 17] */
    .science {
        width: 80px; height: 80px;
        top: 200px; left: 500px;
        --h: 200px; --w: 80px; --d: 0px;
    }
    .science .face { background: var(--ink); }
    /* The "Punch Card" Dot Pattern */
    .science .face-front, .science .face-side {
        background-image: radial-gradient(white 15%, transparent 16%);
        background-size: 20px 20px;
        background-position: 0 0;
    }
    .science:hover .face-front {
        animation: ticker 1s linear infinite; /* Data flowing */
    }

    /* --- 3. THE SOUL (THE LIGHT) --- */
    /* Not a house, but a beam [Source 151] */
    .soul-container {
        position: absolute;
        top: 400px; left: 400px;
        width: 100px; height: 100px;
        transform-style: preserve-3d;
        pointer-events: none; /* Let clicks pass to the "Tonic" button */
    }
    
    .soul-beam {
        position: absolute;
        width: 60px; height: 60px;
        background: rgba(212, 175, 55, 0.2); /* Transparent Gold */
        border: 2px solid var(--gold);
        transform: translateZ(0);
        box-shadow: 0 0 50px var(--gold);
        animation: beam-pulse 4s infinite;
        transform-style: preserve-3d;
        /* Create the beam height */
    }
    .soul-beam::after {
        content: ''; position: absolute;
        width: 100%; height: 600px; /* Tall beam */
        background: linear-gradient(to top, rgba(212, 175, 55, 0.5), transparent);
        transform: rotateX(-90deg);
        transform-origin: bottom;
    }

    /* The Tonic Button (The Login) */
    .tonic-btn {
        position: absolute;
        top: 420px; left: 420px;
        width: 60px; height: 60px;
        background: var(--gold);
        border-radius: 50%;
        transform: translateZ(5px);
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 0 20px var(--gold);
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 0.6rem;
        text-align: center;
        color: var(--ink);
        text-decoration: none;
    }
    .tonic-btn:hover { transform: translateZ(40px) scale(1.2); }

    /* --- LABELS (Floating) --- */
    .tooltip {
        position: absolute;
        background: white;
        padding: 5px 10px;
        border: 2px solid black;
        font-size: 1rem;
        font-weight: bold;
        opacity: 0;
        transition: opacity 0.3s;
        transform: rotateX(-90deg) translateY(-100px); /* Stand up */
        pointer-events: none;
        white-space: nowrap;
    }
    .building:hover .tooltip { opacity: 1; }

    /* --- ANIMATIONS --- */
    @keyframes beam-pulse {
        0%, 100% { opacity: 0.5; transform: translateZ(0); }
        50% { opacity: 1; transform: translateZ(20px); }
    }
    @keyframes ticker {
        0% { background-position: 0 0; }
        100% { background-position: 0 20px; }
    }

    /* --- PAYWALL / LOGIN GATE --- */
    .gate {
        position: absolute;
        bottom: 50px; right: 50px;
        background: var(--ink);
        color: white;
        padding: 15px;
        font-family: 'Courier New';
        z-index: 200;
        border-left: 5px solid var(--red);
    }

</style>
</head>
<body>

    <header>
        <h1>University<br>of Free Will</h1>
        <span class="subtitle">CAMPUS MODEL v.3.0 // 1959</span>
    </header>

    <div class="scene">
        
        <!-- THE FLOOR GRID -->
        <div class="floor"></div>

        <!-- 1. THE MUSEUM (ART) - RED CUBE [Source 2, 6] -->
        <div class="building museum" onclick="window.location.href='#art'">
            <!-- Constructing the 3D Box -->
            <div class="face face-top" style="width:120px; height:120px;">
                <span class="museum-label">ART</span>
            </div>
            <div class="face face-side" style="width:120px; height:60px;"></div>
            <div class="face face-front" style="width:120px; height:60px;"></div>
            
            <div class="tooltip" style="top: -50px;">The Rothko Museum</div>
        </div>

        <!-- 2. THE LAB (SCIENCE) - PUNCH CARD TOWER [Source 17, 160] -->
        <div class="building science" onclick="window.location.href='#science'">
            <div class="face face-top" style="width:80px; height:80px; background:white;"></div>
            <div class="face face-side" style="width:200px; height:200px;"></div> <!-- Height is Width in rotation -->
            <div class="face face-front" style="width:80px; height:200px;"></div>
            
            <div class="tooltip" style="top: -220px;">The Meaning Machine</div>
        </div>

        <!-- 3. THE SOUL - THE BEAM OF LIGHT [Source 151] -->
        <div class="soul-container">
            <div class="soul-beam"></div>
        </div>
        
        <!-- THE TONIC BUTTON (Source 151) -->
        <a href="#login" class="tonic-btn">
            THE<br>TONIC
        </a>

        <!-- 4. DECORATIVE ELEMENTS (Bauhaus Shapes) -->
        <!-- A yellow flat shape for decoration [Source 1] -->
        <div style="position: absolute; top: 600px; left: 600px; width: 100px; height: 20px; background: var(--yellow); transform: translateZ(2px);"></div>

    </div>

    <!-- THE LOGIN GATE (Source 154) -->
    <div class="gate">
        STATUS: VISITOR<br>
        <a href="#login" style="color: white; font-weight: bold;">[ INSERT STUDENT ID ]</a>
    </div>

    <script>
        // Simple interactive tilt effect on mousemove
        const scene = document.querySelector('.scene');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            scene.style.transform = `rotateX(${60 + y}deg) rotateZ(${-45 + x}deg)`;
        });
    </script>

</body>
</html>
