<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The University of Free Will | David Enker</title>
<style>
    /* --- SAUL BASS PALETTE --- */
    :root {
        --paper: #f4f4f0;      /* The background */
        --ink: #111;           /* The silhouette */
        --blood: #cc0000;      /* The accent (Trauma) */
        --tonic: #D4AF37;      /* The Gold (Hope) */
    }

    body {
        background-color: var(--paper);
        color: var(--ink);
        font-family: 'Impact', 'Arial Black', sans-serif; /* Blocky Title Font */
        margin: 0;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- TYPOGRAPHY (The Title Sequence) --- */
    header {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        transform: rotate(-2deg);
    }

    h1 {
        font-size: 4rem;
        text-transform: uppercase;
        line-height: 0.8;
        letter-spacing: -2px;
        margin: 0;
    }

    .subtitle {
        font-family: 'Courier New', monospace;
        background: var(--ink);
        color: var(--paper);
        padding: 5px 10px;
        font-size: 1rem;
        display: inline-block;
        margin-top: 10px;
        transform: rotate(2deg);
    }

    /* --- THE ANATOMY (The Interactive Man) --- */
    .anatomy-container {
        position: relative;
        width: 500px;
        height: 700px;
        /* Debug border: border: 1px dashed #ccc; */
    }

    /* SHARED STYLES FOR BODY PARTS */
    .part {
        position: absolute;
        background: var(--ink);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .part:hover {
        background: var(--blood);
        transform: scale(1.05) translate(5px, -5px);
        z-index: 10;
    }

    /* 1. THE MIND (The Head - Source 48) */
    /* Jagged polygon shape */
    .head-part {
        top: 0;
        left: 35%;
        width: 160px;
        height: 180px;
        clip-path: polygon(20% 0%, 90% 10%, 100% 80%, 40% 100%, 0% 70%);
        animation: jitter 4s infinite;
    }

    /* 2. THE SOUL (The Torso - Source 146) */
    .torso-part {
        top: 200px;
        left: 25%;
        width: 240px;
        height: 220px;
        clip-path: polygon(10% 10%, 90% 0%, 80% 90%, 20% 100%);
        animation: jitter 5s infinite reverse;
    }

    /* 3. THE BODY (The Limbs - Source 37 "Silly Walks") */
    .legs-part {
        top: 440px;
        left: 30%;
        width: 200px;
        height: 250px;
        clip-path: polygon(10% 0%, 90% 0%, 70% 100%, 30% 90%);
        animation: jitter 3s infinite;
    }

    /* THE ARM (The Arm that doesn't swing - Source 31) */
    .arm-part {
        top: 220px;
        right: 0%;
        width: 60px;
        height: 200px;
        clip-path: polygon(20% 0%, 100% 10%, 80% 100%, 0% 90%);
        background: var(--ink);
        opacity: 0.8; /* "Fading" arm */
    }

    /* --- THE TONIC (The Golden Heart - Source 145) --- */
    .tonic-heart {
        position: absolute;
        top: 280px;
        left: 45%;
        width: 60px;
        height: 60px;
        background: var(--tonic);
        border-radius: 50%; /* The only perfect circle */
        z-index: 20;
        cursor: pointer;
        animation: pulse 2s infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: 0 0 0 10px rgba(212, 175, 55, 0.2);
    }
    
    .tonic-heart::after {
        content: "TONIC";
        font-family: 'Courier New';
        font-size: 0.6rem;
        color: #000;
        font-weight: bold;
    }

    /* LABELS (Hidden by default, show on hover) */
    .label {
        position: absolute;
        color: var(--paper);
        font-family: 'Courier New';
        font-size: 1.2rem;
        font-weight: bold;
        text-transform: uppercase;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        text-align: center;
        width: 100%;
        top: 40%;
    }

    .part:hover .label { opacity: 1; }

    /* --- THE PAYWALL / LOCK (Source 154) --- */
    .lock-bar {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        background: var(--ink);
        color: var(--paper);
        padding: 10px;
        font-family: 'Courier New';
        transform: rotate(-1deg);
        cursor: pointer;
    }

    .lock-bar:hover { background: var(--blood); }

    /* --- ANIMATIONS (The "Parkinson's Jitter") --- */
    @keyframes jitter {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(2px, 2px) rotate(1deg); }
        50% { transform: translate(-1px, -2px) rotate(-1deg); }
        75% { transform: translate(-3px, 1px) rotate(0.5deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }
</style>
</head>
<body>

    <header>
        <h1>The University<br>of Free Will</h1>
        <div class="subtitle">"NOT THE UNIVERSE. THE UNIVERSITY."</div>
    </header>

    <!-- THE DISJOINTED MAN (The Interface) -->
    <div class="anatomy-container">
        
        <!-- 1. MIND (Head) -->
        <a href="#mind" class="part head-part">
            <div class="label">The Mind<br><small>Eyes Wide Open</small></div>
        </a>

        <!-- 2. SOUL (Torso) -->
        <div class="part torso-part">
            <div class="label" style="top: 70%;">The Soul<br><small>Connection</small></div>
        </div>

        <!-- 3. BODY (Legs) -->
        <a href="#body" class="part legs-part">
            <div class="label">The Body<br><small>Ministry of Silly Walks</small></div>
        </a>

        <!-- The "Stiff" Arm (Decorative) -->
        <div class="arm-part"></div>

        <!-- 4. THE TONIC (Heart) -->
        <a href="#login" class="tonic-heart" title="Login to find the Tonic"></a>

    </div>

    <!-- THE PAYWALL -->
    <div class="lock-bar" onclick="alert('Please Login to Access the University Tools')">
        /// ACCESS RESTRICTED: STUDENT ID REQUIRED ///
    </div>

    <!-- FOOTER TEXT (Source 157) -->
    <div style="position: absolute; bottom: 80px; right: 20px; width: 200px; text-align: right; font-family: 'Courier New'; font-size: 0.7rem;">
        <p>
            <strong>FILE 51-PD:</strong><br>
            A creative testimony to resilience.<br>
            <span style="background: var(--tonic);">"A sliver of gold beneath the rubble."</span>
        </p>
    </div>

</body>
</html>
