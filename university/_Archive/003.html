<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The University of Free Will</title>
  <style>
        body { margin: 0; overflow: hidden; background-color: #475569; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        
        /* Intro UI */
        #intro-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; transition: opacity 1.5s ease, visibility 1.5s;
        }
        #intro-text { font-size: 1.5rem; font-weight: 300; max-width: 600px; line-height: 1.6; margin-bottom: 40px; font-style: italic; transition: opacity 0.8s ease; }
        #enter-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.4); color: white;
            padding: 12px 30px; text-transform: uppercase; letter-spacing: 3px; cursor: pointer;
            font-size: 0.8rem; transition: all 0.3s ease; opacity: 0; pointer-events: none;
        }
        #enter-btn:hover { background: white; color: #1e293b; }
        #skip-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.4); background: none; border: none;
            cursor: pointer; font-size: 0.7rem; letter-spacing: 2px; z-index: 101; text-transform: uppercase;
        }

        /* Swiss HUD (guide.html integration) */
        .hud-element { position: absolute; z-index: 5; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; }
        .hud-active { opacity: 1; pointer-events: auto; }

        #brand-box { top: 30px; left: 30px; background: #111; color: white; padding: 15px 25px; border-left: 5px solid #ef4444; }
        #brand-box h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; line-height: 1; letter-spacing: 2px; }
        
        #status-box { top: 30px; right: 30px; }
        .btn-login { background: #ef4444; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }

        #controls-box { 
            bottom: 30px; left: 30px; background: rgba(255,255,255,0.9); 
            padding: 15px; font-family: 'Courier New', monospace; font-size: 0.75rem; 
            border: 1px solid #ccc; color: #111;
        }
        .control-row { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 5px; }

        #directory-box { bottom: 30px; right: 30px; text-align: right; }
        .building-tag { 
            display: block; background: white; padding: 8px 15px; margin-bottom: 5px; 
            font-size: 0.8rem; font-weight: bold; text-transform: uppercase; border-right: 5px solid #ccc;
            cursor: pointer; transition: transform 0.2s;
        }
        .tag-red { border-color: #ef4444; }
        .tag-blue { border-color: #3b82f6; }
        .tag-yellow { border-color: #facc15; }
        .building-tag:hover { transform: translateX(-10px); background: #111; color: white; }

        #tooltip { position: absolute; padding: 10px 15px; background: rgba(15, 23, 42, 0.95); color: #fff; display: none; font-size: 11px; font-weight: 700; transform: translate(-50%, -100%); z-index: 10; }
    </style>
 </head>
 <body>

  <audio id="explore-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>
  <button id="skip-btn" onclick="endIntro()">[ Skip >> ]</button>

  <div id="intro-overlay">
    <div id="intro-text"></div>
    <button id="enter-btn">Explore Campus</button>
  </div>

  <div id="brand-box" class="hud-element">
      <h1>University<br>of Free Will</h1>
      <div style="font-family: 'Courier New'; font-size: 0.7rem; margin-top: 5px; opacity: 0.8;">ART // SCIENCE // SPIRIT</div>
  </div>

  <div id="status-box" class="hud-element">
      <button class="btn-login" onclick="alert('Student ID Required')">Insert Student ID</button>
  </div>

  <div id="controls-box" class="hud-element">
      <div style="border-bottom:1px solid #ccc; margin-bottom:10px; padding-bottom:5px; font-weight: bold;">NAVIGATION</div>
      <div class="control-row"><span>L-CLICK</span> <span>ROTATE</span></div>
      <div class="control-row"><span>R-CLICK</span> <span>PAN</span></div>
      <div class="control-row"><span>SCROLL</span> <span>ZOOM</span></div>
  </div>

  <div id="directory-box" class="hud-element">
      <div class="building-tag tag-red" onclick="focusOn('art')">Dept. of Art</div>
      <div class="building-tag tag-blue" onclick="focusOn('science')">Dept. of Science</div>
      <div class="building-tag tag-yellow" onclick="focusOn('spirit')">Dept. of Spirit</div>
  </div>

  <div id="tooltip"></div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
        let scene, camera, renderer, raycaster, mouse, controls;
        let specialBlocks = [], atomGroup, spiritBeam, spiritGlowVolume;
        let introActive = true;
        
        const introQuotes = [
            "Welcome to the University of Free Will.",
            "A framework of knowledge, wisdom and beauty",
            "Where the more you learn, the more you realize you know nothing.",
            "Where letting go of control equals freedom"
        ];

        window.onload = () => { init(); animate(); runIntroSequence(); };

        async function runIntroSequence() {
            const el = document.getElementById('intro-text');
            for (let quote of introQuotes) {
                if (!introActive) break;
                el.style.opacity = 0;
                await new Promise(r => setTimeout(r, 800));
                if (!introActive) break;
                el.innerText = quote;
                el.style.opacity = 1;
                await new Promise(r => setTimeout(r, 2800));
            }
            if (introActive) {
                document.getElementById('enter-btn').style.opacity = 1;
                document.getElementById('enter-btn').style.pointerEvents = 'auto';
            }
        }

        function endIntro() {
            if (!introActive) return;
            introActive = false;
            document.getElementById('explore-sound').play().catch(()=>{});
            document.getElementById('intro-overlay').style.opacity = 0;
            document.getElementById('skip-btn').style.display = 'none';
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                document.querySelectorAll('.hud-element').forEach(el => el.classList.add('hud-active'));
                controls.autoRotate = false;
            }, 1000);
        }

        document.getElementById('enter-btn').onclick = endIntro;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x475569);
            scene.fog = new THREE.Fog(0x475569, 30, 110);
            
            const aspect = window.innerWidth / window.innerHeight;
            const d = 16;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(40, 40, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.autoRotate = true;
            controls.autoRotateSpeed = 2.0;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(20, 50, 10);
            light.castShadow = true;
            scene.add(light);

            createCampus();
            window.addEventListener('mousemove', onMouseMove);
        }

        function createCampus() {
            const SPACING = 1.6;
            const center = (14 * SPACING) / 2;
            const matCampus = new THREE.MeshStandardMaterial({ color: 0xd1d5db });
            
            for (let x = 0; x < 14; x++) {
                for (let z = 0; z < 14; z++) {
                    let mesh, type = "campus";
                    const posX = x * SPACING - center;
                    const posZ = z * SPACING - center;

                    if (x === 6 && z === 7) { // Art
                        type = "art";
                        mesh = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.BoxGeometry(0.8, 6.5, 0.8), new THREE.MeshStandardMaterial({color: 0xef4444}));
                        core.position.y = 3.25;
                        mesh.add(core);
                        const shardData = [[4.5, 1.5], [3, 3.8], [5.5, 2.6]];
                        shardData.forEach(d => {
                            const s = new THREE.Mesh(new THREE.BoxGeometry(d[0], 0.8, 2.5), new THREE.MeshStandardMaterial({color: 0xffffff}));
                            s.position.y = d[1];
                            s.rotation.y = Math.random();
                            mesh.add(s);
                        });
                    } else if (x === 10 && z === 3) { // Science
                        type = "science";
                        mesh = new THREE.Group();
                        atomGroup = new THREE.Group();
                        const nuc = new THREE.Mesh(new THREE.SphereGeometry(0.6), new THREE.MeshStandardMaterial({color: 0x3b82f6}));
                        atomGroup.add(nuc);
                        const ring = new THREE.TorusGeometry(1.4, 0.05, 12, 64);
                        for(let i=0; i<3; i++) {
                            const r = new THREE.Mesh(ring, new THREE.MeshBasicMaterial({color: 0x60a5fa}));
                            r.rotation.set(i, i, 0);
                            atomGroup.add(r);
                        }
                        atomGroup.position.y = 4.8;
                        mesh.add(atomGroup);
                    } else if (x === 3 && z === 10) { // Spirit
                        type = "spirit";
                        mesh = new THREE.Group();
                        spiritBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.4, 18), new THREE.MeshBasicMaterial({color: 0xffff00}));
                        spiritBeam.position.y = 9;
                        mesh.add(spiritBeam);
                    } else {
                        const h = 0.4 + Math.random() * 1.1;
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1, h, 1), matCampus);
                        mesh.position.y = h/2;
                    }
                    mesh.position.set(posX, 0, posZ);
                    mesh.userData = { type };
                    if(type !== "campus") specialBlocks.push(mesh);
                    scene.add(mesh);
                }
            }
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({color: 0x1e293b}));
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);
        }

        function onMouseMove(e) {
            if (introActive) return;
            mouse.x = (e.clientX/window.innerWidth)*2-1;
            mouse.y = -(e.clientY/window.innerHeight)*2+1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(specialBlocks, true);
            const tt = document.getElementById('tooltip');
            if (hits.length > 0) {
                tt.style.display = 'block';
                tt.style.left = e.clientX + 'px';
                tt.style.top = e.clientY + 'px';
                tt.innerText = "DEPARTMENT OF " + hits[0].object.parent.userData.type.toUpperCase();
            } else tt.style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            const t = Date.now() * 0.001;
            if (atomGroup) { atomGroup.rotation.y += 0.02; atomGroup.position.y += Math.sin(t*2)*0.005; }
            if (spiritBeam) spiritBeam.scale.x = 1 + Math.sin(t*4)*0.05;
            renderer.render(scene, camera);
        }

        function focusOn(type) {
            const target = specialBlocks.find(b => b.userData.type === type);
            if(target) {
                controls.target.set(target.position.x, 2, target.position.z);
                camera.zoom = 2; camera.updateProjectionMatrix();
            }
        }
    </script>
 </body>
</html>
