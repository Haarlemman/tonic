<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The University of Free Will | A Schematic</title>
  <!-- Google Fonts for that vintage drafting/bookish look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baskervville:italic@0;1&family=Space+Mono:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
        :root {
            --paper: #f1ede1;
            --ink: #2a2825;
            --accent-red: #b94a3e;
            --accent-blue: #5d7a8c;
            --accent-yellow: #d4a34f;
            --line-weight: 1px;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: var(--paper); 
            font-family: 'Baskervville', serif; 
            color: var(--ink);
        }

        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            cursor: crosshair; 
        }
        
        /* Intro Overlay - Melancholic & Quiet */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--paper);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 2s ease, visibility 2s;
        }
        #intro-text {
            font-size: 1.4rem;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 60px;
            padding: 0 40px;
            font-style: italic;
        }

        .action-btn {
            background: transparent;
            border: var(--line-weight) solid var(--ink);
            color: var(--ink);
            padding: 10px 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: 'Space Mono', monospace;
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            background: var(--ink);
            color: var(--paper);
        }

        /* The "Diagrammatic" HUD */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
            z-index: 50;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .brand-box {
            background: white;
            padding: 20px;
            border: var(--line-weight) solid var(--ink);
            pointer-events: auto;
            max-width: 200px;
            box-shadow: 4px 4px 0px var(--ink);
        }
        h1 { 
            margin: 0; 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            line-height: 1.1; 
            font-family: 'Libre Baskerville', serif;
            border-bottom: var(--line-weight) solid var(--ink);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .sub-brand { 
            font-family: 'Space Mono', monospace; 
            font-size: 0.6rem; 
            color: var(--ink);
            text-transform: uppercase;
        }

        .status-box { 
            pointer-events: auto; 
            display: flex; 
            flex-direction: column;
            gap: 5px; 
            align-items: flex-end; 
        }
        
        .hud-btn {
            background: white;
            color: var(--ink);
            border: var(--line-weight) solid var(--ink);
            padding: 5px 12px;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.65rem;
            font-family: 'Space Mono', monospace;
        }
        .hud-btn:hover { background: var(--paper); }

        /* The "Faculty" Panel - Small and Isolated */
        #faculty-screen {
            position: absolute;
            width: 220px;
            background: white;
            border: var(--line-weight) solid var(--ink);
            padding: 20px;
            display: none;
            flex-direction: column;
            pointer-events: none;
            z-index: 80;
            opacity: 0;
            transition: opacity 0.5s ease;
            transform: translate(-50%, -130%);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.1);
        }
        #faculty-screen.active { display: flex; opacity: 1; }
        .faculty-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            text-transform: uppercase;
            border-bottom: 1px solid #ddd;
            margin-bottom: 10px;
            padding-bottom: 5px;
            color: #888;
        }
        .neon-text {
            font-family: 'Libre Baskerville', serif;
            font-size: 1rem;
            line-height: 1.4;
            min-height: 3em;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Directory - Stacked Ledger Style */
        .directory-box { pointer-events: auto; width: 180px; }
        .building-tag {
            display: block;
            background: white;
            padding: 8px 15px;
            margin-bottom: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            border: var(--line-weight) solid var(--ink);
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            transition: all 0.2s;
        }
        .tag-red { border-left: 8px solid var(--accent-red); }
        .tag-blue { border-left: 8px solid var(--accent-blue); }
        .tag-yellow { border-left: 8px solid var(--accent-yellow); }
        .building-tag:hover { background: var(--paper); transform: translateX(5px); }

        #tooltip {
            position: absolute;
            padding: 5px 10px;
            background: var(--ink);
            color: var(--paper);
            pointer-events: none;
            display: none;
            font-size: 10px;
            font-family: 'Space Mono', monospace;
            z-index: 60;
            transform: translate(15px, 15px);
        }

        /* Grainy Texture Overlay */
        #texture-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 200;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3%3Ffilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
 </head>
 <body>

  <div id="texture-overlay"></div>

  <audio id="bg-music" loop crossorigin="Paradox Prime">
    <!-- A more muted, acoustic or minimalist piano loop would be ideal here -->
    <source src="audio/MysteriousHeartbeat1.mp3" type="audio/mpeg">
  </audio>

  <div id="intro-overlay">
    <div id="intro-text"></div>
    <div class="intro-btns">
        <button id="skip-btn" class="action-btn">Open the Ledger</button>
    </div>
  </div>

  <div id="faculty-screen">
    <div class="faculty-title">Observation Log</div>
    <div id="screen-content" class="neon-text"></div>
  </div>

  <div id="hud-layer">
    <div style="display:flex; justify-content:space-between; align-items: flex-start;">
        <div class="brand-box">
            <h1>The University<br>of Free Will</h1>
            <div class="sub-brand">A Framework for Paradox</div>
        </div>
        <div class="status-box">
            <button class="hud-btn" onclick="toggleMusic()" id="music-toggle">Audio: Off</button>
            <button class="hud-btn" onclick="showMap()">Full Schematic</button>
        </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div style="font-family: 'Space Mono', monospace; font-size: 0.6rem; background: white; padding: 15px; border: var(--line-weight) solid var(--ink); pointer-events: auto; box-shadow: 4px 4px 0px rgba(0,0,0,0.05);">
            <div style="border-bottom:1px solid var(--ink); margin-bottom:10px; padding-bottom:5px; font-weight:bold;">OPERATIONAL STATUS</div>
            <div style="display:flex; justify-content:space-between; gap: 40px;"><span>SYSTEM CLOCK</span> <span>LINEAR</span></div>
            <div style="display:flex; justify-content:space-between;"><span>WILL OBSERVED</span> <span>0.00%</span></div>
        </div>

        <div class="directory-box">
            <div class="building-tag tag-red" onclick="focusBuilding('art')">Beauty</div>
            <div class="building-tag tag-blue" onclick="focusBuilding('science')">Knowledge</div>
            <div class="building-tag tag-yellow" onclick="focusBuilding('spirit')">Wisdom</div>
        </div>
    </div>
  </div>

  <div id="tooltip"></div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
        let scene, camera, renderer, raycaster, mouse, controls;
        let specialBlocks = [];
        let leaderLines = [];
        let atomGroup, spiritBeam;
        
        let introActive = true;
        let skipRequested = false;
        let cinematicTarget = null;
        let lastZoomTime = 0;
        let lastQuoteTime = 0;
        const ZOOM_INTERVAL = 12000; 
        const QUOTE_INTERVAL = 4000; 

        const tooltip = document.getElementById('tooltip');
        const introTextEl = document.getElementById('intro-text');
        const skipBtn = document.getElementById('skip-btn');
        const hudLayer = document.getElementById('hud-layer');
        const bgMusic = document.getElementById('bg-music');
        const musicToggleBtn = document.getElementById('music-toggle');
        const facultyScreen = document.getElementById('faculty-screen');
        const screenContent = document.getElementById('screen-content');

        const facultyData = {
            art: { quotes: ["Truth is beauty, however painful.", "The canvas is never truly finished.", "Aesthetics are a secondary survival trait.", "Mind is a brush with no bristles."], color: "#b94a3e" },
            science: { quotes: ["The map is not the territory.", "Entropy is a polite way of saying goodbye.", "Observation collapses the possibility of joy.", "Knowledge is a heavy suitcase."], color: "#5d7a8c" },
            spirit: { quotes: ["Free will is a useful fiction.", "Letting go is a mechanical process.", "The void has a quiet humming sound.", "Silence is the only honest data."], color: "#d4a34f" }
        };

        const introQuotes = [
            "It was a university, in a manner of speaking.",
            "A framework where control was an illusion...",
            "...and the more you learned, the quieter it became.",
            "Where adversity was simply another piece of the furniture.",
            "Welcome to the University of Free Will."
        ];

        window.onload = function() {
            init();
            animate();
            runIntroSequence();
            skipBtn.onclick = (e) => { e.stopPropagation(); startExperience(); };
        };

        async function typeText(text, element) {
            element.innerHTML = '';
            for (let i = 0; i < text.length; i++) {
                if (skipRequested) return;
                element.innerHTML += text.charAt(i);
                await new Promise(r => setTimeout(r, 40));
            }
        }

        async function runIntroSequence() {
            for (let quote of introQuotes) {
                if (skipRequested) break;
                await typeText(quote, introTextEl);
                if (skipRequested) break;
                await new Promise(r => setTimeout(r, 2000));
                if (skipRequested) break;
                introTextEl.style.opacity = 0;
                await new Promise(r => setTimeout(r, 800));
                introTextEl.innerHTML = '';
                introTextEl.style.opacity = 1;
            }
        }

        function startExperience() {
            skipRequested = true;
            introActive = false;
            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                hudLayer.style.opacity = 1;
                lastZoomTime = Date.now();
            }, 1000);
        }

        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play();
                musicToggleBtn.innerText = "Audio: On";
            } else {
                bgMusic.pause();
                musicToggleBtn.innerText = "Audio: Off";
            }
        }

        function showMap() {
            cinematicTarget = null;
            facultyScreen.classList.remove('active');
        }

        function focusBuilding(type) {
            const b = specialBlocks.find(b => b.userData.type === type);
            if (b) {
                cinematicTarget = b;
                lastZoomTime = Date.now();
                lastQuoteTime = Date.now();
                updateFacultyScreen(type);
                facultyScreen.classList.add('active');
            }
        }

        function updateFacultyScreen(type) {
            const data = facultyData[type];
            const quotes = data.quotes;
            screenContent.innerText = quotes[Math.floor(Math.random() * quotes.length)];
            screenContent.style.color = data.color;
        }

        function createTextSprite(text, color = "#2a2825") {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 128;
            ctx.fillStyle = 'white';
            ctx.fillRect(50, 20, 412, 88);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.strokeRect(50, 20, 412, 88);
            ctx.fillStyle = color;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 36px "Space Mono"'; ctx.fillText(text, 256, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
            sprite.scale.set(4, 1, 1);
            return sprite;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf1ede1); // Paper color
            
            const aspect = window.innerWidth / window.innerHeight;
            const d = 16;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(45, 45, 45);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.15;

            // Soft lighting for a flat, illustrated look
            const ambient = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.4);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            createCampus();
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', onMouseMove, false);
        }

        function createCampus() {
            const SPACING = 1.6; const GRID = 14; const centerOffset = (GRID * SPACING) / 2;
            const matCampus = new THREE.MeshStandardMaterial({ color: 0xd9d4c5, roughness: 1 });
            const matLine = new THREE.LineBasicMaterial({ color: 0x2a2825 });

            for (let x = 0; x < GRID; x++) {
                for (let z = 0; z < GRID; z++) {
                    let mesh; let type = "campus"; let labelText = ""; 
                    
                    if (x === 6 && z === 7) {
                        type = "art"; labelText = "BEAUTY";
                        mesh = new THREE.Group();
                        const g = new THREE.Mesh(new THREE.BoxGeometry(1.2, 5, 1.2), new THREE.MeshStandardMaterial({ color: 0xb94a3e }));
                        g.position.y = 2.5; mesh.add(g);
                        const top = new THREE.Mesh(new THREE.BoxGeometry(3, 0.5, 3), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                        top.position.y = 5; mesh.add(top);
                    } else if (x === 10 && z === 3) {
                        type = "science"; labelText = "KNOWLEDGE";
                        mesh = new THREE.Group();
                        const p = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1, 4, 4), new THREE.MeshStandardMaterial({ color: 0x5d7a8c }));
                        p.position.y = 2; mesh.add(p);
                        atomGroup = new THREE.Group();
                        atomGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshStandardMaterial({color:0xffffff})));
                        atomGroup.position.y = 5.5; mesh.add(atomGroup);
                    } else if (x === 3 && z === 10) {
                        type = "spirit"; labelText = "WISDOM";
                        mesh = new THREE.Group();
                        spiritBeam = new THREE.Mesh(new THREE.BoxGeometry(0.5, 15, 0.5), new THREE.MeshStandardMaterial({ color: 0xd4a34f }));
                        spiritBeam.position.y = 7.5; mesh.add(spiritBeam);
                    } else {
                        let h = 0.5 + Math.random() * 2;
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1, h, 1), matCampus);
                        mesh.position.y = h/2;
                    }

                    mesh.position.set(x * SPACING - centerOffset, 0, z * SPACING - centerOffset);
                    mesh.userData = { type, label: labelText || "UNMARKED UNIT" };
                    scene.add(mesh);

                    // Outlines for that Ware drawing style
                    const edges = new THREE.EdgesGeometry(mesh.children[0]?.geometry || mesh.geometry);
                    const line = new THREE.LineSegments(edges, matLine);
                    mesh.add(line);

                    if (type !== "campus") {
                        specialBlocks.push(mesh);
                        const label = createTextSprite(labelText, facultyData[type].color);
                        label.position.set(mesh.position.x, 8, mesh.position.z);
                        scene.add(label);
                        
                        // Thin connector line
                        const pts = [new THREE.Vector3(mesh.position.x, 1, mesh.position.z), new THREE.Vector3(mesh.position.x, 7.5, mesh.position.z)];
                        const conn = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), matLine);
                        scene.add(conn);
                    }
                }
            }
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0xf1ede1 }));
            floor.rotation.x = -Math.PI/2; scene.add(floor);
        }

        function onMouseMove(event) {
            if (introActive) return;
            mouse = mouse || new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster = raycaster || new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(specialBlocks, true);
            if (intersects.length > 0) {
                let t = intersects[0].object; while (t.parent && !t.userData.type) t = t.parent;
                tooltip.style.display = 'block'; tooltip.style.left = event.clientX + 'px'; tooltip.style.top = event.clientY + 'px';
                tooltip.innerHTML = t.userData.label;
            } else tooltip.style.display = 'none';
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight; const d = 16;
            camera.left = -d * aspect; camera.right = d * aspect;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const now = Date.now();

            if (atomGroup) { atomGroup.rotation.y += 0.01; atomGroup.rotation.z += 0.005; }
            if (spiritBeam) { spiritBeam.scale.x = 1 + Math.sin(time) * 0.1; }

            if (!introActive && now - lastZoomTime > ZOOM_INTERVAL) {
                if (cinematicTarget) { cinematicTarget = null; facultyScreen.classList.remove('active'); } 
                else { cinematicTarget = specialBlocks[Math.floor(Math.random() * specialBlocks.length)]; }
                lastZoomTime = now;
            }

            if (cinematicTarget) {
                controls.target.lerp(cinematicTarget.position.clone(), 0.05);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 2.5, 0.03);
                if (now - lastQuoteTime > QUOTE_INTERVAL) { updateFacultyScreen(cinematicTarget.userData.type); lastQuoteTime = now; }
                const v = cinematicTarget.position.clone(); v.y += 3; v.project(camera);
                facultyScreen.style.left = (v.x * .5 + .5) * window.innerWidth + 'px';
                facultyScreen.style.top = (v.y * -.5 + .5) * window.innerHeight + 'px';
            } else {
                controls.target.lerp(new THREE.Vector3(0,0,0), 0.02);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.02);
            }

            camera.updateProjectionMatrix(); controls.update(); renderer.render(scene, camera);
        }
    </script>
 </body>
</html>
