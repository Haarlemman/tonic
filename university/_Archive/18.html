<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The University of Free Will</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        
        /* UI Overlay */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #333;
            z-index: 5;
        }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }
        p { font-size: 0.9rem; opacity: 0.7; }

        /* Tooltip style */
        #tooltip {
            position: absolute;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            font-size: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: translate(-50%, -100%);
            margin-top: -10px;
            z-index: 10;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 11px;
            color: #888;
            text-align: right;
            background: rgba(240, 240, 240, 0.8);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>University of Free Will</h1>
        <p>A multidimensional campus of Art, Science, and Spirit.</p>
    </div>

    <div id="tooltip"></div>

    <div class="controls-hint">
        LEFT CLICK + DRAG: ROTATE/TILT<br>
        RIGHT CLICK + DRAG: PAN<br>
        SCROLL: ZOOM<br>
        CLICK SPECIAL OBJECTS TO ENTER
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, raycaster, mouse, controls;
        let blocks = [];
        let specialBlocks = [];
        const tooltip = document.getElementById('tooltip');

        // Configuration
        const GRID_SIZE = 14;
        const SPACING = 1.3;
        
        window.onload = function() {
            init();
            animate();
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);
            scene.fog = new THREE.Fog(0xf5f5f5, 15, 60);

            const aspect = window.innerWidth / window.innerHeight;
            const d = 12;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(25, 25, 25);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // OrbitControls for Tilt, Zoom, and Pan
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = true;
            controls.minZoom = 0.5;
            controls.maxZoom = 3;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(15, 30, 10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);

            createCampus();

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('mousedown', onMouseDown, false);
        }

        function createCampus() {
            const boxGeom = new THREE.BoxGeometry(1, 1, 1);
            
            // Materials
            const materials = {
                campus: new THREE.MeshLambertMaterial({ color: 0xdddddd }),
                art: new THREE.MeshLambertMaterial({ color: 0xef4444 }),    // Red
                science: new THREE.MeshLambertMaterial({ color: 0x3b82f6 }),// Blue
                spirit: new THREE.MeshStandardMaterial({ 
                    color: 0xffffcc, 
                    emissive: 0xfff000, 
                    emissiveIntensity: 0.8,
                    transparent: true,
                    opacity: 0.8 
                }),
                register: new THREE.MeshLambertMaterial({ color: 0x222222 }), // Black
                info: new THREE.MeshLambertMaterial({ color: 0x22c55e })      // Green
            };

            const centerOffset = (GRID_SIZE * SPACING) / 2;

            for (let x = 0; x < GRID_SIZE; x++) {
                for (let z = 0; z < GRID_SIZE; z++) {
                    
                    let type = "campus";
                    let label = "";
                    let link = "#";
                    let height = 0.4 + Math.random() * 1.2;
                    let mesh;

                    // ART: The Museum (Central Red Block)
                    if (x === 6 && z === 7) {
                        type = "art";
                        label = "THE MUSEUM (ART)";
                        link = "/art";
                        mesh = new THREE.Mesh(boxGeom, materials.art);
                        mesh.scale.set(1.5, 3.5, 1.5);
                        mesh.position.y = 1.75;
                    } 
                    // SCIENCE: Rocket (Blue Structure)
                    else if (x === 10 && z === 3) {
                        type = "science";
                        label = "THE ROCKET (SCIENCE)";
                        link = "/science";
                        const rocketGroup = new THREE.Group();
                        
                        // Rocket body
                        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 3, 8), materials.science);
                        body.position.y = 1.5;
                        rocketGroup.add(body);
                        
                        // Nose cone
                        const cone = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 8), new THREE.MeshLambertMaterial({color: 0xffffff}));
                        cone.position.y = 3.4;
                        rocketGroup.add(cone);
                        
                        mesh = rocketGroup;
                        mesh.position.y = 0;
                    }
                    // SPIRIT: Beam of Light (Yellow Column)
                    else if (x === 3 && z === 10) {
                        type = "spirit";
                        label = "THE BEAM OF LIGHT (SPIRIT)";
                        link = "/spirit";
                        mesh = new THREE.Group();
                        
                        const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 8, 16), materials.spirit);
                        beam.position.y = 4;
                        mesh.add(beam);
                        
                        // Add glow light
                        const light = new THREE.PointLight(0xfff000, 2, 10);
                        light.position.y = 4;
                        mesh.add(light);
                    }
                    // REGISTER: Black Block
                    else if (x === 2 && z === 2) {
                        type = "register";
                        label = "THE REGISTER";
                        link = "/register";
                        mesh = new THREE.Mesh(boxGeom, materials.register);
                        mesh.scale.set(1.2, 1.2, 1.2);
                        mesh.position.y = 0.6;
                    }
                    // INFO: Green Block
                    else if (x === 11 && z === 11) {
                        type = "info";
                        label = "INFORMATION";
                        link = "/info";
                        mesh = new THREE.Mesh(boxGeom, materials.info);
                        mesh.scale.set(1, 1, 1);
                        mesh.position.y = 0.5;
                    }
                    // Default Campus Blocks
                    else {
                        mesh = new THREE.Mesh(boxGeom, materials.campus);
                        mesh.scale.set(1, height, 1);
                        mesh.position.y = height / 2;
                    }

                    mesh.position.x = x * SPACING - centerOffset;
                    mesh.position.z = z * SPACING - centerOffset;
                    
                    mesh.traverse(child => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    mesh.userData = { type, label, link, originalY: mesh.position.y };

                    scene.add(mesh);
                    
                    if (type !== "campus") {
                        specialBlocks.push(mesh);
                        blocks.push(mesh); // Only raycast against special blocks for better UX
                    } else {
                        // We still add them to blocks if you want to click the floor, but let's keep it focused
                    }
                }
            }

            // Floor
            const planeGeom = new THREE.PlaneGeometry(50, 50);
            const planeMat = new THREE.ShadowMaterial({ opacity: 0.1 });
            const plane = new THREE.Mesh(planeGeom, planeMat);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = 0;
            plane.receiveShadow = true;
            scene.add(plane);
            
            const gridHelper = new THREE.GridHelper(40, 40, 0xcccccc, 0xeeeeee);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            checkIntersections(event);
        }

        function checkIntersections(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(specialBlocks, true);

            if (intersects.length > 0) {
                // Find the top-level group or mesh that has our userData
                let target = intersects[0].object;
                while (target.parent && !target.userData.type) {
                    target = target.parent;
                }

                if (target.userData.type && target.userData.type !== "campus") {
                    document.body.style.cursor = 'pointer';
                    tooltip.style.display = 'block';
                    tooltip.style.left = event.clientX + 'px';
                    tooltip.style.top = event.clientY + 'px';
                    tooltip.innerText = target.userData.label;
                }
            } else {
                document.body.style.cursor = 'grab';
                tooltip.style.display = 'none';
            }
        }

        function onMouseDown(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(specialBlocks, true);

            if (intersects.length > 0) {
                let target = intersects[0].object;
                while (target.parent && !target.userData.type) {
                    target = target.parent;
                }
                
                if (target.userData.type && target.userData.type !== "campus") {
                    console.log("Entering: " + target.userData.label);
                    // Visual feedback
                    target.scale.multiplyScalar(1.2);
                    setTimeout(() => target.scale.divideScalar(1.2), 150);
                }
            }
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 12;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Animate the beam of light (Spirit)
            specialBlocks.forEach(b => {
                if (b.userData.type === "spirit") {
                    b.rotation.y += 0.01;
                    const scale = 1 + Math.sin(Date.now() * 0.002) * 0.05;
                    b.scale.set(scale, 1, scale);
                }
                if (b.userData.type === "science") {
                    // Slight rocket jitter/hover
                    b.position.y = Math.sin(Date.now() * 0.005) * 0.2;
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
