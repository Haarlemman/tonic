<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The University of Free Will</title>
  <style>
        body { margin: 0; overflow: hidden; background-color: #64748b; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; opacity: 1; transition: opacity 0.5s ease; }
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        
        /* Intro Overlay */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            transition: opacity 1.5s ease, visibility 1.5s;
        }
        #intro-text {
            font-size: 1.5rem;
            font-weight: 300;
            max-width: 600px;
            min-height: 100px;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 0 20px;
            letter-spacing: 1px;
            transition: opacity 0.8s ease;
            font-style: italic;
        }
        .intro-btns {
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 15px;
        }
        .action-btn {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 15px 40px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            opacity: 1;
            pointer-events: auto;
            min-width: 260px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .action-btn:hover {
            background: white;
            color: #1e293b;
            border-color: white;
            transform: scale(1.05);
        }

        /* Faculty Screen Overlay - Now Pinned to building */
        #faculty-screen {
            position: absolute;
            width: 280px;
            background: #000;
            border: 2px solid rgba(255,255,255,0.1);
            padding: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 80;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            transform: translate(-50%, -120%); /* Sit just above the pivot point */
        }
        #faculty-screen.active { display: flex; opacity: 1; }
        .neon-text {
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.2;
            min-height: 3em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .neon-art { color: #ff3e3e; text-shadow: 0 0 8px #ef4444; }
        .neon-science { color: #3e9bff; text-shadow: 0 0 8px #3b82f6; }
        .neon-spirit { color: #ffff3e; text-shadow: 0 0 8px #facc15; }
        .screen-sub {
            color: #444;
            font-size: 0.55rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-top: 1px solid #222;
            padding-top: 8px;
        }

        /* --- HUD --- */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
            z-index: 50;
            opacity: 0;
            transition: opacity 1.5s ease;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .brand-box {
            background: #111;
            color: white;
            padding: 15px 25px;
            display: inline-block;
            pointer-events: auto;
            border-left: 5px solid #ffcc00; 
        }

        h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; line-height: 1; }
        .sub-brand { font-family: 'Courier New', monospace; font-size: 0.7rem; margin-top: 5px; }

        .status-box { pointer-events: auto; text-align: right; display: flex; gap: 10px; justify-content: flex-end; align-items: flex-start; }
        
        .hud-btn {
            background: #111;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.7rem;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .hud-btn:hover { background: white; color: black; border-color: white; }
        .btn-red { background: #ef4444; border-color: #ef4444; }

        #general-menu {
            position: absolute;
            top: 80px;
            right: 30px;
            background: #111;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            width: 200px;
            display: none;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        #general-menu.active { display: flex; }
        .menu-link {
            color: #999;
            text-decoration: none;
            font-size: 0.75rem;
            padding: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: color 0.2s;
        }
        .menu-link:hover { color: white; }

        .controls-box {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #666;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border: 1px solid #ccc;
            pointer-events: auto;
            max-width: 250px;
            backdrop-filter: blur(4px);
        }
        .control-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .key { font-weight: bold; color: #111; }

        .directory-box { pointer-events: auto; text-align: right; }
        .building-tag {
            display: block;
            background: white;
            padding: 8px 15px;
            margin-bottom: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            border-right: 5px solid #ccc;
            transition: all 0.2s;
            cursor: pointer;
            color: #111;
        }
        .tag-red { border-color: #ef4444; }
        .tag-blue { border-color: #3b82f6; }
        .tag-yellow { border-color: #facc15; }
        .building-tag:hover { transform: translateX(-10px); background: #111; color: white; }

        #tooltip {
            position: absolute;
            padding: 10px 15px;
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            pointer-events: none;
            display: none;
            font-size: 11px;
            font-weight: 700;
            z-index: 60;
            transform: translate(-50%, -100%);
            margin-top: -15px;
        }

        .highlight-art { color: #fff; text-decoration: underline #ef4444; }
        .highlight-science { color: #fff; text-decoration: underline #4444ef; }
        .highlight-spirit { color: #fff; text-decoration: underline #efef44; }
        
        #audio-status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 40;
            opacity: 0;
            transition: opacity 2s;
        }
    </style>
 </head>
 <body>

  <audio id="bg-music" loop crossorigin="anonymous">
    <!-- Using a reliable high-quality ambient synth beat -->
    <source src="audio/MysteriousHeartbeat1.mp3" type="audio/mpeg">
  </audio>

  <div id="intro-overlay">
    <div id="intro-text"></div>
    <div class="intro-btns">
        <button id="skip-btn" class="action-btn">Learn</button>
    </div>
  </div>

  <!-- Faculty Quote Screen -->
  <div id="faculty-screen">
    <div id="screen-content" class="neon-text"></div>
    <div class="screen-sub">FACULTY DATA FEED</div>
  </div>

  <div id="hud-layer">
    <div style="display:flex; justify-content:space-between; align-items: flex-start;">
        <div class="brand-box">
            <h1>University<br>of Free Will</h1>
            <div class="sub-brand">ADVERSITY IS YOUR TEACHER</div>
        </div>
        <div class="status-box">
            <button class="hud-btn" onclick="toggleMusic()" id="music-toggle">Audio: On</button>
            <button class="hud-btn" onclick="toggleMenu()">Menu</button>
            <button class="hud-btn btn-red" onclick="alert('Student ID Required')">Login</button>
        </div>
        <div id="general-menu">
            <div style="color:white; font-size:0.6rem; padding:8px; border-bottom:1px solid #333; margin-bottom:5px;">CAMPUS DIRECTORY</div>
            <a href="#" class="menu-link">Registry</a>
            <a href="#" class="menu-link">Info Desk</a>
            <a href="#" class="menu-link" onclick="alert('Student Portal Offline')">Student Portal</a>
        </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div class="controls-box">
            <div style="border-bottom:1px solid #ccc; margin-bottom:10px; padding-bottom:5px; color:#111; font-weight:bold;">AUDIO-KINETIC FEED</div>
            <div class="control-row"><span class="key">BEAT SYNC</span> <span>ACTIVE</span></div>
            <div class="control-row"><span class="key">AUTO-TOUR</span> <span>ENGAGED</span></div>
            <div class="control-row"><span class="key">ORBITING</span> <span>L-DRAG</span></div>
        </div>

        <div class="directory-box">
            <div class="building-tag tag-red" onclick="focusBuilding('art')">Beauty (Art)</div>
            <div class="building-tag tag-blue" onclick="focusBuilding('science')">Knowledge (Science)</div>
            <div class="building-tag tag-yellow" onclick="focusBuilding('spirit')">Wisdom (Spirit)</div>
        </div>
    </div>
  </div>

  <div id="audio-status">Audio Kinetic Analysis Online</div>
  <div id="tooltip"></div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
        let scene, camera, renderer, raycaster, mouse, controls;
        let specialBlocks = [];
        let leaderLines = [];
        let atomGroup, spiritBeam, spiritGlowVolume;
        
        let audioCtx, analyser, dataArray;
        let audioInitialized = false;
        let beatLevel = 0;

        let introActive = true;
        let skipRequested = false;
        let cinematicTarget = null;
        let lastZoomTime = 0;
        let lastQuoteTime = 0;
        const ZOOM_INTERVAL = 14000; 
        const QUOTE_INTERVAL = 2500; // Successive text speed

        const tooltip = document.getElementById('tooltip');
        const introTextEl = document.getElementById('intro-text');
        const skipBtn = document.getElementById('skip-btn');
        const hudLayer = document.getElementById('hud-layer');
        const bgMusic = document.getElementById('bg-music');
        const musicToggleBtn = document.getElementById('music-toggle');
        const facultyScreen = document.getElementById('faculty-screen');
        const screenContent = document.getElementById('screen-content');

        const facultyData = {
            art: {
                quotes: ["TRUTH IS BEAUTY", "CREATION IS DISCOVERY", "ESTHETICS OF THE SOUL", "FORM FOLLOWS FREEDOM", "THE CANVAS BLEEDS", "MIND IS THE BRUSH"],
                class: "neon-art",
                quoteIndex: 0
            },
            science: {
                quotes: ["ADVERSITY IS YOUR TEACHER", "MAP IS NOT TERRITORY", "THE MORE YOU KNOW, THE LESS YOU UNDERSTAND", "FRAMEWORKS OF REALITY", "ENTROPY IS KING", "OBSERVATION COLLAPSES"],
                class: "neon-science",
                quoteIndex: 0
            },
            spirit: {
                quotes: ["FREE WILL IS A PARADOX", "LETTING GO IS POWER", "SILENCE SPEAKS VOLUMES", "WISDOM THROUGH SURRENDER", "THE VOID IS FULL", "EGOS ARE ANCHORS"],
                class: "neon-spirit",
                quoteIndex: 0
            }
        };

        const introQuotes = [
            "Welcome to the University of Free Will.",
            "A framework of knowledge, wisdom and beauty.",
            "The more you learn, the more you realize you know nothing.",
            "Where letting go of control equals freedom.",
            "And where adversity becomes your teacher."
        ];

        window.onload = function() {
            init();
            animate();
            runIntroSequence();

            skipBtn.onclick = (e) => { e.stopPropagation(); startExperience(); };
        };

        function toggleMusic() {
            if (!audioInitialized) {
                initAudio();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (bgMusic.paused) {
                bgMusic.play();
                musicToggleBtn.innerText = "Audio: On";
            } else {
                bgMusic.pause();
                musicToggleBtn.innerText = "Audio: Off";
            }
        }

        async function runIntroSequence() {
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;

            for (let quote of introQuotes) {
                if (skipRequested) break;
                introTextEl.style.opacity = 0;
                await new Promise(r => setTimeout(r, 800));
                if (skipRequested) break;
                introTextEl.innerText = quote;
                introTextEl.style.opacity = 1;
                await new Promise(r => setTimeout(r, 3500));
            }
        }

        function initAudio() {
            if (audioInitialized) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(bgMusic);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioInitialized = true;
                document.getElementById('audio-status').style.opacity = 1;
            } catch(e) { console.log("Audio Error:", e); }
        }

        function startExperience() {
            skipRequested = true;
            introActive = false;
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            bgMusic.volume = 0.5;
            bgMusic.play().catch(() => console.log("Music failed - needs direct interaction."));

            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                hudLayer.style.opacity = 1;
                lastZoomTime = Date.now();
            }, 1000);
        }

        function focusBuilding(type) {
            const b = specialBlocks.find(b => b.userData.type === type);
            if (b) {
                cinematicTarget = b;
                lastZoomTime = Date.now();
                lastQuoteTime = Date.now();
                updateFacultyScreen(type);
                facultyScreen.classList.add('active');
            }
        }

        function updateFacultyScreen(type) {
            const data = facultyData[type];
            if (!data) return;
            screenContent.className = 'neon-text ' + data.class;
            screenContent.innerText = data.quotes[data.quoteIndex];
            data.quoteIndex = (data.quoteIndex + 1) % data.quotes.length;
        }

        function createTextSprite(text, color = "#ffffff", isIcon = false) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024;
            canvas.height = 256;
            
            if (!isIcon) {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                if (ctx.roundRect) ctx.roundRect(200, 64, 624, 128, 12);
                else ctx.fillRect(200, 64, 624, 128);
                ctx.fill();
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = color;

            if (isIcon && text === "i") {
                ctx.lineWidth = 14; ctx.strokeStyle = color;
                ctx.beginPath(); ctx.arc(512, 128, 80, 0, Math.PI * 2); ctx.stroke();
                ctx.font = 'Bold 80px Inter, Arial'; ctx.fillText("i", 512, 132);
            } else {
                ctx.font = 'Bold 48px Inter, Arial'; ctx.fillText(text, 512, 128);
            }

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(7.5, 1.875, 1);
            return sprite;
        }

        function createGradientTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 256, 0, 0);
            grad.addColorStop(0, 'white'); grad.addColorStop(0.7, 'rgba(255,255,255,0.2)'); grad.addColorStop(1, 'black');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 1, 256);
            return new THREE.CanvasTexture(canvas);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e293b); 
            scene.fog = new THREE.Fog(0x1e293b, 40, 140);

            const aspect = window.innerWidth / window.innerHeight;
            const d = 16;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(45, 45, 45);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(20, 50, 10);
            sun.castShadow = true;
            scene.add(sun);

            createCampus();

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', onMouseMove, false);
        }

        function createCampus() {
            const SPACING = 1.6;
            const GRID = 14;
            const centerOffset = (GRID * SPACING) / 2;
            const gradTexture = createGradientTexture();
            
            const materials = {
                campus: new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.6 }),
                museumWhite: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
                museumRed: new THREE.MeshStandardMaterial({ color: 0xef4444 }),
                science: new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8, emissiveIntensity: 0.5 }),
                spiritNeon: new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xfacc15, emissiveIntensity: 10, transparent: true, alphaMap: gradTexture }),
                spiritGlow: new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, alphaMap: gradTexture }),
                dottedLine: new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.2, gapSize: 0.2, transparent: true, opacity: 0.7 })
            };

            for (let x = 0; x < GRID; x++) {
                for (let z = 0; z < GRID; z++) {
                    let mesh;
                    let type = "campus";
                    let labelText = "";
                    let labelY = 0;

                    if (x === 6 && z === 7) {
                        type = "art"; labelText = "BEAUTY"; labelY = 11.5;
                        const g = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.BoxGeometry(0.8, 6.5, 0.8), materials.museumRed);
                        core.position.y = 3.25; g.add(core);
                        const shards = [
                            { size: [4.5, 0.8, 3], pos: [0, 1.5, 0], rot: [0.2, 0.1, 0.1] },
                            { size: [3, 0.8, 5], pos: [-0.5, 3.8, 0.5], rot: [-0.3, -0.4, 0.1] },
                            { size: [5.5, 0.4, 2.5], pos: [0.8, 2.6, -0.2], rot: [0.1, 0.6, -0.2] }
                        ];
                        shards.forEach(s => {
                            const sh = new THREE.Mesh(new THREE.BoxGeometry(...s.size), materials.museumWhite);
                            sh.position.set(...s.pos); sh.rotation.set(...s.rot); g.add(sh);
                        });
                        mesh = g;
                    } 
                    else if (x === 10 && z === 3) {
                        type = "science"; labelText = "KNOWLEDGE"; labelY = 11.5;
                        const g = new THREE.Group();
                        const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 1.2, 3, 4), materials.campus);
                        ped.position.y = 1.5; g.add(ped);
                        atomGroup = new THREE.Group();
                        const nuc = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 24), materials.science);
                        atomGroup.add(nuc);
                        const rGeom = new THREE.TorusGeometry(1.4, 0.05, 12, 64);
                        const rMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.8 });
                        [0, Math.PI/2].forEach((rot, i) => { const r = new THREE.Mesh(rGeom, rMat); if(i===1) r.rotation.x = rot; atomGroup.add(r); });
                        atomGroup.position.y = 4.8; g.add(atomGroup);
                        mesh = g;
                    }
                    else if (x === 3 && z === 10) {
                        type = "spirit"; labelText = "WISDOM"; labelY = 3.6;
                        mesh = new THREE.Group();
                        spiritBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.4, 18, 32), materials.spiritNeon);
                        spiritBeam.position.y = 9; mesh.add(spiritBeam);
                        spiritGlowVolume = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.9, 18, 32), materials.spiritGlow);
                        spiritGlowVolume.position.y = 9; mesh.add(spiritGlowVolume);
                    }
                    else {
                        let h = 0.3 + Math.random() * 2.2;
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), materials.campus);
                        mesh.scale.set(1, h, 1); mesh.position.y = h/2;
                    }

                    mesh.position.x = x * SPACING - centerOffset;
                    mesh.position.z = z * SPACING - centerOffset;
                    mesh.userData = { type, label: labelText || type };
                    scene.add(mesh);

                    if (type !== "campus") {
                        specialBlocks.push(mesh);
                        const label = createTextSprite(labelText, (type === 'spirit' ? '#fef08a' : '#ffffff'));
                        const off = (type === 'spirit') ? 3.5 : 1.2;
                        label.position.set(mesh.position.x + off, labelY, mesh.position.z + off);
                        scene.add(label);
                        const linePts = [new THREE.Vector3(mesh.position.x, 0.5, mesh.position.z), new THREE.Vector3(label.position.x, label.position.y, label.position.z)];
                        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(linePts), materials.dottedLine.clone());
                        line.computeLineDistances(); scene.add(line); leaderLines.push(line);
                    }
                }
            }
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
        }

        function onMouseMove(event) {
            if (introActive) return;
            mouse = mouse || new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster = raycaster || new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(specialBlocks, true);
            if (intersects.length > 0) {
                let t = intersects[0].object; while (t.parent && !t.userData.type) t = t.parent;
                tooltip.style.display = 'block';
                tooltip.style.left = event.clientX + 'px';
                tooltip.style.top = event.clientY + 'px';
                tooltip.innerHTML = `<span class="highlight-${t.userData.type}">${t.userData.label}</span>`;
            } else tooltip.style.display = 'none';
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 16;
            camera.left = -d * aspect; camera.right = d * aspect;
            camera.top = d; camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const now = Date.now();

            if (audioInitialized && !bgMusic.paused) {
                analyser.getByteFrequencyData(dataArray);
                let bass = 0; 
                for(let i=0; i<16; i++) bass += dataArray[i];
                beatLevel = (bass / 16 / 255) * 1.5; 

                if (controls.autoRotate) {
                    controls.autoRotateSpeed = 0.2 + (beatLevel * 6.0);
                }

                specialBlocks.forEach((b, idx) => {
                    const f = dataArray[10 + idx * 8] / 255;
                    const s = 1 + (f * 0.5) + (beatLevel * 0.3);
                    b.scale.lerp(new THREE.Vector3(s,s,s), 0.2);
                });
            } else {
                beatLevel = 0;
                if (controls.autoRotate && !introActive) controls.autoRotateSpeed = 0.2;
            }

            if (atomGroup) { 
                atomGroup.rotation.y += 0.03 + beatLevel * 0.2; 
                atomGroup.rotation.z += 0.02 + beatLevel * 0.2; 
            }
            if (spiritBeam) {
                const s = 1 + Math.sin(time * 5) * 0.1 + beatLevel * 0.8;
                spiritBeam.scale.set(s, 1, s);
                spiritGlowVolume.material.opacity = 0.1 + beatLevel * 0.6;
            }
            leaderLines.forEach(l => { 
                l.material.dashOffset -= 0.02 + beatLevel * 0.1; 
                l.material.opacity = 0.2 + beatLevel * 0.8; 
            });

            // Cinematic Logic & Fast Text Progression
            if (!introActive && now - lastZoomTime > ZOOM_INTERVAL) {
                if (cinematicTarget) {
                    cinematicTarget = null;
                    facultyScreen.classList.remove('active');
                } else {
                    const next = specialBlocks[Math.floor(Math.random() * specialBlocks.length)];
                    cinematicTarget = next;
                    facultyScreen.classList.add('active');
                }
                lastZoomTime = now;
            }

            if (cinematicTarget) {
                controls.target.lerp(cinematicTarget.position.clone(), 0.08);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 2.5, 0.04);
                
                // Rapid successive text cycle
                if (now - lastQuoteTime > QUOTE_INTERVAL) {
                    updateFacultyScreen(cinematicTarget.userData.type);
                    lastQuoteTime = now;
                }

                // Projection logic: Hug the building
                const vector = cinematicTarget.position.clone();
                vector.y += 2.5; // Offset above building base
                vector.project(camera);
                
                const x = (vector.x * .5 + .5) * window.innerWidth;
                const y = (vector.y * -.5 + .5) * window.innerHeight;
                
                facultyScreen.style.left = x + 'px';
                facultyScreen.style.top = y + 'px';

            } else {
                controls.target.lerp(new THREE.Vector3(0,0,0), 0.03);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.03);
            }
            camera.updateProjectionMatrix();

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
