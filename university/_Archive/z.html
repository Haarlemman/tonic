<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The University of Free Will</title>
  <style>
        body { margin: 0; overflow: hidden; background-color: #475569; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; opacity: 1; transition: opacity 0.5s ease; }
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        
        /* Intro Overlay */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            transition: opacity 1.5s ease, visibility 1.5s;
        }
        #intro-text {
            font-size: 1.5rem;
            font-weight: 300;
            max-width: 600px;
            min-height: 100px;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 0 20px;
            letter-spacing: 1px;
            transition: opacity 0.8s ease;
            font-style: italic;
        }
        .intro-btns {
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 15px;
        }
        .action-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 12px 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
            min-width: 240px; 
        }
        .action-btn:hover {
            background: white;
            color: #1e293b;
            border-color: white;
        }
        #enter-btn.active, #skip-btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- HUD --- */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
            z-index: 50;
            opacity: 0;
            transition: opacity 1.5s ease;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .brand-box {
            background: #111;
            color: white;
            padding: 15px 25px;
            display: inline-block;
            pointer-events: auto;
            border-left: 5px solid #ffcc00; 
        }

        h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; line-height: 1; }
        .sub-brand { font-family: 'Courier New', monospace; font-size: 0.7rem; margin-top: 5px; }

        .status-box { pointer-events: auto; text-align: right; }
        .btn-login {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .controls-box {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #666;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border: 1px solid #ccc;
            pointer-events: auto;
            max-width: 250px;
            backdrop-filter: blur(4px);
        }
        .control-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .key { font-weight: bold; color: #111; }

        .directory-box { pointer-events: auto; text-align: right; }
        .building-tag {
            display: block;
            background: white;
            padding: 8px 15px;
            margin-bottom: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            border-right: 5px solid #ccc;
            transition: all 0.2s;
            cursor: pointer;
            color: #111;
        }
        .tag-red { border-color: #ef4444; }
        .tag-blue { border-color: #3b82f6; }
        .tag-yellow { border-color: #facc15; }
        .building-tag:hover { transform: translateX(-10px); background: #111; color: white; }

        #tooltip {
            position: absolute;
            padding: 10px 15px;
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            pointer-events: none;
            display: none;
            font-size: 11px;
            font-weight: 700;
            z-index: 60;
            transform: translate(-50%, -100%);
            margin-top: -15px;
        }

        .highlight-art { color: #fff; text-decoration: underline #ef4444; }
        .highlight-science { color: #fff; text-decoration: underline #4444ef; }
        .highlight-spirit { color: #fff; text-decoration: underline #efef44; }
        
        /* Reactive Indicator */
        #audio-status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 40;
            opacity: 0;
            transition: opacity 2s;
        }
    </style>
 </head>
 <body>

  <audio id="bg-music" loop crossorigin="anonymous">
    <source src="assets/audio/MysteriousHeartbeat1.mp3" type="assets/audio/mpeg">
  </audio>

  <div id="intro-overlay">
    <div id="intro-text"></div>
    <div class="intro-btns">
        <button id="skip-btn" class="action-btn active">Quick Entry</button>
        <button id="enter-btn" class="action-btn">Enter The University</button>
    </div>
  </div>

  <div id="hud-layer">
    <div style="display:flex; justify-content:space-between; align-items: flex-start;">
        <div class="brand-box">
            <h1>University<br>of Free Will</h1>
            <div class="sub-brand">ADVERSITY IS YOUR TEACHER</div>
        </div>
        <div class="status-box">
            <button class="btn-login">SYNC AUDIO FEED</button>
        </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div class="controls-box">
            <div style="border-bottom:1px solid #ccc; margin-bottom:10px; padding-bottom:5px; color:#111; font-weight:bold;">AUDIO-KINETIC MODE</div>
            <div class="control-row"><span class="key">BEAT SYNC</span> <span>ACTIVE</span></div>
            <div class="control-row"><span class="key">AUTO-TOUR</span> <span>ENGAGED</span></div>
            <div class="control-row"><span class="key">MANUAL</span> <span>OVERRIDE AVAIL.</span></div>
        </div>

        <div class="directory-box">
            <div class="building-tag tag-red" onclick="focusBuilding('art')">Beauty (Art)</div>
            <div class="building-tag tag-blue" onclick="focusBuilding('science')">Knowledge (Science)</div>
            <div class="building-tag tag-yellow" onclick="focusBuilding('spirit')">Wisdom (Spirit)</div>
        </div>
    </div>
  </div>

  <div id="audio-status">Audio Kinetic Analysis Online</div>
  <div id="tooltip"></div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
        let scene, camera, renderer, raycaster, mouse, controls;
        let specialBlocks = [];
        let leaderLines = [];
        let atomGroup, registryMesh, spiritBeam, spiritGlowVolume;
        
        // Audio Logic
        let audioCtx, analyser, dataArray;
        let audioInitialized = false;
        let volumeLevel = 0;
        let beatLevel = 0;

        // Cinematic Logic
        let introActive = true;
        let skipRequested = false;
        let cinematicTarget = null;
        let lastZoomTime = 0;
        const ZOOM_INTERVAL = 8000; // Time between random zooms

        const tooltip = document.getElementById('tooltip');
        const introTextEl = document.getElementById('intro-text');
        const enterBtn = document.getElementById('enter-btn');
        const skipBtn = document.getElementById('skip-btn');
        const hudLayer = document.getElementById('hud-layer');
        const bgMusic = document.getElementById('bg-music');

        const introQuotes = [
            "Welcome to the University of Free Will.",
            "A framework where paradox is the only certainty.",
            "Where letting go is the highest form of control.",
            "Listen to the rhythm of the campus..."
        ];

        window.onload = function() {
            init();
            animate();
            runIntroSequence();

            enterBtn.onclick = (e) => { e.stopPropagation(); startExperience(); };
            skipBtn.onclick = (e) => { e.stopPropagation(); startExperience(); };
        };

        async function runIntroSequence() {
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;

            for (let quote of introQuotes) {
                if (skipRequested) break;
                introTextEl.style.opacity = 0;
                await new Promise(r => setTimeout(r, 800));
                if (skipRequested) break;
                introTextEl.innerText = quote;
                introTextEl.style.opacity = 1;
                await new Promise(r => setTimeout(r, 3500));
            }

            if (!skipRequested) enterBtn.classList.add('active');
        }

        function initAudio() {
            if (audioInitialized) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaElementSource(bgMusic);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            audioInitialized = true;
            document.getElementById('audio-status').style.opacity = 1;
        }

        function startExperience() {
            skipRequested = true;
            introActive = false;
            initAudio();
            
            bgMusic.volume = 0.5;
            bgMusic.play().catch(() => console.log("Interaction needed."));

            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                hudLayer.style.opacity = 1;
                controls.autoRotate = true; // Stay in auto-rotate but let audio drive speed
                lastZoomTime = Date.now();
            }, 1000);
        }

        function focusBuilding(type) {
            const b = specialBlocks.find(b => b.userData.type === type);
            if (b) {
                cinematicTarget = b;
                lastZoomTime = Date.now(); // Reset timer when manually focused
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e293b); 
            scene.fog = new THREE.Fog(0x1e293b, 40, 120);

            const aspect = window.innerWidth / window.innerHeight;
            const d = 16;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(45, 45, 45);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(20, 50, 10);
            sun.castShadow = true;
            scene.add(sun);

            createCampus();

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', onMouseMove, false);
        }

        function createCampus() {
            const SPACING = 1.6;
            const GRID = 14;
            const centerOffset = (GRID * SPACING) / 2;

            const boxGeom = new THREE.BoxGeometry(1, 1, 1);
            const materials = {
                campus: new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 }),
                art: new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.3 }),
                science: new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x3b82f6, emissiveIntensity: 0.2 }),
                spirit: new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 2 })
            };

            for (let x = 0; x < GRID; x++) {
                for (let z = 0; z < GRID; z++) {
                    let mesh;
                    let type = "campus";

                    // Simple building identifiers for reactive demo
                    if (x === 6 && z === 7) {
                        type = "art";
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 5, 1.2), materials.art);
                    } else if (x === 10 && z === 3) {
                        type = "science";
                        mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), materials.science);
                    } else if (x === 3 && z === 10) {
                        type = "spirit";
                        mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.8, 4, 4), materials.spirit);
                    } else {
                        let h = 0.2 + Math.random() * 1.5;
                        mesh = new THREE.Mesh(boxGeom, materials.campus);
                        mesh.scale.set(1, h, 1);
                        mesh.position.y = h/2;
                    }

                    mesh.position.x = x * SPACING - centerOffset;
                    mesh.position.z = z * SPACING - centerOffset;
                    if (type !== "campus") {
                        mesh.position.y = 2.5;
                        mesh.userData = { type, label: type.toUpperCase(), originalScale: 1 };
                        specialBlocks.push(mesh);
                    }
                    mesh.castShadow = true;
                    scene.add(mesh);
                }
            }

            // Ground
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            floor.rotation.x = -Math.PI/2;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        function onMouseMove(event) {
            mouse = mouse || new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 16;
            camera.left = -d * aspect; camera.right = d * aspect;
            camera.top = d; camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            if (audioInitialized) {
                analyser.getByteFrequencyData(dataArray);
                
                // Low frequency (Bass) - driving the beat pulse
                let bassSum = 0;
                for(let i=0; i<10; i++) bassSum += dataArray[i];
                beatLevel = bassSum / 10 / 255; 

                // Overall volume level
                let total = 0;
                for(let i=0; i<dataArray.length; i++) total += dataArray[i];
                volumeLevel = total / dataArray.length / 255;

                // Adjust autoRotate based on intensity
                if (controls.autoRotate) {
                    controls.autoRotateSpeed = 0.2 + (beatLevel * 3.0);
                }

                // Make special buildings react to the beat
                specialBlocks.forEach((b, idx) => {
                    const freqValue = dataArray[idx * 5] / 255;
                    const scale = 1 + (freqValue * 0.4);
                    b.scale.set(scale, scale, scale);
                });
            }

            // Cinematic Auto-Tour Logic
            if (!introActive && Date.now() - lastZoomTime > ZOOM_INTERVAL) {
                // Cycle: overview -> focus -> overview
                if (cinematicTarget) {
                    cinematicTarget = null; // Back to overview
                    lastZoomTime = Date.now();
                } else {
                    // Pick a random building to zoom in on
                    cinematicTarget = specialBlocks[Math.floor(Math.random() * specialBlocks.length)];
                    lastZoomTime = Date.now();
                }
            }

            // Smooth camera transitions
            if (cinematicTarget) {
                const targetPos = cinematicTarget.position.clone();
                controls.target.lerp(targetPos, 0.05);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 2.5, 0.02);
            } else {
                controls.target.lerp(new THREE.Vector3(0,0,0), 0.02);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.02);
            }
            camera.updateProjectionMatrix();

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
 </body>
</html>
