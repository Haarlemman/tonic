<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Guide | University of Free Will</title>
<style>
    /* --- SWISS UI OVERLAY [Sources 1, 17, 162] --- */
    body {
        margin: 0;
        overflow: hidden;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    /* Simulate the 3D Canvas (Placeholder for your WebGL/Three.js) */
    #campus-canvas {
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle, #e6e6e6 0%, #111 100%); /* Depth hint */
        position: fixed;
        z-index: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #444;
        font-size: 2rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 10px;
    }

    /* --- THE HUD (Heads Up Display) --- */
    .hud-layer {
        position: relative;
        z-index: 10;
        height: 100vh;
        pointer-events: none; /* Let clicks pass through to 3D canvas */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 30px;
        box-sizing: border-box;
    }

    /* Top Left: The Identity */
    .brand-box {
        background: #111;
        color: white;
        padding: 15px 25px;
        display: inline-block;
        pointer-events: auto;
        border-left: 5px solid #ffcc00; /* Mind Yellow */
    }

    h1 {
        margin: 0; font-size: 1.5rem; text-transform: uppercase; line-height: 1;
    }
    .sub-brand { font-family: 'Courier New'; font-size: 0.7rem; margin-top: 5px; }

    /* Top Right: The Status/Login */
    .status-box {
        pointer-events: auto;
        text-align: right;
    }

    .btn-login {
        background: #ff3300; /* Body Red */
        color: white;
        border: none;
        padding: 10px 20px;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        font-size: 0.8rem;
    }

    /* Bottom Left: Navigation Controls [Source 162] */
    .controls-box {
        font-family: 'Courier New', monospace;
        font-size: 0.75rem;
        color: #666;
        background: rgba(255,255,255,0.8);
        padding: 15px;
        border: 1px solid #ccc;
        pointer-events: auto;
        max-width: 250px;
    }

    .control-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .key { font-weight: bold; color: #111; }

    /* Bottom Right: The Directory (Mini Map Legend) */
    .directory-box {
        pointer-events: auto;
        text-align: right;
    }

    .building-tag {
        display: block;
        background: white;
        padding: 8px 15px;
        margin-bottom: 5px;
        font-size: 0.8rem;
        font-weight: bold;
        text-transform: uppercase;
        border-right: 5px solid #ccc;
        transition: transform 0.2s;
        cursor: pointer;
    }

    .tag-red { border-color: #ff3300; }   /* Gym/Body */
    .tag-yellow { border-color: #ffcc00; } /* Lab/Mind */
    .tag-blue { border-color: #0033cc; }  /* Chapel/Soul */

    .building-tag:hover { transform: translateX(-10px); background: #111; color: white; }

</style>
</head>
<body>

    <!-- 1. THE 3D CANVAS (Your existing WebGL goes here) -->
    <div id="campus-canvas">
        [ 3D CAMPUS VIEW ]
    </div>

    <!-- 2. THE UI OVERLAY [Source 162] -->
    <div class="hud-layer">
        
        <!-- HEADER -->
        <div style="display:flex; justify-content:space-between;">
            <div class="brand-box">
                <h1>University<br>of Free Will</h1>
                <div class="sub-brand">ART // SCIENCE // SPIRIT</div>
            </div>

            <div class="status-box">
                <button class="btn-login" onclick="alert('Student ID Required')">Insert Student ID</button>
            </div>
        </div>

        <!-- FOOTER -->

        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
            
            <!-- CONTROLS [Source 162] -->
            <div class="controls-box">
                <div style="border-bottom:1px solid #ccc; margin-bottom:10px; padding-bottom:5px;">CAMPUS NAVIGATION</div>
                <div class="control-row"><span class="key">L-CLICK + DRAG</span> <span>ROTATE</span></div>
                <div class="control-row"><span class="key">R-CLICK + DRAG</span> <span>PAN</span></div>
                <div class="control-row"><span class="key">SCROLL</span> <span>ZOOM</span></div>
                <div class="control-row"><span class="key">CLICK BLDG</span> <span>ENTER</span></div>
            </div>

            <!-- DIRECTORY LEGEND -->
            <div class="directory-box">
                <div class="building-tag tag-red" onclick="alert('Focus Camera on Gym')">
                    Dept. of Body (Gym)
                </div>
                <div class="building-tag tag-yellow" onclick="alert('Focus Camera on Lab')">
                    Dept. of Mind (Lab)
                </div>
                <div class="building-tag tag-blue" onclick="alert('Focus Camera on Chapel')">
                    Dept. of Soul (Chapel)
                </div>
            </div>

        </div>
    </div>

</body>
</html>
