<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The University of Free Will | David Enker</title>
<style>
    /* --- DESIGN SYSTEM: "ART & JOY" --- */
    :root {
        --paper-color: #f9f7f1; /* Warm sketchbook paper */
        --ink-color: #2a2a2a;   /* Soft charcoal black */
        --gold-highlight: #e6c200; /* "Sliver of gold" */
        --accent-red: #ff6b6b;  /* For the "Heart" illustration */
    }

    body {
        background-color: var(--paper-color);
        color: var(--ink-color);
        font-family: 'Courier New', Courier, monospace; /* Typewriter/Manuscript feel */
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
        background-size: 20px 20px; /* Subtle dot grid like a notebook */
    }

    /* --- THE CENTERPIECE (The Campus) --- */
    .canvas-container {
        position: relative;
        width: 100%;
        max-width: 1000px;
        height: 80vh;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        align-items: center;
        justify-items: center;
    }

    /* --- THE TITLE (Compact & Bold) --- */
    .title-block {
        grid-column: 1 / -1;
        text-align: center;
        z-index: 10;
        animation: float 6s ease-in-out infinite;
    }

    h1 {
        font-family: 'Helvetica Neue', sans-serif;
        font-weight: 900;
        font-size: 4rem;
        text-transform: uppercase;
        letter-spacing: -2px;
        margin: 0;
        line-height: 0.9;
    }

    .subtitle {
        font-size: 1.2rem;
        background: var(--ink-color);
        color: #fff;
        padding: 5px 15px;
        transform: rotate(-2deg);
        display: inline-block;
        margin-top: 10px;
        font-family: 'Marker Felt', 'Comic Sans MS', sans-serif; /* Hand-drawn vibe */
    }

    /* --- THE INTERACTIVE ILLUSTRATIONS --- */
    .illustration-link {
        text-decoration: none;
        color: var(--ink-color);
        text-align: center;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        cursor: pointer;
    }

    .illustration-link:hover {
        transform: scale(1.1) rotate(2deg);
    }

    /* The Drawings (CSS representations of Yaron's art) */
    .sketch {
        width: 150px;
        height: 150px;
        border: 3px solid var(--ink-color);
        margin: 0 auto 15px auto;
        background: #fff;
        box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem; /* Emojis as placeholders for Yaron's art */
        border-radius: 10px; /* Rough edges */
    }

    /* Specific Styles based on Source Content */
    .body-sketch { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; } /* Blobby shape */
    .mind-sketch { border-radius: 50%; } 
    .soul-sketch { border-radius: 40% 60% 60% 40% / 60% 30% 70% 40%; }

    .label {
        font-weight: bold;
        text-transform: uppercase;
        border-bottom: 2px solid var(--gold-highlight);
    }

    /* --- THE "TONIC" (Center) --- */
    .tonic-center {
        grid-column: 2;
        grid-row: 2;
        z-index: 5;
    }

    .tonic-btn {
        background: var(--gold-highlight);
        color: var(--ink-color);
        width: 120px;
        height: 120px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        text-decoration: none;
        box-shadow: 0 0 0 10px rgba(230, 194, 0, 0.2);
        animation: pulse 2s infinite;
    }

    /* --- MOBILE ADJUSTMENTS --- */
    @media (max-width: 768px) {
        .canvas-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            height: auto;
            padding: 40px 0;
        }
        h1 { font-size: 2.5rem; }
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(230, 194, 0, 0.7); }
        70% { box-shadow: 0 0 0 20px rgba(230, 194, 0, 0); }
        100% { box-shadow: 0 0 0 0 rgba(230, 194, 0, 0); }
    }
</style>
</head>
<body>

    <div class="canvas-container">

        <!-- TITLE BLOCK -->
        <div class="title-block">
            <h1>The University<br>of Free Will</h1>
            <div class="subtitle">"Not the universe. The university."</div>
        </div>

        <!-- LEFT: THE BODY (Yaron's Dancing Figure) -->
        <a href="#body" class="illustration-link" style="grid-column: 1; grid-row: 2;">
            <!-- Placeholder for Source [2]: The Stand-up Parkinsonian drawing -->
            <div class="sketch body-sketch">🕺</div> 
            <span class="label">The Body</span><br>
            <small>Move & Play</small>
        </a>

        <!-- CENTER: THE TONIC (The Core) -->
        <div class="tonic-center">
            <a href="#login" class="tonic-btn">ENTER<br>CAMPUS</a>
        </div>

        <!-- RIGHT: THE SOUL (Yaron's Monster with Hearts) -->
        <a href="#soul" class="illustration-link" style="grid-column: 3; grid-row: 2;">
            <!-- Placeholder for Source [3]: The Battle (Heart vs Hat) -->
            <div class="sketch soul-sketch">❤️</div>
            <span class="label">The Soul</span><br>
            <small>Awe & Connect</small>
        </a>

        <!-- BOTTOM: THE MIND (Yaron's Glasses/Eyes) -->
        <a href="#mind" class="illustration-link" style="grid-column: 2; grid-row: 3; margin-top: -50px;">
            <!-- Placeholder for Source [4]: Eyes Wide Open drawing -->
            <div class="sketch mind-sketch">👁️</div>
            <span class="label">The Mind</span><br>
            <small>See & Reflect</small>
        </a>

    </div>

    <!-- SIMPLE FOOTER (Compact) -->
    <footer style="position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 0.8rem; color: #666;">
        David Enker &copy; 2026 | <em>"A sliver of gold beneath the rubble"</em>
    </footer>

</body>
</html>
