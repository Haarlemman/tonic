<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The University of Free Will</title>
  <style>
        /* --- EXISTING STYLES --- */
        body { margin: 0; overflow: hidden; background-color: #475569; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        
        /* --- INTRO & OVERLAYS --- */
        #intro-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; transition: opacity 1.5s ease, visibility 1.5s;
        }
        #intro-text { font-size: 1.5rem; font-weight: 300; max-width: 600px; min-height: 100px; margin-bottom: 40px; transition: opacity 0.8s ease; font-style: italic; }
        
        #enter-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.4);
            color: white; padding: 12px 30px; text-transform: uppercase; letter-spacing: 3px;
            cursor: pointer; font-size: 0.8rem; transition: all 0.3s ease; opacity: 0; pointer-events: none;
        }
        #enter-btn:hover { background: white; color: #1e293b; }

        #skip-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.5); background: none; border: none;
            cursor: pointer; font-size: 0.7rem; letter-spacing: 2px; z-index: 101;
        }

        /* --- THE NEW HUD (From guide.html) --- */
        .hud-element {
            position: absolute; z-index: 5; opacity: 0; transition: opacity 1.5s ease; pointer-events: none;
        }
        .hud-active { opacity: 1; pointer-events: auto; }

        /* Top Left: Brand */
        #brand-box { top: 30px; left: 30px; background: #111; color: white; padding: 15px; border-left: 5px solid #ef4444; }
        #brand-box h1 { margin: 0; font-size: 1.4rem; text-transform: uppercase; line-height: 1; }
        
        /* Top Right: Status */
        #status-box { top: 30px; right: 30px; }
        .btn-login { background: #ef4444; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }

        /* Bottom Left: Controls */
        #controls-box { bottom: 30px; left: 30px; background: rgba(255,255,255,0.9); padding: 15px; font-family: monospace; font-size: 0.7rem; border: 1px solid #ccc; color: #333; }

        /* Bottom Right: Directory */
        #directory-box { bottom: 30px; right: 30px; text-align: right; }
        .building-tag { 
            display: block; background: white; padding: 8px 15px; margin-bottom: 5px; 
            font-size: 0.75rem; font-weight: bold; text-transform: uppercase; border-right: 5px solid #ccc;
            cursor: pointer; transition: transform 0.2s;
        }
        .tag-red { border-color: #ef4444; }
        .tag-blue { border-color: #3b82f6; }
        .tag-yellow { border-color: #facc15; }
        .building-tag:hover { transform: translateX(-10px); background: #111; color: white; }

        #tooltip { position: absolute; padding: 10px; background: rgba(0,0,0,0.8); color: #fff; display: none; z-index: 10; }
    </style>
 </head>
 <body>

  <audio id="ambient-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

  <button id="skip-btn" onclick="endIntro()">[ SKIP >> ]</button>

  <div id="intro-overlay">
    <div id="intro-text"></div>
    <button id="enter-btn">Explore Campus</button>
  </div>

  <div id="brand-box" class="hud-element">
      <h1>University<br>of Free Will</h1>
      <div style="font-size: 0.6rem; margin-top:5px; opacity:0.7;">ART // SCIENCE // SPIRIT</div>
  </div>

  <div id="status-box" class="hud-element">
      <button class="btn-login" onclick="alert('Student ID Required')">INSERT STUDENT ID</button>
  </div>

  <div id="controls-box" class="hud-element">
      <div style="border-bottom:1px solid #ddd; margin-bottom:8px; font-weight:bold;">NAVIGATION</div>
      <div>L-CLICK: ROTATE</div>
      <div>R-CLICK: PAN</div>
      <div>SCROLL: ZOOM</div>
  </div>

  <div id="directory-box" class="hud-element">
      <div class="building-tag tag-red">Dept. of Art (Beauty)</div>
      <div class="building-tag tag-blue">Dept. of Science (Knowledge)</div>
      <div class="building-tag tag-yellow">Dept. of Spirit (Wisdom)</div>
  </div>

  <div id="tooltip"></div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        let introActive = true;
        let soundPlayed = false;

        const introQuotes = [
            "Welcome to the University of Free Will.",
            "A framework of knowledge, wisdom and beauty",
            "Where the more you learn, the more you realize you know nothing.",
            "Where letting go of control equals freedom"
        ];
        
        window.onload = () => {
            init();
            animate();
            runIntroSequence();
        };

        async function runIntroSequence() {
            const el = document.getElementById('intro-text');
            for (let quote of introQuotes) {
                if (!introActive) break; // Exit if skipped
                el.style.opacity = 0;
                await new Promise(r => setTimeout(r, 800));
                el.innerText = quote;
                el.style.opacity = 1;
                await new Promise(r => setTimeout(r, 2500));
            }
            if (introActive) {
                document.getElementById('enter-btn').style.opacity = 1;
                document.getElementById('enter-btn').style.pointerEvents = 'auto';
            }
        }

        // Combined function for Skip and Explore
        function endIntro() {
            if (!introActive) return;
            introActive = false;

            // 1. Play Sound
            const audio = document.getElementById('ambient-sound');
            audio.volume = 0.4;
            audio.play().catch(e => console.log("Audio requires interaction"));

            // 2. Hide Intro
            document.getElementById('intro-overlay').style.opacity = 0;
            document.getElementById('skip-btn').style.display = 'none';
            
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                // 3. Show HUD Elements
                document.querySelectorAll('.hud-element').forEach(el => {
                    el.classList.add('hud-active');
                });
                controls.autoRotate = false;
            }, 1000);
        }

        document.getElementById('enter-btn').onclick = endIntro;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x475569);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(20, 20, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.autoRotate = true; // Auto-rotate during intro
            controls.autoRotateSpeed = 0.5;

            // Simple Box for Campus placeholder
            const geometry = new THREE.BoxGeometry(5, 2, 5);
            const material = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 10, 10);
            scene.add(light, new THREE.AmbientLight(0xffffff, 0.5));
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
 </body>
</html>
