<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The University of Free Will</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* UI Overlay */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #333;
        }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }
        p { font-size: 0.9rem; opacity: 0.7; }

        /* Tooltip style */
        #tooltip {
            position: absolute;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            font-size: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: translate(-50%, -100%);
            margin-top: -10px;
            z-index: 10;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 11px;
            color: #888;
            text-align: right;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>University of Free Will</h1>
        <p>Explore the dimensions of Art, Science, and Spirit.</p>
    </div>

    <div id="tooltip"></div>

    <div class="controls-hint">
        DRAG TO ROTATE<br>
        SCROLL TO ZOOM<br>
        CLICK COLORED BLOCKS TO ENTER
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, raycaster, mouse;
        let blocks = [];
        let specialBlocks = [];
        const tooltip = document.getElementById('tooltip');

        // Configuration
        const GRID_SIZE = 12;
        const SPACING = 1.2;
        
        window.onload = function() {
            init();
            animate();
        };

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);
            scene.fog = new THREE.Fog(0xf5f5f5, 10, 50);

            // Isometric Camera Setup
            const aspect = window.innerWidth / window.innerHeight;
            const d = 10;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            
            // Typical Isometric angle
            camera.position.set(20, 20, 20);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -15;
            dirLight.shadow.camera.right = 15;
            dirLight.shadow.camera.top = 15;
            dirLight.shadow.camera.bottom = -15;
            scene.add(dirLight);

            createCampus();

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('mousedown', onMouseDown, false);
        }

        function createCampus() {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            
            // Materials
            const campusMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
            const artMat = new THREE.MeshLambertMaterial({ color: 0xef4444 }); // Red
            const scienceMat = new THREE.MeshLambertMaterial({ color: 0x3b82f6 }); // Blue
            const spiritMat = new THREE.MeshLambertMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 0.5 }); // Yellow/Glow

            const centerOffset = (GRID_SIZE * SPACING) / 2;

            for (let x = 0; x < GRID_SIZE; x++) {
                for (let z = 0; z < GRID_SIZE; z++) {
                    
                    // Determine if this is a special location
                    let material = campusMat;
                    let height = 0.5 + Math.random() * 1.5;
                    let type = "campus";
                    let label = "";
                    let link = "#";

                    // The Art Museum (Red) - Near middle
                    if (x === 4 && z === 5) {
                        material = artMat;
                        height = 3.5;
                        type = "art";
                        label = "THE MUSEUM (ART)";
                        link = "/art";
                    } 
                    // The Mind (Science) - Further away
                    else if (x === 8 && z === 2) {
                        material = scienceMat;
                        height = 2.8;
                        type = "science";
                        label = "THE MIND (SCIENCE)";
                        link = "/science";
                    }
                    // The Soul (Spirit) - Another corner
                    else if (x === 3 && z === 9) {
                        material = spiritMat;
                        height = 4.5;
                        type = "spirit";
                        label = "THE LIGHT SOURCE (SOUL)";
                        link = "/spirit";
                    }

                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.scale.set(1, height, 1);
                    mesh.position.set(
                        x * SPACING - centerOffset,
                        height / 2,
                        z * SPACING - centerOffset
                    );
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    
                    // Metadata for interaction
                    mesh.userData = { type, label, link, originalY: mesh.position.y };

                    scene.add(mesh);
                    blocks.push(mesh);
                    
                    if (type !== "campus") {
                        specialBlocks.push(mesh);
                        // Add a small light for the spirit source
                        if (type === "spirit") {
                            const pointLight = new THREE.PointLight(0xfacc15, 1, 5);
                            pointLight.position.set(mesh.position.x, height + 1, mesh.position.z);
                            scene.add(pointLight);
                        }
                    }
                }
            }

            // Floor
            const planeGeom = new THREE.PlaneGeometry(30, 30);
            const planeMat = new THREE.ShadowMaterial({ opacity: 0.1 });
            const plane = new THREE.Mesh(planeGeom, planeMat);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = 0;
            plane.receiveShadow = true;
            scene.add(plane);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            checkIntersections();
        }

        function checkIntersections() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (object.userData.type !== "campus") {
                    document.body.style.cursor = 'pointer';
                    tooltip.style.display = 'block';
                    tooltip.style.left = event.clientX + 'px';
                    tooltip.style.top = event.clientY + 'px';
                    tooltip.innerText = object.userData.label;
                    
                    // Gentle hover effect
                    object.scale.x = 1.1;
                    object.scale.z = 1.1;
                } else {
                    resetHovers();
                }
            } else {
                resetHovers();
            }
        }

        function resetHovers() {
            document.body.style.cursor = 'default';
            tooltip.style.display = 'none';
            specialBlocks.forEach(b => {
                b.scale.x = 1;
                b.scale.z = 1;
            });
        }

        function onMouseDown(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (object.userData.type !== "campus") {
                    console.log("Navigating to: " + object.userData.link);
                    // In a real app: window.location.href = object.userData.link;
                    
                    // Visual feedback for click
                    const originalColor = object.material.color.clone();
                    object.material.color.set(0xffffff);
                    setTimeout(() => {
                        object.material.color.copy(originalColor);
                    }, 200);
                }
            }
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 10;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Subtle camera rotation for life
            const time = Date.now() * 0.0005;
            const radius = 25;
            // camera.position.x = Math.cos(time * 0.1) * radius;
            // camera.position.z = Math.sin(time * 0.1) * radius;
            // camera.lookAt(0,0,0);

            // Breathe effect for special blocks
            specialBlocks.forEach(b => {
                const s = 1 + Math.sin(Date.now() * 0.003) * 0.05;
                if (b.userData.type === "spirit") {
                   b.scale.y = (b.userData.originalY * 2) * s;
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
