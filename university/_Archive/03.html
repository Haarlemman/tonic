<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The University of Free Will | A Tonic for the Bones</title>
  
  <!-- Typography: Playfair for titles/quotes, Inter for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
        :root {
            --primary-bg: #020617;
            --accent-gold: #facc15;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --glass-bg: rgba(2, 6, 23, 0.85);
            --border-ui: rgba(255, 255, 255, 0.1);
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: var(--primary-bg); 
            font-family: 'Inter', sans-serif; 
            color: var(--text-main);
        }
        
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        
        /* --- NEW INTRO STYLE (Tonic for the Bones Inspired) --- */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.4) 0%, var(--primary-bg) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 2s ease, visibility 2s;
        }

        #intro-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-style: italic;
            font-weight: 400;
            max-width: 800px;
            min-height: 180px;
            line-height: 1.6;
            margin-bottom: 60px;
            padding: 0 40px;
            color: var(--text-main);
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-main);
            padding: 14px 40px;
            text-transform: uppercase;
            letter-spacing: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.4s ease;
            font-weight: 400;
        }
        .action-btn:hover {
            background: white;
            color: black;
            border-color: white;
            transform: translateY(-2px);
        }

        /* --- REDESIGNED HUD --- */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
            z-index: 50;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .brand-box {
            pointer-events: auto;
        }
        h1 { 
            margin: 0; 
            font-family: 'Playfair Display', serif; 
            font-size: 2rem; 
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        .sub-brand { 
            font-size: 0.65rem; 
            margin-top: 8px; 
            color: var(--accent-gold); 
            text-transform: uppercase; 
            letter-spacing: 4px;
            font-weight: 600;
        }

        .status-box { pointer-events: auto; display: flex; gap: 15px; }
        
        .hud-btn {
            background: var(--glass-bg);
            color: var(--text-main);
            border: 1px solid var(--border-ui);
            padding: 10px 18px;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.65rem;
            letter-spacing: 2px;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }
        .hud-btn:hover { background: white; color: black; }

        #faculty-screen {
            position: absolute;
            width: 320px;
            background: var(--glass-bg);
            border: 1px solid var(--border-ui);
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
            z-index: 80;
            opacity: 0;
            transition: opacity 0.5s ease;
            text-align: center;
            transform: translate(-50%, -120%);
        }
        #faculty-screen.active { display: flex; opacity: 1; }
        
        .neon-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.3rem;
            line-height: 1.4;
            min-height: 3.5em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .neon-art { color: #fecaca; }
        .neon-science { color: #bfdbfe; }
        .neon-spirit { color: #fef08a; }

        .screen-sub {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-ui);
            padding-top: 10px;
        }

        .directory-box { pointer-events: auto; text-align: right; }
        .building-tag {
            display: block;
            background: var(--glass-bg);
            padding: 12px 24px;
            margin-bottom: 10px;
            font-size: 0.7rem;
            text-transform: uppercase;
            border-right: 4px solid #ccc;
            transition: all 0.3s ease;
            cursor: pointer;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
        }
        .tag-red { border-color: #f87171; }
        .tag-blue { border-color: #60a5fa; }
        .tag-yellow { border-color: #fbbf24; }
        .building-tag:hover { transform: translateX(-10px); background: #fff; color: #000; border-right-width: 8px; }

        #custom-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 450px;
            background: var(--primary-bg);
            border: 1px solid var(--border-ui);
            padding: 40px;
            z-index: 200;
            display: none;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
            text-align: center;
        }
        #custom-modal h2 { font-family: 'Playfair Display', serif; margin-top: 0; letter-spacing: 1px; }
        #custom-modal p { color: var(--text-muted); line-height: 1.8; font-size: 0.9rem; margin-bottom: 30px; }
        
        #tooltip {
            position: absolute;
            padding: 8px 12px;
            background: white;
            color: black;
            pointer-events: none;
            display: none;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 60;
            transform: translate(-50%, -100%);
        }
    </style>
 </head>
 <body>

  <audio id="bg-music" loop crossorigin="anonymous">
    <source src="audio/MysteriousHeartbeat1.mp3" type="audio/mpeg">
  </audio>

  <div id="intro-overlay">
    <div id="intro-text"></div>
    <div class="intro-btns">
        <button id="skip-btn" class="action-btn">Enter Campus</button>
    </div>
  </div>

  <div id="custom-modal">
    <h2 id="modal-title">SYSTEM DATA</h2>
    <p id="modal-body"></p>
    <button class="action-btn" style="width:100%" onclick="closeModal()">Acknowledge</button>
  </div>

  <div id="faculty-screen">
    <div id="screen-content" class="neon-text"></div>
    <div class="screen-sub">Observing Faculty</div>
  </div>

  <div id="hud-layer">
    <div style="display:flex; justify-content:space-between; align-items: flex-start;">
        <div class="brand-box">
            <h1>University<br>of Free Will</h1>
            <div class="sub-brand">Tonic for the Bones</div>
        </div>
        <div class="status-box">
            <button class="hud-btn" onclick="toggleMusic()" id="music-toggle">Audio: On</button>
            <button class="hud-btn" onclick="showNotification('About this Space', 'A digital framework exploring the paradox of control and surrender. Created by David Enker.')">Credits</button>
        </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div style="font-size: 0.65rem; color: var(--text-muted); background: var(--glass-bg); padding: 20px; border: 1px solid var(--border-ui); pointer-events: auto; max-width: 250px;">
            <div style="color: var(--accent-gold); margin-bottom:8px; font-weight:bold; letter-spacing: 2px;">THE PARADOX</div>
            The more you learn, the more you realize you know nothing. Adversity is the teacher.
        </div>

        <div class="directory-box">
            <div class="building-tag tag-red" onclick="focusBuilding('art')">Beauty (Art)</div>
            <div class="building-tag tag-blue" onclick="focusBuilding('science')">Knowledge (Science)</div>
            <div class="building-tag tag-yellow" onclick="focusBuilding('spirit')">Wisdom (Spirit)</div>
        </div>
    </div>
  </div>

  <div id="tooltip"></div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
        let scene, camera, renderer, raycaster, mouse, controls;
        let specialBlocks = [];
        let leaderLines = [];
        let atomGroup, spiritBeam, spiritGlowVolume;
        
        let audioCtx, analyser, dataArray;
        let audioInitialized = false;
        let beatLevel = 0;

        let introActive = true;
        let skipRequested = false;
        let cinematicTarget = null;
        let lastZoomTime = 0;
        let lastQuoteTime = 0;
        const ZOOM_INTERVAL = 14000; 
        const QUOTE_INTERVAL = 4000; 

        const tooltip = document.getElementById('tooltip');
        const introTextEl = document.getElementById('intro-text');
        const skipBtn = document.getElementById('skip-btn');
        const hudLayer = document.getElementById('hud-layer');
        const bgMusic = document.getElementById('bg-music');
        const musicToggleBtn = document.getElementById('music-toggle');
        const facultyScreen = document.getElementById('faculty-screen');
        const screenContent = document.getElementById('screen-content');

        const facultyData = {
            art: {
                quotes: ["Truth is Beauty", "Creation is Discovery", "Esthetics of the Soul", "Form follows Freedom", "The Canvas Bleeds", "Mind is the Brush"],
                class: "neon-art",
                quoteIndex: 0
            },
            science: {
                quotes: ["Adversity is your Teacher", "Map is not Territory", "The more you know, the less you understand", "Frameworks of Reality", "Entropy is King", "Observation Collapses"],
                class: "neon-science",
                quoteIndex: 0
            },
            spirit: {
                quotes: ["Free Will is a Paradox", "Letting go is Power", "Silence speaks Volumes", "Wisdom through Surrender", "The Void is Full", "Egos are Vapid"],
                class: "neon-spirit",
                quoteIndex: 0
            }
        };

        const introQuotes = [
            "Welcome to the University of Free Will.",
            "A framework of knowledge, wisdom, and beauty.",
            "The more you learn, the more you realize you know nothing.",
            "Where letting go of control equals freedom.",
            "And where adversity becomes your teacher."
        ];

        window.onload = function() {
            init();
            animate();
            runIntroSequence();
            skipBtn.onclick = (e) => { e.stopPropagation(); startExperience(); };
        };

        function showNotification(title, body) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = body;
            document.getElementById('custom-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('custom-modal').style.display = 'none';
        }

        function toggleMusic() {
            if (!audioInitialized) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (bgMusic.paused) {
                bgMusic.play();
                musicToggleBtn.innerText = "Audio: On";
            } else {
                bgMusic.pause();
                musicToggleBtn.innerText = "Audio: Off";
            }
        }

        async function runIntroSequence() {
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            
            for (let quote of introQuotes) {
                if (skipRequested) break;
                
                // Fade In
                introTextEl.innerText = quote;
                introTextEl.style.opacity = 1;
                
                await new Promise(r => setTimeout(r, 3800));
                if (skipRequested) break;
                
                // Fade Out
                introTextEl.style.opacity = 0;
                await new Promise(r => setTimeout(r, 1200));
            }
            if (!skipRequested) startExperience();
        }

        function initAudio() {
            if (audioInitialized) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(bgMusic);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioInitialized = true;
            } catch(e) {}
        }

        function startExperience() {
            skipRequested = true;
            introActive = false;
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            bgMusic.volume = 0.5;
            bgMusic.play().catch(() => {});
            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                hudLayer.style.opacity = 1;
                lastZoomTime = Date.now();
            }, 1000);
        }

        function focusBuilding(type) {
            const b = specialBlocks.find(b => b.userData.type === type);
            if (b) {
                cinematicTarget = b;
                lastZoomTime = Date.now();
                lastQuoteTime = Date.now();
                updateFacultyScreen(type);
                facultyScreen.classList.add('active');
            }
        }

        function updateFacultyScreen(type) {
            const data = facultyData[type];
            if (!data) return;
            screenContent.className = 'neon-text ' + data.class;
            screenContent.innerText = data.quotes[data.quoteIndex];
            data.quoteIndex = (data.quoteIndex + 1) % data.quotes.length;
        }

        function createTextSprite(text, color = "#ffffff") {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024; canvas.height = 256;
            ctx.fillStyle = 'rgba(2, 6, 23, 0.9)';
            if (ctx.roundRect) ctx.roundRect(150, 64, 724, 128, 4); else ctx.fillRect(150, 64, 724, 128);
            ctx.fill();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = color;
            ctx.font = '700 42px Inter'; ctx.fillText(text, 512, 128);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
            sprite.scale.set(7.5, 1.875, 1);
            return sprite;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617); 
            scene.fog = new THREE.Fog(0x020617, 50, 150);
            const aspect = window.innerWidth / window.innerHeight;
            const d = 16;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(45, 45, 45);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(20, 50, 10); sun.castShadow = true;
            scene.add(sun);
            createCampus();
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', onMouseMove, false);
        }

        function createCampus() {
            const SPACING = 1.6; const GRID = 14; const centerOffset = (GRID * SPACING) / 2;
            const materials = {
                campus: new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 }),
                museumWhite: new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 }),
                museumRed: new THREE.MeshStandardMaterial({ color: 0xef4444 }),
                science: new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8, emissiveIntensity: 0.3 }),
                spiritNeon: new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xfacc15, emissiveIntensity: 3 }),
                spiritGlow: new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending }),
                dottedLine: new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.2, gapSize: 0.2, transparent: true, opacity: 0.15 })
            };

            for (let x = 0; x < GRID; x++) {
                for (let z = 0; z < GRID; z++) {
                    let mesh; let type = "campus"; let labelText = ""; let labelY = 0;
                    if (x === 6 && z === 7) {
                        type = "art"; labelText = "BEAUTY"; labelY = 11.5;
                        const g = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.BoxGeometry(0.8, 6.5, 0.8), materials.museumRed); core.position.y = 3.25; g.add(core);
                        const shards = [{ size: [4.5, 0.8, 3], pos: [0, 1.5, 0], rot: [0.2, 0.1, 0.1] }, { size: [3, 0.8, 5], pos: [-0.5, 3.8, 0.5], rot: [-0.3, -0.4, 0.1] }, { size: [5.5, 0.4, 2.5], pos: [0.8, 2.6, -0.2], rot: [0.1, 0.6, -0.2] }];
                        shards.forEach(s => { const sh = new THREE.Mesh(new THREE.BoxGeometry(...s.size), materials.museumWhite); sh.position.set(...s.pos); sh.rotation.set(...s.rot); g.add(sh); });
                        mesh = g;
                    } else if (x === 10 && z === 3) {
                        type = "science"; labelText = "KNOWLEDGE"; labelY = 11.5;
                        const g = new THREE.Group();
                        const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 1.2, 3, 4), materials.campus); ped.position.y = 1.5; g.add(ped);
                        atomGroup = new THREE.Group();
                        atomGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 24), materials.science));
                        const rGeom = new THREE.TorusGeometry(1.4, 0.05, 12, 64);
                        const rMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.6 });
                        [0, Math.PI/2].forEach((rot, i) => { const r = new THREE.Mesh(rGeom, rMat); if(i===1) r.rotation.x = rot; atomGroup.add(r); });
                        atomGroup.position.y = 4.8; g.add(atomGroup);
                        mesh = g;
                    } else if (x === 3 && z === 10) {
                        type = "spirit"; labelText = "WISDOM"; labelY = 3.6;
                        mesh = new THREE.Group();
                        spiritBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.3, 20, 32), materials.spiritNeon); spiritBeam.position.y = 10; mesh.add(spiritBeam);
                        spiritGlowVolume = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.8, 20, 32), materials.spiritGlow); spiritGlowVolume.position.y = 10; mesh.add(spiritGlowVolume);
                    } else {
                        let h = 0.3 + Math.random() * 2.2;
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), materials.campus); mesh.scale.set(1, h, 1); mesh.position.y = h/2;
                    }
                    mesh.position.set(x * SPACING - centerOffset, 0, z * SPACING - centerOffset);
                    mesh.userData = { type, label: labelText || type };
                    scene.add(mesh);
                    if (type !== "campus") {
                        specialBlocks.push(mesh);
                        const label = createTextSprite(labelText, (type === 'spirit' ? '#fef08a' : '#ffffff'));
                        label.position.set(mesh.position.x + 1.2, labelY, mesh.position.z + 1.2);
                        scene.add(label);
                        const pts = [new THREE.Vector3(mesh.position.x, 0.5, mesh.position.z), new THREE.Vector3(label.position.x, label.position.y, label.position.z)];
                        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), materials.dottedLine.clone());
                        line.computeLineDistances(); scene.add(line); leaderLines.push(line);
                    }
                }
            }
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x020617 }));
            floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
        }

        function onMouseMove(event) {
            if (introActive) return;
            mouse = mouse || new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster = raycaster || new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(specialBlocks, true);
            if (intersects.length > 0) {
                let t = intersects[0].object; while (t.parent && !t.userData.type) t = t.parent;
                tooltip.style.display = 'block'; tooltip.style.left = event.clientX + 'px'; tooltip.style.top = event.clientY + 'px';
                tooltip.innerHTML = t.userData.label;
            } else tooltip.style.display = 'none';
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight; const d = 16;
            camera.left = -d * aspect; camera.right = d * aspect; camera.top = d; camera.bottom = -d;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const now = Date.now();
            
            if (audioInitialized && !bgMusic.paused) {
                analyser.getByteFrequencyData(dataArray);
                let bass = 0; for(let i=0; i<16; i++) bass += dataArray[i];
                beatLevel = (bass / 16 / 255); 
                if (controls.autoRotate) controls.autoRotateSpeed = 0.2 + (beatLevel * 3.0);
                specialBlocks.forEach((b, idx) => {
                    const f = dataArray[10 + idx * 8] / 255;
                    const s = 1 + (f * 0.4) + (beatLevel * 0.2);
                    b.scale.lerp(new THREE.Vector3(s,s,s), 0.15);
                });
            } else { beatLevel = 0; if (controls.autoRotate && !introActive) controls.autoRotateSpeed = 0.1; }
            
            if (atomGroup) { atomGroup.rotation.y += 0.01 + beatLevel * 0.1; atomGroup.rotation.z += 0.005 + beatLevel * 0.1; }
            if (spiritBeam) {
                const s = 1 + Math.sin(time * 3) * 0.05 + beatLevel * 0.5;
                spiritBeam.scale.set(s, 1, s); spiritGlowVolume.material.opacity = 0.1 + beatLevel * 0.4;
            }
            leaderLines.forEach(l => { l.material.dashOffset -= 0.01; l.material.opacity = 0.1 + beatLevel * 0.6; });
            
            if (!introActive && now - lastZoomTime > ZOOM_INTERVAL) {
                if (cinematicTarget) { cinematicTarget = null; facultyScreen.classList.remove('active'); } 
                else { cinematicTarget = specialBlocks[Math.floor(Math.random() * specialBlocks.length)]; facultyScreen.classList.add('active'); }
                lastZoomTime = now;
            }
            
            if (cinematicTarget) {
                controls.target.lerp(cinematicTarget.position.clone(), 0.06);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 2.2, 0.03);
                if (now - lastQuoteTime > QUOTE_INTERVAL) { updateFacultyScreen(cinematicTarget.userData.type); lastQuoteTime = now; }
                const v = cinematicTarget.position.clone(); v.y += 2.5; v.project(camera);
                facultyScreen.style.left = (v.x * .5 + .5) * window.innerWidth + 'px';
                facultyScreen.style.top = (v.y * -.5 + .5) * window.innerHeight + 'px';
            } else {
                controls.target.lerp(new THREE.Vector3(0,0,0), 0.02);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.02);
            }
            
            camera.updateProjectionMatrix(); controls.update(); renderer.render(scene, camera);
        }
    </script>
