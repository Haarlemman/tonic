<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The University of Free Will</title>
  <!-- Google Fonts: Alegreya and Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital@1&family=Inter:wght@400;700;900&family=Workbench&display=swap" rel="stylesheet">
  <style>
        :root {
            --neon-green: #00ff66;
            --dark-bg: #020617;
            --slate-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: var(--dark-bg); 
            font-family: 'Inter', -apple-system, sans-serif; 
            color: #fff;
        }
        
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        
        /* Intro Overlay */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 6, 23, 0.7); 
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 1.5s ease, visibility 1.5s;
        }
        #intro-text {
            font-family: 'Alegreya', serif;
            font-style: italic;
            font-weight: 400;
            font-size: 2.2rem;
            max-width: 800px;
            min-height: 140px;
            line-height: 1.4;
            margin-bottom: 40px;
            padding: 0 40px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            display: inline-block;
        }
        #intro-text::after {
            content: '_';
            display: inline-block;
            margin-left: 5px;
            color: var(--neon-green);
            animation: cursor-blink 0.6s step-end infinite;
        }
        @keyframes cursor-blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 15px 40px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            background: var(--neon-green);
            border-color: var(--neon-green);
            color: #000;
        }

        /* Modals & Popups (Swiss-style minimalism) */
        #custom-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 480px;
            background: #000;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 40px;
            z-index: 200;
            display: none;
            box-shadow: 0 0 60px rgba(0,0,0,1);
        }
        #custom-modal h2 { font-weight: 900; text-transform: uppercase; margin-top: 0; letter-spacing: -1px; color: #fff; }
        #modal-close {
            margin-top: 25px;
            padding: 12px 24px;
            background: var(--neon-green);
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
        }

        /* Faculty Screen Overlay */
        #faculty-screen {
            position: absolute;
            width: 280px;
            background: #000;
            border: 1px solid var(--slate-border);
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
            z-index: 80;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: left;
            transform: translate(-50%, -120%);
        }
        #faculty-screen.active { display: flex; opacity: 1; }
        .neon-text {
            font-family: 'Workbench', monospace;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.2;
            min-height: 2.4em;
            display: flex;
            align-items: center;
        }
        .neon-art { color: #ef4444; }
        .neon-science { color: #3b82f6; }
        .neon-spirit { color: #facc15; }
        .screen-sub { font-size: 0.6rem; letter-spacing: 2px; color: #444; border-top: 1px solid #222; padding-top: 10px; }

        /* HUD (Swiss Influence: Grid, Clean Lines, Asymmetry) */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
            z-index: 50;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .brand-box {
            background: transparent;
            color: white;
            padding: 0;
            display: inline-block;
            pointer-events: auto;
            border-left: 2px solid var(--neon-green); 
            padding-left: 20px;
        }

        h1 { margin: 0; font-size: 1.8rem; font-weight: 900; text-transform: uppercase; line-height: 0.85; letter-spacing: -1.5px; }
        .sub-brand { font-size: 0.65rem; margin-top: 8px; font-weight: 700; letter-spacing: 2px; color: var(--neon-green); opacity: 0.8; }

        .status-box { pointer-events: auto; display: flex; gap: 4px; }
        
        .hud-btn {
            background: transparent;
            color: #fff;
            border: 1px solid var(--slate-border);
            padding: 10px 18px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.65rem;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .hud-btn:hover { background: #fff; color: #000; border-color: #fff; }

        #general-menu {
            position: absolute;
            top: 100px;
            right: 40px;
            background: #000;
            border: 1px solid var(--neon-green);
            padding: 0;
            width: 240px;
            display: none;
            flex-direction: column;
            pointer-events: auto;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
        }
        #general-menu.active { display: flex; }
        .menu-link {
            color: #fff;
            text-decoration: none;
            font-size: 0.7rem;
            padding: 16px 20px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .menu-link:hover { background: var(--neon-green); color: #000; }

        .directory-box { pointer-events: auto; text-align: right; }
        .building-tag {
            display: block;
            background: transparent;
            padding: 12px 20px;
            margin-bottom: 4px;
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            border: 1px solid var(--slate-border);
            transition: all 0.2s;
            cursor: pointer;
            color: #888;
            letter-spacing: 1px;
        }
        .building-tag:hover { border-color: #fff; color: #fff; transform: translateX(-5px); }

        #tooltip {
            position: absolute;
            padding: 8px 12px;
            background: #fff;
            color: #000;
            pointer-events: none;
            display: none;
            font-size: 10px;
            font-weight: 900;
            z-index: 60;
            transform: translate(-50%, -100%);
            text-transform: uppercase;
        }
    </style>
 </head>
 <body>

  <audio id="bg-music" loop crossorigin="anonymous">
    <source src="assets/audio/MysteriousHeartbeat1.mp3" type="assets/audio/mpeg">
  </audio>

  <div id="intro-overlay">
    <div id="intro-text"></div>
    <div class="intro-btns">
        <button id="skip-btn" class="action-btn">Enter Campus</button>
    </div>
  </div>

  <div id="custom-modal">
    <h2 id="modal-title">SYSTEM DATA</h2>
    <p id="modal-body"></p>
    <button id="modal-close" onclick="closeModal()">Acknowledge</button>
  </div>

  <div id="faculty-screen">
    <div id="screen-content" class="neon-text"></div>
    <div class="screen-sub">CORE DISPATCH LOG</div>
  </div>

  <div id="hud-layer">
    <div style="display:flex; justify-content:space-between; align-items: flex-start;">
        <div class="brand-box">
            <h1>University<br>of Free Will</h1>
            <div class="sub-brand">ADVERSITY IS YOUR TEACHER</div>
        </div>
        <div class="status-box">
            <button class="hud-btn" onclick="toggleMusic()" id="music-toggle">Audio: On</button>
            <button class="hud-btn" onclick="toggleMenu()">Menu</button>
        </div>
        <div id="general-menu">
            <a href="about.html" class="menu-link">How it Started</a>
            <a href="#" class="menu-link" onclick="focusBuilding('art')">Beauty / Art</a>
            <a href="#" class="menu-link" onclick="focusBuilding('science')">Knowledge / Science</a>
            <a href="#" class="menu-link" onclick="focusBuilding('spirit')">Wisdom / Spirit</a>
            <a href="#" class="menu-link" onclick="showNotification('REGISTRY', 'Registrar is currently out of office.')">Registry</a>
        </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div style="font-family: 'Inter', sans-serif; font-size: 0.6rem; color: #666; background: rgba(0,0,0,0.4); padding: 20px; border: 1px solid var(--slate-border); pointer-events: auto;">
            <div style="border-bottom:1px solid #333; margin-bottom:10px; padding-bottom:5px; font-weight:900; text-transform:uppercase; color: #999;">Diagnostics</div>
            <div style="display:flex; justify-content:space-between; gap: 40px; margin-bottom: 4px;"><span>VISUAL FEED</span> <span style="color:var(--neon-green)">STABLE</span></div>
            <div style="display:flex; justify-content:space-between;"><span>PERSPECTIVE</span> <span>FLUID</span></div>
        </div>

        <div class="directory-box">
            <div class="building-tag" onclick="focusBuilding('art')">Beauty</div>
            <div class="building-tag" onclick="focusBuilding('science')">Knowledge</div>
            <div class="building-tag" onclick="focusBuilding('spirit')">Wisdom</div>
        </div>
    </div>
  </div>

  <div id="tooltip"></div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
        let scene, camera, renderer, raycaster, mouse, controls;
        let specialBlocks = [];
        let leaderLines = [];
        let atomGroup, spiritBeam, spiritGlowVolume;
        
        let audioCtx, analyser, dataArray;
        let audioInitialized = false;
        let beatLevel = 0;

        let introActive = true;
        let skipRequested = false;
        let cinematicTarget = null;
        let lastZoomTime = 0;
        let lastQuoteTime = 0;
        const ZOOM_INTERVAL = 14000; 
        const QUOTE_INTERVAL = 3000; 

        const tooltip = document.getElementById('tooltip');
        const introTextEl = document.getElementById('intro-text');
        const skipBtn = document.getElementById('skip-btn');
        const hudLayer = document.getElementById('hud-layer');
        const bgMusic = document.getElementById('bg-music');
        const musicToggleBtn = document.getElementById('music-toggle');
        const facultyScreen = document.getElementById('faculty-screen');
        const screenContent = document.getElementById('screen-content');

        const facultyData = {
            art: {
                quotes: ["TRUTH IS BEAUTY", "CREATION IS DISCOVERY", "ESTHETICS OF THE SOUL", "FORM FOLLOWS FREEDOM"],
                class: "neon-art",
                quoteIndex: 0
            },
            science: {
                quotes: ["ADVERSITY IS YOUR TEACHER", "MAP IS NOT TERRITORY", "THE MORE YOU KNOW, THE LESS YOU UNDERSTAND", "OBSERVATION COLLAPSES"],
                class: "neon-science",
                quoteIndex: 0
            },
            spirit: {
                quotes: ["FREE WILL IS A PARADOX", "LETTING GO IS POWER", "SILENCE SPEAKS VOLUMES", "WISDOM THROUGH SURRENDER"],
                class: "neon-spirit",
                quoteIndex: 0
            }
        };

        const introQuotes = [
            "Welcome to the University of Free Will.",
            "A framework of knowledge, wisdom and beauty.",
            "The more you learn, the more you realize you know nothing.",
            "Letting go of control is the ultimate freedom.",
            "Where adversity becomes your teacher."
        ];

        window.onload = function() {
            init();
            animate();
            runIntroSequence();
            skipBtn.onclick = (e) => { e.stopPropagation(); startExperience(); };
        };

        function showNotification(title, body) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = body;
            document.getElementById('custom-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('custom-modal').style.display = 'none';
        }

        function toggleMusic() {
            if (!audioInitialized) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (bgMusic.paused) {
                bgMusic.play();
                musicToggleBtn.innerText = "Audio: On";
            } else {
                bgMusic.pause();
                musicToggleBtn.innerText = "Audio: Off";
            }
        }

        async function typeText(text, element) {
            element.innerHTML = '';
            for (let i = 0; i < text.length; i++) {
                if (skipRequested) return;
                element.innerHTML += text.charAt(i);
                await new Promise(r => setTimeout(r, 45));
            }
        }

        async function runIntroSequence() {
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;
            for (let quote of introQuotes) {
                if (skipRequested) break;
                await typeText(quote, introTextEl);
                if (skipRequested) break;
                await new Promise(r => setTimeout(r, 2500));
                if (skipRequested) break;
                introTextEl.style.transition = 'opacity 0.5s';
                introTextEl.style.opacity = 0;
                await new Promise(r => setTimeout(r, 600));
                introTextEl.innerHTML = '';
                introTextEl.style.opacity = 1;
            }
        }

        function initAudio() {
            if (audioInitialized) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(bgMusic);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioInitialized = true;
            } catch(e) {}
        }

        function startExperience() {
            skipRequested = true;
            introActive = false;
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            bgMusic.volume = 0.5;
            bgMusic.play().catch(() => {});
            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                hudLayer.style.opacity = 1;
                lastZoomTime = Date.now();
            }, 1000);
        }

        function focusBuilding(type) {
            toggleMenu(false);
            const b = specialBlocks.find(b => b.userData.type === type);
            if (b) {
                cinematicTarget = b;
                lastZoomTime = Date.now();
                lastQuoteTime = Date.now();
                updateFacultyScreen(type);
                facultyScreen.classList.add('active');
            }
        }

        function updateFacultyScreen(type) {
            const data = facultyData[type];
            if (!data) return;
            screenContent.className = 'neon-text ' + data.class;
            screenContent.innerText = data.quotes[data.quoteIndex];
            data.quoteIndex = (data.quoteIndex + 1) % data.quotes.length;
        }

        function createTextSprite(text, color = "#ffffff") {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024; canvas.height = 256;
            ctx.fillStyle = 'rgba(0,0,0,0.9)';
            ctx.fillRect(200, 64, 624, 128);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(200, 64, 624, 128);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = color;
            ctx.font = '900 52px Inter, sans-serif'; ctx.fillText(text, 512, 128);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
            sprite.scale.set(7.5, 1.875, 1);
            return sprite;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617); 
            scene.fog = new THREE.Fog(0x020617, 30, 140);
            const aspect = window.innerWidth / window.innerHeight;
            const d = 16;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(45, 45, 45);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(20, 50, 10); sun.castShadow = true;
            scene.add(sun);
            createCampus();
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', onMouseMove, false);
        }

        function createCampus() {
            const SPACING = 1.6; const GRID = 14; const centerOffset = (GRID * SPACING) / 2;
            const materials = {
                campus: new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 }),
                museumWhite: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
                museumRed: new THREE.MeshStandardMaterial({ color: 0xef4444 }),
                science: new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8, emissiveIntensity: 0.5 }),
                spiritCore: new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 2 }),
                spiritGlow: new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending }),
                SwissLine: new THREE.LineBasicMaterial({ color: 0x00ff66, transparent: true, opacity: 0.4 })
            };

            for (let x = 0; x < GRID; x++) {
                for (let z = 0; z < GRID; z++) {
                    let mesh; let type = "campus"; let labelText = ""; let labelY = 0;
                    if (x === 6 && z === 7) {
                        type = "art"; labelText = "BEAUTY"; labelY = 11.5;
                        const g = new THREE.Group();
                        const core = new THREE.Mesh(new THREE.BoxGeometry(0.8, 6.5, 0.8), materials.museumRed); core.position.y = 3.25; g.add(core);
                        const shards = [{ size: [4.5, 0.6, 3], pos: [0, 1.5, 0], rot: [0.2, 0, 0] }, { size: [3.5, 0.6, 5], pos: [0, 3.8, 0], rot: [-0.3, 0.4, 0] }, { size: [5, 0.4, 2], pos: [0, 2.6, 0], rot: [0.1, -0.6, 0] }];
                        shards.forEach(s => { const sh = new THREE.Mesh(new THREE.BoxGeometry(...s.size), materials.museumWhite); sh.position.set(...s.pos); sh.rotation.set(...s.rot); g.add(sh); });
                        mesh = g;
                    } else if (x === 10 && z === 3) {
                        type = "science"; labelText = "KNOWLEDGE"; labelY = 11.5;
                        const g = new THREE.Group();
                        const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 1.2, 3, 4), materials.campus); ped.position.y = 1.5; g.add(ped);
                        atomGroup = new THREE.Group();
                        atomGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 24), materials.science));
                        const rGeom = new THREE.TorusGeometry(1.4, 0.04, 12, 64);
                        const rMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.5 });
                        [0, Math.PI/2].forEach((rot, i) => { const r = new THREE.Mesh(rGeom, rMat); if(i===1) r.rotation.x = rot; atomGroup.add(r); });
                        atomGroup.position.y = 4.8; g.add(atomGroup);
                        mesh = g;
                    } else if (x === 3 && z === 10) {
                        type = "spirit"; labelText = "WISDOM"; labelY = 3.6;
                        mesh = new THREE.Group();
                        spiritBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.2, 18, 4), materials.spiritCore); spiritBeam.position.y = 9; mesh.add(spiritBeam);
                        spiritGlowVolume = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.7, 18, 4), materials.spiritGlow); spiritGlowVolume.position.y = 9; mesh.add(spiritGlowVolume);
                    } else {
                        let h = 0.3 + Math.random() * 2.2;
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1, 1.05), materials.campus); mesh.scale.set(1, h, 1); mesh.position.y = h/2;
                    }
                    mesh.position.set(x * SPACING - centerOffset, 0, z * SPACING - centerOffset);
                    mesh.userData = { type, label: labelText || type };
                    scene.add(mesh);
                    if (type !== "campus") {
                        specialBlocks.push(mesh);
                        const label = createTextSprite(labelText, (type === 'spirit' ? '#facc15' : '#ffffff'));
                        label.position.set(mesh.position.x + 1.2, labelY, mesh.position.z + 1.2);
                        scene.add(label);
                        const pts = [new THREE.Vector3(mesh.position.x, 0.5, mesh.position.z), new THREE.Vector3(label.position.x, label.position.y, label.position.z)];
                        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), materials.SwissLine);
                        scene.add(line); leaderLines.push(line);
                    }
                }
            }
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x010411 }));
            floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
        }

        function onMouseMove(event) {
            if (introActive) return;
            mouse = mouse || new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster = raycaster || new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(specialBlocks, true);
            if (intersects.length > 0) {
                let t = intersects[0].object; while (t.parent && !t.userData.type) t = t.parent;
                tooltip.style.display = 'block'; tooltip.style.left = event.clientX + 'px'; tooltip.style.top = event.clientY + 'px';
                tooltip.innerHTML = t.userData.label;
            } else tooltip.style.display = 'none';
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight; const d = 16;
            camera.left = -d * aspect; camera.right = d * aspect; camera.top = d; camera.bottom = -d;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleMenu(force) { 
            const m = document.getElementById('general-menu');
            if (force === undefined) m.classList.toggle('active');
            else if (force) m.classList.add('active');
            else m.classList.remove('active');
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const now = Date.now();
            if (audioInitialized && !bgMusic.paused) {
                analyser.getByteFrequencyData(dataArray);
                let bass = 0; for(let i=0; i<16; i++) bass += dataArray[i];
                beatLevel = (bass / 16 / 255); 
                if (controls.autoRotate) controls.autoRotateSpeed = 0.5 + (beatLevel * 4.0);
            } else { beatLevel = 0; if (controls.autoRotate && !introActive) controls.autoRotateSpeed = 0.2; }
            
            if (atomGroup) { atomGroup.rotation.y += 0.02 + beatLevel * 0.1; atomGroup.rotation.z += 0.01; }
            if (spiritBeam) {
                const s = 1 + Math.sin(time * 3) * 0.05 + beatLevel * 0.5;
                spiritBeam.scale.set(s, 1, s);
            }

            if (!introActive && now - lastZoomTime > ZOOM_INTERVAL) {
                if (cinematicTarget) { cinematicTarget = null; facultyScreen.classList.remove('active'); } 
                else { cinematicTarget = specialBlocks[Math.floor(Math.random() * specialBlocks.length)]; facultyScreen.classList.add('active'); }
                lastZoomTime = now;
            }
            if (cinematicTarget) {
                controls.target.lerp(cinematicTarget.position.clone(), 0.08);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 2.4, 0.04);
                if (now - lastQuoteTime > QUOTE_INTERVAL) { updateFacultyScreen(cinematicTarget.userData.type); lastQuoteTime = now; }
                const v = cinematicTarget.position.clone(); v.y += 3.5; v.project(camera);
                facultyScreen.style.left = (v.x * .5 + .5) * window.innerWidth + 'px';
                facultyScreen.style.top = (v.y * -.5 + .5) * window.innerHeight + 'px';
            } else {
                controls.target.lerp(new THREE.Vector3(0,0,0), 0.03);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.03);
            }
            camera.updateProjectionMatrix(); controls.update(); renderer.render(scene, camera);
        }
    </script>
