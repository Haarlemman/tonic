<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tonic for the Bones | Kinetic Narrative</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Special+Elite&display=swap');

        :root {
            --bg-color: #0d0d0d;
            --saul-red: #d92d20;
            --saul-yellow: #f9b233;
            --paper-texture: url('https://www.transparenttextures.com/patterns/stardust.png');
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Oswald', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            touch-action: none;
        }

        #stage::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--paper-texture);
            opacity: 0.18;
            pointer-events: none;
            z-index: 50;
        }

        #stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px; /* Reduced perspective for better legibility */
            z-index: 10;
            overflow: hidden;
        }

        /* HUD & Menu */
        #hud {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 100;
        }

        .brand {
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 10px;
            border-left: 3px solid var(--saul-yellow);
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        .brand h1 { font-size: 0.7rem; text-transform: uppercase; margin: 0; opacity: 0.8; letter-spacing: 1px; }

        .menu-container {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .hud-btn {
            background: #111;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.6rem;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .hud-btn:hover { background: white; color: black; }

        #general-menu {
            margin-top: 5px;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            width: 140px;
            display: none;
            flex-direction: column;
            gap: 2px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.5);
        }

        #general-menu.active { display: flex; }

        .menu-link {
            color: #999;
            text-decoration: none;
            font-size: 0.6rem;
            padding: 6px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .menu-link:hover { color: white; }

        /* Kinetic Typography Base */
        .k-text {
            position: absolute;
            top: 50%; left: 50%;
            white-space: nowrap;
            text-transform: uppercase;
            font-weight: 700;
            line-height: 0.75;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
            transform-style: preserve-3d;
        }

        /* Dreamy Strobe Animation */
        @keyframes strobeDream {
            0%, 100% { opacity: 0; filter: blur(25px); transform: translate(-50%, -50%) scale(0.7) translateZ(-200px); }
            15%, 85% { opacity: 1; filter: blur(0); transform: translate(-50%, -50%) scale(1) translateZ(0); }
            50% { opacity: 0.35; filter: blur(10px); transform: translate(-50%, -50%) scale(1.2) translateZ(100px); }
        }

        .strobe-container { transform-style: preserve-3d; }
        .strobe-layer {
            position: absolute;
            animation: strobeDream 5.5s infinite ease-in-out;
            mix-blend-mode: screen;
            white-space: nowrap;
        }

        /* Finale Spark */
        .spark {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 35px 12px white, 0 0 80px 25px var(--saul-yellow);
            opacity: 0;
            transform: translate(-50%, -50%);
            z-index: 200;
            transition: opacity 4s ease-in;
        }

        #overlay {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }

        .btn-play {
            border: 4px solid white; padding: 15px 45px; font-size: 1.8rem;
            background: none; color: white; text-transform: uppercase; letter-spacing: 6px;
        }

        /* Invisible Keep-Awake Video */
        #awake-vid { position: fixed; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; top: 0; }
    </style>
</head>
<body>

    <video id="awake-vid" loop muted playsinline>
        <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAChtidWRhdACAAAABYm1mcmEAAAAAAAABYAAAAGxtZWhkAAAAAAAAAAEAAAAnbW9vZgAAAAAAAABYAAAAZHRyYWYAAAAAAAAAAQAAABZ0ZmhkAAAAAAAAAAEAAAAAAAD6AAAAZHRydW4AAAAAAAAAAQAAAAEAAAAAAAAAAAAAACltZGF0" type="assets/video/mp4">
    </video>

    <div id="overlay" onclick="start()">
        <button class="btn-play">Sync & Play</button>
        <p class="mt-4 text-gray-500 uppercase tracking-widest text-[0.6rem]">Tonic for the Bones</p>
    </div>

    <div id="hud">
        <div class="brand"><h1>University of Free Will</h1></div>
        <div class="menu-container">
            <button class="hud-btn" onclick="toggleMenu()">Menu</button>
            <div id="general-menu">
                <a href="#" class="menu-link">Campus Map</a>
                <a href="#" class="menu-link" style="color:white">Info Desk</a>
                <a href="#" class="menu-link">Artistic Core</a>
            </div>
            <div id="clock" style="font-family:'Special+Elite'; font-size:0.5rem; color:#444; margin-top:5px;">0:00:00</div>
        </div>
    </div>

    <div id="stage"></div>
    <div id="glimmer" class="spark"></div>

    <audio id="audio" crossorigin="anonymous">
        <source src="assets/audio/MysteriousHeartbeat2.mp3" type="assets/audio/mpeg">
    </audio>

    <script>
        const stage = document.getElementById('stage');
        const clock = document.getElementById('clock');
        const audio = document.getElementById('audio');
        const glimmer = document.getElementById('glimmer');
        const awakeVid = document.getElementById('awake-vid');
        const menu = document.getElementById('general-menu');

        let startTime = 0, running = false, activeWords = [], slotIndex = 0;
        let lastEpilogue = 0, epilogueWordIdx = 0, finaleActive = false, wakeLock = null;

        const colors = ["#d92d20", "#f9b233", "#004a99", "#eb5e28", "#fffcf2", "#6b705c", "#f4a261"];
        
        const narrative = [
            { t: 0, text: "When life takes" },
            { t: 3, text: "instead of gives" },
            { t: 4.5, text: "an illness" },
            { t: 7, text: "or worse" },
            { t: 11, text: "the world" },
            { t: 13, text: "turns upside down", flip: true },
            { t: 19, text: "you're left wondering", stack: true },
            { t: 23, text: "what to do." },
            { t: 29, text: "Luckily" },
            { t: 31, text: "there is a way" },
            { t: 33, text: "to laugh" },
            { t: 35, text: "in the face of adversity", stack: true },
            { t: 37, text: "all it requires" },
            { t: 39, text: "is" },
            { t: 40, text: "a shift" },
            { t: 41, text: "in thinking" },
            { t: 42, text: "feeling" },
            { t: 43, text: "and knowing." },
            { t: 45, text: "A leap of faith", stack: true },
            { t: 47, text: "embrace the pain" },
            { t: 48, text: "accept your path" },
            { t: 49, text: "create" },
            { t: 50, text: "communicate" },
            { t: 51, text: "concentrate" },
            { t: 52, text: "and let go" },
            { t: 53, text: "it will be" },
            { t: 54, text: "a balm" },
            { t: 55, text: "for the soul" },
            { t: 56, text: "a tonic" },
            { t: 57.5, text: "for the bones." }
        ];

        const epilogue = ["ART", "WISDOM", "LOVE", "TRUTH", "TIME", "GRACE", "MEMORY", "SOLACE", "UNDERSTANDING", "PERSPECTIVE", "FREEDOM"];

        function toggleMenu() { menu.classList.toggle('active'); }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        }

        function start() {
            document.getElementById('overlay').style.display = 'none';
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
            
            awakeVid.play().catch(() => {});
            requestWakeLock();
            
            startTime = performance.now();
            running = true;
            audio.play().catch(() => {});
            requestAnimationFrame(loop);
        }

        function loop() {
            if (!running) return;
            let now = (performance.now() - startTime) / 1000;
            
            // Interaction Heartbeat
            if (Math.floor(now) % 15 === 0) {
                if (!wakeLock) requestWakeLock();
                // Micro-scrolling can also keep some mobile displays active
                window.scrollBy(0, 1);
                window.scrollBy(0, -1);
            }

            const m = Math.floor(now / 60), s = Math.floor(now % 60), f = Math.floor((now % 1) * 30);
            clock.innerText = `${m}:${s.toString().padStart(2, '0')}:${f.toString().padStart(2, '0')}`;

            narrative.forEach(item => {
                if (now >= item.t && !item.played) {
                    item.played = true;
                    spawn(item, now);
                }
            });

            if (now > 60.5 && now < 84 && !finaleActive) {
                if (now - lastEpilogue > 2.0) {
                    spawn({ text: epilogue[epilogueWordIdx % epilogue.length], strobe: true, duration: 8.5 }, now);
                    epilogueWordIdx++;
                    lastEpilogue = now;
                }
            }

            if (now > 86 && !finaleActive) {
                finaleActive = true;
                spawn({ text: "TONIC", finale: true, duration: 15 }, now);
            }

            render(now);
            requestAnimationFrame(loop);
        }

        function spawn(item, now) {
            const el = document.createElement('div');
            el.className = 'k-text';
            
            const isMobile = window.innerWidth < 768;
            let size = isMobile ? 44 : 26; // Massive Typography
            if (item.strobe || item.finale) size *= 1.3;
            
            const lengthMod = Math.max(0.25, 1 - (item.text.length * 0.065));
            el.style.fontSize = (size * lengthMod) + 'vw';

            if (item.strobe || item.finale) {
                const container = document.createElement('div');
                container.className = 'strobe-container';
                for (let i = 0; i < 9; i++) {
                    const layer = document.createElement('div');
                    layer.className = 'strobe-layer';
                    layer.innerText = item.text;
                    layer.style.color = colors[Math.floor(Math.random() * colors.length)];
                    layer.style.animationDelay = `${i * -0.65}s`;
                    layer.style.marginLeft = `${(i - 4) * 4}px`;
                    container.appendChild(layer);
                }
                el.appendChild(container);
            } else {
                el.innerText = item.text;
                el.style.color = colors[Math.floor(Math.random() * colors.length)];
            }

            const ry = (slotIndex % 2 === 0 ? -48 : 48) + (Math.random() * 8 - 4);
            const rx = (Math.random() * 25 - 12.5);
            const rz = (Math.random() * 10 - 5) + (item.flip ? 180 : 0);
            
            const hSafe = isMobile ? 5 : 12; 
            const targetX = (Math.random() * hSafe - (hSafe / 2)); 
            
            const slots = [-26, -13, 0, 13, 26];
            const startY = slots[slotIndex % slots.length];
            slotIndex++;

            stage.appendChild(el);
            activeWords.push({
                dom: el,
                ry, rx, rz,
                startY, targetX,
                spawnTime: now,
                duration: item.duration || 3.8,
                finale: !!item.finale
            });

            setTimeout(() => el.style.opacity = 1, 10);
        }

        function render(now) {
            const timeRef = performance.now() * 0.002;
            
            activeWords.forEach((word, idx) => {
                const localT = now - word.spawnTime;
                let x = word.targetX, y = word.startY, z = 0, scale = 1, opacity = 1;
                
                const easeIn = 0.7, easeOut = 0.8;

                if (localT < easeIn) {
                    const p = 1 - Math.pow(1 - (localT / easeIn), 3);
                    z = -1600 * (1 - p);
                    scale = 0.15 + (0.85 * p);
                } else if (word.finale) {
                    x = 0; z = 0;
                    if (localT > 4.5) {
                        const shrink = Math.min(1, (localT - 4.5) / 5.5);
                        scale = 1 - shrink;
                        opacity = 1 - shrink;
                        if (shrink > 0.98) glimmer.style.opacity = 1;
                    }
                } else if (localT > word.duration - easeOut) {
                    const p = Math.pow((localT - (word.duration - easeOut)) / easeOut, 3);
                    z = 1800 * p;
                    scale = 1 + (4.5 * p);
                    if (p >= 1) {
                        word.dom.remove();
                        activeWords = activeWords.filter(w => w !== word);
                        return;
                    }
                }

                const fX = Math.sin(timeRef + idx) * 8;
                const fY = Math.cos(timeRef * 0.7 + idx) * 8;

                word.dom.style.opacity = opacity;
                word.dom.style.transform = `
                    translate(-50%, -50%)
                    translate3d(calc(${x}vw + ${fX}px), calc(${y}vh + ${fY}px), ${z}px)
                    rotateX(${word.rx}deg) rotateY(${word.ry}deg) rotateZ(${word.rz}deg)
                    scale(${scale})
                `;
            });
        }
    </script>
</body>
</html>
