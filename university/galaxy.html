<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solar System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020202; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; cursor: move; }

        /* UI Overlay */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100px; 
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid rgba(100, 200, 255, 0.2);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            border-radius: 12px;
            padding: 10px;
            color: white;
            z-index: 10;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            overflow: hidden;
            max-height: 80vh; 
        }

        /* Collapsed State - Higher specificity to ensure it works */
        #ui.collapsed {
            max-height: 40px !important; 
            width: 85px !important; /* Fixed width for minimized state */
            overflow: hidden;
        }

        .ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            margin-bottom: 10px;
            cursor: pointer; 
        }

        h2 { 
            margin: 0; 
            font-size: 11px; 
            color: #4dcfff; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            pointer-events: none;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: #4dcfff;
            font-size: 12px;
            cursor: pointer;
            padding: 0 5px;
            transition: transform 0.3s;
        }

        .ui-content {
            opacity: 1;
            transition: opacity 0.3s;
        }
        #ui.collapsed .ui-content { opacity: 0; pointer-events: none; }

        .planet-list {
            max-height: 60vh; 
            overflow-y: auto;
            padding-right: 5px;
        }
        
        /* Custom Scrollbar */
        .planet-list::-webkit-scrollbar { width: 4px; }
        .planet-list::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        .btn {
            display: flex;
            align-items: center;
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            color: #aaa;
            padding: 8px 10px;
            margin-bottom: 6px;
            cursor: pointer;
            text-align: left;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.1); color: white; transform: translateX(2px); }
        .btn.active { 
            background: rgba(77, 207, 255, 0.15); 
            color: #4dcfff; 
            border-color: rgba(77, 207, 255, 0.4); 
            font-weight: 600;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 10px;
            display: inline-block;
        }

        /* Stylized Reset Button */
        .reset-btn {
            display: block;
            width: 100%;
            margin-top: 15px;
            background: transparent;
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #4dff88;
            font-family: 'Segoe UI', sans-serif;
            font-variant: small-caps;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            padding-top: 10px;
            text-align: center;
            transition: color 0.2s;
        }
        .reset-btn:hover { color: white; text-shadow: 0 0 5px #4dff88; }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 15, 0.85);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #ccc;
            font-size: 12px;
            display: flex;
            gap: 20px;
            align-items: center;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            width: auto;
            max-width: 90vw;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        label { font-size: 10px; text-transform: uppercase; color: #4dcfff; letter-spacing: 1px; }

        input[type=range] { cursor: pointer; accent-color: #4dcfff; width: 120px; }
        
        #hints {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #555;
            font-size: 11px;
            text-align: right;
            pointer-events: none;
        }

        /* --- MOBILE ADJUSTMENTS --- */
        @media (max-width: 900px) {
            #ui { width: 100px; top: 10px; left: 10px; } /* Reduced width further */
            .btn { padding: 10px 8px; font-size: 12px; } /* More compact buttons */
            h2 { font-size: 12px; }
            #controls { bottom: 10px; padding: 10px 15px; border-radius: 15px; flex-wrap: wrap; justify-content: center; gap: 10px; }
            .control-group { flex-direction: row; width: 100%; justify-content: space-between; }
            input[type=range] { width: 60%; }
            #hints { display: none; }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="ui-header" onclick="toggleMenu()">
            <h2>NAV</h2>
            <button class="toggle-btn" id="menuIcon">▲</button>
        </div>
        
        <div class="ui-content">
            <div class="planet-list" id="buttons"></div>
            
            <button class="reset-btn" onclick="resetView()">
               RESET
            </button>
        </div>
    </div>

    <div id="controls">
        <div class="control-group">
            <label>Speed</label>
            <input type="range" id="speed" min="0" max="800" value="50">
        </div>
        <div class="control-group">
            <label>Tilt</label>
            <input type="range" id="tilt" min="10" max="100" value="70">
        </div>
        <div class="control-group">
            <label>Zoom</label>
            <input type="range" id="zoom" min="1" max="200" value="6">
        </div>
    </div>

    <div id="hints">
        Scroll to Zoom<br>Drag to Pan
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 

        let width, height;
        let particles = []; 

        // Camera State
        let camX = 0, camY = 0;
        const isMobile = window.innerWidth < 600;
        let defaultScale = isMobile ? 1.2 : 0.6;
        let scale = defaultScale;
        let targetScale = defaultScale; 
        let targetPlanet = null;
        let dragging = false;
        let lastMouseX, lastMouseY;

        // Data
        const planets = [
            { name: "Sun", r: 40, dist: 0, speed: 0, color: "#FFD700", type: 'star' },
            { name: "Mercury", r: 4, dist: 70, speed: 4.1, color: "#A5A5A5", type: 'rock' },
            { name: "Venus", r: 7.5, dist: 110, speed: 1.6, color: "#E3BB76", type: 'atmosphere' },
            { 
                name: "Earth", r: 8, dist: 160, speed: 1, color: "#2233FF", type: 'earth', 
                moons: [{dist: 18, r: 2.2, speed: 12, color: "#DDD"}] 
            },
            { 
                name: "Mars", r: 5.5, dist: 220, speed: 0.53, color: "#E25822", type: 'rock',
                moons: [{dist: 10, r: 1.0, speed: 15, color: "#888"}, {dist: 16, r: 0.8, speed: 10, color: "#777"}]
            },
            { 
                name: "Jupiter", r: 25, dist: 380, speed: 0.08, color: "#D8CA9D", type: 'gas',
                moons: [{dist: 32, r: 2.0, speed: 8, color: "#e3dccb"}, {dist: 38, r: 1.8, speed: 6, color: "#b8c9d1"}, {dist: 48, r: 3.2, speed: 4, color: "#a8a193"}, {dist: 60, r: 3.0, speed: 2.5, color: "#6e6a63"}]
            },
            { 
                name: "Saturn", r: 21, dist: 530, speed: 0.03, color: "#F4D03F", type: 'ringed',
                moons: [{dist: 35, r: 2.8, speed: 4, color: "#e0c872"}, {dist: 28, r: 1.2, speed: 6, color: "#ccc"}]
            },
            { 
                name: "Uranus", r: 14, dist: 680, speed: 0.01, color: "#93B8BE", type: 'ice',
                moons: [{dist: 22, r: 1.0, speed: 5, color: "#fff"}]
            },
            { 
                name: "Neptune", r: 13.5, dist: 820, speed: 0.006, color: "#2D4EA3", type: 'ice',
                moons: [{dist: 20, r: 1.5, speed: -4, color: "#ddd"}]
            },
            { name: "Pluto", r: 3, dist: 950, speed: 0.004, color: "#9CA6B7", type: 'rock' }
        ];

        planets.forEach(p => {
            p.angle = Math.random() * Math.PI * 2;
            p.rotation = Math.random() * Math.PI * 2; 
            if(p.moons) p.moons.forEach(m => m.angle = Math.random() * Math.PI * 2);
        });

        function init() {
            for(let i=0; i<800; i++) {
                particles.push({
                    x: (Math.random() - 0.5) * 4000,
                    y: (Math.random() - 0.5) * 4000,
                    z: Math.random() * 2 + 0.5,
                    size: Math.random() * 1.5
                });
            }
            generateUI();
            updateZoomSlider(defaultScale);
            resize();
            document.getElementById('zoom').addEventListener('input', (e) => { targetScale = e.target.value / 10; });
            loop();
        }

        function generateUI() {
            const container = document.getElementById('buttons');
            planets.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.name}`;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    focusPlanet(p);
                    if (window.innerWidth < 600) {
                        document.getElementById('ui').classList.add('collapsed');
                        document.getElementById('menuIcon').innerText = '▼';
                    }
                };
                container.appendChild(btn);
            });
        }

        function toggleMenu() {
            const ui = document.getElementById('ui');
            const icon = document.getElementById('menuIcon');
            ui.classList.toggle('collapsed');
            icon.innerText = ui.classList.contains('collapsed') ? '▼' : '▲';
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if(!targetPlanet) { camX = width/2; camY = height/2; }
        }
        window.addEventListener('resize', resize);

        // Input
        canvas.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', () => dragging = false);
        window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', e => { if(e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
        window.addEventListener('touchend', () => dragging = false);
        canvas.addEventListener('touchmove', e => { if(e.touches.length === 1 && dragging) { e.preventDefault(); moveDrag(e.touches[0].clientX, e.touches[0].clientY); } }, {passive: false});

        function startDrag(x, y) { dragging = true; targetPlanet = null; lastMouseX = x; lastMouseY = y; updateBtnState(null); }
        function moveDrag(x, y) { if (dragging) { camX += x - lastMouseX; camY += y - lastMouseY; lastMouseX = x; lastMouseY = y; } }
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            let newScale = targetScale * (1 + (-e.deltaY * 0.001));
            targetScale = Math.max(0.1, Math.min(newScale, 20)); 
            updateZoomSlider(targetScale);
        }, { passive: false });
        function updateZoomSlider(val) { document.getElementById('zoom').value = val * 10; }

        function loop() {
            const speed = document.getElementById('speed').value / 40;
            const tiltFactor = document.getElementById('tilt').value / 100; 

            planets.forEach(p => {
                if (p.dist > 0) { p.angle += (p.speed * 0.01) * speed; p.rotation += 0.01 + (speed * 0.02); }
                if (p.moons) { p.moons.forEach(m => m.angle += (m.speed * 0.01) * speed); }
            });

            // Smooth Zoom Transition
            scale += (targetScale - scale) * 0.05;

            // Camera Tracking
            if (targetPlanet) {
                const pX = Math.cos(targetPlanet.angle) * targetPlanet.dist;
                const pY = Math.sin(targetPlanet.angle) * targetPlanet.dist * tiltFactor; 
                
                // HARD LOCK: Directly set camera so planet is always at center
                // No easing (* 0.1) here, preventing drift/jitter.
                camX = (width / 2) - (pX * scale);
                camY = (height / 2) - (pY * scale);
            }

            drawStarfield();

            ctx.lineWidth = 1;
            planets.forEach(p => {
                if(p.dist > 0) {
                    ctx.beginPath();
                    ctx.ellipse(camX, camY, p.dist * scale, p.dist * scale * tiltFactor, 0, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0.05, 0.2 - (p.dist/2000))})`; 
                    ctx.stroke();
                }
            });

            const renderList = [...planets];
            renderList.sort((a, b) => (Math.sin(a.angle) * a.dist) - (Math.sin(b.angle) * b.dist));
            renderList.forEach(p => drawPlanet3D(p, tiltFactor));

            requestAnimationFrame(loop);
        }

        function drawPlanet3D(p, tilt) {
            const x = camX + Math.cos(p.angle) * p.dist * scale;
            const y = camY + Math.sin(p.angle) * p.dist * tilt * scale;
            const r = p.r * scale;

            if (x < -r || x > width + r || y < -r || y > height + r) return;

            ctx.save();
            ctx.translate(x, y);

            if (p.type === 'ringed') drawRingSystem(ctx, r, tilt, 'back');

            if (p.type === 'star') {
                // SUN
                const glow = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r * 3);
                glow.addColorStop(0, '#FFF'); glow.addColorStop(0.1, '#FFD700'); glow.addColorStop(0.4, 'rgba(255, 100, 0, 0.4)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, r * 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
            } else {
                // LIGHTING ENGINE
                const angleToSun = Math.atan2(camY - y, camX - x);
                const sunDist = Math.sqrt((camX - x)**2 + (camY - y)**2); // Approx distance on screen
                
                // Base Planet
                ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); 
                
                // Day/Night Logic
                // We calculate a gradient vector pointing towards the sun
                const gradX = Math.cos(angleToSun) * r;
                const gradY = Math.sin(angleToSun) * r;
                
                // Refined Gradient
                const grad = ctx.createRadialGradient(gradX * 0.5, gradY * 0.5, r * 0.1, 0, 0, r);
                grad.addColorStop(0, p.type === 'gas' ? '#fff' : '#ffffff');
                grad.addColorStop(0.3, p.color); // Midtone
                grad.addColorStop(1, '#000000'); // Shadow edge

                ctx.fillStyle = grad;
                ctx.fill();

                // SURFACE DETAILS
                ctx.save(); ctx.clip(); 
                if (p.type === 'earth') {
                    // Complex Continents
                    ctx.fillStyle = '#2d8f3e'; ctx.globalAlpha = 0.9;
                    for(let i=0; i<8; i++) {
                        const offset = (p.rotation * (40 + i*5)) % (r * 5) - r * 2.5;
                        const vOffset = Math.sin(i*132 + p.rotation)*r*0.4;
                        ctx.beginPath();
                        ctx.moveTo(offset, vOffset);
                        for(let j=0; j<6; j++) {
                            ctx.lineTo(offset + Math.cos(j)*r*0.4, vOffset + Math.sin(j)*r*0.3);
                        }
                        ctx.fill();
                    }
                    // Clouds
                    ctx.fillStyle = '#FFF'; ctx.globalAlpha = 0.35;
                    for(let i=0; i<6; i++) {
                        const offset = (p.rotation * (60+i*10) + 100) % (r * 5) - r * 2.5;
                        ctx.beginPath(); ctx.ellipse(offset, Math.cos(i*55)*r*0.4, r*0.7, r*0.25, 0, 0, Math.PI*2); ctx.fill();
                    }
                } 
                else if (p.type === 'gas') {
                    ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    const yOffset = (p.rotation * 10) % 20; 
                    for(let i=0; i<5; i++) { ctx.fillRect(-r, -r + (i*r*0.5) + yOffset, r*2, r*0.2); }
                }
                ctx.restore(); 

                // RIM LIGHT / CORONA (If planet overlaps sun)
                if (sunDist < r * 2.0) {
                     const intensity = Math.max(0, 1 - (sunDist / (r*2.0)));
                     if (intensity > 0) {
                         ctx.shadowBlur = 15 * intensity;
                         ctx.shadowColor = '#fff';
                         ctx.strokeStyle = `rgba(255,255,255,${intensity})`;
                         ctx.lineWidth = 2;
                         ctx.stroke();
                         ctx.shadowBlur = 0;
                     }
                }

                // HARD SHADOW (Night Side)
                ctx.save();
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
                const shadowGrad = ctx.createRadialGradient(gradX, gradY, r*0.2, 0, 0, r*1.5);
                shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
                shadowGrad.addColorStop(0.5, 'rgba(0,0,0,0.5)');
                shadowGrad.addColorStop(1, 'rgba(0,0,0,1)');
                ctx.fillStyle = shadowGrad;
                ctx.fillRect(-r, -r, r*2, r*2);
                ctx.restore();
            }

            if (p.type === 'ringed') drawRingSystem(ctx, r, tilt, 'front');

            if(p.moons) {
                p.moons.forEach(m => {
                    const mx = Math.cos(m.angle) * m.dist * scale;
                    const my = Math.sin(m.angle) * m.dist * tilt * scale;
                    ctx.beginPath(); ctx.arc(mx, my, m.r * scale, 0, Math.PI*2);
                    ctx.fillStyle = m.color; ctx.fill();
                });
            }
            
            if(scale > 0.4 || p.name === 'Sun' || p.name === 'Jupiter') {
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = '11px Segoe UI';
                ctx.fillText(p.name, r + 5, 4);
            }
            ctx.restore(); 
        }

        function drawRingSystem(ctx, r, tilt, layer) {
            ctx.save();
            ctx.rotate(Math.PI / 9); 
            const ringColor = '210, 200, 170'; 
            const bands = [{ start: 1.3, end: 1.6, alpha: 0.3 }, { start: 1.7, end: 2.1, alpha: 0.5 }, { start: 2.2, end: 2.4, alpha: 0.2 }];
            const startAngle = layer === 'front' ? 0 : 0;
            const endAngle = layer === 'front' ? Math.PI : Math.PI * 2;
            const ringTilt = tilt * 0.4; 

            bands.forEach(band => {
                 ctx.beginPath();
                 ctx.ellipse(0, 0, r * band.end, r * band.end * ringTilt, 0, startAngle, endAngle);
                 ctx.strokeStyle = `rgba(${ringColor}, ${band.alpha})`;
                 ctx.lineWidth = r * (band.end - band.start); 
                 const midR = r * ((band.start + band.end) / 2);
                 ctx.beginPath();
                 ctx.ellipse(0, 0, midR, midR * ringTilt, 0, startAngle, endAngle);
                 ctx.stroke();
            });
            ctx.restore();
        }

        function drawStarfield() {
            ctx.fillStyle = '#020202'; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = 'white';
            particles.forEach(p => {
                let sx = (p.x + camX * p.z * 0.1) % 4000;
                let sy = (p.y + camY * p.z * 0.1) % 4000;
                if (sx < 0) sx += 4000; if (sy < 0) sy += 4000;
                if(sx > 0 && sx < width && sy > 0 && sy < height) {
                    ctx.globalAlpha = Math.random() * 0.5 + 0.3; 
                    ctx.beginPath(); ctx.arc(sx, sy, p.size, 0, Math.PI*2); ctx.fill();
                }
            });
            ctx.globalAlpha = 1.0;
        }

        function focusPlanet(p) {
            targetPlanet = p;
            updateBtnState(p.name);
            if(p.name === 'Sun') targetScale = 0.3;
            else if(p.dist < 200) targetScale = isMobile ? 3.5 : 2.5; 
            else targetScale = isMobile ? 1.5 : 1.0; 
            updateZoomSlider(targetScale);
        }

        function resetView() {
            targetPlanet = null;
            targetScale = defaultScale;
            camX = width / 2;
            camY = height / 2;
            updateBtnState(null);
            updateZoomSlider(targetScale);
        }

        function updateBtnState(name) {
            const btns = document.querySelectorAll('.btn');
            btns.forEach(b => {
                if (b.innerText.includes(name)) b.classList.add('active');
                else b.classList.remove('active');
            });
        }

        init();
    </script>
    <script src="nav.js"></script>
</body>
</html>
