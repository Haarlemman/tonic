<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Universe [Full Color Control]</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;600&family=Space+Grotesk:wght@300;700&display=swap');

        body {
            margin: 0;
            background-color: #000; 
            color: #FFF;
            font-family: 'Jost', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        canvas { display: block; }

        /* --- UI LAYER --- */
        #info-panel {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
            opacity: 0; 
            transition: opacity 1s ease-in;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding-bottom: 50px;
        }

        #phase-display {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            min-height: 1.5em; 
        }

        .slider-wrapper {
            width: 70%;
            max-width: 800px;
            pointer-events: auto;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .slider-wrapper:hover { opacity: 1; }

        input[type=range] {
            width: 100%;
            accent-color: #0ff;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            appearance: none;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 14px; height: 14px;
            background: #000;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px #fff;
        }

        /* --- START SCREEN --- */
        #start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease-out; 
        }

        #ignite-btn {
            background: #043Dc5;
            color: #fff;
            font-family: 'Space Grotesk', monospace;
            font-size: 2rem;
   	        font-weight: 700;
            letter-spacing: 2px;
            padding: 10px 20px;
            border: 2px solid #fff;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        #ignite-btn:hover {
            background: #EEFF11;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

    </style>
</head>
<body>

    <div id="start-screen">
        <button id="ignite-btn">BIG BANG</button>
    </div>

    <div id="canvas-container">
        <canvas id="wireCanvas"></canvas>
    </div>

    <div id="info-panel">
        <div id="phase-display">SYSTEM INITIALIZED</div>
        <div class="slider-wrapper">
            <input type="range" id="depthSlider" min="0" max="15500" value="0" step="1">
        </div>
    </div>

    <script>
        // ======================================================
        //     DESIGNER CONTROL CENTER (COLOR PALETTE)
        // ======================================================
        const UNIVERSE_CONFIG = {
            // General Settings
            background: '#000003',  
            textGlow: '#00FFFF',    // The color of the UI text at bottom
            
            // --- THE PALETTE: Individual colors for every object ---
            palette: {
                stars: '#eeeeff',       // The background stars
                singularity: '#ffee99', // The first dot (start)
                bangLines: '#eeddaa',   // The explosion lines
                quantum: '#0000ff',     // The jittery dots
                atomOrbits: '#990000',  // The rings of the atom
                electrons: '#00FFFF',   // The dots orbiting the atom
                dna: '#ffeeaa',         // The double helix
                neural: '#6699FF',      // The connecting nodes/lines
                fibonacci: '#ffee00',   // The spiral flower pattern
                geometry: '#FF9900',    // The floating triangle/shapes
                tesseract: '#00CCFF',   // The rotating 4D cube
                solar: '#FF5555',       // The solar system rings
                web: '#eedd00',         // The spiderwebs near the end
                horizon: '#ff0000'      // The final circle/gateway
            },

            // Audio & Physics
            audio: {
                droneBaseFreq: 55,
                droneVolume: 0.35,
                pingPitch: 100
            },
            physics: {
                baseSpeed: 15,
                brakeStart: 11500,
                idleDelay: 3000
            },
            text: {
                stages: [
                    { z: 800,  text: "IGNITION" },
                    { z: 1800, text: "QUANTUM" },
                    { z: 2800, text: "ATOMIC" },
                    { z: 3800, text: "BIOLOGIC" },
                    { z: 4800, text: "NEURAL" },
                    { z: 5800, text: "SEQUENCE" },
                    { z: 6800, text: "GEOMETRY" },
                    { z: 7800, text: "PARADOX" },
                    { z: 8800, text: "STELLAR" },
                    { z: 9800, text: "GALACTIC" },
                    { z: 11200,text: "EVENT HORIZON" }
                ]
            }
        };

        // ======================================================
        //     ENGINE START
        // ======================================================

        const rootStyles = document.documentElement.style;
        document.body.style.backgroundColor = UNIVERSE_CONFIG.background;
        
        const phaseEl = document.getElementById('phase-display');
        phaseEl.style.color = UNIVERSE_CONFIG.textGlow;
        phaseEl.style.textShadow = `0 0 10px ${UNIVERSE_CONFIG.textGlow}AA`;

        const canvas = document.getElementById('wireCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const slider = document.getElementById('depthSlider');
        const infoPanel = document.getElementById('info-panel');
        const startScreen = document.getElementById('start-screen');
        const igniteBtn = document.getElementById('ignite-btn');

        let width, height, cx, cy;
        let scrollPos = 0;
        let targetScroll = 0;
        let time = 0;

        let universeStarted = false;
        let lastInteraction = Date.now();
        let isAutoPlaying = false;
        
        // --- AUDIO ---
        let audioCtx, droneOsc, lfo, masterGain, filter;
        const BASE_FREQ = UNIVERSE_CONFIG.audio.droneBaseFreq;
        const BASE_GAIN = UNIVERSE_CONFIG.audio.droneVolume;

        igniteBtn.addEventListener('click', () => {
            initAudioContextOnly(); 
            playPing(); 
            igniteBtn.style.opacity = 0; 
            igniteBtn.style.pointerEvents = 'none';
            setTimeout(() => { launchUniverse(); }, 1000);
        });

        function initAudioContextOnly() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function launchUniverse() {
            universeStarted = true;
            startScreen.style.display = 'none';
            infoPanel.style.opacity = 1; 
            startBackgroundDrone();
            playBoom();
            isAutoPlaying = true;
            lastInteraction = Date.now() - UNIVERSE_CONFIG.physics.idleDelay - 100;
        }

        function startBackgroundDrone() {
            if (!audioCtx) return;
            masterGain = audioCtx.createGain();
            masterGain.gain.value = BASE_GAIN; 
            masterGain.connect(audioCtx.destination);
            droneOsc = audioCtx.createOscillator();
            droneOsc.type = 'sawtooth';
            droneOsc.frequency.value = BASE_FREQ; 
            filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 180;
            lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 0.15; 
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 100; 
            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            droneOsc.connect(filter);
            filter.connect(masterGain);
            droneOsc.start();
            lfo.start();
        }

        function playPing() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(UNIVERSE_CONFIG.audio.pingPitch, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(UNIVERSE_CONFIG.audio.pingPitch*1.5, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playBoom() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 1.0);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 2.0);
        }

        function playBlip() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = Math.random() > 0.5 ? 'sine' : 'square';
            osc.frequency.value = 800 + Math.random() * 1200;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function updateAudioEngine(z) {
            if (!audioCtx || !droneOsc || !lfo) return;
            const startZ = 11000;
            const endZ = 15500; 
            if (z > startZ) {
                const progress = Math.min(1, (z - startZ) / (endZ - startZ)); 
                droneOsc.frequency.setTargetAtTime(BASE_FREQ + (progress * 130), audioCtx.currentTime, 0.05);
                lfo.frequency.setTargetAtTime(0.15 + (progress * 8), audioCtx.currentTime, 0.05);
                filter.frequency.setTargetAtTime(180 + (progress * 400), audioCtx.currentTime, 0.05);
                masterGain.gain.setTargetAtTime(BASE_GAIN + (progress * 0.3), audioCtx.currentTime, 0.05);
            } else {
                if (droneOsc.frequency.value > BASE_FREQ + 5) {
                    droneOsc.frequency.setValueAtTime(BASE_FREQ, audioCtx.currentTime);
                    lfo.frequency.setValueAtTime(0.15, audioCtx.currentTime);
                    filter.frequency.setValueAtTime(180, audioCtx.currentTime);
                    masterGain.gain.setValueAtTime(BASE_GAIN, audioCtx.currentTime);
                }
            }
        }

        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";
        let currentText = "SYSTEM INITIALIZED";
        let decodeInterval = null;

        function setDecoderText(newText) {
            if (currentText === newText) return;
            currentText = newText;
            let iteration = 0;
            clearInterval(decodeInterval);
            if (universeStarted) playBlip();
            decodeInterval = setInterval(() => {
                phaseEl.innerText = newText
                    .split("")
                    .map((letter, index) => {
                        if(index < iteration) return newText[index];
                        return chars[Math.floor(Math.random() * chars.length)];
                    })
                    .join("");
                if(iteration >= newText.length) { 
                    clearInterval(decodeInterval);
                    phaseEl.innerText = newText; 
                }
                iteration += 1/2; 
            }, 30);
        }

        setInterval(() => {
            if (!currentText || (decodeInterval !== null && decodeInterval._id !== null)) return;
            if(Math.random() > 0.8 && universeStarted) {
                const arr = currentText.split("");
                const idx = Math.floor(Math.random() * arr.length);
                if (arr[idx] === ' ') return; 
                arr[idx] = chars[Math.floor(Math.random() * chars.length)];
                phaseEl.innerText = arr.join("");
                if(Math.random() > 0.7) playBlip();
                setTimeout(() => { phaseEl.innerText = currentText; }, 100);
            }
        }, 800);

        const FL = 500; 
        const WORLD_END = 15500; 
        let objects = [];
        let stars = [];

        function initWorld() {
            objects = [];
            stars = [];
            // Stars
            for(let i=0; i<300; i++) {
                stars.push({
                    x: (Math.random()-0.5) * 5000,
                    y: (Math.random()-0.5) * 5000,
                    z: Math.random() * 2000,
                    zOffset: Math.random() * WORLD_END 
                });
            }
            // Objects
            objects.push({ type: 'singularity', z: 600, x: 0, y: 0 });
            for(let i=0; i<60; i++) {
                objects.push({
                    type: 'bang', z: 1200, 
                    x: 0, y: 0, angle: Math.random() * Math.PI * 2,
                    speed: 2 + Math.random()*8, len: 50 + Math.random()*200
                });
            }
            for(let i=0; i<80; i++) {
                objects.push({
                    type: 'quantum', z: 2400 + (Math.random()-0.5)*500,
                    x: (Math.random()-0.5)*400, y: (Math.random()-0.5)*400,
                    phase: Math.random() * Math.PI * 2
                });
            }
            objects.push({ type: 'atom', z: 3400, x: 0, y: 0, r: 180 });
            for(let i=0; i<60; i++) {
                objects.push({
                    type: 'dna', z: 4400 + (i * 12), 
                    x: 0, y: 0, index: i, width: 100
                });
            }
            for(let i=0; i<15; i++) {
                objects.push({
                    type: 'node', z: 5400 + (Math.random()-0.5)*600,
                    x: (Math.random()-0.5)*600, y: (Math.random()-0.5)*600,
                    size: 2 + Math.random()*4
                });
            }
            const goldenAngle = Math.PI * (3 - Math.sqrt(5));
            for(let i=0; i<150; i++) {
                let r = Math.sqrt(i) * 35; 
                let theta = i * goldenAngle;
                objects.push({
                    type: 'fib', z: 6400, x: r * Math.cos(theta), y: r * Math.sin(theta), idx: i
                });
            }
            objects.push({ type: 'geo', z: 7400, x: 0, y: 0, r: 250 });
            objects.push({ type: 'tesseract', z: 8400, x: 0, y: 0, s: 300 });
            objects.push({ type: 'solar', z: 9400, x: 0, y: 0, r: 400 });
            for(let i=0; i<25; i++) {
                objects.push({
                    type: 'web', z: 10800 + (Math.random()-0.5)*1000,
                    x: (Math.random()-0.5)*1000, y: (Math.random()-0.5)*1000,
                    size: 10 + Math.random()*20
                });
            }
            objects.push({ type: 'horizon', z: 15500, x: 0, y: 0, r: 150 });
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2;
        }

        function interact() {
            if(!universeStarted) return; 
            lastInteraction = Date.now();
            isAutoPlaying = false;
        }

        slider.addEventListener('input', (e) => {
            targetScroll = parseFloat(e.target.value);
            interact();
        });
        window.addEventListener('wheel', (e) => {
            targetScroll += e.deltaY;
            targetScroll = Math.max(0, Math.min(WORLD_END + 1000, targetScroll));
            slider.value = targetScroll;
            interact();
        });

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // --- DRAW LOOP ---
        function draw() {
            if (universeStarted && Date.now() - lastInteraction > UNIVERSE_CONFIG.physics.idleDelay) {
                if(!isAutoPlaying) isAutoPlaying = true;
                let speed = UNIVERSE_CONFIG.physics.baseSpeed; 
                if (targetScroll > UNIVERSE_CONFIG.physics.brakeStart) {
                    let endDist = WORLD_END - UNIVERSE_CONFIG.physics.brakeStart;
                    let endProgress = (targetScroll - UNIVERSE_CONFIG.physics.brakeStart) / endDist;
                    if (endProgress > 1) endProgress = 1;
                    speed = UNIVERSE_CONFIG.physics.baseSpeed - (endProgress * (UNIVERSE_CONFIG.physics.baseSpeed - 2)); 
                }
                targetScroll += speed;
                if (targetScroll >= WORLD_END) { targetScroll = 0; scrollPos = 0; }
                slider.value = targetScroll;
            }

            scrollPos = lerp(scrollPos, targetScroll, 0.1);
            time += 0.02;

            if (universeStarted) updateAudioEngine(scrollPos);

            ctx.fillStyle = UNIVERSE_CONFIG.background;
            ctx.fillRect(0, 0, width, height);
            
            if (!universeStarted) {
                ctx.fillStyle = UNIVERSE_CONFIG.palette.singularity;
                ctx.beginPath(); 
                ctx.arc(cx, cy, 2 + Math.sin(time*2), 0, Math.PI*2); 
                ctx.fill();
                requestAnimationFrame(draw);
                return;
            }

            updateTitle(scrollPos);

            let globalOpacity = 1;
            if (scrollPos > 14500) globalOpacity = Math.max(0, (15500 - scrollPos) / 1000);
            if (globalOpacity <= 0.01) { requestAnimationFrame(draw); return; }

            // DRAW STARS
            if (scrollPos > 1200) drawStars(globalOpacity);

            objects.forEach(obj => {
                let relZ = obj.z - scrollPos;
                if (scrollPos < 800) { if (obj.type !== 'singularity' && obj.type !== 'bang') return; }
                if (obj.type === 'horizon' && scrollPos > 15300) return;
                if (relZ < 10 || relZ > 3500) return; 

                let scale = FL / relZ;
                if (scale > 20) return; 
                let x2d = cx + obj.x * scale;
                let y2d = cy + obj.y * scale;
                let alpha = Math.min(1, (3500 - relZ) / 1000) * globalOpacity; 
                
                // Suck Logic
                if (scrollPos > 11000 && obj.type !== 'horizon') {
                    let suck = Math.min(1.0, (scrollPos - 11000) / 4500);
                    x2d = lerp(x2d, cx, suck);
                    y2d = lerp(y2d, cy, suck);
                    let ang = Math.atan2(y2d-cy, x2d-cx) + suck * 3; 
                    let dist = Math.sqrt((x2d-cx)**2 + (y2d-cy)**2);
                    x2d = cx + Math.cos(ang)*dist;
                    y2d = cy + Math.sin(ang)*dist;
                }

                ctx.globalAlpha = alpha;
                
                // Helper for converting hex to rgba with alpha
                const getCol = (hex) => hex; 

                if (obj.type === 'singularity') {
                    ctx.fillStyle = UNIVERSE_CONFIG.palette.singularity;
                    let pulse = 2 * scale;
                    if (scrollPos > 100) pulse += Math.sin(time*20) * 2;
                    ctx.beginPath(); ctx.arc(x2d, y2d, pulse, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'bang') {
                    ctx.strokeStyle = UNIVERSE_CONFIG.palette.bangLines;
                    ctx.lineWidth = 1.5;
                    let progress = (scrollPos - 600) / 800; 
                    if (progress < 0) progress = 0;
                    let burst = Math.pow(progress, 2) * 2000;
                    if (burst > 0) {
                        let ex = x2d + Math.cos(obj.angle) * burst * scale;
                        let ey = y2d + Math.sin(obj.angle) * burst * scale;
                        let tx = x2d + Math.cos(obj.angle) * (burst - obj.len) * scale;
                        let ty = y2d + Math.sin(obj.angle) * (burst - obj.len) * scale;
                        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(ex, ey); ctx.stroke();
                    }
                } 
                else if (obj.type === 'quantum') {
                    ctx.fillStyle = UNIVERSE_CONFIG.palette.quantum;
                    let jx = x2d + (Math.sin(time*5 + obj.phase)*10*scale);
                    let jy = y2d + (Math.cos(time*5 + obj.phase)*10*scale);
                    ctx.beginPath(); ctx.arc(jx, jy, 1.5*scale, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'atom') {
                    let r = obj.r * scale;
                    let minorR = r * 0.5; 
                    for(let i=0; i<3; i++) {
                        ctx.strokeStyle = UNIVERSE_CONFIG.palette.atomOrbits;
                        ctx.lineWidth = 1;
                        ctx.beginPath(); 
                        let angleTilt = (Math.PI/3)*i; 
                        ctx.ellipse(x2d, y2d, r, minorR, angleTilt + time*0.5, 0, Math.PI*2);
                        ctx.stroke();
                        if (i < 2) {
                            let speed = (i === 0) ? time * 3 : time * 4 + 2; 
                            let ex_local = r * Math.cos(speed);
                            let ey_local = minorR * Math.sin(speed);
                            let rotation = angleTilt + time*0.5;
                            let ex_rot = ex_local * Math.cos(rotation) - ey_local * Math.sin(rotation);
                            let ey_rot = ex_local * Math.sin(rotation) + ey_local * Math.cos(rotation);
                            let electronX = x2d + ex_rot;
                            let electronY = y2d + ey_rot;
                            ctx.fillStyle = UNIVERSE_CONFIG.palette.electrons; 
                            ctx.beginPath(); ctx.arc(electronX, electronY, 4*scale, 0, Math.PI*2); ctx.fill();
                        }
                    }
                    ctx.fillStyle = UNIVERSE_CONFIG.palette.atomOrbits;
                    ctx.beginPath(); ctx.arc(x2d, y2d, 5*scale, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'dna') {
                    ctx.fillStyle = UNIVERSE_CONFIG.palette.dna;
                    ctx.strokeStyle = UNIVERSE_CONFIG.palette.dna;
                    ctx.lineWidth = 1.5;
                    let w = obj.width * scale;
                    let twistSpeed = time * 2;
                    let strandTwist = obj.index * 0.3;
                    let tumbleAngle = time * 0.5;
                    let phase = strandTwist + twistSpeed;
                    let localX = Math.sin(phase) * w;
                    let rx1 = localX * Math.cos(tumbleAngle);
                    let ry1 = localX * Math.sin(tumbleAngle);
                    let rx2 = -localX * Math.cos(tumbleAngle);
                    let ry2 = -localX * Math.sin(tumbleAngle);
                    let px1 = x2d + rx1;
                    let py1 = y2d + ry1;
                    let px2 = x2d + rx2;
                    let py2 = y2d + ry2;
                    ctx.fillRect(px1 - scale, py1 - scale, 2*scale, 2*scale); 
                    ctx.fillRect(px2 - scale, py2 - scale, 2*scale, 2*scale); 
                    if (obj.index % 2 === 0) {
                        ctx.beginPath(); ctx.moveTo(px1, py1); ctx.lineTo(px2, py2); ctx.stroke();
                    }
                }
                else if (obj.type === 'node') {
                    ctx.strokeStyle = UNIVERSE_CONFIG.palette.neural;
                    ctx.fillStyle = UNIVERSE_CONFIG.palette.neural;
                    ctx.lineWidth = 1.5;
                    for(let k=0; k<3; k++) {
                        let a = (Math.PI*2/3)*k + time*0.2;
                        let len = 30 * scale;
                        ctx.beginPath(); ctx.moveTo(x2d, y2d); ctx.lineTo(x2d + Math.cos(a)*len, y2d + Math.sin(a)*len); ctx.stroke();
                    }
                    ctx.beginPath(); ctx.arc(x2d, y2d, 4*scale, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'fib') {
                    ctx.fillStyle = UNIVERSE_CONFIG.palette.fibonacci;
                    let r = Math.sqrt(obj.x*obj.x + obj.y*obj.y);
                    let baseAng = Math.atan2(obj.y, obj.x);
                    let finalAng = baseAng + time * 0.5;
                    let rotX = r * Math.cos(finalAng);
                    let rotY = r * Math.sin(finalAng);
                    let finalX = cx + rotX * scale;
                    let finalY = cy + rotY * scale;
                    let dotSize = (1.5 + (obj.idx/50)) * scale;
                    ctx.beginPath(); ctx.arc(finalX, finalY, dotSize, 0, Math.PI*2); ctx.fill();
                }
                else if (obj.type === 'geo') {
                    ctx.strokeStyle = UNIVERSE_CONFIG.palette.geometry;
                    ctx.lineWidth = 1.5;
                    let r = obj.r * scale;
                    ctx.save();
                    ctx.translate(x2d, y2d); ctx.rotate(time * 0.5);
                    ctx.beginPath();
                    ctx.moveTo(0, -r); ctx.lineTo(r*0.866, r*0.5); ctx.lineTo(-r*0.866, r*0.5);
                    ctx.closePath(); ctx.stroke();
                    ctx.rotate(time * 0.2);
                    ctx.strokeRect(-r*0.7, -r*0.7, r*1.4, r*1.4);
                    ctx.beginPath(); ctx.arc(0, 0, r*0.5, 0, Math.PI*2); ctx.stroke();
                    ctx.restore();
                }
                else if (obj.type === 'tesseract') {
                    ctx.strokeStyle = UNIVERSE_CONFIG.palette.tesseract;
                    ctx.lineWidth = 1.5;
                    let s = obj.s * scale;
                    ctx.save();
                    ctx.translate(x2d, y2d);
                    ctx.rotate(time);
                    ctx.strokeRect(-s/2, -s/2, s, s);
                    ctx.rotate(time);
                    let is = s * 0.5;
                    ctx.strokeRect(-is/2, -is/2, is, is); 
                    ctx.beginPath();
                    ctx.moveTo(-s/2, -s/2); ctx.lineTo(-is/2, -is/2);
                    ctx.moveTo(s/2, -s/2); ctx.lineTo(is/2, -is/2);
                    ctx.moveTo(s/2, s/2); ctx.lineTo(is/2, is/2);
                    ctx.moveTo(-s/2, s/2); ctx.lineTo(-is/2, is/2);
                    ctx.stroke();
                    ctx.restore();
                }
                else if (obj.type === 'solar') {
                    ctx.strokeStyle = UNIVERSE_CONFIG.palette.solar;
                    ctx.lineWidth = 1.5;
                    let r = obj.r * scale;
                    ctx.beginPath(); ctx.arc(x2d, y2d, 10*scale, 0, Math.PI*2); ctx.stroke();
                    for(let i=1; i<5; i++) {
                        let or = (r/5)*i;
                        ctx.beginPath(); ctx.ellipse(x2d, y2d, or, or*0.4, time*0.1, 0, Math.PI*2); ctx.stroke();
                    }
                }
                else if (obj.type === 'web') {
                    ctx.fillStyle = UNIVERSE_CONFIG.palette.web;
                    ctx.strokeStyle = UNIVERSE_CONFIG.palette.web;
                    let r = obj.size * scale;
                    ctx.beginPath(); ctx.arc(x2d, y2d, r, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(x2d, y2d); ctx.lineTo(cx, cy); 
                    ctx.globalAlpha = alpha * 0.2; ctx.stroke();
                }
                else if (obj.type === 'horizon') {
                    ctx.fillStyle = '#000'; // Void center stays black
                    ctx.strokeStyle = UNIVERSE_CONFIG.palette.horizon;
                    ctx.lineWidth = 2;
                    let r = obj.r * scale;
                    ctx.beginPath(); ctx.arc(x2d, y2d, r, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x2d, y2d, r, 0, Math.PI*2); ctx.stroke();
                    ctx.save();
                    ctx.translate(x2d, y2d);
                    ctx.scale(1, 0.1); 
                    ctx.rotate(time * 0.2 + Math.sin(time)*0.1);
                    ctx.beginPath(); ctx.arc(0, 0, r * 2.0, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(0, 0, r * 2.8, 0, Math.PI*2); ctx.stroke();
                    ctx.restore();
                }
            });

            ctx.globalAlpha = 1;
            requestAnimationFrame(draw);
        }

        function drawStars(opacity) {
            ctx.fillStyle = UNIVERSE_CONFIG.palette.stars;
            ctx.strokeStyle = UNIVERSE_CONFIG.palette.stars;
            stars.forEach(s => {
                let relativeZ = (s.z + s.zOffset - scrollPos);
                while (relativeZ < 0) relativeZ += WORLD_END;
                while (relativeZ > 2000) relativeZ -= 2000; 
                if (relativeZ < 10) return;
                let scale = FL / relativeZ;
                if (scale > 20) return;
                let x2d = cx + s.x * scale;
                let y2d = cy + s.y * scale;
                let size = (scale > 3) ? 3 : scale;

                if (scrollPos > 11000) {
                    let suck = (scrollPos - 11000) / 4500; 
                    let dx = x2d - cx;
                    let dy = y2d - cy;
                    let factor = Math.max(0, 1 - suck * 0.8);
                    let sx = cx + dx * factor;
                    let sy = cy + dy * factor;
                    ctx.globalAlpha = opacity;
                    ctx.lineWidth = size;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    let streakLen = suck * 0.3; 
                    ctx.lineTo(sx - dx*streakLen, sy - dy*streakLen);
                    ctx.stroke();
                } else {
                    ctx.globalAlpha = Math.min(1, relativeZ / 1500) * opacity;
                    ctx.fillRect(x2d, y2d, size, size);
                }
            });
        }

        function updateTitle(z) {
            let n = "VOID";
            const s = UNIVERSE_CONFIG.text.stages;
            for(let i=0; i<s.length; i++) {
                if (z > s[i].z) n = s[i].text;
            }
            setDecoderText(n);
        }

        initWorld();
        resize();
        window.addEventListener('resize', resize);
        requestAnimationFrame(draw);

    </script>
    <script src="nav.js"></script>
</body>
