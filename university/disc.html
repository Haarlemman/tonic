<!DOCTYPE html>
<html lang="en">
<head><script type="text/javascript" src="https://private-us-east-1.manuscdn.com/eO1aSVyNvwNsJyz7L0VZlYx1y6Dx7JJpsQsz4WhWu9xqNj2SfQ0wjG292q4YLqxw_0VS8t-poHuWi6aYRZw5wA=="></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth Disc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Jost&family=Crimson+Pro&family=Cal+Sans&display=swap" rel="stylesheet">


    <style>
        body {
            background-color: #53523a;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .container {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 30px;
            max-width: 100%;
            width: 100%;
            align-items: start;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .disc-container {
            position: relative;
            width: 66vw;
            height: 66vw;
            max-width: 500px;
            max-height: 500px;
            flex-shrink: 0;
            margin: 0;
        }

        .background-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .disc {
            width: 78%;
            height: 78%;
            transition: transform 0.8s ease-in-out;
            transform-origin: center center;
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            z-index: 2;
            filter: drop-shadow(0 0 10px rgba(255, 235, 185, 0.8));
        }

        .envelope-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 1;
            z-index: 3;
            pointer-events: none;
        }

        .word-display {
    position: absolute;
    top: 39%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ec3926;
    font-family: 'Economica', sans-serif;
    font-size: 24px;
    font-weight: 700;
    text-shadow: 0px 0px 0px rgba(236, 57, 38, 0.8);
    z-index: 10;
    text-align: center;
    width: 100%;
    pointer-events: none;
}

		
		.word-display span {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0;
  animation: fadeInOut 12.0s linear infinite;
  white-space: nowrap;
}


        .word-display span:nth-child(1) { animation-delay: 0s; }
        .word-display span:nth-child(2) { animation-delay: 0.8s; }
        .word-display span:nth-child(3) { animation-delay: 1.6s; }
        .word-display span:nth-child(4) { animation-delay: 2.4s; }
        .word-display span:nth-child(5) { animation-delay: 3.2s; }
        .word-display span:nth-child(6) { animation-delay: 4.0s; }
        .word-display span:nth-child(7) { animation-delay: 4.8s; }
        .word-display span:nth-child(8) { animation-delay: 5.6s; }
        .word-display span:nth-child(9) { animation-delay: 6.4s; }
        .word-display span:nth-child(10) { animation-delay: 7.2s; }
        .word-display span:nth-child(11) { animation-delay: 8.0s; }
        .word-display span:nth-child(12) { animation-delay: 8.8s; }
		.word-display span:nth-child(13) { animation-delay: 9.6s; }
		.word-display span:nth-child(14) { animation-delay: 10.4s; }
		.word-display span:nth-child(15) { animation-delay: 11.2s; }
		
		@keyframes fadeInOut {
  0% {
    opacity: 0;
    transform: translate(-50%, 50px) scale(0.1);
    color: #ec3926;
    filter: drop-shadow(0 0 0 rgba(0,0,0,0));
  }
  10% {
    opacity: 1;
    transform: translate(-50%, 0px) scale(0.7);
    color: #f81800;
    filter: drop-shadow(0 0 5px rgba(236, 57, 38, 0.6));
  }
  40% {
    opacity: 0.5;
    transform: translate(-50%, -150px) scale(3);
    color: #e0da58;
    filter: drop-shadow(0 0 5px rgba(224, 218, 38, 0.8));
  }
  90% {
    opacity: 0.7;
    transform: translate(-50%, -300px) scale(7);
    color: #006cff;
    filter: drop-shadow(0 0 8px rgba(0, 222, 255, 0.8));
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -500px) scale(12);
    color: #1844d0;
    filter: drop-shadow(0 0 0 rgba(0,0,0,0));
  }
}



		

        .hal9000-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            object-fit: contain;
            z-index: 6;
            pointer-events: none;
        }

        .controls {
            display: flex;
            flex-direction: row;
            gap: 15px;
            justify-content: center;
        }

        .text-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            min-height: 200px;
            margin-top: 20px;
        }

        .state-title {
		    font-family: 'Cal Sans', cursive;
            font-size: 6vw;
            font-weight: 700;
            color: #d4d3b4;
            opacity: 0.9;
            white-space: nowrap;
            letter-spacing: 2px;
        }

      .quote-container {
  font-family: 'Crimson Pro', cursive;
  font-size: 20px;
  color: #201f04;
  background-color: #d5d4b9;
  opacity: 0.95;
  line-height: 1.6;
  padding: 24px;
  border-radius: 10px;
  backdrop-filter: blur(2px);
  transition: opacity 0.5s ease;
  height: 7.2em; /* Fixed height for ~4 lines at 1.6 line-height */
  overflow-y: auto;
  width: 80%;
  margin: 0;
}



        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                grid-template-columns: 1fr;
                align-items: center;
            }

            .left-column {
                order: 1;
            }

            .disc-container {
                width: 75vw;
                height: 75vw;
                max-width: 380px;
                max-height: 380px;
            }

            .disc {
                width: 77%;
                height: 77%;
                position: absolute;
                top: 53%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(0deg);
                filter: drop-shadow(0 0 10px rgba(255, 242, 128, 0.8));
            }

           .hal9000-layer {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    object-fit: contain;
    z-index: 6;
    pointer-events: none;
}

            .word-display {
                font-size: 16px;
                top: 35%;
                width: 100%;
            }

          .text-content {
  align-items: center;
  text-align: center;
}

            .state-title {
                font-size: 20vw;
                margin-bottom: 10px;
            }

            .quote-container {
  text-align: center;
  margin: 10px auto 0 auto;
}
        }

        .btn {
            width: 80px;
            height: 40px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-body {
            background-color: #dc3545;
        }

        .btn-mind {
            background-color: #ffc107;
            color: #333;
            text-shadow: none;
        }

        .btn-soul {
            background-color: #007bff;
        }
		
		.btn-toggle {
		    background-color: white;
    		color:  #000;
			text-shadow: none;
}

        .state-indicator {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            opacity: 0.8;
            display: none;
        }

@media (min-width: 769px) {
  .text-content {
    align-items: flex-start;
  }

  .quote-container {
    width: 60%;
    text-align: left;
    margin: 0; /* Ensures it's left-aligned under the title */
  }
}


		
}

</head>
<body>
    <div class="container">
        <div class="left-column">
            <div class="disc-container">
                <div class="state-indicator" id="stateIndicator">AUTO</div>
                <img src="assets/images/bgpaper.png" 
                     alt="Background Paper" 
                     class="background-layer">
                <img src="assets/images/disc.png" 
                     alt="Zen Disc" 
                     class="disc" 
                     id="disc">
                <img src="assets/images/envelop.png" 
                     alt="Envelope Overlay" 
                     class="envelope-layer">
<div id="wordDisplay" class="word-display" style="display: none;">
<span>Dao</span>
<span>God</span>
<span>Zen</span>
<span>Love</span>
<span>Atman</span>
<span>Ananda</span> 
<span>Kenshō</span>
<span>Ikigai</span>
<span>Satori</span>
<span>Nirvana</span>
<span>Neshama</span>
<span>Samsara</span>
<span>Ein Sof</span>
<span>Shekhinah</span>
<span>Infinity</span>
                </div>
                <img src="assets/images/hal9000.png" 
                     alt="HAL 9000 Overlay" 
                     class="hal9000-layer">
            </div>
            <div class="controls">
                <button class="btn btn-body" onclick="setState('body')">BODY</button>
                <button class="btn btn-mind" onclick="setState('mind')">MIND</button>
                <button class="btn btn-soul" onclick="setState('soul')">SOUL</button>
				<button class="btn btn-toggle" onclick="toggleWords()">TRUTH</button>
            </div>
        </div>
        <div class="text-content">
            <div class="state-title" id="stateTitle">Body</div>
            <div class="quote-container" id="quoteContainer"></div>
        </div>
    </div>

	<script>
  var currentRotation = 0;
  var autoRotateInterval;
  var isAutoMode = true;
  var disc = document.getElementById('disc');
  var stateIndicator = document.getElementById('stateIndicator');
  var stateTitle = document.getElementById('stateTitle');
  var quoteContainer = document.getElementById('quoteContainer');

  var wisdomQuotes = [
    "The only way to do great work is to love what you do. - Steve Jobs",
    "Be yourself; everyone else is already taken. - Oscar Wilde",
    "In the end, we will remember not the words of our enemies, but the silence of our friends. - Martin Luther King Jr.",
    "The journey of a thousand miles begins with one step. - Lao Tzu",
    "Life is what happens to you while you're busy making other plans. - John Lennon",
    "The only impossible journey is the one you never begin. - Tony Robbins",
    "Yesterday is history, tomorrow is a mystery, today is a gift. - Eleanor Roosevelt",
    "It is during our darkest moments that we must focus to see the light. - Aristotle"
  ];

  var scienceFacts = [
    "Your brain uses about 20% of your body's total energy, despite being only 2% of your body weight.",
    "A single teaspoon of honey represents the life work of 12 bees.",
    "Octopuses have three hearts and blue blood, and two hearts stop beating when they swim.",
    "The human eye can distinguish approximately 10 million different colors.",
    "A day on Venus is longer than its year - it takes 243 Earth days to rotate once.",
    "Bananas are berries, but strawberries aren't. Botanically speaking, berries must have seeds inside their flesh.",
    "The speed of light is so fast that it could circle the Earth 7.5 times in just one second.",
    "Your stomach gets an entirely new lining every 3-4 days because stomach acid would otherwise digest it."
  ];

  var bodyPoems = [
    "Breathe in strength,\nExhale the doubt,\nYour body knows\nWhat life's about.",
    "Every step you take today\nBuilds the path to who you'll be,\nMovement is your body's way\nOf setting your spirit free.",
    "Listen to your heartbeat's song,\nIt's been with you all along,\nA rhythm that will guide you through\nEverything you're meant to do.",
    "Your hands can heal,\nYour feet can dance,\nYour body holds\nLife's every chance.",
    "In rest you find your power,\nIn movement, find your grace,\nYour body is the temple\nWhere soul and mind embrace.",
    "Strong like the mountains,\nFluid like the sea,\nYour body holds the wisdom\nOf who you're meant to be."
  ];

  var states = {
    soul: 0,
    mind: 120,
    body: 240
  };

  function getRandomQuote(state) {
    let quotes;
    switch (state) {
      case 'soul': quotes = wisdomQuotes; break;
      case 'mind': quotes = scienceFacts; break;
      case 'body': quotes = bodyPoems; break;
      default: return '';
    }
    return quotes[Math.floor(Math.random() * quotes.length)];
  }

  function updateQuoteDisplay(state) {
    const quote = getRandomQuote(state);
    if (quote) {
      quoteContainer.innerText = quote;
      quoteContainer.style.opacity = '0.95';
    } else {
      quoteContainer.style.opacity = '0';
    }
  }

  function rotateDisc(targetRotation) {
    disc.style.transform = 'translate(-50%, -50%) rotate(' + targetRotation + 'deg)';
    currentRotation = targetRotation;
  }

  function updateStateTitle() {
    let currentState = 'body';
    for (let key in states) {
      if (states[key] === currentRotation) {
        currentState = key;
        break;
      }
    }
    const capitalizedState = currentState.charAt(0).toUpperCase() + currentState.slice(1);
    stateTitle.textContent = capitalizedState;

    const stateColors = {
      body: '#dd172a',
      mind: '#dbdd17',
      soul: '#00bce4'
    };
    stateTitle.style.color = stateColors[currentState];

    updateQuoteDisplay(currentState);
  }

  function setState(state) {
    clearInterval(autoRotateInterval);
    isAutoMode = false;

    stateIndicator.textContent = state.toUpperCase();

    const capitalizedState = state.charAt(0).toUpperCase() + state.slice(1);
    stateTitle.textContent = capitalizedState;

    const stateColors = {
      body: '#dd172a',
      mind: '#dbdd17',
      soul: '#00bce4'
    };
    stateTitle.style.color = stateColors[state];

    updateQuoteDisplay(state);
    rotateDisc(states[state]);

    setTimeout(() => {
      if (!isAutoMode) startAutoRotation();
    }, 5000);
  }

  function startAutoRotation() {
    isAutoMode = true;
    stateIndicator.textContent = 'AUTO';
    autoRotateInterval = setInterval(() => {
      currentRotation += 120;
      if (currentRotation >= 360) currentRotation = 0;
      rotateDisc(currentRotation);
      updateStateTitle();
    }, 3500);
  }

  function toggleWords() {
    const display = document.getElementById('wordDisplay');
    display.style.display = (display.style.display === 'none') ? 'block' : 'none';
  }

  // Initialize
  startAutoRotation();
  updateStateTitle();
  updateQuoteDisplay('body');
</script>

	
</body>
