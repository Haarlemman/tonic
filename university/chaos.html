<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complexity & Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19; /* Very dark slate */
            color: #e2e8f0;
            user-select: none;
        }
        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #overlay {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            pointer-events: none;
            font-family: 'Courier New', Courier, monospace;
            transition: opacity 1s;
        }
        #start-msg {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 8px;
            cursor: pointer;
            pointer-events: auto; /* Allow clicking the text specifically */
            padding: 5px;
            border: 1px solid transparent;
        }
        #start-msg:hover {
            color: #94a3b8;
            border-color: #334155;
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="overlay">
        <h1 class="text-2xl font-bold tracking-widest uppercase text-slate-200 opacity-90">Complexity</h1>
        <h2 class="text-sm font-light tracking-widest uppercase text-slate-400 opacity-70 mt-1">& Control</h2>
        <p id="start-msg" class="pulse">CLICK SCREEN TO ENABLE SOUND</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const msgElement = document.getElementById('start-msg');

        let width, height;
        let particles = [];
        const particleCount = 250;
        const connectionDistance = 100;
        
        // Audio State
        let audioCtx;
        let masterGain;
        let filter;
        let osc1, osc2, subOsc;
        let isAudioInitialized = false;
        
        // Mouse state
        let mouse = { x: null, y: null, active: false };

        // Resize
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Initialization
        function initAudio() {
            if (isAudioInitialized) return;
            
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                
                // Master Gain (Volume Control)
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.15; // Increased starting volume
                masterGain.connect(audioCtx.destination);

                // Filter (Lowpass)
                filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 300; 
                filter.connect(masterGain);

                // Oscillator 1: Main Drone (A3 - 220Hz) - Raised Octave for visibility on small speakers
                osc1 = audioCtx.createOscillator();
                osc1.type = 'triangle'; // Triangle cuts through better than sine
                osc1.frequency.value = 220; 
                osc1.connect(filter);
                osc1.start();

                // Oscillator 2: Harmony (E4 - 329.63Hz)
                osc2 = audioCtx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.value = 329.63; 
                osc2.connect(filter);
                osc2.start();

                // Sub Oscillator: Texture (A2 - 110Hz)
                subOsc = audioCtx.createOscillator();
                subOsc.type = 'sawtooth'; // Sawtooth adds buzz/grit
                subOsc.frequency.value = 110; 
                
                // Sub osc has its own gain so it doesn't overpower
                const subGain = audioCtx.createGain();
                subGain.gain.value = 0.08; 
                subOsc.connect(subGain);
                subGain.connect(filter);
                subOsc.start();

                isAudioInitialized = true;
                msgElement.innerText = "[ AUDIO ACTIVE ] Move mouse to interact";
                msgElement.classList.remove('pulse');
                msgElement.style.color = '#10b981'; // Greenish tint
            } catch (e) {
                console.error("Audio init failed", e);
                msgElement.innerText = "Audio Error (Browser Restricted)";
            }
        }

        // Interaction Listeners
        function handleStart() {
            if (!isAudioInitialized) {
                initAudio();
            } else if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        window.addEventListener('mousedown', () => {
            handleStart();
            mouse.active = true;
            updateAudio(true);
        });

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
            if(isAudioInitialized) updateAudio(true);
        });

        window.addEventListener('mouseup', () => {
            mouse.active = false;
            updateAudio(false);
        });
        
        // Touch support
        window.addEventListener('touchstart', e => {
            handleStart();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.active = true;
            updateAudio(true);
        });
        
        window.addEventListener('touchmove', e => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        
        window.addEventListener('touchend', () => {
            mouse.active = false;
            updateAudio(false);
        });

        // Function to smoothly change audio based on state
        function updateAudio(isActive) {
            if (!isAudioInitialized || !audioCtx) return;

            const now = audioCtx.currentTime;
            
            if (isActive) {
                // Open filter -> sound gets brighter
                filter.frequency.setTargetAtTime(1200, now, 0.2); 
                // Increase volume -> sound gets louder
                masterGain.gain.setTargetAtTime(0.3, now, 0.2);
            } else {
                // Close filter -> sound gets muffled
                filter.frequency.setTargetAtTime(300, now, 1.5);
                // Lower volume
                masterGain.gain.setTargetAtTime(0.15, now, 1.5);
            }
        }


        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.size = Math.random() * 2 + 1;
                // Gold/Amber to Blue/Teal gradient possibilities
                this.baseColor = Math.random() > 0.5 ? '200, 150, 50' : '50, 150, 200'; 
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                this.angle += 0.02;
                this.vx += Math.sin(this.angle) * 0.05;
                this.vy += Math.cos(this.angle) * 0.05;

                if (mouse.active && mouse.x) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    
                    const maxDistance = 300;
                    if (distance < maxDistance) {
                        const force = (maxDistance - distance) / maxDistance;
                        this.vx += forceDirectionX * force * 0.8;
                        this.vy += forceDirectionY * force * 0.8;
                    }
                }

                this.vx *= 0.96;
                this.vy *= 0.96;
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = `rgba(${this.baseColor}, 0.8)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(11, 15, 25, 0.15)'; 
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        const opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = `rgba(200, 200, 220, ${opacity * 0.2})`; 
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();

    </script>
    <script src="nav.js"></script>
</body>
</html>
