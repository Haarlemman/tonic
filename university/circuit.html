<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI // THE CIRCUIT</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Share Tech Mono', monospace; }
    canvas { display: block; }
    .scanlines {
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
      position: absolute; inset: 0; pointer-events: none; z-index: 20;
    }
    .glitch { animation: glitch-anim 0.3s infinite; }
    @keyframes glitch-anim {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PALETTE = {
      grid: "#00A8FF", // Tron Blue
      data: "#39FF14", // Terminal Green
      error: "#FF0033", // Glitch Red
      core: "#FFD700"  // Gold/Synthesis
    };

    // --- ROBUST AUDIO ENGINE ---
    class Synth {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
      }
      init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.isPlaying = true;
      }
      playTone(freq, type, duration, vol=0.1, time=0) {
        if (!this.ctx) return;
        const t = time || this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + duration);
      }
    }
    const audio = new Synth();

    // helpers
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeInQuad = t => t*t;

    const App = () => {
      const canvasRef = useRef(null);
      const requestRef = useRef(null);

      const [scene, setScene] = useState({
        title: "INITIALIZING...",
        sub: "WAITING FOR INPUT",
        color: PALETTE.grid
      });
      const [started, setStarted] = useState(false);

      useEffect(() => {
        if (!started) return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resize);
        resize();

        // Total duration & chapter setup
        const DURATION = 30000;          // 30 seconds total
        const CHAPTERS = 4;              // 4 parts/chapters
        const CHAPTER_DURATION = DURATION / CHAPTERS; // 7.5s per chapter

        // Speed envelope per chapter (visuals + audio):
        // starts slow -> accelerates to fast during the chapter
        const SPEED_MIN = 0.5;
        const SPEED_MAX = 3.0;

        // Base grid speeds per mode (multiplied by chapter factor)
        const BASE_GRID_SPEED = [1, 4, 20, 2];

        // Audio beat interval envelope (ms): slow = longer interval, fast = shorter
        const BEAT_SLOW_MS = 400; // ~150 BPM 16th feel
        const BEAT_FAST_MS = 100; // ~600ms/beat -> snappy 16ths

        const startMs = performance.now();
        let lastBeatMs = 0; // animation-time-based scheduling

        let gridOffset = 0;

        const animate = (nowMs) => {
          const elapsed = nowMs - startMs;
          const progress = clamp(elapsed / DURATION, 0, 1);

          // determine chapter + chapter progress
          const chapterIndex = Math.min(CHAPTERS - 1, Math.floor(progress * CHAPTERS));
          const chapterStart = chapterIndex * CHAPTER_DURATION;
          const chapterT = clamp((elapsed - chapterStart) / CHAPTER_DURATION, 0, 1);

          // acceleration curve inside chapter
          const accel = easeInQuad(chapterT);                       // 0 -> 1 accelerating
          const chapterSpeedFactor = lerp(SPEED_MIN, SPEED_MAX, accel);

          // mode per chapter (0..3)
          const mode = chapterIndex; // 0: Framework, 1: Input, 2: Paradox, 3: Synthesis

          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;

          // Sync UI text once per mode change (cheap check)
          if (mode === 0 && scene.title !== "THE FRAMEWORK")
            setScene({ title: "THE FRAMEWORK", sub: "LOGIC IS ABSOLUTE", color: PALETTE.grid });
          if (mode === 1 && scene.title !== "THE INPUT")
            setScene({ title: "THE INPUT", sub: "WE FEED THE MACHINE", color: PALETTE.data });
          if (mode === 2 && scene.title !== "THE PARADOX")
            setScene({ title: "THE PARADOX", sub: "SYSTEM UNSTABLE", color: PALETTE.error });
          if (mode === 3 && scene.title !== "SYNTHESIS")
            setScene({ title: "SYNTHESIS", sub: "TONIC FOR THE BONES", color: PALETTE.core });

          // ---- AUDIO (tempo follows chapterSpeedFactor)
          const intervalMs = lerp(BEAT_SLOW_MS, BEAT_FAST_MS, accel);
          if (elapsed - lastBeatMs >= intervalMs) {
            lastBeatMs = elapsed;

            // Kick
            if (mode === 0) audio.playTone(100, 'square', 0.08, 0.2);
            // Bass
            if (mode >= 1) audio.playTone(55, 'sawtooth', 0.16, 0.1);
            // Hi-hat
            if (mode >= 2) audio.playTone(900 + Math.random()*600, 'square', 0.04, 0.05);
            // Chord cluster
            if (mode === 3) {
              audio.playTone(220, 'sine', 0.4, 0.05);
              audio.playTone(277, 'sine', 0.4, 0.05);
              audio.playTone(329, 'sine', 0.4, 0.05);
            }
          }

          // ---- DRAW
          const color = [PALETTE.grid, PALETTE.data, PALETTE.error, PALETTE.core][mode];

          // 1) fade/clear
          ctx.fillStyle = `rgba(0,0,0, ${mode === 2 ? 0.12 : 0.2})`;
          ctx.fillRect(0, 0, w, h);

          // 2) grid
          ctx.save();
          ctx.translate(cx, cy);
          if (mode === 2) {
            ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
          }
          ctx.beginPath();
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;

          const horizon = -50;

          // verticals
          for (let i = -10; i <= 10; i++) {
            if (mode === 3) {
              ctx.beginPath();
              ctx.moveTo(i * 100, h);
              ctx.quadraticCurveTo(i * 50, 100, 0, horizon);
              ctx.stroke();
            } else {
              ctx.moveTo(0, horizon);
              ctx.lineTo(i * (w/2 + 200), h/2);
            }
          }

          // horizontal moving lines
          const base = BASE_GRID_SPEED[mode];
          const gridSpeed = base * chapterSpeedFactor;
          const loopSeconds = elapsed * 0.001;
          gridOffset = (loopSeconds * 100 * gridSpeed) % 100;

          for (let i = 0; i < 10; i++) {
            let y0 = horizon + Math.pow(i/10, 2) * (h/2);
            let y1 = horizon + Math.pow((i+1)/10, 2) * (h/2);
            let y = y0 + (gridOffset / 100) * (y1 - y0);
            ctx.moveTo(-w, y);
            ctx.lineTo(w, y);
          }
          ctx.stroke();

          // 3) centerpiece
          ctx.shadowBlur = 20;
          ctx.shadowColor = color;
          ctx.fillStyle = "#000";
          ctx.lineWidth = 2;

          if (mode === 0) {
            // cube
            const size = 60;
            ctx.strokeRect(-size, -size - 50, size*2, size*2);
            ctx.strokeRect(-size*0.5, -size*0.5 - 50, size, size);
            ctx.beginPath();
            ctx.moveTo(-size, -size - 50); ctx.lineTo(-size*0.5, -size*0.5 - 50);
            ctx.moveTo(size, -size - 50);  ctx.lineTo(size*0.5, -size*0.5 - 50);
            ctx.moveTo(size, size - 50);   ctx.lineTo(size*0.5, size*0.5 - 50);
            ctx.moveTo(-size, size - 50);  ctx.lineTo(-size*0.5, size*0.5 - 50);
            ctx.stroke();
          } else if (mode === 1) {
            // sphere
            ctx.beginPath(); ctx.arc(0, -50, 80, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(0, -50, 80, 30, loopSeconds, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(0, -50, 30, 80, loopSeconds, 0, Math.PI*2); ctx.stroke();
          } else if (mode === 2) {
            // glitch bars
            for (let k=0; k<5; k++) {
              const rx = (Math.random()-0.5) * 200;
              const ry = -50 + (Math.random()-0.5) * 200;
              const rw = Math.random() * 100;
              const rh = Math.random() * 20;
              ctx.strokeRect(rx, ry, rw, rh);
            }
            ctx.font = "20px 'Share Tech Mono'";
            ctx.fillStyle = color;
            ctx.fillText("ERROR: FREE_WILL", -80, -50);
          } else if (mode === 3) {
            // sun + rays
            const r = 80 + Math.sin(loopSeconds * 5) * 5;
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(0, -50, r, 0, Math.PI*2); ctx.fill();
            ctx.beginPath();
            for (let k=0; k<12; k++) {
              const ang = (k/12) * Math.PI*2 + loopSeconds;
              ctx.moveTo(Math.cos(ang)*r, Math.sin(ang)*r - 50);
              ctx.lineTo(Math.cos(ang)*(r+30), Math.sin(ang)*(r+30) - 50);
            }
            ctx.stroke();
          }
          ctx.shadowBlur = 0;
          ctx.restore();

          // 4) progress bar
          ctx.fillStyle = color;
          ctx.fillRect(0, h-4, w * progress, 4);

          if (progress < 1.0) {
            requestRef.current = requestAnimationFrame(animate);
          } else {
            setScene({ title: "SEQUENCE COMPLETE", sub: "MAN MACHINE INTERFACE ACTIVE", color: PALETTE.core });
          }
        };

        requestRef.current = requestAnimationFrame(animate);

        return () => {
          cancelAnimationFrame(requestRef.current);
          window.removeEventListener('resize', resize);
        };
      }, [started]);

      const start = () => {
        setStarted(true);
        audio.init();
      };

      return (
        <div className="w-full h-full relative cursor-pointer" onClick={!started ? start : null}>
          <div className="scanlines"></div>
          <canvas ref={canvasRef} />

          {/* UI */}
          <div className="absolute top-0 left-0 w-full p-8 flex justify-between items-start pointer-events-none mix-blend-screen">
            <div>
              <h1
                className={`text-4xl md:text-6xl font-bold tracking-tighter transition-colors duration-500 ${scene.title === 'THE PARADOX' ? 'glitch' : ''}`}
                style={{ color: scene.color, textShadow: `0 0 20px ${scene.color}` }}
              >
                {scene.title}
              </h1>
              <p className="text-white/80 text-sm md:text-xl tracking-[0.2em] mt-2 font-bold">
                {scene.sub}
              </p>
            </div>
            <div className="text-right hidden md:block">
              <div className="text-xs text-white/50 mb-1">SYS.TIME</div>
              <div className="text-xl text-white font-bold tabular-nums">
                {started ? "RUNNING" : "STANDBY"}
              </div>
            </div>
          </div>

          {!started && (
            <div className="absolute inset-0 flex items-center justify-center z-50 bg-black/80">
              <div className="border border-[#39FF14] p-8 text-center shadow-[0_0_30px_rgba(57,255,20,0.3)] hover:bg-[#39FF14]/10 transition-colors">
                <h2 className="text-[#39FF14] text-2xl tracking-widest mb-2 font-bold">MAN MACHINE</h2>
                <p className="text-white text-xs font-mono animate-pulse">CLICK TO INITIATE SEQUENCE</p>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
    <script src="nav.js"></script>
</body>
</html>
