        const Phone = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>);
        const Video = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>);
        const MoreVertical = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>);
        const Check = ({ size = 16, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>);

        // ==========================================
        //  👇 SCRIPT 👇
        // ==========================================
        const script = [
            { sender: 'You', text: "hey god", time: "06:53 AM", delay: 10 },
			{ sender: 'You', text: "thanks for adding me", time: "06:53 AM", delay: 1000 },
            { sender: 'You', text: "you there?", time: "06:53 AM", delay: 10 },
            { sender: 'God', text: "Everywhere", time: "06:53 AM", delay: 10 },
			{ sender: 'God', text: "What’s up?", time: "06:53 AM", delay: 100 },
            { sender: 'You', text: "just wondering if you exist", time: "06:54 AM", delay: 100 },
            { sender: 'God', text: "Always", time: "06:54 AM", delay: 1000 },
            { sender: 'You', text: "so…why give me parkinson’s?", time: "06:55 AM", delay: 400 },
            { sender: 'God', text: "Through suffering you’ll find Enlightenment", time: "06:56 AM", delay: 1000 },
            { sender: 'You', text: "really..?", time: "06:56 AM", delay: 200 },
			{ sender: 'You', text: "I mean, really??", time: "06:56 AM", delay: 10 },
            { sender: 'God', text: "I thought you’d like that", time: "06:56 AM", delay: 1000 },
            { sender: 'You', text: "*sigh*", time: "06:57 AM", delay: 10 },
            { sender: 'God', text: "The breath is a sign of the Divine", time: "06:57 AM", delay: 1000 },
            { sender: 'You', text: "do you have to be so cryptic..?", time: "06:58 AM", delay: 500 },
            { sender: 'God', text: "  42        ", time: "06:58 AM", delay: 100 },
            { sender: 'God', text: "  😄        ", time: "06:58 AM", delay: 1000 },
            { sender: 'You', text: "Man…", time: "06:59 AM", delay: 1000 },
            { sender: 'God', text: "Or woman… You don’t know", time: "06:59 AM", delay: 1000 },
            { sender: 'God', text: "What’s on your mind, really?", time: "06:59 AM", delay: 2000 },
            { sender: 'You', text: "Sometimes I feel like\nI’m losing myself", time: "06:59 AM", delay: 3000 },
            { sender: 'God', text: "Go lose yourself.\nThat’s where I am hiding.", time: "06:59 AM", delay: 1000 },
            { sender: 'You', text: "I thought I’d seen you before!\nwhen I hit rock bottom in my 20s\nand went down on my knees", time: "07:00 AM", delay: 3000 },
            { sender: 'God', text: "Yep, that was me,\njust giving you a nudge.\nA divine Poke.", time: "07:00 AM", delay: 1000 },
            { sender: 'God', text: "Hope it helped.", time: "07:00 AM", delay: 1000 },
            { sender: 'You', text: "it did for a while", time: "07:01 AM", delay: 500 },
			{ sender: 'You', text: "but then...", time: "07:01 AM", delay: 200 },
			{ sender: 'You', text: "why the depression", time: "07:01 AM", delay: 150 },
			{ sender: 'You', text: "the anxiety", time: "07:01 AM", delay: 100 },
			{ sender: 'You', text: "suffering", time: "07:02 AM", delay: 30 },
			{ sender: 'You', text: "wars", time: "07:02 AM", delay: 100 },
            { sender: 'God', text: "That’s The Thief.\nHe leaves gold dust when\nyou’re not looking.", time: "07:02 AM", delay: 4000 },
            { sender: 'You', text: "I don’t see it", time: "07:03 AM", delay: 100 },
            { sender: 'You', text: "I don’t get it", time: "07:03 AM", delay: 200 },
            { sender: 'God', text: "Keep on writing and you will.", time: "07:03 AM", delay: 1000 },
            { sender: 'You', text: "so my book is…", time: "07:04 AM", delay: 1000 },
			{ sender: 'You', text: "a prayer?", time: "07:04 AM", delay: 100 },
            { sender: 'God', text: "Sure.", time: "07:04 AM", delay: 100 },
			{ sender: 'God', text: "Every page is a WhatsApp to Me.", time: "07:04 AM", delay: 1500 },
            { sender: 'You', text: "Will you answer?", time: "07:05 AM", delay: 200 },
            { sender: 'God', text: "Already did.", time: "07:05AM", delay: 500 },
            { sender: 'God', text: "Check your manuscript.", time: "07:05AM", delay: 200 },
            { sender: 'God', text: "❤️", time: "∞", delay: 500 }
        ];

        // --- Components ---

        const MessageBubble = ({ msg }) => {
            const [status, setStatus] = useState(0);

            useEffect(() => {
                if (msg.sender !== 'You') return;
                const t1 = setTimeout(() => setStatus(1), 1000 + Math.random() * 1000); 
                return () => { clearTimeout(t1); };
            }, [msg.sender]);

            const renderTicks = () => {
                if (msg.sender !== 'You') return null;
                if (status === 0) return <Check className="text-gray-400" size={14} />;
                return <Check className="text-[#53bdeb]" size={14} />;
            };

            return (
                <div 
                    className={`flex w-full ${msg.sender === 'You' ? 'justify-end' : 'justify-start'} animate-slide-up`}
                >
                    <div 
                        className={`min-w-[80px] max-w-[85%] rounded-lg px-3 py-1.5 relative shadow-sm text-sm
                            ${msg.sender === 'You' 
                                ? 'bg-[#005c4b] text-white rounded-tr-none' 
                                : 'bg-[#202c33] text-gray-100 rounded-tl-none'
                            }`}
                    >
                        <p className="whitespace-pre-line leading-relaxed pb-3 pr-2">{msg.text}</p>
                        <div className="absolute bottom-1 right-2 flex items-center gap-1">
                            <span className="text-[10px] text-gray-400 leading-none">
                                {msg.time}
                            </span>
                            {renderTicks()}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [messages, setMessages] = useState([]);
            const [isTyping, setIsTyping] = useState(false);
            const [typingSender, setTypingSender] = useState(null);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [hasStarted, setHasStarted] = useState(false);
            const [isFinished, setIsFinished] = useState(false);
            const [isRollingBack, setIsRollingBack] = useState(false);
            const [showOutro, setShowOutro] = useState(false);
            
            // Input State
            const [inputValue, setInputValue] = useState("");
            const [showInputSuccess, setShowInputSuccess] = useState(false);

            const scrollRef = useRef(null);
            const wakeLockRef = useRef(null);
            const audioCtxRef = useRef(null); 

            useEffect(() => {
                const requestWakeLock = async () => {
                    try {
                        if ('wakeLock' in navigator && hasStarted && !isFinished) {
                            wakeLockRef.current = await navigator.wakeLock.request('screen');
                        }
                    } catch (err) {
                        console.log("Wake Lock error", err);
                    }
                };
                if (hasStarted && !isFinished) { requestWakeLock(); }
            }, [hasStarted, isFinished]);

            const initAudio = () => {
                if (!audioCtxRef.current) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        const ctx = new AudioContext();
                        audioCtxRef.current = ctx;
                        if (ctx.state === 'suspended') {
                            ctx.resume();
                        }
                    }
                }
            };

            const startChat = () => {
                initAudio();
                setMessages([]);
                setCurrentIndex(0);
                setIsFinished(false);
                setHasStarted(true);
                setIsRollingBack(false);
                setShowOutro(false);
                setShowInputSuccess(false);
                setInputValue("");
            };
            
            const exitChat = () => {
                setHasStarted(false);
                setIsFinished(false);
                setMessages([]);
                setCurrentIndex(0);
                setIsRollingBack(false);
                setShowOutro(false);
            };

            const triggerSound = (type) => {
                const ctx = audioCtxRef.current;
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume();

                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();

                osc.connect(gainNode);
                gainNode.connect(ctx.destination);

                if (type === 'received') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'sent') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1); 
                    gainNode.gain.setValueAtTime(0.1, ctx.currentTime); 
                    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1); 
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                }
            };

            useEffect(() => {
                if (!hasStarted) return;
                
                let timeouts = [];

                const runScript = async () => {
                    if (currentIndex >= script.length) {
                        const endDelay = setTimeout(() => {
                           setIsRollingBack(true);
                           setTimeout(() => {
                               setShowOutro(true);
                               setIsFinished(true); 
                           }, 1000); 
                        }, 2000); 
                        timeouts.push(endDelay);
                        return;
                    }

                    const currentItem = script[currentIndex];
                    const typingDuration = Math.min(2000, Math.max(800, currentItem.text.length * 40));
                    const preTypingDelay = 500; 

                    const t1 = setTimeout(() => {
                        setTypingSender(currentItem.sender);
                        setIsTyping(true);
                        scrollToBottom();
                    }, preTypingDelay);

                    const t2 = setTimeout(() => {
                        setIsTyping(false);
                        setMessages(prev => [...prev, currentItem]);
                        if (currentItem.sender === 'God') {
                            triggerSound('received');
                        } else {
                            triggerSound('sent');
                        }
                        scrollToBottom();
                    }, preTypingDelay + typingDuration);

                    const t3 = setTimeout(() => {
                        setCurrentIndex(prev => prev + 1);
                    }, preTypingDelay + typingDuration + currentItem.delay);

                    timeouts.push(t1, t2, t3);
                };

                runScript();

                return () => timeouts.forEach(t => clearTimeout(t));
            }, [currentIndex, hasStarted]);

            const scrollToBottom = () => {
                setTimeout(() => {
                    if (scrollRef.current) {
                        scrollRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
                    }
                }, 100); 
            };

            const handleInputSubmit = async (e) => {
                e.preventDefault();
                if (!inputValue.trim()) return;

                const text = inputValue.trim();
                setInputValue("");
                triggerSound('sent'); 
                setShowInputSuccess(true);
                setTimeout(() => setShowInputSuccess(false), 4000);

                const FB = window.FirebaseModules;
                if (FB && typeof __firebase_config !== 'undefined') {
                    try {
                        const firebaseConfig = JSON.parse(__firebase_config);
                        const app = FB.initializeApp(firebaseConfig); 
                        const auth = FB.getAuth(app);
                        const db = FB.getFirestore(app);
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

                        if (!auth.currentUser) await FB.signInAnonymously(auth);
                        
                        await FB.addDoc(FB.collection(db, 'artifacts', appId, 'public', 'data', 'book_interest'), {
                            text: text,
                            type: text.includes('@') ? 'email' : 'message',
                            timestamp: FB.serverTimestamp()
                        });
                        console.log("Saved to Firestore");
                    } catch (err) {
                        console.error("Error saving to Firestore", err);
                    }
                } else {
                    console.log("Offline mode: Message simulated");
                }
            };

            const containerClasses = "fixed inset-0 w-full h-[100dvh] z-50 flex flex-col wa-bg transition-all duration-500 md:relative md:w-auto md:h-[90vh] md:aspect-[9/19] md:rounded-[40px] md:border-[12px] md:border-slate-800 md:shadow-[0_0_60px_rgba(0,0,0,0.9)] md:phone-gloss";

            // UPDATED HEADER LOGIC:
            // Mobile: VISIBLE (flex) when !hasStarted (Start Screen). HIDDEN (hidden md:flex) when hasStarted (Chat).
            // Desktop: ALWAYS VISIBLE.
            const headerClasses = hasStarted
                ? "hidden md:flex w-full h-8 bg-[#202c33] z-20 justify-between items-center px-6 pt-2 text-[10px] font-bold text-gray-400 md:absolute md:top-0 transition-opacity duration-1000 " + (isRollingBack ? "opacity-0" : "opacity-100")
                : "flex w-full h-8 bg-[#202c33] z-20 justify-between items-center px-6 pt-2 text-[10px] font-bold text-gray-400 md:absolute md:top-0";

            return (
                <div className="flex items-center justify-center min-h-screen text-slate-100 md:p-4">
                
                {/* Dynamic Phone Container */}
                <div className={containerClasses}>
                    
                    {/* Status Bar (Notch/Wifi/Battery) */}
                    {/* Now shows on Mobile initially! */}
                    <div className={headerClasses}>
                        <span>07:06</span>
                        <div className="flex gap-1 items-center">
                            <Signal size={12} />
                            <Wifi size={12} />
                            <Battery size={12} />
                        </div>
                    </div>

                    {/* Chat Header (God + Avatar) */}
                    <div className={`${hasStarted ? 'mt-0 md:mt-8' : 'mt-0 md:mt-8'} bg-[#202c33] p-3 flex items-center justify-between z-10 shadow-sm transition-transform duration-1000 ${isRollingBack ? '-translate-y-32' : 'translate-y-0'}`}>
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-200 via-yellow-400 to-amber-600 flex items-center justify-center text-slate-900 font-bold border border-gray-600">
                                G
                            </div>
                            <div>
                                <h1 className="font-semibold text-gray-100 tracking-wide text-base">God</h1>
                                <p className="text-xs text-amber-400 font-normal">
                                    {isTyping && typingSender === 'God' ? 'typing...' : 'superbusy'}
                                </p>
                            </div>
                        </div>
                        
                        <div className="flex gap-4 text-[#aebac1] mr-2">
                             {!hasStarted ? null : (
                                <button onClick={exitChat} className="hover:text-white"><X size={20}/></button>
                             )}
                             {!hasStarted && <Video size={20} />}
                             {!hasStarted && <Phone size={20} />}
                             {!hasStarted && <MoreVertical size={20} />}
                        </div>
                    </div>

                    {/* Chat Area */}
                    <div className={`flex-1 overflow-y-auto p-4 space-y-2 pb-24 scrollbar-hide transition-all duration-1000 ease-in ${isRollingBack ? 'animate-roll-up' : ''}`}>
                        
                        {/* Start Screen */}
                        {!hasStarted && (
                            <div className="h-full flex flex-col items-center justify-center text-center space-y-6 animate-fade-in">
                                <div className="w-24 h-24 rounded-full bg-[#005c4b] flex items-center justify-center mb-4 shadow-xl">
                                    <Send className="text-white ml-1" size={40} />
                                </div>
                                <div>
                                    <h2 className="text-2xl font-light text-white mb-2">A Chat with God</h2>
                                    <p className="text-gray-400 text-sm">25 November 2025</p>
                                </div>
                                <button 
                                    onClick={startChat}
                                    className="flex items-center gap-2 px-8 py-3 bg-[#00a884] text-black rounded-full font-bold hover:bg-[#00c298] transition-all active:scale-95 shadow-lg"
                                >
                                    <Play size={20} fill="black" /> START
                                </button>
                            </div>
                        )}

                        {/* Messages */}
                        {messages.map((msg, index) => (
                            <MessageBubble key={index} msg={msg} />
                        ))}

                        {/* Typing Indicator */}
                        {isTyping && (
                            <div className={`flex w-full ${typingSender === 'You' ? 'justify-end' : 'justify-start'} animate-fade-in`}>
                                <div className={`${typingSender === 'You' ? 'bg-[#005c4b] rounded-tr-none' : 'bg-[#202c33] rounded-tl-none'} rounded-lg px-4 py-3 flex items-center gap-1 w-16 h-9`}>
                                    <div className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                                    <div className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                                    <div className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></div>
                                </div>
                            </div>
                        )}
                        
                        <div ref={scrollRef} />
                    </div>
                    
                    {/* Outro Overlay */}
                    {showOutro && (
                        <div className="absolute inset-0 z-40 flex flex-col items-center justify-center text-center p-8 bg-[#0b141a] animate-fade-in">
                            <div className="space-y-6 max-w-sm">
                                <p className="text-gray-400 text-sm font-light tracking-widest uppercase mb-2">My Book</p>
                                <h1 className="text-3xl md:text-4xl text-white glitch-text leading-tight">
                                    Tonic for the Bones
                                </h1>
                                <p className="text-lg md:text-xl text-gray-300 font-light italic font-serif">
                                    The Art & Soul of Adversity
                                </p>
                                <div className="w-12 h-0.5 bg-[#00a884] mx-auto my-6"></div>
                                <p className="text-white font-bold tracking-widest text-lg">
                                    COMING 2026
                                </p>
                                <button 
                                    onClick={startChat}
                                    className="mt-12 flex items-center gap-2 px-6 py-2 border border-gray-700 rounded-full text-gray-400 text-xs hover:text-white hover:border-white transition-colors mx-auto"
                                >
                                    <RefreshCw size={12} /> Replay
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Input Area */}
                    <div className={`p-2 bg-[#202c33] flex items-center gap-2 transition-transform duration-1000 ${isRollingBack ? 'translate-y-32' : 'translate-y-0'}`}>
                         <div className="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 shrink-0">
                            <span className="text-2xl pb-1">+</span>
                        </div>
                        
                        {/* Real Input Form */}
                        <form className="flex-1 flex gap-2" onSubmit={handleInputSubmit}>
                            <div className="flex-1 h-10 bg-[#2a3942] rounded-lg px-4 flex items-center relative">
                                {showInputSuccess ? (
                                    <span className="text-[#00a884] text-sm animate-pulse font-medium">Message Sent.</span>
                                ) : (
                                    <input 
                                        type="text" 
                                        value={inputValue}
                                        onChange={(e) => setInputValue(e.target.value)}
                                        placeholder="Leave a message..."
                                        className="bg-transparent text-gray-200 text-sm w-full focus:outline-none placeholder-gray-500"
                                    />
                                )}
                            </div>
                            <button 
                                type="submit"
                                className="w-10 h-10 rounded-full bg-[#00a884] flex items-center justify-center text-white hover:bg-[#00c298] transition-colors shrink-0"
                            >
                                <Send size={18} />
                            </button>
                        </form>
                    </div>
                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
