<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Chat with God (YouTube Edition - Faster)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #1e3a8a 0%, #581c87 100%);
            background-size: cover;
            background-attachment: fixed;
            overflow: hidden; 
        }
        
        /* Custom Animations */
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.4s ease-out forwards; /* Slightly faster animation */
        }
        
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; }  }
        .animate-fade-in {animation: fade-in 0.5s ease-out forwards;}

        .scrollbar-hide::-webkit-scrollbar {display: none;}
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none;}

        /* WhatsApp-like Background Pattern */
        .wa-bg {
            background-color: #0b141a;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%231f2937' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        /* Phone Gloss/Reflection Effect (Desktop only) */
        @media (min-width: 768px) {
             .phone-gloss {
                 position: relative;
             }
             .phone-gloss::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                /* Subtle diagonal shine */
                background: linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.1) 0%,
                    rgba(255, 255, 255, 0.02) 40%,
                    rgba(255, 255, 255, 0) 60%
                );
                border-radius: 32px; /* Match inner radius */
                pointer-events: none; /* Allow clicks through */
                z-index: 50;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Audio Context Helper ---
        const playSound = (type) => {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();

            osc.connect(gainNode);
            gainNode.connect(ctx.destination);

            if (type === 'received') {
                // Incoming Message: High pitch "Pop"
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } else if (type === 'sent') {
                // Outgoing Message: Distinct "Plock/Tick" (Sine wave, quick pitch drop)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, ctx.currentTime); // Start lower than 'received'
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1); // Fast drop
                
                gainNode.gain.setValueAtTime(0.1, ctx.currentTime); // Louder volume (was 0.05)
                gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1); // Quick decay
                
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            }
        };

        // --- Icons ---
        const Send = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        );
        const Wifi = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
        );
        const Battery = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="23" y1="13" x2="23" y2="11"></line></svg>
        );
        const Signal = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        );
        const RefreshCw = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        );
        const Play = ({ size = 24, fill = "none", className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        );
        const X = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );
        const Phone = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        );
        const Video = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
        );
        const MoreVertical = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
        );
        const Checks = ({ size = 16, className = "" }) => (
             <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>
        );
        
        const script = [
            { sender: 'You', text: "Hey god", time: "06:53 AM", delay: 10 },
			{ sender: 'You', text: "thanks for adding me", time: "06:53 AM", delay: 20 },
            { sender: 'You', text: "You there?", time: "06:53 AM", delay: 100 },
            { sender: 'God', text: "Everywhere.", time: "06:53 AM", delay: 10 },
			{ sender: 'God', text: "What’s up?", time: "06:53 AM", delay: 3500 },
            { sender: 'You', text: "just wondering if you exist.", time: "06:54 AM", delay: 100 },
            { sender: 'God', text: "Always.", time: "06:54 AM", delay: 3000 },
            { sender: 'You', text: "So…why Parkinson’s?", time: "06:55 AM", delay: 400 },
            { sender: 'God', text: "Through suffering you’ll find Enlightenment.", time: "06:56 AM", delay: 4000 },
            { sender: 'You', text: "Really..?", time: "06:56 AM", delay: 200 },
			{ sender: 'You', text: "I mean, really??", time: "06:56 AM", delay: 1000 },
            { sender: 'God', text: "I thought you’d like that.", time: "06:56 AM", delay: 3000 },
            { sender: 'You', text: "*sigh*", time: "06:57 AM", delay: 1000 },
            { sender: 'God', text: "The breath is a sign of the Divine", time: "06:57 AM", delay: 4000 },
            { sender: 'You', text: "Do you have to be so cryptic..?", time: "06:58 AM", delay: 1000 },
            { sender: 'God', text: "42", time: "06:58 AM", delay: 2000 },
            { sender: 'You', text: "Man…", time: "06:59 AM", delay: 3000 },
            { sender: 'God', text: "Or woman… You don’t know", time: "06:59 AM", delay: 1000 },
            { sender: 'God', text: "What’s on your mind, really?", time: "07:00 AM", delay: 4000 },
            { sender: 'You', text: "Sometimes I feel like\nI’m losing myself", time: "06:59 AM", delay: 5000 },
            { sender: 'God', text: "Go lose yourself.\nThat’s where I am hiding.", time: "06:59 AM", delay: 2000 },
            { sender: 'You', text: "I thought I’d seen you before!\nwhen I hit rock bottom in my 20s\nand went down on my knees", time: "07:00 AM", delay: 6000 },
            { sender: 'God', text: "Yep, that was me,\njust giving you a nudge.\nA divine Poke.", time: "07:00 AM", delay: 4000 },
            { sender: 'God', text: "Hope it helped.", time: "07:00 AM", delay: 3000 },
            { sender: 'You', text: "it did for a while", time: "07:01 AM", delay: 1000 },
			{ sender: 'You', text: "but then...", time: "07:01 AM", delay: 200 },
			{ sender: 'You', text: "why the depression", time: "07:01 AM", delay: 150 },
			{ sender: 'You', text: "the anxiety", time: "07:01 AM", delay: 100 },
			{ sender: 'You', text: "the parkinson", time: "07:01 AM", delay: 50 },
			{ sender: 'You', text: "the suffering", time: "07:02 AM", delay: 30 },
			{ sender: 'You', text: "the wars", time: "07:02 AM", delay: 10 },
            { sender: 'God', text: "That’s The Thief.\nHe leaves gold dust when\nyou’re not looking.", time: "07:02 AM", delay: 5000 },
            { sender: 'You', text: "I don’t see it", time: "07:03 AM", delay: 1000 },
            { sender: 'You', text: "I don’t get it", time: "07:03 AM", delay: 2000 },
            { sender: 'God', text: "Keep on writing and you will.", time: "07:03 AM", delay: 2000 },
            { sender: 'You', text: "so my book is…", time: "07:04 AM", delay: 2000 },
			{ sender: 'You', text: "a prayer?", time: "07:04 AM", delay: 1000 },
            { sender: 'God', text: "Sure.", time: "07:04 AM", delay: 1000 },
			{ sender: 'God', text: "Every page is a WhatsApp to Me.", time: "07:04 AM", delay: 2000 },
            { sender: 'You', text: "Will you answer?", time: "07:05 AM", delay: 2000 },
            { sender: 'God', text: "Already did.", time: "07:05AM", delay: 500 },
            { sender: 'God', text: "Check your manuscript.", time: "07:05AM", delay: 200 },
            { sender: 'God', text: "❤️", time: "∞", delay: 8000 }
        ];
        const App = () => {
            const [messages, setMessages] = useState([]);
            const [isTyping, setIsTyping] = useState(false);
            const [typingSender, setTypingSender] = useState(null);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [hasStarted, setHasStarted] = useState(false);
            const [isFinished, setIsFinished] = useState(false);
            const scrollRef = useRef(null);
            const wakeLockRef = useRef(null);

            // --- Screen Wake Lock Logic ---
            useEffect(() => {
                const requestWakeLock = async () => {
                    try {
                        if ('wakeLock' in navigator && hasStarted && !isFinished) {
                            wakeLockRef.current = await navigator.wakeLock.request('screen');
                        }
                    } catch (err) {
                        console.log("Wake Lock error", err);
                    }
                };
                if (hasStarted && !isFinished) { requestWakeLock(); }
            }, [hasStarted, isFinished]);

            const startChat = () => {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    const ctx = new AudioContext();
                    ctx.resume();
                }
                setMessages([]);
                setCurrentIndex(0);
                setIsFinished(false);
                setHasStarted(true);
            };
            
            const exitChat = () => {
                setHasStarted(false);
                setIsFinished(false);
                setMessages([]);
                setCurrentIndex(0);
            };

            useEffect(() => {
                if (!hasStarted) return;
                
                let timeouts = [];

                const runScript = async () => {
                    if (currentIndex >= script.length) {
                        setIsFinished(true);
                        setIsTyping(false);
                        return;
                    }

                    const currentItem = script[currentIndex];
                    // FASTER PACING: Reduced multipliers and caps for under 2 mins.
                    const typingDuration = Math.min(2000, Math.max(800, currentItem.text.length * 40));
                    const preTypingDelay = 500; 

                    // 1. Start Typing Indicator
                    const t1 = setTimeout(() => {
                        setTypingSender(currentItem.sender);
                        setIsTyping(true);
                        scrollToBottom();
                    }, preTypingDelay);

                    // 2. Message Appears + Sound
                    const t2 = setTimeout(() => {
                        setIsTyping(false);
                        setMessages(prev => [...prev, currentItem]);
                        if (currentItem.sender === 'God') {
                            playSound('received');
                        } else {
                            playSound('sent');
                        }
                        scrollToBottom();
                    }, preTypingDelay + typingDuration);

                    // 3. Next Message Trigger
                    const t3 = setTimeout(() => {
                        setCurrentIndex(prev => prev + 1);
                    }, preTypingDelay + typingDuration + currentItem.delay);

                    timeouts.push(t1, t2, t3);
                };

                runScript();

                return () => timeouts.forEach(t => clearTimeout(t));
            }, [currentIndex, hasStarted]);

            const scrollToBottom = () => {
                setTimeout(() => {
                    if (scrollRef.current) {
                        scrollRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
                    }
                }, 100); 
            };

            // --- Dynamic Class Logic ---
            // Added 'phone-gloss' class for desktop view
            const containerClasses = hasStarted 
                ? "fixed inset-0 w-full h-full z-50 flex flex-col wa-bg md:relative md:w-full md:max-w-md md:h-[800px] md:rounded-[40px] md:border-8 md:border-slate-800 md:shadow-2xl md:z-auto md:overflow-hidden phone-gloss"
                : "relative w-full max-w-md h-[800px] wa-bg rounded-[40px] shadow-2xl border-8 border-slate-800 overflow-hidden flex flex-col phone-gloss";

            const headerClasses = hasStarted
                ? "w-full h-8 bg-[#202c33] z-20 flex justify-between items-center px-6 pt-2 text-[10px] font-bold text-gray-400 md:absolute md:top-0"
                : "absolute top-0 w-full h-8 bg-[#202c33] z-20 flex justify-between items-center px-6 pt-2 text-[10px] font-bold text-gray-400";

            return (
                <div className="flex items-center justify-center min-h-screen text-slate-100">
                
                {/* Dynamic Phone Container */}
                <div className={containerClasses}>
                    
                    {/* Status Bar / Notch */}
                    <div className={headerClasses}>
                        <span>07:06</span>
                        <div className="flex gap-1 items-center">
                            <Signal size={12} />
                            <Wifi size={12} />
                            <Battery size={12} />
                        </div>
                    </div>

                    {/* Chat Header (WhatsApp Style) */}
                    <div className="mt-8 bg-[#202c33] p-3 flex items-center justify-between z-10 shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-200 via-yellow-400 to-amber-600 flex items-center justify-center text-slate-900 font-bold border border-gray-600">
                                G
                            </div>
                            <div>
                                <h1 className="font-semibold text-gray-100 tracking-wide text-base">God</h1>
                                <p className="text-xs text-gray-400 font-normal truncate">
                                    {isTyping && typingSender === 'God' ? 'typing...' : 'superbusy'}
                                </p>
                            </div>
                        </div>
                        
                        <div className="flex gap-4 text-[#aebac1] mr-2">
                             {!hasStarted ? null : (
                                <button onClick={exitChat} className="hover:text-white"><X size={20}/></button>
                             )}
                             {!hasStarted && <Video size={20} />}
                             {!hasStarted && <Phone size={20} />}
                             {!hasStarted && <MoreVertical size={20} />}
                        </div>
                    </div>

                    {/* Chat Area */}
                    <div className="flex-1 overflow-y-auto p-4 space-y-2 pb-24 scrollbar-hide">
                        
                        {/* Start Screen */}
                        {!hasStarted && (
                            <div className="h-full flex flex-col items-center justify-center text-center space-y-6 animate-fade-in">
                                <div className="w-24 h-24 rounded-full bg-[#005c4b] flex items-center justify-center mb-4 shadow-xl">
                                    <Send className="text-white ml-1" size={40} />
                                </div>
                                <div>
                                    <h2 className="text-2xl font-light text-white mb-2">Chat with God</h2>
                                    <p className="text-gray-400 text-sm">25 November 2025</p>
                                </div>
                                <button 
                                    onClick={startChat}
                                    className="flex items-center gap-2 px-8 py-3 bg-[#00a884] text-black rounded-full font-bold hover:bg-[#00c298] transition-all active:scale-95 shadow-lg"
                                >
                                    <Play size={20} fill="black" /> START
                                </button>
                            </div>
                        )}

                        {/* Messages */}
                        {messages.map((msg, index) => (
                            <div 
                                key={index} 
                                className={`flex w-full ${msg.sender === 'You' ? 'justify-end' : 'justify-start'} animate-slide-up`}
                            >
                                <div 
                                    className={`max-w-[85%] rounded-lg px-3 py-1.5 relative shadow-sm text-sm
                                        ${msg.sender === 'You' 
                                            ? 'bg-[#005c4b] text-white rounded-tr-none' 
                                            : 'bg-[#202c33] text-gray-100 rounded-tl-none'
                                        }`}
                                >
                                    <p className="whitespace-pre-line leading-relaxed pb-3 pr-2">{msg.text}</p>
                                    <div className="absolute bottom-1 right-2 flex items-center gap-1">
                                        <span className="text-[10px] text-gray-400 leading-none">
                                            {msg.time}
                                        </span>
                                        {msg.sender === 'You' && <Checks className="text-[#53bdeb]" size={14} />}
                                    </div>
                                </div>
                            </div>
                        ))}

                        {/* Typing Indicator */}
                        {isTyping && (
                            <div className={`flex w-full ${typingSender === 'You' ? 'justify-end' : 'justify-start'} animate-fade-in`}>
                                <div className={`${typingSender === 'You' ? 'bg-[#005c4b] rounded-tr-none' : 'bg-[#202c33] rounded-tl-none'} rounded-lg px-4 py-3 flex items-center gap-1 w-16 h-9`}>
                                    <div className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                                    <div className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                                    <div className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></div>
                                </div>
                            </div>
                        )}
                        
                        {/* Replay Screen */}
                        {isFinished && (
                            <div className="py-10 flex justify-center w-full animate-fade-in">
                                <button 
                                    onClick={startChat}
                                    className="flex items-center gap-2 px-6 py-2 bg-[#202c33] border border-gray-700 rounded-full text-[#00a884] font-medium hover:bg-[#2a3942] transition-colors"
                                >
                                    <RefreshCw size={16} /> Watch Again
                                </button>
                            </div>
                        )}

                        <div ref={scrollRef} />
                    </div>

                    {/* Input Area (Visual only) */}
                    <div className="p-2 bg-[#202c33] flex items-center gap-2">
                         <div className="w-8 h-8 rounded-full flex items-center justify-center text-gray-400">
                            <span className="text-2xl pb-1">+</span>
                        </div>
                        <div className="flex-1 h-10 bg-[#2a3942] rounded-lg px-4 flex items-center text-gray-400 text-sm">
                            Message
                        </div>
                         <div className="w-10 h-10 rounded-full bg-[#00a884] flex items-center justify-center text-white">

                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
