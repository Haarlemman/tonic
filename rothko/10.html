<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rothko – Ultra Soft + Texture</title>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; font-family:"Cal Sans",sans-serif; background:#2a1e0d; }

    /* START SCREEN */
    #start-overlay {
      position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center;
      background:hsl(30,25%,15%); color:#E11515; z-index:1000; transition:opacity 1.2s;
    }
    #start-overlay.hidden { opacity:0; pointer-events:none; }
    #start-overlay h1 { font-size:4.5rem; font-weight:400; margin-bottom:1rem; letter-spacing:-0.04em; }
    #start-overlay p { font-size:1.5rem; opacity:0.9; margin-bottom:1.5rem; }
    #start-btn {
      padding:1rem 2rem; background:rgba(255,255,255,0.25); border:2px solid white;
      color:white; font-size:1.1rem; cursor:pointer; border-radius:8px; text-transform:uppercase;
      backdrop-filter:blur(10px); transition:0.3s;
    }
    #start-btn:hover { background:rgba(255,255,255,0.4); transform:scale(1.05); }

    /* MAIN CANVAS */
    #canvas { width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; opacity:0; transition:opacity 1.2s; }
    #canvas.visible { opacity:1; }

    #rothko-inner {
      width:85vw; height:85vh; display:flex; flex-direction:column; gap:2vh; overflow:hidden;
    }

    /* COLOR BLOCK */
    .color-block {
      position:relative; border-radius:44px; overflow:hidden; flex:1; min-height:80px;
      background:#000; /* fallback */
    }

    /* BLURRED COLOR (bleeds out) */
    .blur-fill {
      position:absolute; inset:-100px; background:var(--c); filter:blur(32px);
      border-radius:44px; pointer-events:none;
    }

    /* CANVAS TEXTURE */
    .texture {
      position:absolute; inset:0; pointer-events:none; border-radius:44px;
      mix-blend-mode:overlay; opacity:0.48;
    }

    /* BUTTONS */
    .btn {
      position:fixed; bottom:60px; left:50%; transform:translateX(-50%);
      background:rgba(255,255,255,0.25); backdrop-filter:blur(10px);
      border:2px solid rgba(255,255,255,0.7); color:white; padding:14px 28px;
      font-size:14px; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
      border-radius:6px; z-index:1000; mix-blend-mode:difference; transition:0.2s;
    }
    .btn:hover { background:rgba(255,255,255,0.4); transform:translateX(-50%) scale(1.05); }
    .exit-btn { opacity:0.1; pointer-events:none; display:none; }
    .exit-btn.visible { display:block; pointer-events:auto; }
    .exit-btn:hover { opacity:1; }
    body:fullscreen .enter-btn { display:none; }

    .hint { position:fixed; bottom:20px; right:20px; color:rgba(255,255,255,0.4); font-size:12px; letter-spacing:1px; text-transform:uppercase; pointer-events:none; mix-blend-mode:difference; }

    /* VOLUME */
    #vol { position:fixed; bottom:20px; left:20px; display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.25); backdrop-filter:blur(12px); padding:8px 14px; border-radius:30px; border:1.5px solid rgba(255,255,255,0.4); z-index:1000; opacity:0.1; transition:0.3s; pointer-events:none; mix-blend-mode:difference; font-size:12px; color:white; }
    #vol.visible { opacity:1; pointer-events:auto; }
    #vol:hover { opacity:1; }
    #vol input { -webkit-appearance:none; width:90px; height:4px; border-radius:2px; background:rgba(255,255,255,0.3); outline:none; cursor:pointer; }
    #vol input::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:white; box-shadow:0 2px 6px rgba(0,0,0,0.3); }
  </style>
</head>
<body>

<!-- START -->
<div id="start-overlay">
  <h1>The Rothko Experience</h1>
  <p>A meditation on Life and beyond</p>
  <button id="start-btn">Start</button>
</div>

<!-- CANVAS -->
<div id="canvas">
  <div id="rothko-inner"></div>
</div>

<button class="btn enter-btn">View Fullscreen</button>
<button class="btn exit-btn">Exit</button>
<div class="hint">Click to refresh</div>

<div id="vol">
  <span>Vol</span>
  <input type="range" id="vol-slider" min="0" max="100" value="90">
  <span id="vol-val">90%</span>
</div>

<audio id="music" loop>
  <source src="immortality.mp3" type="audio/mpeg">
</audio>

<script>
/* ---------- CONFIG ---------- */
const palettes = [
  ['#8B0000','#FF4500','#FFD700'], ['#4B0082','#8B008B','#FF1493'], ['#DC143C','#FF6347','#FFA07A'],
  ['#2F4F4F','#1C1C1C','#8B4513'], ['#191970','#000080','#4B0082'], ['#CD853F','#D2691E','#8B4513'],
  ['#FF4500','#FFD700','#FF8C00'], ['#00CED1','#4682B4','#1E90FF'], ['#BC8F8F','#CD5C5C','#F08080'],
  ['#708090','#778899','#B0C4DE']
];
let blocks = [], bgHue = 0, started = false;

/* ---------- ELEMENTS ---------- */
const canvas = document.getElementById('canvas');
const inner = document.getElementById('rothko-inner');
const music = document.getElementById('music');
const overlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('start-btn');
const enterBtn = document.querySelector('.enter-btn');
const exitBtn = document.querySelector('.exit-btn');
const vol = document.getElementById('vol');
const volSlider = document.getElementById('vol-slider');
const volVal = document.getElementById('vol-val');
music.volume = 0.9;

/* ---------- HSL ---------- */
function hexToHSL(h) {
  const r = parseInt(h.slice(1,3),16)/255;
  const g = parseInt(h.slice(3,5),16)/255;
  const b = parseInt(h.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h2, s, l = (max+min)/2;
  if (max===min) h2=s=0;
  else {
    const d = max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){ case r: h2=(g-b)/d+(g<b?6:0); break; case g: h2=(b-r)/d+2; break; case b: h2=(r-g)/d+4; break; }
    h2 /= 6;
  }
  return h2*360;
}

/* ---------- TEXTURE ---------- */
function makeTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(512,512);
  const d = new Uint8ClampedArray(img.data.buffer);
  for (let i=0; i<d.length; i+=4) {
    const v = Math.random()*80 + 100 | 0;
    d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  return c;
}
const texCanvas = makeTexture();

/* ---------- START ---------- */
function start() {
  if (started) return;
  started = true;
  overlay.classList.add('hidden');
  setTimeout(() => {
    overlay.style.display = 'none';
    canvas.classList.add('visible');
    showUI();
    init();
    requestAnimationFrame(loop);
  }, 1200);
  music.play().catch(()=>{});
}
startBtn.onclick = start;
startBtn.ontouchend = e => { e.preventDefault(); start(); };

/* ---------- UI ---------- */
let hideTimer;
function showUI() {
  if (document.fullscreenElement) exitBtn.classList.add('visible');
  vol.classList.add('visible');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (document.fullscreenElement) exitBtn.style.opacity = '0.1';
    vol.style.opacity = '0.1';
  }, 3000);
}
volSlider.oninput = () => {
  const v = volSlider.value/100;
  music.volume = v;
  volVal.textContent = Math.round(v*100)+'%';
  showUI();
};
['mousedown','touchstart'].forEach(e => volSlider.addEventListener(e, showUI));
vol.onmouseenter = showUI;

/* ---------- ROTHKO ---------- */
function init() {
  inner.innerHTML = '';
  const p = palettes[Math.floor(Math.random()*palettes.length)];
  canvas.style.background = `hsl(${p.map(hexToHSL).reduce((a,b)=>a+b)/p.length},30%,18%)`;
  const n = Math.random()>0.3?3:2;
  blocks = [];

  const vh = window.innerHeight;
  const gap = (n-1)*2*vh/100;
  const usable = inner.clientHeight - gap;
  let rem = usable;
  const heights = [];

  for (let i=0; i<n; i++) {
    const h = i===n-1 ? rem : Math.max(80, Math.random()*rem*0.6 + 80);
    heights.push(h); rem -= h;
  }

  for (let i=0; i<n; i++) {
    const block = document.createElement('div');
    block.className = 'color-block';
    block.style.setProperty('--c', p[i%p.length]);

    const fill = document.createElement('div');
    fill.className = 'blur-fill';
    block.appendChild(fill);

    const tex = document.createElement('canvas');
    tex.className = 'texture';
    tex.width = tex.height = 512;
    tex.getContext('2d').drawImage(texCanvas,0,0,512,512);
    block.appendChild(tex);

    inner.appendChild(block);
    blocks.push({el:block, base:heights[i], hue:hexToHSL(p[i%p.length]), speed:Math.random()*0.4+0.1});
  }
}

/* ---------- LOOP ---------- */
function loop() {
  const vh = window.innerHeight;
  const gap = (blocks.length-1)*2*vh/100;
  const usable = inner.clientHeight - gap;
  let used = 0;

  blocks.forEach((b,i) => {
    const pulse = Math.sin(Date.now()/2000*b.speed)*0.08;
    let h = b.base*(1+pulse);
    h = Math.max(60,h);
    if (i===blocks.length-1) h = usable - used;
    else used += h;
    b.el.style.height = h+'px';
    b.hue = (b.hue + b.speed*0.8)%360;
    b.el.style.setProperty('--c', `hsl(${b.hue},70%,50%)`);
    const float = Math.sin(Date.now()/1500*b.speed)*15;
    b.el.style.transform = `translateY(${float}px)`;
  });

  bgHue = (bgHue + 0.08)%360;
  canvas.style.background = `hsl(${bgHue},30%,20%)`;
  requestAnimationFrame(loop);
}

/* ---------- FULLSCREEN & REFRESH ---------- */
function toggleFS() {
  document.fullscreenElement ? document.exitFullscreen() : document.body.requestFullscreen();
}
enterBtn.onclick = () => { toggleFS(); start(); };
exitBtn.onclick = toggleFS;
document.onfullscreenchange = () => {
  if (!document.fullscreenElement && started) location.reload();
};
document.onkeydown = e => { if ((e.key==='r'||e.key==='R')&&started) init(); };
document.onclick = e => { if (!e.target.closest('button')&&!e.target.closest('#vol')&&started) init(); };
window.onresize = () => { if (started) init(); };
</script>
</body>
</html>
