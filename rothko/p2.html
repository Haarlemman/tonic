<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Animated Color Fields with Texture</title>
<style>
  body, html {
    margin: 0; padding: 0; overflow: hidden;
    height: 100%;
    background: #594C2A;
    font-family: 'Cal Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .color-field {
    position: absolute;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-wrap: wrap;
  }

  .color-block {
    position: relative;
    flex: 1 1 33.333%;
    min-height: 33.333vh;
    transition: background-color 3s ease;
  }

  .texture-canvas {
    position: absolute;
    top:0; left:0;
    width: 100%; height: 100%;
    mix-blend-mode: overlay;
    opacity: 0.15;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="color-field" id="colorField">
  <div class="color-block"></div>
  <div class="color-block"></div>
  <div class="color-block"></div>
  <div class="color-block"></div>
  <div class="color-block"></div>
  <div class="color-block"></div>
  <div class="color-block"></div>
  <div class="color-block"></div>
  <div class="color-block"></div>
</div>

<script>
  // Animate color blocks with random colors
  const blocks = document.querySelectorAll('.color-block');

  function randomColor() {
    // Generate soft pastel colors
    const h = Math.floor(Math.random() * 360);
    const s = 50 + Math.random() * 30;
    const l = 40 + Math.random() * 30;
    return `hsl(${h},${s}%,${l}%)`;
  }

  function animateColors() {
    blocks.forEach(block => {
      block.style.backgroundColor = randomColor();
    });
  }

  setInterval(animateColors, 3000);
  animateColors();

  // Add a noise texture canvas overlay inside each color block
  function createNoiseCanvas(width, height) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    const imageData = ctx.createImageData(width, height);
    const pixels = imageData.data;

    for(let i = 0; i < pixels.length; i += 4) {
      // random greyscale noise
      const v = 128 + Math.floor(Math.random() * 32) - 16; // subtle noise around mid grey
      pixels[i] = v;
      pixels[i + 1] = v;
      pixels[i + 2] = v;
      pixels[i + 3] = 32; // alpha low for faint noise
    }
    ctx.putImageData(imageData, 0, 0);
    return canvas;
  }

  blocks.forEach(block => {
    const rect = block.getBoundingClientRect();
    const noiseCanvas = createNoiseCanvas(rect.width, rect.height);
    noiseCanvas.classList.add('texture-canvas');
    block.appendChild(noiseCanvas);

    // For responsiveness: redraw noise on resize
    window.addEventListener('resize', () => {
      const rectResize = block.getBoundingClientRect();
      noiseCanvas.width = rectResize.width;
      noiseCanvas.height = rectResize.height;
      const ctx = noiseCanvas.getContext('2d');
      const imageData = ctx.createImageData(rectResize.width, rectResize.height);
      const pixels = imageData.data;
      for(let i = 0; i < pixels.length; i += 4) {
        const v = 128 + Math.floor(Math.random() * 32) - 16;
        pixels[i] = v;
        pixels[i + 1] = v;
        pixels[i + 2] = v;
        pixels[i + 3] = 32;
      }
      ctx.putImageData(imageData, 0, 0);
    });
  });
</script>

</body>
</html>
