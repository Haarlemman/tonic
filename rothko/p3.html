<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rothko Experience with Texture</title>
<style>
  body, html {
    margin: 0; padding: 0;
    height: 100%;
    background: hsl(30, 25%, 15%);
    font-family: Cal Sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    color: #ddd7c1;
  }
  #canvasdiv {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    width: 100vw;
    height: 100vh;
    padding: 5vh 5vw;
    gap: 1.5vh;
  }
  .color-block {
    position: relative;
    width: 100%;
    height: 50px; /* initial */
    border-radius: 20px;
    filter: blur(10px);
    overflow: hidden;
    transition: background-color 1.5s ease, height 1.5s ease, transform 1.5s ease;
  }
  .color-block canvas.texture {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    mix-blend-mode: overlay;
    opacity: 0.15;
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>
<body>
<div id="canvasdiv"></div>

<script>
  const palettes = [
    "#8B0000", "#FF4500", "#FFD700",
    "#4B0082", "#8B008B", "#FF1493",
    "#DC143C", "#FF6347", "#FFA07A",
    "#2F4F4F", "#1C1C1C", "#8B4513",
    "#191970", "#000080", "#4B0082",
    "#CD853F", "#D2691E", "#8B4513",
    "#FF4500", "#FFD700", "#FF8C00",
    "#00CED1", "#4682B4", "#1E90FF",
    "#BC8F8F", "#CD5C5C", "#F08080",
    "#708090", "#778899", "#B0C4DE"
  ];

  const canvasDiv = document.getElementById("canvasdiv");
  const blocks = [];
  const noiseCanvasSize = 256;

  // Create noise texture canvas once and clone it
  function createNoiseTexture() {
    const canvas = document.createElement("canvas");
    canvas.width = noiseCanvasSize;
    canvas.height = noiseCanvasSize;
    const ctx = canvas.getContext("2d");
    const imgData = ctx.createImageData(noiseCanvasSize, noiseCanvasSize);
    const buffer32 = new Uint32Array(imgData.data.buffer);
    const alpha = 40 << 24; // Alpha ~40/255
    for (let i = 0; i < buffer32.length; i++) {
      const value = (Math.random() * 255) | 0;
      // ARGB format in little endian: 0xAARRGGBB
      buffer32[i] = alpha | (value << 16) | (value << 8) | value;
    }
    ctx.putImageData(imgData, 0, 0);
    return canvas;
  }

  const noiseTexture = createNoiseTexture();

  function hexToHSL(hex) {
    let r = parseInt(hex.substring(1, 3), 16) / 255;
    let g = parseInt(hex.substring(3, 5), 16) / 255;
    let b = parseInt(hex.substring(5, 7), 16) / 255;
    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // achromatic
    } else {
      let d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch(max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h /= 6;
    }
    return { h: h * 360, s: s * 100, l: l * 100 };
  }

  function hslToString(h, s, l) {
    return `hsl(${h.toFixed(1)},${s.toFixed(1)}%,${l.toFixed(1)}%)`;
  }

  function adjustBrightness(hex, percent) {
    let num = parseInt(hex.slice(1), 16);
    let amt = Math.round(2.55 * percent);
    let R = (num >> 16) + amt;
    let G = ((num >> 8) & 0x00FF) + amt;
    let B = (num & 0x0000FF) + amt;
    R = R < 0 ? 0 : R > 255 ? 255 : R;
    G = G < 0 ? 0 : G > 255 ? 255 : G;
    B = B < 0 ? 0 : B > 255 ? 255 : B;
    return "#" + (B | (G << 8) | (R << 16)).toString(16).padStart(6, '0');
  }

  // initialize blocks
  function initRothko() {
    canvasDiv.innerHTML = "";
    blocks.length = 0;
    const paletteIndex = Math.floor(Math.random() * palettes.length);
    const palette = palettes.slice(paletteIndex, paletteIndex + 4);

    for (let i = 0; i < palette.length; i++) {
      const block = document.createElement("div");
      block.className = "color-block";
      let baseColor = palette[i % palette.length];
      block.style.backgroundColor = baseColor;

      // Append noise texture clone canvas
      const tex = noiseTexture.cloneNode();
      tex.className = "texture";
      block.appendChild(tex);

      canvasDiv.appendChild(block);

      blocks.push({ el: block, baseColor });
    }
  }

  function animate() {
    blocks.forEach(b => {
      // Animate height between 40 and 80 px
      const newHeight = 40 + 40 * Math.abs(Math.sin(Date.now() * 0.001 + b.baseColor.charCodeAt(1)));
      b.el.style.height = `${newHeight}px`;

      // Animate subtle hue shift on base color
      let hsl = hexToHSL(b.baseColor);
      let hueShift = (Date.now() * 0.03 + hsl.h) % 360;
      b.el.style.backgroundColor = hslToString(hueShift, 70, 50);
    });
    requestAnimationFrame(animate);
  }

  window.addEventListener("resize", () => {
    // On resize, noise texture canvas auto-fills block with CSS width/height 100%
  });

  initRothko();
  animate();
</script>
</body>
</html>
