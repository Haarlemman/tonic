<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rothko – Ultra Soft + Real Texture</title>
<link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; font-family:"Cal Sans",sans-serif; background:#333; }

  /* START SCREEN */
  #start-overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center;
    background:hsl(30,25%,15%); color:#E11515; z-index:1000; transition:opacity 1s;
  }
  #start-overlay.hidden { opacity:0; pointer-events:none; }
  #start-overlay h1 { font-size:4.5rem; font-weight:400; margin-bottom:1rem; }
  #start-btn {
    margin-top:1.5rem; padding:1rem 2rem; background:rgba(255,255,255,0.3); border:2px solid white;
    color:white; font-size:1.1rem; cursor:pointer; border-radius:8px; text-transform:uppercase;
  }
  #start-btn:hover { background:rgba(255,255,255,0.4); transform:scale(1.05); }

  /* MAIN CANVAS */
  #canvas { width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; opacity:0; transition:opacity 1s; }
  #canvas.visible { opacity:1; }

  #rothko-inner {
    width:85vw; height:85vh; display:flex; flex-direction:column; gap:2vh; overflow:hidden;
  }

  /* COLOR BLOCK */
  .color-block {
    position:relative; border-radius:40px; overflow:hidden; flex:1; min-height:80px;
  }

  /* BLURRED COLOR LAYER */
  .blur-layer {
    position:absolute; inset:-70px; background:var(--color); filter:blur(28px); border-radius:40px;
  }

  /* TEXTURE LAYER (generated canvas) */
  .texture-layer {
    position:absolute; inset:0; pointer-events:none; border-radius:40px;
    mix-blend-mode:overlay; opacity:0.45;
  }

  /* BUTTONS */
  .fullscreen-btn, .exit-fullscreen-btn {
    position:fixed; bottom:60px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.25); backdrop-filter:blur(10px);
    border:2px solid rgba(255,255,255,0.7); color:white;
    padding:14px 28px; font-size:14px; font-weight:400; letter-spacing:1px; text-transform:uppercase;
    cursor:pointer; border-radius:6px; z-index:1000; mix-blend-mode:difference;
    transition:all 0.2s ease;
  }
  .fullscreen-btn:hover, .exit-fullscreen-btn:hover { background:rgba(255,255,255,0.4); transform:translateX(-50%) scale(1.05); }
  .exit-fullscreen-btn { opacity:0.1; transition:opacity 2s ease; pointer-events:none; display:none; }
  .exit-fullscreen-btn.visible { display:block; pointer-events:auto; }
  .exit-fullscreen-btn:hover { opacity:1; }
  body:fullscreen .fullscreen-btn { display:none; }

  .refresh-hint {
    position:fixed; bottom:20px; right:20px; color:rgba(255,255,255,0.4); font-size:12px;
    letter-spacing:1px; text-transform:uppercase; pointer-events:none; mix-blend-mode:difference; z-index:1000;
  }

  /* VOLUME */
  #volume-control {
    position:fixed; bottom:20px; left:20px; display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.25); backdrop-filter:blur(12px); padding:8px 14px; border-radius:30px;
    border:1.5px solid rgba(255,255,255,0.4); z-index:1000; opacity:0.1; transition:opacity 2s ease;
    pointer-events:none; mix-blend-mode:difference; font-size:12px; color:white;
  }
  #volume-control.visible { opacity:1; pointer-events:auto; }
  #volume-control:hover { opacity:1; }
  #volume-slider { -webkit-appearance:none; width:90px; height:4px; border-radius:2px; background:rgba(255,255,255,0.3); outline:none; cursor:pointer; }
  #volume-slider::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:white; box-shadow:0 2px 6px rgba(0,0,0,0.3); cursor:grab; }
</style>
</head>
<body>

<!-- START -->
<div id="start-overlay">
  <h1>The Rothko Experience</h1>
  <p>A meditation on Life and beyond</p>
  <button id="start-btn">Start</button>
</div>

<!-- CANVAS -->
<div id="canvas">
  <div id="rothko-inner"></div>
</div>

<button class="fullscreen-btn">View Fullscreen</button>
<button class="exit-fullscreen-btn">Exit</button>
<div class="refresh-hint">Click to refresh</div>

<div id="volume-control">
  <span>Vol</span>
  <input type="range" id="volume-slider" min="0" max="100" value="90">
  <span id="volume-value">90%</span>
</div>

<audio id="bg-music" loop>
  <source src="immortality.mp3" type="assets/audio/mpeg">
</audio>

<script>
/* ---------- CONFIG ---------- */
const GAP_VH = 2;
const palettes = [
  ['#8B0000','#FF4500','#FFD700'], ['#4B0082','#8B008B','#FF1493'], ['#DC143C','#FF6347','#FFA07A'],
  ['#2F4F4F','#1C1C1C','#8B4513'], ['#191970','#000080','#4B0082'], ['#CD853F','#D2691E','#8B4513'],
  ['#FF4500','#FFD700','#FF8C00'], ['#00CED1','#4682B4','#1E90FF'], ['#BC8F8F','#CD5C5C','#F08080'],
  ['#708090','#778899','#B0C4DE']
];

/* ---------- GLOBALS ---------- */
let blocks = [], bgHueShift = 0, musicStarted = false;

/* ---------- ELEMENTS ---------- */
const canvasEl = document.getElementById('canvas');
const inner = document.getElementById('rothko-inner');
const bgMusic = document.getElementById('bg-music');
const startOverlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('start-btn');
const fullscreenBtn = document.querySelector('.fullscreen-btn');
const exitBtn = document.querySelector('.exit-fullscreen-btn');
const volumeControl = document.getElementById('volume-control');
const volumeSlider = document.getElementById('volume-slider');
const volumeValue = document.getElementById('volume-value');

bgMusic.volume = 0.9;

/* ---------- HSL ---------- */
function hexToHSL(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if (max===min) h=s=0;
  else {
    const d = max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){ case r: h=(g-b)/d+(g<b?6:0); break; case g: h=(b-r)/d+2; break; case b: h=(r-g)/d+4; break; }
    h /= 6;
  }
  return {h: h*360, s: s*100, l: l*100};
}

/* ---------- TEXTURE GENERATOR ---------- */
function createNoiseTexture() {
  const c = document.createElement('canvas');
  const size = 256;
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const data = new Uint32Array(img.data.buffer);
  for (let i = 0; i < data.length; i++) {
    const v = Math.random() * 255 | 0;
    data[i] = (v << 24) | (v << 16) | (v << 8) | 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}
const noiseTexture = createNoiseTexture();

/* ---------- START ---------- */
function startExperience() {
  if (musicStarted) return;
  musicStarted = true;
  startOverlay.classList.add('hidden');
  setTimeout(() => {
    startOverlay.style.display = 'none';
    canvasEl.classList.add('visible');
    showControls();
    initRothko();
    requestAnimationFrame(animate);
  }, 1200);
  bgMusic.play().catch(() => {});
}
startBtn.addEventListener('click', startExperience);
startBtn.addEventListener('touchend', e => { e.preventDefault(); startExperience(); });

/* ---------- CONTROLS ---------- */
let controlTimeout;
function showControls() {
  if (!musicStarted) return;
  if (document.fullscreenElement) exitBtn.classList.add('visible');
  volumeControl.classList.add('visible');
  clearTimeout(controlTimeout);
  controlTimeout = setTimeout(() => {
    if (document.fullscreenElement) exitBtn.style.opacity = '0.1';
    volumeControl.style.opacity = '0.1';
  }, 3000);
}
volumeSlider.addEventListener('input', () => {
  const v = volumeSlider.value / 100;
  bgMusic.volume = v;
  volumeValue.textContent = Math.round(v*100)+'%';
  showControls();
});
['mousedown','touchstart'].forEach(ev => volumeSlider.addEventListener(ev, showControls));
volumeControl.addEventListener('mouseenter', showControls);

/* ---------- DYNAMIC ROTHKO ---------- */
function backgroundFromPalette(p) {
  const avg = p.map(hexToHSL).reduce((a,c)=>a+c.h,0)/p.length;
  bgHueShift = avg;
  return `hsl(${avg},30%,18%)`;
}
function initRothko() {
  inner.innerHTML = '';
  const palette = palettes[Math.floor(Math.random()*palettes.length)];
  canvasEl.style.backgroundColor = backgroundFromPalette(palette);
  const count = Math.random() > 0.3 ? 3 : 2;
  blocks = [];

  const vh = window.innerHeight;
  const totalGap = (count-1)*GAP_VH*vh/100;
  const usable = inner.clientHeight - totalGap;
  let remaining = usable;
  const baseH = [];

  for (let i=0; i<count; i++) {
    const h = i===count-1 ? remaining : Math.max(80, Math.random()*(remaining*0.6)+80);
    baseH.push(h); remaining -= h;
  }
  document.documentElement.style.setProperty('--gap', GAP_VH+'vh');

  for (let i=0; i<count; i++) {
    const block = document.createElement('div');
    block.className = 'color-block';
    block.style.setProperty('--color', palette[i%palette.length]);

    const blur = document.createElement('div');
    blur.className = 'blur-layer';
    block.appendChild(blur);

    const tex = document.createElement('canvas');
    tex.className = 'texture-layer';
    tex.width = tex.height = 512;
    const ctx = tex.getContext('2d');
    ctx.drawImage(noiseTexture, 0, 0, 512, 512);
    block.appendChild(tex);

    inner.appendChild(block);
    blocks.push({
      el: block,
      baseHeight: baseH[i],
      hue: hexToHSL(palette[i%palette.length]).h,
      speed: Math.random()*0.4+0.1
    });
  }
}

/* ---------- ANIMATION ---------- */
function animate() {
  const vh = window.innerHeight;
  const totalGap = (blocks.length-1)*GAP_VH*vh/100;
  const usable = inner.clientHeight - totalGap;
  let used = 0;

  blocks.forEach((b,i) => {
    const pulse = Math.sin(Date.now()/2000*b.speed)*0.08;
    let h = b.baseHeight*(1+pulse);
    h = Math.max(60, h);
    if (i===blocks.length-1) h = usable - used;
    else used += h;

    b.el.style.height = h+'px';
    b.hue = (b.hue + b.speed*0.8)%360;
    b.el.style.setProperty('--color', `hsl(${b.hue},70%,50%)`);

    const float = Math.sin(Date.now()/1500*b.speed)*15;
    b.el.style.transform = `translateY(${float}px)`;
  });

  bgHueShift = (bgHueShift + 0.08)%360;
  canvasEl.style.backgroundColor = `hsl(${bgHueShift},30%,20%)`;
  requestAnimationFrame(animate);
}

/* ---------- FULLSCREEN & REFRESH ---------- */
function toggleFullscreen() {
  document.fullscreenElement ? document.exitFullscreen() : document.body.requestFullscreen();
}
fullscreenBtn.addEventListener('click', () => { toggleFullscreen(); startExperience(); });
exitBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && musicStarted) location.reload();
});
document.addEventListener('keydown', e => {
  if ((e.key==='r' || e.key==='R') && musicStarted) initRothko();
});
document.addEventListener('click', e => {
  if (!e.target.closest('button') && !e.target.closest('#volume-control') && musicStarted) initRothko();
});
window.addEventListener('resize', () => { if (musicStarted) initRothko(); });
</script>
</body>
</html>
