<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The University of Free Will</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --red: #ff3300;
            --yellow: #ffcc00;
            --blue: #0033cc;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            touch-action: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* HUD Layer */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 50;
        }

        /* Logo Stamp */
        .brand-box {
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 6px 12px;
            display: inline-block;
            pointer-events: auto;
            border-left: 3px solid var(--yellow);
        }

        h1 {
            margin: 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: 2px;
        }

        .status-box {
            pointer-events: auto;
            display: flex;
            gap: 10px;
        }

        .hud-btn {
            background: #111;
            color: #888;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.6rem;
            letter-spacing: 1px;
        }

        #general-menu {
            position: absolute;
            top: 65px;
            right: 20px;
            background: #000;
            border: 1px solid #222;
            padding: 10px;
            width: 160px;
            display: none;
            flex-direction: column;
            gap: 4px;
            pointer-events: auto;
        }

        #general-menu.active { display: flex; }

        .menu-link {
            color: #666;
            text-decoration: none;
            font-size: 0.65rem;
            padding: 6px;
            text-transform: uppercase;
            border-bottom: 1px solid #111;
        }

        /* Ghost Terminal - Bottom Left */
        .controls-box {
            pointer-events: auto;
            width: 280px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 10px;
        }

        .feed-header {
            color: #444;
            font-weight: bold;
            font-size: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
            border-bottom: 1px solid #111;
            padding-bottom: 3px;
        }

        #feed-content {
            font-size: 0.65rem;
            color: #666;
            line-height: 1.4;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        .intro-btns {
            opacity: 0;
            transition: opacity 2s ease;
        }

        .intro-btns.visible { opacity: 1; }

        .action-btn {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 12px 0;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Courier New', Courier, monospace;
        }

        .directory-box {
            pointer-events: auto;
            text-align: right;
        }

        .building-tag {
            display: inline-block;
            padding: 4px 8px;
            margin-left: 6px;
            font-size: 0.6rem;
            text-transform: uppercase;
            border: 1px solid #111;
            cursor: pointer;
            color: #444;
        }

        .feed-art { color: #ff3e3e; }
        .feed-science { color: #3e9bff; }
        .feed-spirit { color: #ffff3e; }
    </style>
</head>

<body>
    <audio id="bg-music" loop crossorigin="anonymous" src="https://tonic.davidenker.com/audio/MysteriousHeartbeat1.mp3"></audio>

    <div id="hud-layer">
        <div style="display:flex; justify-content:space-between; align-items: flex-start;">
            <div class="brand-box">
                <h1>U-FW</h1>
            </div>
            <div class="status-box">
                <button class="hud-btn" onclick="toggleMusic()" id="music-toggle">Signal: OFF</button>
                <button class="hud-btn" onclick="toggleMenu()">Log</button>
            </div>
            <div id="general-menu">
                <a href="#" class="menu-link" onclick="toggleMenu()">Diagnostic</a>
                <a href="#" class="menu-link" onclick="focusBuilding('art')">Beauty</a>
                <a href="#" class="menu-link" onclick="focusBuilding('science')">Knowledge</a>
                <a href="#" class="menu-link" onclick="focusBuilding('spirit')">Wisdom</a>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
            <div class="controls-box">
                <div>
                    <div class="feed-header" id="feed-header">LINK: NULL</div>
                    <div id="feed-content"></div>
                </div>
                <div class="intro-btns" id="intro-btn-container">
                    <button id="skip-btn" class="action-btn">Initiate</button>
                </div>
            </div>

            <div class="directory-box">
                <div class="building-tag" onclick="focusBuilding('art')">B</div>
                <div class="building-tag" onclick="focusBuilding('science')">K</div>
                <div class="building-tag" onclick="focusBuilding('spirit')">W</div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let specialBlocks = [];
        let audioCtx, analyser, dataArray;
        let audioInitialized = false;
        let beatLevel = 0;
        let introActive = true;
        let skipRequested = false;
        let lastZoomTime = 0;
        let lastQuoteTime = 0;
        const ZOOM_INTERVAL = 14000;
        const QUOTE_INTERVAL = 4000;

        const feedContentEl = document.getElementById('feed-content');
        const feedHeaderEl = document.getElementById('feed-header');
        const skipBtn = document.getElementById('skip-btn');
        const bgMusic = document.getElementById('bg-music');
        const musicToggleBtn = document.getElementById('music-toggle');
        const generalMenu = document.getElementById('general-menu');

        const facultyData = {
            art: { quotes: ["UNUSUAL IS BEAUTY", "TO CREATE IS TO LIVE", "SOUL ESTHETICS"], class: "feed-art", idx: 0 },
            science: { quotes: ["FREE WILL PARADOX", "REALITY IS RELATIVE", "ENTROPY START"], class: "feed-science", idx: 0 },
            spirit: { quotes: ["ADVERSITY TEACHES", "WISDOM IN SILENCE", "THE VOID STARES"], class: "feed-spirit", idx: 0 }
        };

        const introQuotes = [
            "Link sequence starting...",
            "Life is surprise and framework.",
            "Learn more, know less.",
            "Free Will: The Paradox."
        ];

        window.onload = function () {
            initThree();
            animateLoop();
            runIntroSequence();
            
            const trigger = (e) => {
                if (e) e.preventDefault();
                startExperience();
            };
            skipBtn.addEventListener('click', trigger);
            skipBtn.addEventListener('touchstart', trigger, { passive: false });
        };

        function toggleMenu() { generalMenu.classList.toggle('active'); }

        function initAudioEngine() {
            if (audioInitialized) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(bgMusic);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 128;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioInitialized = true;
            } catch (e) {
                console.warn("Audio block", e);
            }
        }

        function startExperience() {
            if (skipRequested) return;
            skipRequested = true;
            introActive = false;
            
            // Critical: Play first to unlock context
            bgMusic.play().then(() => {
                musicToggleBtn.innerText = "Signal: ON";
            }).catch(() => {
                musicToggleBtn.innerText = "Signal: OFF";
            });

            initAudioEngine();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            document.getElementById('intro-btn-container').style.display = 'none';
            feedHeaderEl.innerText = "CORE: ACTIVE";
            feedContentEl.innerHTML = "> SIGNAL UNLOCKED\n> FLOW STABILIZED";
            lastZoomTime = Date.now();
        }

        function toggleMusic() {
            if (!audioInitialized) { startExperience(); return; }
            if (audioCtx) audioCtx.resume();
            if (bgMusic.paused) {
                bgMusic.play();
                musicToggleBtn.innerText = "Signal: ON";
            } else {
                bgMusic.pause();
                musicToggleBtn.innerText = "Signal: OFF";
            }
        }

        async function runIntroSequence() {
            document.getElementById('intro-btn-container').classList.add('visible');
            for (let quote of introQuotes) {
                if (skipRequested) break;
                feedContentEl.innerHTML = ""; 
                for (let char of quote) {
                    if (skipRequested) break;
                    feedContentEl.innerHTML += char;
                    await new Promise(r => setTimeout(r, 25));
                }
                await new Promise(r => setTimeout(r, 1200));
            }
            if (!skipRequested) {
                feedHeaderEl.innerText = "LINK READY";
                feedContentEl.innerHTML = "> READY FOR INITIATION";
            }
        }

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 25);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.35;
            controls.enablePan = false;

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const pl = new THREE.PointLight(0xffffff, 1);
            pl.position.set(10, 20, 10);
            scene.add(pl);

            // Back to JUST wireframe boxes
            createEntity(-12, 2, 0, 0xff3300, "art", [4, 6, 3]);
            createEntity(12, -2, 2, 0x0033cc, "science", [5, 4, 5]);
            createEntity(0, 12, -8, 0xffcc00, "spirit", [3, 9, 3]);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }, false);
        }

        function createEntity(x, y, z, color, type, size) {
            const geo = new THREE.BoxGeometry(size[0], size[1], size[2]);
            const mat = new THREE.MeshPhongMaterial({ 
                color, wireframe: true, emissive: color, emissiveIntensity: 0.5, transparent: true, opacity: 0.6 
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.userData = { type, size };
            scene.add(mesh);
            specialBlocks.push(mesh);
        }

        function focusBuilding(type) {
            if (generalMenu.classList.contains('active')) toggleMenu();
            const b = specialBlocks.find(b => b.userData.type === type);
            if (b) {
                lastZoomTime = Date.now();
                lastQuoteTime = Date.now();
                updateTerminal(type);
                controls.target.lerp(b.position.clone(), 0.1);
            }
        }

        function updateTerminal(type) {
            const data = facultyData[type];
            if (!data) return;
            const quote = data.quotes[data.idx];
            data.idx = (data.idx + 1) % data.quotes.length;
            feedHeaderEl.innerText = `UNIT: ${type.toUpperCase()}`;
            feedContentEl.innerHTML = `<span class="${data.class}">${quote}</span>\n> MONITORING...`;
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            const now = Date.now();
            const time = now * 0.001;
            
            if (audioInitialized && !bgMusic.paused) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0; for (let i = 0; i < 8; i++) sum += dataArray[i];
                beatLevel = (sum / 8 / 255);
            } else { beatLevel *= 0.95; }

            const simulatedBeat = Math.pow(Math.sin(time * 3.5), 10) * 0.5;
            const activeBeat = (beatLevel > 0.01) ? beatLevel : simulatedBeat;

            specialBlocks.forEach((mesh, idx) => {
                mesh.rotation.x += 0.002 + (idx * 0.001);
                mesh.rotation.y += 0.003;
                
                // Simple scale pulse instead of vertex morphing
                const s = 1 + (activeBeat * 0.15);
                mesh.scale.set(s, s, s);
            });

            if (!introActive && now - lastZoomTime > ZOOM_INTERVAL) {
                lastZoomTime = now;
                feedHeaderEl.innerText = "CORE STATE: ACTIVE";
            }
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
