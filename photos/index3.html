<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHASING THE LIGHT • David Enker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&amp;family=Inter:wght@300;400;900&amp;display=swap" rel="stylesheet">
  <style>
        :root {
            --app-height: 100vh;
        }

        body {
            margin: 0;
            background: linear-gradient(to top, #2e3233 0%, #2d6878 100%);
            color: #B6AA97;
            font-family: 'Crimson Pro', serif;
            overflow: hidden;
            height: var(--app-height); 
            width: 100vw;
        }

        .font-sans {
            font-family: 'Inter', sans-serif;
        }

        /* Drifting Cloud Background */
        .cloud-drift {
            position: absolute;
            inset: -20%;
            width: 140%;
            height: 140%;
            background-image: url('/music/images/cloud.png');
            background-size: cover;
            background-position: center;
            opacity: 0.22;
            filter: blur(8px);
            z-index: 1;
            pointer-events: none;
            will-change: transform;
            animation: bounce-drift 60s ease-in-out infinite alternate;
        }

        @keyframes bounce-drift {
            from { transform: translateX(-8%) scale(1.1); }
            to { transform: translateX(8%) scale(1); }
        }

        @keyframes subtle-pulse {
            0% { transform: scale(1.0); }
            100% { transform: scale(1.03); }
        }

        .funky-title {
            background: linear-gradient(
                90deg, 
                #ffffff 0%, 
                #00FCFF 25%, 
                #FFD700 50%, 
                #FF00CC 75%, 
                #ffffff 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: spectral-shift 8s linear infinite;
        }

        @keyframes spectral-shift {
            to { background-position: 200% center; }
        }

        .vignette {
            position: absolute;
            inset: 0;
            z-index: 25;
            background: radial-gradient(circle, transparent 10%, rgba(33, 68, 77, 0.4) 50%, rgba(46, 50, 51, 0.95) 100%);
            pointer-events: none;
        }

        .mood-panel {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            will-change: opacity;
        }

        .mood-panel.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Pulse wrapper — keeps transform off the img itself, preventing Firefox layer drops */
        .mood-fg-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mood-panel.active .mood-fg-wrap {
            animation: subtle-pulse 25s infinite alternate;
        }

        /* Disable pulse on mobile for performance */
        @media (max-width: 767px) {
            .mood-panel.active .mood-fg-wrap {
                animation: none;
            }
        }

        .mood-bg {
            position: absolute;
            inset: -40px;
            width: calc(100% + 80px);
            height: calc(100% + 80px);
            object-fit: cover;
            filter: blur(70px) brightness(0.12) grayscale(85%);
            opacity: 0.4;
            will-change: opacity;
        }

        @media (max-width: 767px) {
            .mood-bg {
                filter: blur(30px) brightness(0.12) grayscale(85%); /* Lighter blur for mobile performance */
            }
        }

        /* 
         * FOREGROUND IMAGE — object-fit: cover with smart sizing:
         * Portrait images on desktop: fill height, crop L/R sides
         * Landscape images on mobile: fill width, crop top/bottom
         * The JS will detect orientation and apply classes accordingly.
         */
        .mood-fg {
            position: relative;
            object-fit: cover;
            box-shadow: 0 0 120px rgba(0,0,0,0.9);
            transition: filter 4s ease-out;
            filter: grayscale(100%) brightness(0.85);
            user-select: none;
            -webkit-user-drag: none;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            /* Global soft edges — works on mobile & desktop */
            mask-image: radial-gradient(ellipse at center, black 35%, transparent 95%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 95%);
            transform: translate3d(0,0,0);
        }

        /* Desktop default: let the image size naturally, then override for portrait */
        .mood-fg {
            max-width: 90vw;
            max-height: 85vh;
            width: auto;
            height: auto;
        }

        /* Desktop: fill full available space */
        @media (min-width: 768px) {
            .mood-fg {
                max-width: 100vw;
                max-height: 100vh;
            }
        }

        /* Portrait photo: fill height, let width crop */
        .mood-fg.is-portrait {
            width: auto;
            height: 85vh;
            max-width: none;
            max-height: 85vh;
        }

        @media (min-width: 768px) {
            .mood-fg.is-portrait {
                height: 100vh;
                max-height: 100vh;
            }
        }

        /* Landscape photo on mobile: fill width, let height overflow/crop */
        @media (max-width: 767px) {
            .mood-fg.is-landscape {
                width: 100vw;
                height: 70vh; /* Don't touch top/bottom even in landscape */
                max-width: none;
                max-height: none;
            }
        }

        /* Landscape Orientation Optimization (mobile rotated) */
        @media (orientation: landscape) and (max-height: 500px) {
            .mood-fg {
                max-height: 100vh;
                mask-image: none;
                -webkit-mask-image: none;
            }
            nav { padding: 1rem !important; }
            h1 { font-size: 1.5rem !important; }
            .nav-ui { display: none !important; }
        }

        @media (min-width: 768px) {
            .mood-fg:not(.is-portrait) {
                max-width: 85vw;
                max-height: 80vh;
            }
        }

        .mood-panel.active .mood-fg {
            filter: grayscale(0%) brightness(1);
        }

        /* Progress Dots / Lines */
        .progress-line {
            height: 30px;
            width: 1px;
            border-left: 12px solid transparent; /* Wider tap target */
            border-right: 12px solid transparent; /* Wider tap target */
            background-clip: padding-box;
            background-color: rgba(255, 255, 255, 0.08);
            transition: all 0.7s ease;
            position: relative;
            cursor: pointer;
            pointer-events: auto;
        }

        .progress-line.active {
            background-color: white;
            transform: scaleY(1.8);
        }

        .progress-label {
            position: absolute;
            right: -24px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            font-size: 7px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.1em;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.7s ease;
            pointer-events: none;
        }

        .progress-line.active .progress-label {
            opacity: 1;
        }

        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: rgba(255, 255, 255, 0.06);
            z-index: 30;
            pointer-events: none;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: linear-gradient(to top, #2e3233 0%, #2d6878 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1.5s ease;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ── Side Arrow Navigation (desktop) ── */
        .side-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 40;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0.25;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: auto;
            color: white;
        }

        .side-arrow:hover {
            opacity: 0.9;
        }

        .side-arrow.left  { left: 20px; }
        .side-arrow.right { right: 20px; }

        /* Hide side arrows on mobile (touch zones handle it) */
        @media (max-width: 767px) {
            .side-arrow { display: none; }
        }

        /* ── Mobile Touch Zones ── */
        .touch-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 35;
            pointer-events: none; /* Let events pass through to the stage controller */
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .touch-zone.left  { left: 0; }
        .touch-zone.right { right: 0; }

        /* Only show on mobile */
        @media (min-width: 768px) {
            .touch-zone { display: none; }
        }

        /* ── Manual / Auto toggle — top-right ── */
        #modeToggle {
            top: 20px;
            right: 20px;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            pointer-events: auto;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 18px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        #modeToggle:hover {
            background: rgba(0, 0, 0, 0.6);
            transform: translateY(-1px);
        }

        .mode-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-label {
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .mode-led {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .mode-led.active {
            background-color: #4ade80; /* green-400 */
            box-shadow: 0 0 6px #4ade80, 0 0 12px rgba(74, 222, 128, 0.5);
        }

        .mode-led.inactive {
            background-color: rgba(255,255,255,0.12);
            box-shadow: none;
        }

        /* manual row */
        #rowManual .mode-label { color: rgba(255,255,255,0.45); }
        #rowManual.is-active .mode-label { color: rgba(255,255,255,0.85); }

        /* auto row */
        #rowAuto .mode-label { color: rgba(255,255,255,0.25); }
        #rowAuto.is-active .mode-label { color: rgba(255,255,255,0.85); }

        /* ── Copyright footer bottom-left ── */
        #copyright {
            bottom: 20px;
            left: 20px;
            z-index: 60;
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            pointer-events: none;
            user-select: none;
        }

        #copyright a {
            pointer-events: all;
            color: rgba(0, 255, 255, 0.45);
            text-decoration: none;
            transition: color 0.2s;
        }

        #copyright a:hover {
            color: rgba(127, 255, 255, 0.85);
        }
    </style>
 </head>
 <body class="selection:bg-stone-800">
  <!-- Loading State -->
  <div id="loader">
   <div class="w-8 h-8 border border-white/10 border-t-white rounded-full animate-spin mb-4"></div>
   <p id="loaderText" class="text-[10px] font-sans tracking-[0.5em] uppercase text-stone-500 text-center px-4 italic">Searching the Light...</p>
  </div>
  <!-- Drifting Background Layer -->
  <div class="cloud-drift"></div>

  <!-- ── Fixed UI overlay — isolated from all filter/transform stacking contexts ── -->
  <div id="fixedUI" style="position:fixed;inset:0;z-index:60;pointer-events:none;">
   <!-- Bold Music-Style Header -->
   <nav class="p-6 md:p-12 flex flex-col md:flex-row justify-between items-start md:items-center w-full pointer-events-none transition-all duration-500" style="position:absolute;top:0;left:0;">
    <div class="flex flex-col gap-1 pointer-events-auto">
     <h1 class="text-3xl md:text-5xl font-sans font-black tracking-[0.1em] uppercase text-white leading-tight funky-title">CHASING
      <br class="md:hidden">
      THE LIGHT</h1>
     <div class="flex items-center gap-3 mt-1">
      <div class="h-[1px] w-6 bg-white/30"></div>
      <p class="text-[8px] md:text-[9px] font-sans tracking-[0.4em] uppercase text-stone-400 font-bold opacity-80">A Visual Journal</p>
     </div>
    </div>
   </nav>
   <!-- Manual / Auto Mode Toggle — top right -->
   <div id="modeToggle" style="position:absolute;top:20px;right:20px;pointer-events:auto;">
    <div id="rowManual" class="mode-row is-active">
     <div class="mode-led active" id="ledManual"></div>
     <span class="mode-label">Manual</span>
    </div>
    <div id="rowAuto" class="mode-row">
     <div class="mode-led inactive" id="ledAuto"></div>
     <span class="mode-label">Auto</span>
    </div>
   </div>
   <!-- Copyright — bottom left -->
   <div id="copyright" style="position:absolute;bottom:20px;left:20px;pointer-events:auto;">
    © 2026 &nbsp;•&nbsp; <a href="/">David Enker</a>
   </div>
  </div>
  <main id="mainContent" class="h-screen w-full relative overflow-hidden" style="touch-action: none;">
   <!-- Edge Blur Overlays -->
   <div class="vignette"></div>
   <!-- Progress Indicator -->
   <div id="progressContainer" class="absolute left-4 md:left-12 top-1/2 -translate-y-1/2 flex flex-col gap-5 z-40 max-h-[50vh] overflow-y-auto no-scrollbar py-6 px-2 opacity-40 md:opacity-100 hover:opacity-100 transition-opacity"></div>
   <div id="stage" class="h-full w-full relative overflow-hidden bg-transparent cursor-grab active:cursor-grabbing z-10">
    <!-- Viewfinder Corners -->
    <div class="corner top-6 left-6 border-t border-l"></div>
    <div class="corner top-6 right-6 border-t border-r"></div>
    <div class="corner bottom-6 left-6 border-b border-l"></div>
    <div class="corner bottom-6 right-6 border-b border-r"></div>
    <!-- Mobile touch zones (left = prev, right = next) -->
    <div class="touch-zone left" id="touchZoneLeft"></div>
    <div class="touch-zone right" id="touchZoneRight"></div>
   </div>
   <!-- Side Arrow Navigation — desktop only -->
   <button class="side-arrow left" id="prevBtn" aria-label="Previous">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
     <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
   </button>
   <button class="side-arrow right" id="nextBtn" aria-label="Next">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
     <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
   </button>
  </main>
  <script>
        const config = {
            folderPath: 'images/', 
            extension: '.jpg',
            maxSearch: 114, 
            padding: 3      
        };

        let moods = [];
        let activeIndex = 0;
        let isAutoPlay = false; 
        let autoPlayInterval;
        let isScanning = false;

        const progressContainer = document.getElementById('progressContainer');
        const stage = document.getElementById('stage');
        const modeToggle = document.getElementById('modeToggle');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const rowManual = document.getElementById('rowManual');
        const rowAuto   = document.getElementById('rowAuto');
        const ledManual = document.getElementById('ledManual');
        const ledAuto   = document.getElementById('ledAuto');

        // Input handling
        let startX = 0, endX = 0, startY = 0, endY = 0;
        let isMouseDown = false;
        let touchStartX = 0, touchStartY = 0;
        let isTap = false;

        // Custom Viewport Height Fix for Mobile
        const appHeight = () => {
            document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
        };

        /* ── Image orientation detection ── */
        function classifyImage(imgEl) {
            // naturalWidth/Height available after load
            const w = imgEl.naturalWidth;
            const h = imgEl.naturalHeight;
            if (!w || !h) return;
            if (h > w) {
                imgEl.classList.add('is-portrait');
                imgEl.classList.remove('is-landscape');
            } else {
                imgEl.classList.add('is-landscape');
                imgEl.classList.remove('is-portrait');
            }
        }

        async function discoverImages() {
            if (isScanning || moods.length > 0) return;
            isScanning = true;

            const results = [];
            for (let i = 1; i <= config.maxSearch; i++) {
                const paddedId = i.toString().padStart(config.padding, '0');
                results.push({
                    id: paddedId,
                    url: `${config.folderPath}${paddedId}${config.extension}`,
                    index: i
                });
            }

            moods = results;
            
            // Build gallery in chunks to prevent mobile browsers from locking up
            const CHUNK_SIZE = 15;
            for (let i = 0; i < moods.length; i += CHUNK_SIZE) {
                renderChunk(i, Math.min(i + CHUNK_SIZE, moods.length));
                loaderText.innerText = `Assembling Journal... ${Math.round((i/moods.length)*100)}%`;
                await new Promise(r => setTimeout(r, 16)); // Wait one frame
            }

            setActive(0);
            hideLoader();
            isScanning = false;
        }

        function hideLoader() {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 1500);
        }

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                const timeout = setTimeout(() => {
                    img.src = ""; // Stop loading
                    resolve(false);
                }, 4000); // 4s timeout for discovery

                img.onload = () => {
                    clearTimeout(timeout);
                    resolve(true);
                };
                img.onerror = () => {
                    clearTimeout(timeout);
                    resolve(false);
                };
                img.src = url;
            });
        }

        function renderChunk(start, end) {
            for (let index = start; index < end; index++) {
                const mood = moods[index];
                
                // Progress line
                const line = document.createElement('button');
                line.className = `progress-line flex-shrink-0 ${index === 0 ? 'active' : ''}`;
                line.innerHTML = `<span class="progress-label font-sans">${mood.id}</span>`;
                line.onclick = (e) => { e.stopPropagation(); setActive(index); };
                progressContainer.appendChild(line);

                // Panel
                const panel = document.createElement('div');
                panel.className = `mood-panel ${index === 0 ? 'active' : ''}`;
                panel.dataset.url = mood.url;

                const bgImg = document.createElement('img');
                bgImg.alt = '';
                bgImg.className = 'mood-bg';

                const fgWrap = document.createElement('div');
                fgWrap.className = 'mood-fg-wrap';

                const fgImg = document.createElement('img');
                fgImg.alt = '';
                fgImg.className = 'mood-fg';
                
                fgImg.onerror = function() {
                    // Only hide if it's not the first image, to avoid blank screen
                    if (index > 0) {
                        panel.style.display = 'none';
                        const dot = progressContainer.querySelectorAll('.progress-line')[index];
                        if (dot) dot.style.display = 'none';
                    } else {
                        // If first image fails, show a placeholder so the page isn't "broken"
                        this.src = "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&q=80&w=800";
                        if (bgImg) bgImg.src = this.src;
                    }
                };
                
                fgImg.onload = () => classifyImage(fgImg);

                fgWrap.appendChild(fgImg);
                panel.appendChild(bgImg);
                panel.appendChild(fgWrap);
                stage.appendChild(panel);
            }
        }

        // Load images for a window around the active index
        function loadNearby(index) {
            const PRELOAD = 2;
            const panels = document.querySelectorAll('.mood-panel');
            panels.forEach((panel, i) => {
                const bg = panel.querySelector('.mood-bg');
                const fg = panel.querySelector('.mood-fg');
                
                if (Math.abs(i - index) <= PRELOAD) {
                    // Load nearby images
                    if (!panel.dataset.loaded) {
                        const url = panel.dataset.url;
                        if (bg) bg.src = url;
                        if (fg) fg.src = url;
                        panel.dataset.loaded = '1';
                    }
                } else if (Math.abs(i - index) > PRELOAD + 2) {
                    // Unload distant images to save memory on mobile Safari
                    if (panel.dataset.loaded) {
                        if (bg) bg.src = '';
                        if (fg) fg.src = '';
                        panel.dataset.loaded = '';
                    }
                }
            });
        }

        function setActive(index) {
            activeIndex = index;
            document.querySelectorAll('.progress-line').forEach((l, i) => l.classList.toggle('active', i === activeIndex));
            document.querySelectorAll('.mood-panel').forEach((p, i) => p.classList.toggle('active', i === activeIndex));
            loadNearby(index);

            const activeLine = document.querySelectorAll('.progress-line')[index];
            if (activeLine) {
                requestAnimationFrame(() => {
                    activeLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                });
            }
        }

        function next() { setActive((activeIndex + 1) % moods.length); }
        function prev() { setActive((activeIndex - 1 + moods.length) % moods.length); }

        /* ── Swipe gesture ── */
        function handleGesture() {
            const deltaX = endX - startX;
            const deltaY = endY - startY;
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (Math.abs(deltaX) > 40) { if (deltaX < 0) next(); else prev(); }
            } else {
                if (Math.abs(deltaY) > 50) { if (deltaY < 0) next(); else prev(); }
            }
        }

        /* ── Side Arrow Navigation (desktop) ── */
        document.getElementById('nextBtn').onclick = (e) => { e.stopPropagation(); next(); };
        document.getElementById('prevBtn').onclick = (e) => { e.stopPropagation(); prev(); };

        /* ── Unified Input Controller (Mobile & Desktop) ── */
        // We use the stage as the primary capture point for all navigation interaction
        
        function handleInteraction(isRightSide) {
            if (isRightSide) next();
            else prev();
        }

        // Mouse click handling for desktop
        stage.addEventListener('click', (e) => {
            // If the user was dragging (swipe), don't trigger a click
            if (Math.abs(endX - startX) > 10 || Math.abs(endY - startY) > 10) return;
            
            const isRightSide = e.clientX > (window.innerWidth / 2);
            handleInteraction(isRightSide);
        });

        /* ── Stage touch / mouse for swipe ── */
        stage.addEventListener('touchstart', e => {
            startX = e.changedTouches[0].clientX;
            startY = e.changedTouches[0].clientY;
            touchStartX = startX;
            touchStartY = startY;
            isTap = true;
        }, { passive: false });

        stage.addEventListener('touchmove', e => {
            e.preventDefault();
            isTap = false; // moved = not a tap
        }, { passive: false });

        stage.addEventListener('touchend', e => {
            // Note: we don't call preventDefault here to allow click simulation if needed
            endX = e.changedTouches[0].clientX;
            endY = e.changedTouches[0].clientY;
            
            if (!isTap) {
                // It was a swipe
                handleGesture();
            } else {
                // It was a tap — determine side
                const isRightSide = endX > (window.innerWidth / 2);
                handleInteraction(isRightSide);
            }
        }, { passive: false });

        stage.addEventListener('mousedown', e => {
            isMouseDown = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mouseup', e => {
            if (!isMouseDown) return;
            isMouseDown = false;
            endX = e.clientX;
            endY = e.clientY;
            handleGesture();
        });

        /* ── Mode toggle ── */
        function updateModeUI() {
            if (isAutoPlay) {
                rowManual.classList.remove('is-active');
                rowAuto.classList.add('is-active');
                ledManual.classList.remove('active'); ledManual.classList.add('inactive');
                ledAuto.classList.add('active');      ledAuto.classList.remove('inactive');
            } else {
                rowManual.classList.add('is-active');
                rowAuto.classList.remove('is-active');
                ledManual.classList.add('active');    ledManual.classList.remove('inactive');
                ledAuto.classList.remove('active');   ledAuto.classList.add('inactive');
            }
        }

        modeToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            isAutoPlay = !isAutoPlay;
            updateModeUI();
            if (isAutoPlay) autoPlayInterval = setInterval(next, 7000);
            else clearInterval(autoPlayInterval);
        });

        /* ── Keyboard ── */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  prev();
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next();
        });

        /* ── Resize / rotate ── */
        let resizeTimer;
        window.addEventListener('resize', () => {
            appHeight();
            clearTimeout(resizeTimer);
            document.body.style.pointerEvents = 'none';
            resizeTimer = setTimeout(() => {
                setActive(activeIndex);
                document.body.style.pointerEvents = '';
            }, 350);
        });

        window.onload = () => {
            appHeight();
            discoverImages();
            acquireWakeLock();
        };

        /* ── Screen Wake Lock — keep display on while browsing ── */
        let wakeLock = null;

        async function acquireWakeLock() {
            if (!('wakeLock' in navigator)) return; // API not supported
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
                // Silently ignore — e.g. battery saver mode
            }
        }

        // Re-acquire after tab becomes visible again (required by the spec)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                acquireWakeLock();
                // If gallery never loaded (e.g. tab was hidden during init), retry
                if (moods.length === 0) discoverImages();
            }
        });
    </script>
 </body>
