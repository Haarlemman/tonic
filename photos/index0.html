<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHASING THE LIGHT • Tonic for the Bones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Inter:wght@300;400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-height: 100vh;
        }

        body {
            margin: 0;
            background: linear-gradient(to top, #2e3233 0%, #2d6878 100%);
            color: #B6AA97;
            font-family: 'Crimson Pro', serif;
            overflow: hidden;
            height: var(--app-height); 
            width: 100vw;
            touch-action: none; 
        }

        .font-sans {
            font-family: 'Inter', sans-serif;
        }

        /* Drifting Cloud Background */
        .cloud-drift {
            position: absolute;
            inset: -20%;
            width: 140%;
            height: 140%;
            background-image: url('/music/images/cloud.png');
            background-size: cover;
            background-position: center;
            opacity: 0.22;
            filter: blur(8px);
            z-index: 1;
            pointer-events: none;
            animation: bounce-drift 60s ease-in-out infinite alternate;
        }

        @keyframes bounce-drift {
            from { transform: translateX(-8%) scale(1.1); }
            to { transform: translateX(8%) scale(1); }
        }

        @keyframes subtle-pulse {
            0% { transform: scale(1.0); }
            100% { transform: scale(1.03); }
        }

        .funky-title {
            background: linear-gradient(
                90deg, 
                #ffffff 0%, 
                #00FCFF 25%, 
                #FFD700 50%, 
                #FF00CC 75%, 
                #ffffff 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: spectral-shift 8s linear infinite;
        }

        @keyframes spectral-shift {
            to { background-position: 200% center; }
        }

        .vignette {
            position: absolute;
            inset: 0;
            z-index: 25;
            background: radial-gradient(circle, transparent 10%, rgba(33, 68, 77, 0.4) 50%, rgba(46, 50, 51, 0.95) 100%);
            pointer-events: none;
        }

        .mood-panel {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .mood-panel.active {
            opacity: 1;
            pointer-events: auto;
        }

        .mood-bg {
            position: absolute;
            inset: -40px;
            width: calc(100% + 80px);
            height: calc(100% + 80px);
            object-fit: cover;
            filter: blur(70px) brightness(0.12) grayscale(85%);
            opacity: 0.4;
        }

        /* 
         * FOREGROUND IMAGE — object-fit: cover with smart sizing:
         * Portrait images on desktop: fill height, crop L/R sides
         * Landscape images on mobile: fill width, crop top/bottom
         * The JS will detect orientation and apply classes accordingly.
         */
        .mood-fg {
            position: relative;
            object-fit: cover;
            box-shadow: 0 0 120px rgba(0,0,0,0.9);
            transition: transform 2s ease-out, filter 4s ease-out;
            filter: grayscale(100%) brightness(0.85);
            z-index: 10;
            mask-image: radial-gradient(circle, black 25%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle, black 25%, transparent 90%);
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Desktop default: let the image size naturally, then override for portrait */
        .mood-fg {
            max-width: 100vw;
            max-height: 95vh;
            width: auto;
            height: auto;
        }

        /* Portrait photo on desktop: fill height, let width overflow/crop */
        .mood-fg.is-portrait {
            width: auto;
            height: 95vh;
            max-width: none;
            max-height: 95vh;
        }

        /* Landscape photo on mobile: fill width, let height overflow/crop */
        @media (max-width: 767px) {
            .mood-fg.is-landscape {
                width: 100vw;
                height: auto;
                max-width: none;
                max-height: none;
            }
        }

        /* Landscape Orientation Optimization (mobile rotated) */
        @media (orientation: landscape) and (max-height: 500px) {
            .mood-fg {
                max-height: 100vh;
                mask-image: none;
                -webkit-mask-image: none;
            }
            nav { padding: 1rem !important; }
            h1 { font-size: 1.5rem !important; }
            .nav-ui { display: none !important; }
        }

        @media (min-width: 768px) {
            .mood-fg:not(.is-portrait) {
                max-width: 85vw;
                max-height: 80vh;
            }
        }

        .mood-panel.active .mood-fg {
            filter: grayscale(0%) brightness(1);
            animation: subtle-pulse 25s infinite alternate;
        }

        /* Progress Dots / Lines */
        .progress-line {
            height: 30px;
            width: 1px;
            background-color: rgba(255, 255, 255, 0.08);
            transition: all 0.7s ease;
            position: relative;
            cursor: pointer;
            pointer-events: auto;
        }

        .progress-line.active {
            background-color: white;
            transform: scaleY(1.8);
        }

        .progress-label {
            position: absolute;
            right: -24px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            font-size: 7px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.1em;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.7s ease;
            pointer-events: none;
        }

        .progress-line.active .progress-label {
            opacity: 1;
        }

        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: rgba(255, 255, 255, 0.06);
            z-index: 30;
            pointer-events: none;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: linear-gradient(to top, #2e3233 0%, #2d6878 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1.5s ease;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ── Side Arrow Navigation (desktop) ── */
        .side-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 40;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0.25;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: auto;
            color: white;
        }

        .side-arrow:hover {
            opacity: 0.9;
        }

        .side-arrow.left  { left: 20px; }
        .side-arrow.right { right: 20px; }

        /* Hide side arrows on mobile (touch zones handle it) */
        @media (max-width: 767px) {
            .side-arrow { display: none; }
        }

        /* ── Mobile Touch Zones ── */
        .touch-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 35;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }

        .touch-zone.left  { left: 0; }
        .touch-zone.right { right: 0; }

        /* Only show on mobile */
        @media (min-width: 768px) {
            .touch-zone { display: none; }
        }

        /* ── Manual / Auto toggle — top-right ── */
        #modeToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            pointer-events: auto;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5); /* 50% transparency */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 18px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        #modeToggle:hover {
            background: rgba(0, 0, 0, 0.6);
            transform: translateY(-1px);
        }

        .mode-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-label {
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .mode-led {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .mode-led.active {
            background-color: #4ade80; /* green-400 */
            box-shadow: 0 0 6px #4ade80, 0 0 12px rgba(74, 222, 128, 0.5);
        }

        .mode-led.inactive {
            background-color: rgba(255,255,255,0.12);
            box-shadow: none;
        }

        /* manual row */
        #rowManual .mode-label { color: rgba(255,255,255,0.45); }
        #rowManual.is-active .mode-label { color: rgba(255,255,255,0.85); }

        /* auto row */
        #rowAuto .mode-label { color: rgba(255,255,255,0.25); }
        #rowAuto.is-active .mode-label { color: rgba(255,255,255,0.85); }

        /* ── Copyright footer bottom-left ── */
        #copyright {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 60;
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            pointer-events: none;
            user-select: none;
        }

        #copyright a {
            pointer-events: all;
            color: rgba(0, 255, 255, 0.45);
            text-decoration: none;
            transition: color 0.2s;
        }

        #copyright a:hover {
            color: rgba(127, 255, 255, 0.85);
        }
    </style>
</head>
<body class="selection:bg-stone-800">

    <!-- Loading State -->
    <div id="loader">
        <div class="w-8 h-8 border border-white/10 border-t-white rounded-full animate-spin mb-4"></div>
        <p id="loaderText" class="text-[8px] font-sans tracking-[0.5em] uppercase text-stone-500 text-center px-4 italic">Searching the Light...</p>
    </div>

    <!-- Drifting Background Layer -->
    <div class="cloud-drift"></div>

    <!-- Bold Music-Style Header -->
    <nav class="p-6 md:p-12 flex flex-col md:flex-row justify-between items-start md:items-center z-50 fixed top-0 w-full pointer-events-none transition-all duration-500">
        <div class="flex flex-col gap-1 pointer-events-auto">
            <h1 class="text-3xl md:text-5xl font-sans font-black tracking-[0.1em] uppercase text-white leading-tight funky-title">
                CHASING <br class="md:hidden" /> THE LIGHT
            </h1>
            <div class="flex items-center gap-3 mt-1">
                <div class="h-[1px] w-6 bg-white/30"></div>
                <p class="text-[8px] md:text-[9px] font-sans tracking-[0.4em] uppercase text-stone-400 font-bold opacity-80">A Visual Journal</p>
            </div>
        </div>
    </nav>

    <!-- Manual / Auto Mode Toggle — top right -->
    <div id="modeToggle">
        <div id="rowManual" class="mode-row is-active">
            <div class="mode-led active" id="ledManual"></div>
            <span class="mode-label">Manual</span>
        </div>
        <div id="rowAuto" class="mode-row">
            <div class="mode-led inactive" id="ledAuto"></div>
            <span class="mode-label">Auto</span>
        </div>
    </div>

    <!-- Copyright — bottom left -->
    <div id="copyright">© 2026 &nbsp;•&nbsp; <a href="/">David Enker</a></div>

    <main id="mainContent" class="h-screen w-full relative overflow-hidden">
        <!-- Edge Blur Overlays -->
        <div class="vignette"></div>

        <!-- Progress Indicator -->
        <div id="progressContainer" class="absolute left-4 md:left-12 top-1/2 -translate-y-1/2 flex flex-col gap-5 z-40 max-h-[50vh] overflow-y-auto no-scrollbar py-6 px-2 opacity-40 md:opacity-100 hover:opacity-100 transition-opacity"></div>

        <div id="stage" class="h-full w-full relative overflow-hidden bg-transparent cursor-grab active:cursor-grabbing z-10">
            <!-- Viewfinder Corners -->
            <div class="corner top-6 left-6 border-t border-l"></div>
            <div class="corner top-6 right-6 border-t border-r"></div>
            <div class="corner bottom-6 left-6 border-b border-l"></div>
            <div class="corner bottom-6 right-6 border-b border-r"></div>

            <!-- Mobile touch zones (left = prev, right = next) -->
            <div class="touch-zone left"  id="touchZoneLeft"></div>
            <div class="touch-zone right" id="touchZoneRight"></div>
        </div>

        <!-- Side Arrow Navigation — desktop only -->
        <button class="side-arrow left"  id="prevBtn" aria-label="Previous">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="side-arrow right" id="nextBtn" aria-label="Next">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </main>

    <script>
        const config = {
            folderPath: '/photos/images/', 
            extension: '.jpg',
            maxSearch: 114, 
            padding: 3      
        };

        let moods = [];
        let activeIndex = 0;
        let isAutoPlay = false; 
        let autoPlayInterval;
        let isScanning = false;

        const progressContainer = document.getElementById('progressContainer');
        const stage = document.getElementById('stage');
        const modeToggle = document.getElementById('modeToggle');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const rowManual = document.getElementById('rowManual');
        const rowAuto   = document.getElementById('rowAuto');
        const ledManual = document.getElementById('ledManual');
        const ledAuto   = document.getElementById('ledAuto');

        // Input handling
        let startX = 0, endX = 0, startY = 0, endY = 0;
        let isMouseDown = false;
        let touchStartX = 0, touchStartY = 0;
        let isTap = false;

        // Custom Viewport Height Fix for Mobile
        const appHeight = () => {
            document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
        };

        /* ── Image orientation detection ── */
        function classifyImage(imgEl) {
            // naturalWidth/Height available after load
            const w = imgEl.naturalWidth;
            const h = imgEl.naturalHeight;
            if (!w || !h) return;
            if (h > w) {
                imgEl.classList.add('is-portrait');
                imgEl.classList.remove('is-landscape');
            } else {
                imgEl.classList.add('is-landscape');
                imgEl.classList.remove('is-portrait');
            }
        }

        async function discoverImages() {
            if (isScanning || moods.length > 0) return;
            isScanning = true;

            const scanPromises = [];
            for (let i = 1; i <= config.maxSearch; i++) {
                const paddedId = i.toString().padStart(config.padding, '0');
                const url = `${config.folderPath}${paddedId}${config.extension}`;
                scanPromises.push(
                    checkImageExists(url).then(exists => {
                        if (exists) return { id: paddedId, url: url, index: i };
                        return null;
                    })
                );
            }

            const results = await Promise.all(scanPromises);
            moods = results.filter(item => item !== null).sort((a, b) => a.index - b.index);

            if (moods.length === 0) {
                loaderText.innerHTML = "NO IMAGES FOUND AT:<br>" + config.folderPath + "<br><small>Showing placeholders</small>";
                moods = [
                    { id: "011", url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=800' },
                    { id: "012", url: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&q=80&w=800' }
                ];
                renderGallery();
                setTimeout(() => hideLoader(), 2000);
            } else {
                renderGallery();
                setActive(0);
                hideLoader();
            }
            isScanning = false;
        }

        function hideLoader() {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 1500);
        }

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        function renderGallery() {
            moods.forEach((mood, index) => {
                // Progress line
                const line = document.createElement('button');
                line.className = `progress-line flex-shrink-0 ${index === 0 ? 'active' : ''}`;
                line.innerHTML = `<span class="progress-label font-sans">${mood.id}</span>`;
                line.onclick = (e) => { e.stopPropagation(); setActive(index); };
                progressContainer.appendChild(line);

                // Panel
                const panel = document.createElement('div');
                panel.className = `mood-panel ${index === 0 ? 'active' : ''}`;

                const bgImg = document.createElement('img');
                bgImg.src = mood.url;
                bgImg.alt = '';
                bgImg.className = 'mood-bg';

                const fgImg = document.createElement('img');
                fgImg.src = mood.url;
                fgImg.alt = '';
                fgImg.className = 'mood-fg';
                fgImg.onload = () => classifyImage(fgImg);
                // If already cached
                if (fgImg.complete && fgImg.naturalWidth) classifyImage(fgImg);

                panel.appendChild(bgImg);
                panel.appendChild(fgImg);
                stage.appendChild(panel);
            });
        }

        function setActive(index) {
            activeIndex = index;
            document.querySelectorAll('.progress-line').forEach((l, i) => l.classList.toggle('active', i === activeIndex));
            document.querySelectorAll('.mood-panel').forEach((p, i) => p.classList.toggle('active', i === activeIndex));

            const activeLine = document.querySelectorAll('.progress-line')[index];
            if (activeLine) {
                const performScroll = () => activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
                requestAnimationFrame(() => {
                    performScroll();
                    setTimeout(performScroll, 250);
                    setTimeout(performScroll, 600);
                });
            }
        }

        function next() { setActive((activeIndex + 1) % moods.length); }
        function prev() { setActive((activeIndex - 1 + moods.length) % moods.length); }

        /* ── Swipe gesture ── */
        function handleGesture() {
            const deltaX = endX - startX;
            const deltaY = endY - startY;
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (Math.abs(deltaX) > 40) { if (deltaX < 0) next(); else prev(); }
            } else {
                if (Math.abs(deltaY) > 50) { if (deltaY < 0) next(); else prev(); }
            }
        }

        /* ── Desktop arrow buttons ── */
        document.getElementById('nextBtn').onclick = (e) => { e.stopPropagation(); next(); };
        document.getElementById('prevBtn').onclick = (e) => { e.stopPropagation(); prev(); };

        /* ── Mobile touch zones ── */
        document.getElementById('touchZoneLeft').addEventListener('click', (e) => {
            e.stopPropagation();
            prev();
        });
        document.getElementById('touchZoneRight').addEventListener('click', (e) => {
            e.stopPropagation();
            next();
        });

        /* ── Stage touch / mouse for swipe ── */
        stage.addEventListener('touchstart', e => {
            startX = e.changedTouches[0].clientX;
            startY = e.changedTouches[0].clientY;
            touchStartX = startX;
            touchStartY = startY;
            isTap = true;
        }, { passive: false });

        stage.addEventListener('touchmove', e => {
            e.preventDefault();
            isTap = false; // moved = not a tap
        }, { passive: false });

        stage.addEventListener('touchend', e => {
            endX = e.changedTouches[0].clientX;
            endY = e.changedTouches[0].clientY;
            // Only handle swipe if it wasn't a tap (touch zones handle taps)
            if (!isTap) handleGesture();
        }, { passive: false });

        stage.addEventListener('mousedown', e => {
            isMouseDown = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mouseup', e => {
            if (!isMouseDown) return;
            isMouseDown = false;
            endX = e.clientX;
            endY = e.clientY;
            handleGesture();
        });

        /* ── Mode toggle ── */
        function updateModeUI() {
            if (isAutoPlay) {
                rowManual.classList.remove('is-active');
                rowAuto.classList.add('is-active');
                ledManual.classList.remove('active'); ledManual.classList.add('inactive');
                ledAuto.classList.add('active');      ledAuto.classList.remove('inactive');
            } else {
                rowManual.classList.add('is-active');
                rowAuto.classList.remove('is-active');
                ledManual.classList.add('active');    ledManual.classList.remove('inactive');
                ledAuto.classList.remove('active');   ledAuto.classList.add('inactive');
            }
        }

        modeToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            isAutoPlay = !isAutoPlay;
            updateModeUI();
            if (isAutoPlay) autoPlayInterval = setInterval(next, 7000);
            else clearInterval(autoPlayInterval);
        });

        /* ── Keyboard ── */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  prev();
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next();
        });

        /* ── Resize / rotate ── */
        let resizeTimer;
        window.addEventListener('resize', () => {
            appHeight();
            clearTimeout(resizeTimer);
            document.body.style.pointerEvents = 'none';
            resizeTimer = setTimeout(() => {
                setActive(activeIndex);
                document.body.style.pointerEvents = '';
            }, 350);
        });

        window.onload = () => {
            appHeight();
            discoverImages();
            acquireWakeLock();
        };

        /* ── Screen Wake Lock — keep display on while browsing ── */
        let wakeLock = null;

        async function acquireWakeLock() {
            if (!('wakeLock' in navigator)) return; // API not supported
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
                // Silently ignore — e.g. battery saver mode
            }
        }

        // Re-acquire after tab becomes visible again (required by the spec)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                acquireWakeLock();
                // If gallery never loaded (e.g. tab was hidden during init), retry
                if (moods.length === 0) discoverImages();
            }
        });
    </script>
</body>
</html>
