    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&amp;family=Inter:wght@300;400;900&amp;display=swap"

    <style>
        :root {
            --app-height: 100svh;
        }

        body {
            margin: 0;
            background: linear-gradient(to top, #2e3233 0%, #2d6878 100%);
            color: #B6AA97;
            font-family: 'Crimson Pro', serif;
            overflow: hidden;
            height: var(--app-height);
            width: 100%;
            max-width: 100%;
            scrollbar-width: none;
            /* Firefox: hide scrollbar, remove gutter */
        }

        body::-webkit-scrollbar {
            display: none;
        }

        .font-sans {
            font-family: 'Inter', sans-serif;
        }

        /* Drifting Cloud Background */
        .cloud-drift {
            position: absolute;
            inset: -20%;
            width: 140%;
            height: 140%;
            background-image: url('/music/images/cloud.png');
            background-size: cover;
            background-position: center;
            opacity: 0.22;
            filter: blur(8px);
            z-index: 1;
            pointer-events: none;
            will-change: transform;
            animation: bounce-drift 60s ease-in-out infinite alternate;
        }

        @keyframes bounce-drift {
            from {
                transform: translateX(-8%) scale(1.1);
            }

            to {
                transform: translateX(8%) scale(1);
            }
        }

        @keyframes subtle-pulse {
            0% {
                transform: scale(1.0);
            }

            100% {
                transform: scale(1.03);
            }
        }

        .funky-title {
            background: linear-gradient(90deg,
                    #ffffff 0%,
                    #00FCFF 25%,
                    #FFD700 50%,
                    #FF00CC 75%,
                    #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: spectral-shift 8s linear infinite;
        }

        @keyframes spectral-shift {
            to {
                background-position: 200% center;
            }
        }

        .vignette {
            position: absolute;
            inset: 0;
            z-index: 25;
            background: radial-gradient(circle, transparent 10%, rgba(33, 68, 77, 0.4) 50%, rgba(46, 50, 51, 0.95) 100%);
            pointer-events: none;
        }

        /* Desktop: add strong side fading on top of the radial vignette */
        @media (min-width: 768px) {
            .vignette {
                background:
                    linear-gradient(to right,
                        rgba(46, 50, 51, 0.92) 0%,
                        rgba(46, 50, 51, 0.4) 12%,
                        transparent 28%,
                        transparent 72%,
                        rgba(46, 50, 51, 0.4) 88%,
                        rgba(46, 50, 51, 0.92) 100%),
                    radial-gradient(circle, transparent 10%, rgba(33, 68, 77, 0.4) 50%, rgba(46, 50, 51, 0.95) 100%);
            }
        }

        .mood-panel {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            /* will-change intentionally omitted — applied by JS only on active panel */
        }

        .mood-panel.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Pulse wrapper — keeps transform off the img itself, preventing Firefox layer drops */
        .mood-fg-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mood-panel.active .mood-fg-wrap {
            animation: subtle-pulse 25s infinite alternate;
        }

        /* Disable pulse on mobile for performance */
        @media (max-width: 767px) {
            .mood-panel.active .mood-fg-wrap {
                animation: none;
            }
        }

        .mood-bg {
            position: absolute;
            inset: -40px;
            width: calc(100% + 80px);
            height: calc(100% + 80px);
            object-fit: cover;
            filter: blur(70px) brightness(0.12) grayscale(85%);
            opacity: 0.4;
            /* will-change omitted — controlled by JS */
        }

        /* Android mobile: lighter blur is fine, iOS gets none (see body.is-ios below) */
        @media (max-width: 767px) {
            .mood-bg {
                filter: blur(30px) brightness(0.12) grayscale(85%);
            }
        }

        /* iOS Safari/WebKit: blurred bg causes GPU memory crash — disable entirely */
        body.is-ios .mood-bg {
            display: none;
        }

        /* 
         * FOREGROUND IMAGE — object-fit: cover with smart sizing:
         * Portrait images on desktop: fill height, crop L/R sides
         * Landscape images on mobile: fill width, crop top/bottom
         * The JS will detect orientation and apply classes accordingly.
         */
        .mood-fg {
            position: relative;
            object-fit: cover;
            box-shadow: 0 0 120px rgba(0, 0, 0, 0.9);
            transition: filter 4s ease-out;
            filter: grayscale(100%) brightness(0.85);
            user-select: none;
            -webkit-user-drag: none;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;

            /* Soft circle edges — on all platforms; iOS gets these stripped below */
            mask-image: radial-gradient(circle, black 25%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle, black 25%, transparent 90%);
        }

        /* Desktop only: translate3d promotes image to GPU layer for smooth transitions */
        @media (min-width: 768px) {
            .mood-fg {
                transform: translate3d(0, 0, 0);
            }
        }

        /* iOS only: drop mask-image — it's GPU-composited and crashes iOS WebKit */
        body.is-ios .mood-fg {
            mask-image: none;
            -webkit-mask-image: none;
        }

        /* Android mobile: mask-image kept above (same gradient applies) */

        /* Desktop default: let the image size naturally, then override for portrait */
        .mood-fg {
            max-width: 90vw;
            max-height: 85vh;
            width: auto;
            height: auto;
        }

        /* Desktop: fill full available space */
        @media (min-width: 768px) {
            .mood-fg {
                max-width: 100%;
                max-height: var(--app-height);
            }
        }

        /* Portrait photo: fill height, let width crop */
        .mood-fg.is-portrait {
            width: auto;
            height: 85vh;
            max-width: none;
            max-height: 85vh;
        }

        /* Android mobile: portrait fills full screen top-to-bottom */
        @media (max-width: 767px) {
            body:not(.is-ios) .mood-fg.is-portrait {
                height: var(--app-height);
                max-height: var(--app-height);
            }
        }

        @media (min-width: 768px) {
            .mood-fg.is-portrait {
                height: var(--app-height);
                max-height: var(--app-height);
            }
        }

        /* Landscape photo on mobile */
        @media (max-width: 767px) {
            body.is-ios .mood-fg.is-landscape {
                /* iOS: modest letterbox — safe for GPU memory */
                width: 100%;
                height: 70vh;
                max-width: none;
                max-height: none;
            }

            body:not(.is-ios) .mood-fg.is-landscape {
                /* Android (index0 approach): fill full width, height follows naturally.
                   On a portrait phone this centres the landscape image and fills edge-to-edge. */
                width: 100vw;
                height: auto;
                max-width: none;
                max-height: none;
            }
        }

        /* Landscape Orientation Optimization (mobile rotated) */
        @media (orientation: landscape) and (max-height: 500px) {
            .mood-fg {
                max-height: var(--app-height);
                mask-image: none;
                -webkit-mask-image: none;
            }

            nav {
                padding: 1rem !important;
            }

            h1 {
                font-size: 1.5rem !important;
            }

            .nav-ui {
                display: none !important;
            }
        }

        @media (min-width: 768px) {
            .mood-fg:not(.is-portrait) {
                max-width: 85vw;
                max-height: 80vh;
            }
        }

        .mood-panel.active .mood-fg {
            filter: grayscale(0%) brightness(1);
        }

        /* Progress Dots / Lines */
        .progress-line {
            height: 30px;
            width: 1px;
            border-left: 12px solid transparent;
            /* Wider tap target */
            border-right: 12px solid transparent;
            /* Wider tap target */
            background-clip: padding-box;
            background-color: rgba(255, 255, 255, 0.08);
            transition: all 0.7s ease;
            position: relative;
            cursor: pointer;
            pointer-events: auto;
        }

        .progress-line.active {
            background-color: white;
            transform: scaleY(1.8);
        }

        .progress-label {
            position: absolute;
            right: -24px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            font-size: 7px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.1em;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.7s ease;
            pointer-events: none;
        }

        .progress-line.active .progress-label {
            opacity: 1;
        }

        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: rgba(255, 255, 255, 0.06);
            z-index: 30;
            pointer-events: none;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: linear-gradient(to top, #2e3233 0%, #2d6878 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1.5s ease;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ── Side Arrow Navigation (desktop) ── */
        .side-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 40;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0.25;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: auto;
            color: white;
        }

        .side-arrow:hover {
            opacity: 0.9;
        }

        .side-arrow.left {
            left: 20px;
        }

        .side-arrow.right {
            right: 20px;
        }

        /* Hide side arrows on mobile (touch zones handle it) */
        @media (max-width: 767px) {
            .side-arrow {
                display: none;
            }
        }

        /* ── Mobile Touch Zones ── */
        .touch-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 35;
            pointer-events: none;
            /* Let events pass through to the stage controller */
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .touch-zone.left {
            left: 0;
        }

        .touch-zone.right {
            right: 0;
        }

        /* Only show on mobile */
        @media (min-width: 768px) {
            .touch-zone {
                display: none;
            }
        }

        /* ── Manual / Auto toggle — top-right ── */
        /* position/top/left are set entirely by JS (placeModeToggle).
           CSS only owns the visual appearance. */
        #modeToggle {
            position: fixed;
            /* out of flow; coordinates set by JS */
            top: 20px;
            /* JS overrides this immediately on load */
            left: auto;
            right: 20px;
            /* fallback if JS hasn't run yet */
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            pointer-events: auto;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 18px;
            box-sizing: border-box;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        @media (max-width: 767px) {

            /* Only non-position styles for mobile — JS handles placement */
            #modeToggle {
                padding: 8px 12px 8px 14px;
                gap: 4px;
                border-radius: 14px 0 0 14px;
            }

            #copyright {
                bottom: 16px;
                left: 16px;
            }
        }

        #modeToggle:hover {
            background: rgba(0, 0, 0, 0.6);
            transform: translateY(-1px);
        }

        .mode-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-label {
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .mode-led {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .mode-led.active {
            background-color: #4ade80;
            /* green-400 */
            box-shadow: 0 0 6px #4ade80, 0 0 12px rgba(74, 222, 128, 0.5);
        }

        .mode-led.inactive {
            background-color: rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }

        /* manual row */
        #rowManual .mode-label {
            color: rgba(255, 255, 255, 0.45);
        }

        #rowManual.is-active .mode-label {
            color: rgba(255, 255, 255, 0.85);
        }

        /* auto row */
        #rowAuto .mode-label {
            color: rgba(255, 255, 255, 0.25);
        }

        #rowAuto.is-active .mode-label {
            color: rgba(255, 255, 255, 0.85);
        }

        /* ── Copyright footer bottom-left ── */
        #copyright {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 60;
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            pointer-events: none;
            user-select: none;
        }

        #copyright a {
            pointer-events: all;
            color: rgba(0, 255, 255, 0.45);
            text-decoration: none;
            transition: color 0.2s;
        }

        #copyright a:hover {
            color: rgba(127, 255, 255, 0.85);
        }
    </style>

    <main id="mainContent" class="w-full relative overflow-hidden"
        style="touch-action: none; height: var(--app-height);">
        <!-- Edge Blur Overlays -->
        <div class="vignette"></div>
        <!-- Progress Indicator -->
        <div id="progressContainer"
            class="absolute left-4 md:left-12 top-1/2 -translate-y-1/2 flex flex-col gap-5 z-40 max-h-[50vh] overflow-y-auto no-scrollbar py-6 px-2 opacity-40 md:opacity-100 hover:opacity-100 transition-opacity">

    <script>
        // Detect mobile early — used throughout to gate memory-heavy features
        const isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        // iOS WebKit has strict GPU memory limits that crash the tab — Android Chrome does not
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isIOS) document.body.classList.add('is-ios');

        const config = {
            folderPath: 'images/',
            extension: '.jpg',
            maxSearch: 114,
            padding: 3
        };

        let moods = [];
        let activeIndex = 0;
        let isAutoPlay = false;
        let autoPlayInterval;
        let isScanning = false;

        const progressContainer = document.getElementById('progressContainer');
        const stage = document.getElementById('stage');
        const modeToggle = document.getElementById('modeToggle');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const rowManual = document.getElementById('rowManual');
        const rowAuto = document.getElementById('rowAuto');
        const ledManual = document.getElementById('ledManual');
        const ledAuto = document.getElementById('ledAuto');

        // Input handling
        let startX = 0, startY = 0;
        let isMouseDown = false;

        // No-op on modern browsers (svh handles it); kept for legacy fallback
        const appHeight = () => { };

        /* ── Image orientation detection ── */
        function classifyImage(imgEl) {
            // naturalWidth/Height available after load
            const w = imgEl.naturalWidth;
            const h = imgEl.naturalHeight;
            if (!w || !h) return;
            if (h > w) {
                imgEl.classList.add('is-portrait');
                imgEl.classList.remove('is-landscape');
            } else {
                imgEl.classList.add('is-landscape');
                imgEl.classList.remove('is-portrait');
            }
        }

        async function discoverImages() {
            if (isScanning || moods.length > 0) return;
            isScanning = true;

            const results = [];
            for (let i = 1; i <= config.maxSearch; i++) {
                const paddedId = i.toString().padStart(config.padding, '0');
                results.push({
                    id: paddedId,
                    url: `${config.folderPath}${paddedId}${config.extension}`,
                    index: i
                });
            }

            moods = results;

            // Build gallery in chunks
            const CHUNK_SIZE = 15;
            for (let i = 0; i < moods.length; i += CHUNK_SIZE) {
                renderChunk(i, Math.min(i + CHUNK_SIZE, moods.length));
                loaderText.innerText = `Assembling... ${Math.round((i / moods.length) * 100)}%`;
                await new Promise(r => setTimeout(r, 16));
            }

            setActive(0);
            hideLoader();
            isScanning = false;
        }

        function hideLoader() {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 1500);
        }

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                const timeout = setTimeout(() => {
                    img.src = "";
                    resolve(false);
                }, 1500);

                img.onload = () => {
                    clearTimeout(timeout);
                    resolve(true);
                };
                img.onerror = () => {
                    clearTimeout(timeout);
                    resolve(false);
                };
                img.src = url;
            });
        }

        function renderChunk(start, end) {
            for (let index = start; index < end; index++) {
                const mood = moods[index];

                // Progress line
                const line = document.createElement('button');
                line.className = `progress-line flex-shrink-0 ${index === 0 ? 'active' : ''}`;
                line.innerHTML = `<span class="progress-label font-sans">${mood.id}</span>`;
                line.onclick = (e) => { e.stopPropagation(); setActive(index); };
                progressContainer.appendChild(line);

                // Panel
                const panel = document.createElement('div');
                panel.className = `mood-panel ${index === 0 ? 'active' : ''}`;
                panel.dataset.url = mood.url;

                // On iOS skip the bg element entirely — blurred bg crashes iOS WebKit
                // Android handles it fine with reduced blur (handled in CSS)
                if (!isIOS) {
                    const bgImg = document.createElement('img');
                    bgImg.alt = '';
                    bgImg.className = 'mood-bg';
                    panel.appendChild(bgImg);
                }

                const fgWrap = document.createElement('div');
                fgWrap.className = 'mood-fg-wrap';

                const fgImg = document.createElement('img');
                fgImg.alt = '';
                fgImg.className = 'mood-fg';

                fgImg.onerror = function () {
                    // Only hide if we genuinely tried to load this image (not an unload clear)
                    if (!this.src || this.src === window.location.href) return;
                    panel.dataset.broken = '1';
                    panel.style.display = 'none';
                    const dot = progressContainer.querySelectorAll('.progress-line')[index];
                    if (dot) dot.style.display = 'none';
                };

                fgImg.onload = () => classifyImage(fgImg);

                fgWrap.appendChild(fgImg);
                panel.appendChild(fgWrap);
                stage.appendChild(panel);
            }
        }

        // Circular distance so wrap-around (114 → 001) stays within range
        function circDist(a, b, len) {
            const d = Math.abs(a - b);
            return Math.min(d, len - d);
        }

        // Load images for a window around the active index
        // iOS/Android: only keep the active image in memory — phones have hard memory limits
        const PRELOAD = isMobileDevice ? 0 : 2;  // mobile: active only; desktop: 5 panels
        const UNLOAD_DIST = isMobileDevice ? 1 : 4;

        function loadNearby(index) {
            const panels = document.querySelectorAll('.mood-panel');
            const total = panels.length;
            panels.forEach((panel, i) => {
                if (panel.dataset.broken === '1') return; // skip confirmed 404s
                const bg = panel.querySelector('.mood-bg');
                const fg = panel.querySelector('.mood-fg');
                const url = panel.dataset.url;
                const dist = circDist(i, index, total);
                const isActive = (i === index);

                // Manage GPU layer only for the active panel
                panel.style.willChange = isActive ? 'opacity' : 'auto';

                if (dist <= PRELOAD) {
                    // Load if not already loaded
                    if (panel.dataset.loaded !== '1') {
                        if (bg) bg.src = url;
                        if (fg) fg.src = url;
                        panel.dataset.loaded = '1';
                    }
                } else if (dist > UNLOAD_DIST) {
                    // Unload distant images to free memory
                    if (panel.dataset.loaded === '1') {
                        if (bg) bg.src = '';
                        if (fg) fg.src = '';
                        panel.dataset.loaded = '0';
                    }
                }
            });
        }

        function setActive(index) {
            activeIndex = index;
            document.querySelectorAll('.progress-line').forEach((l, i) => l.classList.toggle('active', i === activeIndex));
            document.querySelectorAll('.mood-panel').forEach((p, i) => p.classList.toggle('active', i === activeIndex));
            loadNearby(index);

            const activeLine = document.querySelectorAll('.progress-line')[index];
            if (activeLine) {
                requestAnimationFrame(() => {
                    activeLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                });
            }
        }

        function next() { setActive((activeIndex + 1) % moods.length); }
        function prev() { setActive((activeIndex - 1 + moods.length) % moods.length); }

        /* ── Side Arrow Navigation (desktop) ── */
        document.getElementById('nextBtn').addEventListener('click', (e) => { e.stopPropagation(); next(); });
        document.getElementById('prevBtn').addEventListener('click', (e) => { e.stopPropagation(); prev(); });

        /* ── Unified Input Controller ── */
        // Touch and mouse are handled in completely separate paths.
        // Touch path calls e.preventDefault() on touchend to suppress
        // the synthetic mouse/click events Android fires after touch.

        let hasTouchMoved = false;

        stage.addEventListener('touchstart', e => {
            startX = e.changedTouches[0].clientX;
            startY = e.changedTouches[0].clientY;
            hasTouchMoved = false;
        }, { passive: true });

        stage.addEventListener('touchmove', e => {
            hasTouchMoved = true;
        }, { passive: true });

        stage.addEventListener('touchend', e => {
            // Suppress the ghost click/mouseup Android fires after touch
            e.preventDefault();

            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;

            if (hasTouchMoved) {
                // Swipe: honour whichever axis moved more
                if (Math.abs(dx) >= Math.abs(dy)) {
                    if (Math.abs(dx) > 30) { dx < 0 ? next() : prev(); }
                } else {
                    if (Math.abs(dy) > 40) { dy < 0 ? next() : prev(); }
                }
            } else {
                // Tap: left half = prev, right half = next
                e.changedTouches[0].clientX > window.innerWidth / 2 ? next() : prev();
            }
        }, { passive: false });

        // Mouse-only path (desktop) — only fires when no touch device is involved
        stage.addEventListener('mousedown', e => {
            isMouseDown = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        stage.addEventListener('mouseup', e => {
            if (!isMouseDown) return;
            isMouseDown = false;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                // Drag/swipe
                if (Math.abs(dx) >= Math.abs(dy)) {
                    if (Math.abs(dx) > 30) { dx < 0 ? next() : prev(); }
                } else {
                    if (Math.abs(dy) > 40) { dy < 0 ? next() : prev(); }
                }
            } else {
                // Click
                e.clientX > window.innerWidth / 2 ? next() : prev();
            }
        });

        /* ── Mode toggle ── */
        function updateModeUI() {
            if (isAutoPlay) {
                rowManual.classList.remove('is-active');
                rowAuto.classList.add('is-active');
                ledManual.classList.remove('active'); ledManual.classList.add('inactive');
                ledAuto.classList.add('active'); ledAuto.classList.remove('inactive');
            } else {
                rowManual.classList.add('is-active');
                rowAuto.classList.remove('is-active');
                ledManual.classList.add('active'); ledManual.classList.remove('inactive');
                ledAuto.classList.remove('active'); ledAuto.classList.add('inactive');
            }
        }

        modeToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            isAutoPlay = !isAutoPlay;
            updateModeUI();
            if (isAutoPlay) autoPlayInterval = setInterval(next, 7000);
            else clearInterval(autoPlayInterval);
        });

        /* ── Keyboard ── */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') prev();
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next();
        });

        /* ── Toggle placement — uses VisualViewport for reliable cross-browser positioning ──
         *  Avoids ALL position:fixed + right quirks on Firefox/Android by calculating
         *  left in real pixels from the actual visible viewport width.
         */
        function placeModeToggle() {
            const vv = window.visualViewport;
            const vw = vv ? vv.width : window.innerWidth;
            const vt = vv ? vv.offsetTop : 0;
            const isMobile = vw < 768;
            const gap = isMobile ? 0 : 20;
            const elW = modeToggle.offsetWidth;
            // left = visible right edge − element width − right gap
            modeToggle.style.right = 'auto';
            modeToggle.style.left = Math.max(0, Math.round(vw - elW - gap)) + 'px';
            modeToggle.style.top = Math.round(vt + (isMobile ? 16 : 20)) + 'px';
        }

        /* ── Resize / rotate ── */
        let resizeTimer;
        window.addEventListener('resize', () => {
            appHeight();
            placeModeToggle();
            clearTimeout(resizeTimer);
            document.body.style.pointerEvents = 'none';
            resizeTimer = setTimeout(() => {
                setActive(activeIndex);
                document.body.style.pointerEvents = '';
            }, 350);
        });

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', placeModeToggle);
            window.visualViewport.addEventListener('scroll', placeModeToggle);
        }

        window.onload = () => {
            appHeight();
            placeModeToggle();
            discoverImages();
            acquireWakeLock();
        };

        /* ── Screen Wake Lock — keep display on while browsing ── */
        let wakeLock = null;

        async function acquireWakeLock() {
            if (!('wakeLock' in navigator)) return; // API not supported
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
                // Silently ignore — e.g. battery saver mode
            }
        }

        // Re-acquire after tab becomes visible again (required by the spec)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                acquireWakeLock();
                // If gallery never loaded (e.g. tab was hidden during init), retry
                if (moods.length === 0) discoverImages();
            }
        });
    </script>
</body>

</html>
