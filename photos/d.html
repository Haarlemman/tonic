<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; color: #eee; font-family: monospace; font-size: 13px; padding: 16px; }
h2 { color: #0ff; margin-bottom: 12px; font-size: 15px; }
.row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #333; }
.label { color: #aaa; }
.val { color: #fff; font-weight: bold; }
.fixed-tl { position: fixed; top: 12px; right: 12px; background: red; color: white; padding: 6px 10px; font-size: 11px; border-radius: 6px; }
.fixed-bl { position: fixed; bottom: 12px; left: 12px; background: blue; color: white; padding: 6px 10px; font-size: 11px; border-radius: 6px; }
.svh-box { height: 100svh; width: 8px; background: #0f0; position: fixed; top: 0; right: 0; opacity: 0.5; }
.dvh-box { height: 100dvh; width: 8px; background: #ff0; position: fixed; top: 0; right: 10px; opacity: 0.5; }
.vh-box  { height: 100vh;  width: 8px; background: #f0f; position: fixed; top: 0; right: 20px; opacity: 0.5; }
</style>
</head>
<body>
<h2>Viewport Diagnostic</h2>
<div id="out"></div>

<!-- Fixed position test elements -->
<div class="fixed-tl">TOP RIGHT fixed</div>
<div class="fixed-bl">BOTTOM LEFT fixed</div>

<!-- Height comparison bars (right edge): green=svh, yellow=dvh, pink=vh -->
<div class="svh-box" title="100svh"></div>
<div class="dvh-box" title="100dvh"></div>
<div class="vh-box"  title="100vh"></div>

<script>
function px(el, prop) {
    return getComputedStyle(el).getPropertyValue(prop);
}

function measure() {
    const rows = [
        ['window.innerWidth',  window.innerWidth],
        ['window.innerHeight', window.innerHeight],
        ['screen.width',       screen.width],
        ['screen.height',      screen.height],
        ['documentElement.clientWidth',  document.documentElement.clientWidth],
        ['documentElement.clientHeight', document.documentElement.clientHeight],
        ['devicePixelRatio',   window.devicePixelRatio],
        ['userAgent', navigator.userAgent],
    ];

    // Measure svh/dvh/vh via a test element
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;';
    document.body.appendChild(probe);

    probe.style.height = '100svh';
    const svh = probe.offsetHeight;
    probe.style.height = '100dvh';
    const dvh = probe.offsetHeight;
    probe.style.height = '100vh';
    const vh = probe.offsetHeight;
    document.body.removeChild(probe);

    rows.push(['100svh (px)', svh]);
    rows.push(['100dvh (px)', dvh]);
    rows.push(['100vh  (px)', vh]);
    rows.push(['safe-area-inset-top', getComputedStyle(document.documentElement).getPropertyValue('--sat') || 'n/a']);

    // env() probe
    const envProbe = document.createElement('div');
    envProbe.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0px);left:0;width:1px;height:1px;visibility:hidden;';
    document.body.appendChild(envProbe);
    rows.push(['env(safe-area-inset-top)', envProbe.getBoundingClientRect().top + 'px']);
    document.body.removeChild(envProbe);

    const out = document.getElementById('out');
    out.innerHTML = rows.map(([l, v]) =>
        `<div class="row"><span class="label">${l}</span><span class="val">${v}</span></div>`
    ).join('');
}

measure();
window.addEventListener('resize', measure);
</script>
</body>
</html>
