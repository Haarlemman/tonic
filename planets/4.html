<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        canvas { display: block; }
        #tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px;
            border-radius: 5px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="solarSystemCanvas"></canvas>
    <div id="tooltip"></div>
    <div id="controls">
        <button id="pauseButton">Pause</button>
        <input type="range" id="speedSlider" min="0" max="25" step="0.1" value="1">
        <label for="speedSlider">Speed: <span id="speedValue">1x</span></label>
    </div>

    <script>
        const canvas = document.getElementById('solarSystemCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const tooltip = document.getElementById('tooltip');
        const pauseButton = document.getElementById('pauseButton');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');

        let isPaused = false;
        let speedMultiplier = 1;
        let animationId;

        const sun = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 50,
            color: 'yellow',
        };

	function scalePlanets() {
        const isMobile = window.innerWidth < 768;
        const minDimension = Math.min(canvas.width, canvas.height);
        const baseScale = isMobile ? 0.7 : 1.0;
        
        sun.radius = minDimension * 0.07;
        
        planets.forEach(planet => {
            const originalRadius = planet.radius;
            const originalDistance = planet.distance;
            
            planet.distance = originalDistance * baseScale;
            planet.radius = originalRadius * (isMobile ? 0.85 : 1);

    planet.moons.forEach(moon => {
        moon.angle += moon.speed * speedMultiplier;
        moon.x = planet.x + Math.cos(moon.angle) * moon.distance;
        moon.y = planet.y + Math.sin(moon.angle) * moon.distance;

        if (moon.image) {
            const img = new Image();
            img.src = moon.image;
            ctx.drawImage(img, moon.x - moon.radius, moon.y - moon.radius, moon.radius * 2, moon.radius * 2);
        } else {
            ctx.beginPath();
            ctx.arc(moon.x, moon.y, moon.radius, 0, Math.PI * 2);
            ctx.fillStyle = moon.color;
            ctx.fill();
        }
    });
}

        });
    }
		
    function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            scalePlanets();
        }

  
		
		
				
    function updateSunPosition() {
            sun.x = canvas.width / 2;
            sun.y = canvas.height / 2;
        }


        function showTooltip(e, content) {
            tooltip.innerText = content;
            tooltip.style.opacity = 1;
            tooltip.style.left = `${e.clientX + 10}px`;
            tooltip.style.top = `${e.clientY + 10}px`;
        }

		
		
		
        function hideTooltip() {
            tooltip.style.opacity = 0;
        }
		
		
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }


        let imagesLoaded = 0;
        const hoverDetails = { planet: null, moon: null };

			function startAnimation() {
    let lastTime = performance.now();

    function animate(currentTime) {
        requestAnimationFrame(animate);

        if (!isPaused) {
            const deltaTime = (currentTime - lastTime) * 0.001;
            lastTime = currentTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updateSunPosition();

            planets.forEach((planet, index) => {
                planet.angle += planet.speed * speedMultiplier * deltaTime;
                planet.x = sun.x + Math.cos(planet.angle) * planet.distance;
                planet.y = sun.y + Math.sin(planet.angle) * planet.distance;

                let radius = planet.radius;
                if (index >= 4) {
                    radius *= 2;
                }

                if (planet.img && planet.img.complete) {
                    ctx.save();
                    ctx.translate(planet.x, planet.y);
                    ctx.rotate(planet.spinAngle);
                    ctx.drawImage(planet.img, -radius, -radius, radius * 2, radius * 2);
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.arc(planet.x, planet.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = planet.color;
                    ctx.fill();
                }
                planet.spinAngle += planet.spinSpeed * speedMultiplier * deltaTime;

                if (planet.moons) {
                    planet.moons.forEach(moon => {
                        moon.angle += moon.speed * speedMultiplier * deltaTime;
                        moon.x = planet.x + Math.cos(moon.angle) * moon.distance;
                        moon.y = planet.y + Math.sin(moon.angle) * moon.distance;

                        if (moon.img && moon.img.complete) {
                            ctx.drawImage(moon.img, moon.x - moon.radius, moon.y - moon.radius, moon.radius * 2, moon.radius * 2);
                        } else {
                            ctx.beginPath();
                            ctx.arc(moon.x, moon.y, moon.radius, 0, Math.PI * 2);
                            ctx.fillStyle = moon.color;
                            ctx.fill();
                        }
                    });
                }
            });
        } else {
            lastTime = currentTime;
        }
    }

    requestAnimationFrame(animate);
}	
					
					
					
					
		
        function countMoons() {
            let moonCount = 0;
            planets.forEach(planet => {
                if (planet.moons) {
                    moonCount += planet.moons.length;
                }
            });
            return moonCount;
        }

        planets.forEach(planet => {
            planet.spinAngle = Math.random() * Math.PI * 2;
            planet.angle = Math.random() * Math.PI * 2;

            planet.x = sun.x + Math.cos(planet.angle) * planet.distance;
            planet.y = sun.y + Math.sin(planet.angle) * planet.distance;

            if (planet.moons) {
                planet.moons.forEach(moon => {
                    moon.angle = Math.random() * Math.PI * 2;
                    moon.x = planet.x + Math.cos(moon.angle) * moon.distance;
                    moon.y = planet.y + Math.sin(moon.angle) * moon.distance;

                    if (moon.image) {
                        moon.img = new Image();
                        moon.img.src = moon.image;
                        moon.img.onload = () => {
                            imagesLoaded++;
                            if (imagesLoaded === planets.length + countMoons()) {
                                startAnimation();
                            }
                        };
                        moon.img.onerror = () => {
                            console.error("Error loading image:", moon.image);
                            moon.img = null;
                            imagesLoaded++;
                            if (imagesLoaded === planets.length + countMoons()) {
                                startAnimation();
                            }
                        };
                    } else {
                        moon.img = null;
                        imagesLoaded++;
                        if (imagesLoaded === planets.length + countMoons()) {
                            startAnimation();
                        }
                    }
                });
            }

            if (planet.image) {
                planet.img = new Image();
                planet.img.src = planet.image;
                planet.img.onload = () => {
                    imagesLoaded++;
                    if (imagesLoaded === planets.length + countMoons()) {
                        startAnimation();
                    }
                };
                planet.img.onerror = () => {
                    console.error("Error loading image:", planet.image);
                    planet.img = null;
                    imagesLoaded++;
                    if (imagesLoaded === planets.length + countMoons()) {
                        startAnimation();
                    }
                };
            } else {
                planet.img = null;
                imagesLoaded++;
                if (imagesLoaded === planets.length + countMoons()) {
                    startAnimation();
                }
            }
        });

        function checkHover(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            hoverDetails.planet = null;
            hoverDetails.moon = null;

            planets.forEach(planet => {
                const distanceToPlanet = Math.hypot(planet.x - mouseX, planet.y - mouseY);
                if (distanceToPlanet < planet.radius + 10) {
                    hoverDetails.planet = planet.name;
                }

                if (planet.moons) {
                    planet.moons.forEach(moon => {
                        const distanceToMoon = Math.hypot(moon.x - mouseX, moon.y - mouseY);
                        if (distanceToMoon < moon.radius + 10) {
                            hoverDetails.moon = moon.name;
                        }
                    });
                }
            });
        }


        function updateTooltip(e) {
            if (hoverDetails.planet) {
                showTooltip(e, hoverDetails.planet);
            } else if (hoverDetails.moon) {
                showTooltip(e, hoverDetails.moon);
            } else {
                hideTooltip();
            }
        }


        canvas.addEventListener('mousemove', throttle((e) => {
            checkHover(e);
            updateTooltip(e);
        }, 50));

        canvas.addEventListener('mouseout', hideTooltip);

        pauseButton.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseButton.textContent = isPaused ? 'Resume' : 'Pause';
        });

        speedSlider.addEventListener('input', () => {
            speedMultiplier = parseFloat(speedSlider.value);
            speedValue.textContent = speedMultiplier.toFixed(1) + 'x';
        });

    </script>
</body>
</html>
