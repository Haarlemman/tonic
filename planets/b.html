<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #181e21;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="solarSystemCanvas"></canvas>
  <script>
    const canvas = document.getElementById('solarSystemCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const sun = { x: canvas.width / 2, y: canvas.height / 2, radius: 40 };

    const planets = [
      { name: 'Mercury', distance: 100, speed: 0.02, radius: 4, color: 'gray', angle: 0 },
      { name: 'Venus', distance: 150, speed: 0.015, radius: 8, color: 'orange', angle: 0 },
      { name: 'Earth', distance: 200, speed: 0.01, radius: 8, color: 'green', angle: 0 },
      { name: 'Mars', distance: 250, speed: 0.008, radius: 7, color: 'red', angle: 0 },
      { name: 'Jupiter', distance: 300, speed: 0.005, radius: 25, color: '#9b8762', angle: 0 },
      { name: 'Saturn', distance: 350, speed: 0.003, radius: 18, color: '#c8a572', angle: 0 },
      { name: 'Uranus', distance: 400, speed: 0.008, radius: 20, color: '#9ab2be', angle: 0 },
      { name: 'Neptune', distance: 450, speed: 0.009, radius: 18, color: 'blue', angle: 0 }
    ];

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear the canvas each frame

      // Draw Sun
      ctx.beginPath();
      ctx.arc(sun.x, sun.y, sun.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'yellow';
      ctx.fill();

      planets.forEach(planet => {
        planet.angle += planet.speed; // Update planet angle based on its speed
        const x = sun.x + Math.cos(planet.angle) * planet.distance;
        const y = sun.y + Math.sin(planet.angle) * planet.distance;

        // Draw planet
        ctx.beginPath();
        ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
        ctx.fillStyle = planet.color;
        ctx.fill();

        // Draw meridians for side view rotation
        const meridianCount = 6;  // Number of meridians
        const rotationSpeed = 0.02; // Rotation speed for meridians
        const angleOffset = planet.angle;

        // Calculate the positions of meridians for a side view
        for (let i = 0; i < meridianCount; i++) {
          const meridianAngle = (Math.PI * 2 / meridianCount) * i + angleOffset;

          // Horizontal offset to simulate rotation around vertical axis
          const xStart = x + Math.cos(meridianAngle) * planet.radius;
          const yStart = y + Math.sin(meridianAngle) * planet.radius;
          const xEnd = x + Math.cos(meridianAngle + Math.PI) * planet.radius;
          const yEnd = y + Math.sin(meridianAngle + Math.PI) * planet.radius;

          // Draw the meridians as if rotating in a side view
          ctx.beginPath();
          ctx.moveTo(xStart, yStart);
          ctx.lineTo(xEnd, yEnd);
          ctx.strokeStyle = 'rgba(255,255,255,0.3)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      });

      requestAnimationFrame(animate); // Continuously call animate function
    }

    animate(); // Start the animation loop
  </script>
</body>
</html>
