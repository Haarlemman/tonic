<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Machina // Balanced</title>
    
    <!-- React & ReactDOM (Global CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* Strict Reset */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #F1F0EA;
            font-family: 'Inter', sans-serif;
        }
        #root { 
            width: 100%; 
            height: 100%; 
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .tabular-nums { font-variant-numeric: tabular-nums; }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 80px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #2C3E50;
            cursor: pointer;
            margin-top: -5px; 
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 1px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- Error catching script -->
    <div id="error-display" style="display:none; padding: 20px; color: red; font-family: monospace;"></div>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('error-display').style.display = 'block';
            document.getElementById('error-display').innerHTML = "SYSTEM ERROR: " + message;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- DATA ---
        // Added 'mix' property to balance loudness. 
        // Square/Saw waves are naturally louder than Sine, so we reduce them.
        const ERAS = [
            {
                title: "LOGIC GATES",
                desc: "Rules are absolute. Binary switch.",
                color: "#E63946", 
                mode: "binary",
                wave: "square",
                freq: 110,
                mix: 0.03 // Very quiet because square waves are harsh
            },
            {
                title: "EXPERT SYSTEMS",
                desc: "Rigid maps of human knowledge.",
                color: "#457B9D",
                mode: "tree",
                wave: "sawtooth",
                freq: 164.81,
                mix: 0.03 // Also harsh, keep low
            },
            {
                title: "DEEP LEARNING",
                desc: "Layers of math finding patterns.",
                color: "#1D3557",
                mode: "network",
                wave: "sine", 
                freq: 75, // Bumped from 55 to 75Hz so small speakers can hear it
                mix: 0.4 // Much louder because sine waves are quiet
            },
            {
                title: "GENERATIVE FLUX",
                desc: "Dreaming machines. Improvisation.",
                color: "#E9C46A",
                mode: "fluid",
                wave: "triangle",
                freq: 130.81,
                mix: 0.15
            },
            {
                title: "SINGULARITY",
                desc: "Symbiosis. The boundary dissolves.",
                color: "#7209B7",
                mode: "quantum",
                wave: "sine",
                freq: 440,
                mix: 0.15
            }
        ];

        // 25 Seconds Total Loop
        const TOTAL_LOOP_TIME = 25000; 
        const START_YEAR = 1950;
        const END_YEAR = 2050;

        // --- ICONS ---
        const Maximize = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        );
        
        const Volume2 = ({ size = 18 }) => (
             <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        );

        const VolumeX = ({ size = 18 }) => (
             <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        );

        // --- AUDIO ENGINE ---
        const createAudioEngine = () => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const masterGain = ctx.createGain();
            masterGain.gain.value = 0.5; // Start at 50%
            masterGain.connect(ctx.destination);
            
            // Drone Oscillator (Background Hum)
            const osc = ctx.createOscillator();
            const oscGain = ctx.createGain();
            osc.connect(oscGain);
            oscGain.connect(masterGain);
            osc.start();
            
            // Ticker (Percussive clicks)
            const playTick = () => {
                const tickOsc = ctx.createOscillator();
                const tickGain = ctx.createGain();
                tickOsc.type = 'square';
                tickOsc.frequency.value = 800; 
                
                tickGain.gain.setValueAtTime(0.05, ctx.currentTime);
                tickGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                
                tickOsc.connect(tickGain);
                tickGain.connect(masterGain);
                
                tickOsc.start();
                tickOsc.stop(ctx.currentTime + 0.1);
            };

            return { ctx, masterGain, osc, oscGain, playTick };
        };

        // --- DRAWING HELPER ---
        const drawEraLayer = (ctx, mode, mainColor, particles, width, height, time, alpha, autoChaos) => {
            if (alpha <= 0) return;
            
            ctx.globalAlpha = alpha;

            particles.forEach((p, i) => {
                if (mode === 'binary') {
                    const jitter = autoChaos * 5; 
                    let px = p.x + (Math.random() - 0.5) * jitter;
                    let py = p.y + (Math.random() - 0.5) * jitter;
                    const gridSize = 80; 
                    const drawX = Math.round((px / 100) * width / gridSize) * gridSize;
                    const drawY = Math.round((py / 100) * height / gridSize) * gridSize;
                    ctx.fillStyle = p.state ? mainColor : '#2C3E50';
                    ctx.fillRect(drawX, drawY, 40, 40);
                } 
                else if (mode === 'tree') {
                    let px = p.x + Math.sin(time * 0.001 + i) * (0.1 + autoChaos);
                    const drawX = (px / 100) * width; 
                    const drawY = (p.y / 100) * height; 
                    
                    ctx.strokeStyle = mainColor; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(drawX, drawY);
                    ctx.lineTo(drawX - 25, drawY - 35); ctx.moveTo(drawX, drawY);
                    ctx.lineTo(drawX + 25, drawY - 35); ctx.stroke();
                }
                else if (mode === 'network') {
                    const drawX = (p.x / 100) * width; 
                    const drawY = (p.y / 100) * height;
                    const connectDist = 20 + (autoChaos * 40); 
                    
                    particles.forEach((p2, j) => {
                        if (i === j) return;
                        const dx = p.x - p2.x; const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < connectDist) {
                            ctx.strokeStyle = `rgba(29, 53, 87, ${1 - dist/connectDist})`;
                            ctx.lineWidth = 2; 
                            ctx.beginPath(); ctx.moveTo(drawX, drawY);
                            ctx.lineTo((p2.x / 100) * width, (p2.y / 100) * height); ctx.stroke();
                        }
                    });
                    ctx.fillStyle = mainColor; ctx.beginPath(); ctx.arc(drawX, drawY, p.size, 0, Math.PI * 2); ctx.fill();
                }
                else if (mode === 'fluid') {
                    const safeWidth = width - 60; 
                    const drawX = (p.x / 100) * safeWidth + 30; 
                    const drawY = (p.y / 100) * height;
                    
                    ctx.fillStyle = mainColor; 
                    ctx.font = `bold ${p.size * (3 + autoChaos * 2)}px monospace`;
                    const char = String.fromCharCode(65 + (i % 26)); 
                    ctx.fillText(char, drawX, drawY);
                }
                else if (mode === 'quantum') {
                    const cx = width / 2; const cy = height / 2;
                    let angle = p.angle + 0.01 + (autoChaos * 0.05);
                    const breathing = Math.sin(time * 0.002) * 100;
                    const r = (p.radius * (5 + autoChaos * 5)) + breathing;
                    
                    let drawX = cx + Math.cos(angle + i) * r; 
                    let drawY = cy + Math.sin(angle + i) * r;
                    
                    if (autoChaos > 0.8 && Math.random() < 0.1) {
                         drawX = Math.random() * width; drawY = Math.random() * height;
                    }

                    ctx.strokeStyle = `rgba(114, 9, 183, ${0.2})`; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(drawX, drawY); ctx.stroke();
                    ctx.fillStyle = mainColor; ctx.beginPath(); ctx.arc(drawX, drawY, p.size * 1.5, 0, Math.PI*2); ctx.fill();
                }
            });
            
            ctx.globalAlpha = 1.0; 
        };


        // --- MAIN COMPONENT ---
        const AI_Presentation = () => {
            const [activeEra, setActiveEra] = useState(0);
            const [displayYear, setDisplayYear] = useState(1950);
            const [progress, setProgress] = useState(0);
            const [isMuted, setIsMuted] = useState(true);
            const [volume, setVolume] = useState(0.5); // Master volume
            
            // Refs
            const canvasRef = useRef(null);
            const requestRef = useRef(null);
            const containerRef = useRef(null);
            const audioRef = useRef(null);
            const prevYearRef = useRef(1950);
            
            const animationState = useRef({ 
                floatEra: 0,
                progress: 0,
                year: 1950
            });

            // --- AUDIO MANAGEMENT ---
            const toggleMute = () => {
                if (!audioRef.current) {
                    audioRef.current = createAudioEngine();
                }
                const { ctx } = audioRef.current;
                if (ctx.state === 'suspended') ctx.resume();
                setIsMuted(!isMuted);
            };

            const handleVolumeChange = (e) => {
                const newVol = parseFloat(e.target.value);
                setVolume(newVol);
                if (audioRef.current) {
                    audioRef.current.masterGain.gain.setTargetAtTime(newVol, audioRef.current.ctx.currentTime, 0.1);
                }
                if (newVol > 0 && isMuted) setIsMuted(false);
            };
            
            // Audio Updates Loop
            useEffect(() => {
                if (!audioRef.current) return;
                const { osc, oscGain, ctx, playTick, masterGain } = audioRef.current;

                // Mute Logic
                if (isMuted) {
                    masterGain.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
                } else {
                    masterGain.gain.setTargetAtTime(volume, ctx.currentTime, 0.1);
                }

                const currentData = ERAS[activeEra] || ERAS[0];
                
                // 1. Modulate Drone Pitch & Mix
                osc.type = currentData.wave;
                osc.frequency.setTargetAtTime(currentData.freq, ctx.currentTime, 0.2); 
                
                // Apply Era-Specific Mix Level
                oscGain.gain.setTargetAtTime(currentData.mix, ctx.currentTime, 0.5);

                // 2. Play Tick
                if (displayYear !== prevYearRef.current) {
                    playTick();
                    prevYearRef.current = displayYear;
                }

            }, [activeEra, displayYear, isMuted, volume]);


            // 1. LOGIC LOOP
            useEffect(() => {
                const startTime = Date.now();
                const timer = setInterval(() => {
                    const now = Date.now();
                    const diff = now - startTime;
                    const loopTime = diff % TOTAL_LOOP_TIME;
                    
                    const slideDuration = TOTAL_LOOP_TIME / ERAS.length;
                    const floatEra = loopTime / slideDuration;
                    const eraIndex = Math.floor(floatEra);
                    const eraProg = floatEra - eraIndex;
                    
                    const totalProg = loopTime / TOTAL_LOOP_TIME;
                    const currentYear = Math.floor(START_YEAR + (totalProg * (END_YEAR - START_YEAR)));

                    setActiveEra(eraIndex);
                    setProgress(eraProg);
                    setDisplayYear(currentYear);

                    animationState.current = { 
                        floatEra: floatEra, 
                        progress: eraProg,
                        year: currentYear
                    };

                }, 30);
                return () => clearInterval(timer);
            }, []);

            // 2. VISUAL ENGINE
            const particles = useMemo(() => {
                return Array.from({ length: 70 }, () => ({
                    x: Math.random() * 100, 
                    y: Math.random() * 100,
                    vx: (Math.random() - 0.5) * 0.5, 
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 8 + 2,
                    state: Math.random() > 0.5 ? 1 : 0,
                    angle: Math.random() * Math.PI * 2, 
                    radius: Math.random() * 30 + 10
                }));
            }, []);

            const animate = (time) => {
                const canvas = canvasRef.current;
                if (!canvas) return; 
                const ctx = canvas.getContext('2d');
                if (!ctx) return; 

                const width = canvas.width;
                const height = canvas.height;
                
                const { floatEra, progress } = animationState.current;
                
                const currentEraIndex = Math.floor(floatEra) % ERAS.length;
                const nextEraIndex = (currentEraIndex + 1) % ERAS.length;
                
                let alphaCurrent = 1;
                let alphaNext = 0;
                
                if (progress > 0.7) {
                    const blend = (progress - 0.7) / 0.3; 
                    alphaCurrent = 1 - blend;
                    alphaNext = blend;
                } else {
                    alphaCurrent = 1;
                    alphaNext = 0;
                }
                
                const autoChaos = (Math.sin(progress * Math.PI) * 0.8) + 0.1; 
                const currentMode = ERAS[currentEraIndex].mode;

                // --- PHYSICS UPDATE ---
                particles.forEach(p => {
                    p.x += p.vx * 0.3;
                    p.y += p.vy * 0.3;

                    if (currentMode === 'binary') {
                         p.x += (Math.random() - 0.5) * (autoChaos * 1.5);
                         p.y += (Math.random() - 0.5) * (autoChaos * 1.5);
                    }
                    else if (currentMode === 'tree') {
                         p.y += 0.5 + (autoChaos * 2);
                    }
                    else if (currentMode === 'network') {
                         p.x += p.vx * (1 + autoChaos * 3);
                         p.y += p.vy * (1 + autoChaos * 3);
                         if (p.x <= 0) { p.x = 0; p.vx *= -1; }
                         if (p.x >= 100) { p.x = 100; p.vx *= -1; }
                         if (p.y <= 0) { p.y = 0; p.vy *= -1; }
                         if (p.y >= 100) { p.y = 100; p.vy *= -1; }
                    }
                    else if (currentMode === 'fluid') {
                         p.x += p.vx * (1 + autoChaos * 3);
                         p.y += p.vy * (1 + autoChaos * 3);
                    }
                    else if (currentMode === 'quantum') {
                         p.angle += 0.02 + (autoChaos * 0.05);
                    }
                    
                    if (currentMode !== 'network') {
                        if(p.x > 100) p.x=0; if(p.x<0) p.x=100;
                        if(p.y > 100) p.y=0; if(p.y<0) p.y=100;
                    }
                });

                ctx.fillStyle = 'rgba(241, 240, 234, 0.25)';
                ctx.fillRect(0, 0, width, height);

                const currentEra = ERAS[currentEraIndex];
                drawEraLayer(ctx, currentEra.mode, currentEra.color, particles, width, height, time, alphaCurrent, autoChaos);

                if (alphaNext > 0) {
                    const nextEra = ERAS[nextEraIndex];
                    drawEraLayer(ctx, nextEra.mode, nextEra.color, particles, width, height, time, alphaNext, autoChaos);
                }

                requestRef.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (canvas) {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                requestRef.current = requestAnimationFrame(animate);
                return () => {
                    if (requestRef.current) cancelAnimationFrame(requestRef.current);
                };
            }, []);

            const toggleFullscreen = () => {
                if (containerRef.current && !document.fullscreenElement) {
                    try { containerRef.current.requestFullscreen(); } catch(e) {}
                } else if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            };

            const currentEraData = ERAS[activeEra] || ERAS[0];

            return (
                <div ref={containerRef} className="relative w-full h-full">
                    
                    {/* VISUAL LAYER */}
                    <canvas ref={canvasRef} className="absolute inset-0 z-0 block" />
                    
                    {/* Grid Overlay */}
                    <div className="absolute inset-0 pointer-events-none z-10 opacity-10" 
                        style={{
                        backgroundImage: 'linear-gradient(#2C3E50 1px, transparent 1px), linear-gradient(90deg, #2C3E50 1px, transparent 1px)',
                        backgroundSize: '50px 50px'
                        }}>
                    </div>

                    {/* HUD LAYER */}
                    <div className="absolute top-0 left-0 h-full w-full max-w-[340px] p-6 z-20 flex flex-col justify-between pointer-events-none">
                        
                        {/* 1. HEADER CARD */}
                        <div className="bg-white/95 backdrop-blur-sm p-6 rounded-2xl shadow-xl border-l-8 transition-colors duration-500 pointer-events-auto"
                             style={{borderColor: currentEraData.color}}>
                            
                            <div className="flex items-center justify-between mb-2 opacity-60">
                                <div className="flex items-center space-x-2">
                                    <div className="w-2 h-2 bg-[#2C3E50] rounded-full"></div>
                                    <span className="font-mono text-[10px] tracking-[0.2em] font-bold">MIND_MACHINA</span>
                                </div>
                                <div className="flex items-center space-x-2">
                                    {/* VOLUME CONTROLS */}
                                    <input 
                                        type="range" 
                                        min="0" max="1" step="0.01" 
                                        value={isMuted ? 0 : volume} 
                                        onChange={handleVolumeChange}
                                        className="w-16 h-1"
                                    />
                                    <button onClick={toggleMute} className="hover:text-[#E63946]" title={isMuted ? "Unmute" : "Mute"}>
                                        {isMuted || volume === 0 ? <VolumeX size={16}/> : <Volume2 size={16}/>}
                                    </button>
                                    <button onClick={toggleFullscreen} className="hover:text-[#E63946]" title="Fullscreen">
                                        <Maximize size={16}/>
                                    </button>
                                </div>
                            </div>

                            <h1 className="text-2xl font-black uppercase leading-none tracking-tight mb-2 text-[#2C3E50]">
                                Evolution of <span style={{color: currentEraData.color}}>AI</span>
                            </h1>

                            <div className="text-[4.5rem] leading-[0.85] font-black tracking-tighter tabular-nums text-[#2C3E50] -ml-2">
                                {displayYear}
                            </div>
                        </div>

                        {/* 2. CONTENT CARD */}
                        <div className="bg-white/95 backdrop-blur-sm p-5 rounded-2xl shadow-xl pointer-events-auto">
                            
                            <div className="w-full h-1 bg-gray-200 rounded-full mb-4 overflow-hidden">
                                <div className="h-full transition-all duration-100 ease-linear"
                                     style={{width: `${progress * 100}%`, backgroundColor: currentEraData.color}}></div>
                            </div>

                            <div className="flex items-center space-x-2 mb-2">
                                <span className="px-2 py-0.5 bg-[#2C3E50] text-white text-[10px] font-mono font-bold uppercase rounded">
                                    FIG {activeEra + 1}.0
                                </span>
                                <h2 className="text-lg font-black uppercase text-[#2C3E50]">{currentEraData.title}</h2>
                            </div>

                            <p className="text-sm font-medium leading-snug text-[#2C3E50]/90">
                                {currentEraData.desc}
                            </p>

                            <div className="mt-3 pt-3 border-t border-gray-100 flex items-center justify-between text-[10px] font-mono font-bold text-gray-400">
                                <span>FLUX LEVEL</span>
                                <span style={{color: currentEraData.color}}>
                                    {Math.round(((Math.sin(progress * Math.PI) * 0.8) + 0.1) * 100)}%
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AI_Presentation />);
    </script>
</body>
</html>
