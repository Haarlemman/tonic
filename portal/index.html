<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Portal</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: cyan;
            cursor: pointer;
            transition: opacity 1s;
        }
        
        h1 { text-shadow: 0 0 20px cyan; letter-spacing: 5px; text-align: center;}
        p { opacity: 0.8; margin-top: 10px; }
        .instructions { font-size: 0.8em; opacity: 0.6; margin-top: 20px; }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Flash Overlay for transition - Default background removed, handled by JS */
        #flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15; 
            display: none;
            opacity: 0;
            transition: opacity 0.5s; 
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>INFINITY PORTAL</h1>
        <p>[ CLICK TO INITIALIZE ]</p>
        <p class="instructions">SCROLL TO EXPLORE</p>
    </div>

    <div class="scanlines"></div>
    
    <!-- Flash overlay replacing video -->
    <div id="flash-overlay"></div>

    <div id="canvas-container"></div>

    <!-- Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration ---
        const CONFIG = {
            // Normal World
            bgNormal: 0x050505,
            gridNormal: 0x00ffff, // Cyan
            fogNormalStart: 100,
            fogNormalEnd: 3500,

            // Inverted World
            bgInverted: 0x00eeee, // Bright Cyan/Whiteish Background
            gridInverted: 0x000000, // Black Grid
            fogInvertedStart: 50,
            fogInvertedEnd: 3500,

            portalColor: 0xff00ff, // Magenta
            portalColorInverted: 0x000000, // Black
            
            portalPositionZ: -800, 
            triggerDistance: 120, // Distance to auto-trigger warp
            
            scrollSpeed: 0.5,
            keySpeed: 8.0,
        };

        // --- State Machine ---
        const STATE = {
            PHASE_1: 'PHASE_1',         // Dark world, searching
            TRANSITION_IN: 'TRANSITION_IN', // Portal expanding (works for both directions)
            PHASE_2: 'PHASE_2',         // Inverted world, searching
            SWAPPING: 'SWAPPING'        // Brief pause during flash
        };
        
        let currentState = STATE.PHASE_1;
        let nextWorld = 'INVERTED'; // Where are we going?
        
        let scene, camera, renderer, composer, bloomPass;
        let terrainMesh, portalGroup, portalRing, hologramMesh, hitboxMesh;
        let glitchMaterial;
        let clock = new THREE.Clock();
        let scrollPos = 0; 
        let targetScrollPos = 0; 
        let interactionActive = false; 
        let defaultFov = 75;

        // Keys
        const keys = { ArrowUp: false, ArrowDown: false, w: false, s: false };

        // Interaction
        const flashOverlay = document.getElementById('flash-overlay');

        // --- Vortex/Glitch Shader ---
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float time;
            uniform float intensity; // 0.0 to 1.0 (calm) -> 5.0 (warp)
            uniform float inverted; // 0.0 (Normal) or 1.0 (Inverted)
            varying vec2 vUv;

            float random (vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }

            void main() {
                vec2 center = vec2(0.5);
                vec2 uv = vUv - center;
                
                // Polar coordinates
                float r = length(uv);
                float a = atan(uv.y, uv.x);
                
                // Invert rotation direction if world is inverted
                float dir = inverted > 0.5 ? -1.0 : 1.0;
                
                // Swirl effect
                float swirl = a + r * (10.0 * intensity) - time * (5.0 * intensity) * dir;
                
                // Rings moving outwards
                float ring = sin(r * 30.0 - time * 10.0 * intensity * dir);
                float ringSharp = step(0.5, ring);
                
                // Color ramp
                vec3 col1 = vec3(0.0, 1.0, 1.0); // Cyan
                vec3 col2 = vec3(1.0, 0.0, 1.0); // Magenta
                
                // If Inverted World: Black Hole (Black/Grey)
                if (inverted > 0.5) {
                    col1 = vec3(0.0, 0.0, 0.0); // Pure Black
                    col2 = vec3(0.1, 0.1, 0.1); // Dark Grey
                }
                
                // Mix colors based on swirl
                vec3 color = mix(col1, col2, sin(swirl)*0.5 + 0.5);
                
                // Alpha fade at edges of circle
                float circle = 1.0 - smoothstep(0.48, 0.5, r);
                
                // Core glow (dimmer if black hole)
                float core = 1.0 / (r * 10.0 + 0.1);
                if (inverted > 0.5) core *= 0.5; // Less glow for black hole
                
                gl_FragColor = vec4(color * (core + ringSharp), circle * 0.9);
            }
        `;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            setWorldTheme(false); 

            camera = new THREE.PerspectiveCamera(defaultFov, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 5, 0); 
            
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            const renderScene = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0;
            bloomPass.strength = 1.5;
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createTerrain();
            createPortal(CONFIG.portalPositionZ);

            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('wheel', onScroll, { passive: false });
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
            window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });
            
            setTimeout(() => { interactionActive = true; }, 1000);

            animate();
        }

        function setWorldTheme(inverted) {
            const bg = inverted ? CONFIG.bgInverted : CONFIG.bgNormal;
            const grid = inverted ? CONFIG.gridInverted : CONFIG.gridNormal;
            const fogStart = inverted ? CONFIG.fogInvertedStart : CONFIG.fogNormalStart;
            const fogEnd = inverted ? CONFIG.fogInvertedEnd : CONFIG.fogNormalEnd;

            scene.background = new THREE.Color(bg);
            scene.fog = new THREE.Fog(bg, fogStart, fogEnd);
            
            if (terrainMesh) {
                terrainMesh.material.color.setHex(grid);
            }

            if(bloomPass) {
                if(inverted) {
                    bloomPass.strength = 0.5; // Tone down bloom for light background
                    bloomPass.threshold = 0.5;
                } else {
                    bloomPass.strength = 1.5;
                    bloomPass.threshold = 0;
                }
            }

            if (inverted) document.body.classList.add('inverted');
            else document.body.classList.remove('inverted');
        }

        function createTerrain() {
            const geometry = new THREE.PlaneGeometry(300, 4000, 100, 200);
            const material = new THREE.MeshBasicMaterial({ 
                color: CONFIG.gridNormal, 
                wireframe: true,
                transparent: true,
                opacity: 0.3,
                side: THREE.DoubleSide
            });

            terrainMesh = new THREE.Mesh(geometry, material);
            terrainMesh.rotation.x = -Math.PI / 2; 
            terrainMesh.position.y = -10; 
            terrainMesh.position.z = -2000; 
            scene.add(terrainMesh);
        }

        function createPortal(zPos) {
            if (portalGroup) scene.remove(portalGroup);

            portalGroup = new THREE.Group();
            
            // Increased size for massive feel
            const radius = 15;
            
            // Ring
            const ringGeo = new THREE.TorusGeometry(radius, 0.5, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: CONFIG.portalColor });
            portalRing = new THREE.Mesh(ringGeo, ringMat);
            portalGroup.add(portalRing);

            // 1. Procedural Shader Material
            glitchMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    intensity: { value: 0.2 }, // Start calm
                    inverted: { value: 0.0 }
                },
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                transparent: true,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });

            const geo = new THREE.CircleGeometry(radius - 0.2, 64);
            hologramMesh = new THREE.Mesh(geo, glitchMaterial); 
            portalGroup.add(hologramMesh);
            
            portalGroup.position.set(0, 0, zPos);
            scene.add(portalGroup);
        }

        function onScroll(event) {
            if (currentState !== STATE.PHASE_1 && currentState !== STATE.PHASE_2) return;
            event.preventDefault();
            targetScrollPos -= event.deltaY * CONFIG.scrollSpeed;
            clampScroll();
        }


        let touchStart = 0;
        window.addEventListener('touchstart', (e) => touchStart = e.touches[0].clientY);
        function onTouchMove(e) {
            if (currentState !== STATE.PHASE_1 && currentState !== STATE.PHASE_2) return;
            const touchY = e.touches[0].clientY;
            const delta = touchStart - touchY;
            touchStart = touchY;
            targetScrollPos -= delta * 1.5; 
            clampScroll();
        }
        
        function clampScroll() {
            if (targetScrollPos > 50) targetScrollPos = 50;
            if (targetScrollPos < -3000) targetScrollPos = -3000;
        }

        function triggerTransition(targetWorld) {
            currentState = STATE.TRANSITION_IN;
            nextWorld = targetWorld;
            // Speed up the vortex shader
            glitchMaterial.uniforms.intensity.value = 5.0; 
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            if (currentState === STATE.PHASE_1 || currentState === STATE.PHASE_2) {
                if (keys.ArrowUp || keys.w) targetScrollPos -= CONFIG.keySpeed;
                if (keys.ArrowDown || keys.s) targetScrollPos += CONFIG.keySpeed;
                clampScroll();
            }

            scrollPos += (targetScrollPos - scrollPos) * 0.1;
            
            if (currentState === STATE.PHASE_1 || currentState === STATE.PHASE_2) {
                camera.position.z = scrollPos;
                updateTerrain(time);
                if (glitchMaterial) glitchMaterial.uniforms.time.value = time;
                checkProximity();
            }

            // --- TRANSITION EFFECT ---
            if (currentState === STATE.TRANSITION_IN) {
                if (glitchMaterial) glitchMaterial.uniforms.time.value = time;

                // Move Camera towards Portal rapidly
                const target = portalGroup.position.clone();
                camera.position.lerp(target, 0.15); // Faster lerp
                
                // Add Camera Roll (Spinning into the void)
                camera.rotation.z += 0.15;

                // Warp Speed FOV
                camera.fov = THREE.MathUtils.lerp(camera.fov, 120, 0.1);
                camera.updateProjectionMatrix();
                
                // Scale Portal Up Massively to swallow camera
                hologramMesh.scale.multiplyScalar(1.3); 
                portalRing.scale.multiplyScalar(1.1);

                // When very close, trigger flash and swap
                if (camera.position.distanceTo(portalGroup.position) < 10) {
                    
                    // --- DYNAMIC FLASH COLOR ---
                    if (nextWorld === 'INVERTED') {
                        flashOverlay.style.backgroundColor = '#00eeee'; // Fade to Cyan
                    } else {
                        flashOverlay.style.backgroundColor = '#000000'; // Fade to Black
                    }
                    
                    flashOverlay.style.display = 'block';
                    // Force reflow
                    void flashOverlay.offsetWidth;
                    flashOverlay.style.opacity = '1';
                    
                    // While full color, swap worlds
                    setTimeout(() => {
                        if (nextWorld === 'INVERTED') {
                            enterInvertedWorld();
                        } else {
                            enterNormalWorld();
                        }
                        
                        // Fade out flash
                        setTimeout(() => {
                            flashOverlay.style.opacity = '0';
                            setTimeout(() => flashOverlay.style.display = 'none', 500);
                        }, 200);
                    }, 500);
                    
                    // Stop animation loop updating camera for a moment to prevent jitter
                    currentState = STATE.SWAPPING; 
                }
            }
            
            // Handle Swap State (idle waiting for timeout)
            if (currentState === STATE.SWAPPING) {
                 if (glitchMaterial) glitchMaterial.uniforms.time.value = time;
            }

            if (currentState === STATE.RETURNING) {
                setWorldTheme(false); 
                
                portalGroup.scale.set(1,1,1);
                hologramMesh.scale.set(1,1,1);
                portalRing.scale.set(1,1,1);
                
                targetScrollPos = 0;
                scrollPos = 0;
                camera.position.z = 0;
                camera.rotation.z = 0;
                camera.fov = defaultFov;
                camera.updateProjectionMatrix();

                portalGroup.position.z = CONFIG.portalPositionZ; 
                
                glitchMaterial.uniforms.intensity.value = 0.2; // Reset intensity
                
                currentState = STATE.PHASE_1;
            }

            composer.render();
        }
        
        function updateTerrain(time) {
            if (!terrainMesh) return;
            const pos = terrainMesh.geometry.attributes.position;
            const v = new THREE.Vector3();
            for(let i=0; i<pos.count; i++){
                v.fromBufferAttribute(pos, i);
                const wave = Math.sin((v.x * 0.1) + (time * 0.5)) * Math.sin((v.y * 0.05) + (time * 0.5));
                pos.setZ(i, wave * 5); 
            }
            pos.needsUpdate = true;
        }

        function checkProximity() {
            if (!portalGroup || !interactionActive) return;

            const dist = camera.position.distanceTo(portalGroup.position);
            
            // Auto Trigger if very close
            if (dist < CONFIG.triggerDistance) {
                if (currentState === STATE.PHASE_1) {
                    triggerTransition('INVERTED');
                } else if (currentState === STATE.PHASE_2) {
                    triggerTransition('NORMAL');
                }
                return;
            }

            // Visual effect if approaching
            if (dist < 200) {
                // Ramping up glitch
                glitchMaterial.uniforms.intensity.value = 1.0;
            } else {
                glitchMaterial.uniforms.intensity.value = 0.2;
            }
        }

        function enterInvertedWorld() {
            setWorldTheme(true); 
            currentState = STATE.PHASE_2;
            
            // Invert the portal effects to BLACK
            glitchMaterial.uniforms.inverted.value = 1.0;
            portalRing.material.color.setHex(CONFIG.portalColorInverted);
            
            // CHANGE BLENDING to Normal for Black Hole effect
            glitchMaterial.blending = THREE.NormalBlending;
            glitchMaterial.needsUpdate = true;
            
            resetWorld();
        }

        function enterNormalWorld() {
            setWorldTheme(false);
            currentState = STATE.PHASE_1;
            
            // Reset the portal effects
            glitchMaterial.uniforms.inverted.value = 0.0;
            portalRing.material.color.setHex(CONFIG.portalColor);
            
            // RESET BLENDING to Additive for Light Glow effect
            glitchMaterial.blending = THREE.AdditiveBlending;
            glitchMaterial.needsUpdate = true;
            
            resetWorld();
        }

        function resetWorld() {
            // Teleport User and Portal to start positions for the "new" loop
            targetScrollPos = 0;
            scrollPos = 0;
            camera.position.z = 0;
            camera.rotation.z = 0; // Reset roll
            camera.fov = defaultFov; // Reset FOV
            camera.updateProjectionMatrix();
            
            portalGroup.position.z = CONFIG.portalPositionZ;
            portalGroup.scale.set(1, 1, 1);
            hologramMesh.scale.set(1,1,1);
            portalRing.scale.set(1,1,1);
            
            // Calm down shader
            glitchMaterial.uniforms.intensity.value = 0.2;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        const startScreen = document.getElementById('start-screen');
        startScreen.addEventListener('click', () => {
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.style.display = 'none', 1000);
            init();
        });

    </script>
</body>
</html>
