<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Portal</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: cyan;
            cursor: pointer;
            transition: opacity 1s;
        }
        
        h1 { text-shadow: 0 0 20px cyan; letter-spacing: 5px; text-align: center;}
        p { opacity: 0.8; margin-top: 10px; }
        .instructions { font-size: 0.8em; opacity: 0.6; margin-top: 20px; }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 5;
        }
        
        #portal-hint {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff00ff;
            font-weight: bold;
            text-shadow: 0 0 10px #ff00ff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 12;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>INFINITY PORTAL</h1>
        <p>[ CLICK TO INITIALIZE ]</p>
        <p class="instructions">SCROLL or ARROW KEYS TO SPIN THE WHEEL</p>
    </div>

    <div class="scanlines"></div>
    <div id="portal-hint">[ CLICK TO ENTER ]</div>
    
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const CONFIG = {
            bgNormal: 0x050505,
            gridNormal: 0x00ffff,
            fogNormalStart: 100,
            fogNormalEnd: 1500,
            bgInverted: 0xffffff, // White background
            gridInverted: 0x000000, 
            particleInverted: 0x00ffff, // Cyan particles
            fogInvertedStart: 100, 
            fogInvertedEnd: 1500,
            portalColor: 0xff00ff,
            portalAngle: Math.PI * 0.8, 
            activationDist: 150, 
            scrollSpeed: 0.002, 
            keySpeed: 0.03, 
            lookSensitivity: 0.2, 
            wheelRadius: 120,
            transitionDuration: 3000,
        };

        const STATE = {
            PHASE_1: 'PHASE_1',         
            TRANSITION_IN: 'TRANSITION_IN', 
            PHASE_2: 'PHASE_2',         
            RETURNING: 'RETURNING'      
        };
        
        let currentState = STATE.PHASE_1;
        let scene, camera, renderer, composer, bloomPass;
        let worldGroup, terrainMesh, portalGroup, portalRing, hologramMesh, hitboxMesh;
        let glitchMaterial;
        let clock = new THREE.Clock();
        let particleSystem;
        let transitionStartTime = 0;
        let tunnelRings = [];
        let energyBeams = [];
        let transitionParticles;
        
        let currentRotation = 0;
        let targetRotation = 0;
        let interactionActive = false; 
        
        const keys = { ArrowUp: false, ArrowDown: false, w: false, s: false };
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const portalHint = document.getElementById('portal-hint');

        const glitchVertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        
        const glitchFragmentShader = `
            uniform float time;
            uniform float intensity;
            varying vec2 vUv;
            float random (vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
            void main() {
                vec2 uv = vUv;
                
                uv.x += sin(uv.y * 10.0 + time * 2.0) * 0.02 * intensity;
                uv.y += cos(uv.x * 10.0 + time * 2.0) * 0.02 * intensity;
                
                float stripe = step(0.9, random(vec2(0.0, uv.y * 50.0 + time * 10.0)));
                float noiseVal = random(uv * time);
                
                float dist = length(uv - 0.5);
                float vignette = 1.0 - smoothstep(0.3, 0.5, dist);
                
                vec3 color = vec3(0.0, 1.0, 1.0); 
                float alpha = (stripe * 0.5 + noiseVal * 0.3 + vignette * 0.5) * intensity;
                gl_FragColor = vec4(color, alpha);
            }
        `;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            setWorldTheme(false); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, -CONFIG.wheelRadius + 15, 0); 
            camera.lookAt(0, -CONFIG.wheelRadius + 20, -100);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            const renderScene = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0;
            bloomPass.strength = 1.5;
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createWorld();
            
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);
            window.addEventListener('wheel', onScroll, { passive: false });
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
            window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });
            
            setTimeout(() => { interactionActive = true; }, 1000); 

            animate();
        }

        function setWorldTheme(inverted) {
            const bg = inverted ? CONFIG.bgInverted : CONFIG.bgNormal;
            const grid = inverted ? CONFIG.gridInverted : CONFIG.gridNormal;
            const fogStart = inverted ? CONFIG.fogInvertedStart : CONFIG.fogNormalStart;
            const fogEnd = inverted ? CONFIG.fogInvertedEnd : CONFIG.fogNormalEnd;

            scene.background = new THREE.Color(bg);
            scene.fog = new THREE.Fog(bg, fogStart, fogEnd);
            
            if (terrainMesh) {
                terrainMesh.material.color.setHex(grid);
            }

            if (bloomPass) {
                if (inverted) {
                    bloomPass.strength = 2.0; // Strong bloom in white world
                    bloomPass.threshold = 0.3;
                } else {
                    bloomPass.strength = 1.5;
                    bloomPass.threshold = 0;
                }
            }
            
            // Update particle colors
            if (particleSystem) {
                const colors = particleSystem.geometry.attributes.color.array;
                const particleColor = inverted ? new THREE.Color(CONFIG.particleInverted) : new THREE.Color(0.5, 0.5, 1.0);
                for (let i = 0; i < colors.length; i += 3) {
                    colors[i] = particleColor.r;
                    colors[i + 1] = particleColor.g;
                    colors[i + 2] = particleColor.b;
                }
                particleSystem.geometry.attributes.color.needsUpdate = true;
            }
        }

        function createWorld() {
            worldGroup = new THREE.Group();
            scene.add(worldGroup);

            const geometry = new THREE.CylinderGeometry(CONFIG.wheelRadius, CONFIG.wheelRadius, 120, 80, 40, true);
            const material = new THREE.MeshBasicMaterial({ 
                color: CONFIG.gridNormal, 
                wireframe: true,
                transparent: true,
                opacity: 0.3,
                side: THREE.BackSide 
            });

            terrainMesh = new THREE.Mesh(geometry, material);
            terrainMesh.rotation.z = Math.PI / 2;
            worldGroup.add(terrainMesh);

            createPortal(CONFIG.portalAngle);
            createParticles();
        }

        function createParticles() {
            const particleCount = 1000;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI * 2;
                const r = CONFIG.wheelRadius + (Math.random() - 0.5) * 20;
                
                positions[i3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = r * Math.cos(phi);
                positions[i3 + 2] = r * Math.sin(phi) * Math.sin(theta);
                
                colors[i3] = Math.random() * 0.5 + 0.5;
                colors[i3 + 1] = Math.random() * 0.5 + 0.5;
                colors[i3 + 2] = 1.0;
                
                sizes[i] = Math.random() * 2 + 0.5;
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            const material = new THREE.PointsMaterial({
                size: 2,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            
            particleSystem = new THREE.Points(geometry, material);
            worldGroup.add(particleSystem);
        }

        function createPortal(angle) {
            if (portalGroup) worldGroup.remove(portalGroup);

            portalGroup = new THREE.Group();
            
            const radius = 8; 
            
            const ringGeo = new THREE.TorusGeometry(radius, 0.4, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: CONFIG.portalColor });
            portalRing = new THREE.Mesh(ringGeo, ringMat);
            portalGroup.add(portalRing);

            glitchMaterial = new THREE.ShaderMaterial({
                uniforms: { time: { value: 0 }, intensity: { value: 0.8 } },
                vertexShader: glitchVertexShader,
                fragmentShader: glitchFragmentShader,
                transparent: true, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
            });

            const geo = new THREE.CircleGeometry(radius - 0.2, 64);
            hologramMesh = new THREE.Mesh(geo, glitchMaterial); 
            portalGroup.add(hologramMesh);
            
            const hitGeo = new THREE.SphereGeometry(radius * 3.0, 32, 32);
            const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 });
            hitboxMesh = new THREE.Mesh(hitGeo, hitMat);
            portalGroup.add(hitboxMesh);

            const py = -CONFIG.wheelRadius * Math.cos(angle);
            const pz = -CONFIG.wheelRadius * Math.sin(angle);
            
            portalGroup.position.set(0, py, pz);
            portalGroup.lookAt(0, 0, 0);
            portalGroup.rotateX(Math.PI / 2);

            worldGroup.add(portalGroup);
        }

        function createTronTransition() {
            const transitionGroup = new THREE.Group();
            
            // Create tunnel rings
            for (let i = 0; i < 20; i++) {
                const ringGeo = new THREE.TorusGeometry(5 + i * 2, 0.3, 8, 32);
                const ringMat = new THREE.MeshBasicMaterial({ 
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.8
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.z = -i * 10;
                transitionGroup.add(ring);
                tunnelRings.push(ring);
            }
            
            // Create energy beams
            for (let i = 0; i < 8; i++) {
                const points = [];
                const angle = (i / 8) * Math.PI * 2;
                for (let j = 0; j < 100; j++) {
                    const x = Math.cos(angle) * 3;
                    const y = Math.sin(angle) * 3;
                    const z = -j * 2;
                    points.push(new THREE.Vector3(x, y, z));
                }
                const beamGeo = new THREE.BufferGeometry().setFromPoints(points);
                const beamMat = new THREE.LineBasicMaterial({ 
                    color: 0xff00ff,
                    transparent: true,
                    opacity: 0.8
                });
                const beam = new THREE.Line(beamGeo, beamMat);
                transitionGroup.add(beam);
                energyBeams.push(beam);
            }
            
            // Create rushing particles
            const particleCount = 2000;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 15;
                
                positions[i3] = Math.cos(angle) * radius;
                positions[i3 + 1] = Math.sin(angle) * radius;
                positions[i3 + 2] = -Math.random() * 200;
                
                const color = new THREE.Color();
                color.setHSL(Math.random() * 0.3 + 0.5, 1.0, 0.5);
                colors[i3] = color.r;
                colors[i3 + 1] = color.g;
                colors[i3 + 2] = color.b;
            }
            
            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const particleMat = new THREE.PointsMaterial({
                size: 3,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            transitionParticles = new THREE.Points(particleGeo, particleMat);
            transitionGroup.add(transitionParticles);
            
            scene.add(transitionGroup);
            return transitionGroup;
        }

        function onScroll(event) {
            if (currentState !== STATE.PHASE_1 && currentState !== STATE.PHASE_2) return;
            event.preventDefault();
            targetRotation += event.deltaY * CONFIG.scrollSpeed;
        }

        let touchStart = 0;
        window.addEventListener('touchstart', (e) => touchStart = e.touches[0].clientY);
        function onTouchMove(e) {
            if (currentState !== STATE.PHASE_1 && currentState !== STATE.PHASE_2) return;
            const touchY = e.touches[0].clientY;
            const delta = touchStart - touchY;
            touchStart = touchY;
            targetRotation += delta * 0.01;
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onMouseClick(event) {
            if (!interactionActive) return; 

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(worldGroup.children, true);
            const hit = intersects.find(i => i.object === hitboxMesh || i.object === hologramMesh || i.object === portalRing);

            const portalWorldPos = new THREE.Vector3();
            portalGroup.getWorldPosition(portalWorldPos);
            const dist = camera.position.distanceTo(portalWorldPos);
            
            if (hit || (dist < CONFIG.activationDist + 50)) {
                if (dist < CONFIG.activationDist) {
                    if (currentState === STATE.PHASE_1) {
                        activatePortalTransition();
                    } else if (currentState === STATE.PHASE_2) {
                        activateReturnTransition();
                    }
                }
            }
        }

        function activatePortalTransition() {
            currentState = STATE.TRANSITION_IN;
            portalHint.style.opacity = '0';
            transitionStartTime = Date.now();
        }

        function activateReturnTransition() {
            currentState = STATE.RETURNING;
            portalHint.style.opacity = '0';
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            if (currentState === STATE.PHASE_1 || currentState === STATE.PHASE_2) {
                if (keys.ArrowUp || keys.w) targetRotation += CONFIG.keySpeed;
                if (keys.ArrowDown || keys.s) targetRotation -= CONFIG.keySpeed;
            }

            currentRotation += (targetRotation - currentRotation) * 0.1;
            
            if (currentState === STATE.PHASE_1 || currentState === STATE.PHASE_2) {
                worldGroup.rotation.x = currentRotation;
                camera.rotation.y = -mouse.x * CONFIG.lookSensitivity * 0.2;
                camera.rotation.x = (mouse.y * CONFIG.lookSensitivity * 0.2); 
                if (glitchMaterial) glitchMaterial.uniforms.time.value = time;
                
                if (particleSystem) {
                    particleSystem.rotation.x = time * 0.05;
                    particleSystem.rotation.y = time * 0.1;
                }
                
                if (portalRing) {
                    const pulse = Math.sin(time * 2) * 0.05 + 1;
                    portalRing.scale.setScalar(pulse);
                }
                
                checkHover();
            }

            if (currentState === STATE.TRANSITION_IN) {
                const elapsed = Date.now() - transitionStartTime;
                const progress = Math.min(elapsed / CONFIG.transitionDuration, 1);
                
                // First time - create transition
                if (tunnelRings.length === 0) {
                    createTronTransition();
                    
                    // Get portal position
                    const portalPos = new THREE.Vector3();
                    portalGroup.getWorldPosition(portalPos);
                    
                    // Position camera at portal looking forward
                    camera.position.copy(portalPos);
                    camera.lookAt(portalPos.x, portalPos.y, portalPos.z - 100);
                }
                
                // Animate tunnel rings
                tunnelRings.forEach((ring, i) => {
                    ring.position.z += 5;
                    if (ring.position.z > 10) {
                        ring.position.z = -200;
                    }
                    ring.rotation.z = time * 2;
                    
                    // Pulse effect
                    const scale = 1 + Math.sin(time * 3 + i * 0.5) * 0.2;
                    ring.scale.setScalar(scale);
                });
                
                // Animate energy beams
                energyBeams.forEach((beam, i) => {
                    beam.rotation.z = time * (i % 2 === 0 ? 1 : -1);
                });
                
                // Animate particles rushing toward you
                if (transitionParticles) {
                    const positions = transitionParticles.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i + 2] += 10; // Rush forward
                        if (positions[i + 2] > 10) {
                            positions[i + 2] = -200;
                        }
                    }
                    transitionParticles.geometry.attributes.position.needsUpdate = true;
                }
                
                // Move camera forward through tunnel
                camera.position.z -= 3;
                
                // Complete transition
                if (progress >= 1) {
                    // Clean up transition objects
                    tunnelRings.forEach(ring => scene.remove(ring));
                    energyBeams.forEach(beam => scene.remove(beam));
                    if (transitionParticles) scene.remove(transitionParticles);
                    tunnelRings = [];
                    energyBeams = [];
                    transitionParticles = null;
                    
                    enterInvertedWorld();
                }
            }
            
            if (currentState === STATE.RETURNING) {
                setWorldTheme(false); 
                targetRotation = 0;
                currentRotation = 0;
                worldGroup.rotation.x = 0;
                
                createPortal(CONFIG.portalAngle);

                camera.position.set(0, -CONFIG.wheelRadius + 15, 0); 
                camera.rotation.set(0,0,0);
                
                currentState = STATE.PHASE_1;
            }

            composer.render();
        }

        function checkHover() {
            if (!portalGroup || !interactionActive) return;
            const portalWorldPos = new THREE.Vector3();
            portalGroup.getWorldPosition(portalWorldPos);
            const dist = camera.position.distanceTo(portalWorldPos);
            const inRange = dist < CONFIG.activationDist;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([hitboxMesh]);
            
            if (inRange) {
                portalHint.style.opacity = '1';
                if (intersects.length > 0 || dist < 40) {
                    document.body.style.cursor = 'pointer';
                    portalRing.material.color.setHex(0xffffff); 
                    glitchMaterial.uniforms.intensity.value = 2.0;
                    
                    const hoverScale = 1.2 + Math.sin(Date.now() * 0.005) * 0.1;
                    portalGroup.scale.setScalar(hoverScale); 
                } else {
                    document.body.style.cursor = 'default';
                    portalRing.material.color.setHex(CONFIG.portalColor);
                    glitchMaterial.uniforms.intensity.value = 1.0; 
                    portalGroup.scale.setScalar(1.0);
                }
            } else {
                portalHint.style.opacity = '0';
                document.body.style.cursor = 'default';
                portalRing.material.color.setHex(CONFIG.portalColor);
                glitchMaterial.uniforms.intensity.value = 0.6;
            }
        }

        function enterInvertedWorld() {
            setWorldTheme(true); 
            currentState = STATE.PHASE_2;
            
            targetRotation = 0;
            currentRotation = 0;
            worldGroup.rotation.x = 0;
            
            createPortal(Math.PI);

            hologramMesh.scale.set(1,1,1);
            portalRing.scale.set(1,1,1);
            
            camera.position.set(0, -CONFIG.wheelRadius + 15, 0);
            camera.lookAt(0, -CONFIG.wheelRadius + 20, -100);
            
            portalRing.material.color.setHex(0x00ffff);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        const startScreen = document.getElementById('start-screen');
        startScreen.addEventListener('click', () => {
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.style.display = 'none', 1000);
            init();
        });

    </script>
</body>
</html>
