<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metropolis: The High-Luster Synthesis</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0e0e0e 0%, #000 100%);
        }

        .ui-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 0.9rem;
            letter-spacing: 0.8rem;
            text-transform: uppercase;
            font-weight: 200;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .subtitle {
            font-size: 0.45rem; 
            color: #555; 
            margin-top: 8px; 
            letter-spacing: 0.3rem;
            text-transform: uppercase;
        }

        .controls-panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.85);
            padding: 12px 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
            border-radius: 40px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .label {
            font-size: 0.5rem;
            letter-spacing: 0.15rem;
            color: #aaa;
            text-transform: uppercase;
        }

        input[type=range] {
            width: 180px;
            accent-color: #00ffff;
            cursor: pointer;
            height: 3px;
            outline: none;
            background: rgba(255,255,255,0.1);
        }

        #interaction-msg {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h1>METROPOLIS</h1>
        <div class="subtitle">Unit: Hel → R2-D2 • Volumetric Plating</div>
    </div>

    <div id="canvas-container"></div>
    <div id="interaction-msg">Engage Evolution for Sonic Drive</div>

    <div class="controls-panel">
        <div class="label">Synthesis</div>
        <input type="range" id="morph-slider" min="0" max="1" step="0.01" value="0">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        (function() {
            let scene, camera, renderer, controls;
            let hel, artoo, domeGrp, groundDisc, rings = [], swarms = [];
            let goldMat, droidMat, panelMat, blueMat, glowMat, eyeMat;
            let audioCtx, osc, filter, gain;
            let morph = 0;

            let headTargetRot = 0, headCurrentRot = 0, headTimer = 0;
            let eyeBlinkTimer = 0, isEyeOff = false;

            const init = () => {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 1.4, 5.0);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.getElementById('canvas-container').appendChild(renderer.domElement);

                if (THREE.OrbitControls) {
                    controls = new THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;
                    controls.target.set(0, 0.8, 0);
                }

                // High-contrast cinematic lighting
                scene.add(new THREE.AmbientLight(0xffffff, 0.3));
                const sun = new THREE.DirectionalLight(0xfff5cc, 2.5); // Boosted for Gold Bling
                sun.position.set(5, 5, 5);
                scene.add(sun);
                
                const rimLight = new THREE.PointLight(0xffffff, 1.5, 10);
                rimLight.position.set(-5, 2, -2);
                scene.add(rimLight);

                // --- MATERIALS ---
                goldMat = new THREE.MeshStandardMaterial({ 
                    color: 0xffd700, 
                    metalness: 1.0, 
                    roughness: 0.05, // Mirror-like
                    emissive: 0xffaa00, 
                    emissiveIntensity: 0.2, 
                    transparent: true 
                });
                
                droidMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.4, roughness: 0.6 });
                panelMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.6, roughness: 0.4 });
                blueMat = new THREE.MeshStandardMaterial({ color: 0x002288, metalness: 0.5, roughness: 0.4 });
                eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true });

                // --- MODELS ---
                hel = new THREE.Group();
                artoo = new THREE.Group();
                scene.add(hel, r2 = artoo);

                // --- MARIA (ENHANCED GOLD BLING) ---
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 32, 32), goldMat);
                head.scale.set(0.9, 1.2, 1); head.position.y = 1.75; hel.add(head);
                
                // Plating details
                const neckRing = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.02, 16, 32), goldMat);
                neckRing.rotation.x = Math.PI/2; neckRing.position.y = 1.55; hel.add(neckRing);

                const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.005, 0.02), new THREE.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: 0.6}));
                mouth.position.set(0, 1.66, 0.17); hel.add(mouth);

                const eyeG = new THREE.SphereGeometry(0.045, 16, 16);
                const eL = new THREE.Mesh(eyeG, eyeMat); eL.position.set(-0.08, 1.78, 0.16);
                const eR = new THREE.Mesh(eyeG, eyeMat); eR.position.set(0.08, 1.78, 0.16);
                hel.add(eL, eR);

                const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.14, 0.8, 24), goldMat);
                torso.position.y = 1.1; hel.add(torso);
                
                // Art Deco ribbing
                for(let i=0; i<6; i++) {
                    const rib = new THREE.Mesh(new THREE.TorusGeometry(0.22 - (i*0.02), 0.015, 8, 32), goldMat);
                    rib.rotation.x = Math.PI/2; rib.position.y = 0.75 + (i * 0.12);
                    hel.add(rib);
                }

                // Arms & Hands
                const shoulderL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), goldMat);
                shoulderL.position.set(-0.3, 1.4, 0); hel.add(shoulderL);
                const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.7), goldMat);
                armL.position.set(-0.35, 1.0, 0); hel.add(armL);
                const handL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), goldMat);
                handL.position.set(-0.35, 0.65, 0); hel.add(handL);

                const shoulderR = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), goldMat);
                shoulderR.position.set(0.3, 1.4, 0); hel.add(shoulderR);
                const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.7), goldMat);
                armR.position.set(0.35, 1.0, 0); hel.add(armR);
                const handR = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), goldMat);
                handR.position.set(0.35, 0.65, 0); hel.add(handR);

                // Legs & Feet
                const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.05, 0.8), goldMat);
                legL.position.set(-0.12, 0.4, 0); hel.add(legL);
                const footL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.18), goldMat);
                footL.position.set(-0.12, 0.03, 0.05); hel.add(footL);

                const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.05, 0.8), goldMat);
                legR.position.set(0.12, 0.4, 0); hel.add(legR);
                const footR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.18), goldMat);
                footR.position.set(0.12, 0.03, 0.05); hel.add(footR);

                // --- ARTOO (DEEP GREY INDUSTRIAL) ---
                const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.65, 32), droidMat);
                barrel.position.y = 0.325; artoo.add(barrel);
                
                const frontVent = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.3, 0.04), blueMat);
                frontVent.position.set(0, 0.38, 0.34); artoo.add(frontVent);

                domeGrp = new THREE.Group();
                domeGrp.position.y = 0.65; artoo.add(domeGrp);
                const dome = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 16, 0, 6.28, 0, 1.57), droidMat);
                domeGrp.add(dome);
                const lens = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), new THREE.MeshBasicMaterial({color: 0x050505}));
                lens.position.set(0, 0.15, 0.32); domeGrp.add(lens);
                const bR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.04), new THREE.MeshBasicMaterial({color: 0xff0000}));
                const bB = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.04), new THREE.MeshBasicMaterial({color: 0x0066ff}));
                bR.position.set(0.12, 0.22, 0.28); bB.position.set(-0.12, 0.22, 0.28);
                domeGrp.add(bR, bB);

                const lL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.25), droidMat); lL.position.set(-0.45, 0.3, 0);
                const lR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.25), droidMat); lR.position.set(0.45, 0.3, 0);
                const lC = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.2, 0.16), droidMat); lC.position.set(0, 0.1, 0.23);
                artoo.add(lL, lR, lC);

                artoo.scale.set(0.001, 0.001, 0.001);

                // --- SOLID GROUND DISC ---
                groundDisc = new THREE.Mesh(
                    new THREE.CircleGeometry(1.1, 64),
                    new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.12, side: THREE.DoubleSide })
                );
                groundDisc.rotation.x = Math.PI / 2;
                groundDisc.position.y = 0.002;
                scene.add(groundDisc);

                // --- BOLD SCAN RINGS & VOLUMETRIC SWARMS ---
                const ringCount = 6;
                const pCount = 2500; // Per ring
                
                const pTex = (function() {
                    const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                    grad.addColorStop(0, 'rgba(0,255,255,1)'); grad.addColorStop(0.5, 'rgba(0,255,255,0.5)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(32,32,30,0,Math.PI*2); ctx.fill();
                    return new THREE.CanvasTexture(canvas);
                })();

                for (let i = 0; i < ringCount; i++) {
                    // BOLDER RINGS
                    const r = new THREE.Mesh(
                        new THREE.TorusGeometry(0.85, 0.015, 12, 100),
                        new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })
                    );
                    r.rotation.x = Math.PI/2;
                    scene.add(r);
                    rings.push(r);

                    // Swarm with higher vertical distribution for "In-between" particles
                    const pGeo = new THREE.BufferGeometry();
                    const pPos = new Float32Array(pCount * 3);
                    for(let j=0; j<pCount; j++) {
                        const angle = Math.random() * Math.PI * 2;
                        const rad = 0.85 * Math.sqrt(Math.random());
                        pPos[j*3] = Math.cos(angle) * rad;
                        pPos[j*3+1] = (Math.random() - 0.5) * 0.8; // Increased depth to fill gaps
                        pPos[j*3+2] = Math.sin(angle) * rad;
                    }
                    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
                    const swarm = new THREE.Points(pGeo, new THREE.PointsMaterial({
                        size: 0.08, map: pTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
                    }));
                    scene.add(swarm);
                    swarms.push(swarm);
                }

                const slider = document.getElementById('morph-slider');
                slider.addEventListener('input', (e) => {
                    if (!audioCtx) initAudio();
                    morph = parseFloat(e.target.value);
                    updateSynthesis();
                });

                window.addEventListener('resize', onWindowResize);
                animate();
            };

            const initAudio = () => {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                osc = audioCtx.createOscillator(); osc.type = 'sawtooth';
                filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
                gain = audioCtx.createGain(); gain.gain.value = 0;
                osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                osc.start();
                document.getElementById('interaction-msg').style.display = 'none';
            };

            const updateSynthesis = () => {
                const i = Math.sin(morph * Math.PI);
                hel.scale.set(Math.max(0.001, 1-morph), Math.max(0.001, 1-morph), Math.max(0.001, 1-morph));
                hel.position.y = morph * 0.4;
                artoo.scale.set(Math.max(0.001, morph * 0.75), Math.max(0.001, morph * 0.75), Math.max(0.001, morph * 0.75));
                groundDisc.material.opacity = 0.05 + (i * 0.3);
                
                if (audioCtx) {
                    gain.gain.setTargetAtTime(0.02 + (i * 0.15), audioCtx.currentTime, 0.1);
                    osc.frequency.setTargetAtTime(40 + (morph * 80) + (i * 20), audioCtx.currentTime, 0.1);
                    filter.frequency.setTargetAtTime(100 + (i * 2200), audioCtx.currentTime, 0.1);
                }
            };

            const onWindowResize = () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            };

            const animate = () => {
                requestAnimationFrame(animate);
                const time = Date.now() * 0.001;
                if (controls) controls.update();

                // Sentient Blinking
                eyeBlinkTimer -= 0.016;
                if (eyeBlinkTimer <= 0) {
                    isEyeOff = !isEyeOff;
                    eyeBlinkTimer = isEyeOff ? 0.08 : 2 + Math.random() * 5;
                }
                eyeMat.opacity = isEyeOff ? 0.1 : 1.0;

                // Occasional rotation logic
                if (morph > 0.25) {
                    headTimer -= 0.016;
                    if (headTimer <= 0) {
                        headTargetRot = (Math.random() - 0.5) * 3.0; 
                        headTimer = 1.5 + Math.random() * 4;
                    }
                    headCurrentRot += (headTargetRot - headCurrentRot) * 0.04;
                    domeGrp.rotation.y = headCurrentRot;
                }

                const intensity = Math.sin(morph * Math.PI);
                goldMat.opacity = 1.0 - (intensity * 0.45 * Math.random());

                const rangeY = 3.0, topY = 2.8, botY = -0.4;

                rings.forEach((r, idx) => {
                    r.position.y = topY - ((time * 0.4 + idx * (rangeY/rings.length)) % rangeY);
                    let p = Math.min(Math.max((r.position.y - botY) / rangeY, 0), 1);
                    const curve = Math.sin(p * Math.PI);
                    
                    r.material.opacity = Math.pow(curve, 2) * 0.8; // BOLDER GLOW
                    r.scale.set(0.4 + (curve * 0.85), 0.4 + (curve * 0.85), 1);

                    const s = swarms[idx];
                    s.position.y = r.position.y;
                    s.scale.set(r.scale.x, 1, r.scale.x);
                    // Particles shimmer more intensely
                    s.material.opacity = intensity * curve * (0.9 + Math.sin(time * 8 + idx) * 0.1);
                    s.rotation.y = time * 0.3;
                });

                renderer.render(scene, camera);
            };

            init();
        })();
    </script>
</body>
</html>
