<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tonic for the Bones - 3D Artifact</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #200000; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, worldGroup, bottleGroup, bubbles = [];
        
        // Interaction State
        let isDragging = false;
        let dragMode = 'none'; // 'rotate', 'pan', 'zoom'
        let previousMousePosition = { x: 0, y: 0 };
        let initialPinchDistance = null;
        
        let cameraTarget = new THREE.Vector3(0, 2, 0);
        let zoomDistance = 28;

        // --- SHADER: CLEAN HOLOGRAPHIC RIM GLOW ---
        const FresnelShader = {
            uniforms: {
                "glowColor": { value: new THREE.Color(0x00ffff) }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vViewPosition;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    vViewPosition = -mvPosition.xyz;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 glowColor;
                varying vec3 vNormal;
                varying vec3 vViewPosition;
                void main() {
                    vec3 normal = normalize(vNormal);
                    vec3 viewDir = normalize(vViewPosition);
                    // Sharp Fresnel for the holographic edge without muddying the center
                    float intensity = pow(1.0 - abs(dot(normal, viewDir)), 4.0);
                    gl_FragColor = vec4(glowColor, intensity);
                }
            `
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x550000); // Red Cyclorama environment

            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Sorting enabled to handle transparent layers correctly
            renderer.sortObjects = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            worldGroup = new THREE.Group();
            scene.add(worldGroup);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            const spot = new THREE.PointLight(0xffffff, 1);
            spot.position.set(10, 20, 10);
            scene.add(spot);

            createSeamlessRoom();
            createTonicAsset();
            
            setupControls();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createSeamlessRoom() {
            const roomGeo = new THREE.SphereGeometry(100, 64, 64);
            const roomMat = new THREE.MeshStandardMaterial({ 
                color: 0xaa0000, 
                side: THREE.BackSide,
                roughness: 1 
            });
            const room = new THREE.Mesh(roomGeo, roomMat);
            room.renderOrder = 0;
            scene.add(room);
        }

        function createTonicAsset() {
            bottleGroup = new THREE.Group();

            // STRUCTURE: Straight body up to 15.5, curve above tonic, straight vertical neck
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(2.8, 0, 0),
                new THREE.Vector3(2.8, 7.5, 0),
                new THREE.Vector3(2.8, 15.5, 0),
                new THREE.Vector3(1.1, 17.5, 0),
                new THREE.Vector3(1.1, 20, 0)
            ]);
            const points = curve.getPoints(128).map(p => new THREE.Vector2(p.x, p.y));
            const geometry = new THREE.LatheGeometry(points, 64);

            // 1. LIQUID - 75% Transparent (0.25 Opacity)
            // Rendered first in the sequence
            const liquidPoints = points.filter(p => p.y <= 15).map(p => p.clone());
            liquidPoints.push(new THREE.Vector2(0, 15)); 
            const liquidGeo = new THREE.LatheGeometry(liquidPoints, 64);
            const liquidMat = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.25,
                depthWrite: false // Allow bubbles to be seen through it easily
            });
            const liquid = new THREE.Mesh(liquidGeo, liquidMat);
            liquid.scale.set(0.98, 0.98, 0.98);
            liquid.renderOrder = 1;
            bottleGroup.add(liquid);

            // 2. BUBBLES - Additive Glowing Spheres
            const bubbleGeo = new THREE.SphereGeometry(0.12, 8, 8);
            const bubbleMat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                transparent: true, 
                opacity: 0.85,
                depthWrite: false,
                blending: THREE.AdditiveBlending // Makes them pop as light
            });
            for (let i = 0; i < 400; i++) {
                const b = new THREE.Mesh(bubbleGeo, bubbleMat);
                resetBubble(b);
                b.position.y = Math.random() * 14.8;
                b.renderOrder = 3; // Force bubbles on top of liquid
                bubbles.push(b);
                bottleGroup.add(b);
            }

            // 3. GLASS SHELL - Fresnel Outline
            const glassMat = new THREE.ShaderMaterial({
                uniforms: THREE.UniformsUtils.clone(FresnelShader.uniforms),
                vertexShader: FresnelShader.vertexShader,
                fragmentShader: FresnelShader.fragmentShader,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false // Crucial to prevent blocking inner content
            });
            const shell = new THREE.Mesh(geometry, glassMat);
            shell.renderOrder = 2; // Glass surrounds the liquid
            bottleGroup.add(shell);

            // 4. ROUNDED LID
            const capPoints = [
                new THREE.Vector2(0, 0),
                new THREE.Vector2(1.2, 0),
                new THREE.Vector2(1.2, 1.2),
                new THREE.Vector2(0.8, 1.8),
                new THREE.Vector2(0, 2.0)
            ];
            const capGeo = new THREE.LatheGeometry(capPoints, 32);
            const capMat = new THREE.MeshLambertMaterial({ color: 0x050505 });
            const cap = new THREE.Mesh(capGeo, capMat);
            cap.position.y = 20;
            bottleGroup.add(cap);

            // Internal Light for extra bloom on bubbles
            const pointLight = new THREE.PointLight(0x00ffff, 4, 40);
            pointLight.position.set(0, 8, 0);
            bottleGroup.add(pointLight);

            bottleGroup.position.y = -10;
            worldGroup.add(bottleGroup);
        }

        function resetBubble(b) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 2.6; // Body is 2.8, staying inside glass
            b.position.x = Math.cos(angle) * radius;
            b.position.y = 0.1;
            b.position.z = Math.sin(angle) * radius;
            b.userData.speed = 0.03 + Math.random() * 0.08;
            const scale = 0.3 + Math.random() * 0.9;
            b.scale.set(scale, scale, scale);
        }

        function setupControls() {
            const canvas = renderer.domElement;

            window.addEventListener('wheel', (e) => {
                zoomDistance = Math.max(8, Math.min(80, zoomDistance + e.deltaY * 0.03));
                updateCameraPosition();
            }, { passive: true });

            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            const onPointerMove = (x, y) => {
                if (!isDragging) return;
                const delta = { x: x - previousMousePosition.x, y: y - previousMousePosition.y };
                if (dragMode === 'rotate') {
                    worldGroup.rotation.y += delta.x * 0.007;
                    camera.position.y = Math.max(-10, Math.min(45, camera.position.y + delta.y * 0.06));
                } else if (dragMode === 'pan') {
                    const factor = zoomDistance * 0.0015;
                    cameraTarget.x -= delta.x * factor;
                    cameraTarget.y += delta.y * factor;
                }
                updateCameraPosition();
                previousMousePosition = { x, y };
            };

            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                dragMode = (e.button === 2) ? 'pan' : 'rotate';
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));

            // Multi-touch logic for Mobile
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                if (e.touches.length === 1) {
                    dragMode = 'rotate';
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                } else if (e.touches.length === 2) {
                    dragMode = 'multi';
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                    previousMousePosition = { 
                        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                    };
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1) {
                    onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
                } else if (e.touches.length === 2 && dragMode === 'multi') {
                    // Pinch Zoom
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const diff = distance - initialPinchDistance;
                    zoomDistance = Math.max(8, Math.min(80, zoomDistance - diff * 0.08));
                    initialPinchDistance = distance;

                    // 2-Finger Pan
                    const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    const panDelta = { x: centerX - previousMousePosition.x, y: centerY - previousMousePosition.y };
                    const factor = zoomDistance * 0.0015;
                    cameraTarget.x -= panDelta.x * factor;
                    cameraTarget.y += panDelta.y * factor;
                    previousMousePosition = { x: centerX, y: centerY };
                    updateCameraPosition();
                }
            }, { passive: false });

            window.addEventListener('touchend', () => { isDragging = false; initialPinchDistance = null; });
        }

        function updateCameraPosition() {
            camera.position.z = zoomDistance;
            camera.lookAt(cameraTarget);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            bubbles.forEach(b => {
                b.position.y += b.userData.speed;
                // Contained reset within the liquid volume
                if (b.position.y > 14.8) resetBubble(b);
                b.position.x += Math.sin(time * 2.0 + b.position.y) * 0.01;
                b.position.z += Math.cos(time * 2.0 + b.position.y) * 0.01;
            });
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
