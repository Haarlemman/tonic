<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolated Shape Reader - 15 FPS</title>
    <style>
        body {
            margin: 0;
            background: #080808;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Isolated portal with no border, background, or frame */
        .portal {
            position: relative;
            width: 120px;
            height: 120px;
            background: transparent;
        }

        #portalCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="portal">
            <canvas id="portalCanvas"></canvas>
        </div>
    </div>

    <!-- Hidden offscreen canvas to hold the master sprite sheet data -->
    <canvas id="bgCanvas" style="display: none;"></canvas>

    <script>
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const portalCanvas = document.getElementById('portalCanvas');
        const portalCtx = portalCanvas.getContext('2d');

        const sheetWidth = 1200;
        const sheetHeight = 1200;
        bgCanvas.width = sheetWidth;
        bgCanvas.height = sheetHeight;

        const cols = 16;
        const rows = 16;
        const cellW = sheetWidth / cols;
        const cellH = sheetHeight / rows;

        portalCanvas.width = cellW;
        portalCanvas.height = cellH;

        const colors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#ffffff', '#111111', '#9b59b6', '#e67e22'];
        const shapes = ['circle', 'square', 'triangle', 'star', 'cross', 'ring', 'diamond', 'hexagon'];

        // Draw master sprite sheet invisibly
        function drawMasterSheet(ctx) {
            ctx.clearRect(0, 0, sheetWidth, sheetHeight);

            let seed = 42;
            function random() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * cellW + cellW / 2;
                    const y = r * cellH + cellH / 2;
                    const size = Math.min(cellW, cellH) * 0.42;
                    
                    const shape = shapes[Math.floor(random() * shapes.length)];
                    const color = colors[Math.floor(random() * colors.length)];
                    const strokeColor = colors[Math.floor(random() * colors.length)];

                    ctx.save();
                    ctx.translate(x, y);
                    ctx.fillStyle = color;
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = 2.5;

                    switch(shape) {
                        case 'circle':
                            ctx.beginPath();
                            ctx.arc(0, 0, size, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.stroke();
                            break;
                        case 'square':
                            ctx.fillRect(-size, -size, size * 2, size * 2);
                            ctx.strokeRect(-size, -size, size * 2, size * 2);
                            break;
                        case 'triangle':
                            ctx.beginPath();
                            ctx.moveTo(0, -size);
                            ctx.lineTo(size, size);
                            ctx.lineTo(-size, size);
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                            break;
                        case 'star':
                            ctx.beginPath();
                            for (let i = 0; i < 5; i++) {
                                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * size, 
                                           Math.sin((18 + i * 72) * Math.PI / 180) * size);
                                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (size/2), 
                                           Math.sin((54 + i * 72) * Math.PI / 180) * (size/2));
                            }
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                            break;
                        case 'ring':
                            ctx.beginPath();
                            ctx.arc(0, 0, size, 0, Math.PI * 2);
                            ctx.lineWidth = 5;
                            ctx.stroke();
                            break;
                        case 'diamond':
                            ctx.beginPath();
                            ctx.moveTo(0, -size * 1.2);
                            ctx.lineTo(size * 1.2, 0);
                            ctx.lineTo(0, size * 1.2);
                            ctx.lineTo(-size * 1.2, 0);
                            ctx.closePath();
                            ctx.fill();
                            break;
                        case 'cross':
                            ctx.fillRect(-size * 0.3, -size, size * 0.6, size * 2);
                            ctx.fillRect(-size, -size * 0.3, size * 2, size * 0.6);
                            break;
                        case 'hexagon':
                            ctx.beginPath();
                            for (let i = 0; i < 6; i++) {
                                let angle = (i * Math.PI) / 3;
                                let hx = Math.cos(angle) * size;
                                let hy = Math.sin(angle) * size;
                                if (i === 0) ctx.moveTo(hx, hy);
                                else ctx.lineTo(hx, hy);
                            }
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                            break;
                    }
                    ctx.restore();
                }
            }
        }

        drawMasterSheet(bgCtx);

        let currentIndex = 0;
        const totalCells = cols * rows;

        // Sequentially read from top-left to bottom-right
        function updatePortal() {
            const c = currentIndex % cols;
            const r = Math.floor(currentIndex / cols);

            const srcX = c * cellW;
            const srcY = r * cellH;

            portalCtx.clearRect(0, 0, cellW, cellH);
            portalCtx.drawImage(bgCanvas, srcX, srcY, cellW, cellH, 0, 0, cellW, cellH);

            currentIndex = (currentIndex + 1) % totalCells;
        }

        updatePortal();
        // 15 frames per second = 1000ms / 15 ≈ 66.67ms
        setInterval(updatePortal, 1000 / 15);
    </script>
</body>
</html>
