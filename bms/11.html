<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triangle - Bauhaus Style</title>
<style>
  body {
    margin: 0;
    font-family: 'Raleway', sans-serif;
    background: #f0f0f0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .triangle-container {
    position: relative;
    width: 300px;
    height: 260px;
    transform: rotate(-12deg); /* slight slant like Bauhaus posters */
  }

  /* Triangle lines */
  .triangle-line {
    position: absolute;
    width: 2px;
    background: #222;
    transform-origin: top left;
  }

  /* Spheres */
  .sphere {
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 0 rgba(0,0,0,0);
  }

  .sphere.art { background: #ff0000; top: -25px; left: 50%; transform: translateX(-50%); }
  .sphere.science { background: #ffff00; bottom: -25px; left: 0; }
  .sphere.spirit { background: #0000ff; bottom: -25px; right: 0; }

  /* Minimal labels */
  .label {
    position: absolute;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 0.9em;
    text-align: center;
    pointer-events: none;
  }

  .label.art { top: 40px; left: 50%; transform: translateX(-50%); }
  .label.science { bottom: -50px; left: 0; }
  .label.spirit { bottom: -50px; right: 0; }

  /* Side panel */
  .side-panel {
    position: fixed;
    top: 0;
    right: -360px;
    width: 320px;
    height: 100%;
    background: #fff;
    box-shadow: -2px 0 8px rgba(0,0,0,0.2);
    transition: right 0.3s ease;
    padding: 20px;
    overflow-y: auto;
  }

  .side-panel.active {
    right: 0;
  }

  .side-panel h2 {
    margin-top: 0;
    font-size: 1.5em;
  }

  .close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 20px;
    cursor: pointer;
  }

  /* Lines connecting spheres */
  .line {
    position: absolute;
    background: #222;
  }

</style>
</head>
<body>

<div class="triangle-container">
  <!-- Lines connecting spheres -->
  <div class="line" style="top: 25px; left: 50%; width: 150px; height: 2px; transform: rotate(60deg); transform-origin: left;"></div>
  <div class="line" style="bottom: 25px; left: 0; width: 150px; height: 2px; transform: rotate(-60deg); transform-origin: left;"></div>
  <div class="line" style="bottom: 25px; left: 0; width: 150px; height: 2px;"></div>

  <!-- Spheres -->
  <div class="sphere art" onclick="openPanel('Art')"></div>
  <div class="sphere science" onclick="openPanel('Science')"></div>
  <div class="sphere spirit" onclick="openPanel('Spirit')"></div>

  <!-- Labels -->
  <div class="label art">ART</div>
  <div class="label science">SCIENCE</div>
  <div class="label spirit">SPIRIT</div>
</div>

<!-- Side panel -->
<div class="side-panel" id="sidePanel">
  <span class="close-btn" onclick="closePanel()">&times;</span>
  <h2 id="panelTitle">Title</h2>
  <p id="panelContent">Content goes here...</p>
</div>

<script>
  const sidePanel = document.getElementById('sidePanel');
  const panelTitle = document.getElementById('panelTitle');
  const panelContent = document.getElementById('panelContent');

  const content = {
    "Art": "Art touches the body — movement, rhythm, creation.",
    "Science": "Science sharpens the mind — reason, inquiry, discovery.",
    "Spirit": "Spirit nourishes the soul — connection, meaning, transcendence."
  };

  function openPanel(topic) {
    panelTitle.textContent = topic;
    panelContent.textContent = content[topic];
    sidePanel.classList.add('active');
  }

  function closePanel() {
    sidePanel.classList.remove('active');
  }
</script>

</body>
</html>
