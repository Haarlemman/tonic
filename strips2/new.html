<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <title>Suske & Wiske - 4 kleurenreeks</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color, #FF6B6B), var(--secondary-color, #FF8E53));
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        nav {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            background: white;
            color: #333;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 140px;
        }

        nav a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        nav a.active {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #FF6B6B;
            box-shadow: 0 0 0 3px rgba(255,107,107,0.1);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #FF6B6B;
            color: white;
            border-color: #FF6B6B;
        }

        .stats {
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .comics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 100px;
        }

        .comic-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .comic-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .comic-card.selected {
            border: 3px solid #FF6B6B;
            transform: translateY(-5px);
        }

        .comic-image {
            width: 100%;
            height: 300px;
            background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 48px;
            position: relative;
        }

        .comic-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comic-info {
            padding: 20px;
        }

        .comic-number {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        .comic-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .comic-details {
            color: #666;
            font-size: 14px;
            line-height: 1.4;
        }

        .comic-price {
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }

        .image-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .image-popup img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .popup-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 1001;
        }

        .buy-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(40,167,69,0.4);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .buy-button:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        .buy-button:not(:disabled):hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(40,167,69,0.6);
        }

        .selected-count {
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 20px;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .comics-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                min-width: auto;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body data-category="suske-wiske" class="comic-page">
    <div class="container">
        <div class="header" style="--primary-color: #FF6B6B; --secondary-color: #FF8E53;">
            <button class="back-button" onclick="window.location.href='/strips/'">← Terug</button>
            <h1>Suske & Wiske - 4 kleurenreeks</h1>
            <p>uit de verzameling van David Enker te Haarlem</p>
        </div>
        
        <nav>
            <a href="/strips/">Terug naar overzicht</a>
            <a href="sw-4k.html" class="active">Suske & Wiske<br>(4 kleurenreeks)</a>
            <a href="sw-br.html">Suske & Wiske<br>(buiten reeks)</a>
            <a href="franquin.html">Franquin</a>
            <a href="disney.html">Disney</a>
        </nav>

        <div class="controls">
            <input type="text" class="search-box" placeholder="Zoek op titel, nummer of beschrijving..." id="searchInput">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Alle</button>
                <button class="filter-btn" data-filter="available">Beschikbaar</button>
                <button class="filter-btn" data-filter="sold">Verkocht</button>
            </div>
        </div>

        <div class="stats" id="stats">
            <span id="totalCount">0</span> strips gevonden
        </div>
        
        <div class="tab-content">
            <div id="grid" class="comics-grid">
                <div class="loading">Strips worden geladen...</div>
            </div>
        </div>
    </div>
    
    <div id="popup" class="image-popup">
        <img id="popimg" alt="">
        <span class="popup-close">×</span>
    </div>
    
    <button id="buyBtn" class="buy-button" disabled>
        Koop of informeer <span id="badge" class="selected-count">0</span>
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        class ComicCollection {
            constructor() {
                this.comics = [];
                this.selectedComics = new Set();
                this.currentFilter = 'all';
                this.searchTerm = '';
                
                this.init();
            }

            async init() {
                await this.loadData();
                this.setupEventListeners();
                this.renderComics();
                this.updateStats();
            }

            async loadData() {
                const csvUrls = [
                    'https://docs.google.com/spreadsheets/d/e/2PACX-1vR-AJ2_vyyxvfpdRPd3v6MXbbI8bPF7-fLNpQx7jOGnm8mXoIhh-Gkza5xMtG8WKUHGy5ILCkBT5L-R/pub?gid=1026598690&single=true&output=csv'
                ];

                try {
                    for (const url of csvUrls) {
                        const response = await fetch(url);
                        const csvData = await response.text();
                        
                        const parsed = Papa.parse(csvData, {
                            header: true,
                            skipEmptyLines: true,
                            dynamicTyping: true
                        });
                        
                        this.comics.push(...parsed.data.map((row, index) => ({
                            id: `comic-${index}`,
                            number: row.Nummer || row.Number || row.Nr || index + 1,
                            title: row.Titel || row.Title || row.Naam || 'Onbekende titel',
                            year: row.Jaar || row.Year || row.Uitgave || '',
                            publisher: row.Uitgever || row.Publisher || '',
                            condition: row.Staat || row.Condition || '',
                            price: row.Prijs || row.Price || '',
                            available: row.Beschikbaar !== 'Nee' && row.Available !== 'No',
                            description: row.Beschrijving || row.Description || '',
                            image: row.Afbeelding || row.Image || '',
                            category: 'suske-wiske-4k'
                        })));
                    }
                } catch (error) {
                    console.error('Error loading data:', error);
                    // Fallback sample data for demonstration
                    this.comics = this.generateSampleData();
                }
            }

            generateSampleData() {
                const sampleTitles = [
                    'De Blauwe Vogels', 'De Texasrakkers', 'De Sprookjesspiraal', 
                    'De Groene Splinter', 'De Schat van Beersel', 'De Zwarte Madam',
                    'Het Vliegende Paard', 'De Tovenares van Rokendil', 'De Krimson Krekel',
                    'De Spokenjagers', 'Het Eiland Amoras', 'De Wilde Weldoener',
                    'De Gouden Cirkel', 'Het Geheim van de Incas', 'De Reuze van Morganlé',
                    'Het Spook van Canterville', 'De Zingende Zwammen', 'Het Hondenparadijs',
                    'De Vreemde Gedaante', 'Het Mysterie van de Grauwe Raaf'
                ];

                return sampleTitles.map((title, index) => ({
                    id: `comic-${index}`,
                    number: index + 1,
                    title: title,
                    year: 1950 + Math.floor(Math.random() * 30),
                    publisher: 'Standaard Uitgeverij',
                    condition: ['Zeer goed', 'Goed', 'Redelijk', 'Matig'][Math.floor(Math.random() * 4)],
                    price: `€${(Math.random() * 50 + 10).toFixed(2)}`,
                    available: Math.random() > 0.3,
                    description: `Klassiek Suske & Wiske verhaal uit de 4-kleurenreeks.`,
                    image: '',
                    category: 'suske-wiske-4k'
                }));
            }

            setupEventListeners() {
                // Search functionality
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchTerm = e.target.value.toLowerCase();
                    this.renderComics();
                    this.updateStats();
                });

                // Filter buttons
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentFilter = e.target.dataset.filter;
                        this.renderComics();
                        this.updateStats();
                    });
                });

                // Image popup
                document.getElementById('popup').addEventListener('click', (e) => {
                    if (e.target.id === 'popup' || e.target.classList.contains('popup-close')) {
                        document.getElementById('popup').style.display = 'none';
                    }
                });

                // Buy button
                document.getElementById('buyBtn').addEventListener('click', () => {
                    this.handlePurchase();
                });
            }

            filterComics() {
                return this.comics.filter(comic => {
                    const matchesSearch = !this.searchTerm || 
                        comic.title.toLowerCase().includes(this.searchTerm) ||
                        comic.number.toString().includes(this.searchTerm) ||
                        comic.description.toLowerCase().includes(this.searchTerm);

                    const matchesFilter = this.currentFilter === 'all' ||
                        (this.currentFilter === 'available' && comic.available) ||
                        (this.currentFilter === 'sold' && !comic.available);

                    return matchesSearch && matchesFilter;
                });
            }

            renderComics() {
                const filteredComics = this.filterComics();
                const grid = document.getElementById('grid');

                if (filteredComics.length === 0) {
                    grid.innerHTML = '<div class="loading">Geen strips gevonden met de huidige filters.</div>';
                    return;
                }

                grid.innerHTML = filteredComics.map(comic => `
                    <div class="comic-card ${this.selectedComics.has(comic.id) ? 'selected' : ''}" 
                         data-id="${comic.id}">
                        <div class="comic-image" onclick="app.showImage('${comic.image}')">
                            ${comic.image ? 
                                `<img src="${comic.image}" alt="${comic.title}" onerror="this.style.display='none'">` :
                                '📖'
                            }
                        </div>
                        <div class="comic-info">
                            <div class="comic-number">Nr. ${comic.number}</div>
                            <div class="comic-title">${comic.title}</div>
                            <div class="comic-details">
                                ${comic.year ? `Jaar: ${comic.year}<br>` : ''}
                                ${comic.publisher ? `Uitgever: ${comic.publisher}<br>` : ''}
                                ${comic.condition ? `Staat: ${comic.condition}<br>` : ''}
                                ${comic.description ? `${comic.description}` : ''}
                            </div>
                            ${comic.available ? 
                                `<div class="comic-price">${comic.price}</div>` :
                                '<div style="color: #dc3545; font-weight: bold; margin-top: 10px;">Verkocht</div>'
                            }
                        </div>
                    </div>
                `).join('');

                // Add click listeners for selection
                document.querySelectorAll('.comic-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        // Don't select if clicking on image
                        if (e.target.tagName === 'IMG' || e.target.classList.contains('comic-image')) return;
                        
                        const comicId = card.dataset.id;
                        const comic = this.comics.find(c => c.id === comicId);
                        
                        if (comic && comic.available) {
                            this.toggleSelection(comicId);
                            card.classList.toggle('selected');
                            this.updateBuyButton();
                        }
                    });
                });
            }

            showImage(imageSrc) {
                if (imageSrc) {
                    document.getElementById('popimg').src = imageSrc;
                    document.getElementById('popup').style.display = 'flex';
                }
            }

            toggleSelection(comicId) {
                if (this.selectedComics.has(comicId)) {
                    this.selectedComics.delete(comicId);
                } else {
                    this.selectedComics.add(comicId);
                }
            }

            updateBuyButton() {
                const buyBtn = document.getElementById('buyBtn');
                const badge = document.getElementById('badge');
                const count = this.selectedComics.size;
                
                badge.textContent = count;
                buyBtn.disabled = count === 0;
            }

            updateStats() {
                const filteredComics = this.filterComics();
                document.getElementById('totalCount').textContent = filteredComics.length;
            }

            handlePurchase() {
                if (this.selectedComics.size === 0) return;

                const selectedTitles = Array.from(this.selectedComics)
                    .map(id => this.comics.find(c => c.id === id))
                    .filter(Boolean)
                    .map(comic => `${comic.number}. ${comic.title}`)
                    .join('\n');

                const message = `Hallo David,\n\nIk ben geïnteresseerd in de volgende Suske & Wiske strips:\n\n${selectedTitles}\n\nKunt u mij meer informatie geven over beschikbaarheid en prijs?\n\nMet vriendelijke groet`;
                
                const mailtoLink = `mailto:david@enker.nl?subject=Interesse in Suske & Wiske strips&body=${encodeURIComponent(message)}`;
                window.location.href = mailtoLink;
            }
        }

        // Initialize the application
        const app = new ComicCollection();
    </script>
</body>
</html>
