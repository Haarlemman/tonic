<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <title>Strips - Verzameling van David Enker</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            text-align: center;
        }
        .header {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #333;
        }
        p {
            font-size: 1.1em;
            color: #666;
        }
        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
        }
        .thumbnail-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .thumbnail-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .thumbnail-image {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
        }
        .thumbnail-card:nth-child(2) .thumbnail-image {
            background: linear-gradient(135deg, #20c997, #28a745);
        }
        .thumbnail-card:nth-child(3) .thumbnail-image {
            background: linear-gradient(135deg, #ffc107, #fd7e14);
        }
        .thumbnail-card:nth-child(4) .thumbnail-image {
            background: linear-gradient(135deg, #007bff, #6f42c1);
        }
        .thumbnail-info {
            padding: 20px;
        }
        @media (max-width: 768px) {
            .thumbnails-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>David's Strips</h1>
            <p>De verzameling van David Enker te Haarlem</p>
        </div>
        <div class="thumbnails-grid">
            <a href="sw-4k.html" class="thumbnail-card">
                <div class="thumbnail-image">Suske & Wiske (4 kleurenreeks)</div>
            </a>
            <a href="sw-br.html" class="thumbnail-card">
                <div class="thumbnail-image">Suske & Wiske (buiten reeks)</div>
            </a>
            <a href="franquin.html" class="thumbnail-card">
                <div class="thumbnail-image">Franquin</div>
            </a>
            <a href="disney.html" class="thumbnail-card">
                <div class="thumbnail-image">Disney</div>
            </a>
        </div>
    </div>
</body>
</html>
