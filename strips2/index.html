            { title: "Guust", issue: "3", publisher: "Guust Flater", grade: "goed", price: "10", notes: "1984, Franquin collectie" },
        ];

        // --- MAIN APPLICATION ---
        function App() {
            const [inventory, setInventory] = useState(USER_DATA);
            const [searchTerm, setSearchTerm] = useState("");
            const [filterPublisher, setFilterPublisher] = useState("Alles");
            const [showImporter, setShowImporter] = useState(false);
            const [csvText, setCsvText] = useState("");

            // Statistics
            const stats = useMemo(() => {
                const totalItems = inventory.length;
                const parsePrice = (p) => {
                    if (!p) return 0;
                    const clean = p.toString().replace(/,/g, '.').replace(/[^0-9.]/g, '');
                    return parseFloat(clean) || 0;
                };

                const totalValue = inventory.reduce((acc, item) => acc + parsePrice(item.price), 0);
                const publishers = [...new Set(inventory.map(i => i.publisher || "Onbekend"))].sort();
                
                const sortedByPrice = [...inventory].sort((a, b) => parsePrice(b.price) - parsePrice(a.price));
                const topItem = sortedByPrice[0] || { title: "N/A", price: 0 };

                return { totalItems, totalValue, publishers, topItem };
            }, [inventory]);

            // Filtering
            const filteredInventory = useMemo(() => {
                return inventory.filter(item => {
                    const matchesSearch = 
                        (item.title && item.title.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (item.notes && item.notes.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (item.publisher && item.publisher.toLowerCase().includes(searchTerm.toLowerCase()));
                    const matchesPublisher = filterPublisher === "Alles" || item.publisher === filterPublisher;
                    return matchesSearch && matchesPublisher;
                });
            }, [inventory, searchTerm, filterPublisher]);

            // Import Logic
            const handleImport = () => {
                if (!csvText) return;
                try {
                    const lines = csvText.trim().split('\n');
                    const headers = lines[0].split(/,|;/).map(h => h.trim().toLowerCase().replace(/"/g, ''));
                    
                    const newInventory = lines.slice(1).map(line => {
                        const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)|;/); 
                        const entry = { title: "", issue: "", publisher: "Onbekend", grade: "", price: "", notes: "", image: "" };
                        
                        headers.forEach((h, index) => {
                            let val = values[index] ? values[index].replace(/^"|"$/g, '').trim() : "";
                            
                            if (h === 'titel' || h === 'title') entry.title = val;
                            if (h === 'nr' || h === 'issue') entry.issue = val;
                            if (h === 'serie' || h === 'reeks' || h === 'publisher') entry.publisher = val;
                            if (h === 'conditie' || h === 'grade') entry.grade = val;
                            if (h === 'prijs' || h === 'price') entry.price = val;
                            if (h === 'afbeelding' || h === 'image' || h === 'img') entry.image = val;
                            
                            if (h === 'bijzonderheden' || h === 'druk' || h === 'auteur' || h === 'meer info') {
                                if (val) entry.notes = entry.notes ? `${entry.notes}, ${val}` : val;
                            }
                        });

                        if (!entry.title && !entry.issue) return null;
                        return entry;
                    }).filter(Boolean);

                    setInventory([...inventory, ...newInventory]);
                    setShowImporter(false);
                    setFilterPublisher("Alles");
                } catch (e) {
                    alert("Fout bij het laden van CSV. Controleer het formaat.");
                }
            };

            return (
                <div className="min-h-screen bg-stone-50 font-sans text-stone-900 pb-12">
                    {/* Header Bar - Tighter & Horizontal */}
                    <div className="bg-yellow-400 border-b-4 border-black py-4 px-4 shadow-sm relative overflow-hidden">
                        <div className="absolute inset-0 opacity-10 halftone"></div>
                        <div className="max-w-6xl mx-auto relative z-10 flex flex-col md:flex-row justify-between items-center gap-4">
                            
                            {/* Title Left */}
                            <div className="text-left">
                                <h1 className="text-3xl md:text-4xl font-black text-black tracking-tighter uppercase italic drop-shadow-sm leading-none">
                                    De Vreemde Verzameling
                                </h1>
                                <p className="text-sm md:text-base font-medium text-stone-800 font-serif mt-1">
                                    Een unieke collectie strips & graphic novels • Haarlem, NL
                                </p>
                            </div>
                            
                            {/* Buttons Right - Small & Compact */}
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => document.getElementById('inventory').scrollIntoView({ behavior: 'smooth' })}
                                    className="bg-black text-white px-3 py-2 font-bold text-xs hover:bg-stone-800 transition-all shadow-md flex items-center gap-2 uppercase tracking-wide rounded-sm">
                                    <Icons.BookOpen size={14} />
                                    Bekijk Lijst
                                </button>
                                <button 
                                    onClick={() => setShowImporter(true)}
                                    className="bg-white text-black border border-black px-3 py-2 font-bold text-xs hover:bg-yellow-50 transition-all shadow-md flex items-center gap-2 uppercase tracking-wide rounded-sm">
                                    <Icons.Upload size={14} />
                                    Gegevens Laden
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Stats Dashboard - Tighter spacing */}
                    <div className="max-w-6xl mx-auto px-4 mt-6 relative z-20 mb-8">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <StatCard 
                                icon={<Icons.Hash className="text-blue-600" />}
                                label="Aantal Items" 
                                value={stats.totalItems} 
                            />
                            <StatCard 
                                icon={<Icons.Award className="text-purple-600" />}
                                label="Topstuk" 
                                value={stats.topItem.title} 
                                subValue={`${stats.topItem.publisher} • €${stats.topItem.price}`}
                            />
                            <StatCard 
                                icon={<Icons.DollarSign className="text-green-600" />}
                                label="Totale Waarde" 
                                value={`€${stats.totalValue.toLocaleString('nl-NL', { minimumFractionDigits: 2 })}`} 
                            />
                        </div>
                    </div>

                    {/* Inventory */}
                    <div id="inventory" className="max-w-6xl mx-auto px-4">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-4 gap-3 bg-white p-3 rounded-lg shadow-sm border border-stone-200">
                            <div className="flex items-center gap-2 w-full md:w-auto relative">
                                <span className="absolute left-3 text-stone-400"><Icons.Search size={16} /></span>
                                <input 
                                    type="text" 
                                    placeholder="Zoek op titel, nummer, jaartal..." 
                                    className="pl-9 pr-4 py-1.5 border border-stone-300 rounded focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 w-full md:w-64 outline-none text-sm"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                            
                            <div className="flex items-center gap-2 w-full md:w-auto">
                                <span className="text-stone-400"><Icons.Filter size={16} /></span>
                                <select 
                                    className="py-1.5 px-3 border border-stone-300 rounded focus:ring-2 focus:ring-yellow-400 outline-none bg-white w-full md:w-auto text-sm"
                                    value={filterPublisher}
                                    onChange={(e) => setFilterPublisher(e.target.value)}
                                >
                                    <option value="Alles">Alle Series</option>
                                    {stats.publishers.map(pub => (
                                        <option key={pub} value={pub}>{pub}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div className="bg-white shadow-lg rounded-lg border border-stone-200 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead className="bg-stone-100 border-b border-stone-200 text-stone-600">
                                        <tr>
                                            <th className="p-3 font-bold text-xs uppercase tracking-wider w-1/3">Titel & Nummer</th>
                                            <th className="p-3 font-bold text-xs uppercase tracking-wider">Serie</th>
                                            <th className="p-3 font-bold text-xs uppercase tracking-wider">Conditie</th>
                                            <th className="p-3 font-bold text-xs uppercase tracking-wider">Details</th>
                                            <th className="p-3 font-bold text-xs uppercase tracking-wider text-right">Prijs</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-stone-100">
                                        {filteredInventory.length > 0 ? (
                                            filteredInventory.map((item, idx) => (
                                                <tr key={idx} className="hover:bg-yellow-50 transition-colors">
                                                    <td className="p-3">
                                                        <div className="flex items-start gap-3">
                                                            {item.image && (
                                                                <img src={item.image} alt={item.title} className="w-10 h-14 object-cover border border-stone-200 shadow-sm rounded-sm" />
                                                            )}
                                                            <div>
                                                                <div className="font-bold text-stone-900 text-base leading-tight">{item.title}</div>
                                                                {item.issue && <div className="text-stone-500 text-xs mt-0.5">Nr. {item.issue}</div>}
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td className="p-3">
                                                        <span className="inline-block px-2 py-0.5 rounded bg-stone-100 text-stone-700 text-[10px] font-bold uppercase whitespace-nowrap">
                                                            {item.publisher}
                                                        </span>
                                                    </td>
                                                    <td className="p-3">
                                                        {item.grade && item.grade !== '-' ? (
                                                            <span className="font-medium text-stone-700 text-xs bg-blue-50 px-2 py-0.5 rounded text-blue-800 uppercase whitespace-nowrap">
                                                                {item.grade}
                                                            </span>
                                                        ) : <span className="text-stone-300">-</span>}
                                                    </td>
                                                    <td className="p-3 text-xs text-stone-500 italic max-w-xs truncate">
                                                        {item.notes}
                                                    </td>
                                                    <td className="p-3 text-right whitespace-nowrap">
                                                        {parseFloat(item.price) > 0 ? (
                                                            <div className="font-bold text-emerald-700 text-base">
                                                                €{parseFloat(item.price).toLocaleString('nl-NL', { minimumFractionDigits: 2 })}
                                                            </div>
                                                        ) : <span className="text-[10px] text-stone-400 uppercase font-bold">Bieden</span>}
                                                    </td>
                                                </tr>
                                            ))
                                        ) : (
                                            <tr>
                                                <td colSpan="5" className="p-8 text-center text-stone-400 italic">Geen strips gevonden.</td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* Footer - Compact */}
                    <div className="max-w-4xl mx-auto px-4 text-center mt-12 pt-6 border-t border-stone-300">
                         <p className="mb-3 font-serif italic text-base text-stone-500">
                            "The more you learn, the more you realise you know nothing."
                        </p>
                        <a href="mailto:your-email@example.com" className="inline-flex items-center gap-2 bg-black text-white px-4 py-1.5 rounded-full hover:bg-yellow-400 hover:text-black transition-colors font-bold text-sm">
                            <Icons.Mail size={14} />
                            Contact
                        </a>
                    </div>

                    {/* Importer Modal */}
                    {showImporter && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-lg shadow-2xl w-full max-w-2xl overflow-hidden border border-stone-300">
                                <div className="bg-stone-100 p-3 border-b border-stone-200 flex justify-between items-center">
                                    <h3 className="font-bold text-stone-800 flex items-center gap-2 text-sm">
                                        <Icons.Upload size={16} />
                                        Data Toevoegen
                                    </h3>
                                    <button onClick={() => setShowImporter(false)} className="p-1 hover:bg-stone-200 rounded text-stone-500">
                                        <Icons.X size={18} />
                                    </button>
                                </div>
                                <div className="p-4">
                                    <p className="text-xs text-stone-600 mb-2">
                                        Plak hier CSV data. Kolommen: Titel, nr, Serie, Prijs, Conditie, Afbeelding.
                                    </p>
                                    <textarea 
                                        className="w-full h-40 border border-stone-300 rounded p-2 font-mono text-xs focus:ring-2 focus:ring-yellow-400 outline-none bg-stone-50"
                                        placeholder="Plak hier je tekst..."
                                        value={csvText}
                                        onChange={(e) => setCsvText(e.target.value)}
                                    />
                                </div>
                                <div className="p-3 bg-stone-50 border-t border-stone-200 flex justify-end gap-2">
                                    <button onClick={() => setShowImporter(false)} className="px-3 py-1.5 text-stone-600 font-medium hover:text-stone-900 text-xs">Annuleren</button>
                                    <button onClick={handleImport} className="px-4 py-1.5 bg-yellow-400 text-black font-bold rounded hover:bg-yellow-300 text-xs shadow-sm">Verwerken</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StatCard({ icon, label, value, subValue }) {
            return (
                <div className="bg-white p-3 rounded-lg shadow-sm border border-stone-200 flex items-center gap-3">
                    <div className="p-2 bg-stone-50 rounded-full border border-stone-100">{icon}</div>
                    <div className="overflow-hidden">
                        <div className="text-stone-500 font-bold text-[10px] uppercase tracking-wide">{label}</div>
                        <div className="text-lg font-black text-stone-900 truncate leading-none">{value}</div>
                        {subValue && <div className="text-[10px] text-stone-500 truncate mt-0.5">{subValue}</div>}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
