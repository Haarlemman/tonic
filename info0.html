<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonic for the Bones | Kinetic Narrative</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Special+Elite&display=swap');

        :root {
            --bg-color: #0d0d0d;
            --accent-yellow: #ffcc00;
            --paper-texture: url('https://www.transparenttextures.com/patterns/stardust.png');
            --font-mono: 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Oswald', sans-serif;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            touch-action: none;
        }

        /* Saul Bass Texture Overlay */
        #stage::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--paper-texture);
            opacity: 0.12;
            pointer-events: none;
            z-index: 40;
        }

        #stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px; 
            z-index: 10;
        }

        /* --- Brand & HUD Persistence --- */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .brand-box {
            background: rgba(255, 255, 255, 0.5); 
            color: #111; 
            padding: 12px 20px;
            display: inline-block;
            pointer-events: auto;
            border-left: 4px solid var(--accent-yellow);
            transition: all 0.3s ease;
            text-decoration: none;
            backdrop-filter: blur(4px); 
        }

        .brand-box h1 {
            margin: 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            line-height: 1;
        }

        .sub-brand {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            margin-top: 4px;
            color: #333;
        }

        .hud-btn {
            background: #111;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.65rem;
            letter-spacing: 1px;
            transition: 0.2s;
            pointer-events: auto;
        }

        .hud-btn:hover {
            background: white;
            color: black;
            border-color: white;
        }

        #general-menu {
            position: absolute;
            top: 70px;
            right: 20px;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            width: 180px;
            display: none;
            flex-direction: column;
            gap: 2px;
            pointer-events: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        #general-menu.active {
            display: flex;
        }

        .menu-link {
            color: #999;
            text-decoration: none;
            font-size: 0.7rem;
            padding: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: color 0.2s;
        }

        .menu-link:hover {
            color: white;
        }

        /* --- Kinetic Text Styles --- */
        .kinetic-text {
            position: absolute;
            white-space: nowrap;
            text-transform: uppercase;
            font-size: 10vw; 
            line-height: 0.85;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
            transform-style: preserve-3d;
            transition: opacity 0.4s ease-out;
        }

        @media (max-width: 768px) {
            .kinetic-text {
                font-size: 16vw; /* Maximum impact on mobile */
            }
        }

        /* Epilogue Strobe Effect - Slow Motion */
        @keyframes strobeFade {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.05; }
        }

        .strobe-effect {
            animation: strobeFade 3.5s infinite ease-in-out;
        }

        .solid-block {
            background: currentColor;
            color: var(--bg-color) !important;
            padding: 0.05em 0.25em;
            display: inline-block;
        }

        .word-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .active {
            opacity: 1;
        }

        .exit {
            opacity: 0 !important;
            filter: blur(20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #start-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .btn-bass {
            border: 4px solid white;
            padding: 15px 40px;
            font-size: 1.5rem;
            background: none;
            color: white;
            text-transform: uppercase;
            letter-spacing: 5px;
            transition: 0.3s;
        }

        .btn-bass:hover {
            background: white;
            color: black;
        }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="beginSequence()">
        <button class="btn-bass">Sync & Play</button>
        <p class="mt-4 text-gray-500 uppercase tracking-widest text-xs">Tap for Fullscreen Perspective</p>
    </div>

    <!-- HUD Layer -->
    <div id="hud-layer">
        <div style="display:flex; justify-content:space-between; align-items: flex-start;">
            <a href="#" class="brand-box">
                <h1>University<br>of Free Will</h1>
                <div class="sub-brand">ADVERSITY IS YOUR TEACHER</div>
            </a>
            <div style="pointer-events: auto;">
                <button class="hud-btn" onclick="toggleMenu()">Menu</button>
            </div>
            <div id="general-menu">
                <div style="color:white; font-size:0.5rem; padding:8px; border-bottom:1px solid #333; margin-bottom:5px;">CAMPUS DIRECTORY</div>
                <a href="index.html" class="menu-link">Campus Map</a>
                <a href="#" class="menu-link" style="color:white">Info Desk</a>
                <a href="art.html" class="menu-link">Artistic Core</a>
                <a href="science.html" class="menu-link">Scientific Method</a>
                <a href="spirit.html" class="menu-link">Spiritual Path</a>
            </div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
            <div id="ui-info" style="font-family:'Special Elite', cursive; font-size:0.7rem; color:#444;">
                SYNC: <span id="time-display">0:00:00</span>
            </div>
            <div id="audio-status" style="font-family:'Special Elite', sans-serif; font-size:0.6rem; color:var(--accent-yellow); text-transform:uppercase;">
                Audio Lead: ACTIVE
            </div>
        </div>
    </div>

    <div id="stage"></div>

    <audio id="bg-music" crossorigin="anonymous">
        <source src="audio/MysteriousHeartbeat2.mp3" type="audio/mpeg">
    </audio>

    <script>
        const stage = document.getElementById('stage');
        const timeDisplay = document.getElementById('time-display');
        const audioStatus = document.getElementById('audio-status');
        const music = document.getElementById('bg-music');
        const menu = document.getElementById('general-menu');

        let audioCtx, analyser, dataArray;
        let isAudioInit = false;
        let beatIntensity = 0;
        let activeElements = [];
        let startTime = 0;
        let isRunning = false;
        let currentSlot = 0;
        let wakeLock = null;

        function toggleMenu() {
            menu.classList.toggle('active');
        }

        // --- Core Narrative ---
        const narrative = [
            { time: "0:00:00", text: "When life takes", color: "#fff" },
            { time: "0:03:00", text: "instead of gives" },
            { time: "0:04:29", text: "an illness", color: "#99cc66" },
            { time: "0:07:00", text: "or worse", color: "#ff3333" },
            { time: "0:11:16", text: "the world" },
            { time: "0:13:00", text: "turns upside down", special: "flip" },
            { time: "0:19:18", text: "you're left wondering", special: "stack" },
            { time: "0:23:20", text: "what to do." },
            { time: "0:29:00", text: "Luckily", color: "#ffcc00" },
            { time: "0:31:00", text: "there is a way" },
            { time: "0:33:00", text: "to laugh" },
            { time: "0:35:00", text: "in the face of adversity", special: "stack" },
            { time: "0:37:00", text: "all it requires" },
            { time: "0:39:00", text: "is" },
            { time: "0:40:00", text: "a shift", color: "#ffcc00" },
            { time: "0:41:00", text: "in thinking" },
            { time: "0:42:00", text: "feeling" },
            { time: "0:43:00", text: "and knowing." },
            { time: "0:45:00", text: "A leap of faith", special: "stack" },
            { time: "0:47:00", text: "embrace the pain", color: "#ccff00" },
            { time: "0:48:00", text: "accept your path" },
            { time: "0:49:00", text: "create", color: "#fff" },
            { time: "0:50:00", text: "communicate", color: "#fff" },
            { time: "0:51:00", text: "concentrate", color: "#fff" },
            { time: "0:52:00", text: "and let go" },
            { time: "0:53:00", text: "it will be" },
            { time: "0:54:00", text: "a balm...", color: "#ee9900" },
            { time: "0:55:00", text: "...for the soul", color: "#ee9900" },
            { time: "0:56:00", text: "a tonic...", color: "#eeff33" },
            { time: "0:57:29", text: "...for the bones.", color: "#eeff33" }
        ];

        // --- Random Epilogue Words ---
        const epilogueWords = ["ART", "KNOWLEDGE", "WISDOM", "LOVE", "CONSOLATION", "SOLACE", "UNDERSTANDING", "FREEDOM", "TRUTH", "TIME", "GRACE", "MEMORY", "CREATION", "PERSPECTIVE"];
        const epilogueColors = ["#ff4d4d", "#4d94ff", "#66cc66", "#ffcc00", "#ff8c1a", "#cc66ff", "#ffffff", "#00cccc"];
        let lastBeatSpawn = 0;

        function parseTime(timeStr) {
            const parts = timeStr.split(':');
            const m = parseInt(parts[0]);
            const s = parseInt(parts[1]);
            const f = parseInt(parts[2]);
            return (m * 60) + s + (f / 30);
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                }
            }
        }

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(music);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioInit = true;
            } catch (e) {
                audioStatus.innerText = "Audio Sync: Fallback";
            }
        }

        function beginSequence() {
            document.getElementById('start-overlay').style.display = 'none';
            
            // Fullscreen Support
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
            
            requestWakeLock();
            initAudio();
            music.play().catch(e => console.log("Play error", e));
            startTime = performance.now();
            isRunning = true;
            
            processTimeline(0);
            requestAnimationFrame(tick);
        }

        function tick() {
            if (!isRunning) return;
            
            let elapsed = music.currentTime;
            if (elapsed === 0 && isRunning) {
                elapsed = (performance.now() - startTime) / 1000;
            }
            
            updateDisplay(elapsed);
            processTimeline(elapsed);
            handleEpilogue(elapsed);
            updateVisuals(elapsed);
            requestAnimationFrame(tick);
        }

        function processTimeline(elapsed) {
            narrative.forEach((item, index) => {
                const triggerPoint = parseTime(item.time);
                if (elapsed >= triggerPoint && !item.played) {
                    item.played = true;
                    spawnText(item, index, elapsed);
                }
            });
        }

        function handleEpilogue(elapsed) {
            // Start epilogue precisely at 61 seconds
            if (elapsed > 61 && isAudioInit) {
                // Spawn random words on beat intensity peaks
                if (beatIntensity > 0.45 && (elapsed - lastBeatSpawn) > 0.8) {
                    const currentActiveTexts = activeElements.map(e => e.dom.innerText);
                    const availableWords = epilogueWords.filter(w => !currentActiveTexts.includes(w));
                    
                    if (availableWords.length > 0) {
                        const word = availableWords[Math.floor(Math.random() * availableWords.length)];
                        const color = epilogueColors[Math.floor(Math.random() * epilogueColors.length)];
                        
                        spawnText({ 
                            text: word, 
                            color: color, 
                            special: "epilogue",
                            duration: 4.5 // Longer stay for strobe visibility
                        }, Math.floor(Math.random()*100), elapsed);
                        
                        lastBeatSpawn = elapsed;
                    }
                }
            }
        }

        function updateDisplay(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            const f = Math.floor((seconds % 1) * 30);
            timeDisplay.innerText = `${m}:${s.toString().padStart(2, '0')}:${f.toString().padStart(2, '0')}`;
        }

        function spawnText(item, index, triggerTime) {
            const el = document.createElement('div');
            el.className = 'kinetic-text';
            
            if (item.special === "epilogue") {
                el.classList.add('strobe-effect');
                // Random offset for the strobe so words don't pulse together
                el.style.animationDelay = `${Math.random() * -3.5}s`;
            }

            if (item.special === 'stack') {
                el.classList.add('word-stack');
                item.text.split(' ').forEach((w, i) => {
                    const s = document.createElement('span');
                    s.innerText = w;
                    s.style.marginLeft = (i * 35) + 'px';
                    el.appendChild(s);
                });
            } else if (item.special === 'solid') {
                el.innerHTML = `<span class="solid-block">${item.text}</span>`;
            } else {
                el.innerText = item.text;
            }

            el.style.color = item.color || '#fff';

            const ry = (index % 2 === 0 ? -55 : 55); 
            const rx = (Math.random() * 20 - 10);
            const rz = (Math.random() * 8 - 4) + (item.special === 'flip' ? 180 : 0);

            const startX = (ry > 0 ? -250 : 250); 
            const exitX = (ry > 0 ? 300 : -300);
            
            const slots = [-28, 0, 28, -14, 14];
            const startY = slots[currentSlot % slots.length];
            currentSlot++;

            stage.appendChild(el);

            const duration = item.duration || 2.5;

            const activeItem = {
                dom: el,
                rx, ry, rz,
                startX, startY, exitX,
                spawnTime: triggerTime,
                duration: duration
            };
            activeElements.push(activeItem);

            setTimeout(() => el.classList.add('active'), 10);
        }

        function updateVisuals(elapsed) {
            if (isAudioInit) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i=0; i<4; i++) sum += dataArray[i];
                beatIntensity = (sum / 4) / 255;
            }

            const timeNow = performance.now() * 0.002;
            const pulse = 1 + (beatIntensity * 0.12);

            activeElements.forEach((item, idx) => {
                const localTime = elapsed - item.spawnTime;
                let currentX = 0;
                let currentZ = 0;
                let currentScale = 1;
                
                const entryDuration = 0.55; 
                const exitDuration = 0.5;  
                
                if (localTime < entryDuration) {
                    const t = localTime / entryDuration;
                    const eased = 1 - Math.pow(1 - t, 4); 
                    currentX = item.startX * (1 - eased);
                    currentZ = -1200 * (1 - eased);
                    currentScale = 0.2 + (0.8 * eased);
                } else if (localTime > item.duration - exitDuration) {
                    const t = (localTime - (item.duration - exitDuration)) / exitDuration;
                    const eased = Math.pow(t, 4);
                    currentX = item.exitX * eased;
                    currentZ = 1200 * eased;
                    currentScale = 1 + (5 * eased);
                    
                    if (t >= 1) {
                        item.dom.remove();
                        activeElements = activeElements.filter(a => a !== item);
                        return;
                    }
                } else {
                    currentX = 0;
                    currentZ = 0;
                    currentScale = 1;
                }
                
                const floatX = Math.sin(timeNow + idx) * 10;
                const floatY = Math.cos(timeNow * 0.8 + idx) * 8;
                
                item.dom.style.transform = `
                    translate3d(calc(${currentX}vw + ${floatX}px), calc(${item.startY}vh + ${floatY}px), ${currentZ}px)
                    rotateX(${item.rx}deg)
                    rotateY(${item.ry}deg)
                    rotateZ(${item.rz}deg)
                    scale(${currentScale * pulse})
                `;
            });
        }
    </script>
</body>
</html>
