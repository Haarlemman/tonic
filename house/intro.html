<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House of Awe — Casa</title>
  <link rel="stylesheet" href="https://use.typekit.net/lcd0ood.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
  <!-- Three.js CDN for background wireframe house -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- ── Prefetch: prime the browser cache for index.html + house.html ── -->
  <!-- Scripts -->
  <link rel="prefetch" href="https://cdn.tailwindcss.com" as="script">
  <link rel="prefetch" href="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" as="script">
  <link rel="prefetch" href="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js" as="script">
  <link rel="prefetch" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" as="script">
  <link rel="prefetch" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" as="script">
  <!-- Local scripts (house.html) -->
  <link rel="prefetch" href="js/storage.js?v=202608021145" as="script">
  <link rel="prefetch" href="js/data.js?v=202608021145" as="script">
  <link rel="prefetch" href="js/cars.js?v=202608021145" as="script">
  <link rel="prefetch" href="js/house.js?v=202608021145" as="script">
  <link rel="prefetch" href="js/rooms.js?v=202608021145" as="script">
  <link rel="prefetch" href="js/ui.js?v=202608021145" as="script">
  <link rel="prefetch" href="js/mobile.js?v=202608021145" as="script">
  <!-- Local CSS -->
  <link rel="prefetch" href="css/style.css" as="style">
  <link rel="prefetch" href="css/mobile.css" as="style">
  <!-- index.html itself + house.html (so navigation is instant) -->
  <link rel="prefetch" href="index.html">
  <link rel="prefetch" href="house.html">
  <!-- Fonts: preconnect speeds up the DNS+TLS handshake -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Videos (prefetch only — don't preload full video, just prime the connection) -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <!-- ──────────────────────────────────────────────────────────────────── -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #010612;
      --red: #e82030;
      --red-dk: #6a0d16;
      --yel: #f5c800;
      --yel-dk: #6a5500;
      --cyn: #00d0e8;
      --cyn-dk: #004d58;
      --gry: #8aa8c0;
      --gry-dk: #2a3e50;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--navy);
      overflow: hidden;
    }

    /* ── Vignette ─────────────────────────────────────────── */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
      background: radial-gradient(ellipse 100% 100% at 50% 50%,
          transparent 30%, rgba(10, 18, 30, .7) 100%);
    }

    /* ── Scanlines ────────────────────────────────────────── */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 201;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px,
          rgba(0, 0, 0, .05) 3px, rgba(0, 0, 0, .05) 4px);
    }

    /* ── Floating particles ───────────────────────────────── */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .dot {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0% {
        opacity: 0;
        transform: translateY(0) translateX(0);
      }

      10% {
        opacity: .55;
      }

      90% {
        opacity: .25;
      }

      100% {
        opacity: 0;
        transform: translateY(-100vh) translateX(20px);
      }
    }

    /* ── V-shape stage ────────────────────────────────────── */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 4vh;
      z-index: 10;
      pointer-events: none;
      transform-style: preserve-3d;
    }

    .v-pivot {
      position: relative;
      width: 0;
      height: 0;
      margin-bottom: 0;
    }

    .arm {
      position: absolute;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.6vh;
      opacity: 0;
      will-change: transform, opacity;
      pointer-events: auto;
      transform-style: preserve-3d;
    }

    .arm-left {
      right: 12vw;
      transform-origin: right bottom;
      transform: skewY(17.5deg);
    }



    .tl {
      display: block;
      font-family: omnium, sans-serif;
      text-transform: uppercase;
      line-height: 1.0;
      letter-spacing: -0.015em;
      white-space: nowrap;
      opacity: 0;
      animation: line-pop .5s ease forwards;
    }

    .c-red {
      color: var(--red);
      text-shadow:
        1px 1px 0 var(--red-dk), 2px 2px 0 var(--red-dk),
        3px 3px 0 var(--red-dk), 4px 4px 0 var(--red-dk),
        5px 5px 0 var(--red-dk), 6px 6px 0 var(--red-dk),
        7px 7px 0 var(--red-dk), 8px 8px 1px rgba(0, 0, 0, .45);
    }

    .c-yel {
      color: var(--yel);
      text-shadow:
        1px 1px 0 var(--yel-dk), 2px 2px 0 var(--yel-dk),
        3px 3px 0 var(--yel-dk), 4px 4px 0 var(--yel-dk),
        5px 5px 0 var(--yel-dk), 6px 6px 0 var(--yel-dk),
        7px 7px 0 var(--yel-dk), 8px 8px 1px rgba(0, 0, 0, .45);
    }

    .c-cyn {
      color: var(--cyn);
      text-shadow:
        1px 1px 0 var(--cyn-dk), 2px 2px 0 var(--cyn-dk),
        3px 3px 0 var(--cyn-dk), 4px 4px 0 var(--cyn-dk),
        5px 5px 0 var(--cyn-dk), 6px 6px 0 var(--cyn-dk),
        7px 7px 0 var(--cyn-dk), 8px 8px 1px rgba(0, 0, 0, .45);
    }

    .c-wht {
      color: #ffffff;
      text-shadow:
        1px 1px 0 #8aa8c0, 2px 2px 0 #8aa8c0,
        3px 3px 0 #8aa8c0, 4px 4px 0 #8aa8c0,
        5px 5px 0 #8aa8c0, 6px 6px 0 #8aa8c0,
        7px 7px 0 #8aa8c0, 8px 8px 1px rgba(0, 0, 0, .45);
    }

    .c-gry {
      color: var(--gry);
      text-shadow:
        1px 1px 0 var(--gry-dk), 2px 2px 0 var(--gry-dk),
        3px 3px 0 var(--gry-dk), 4px 4px 0 var(--gry-dk),
        5px 5px 0 var(--gry-dk), 6px 6px 0 var(--gry-dk),
        7px 7px 0 var(--gry-dk), 8px 8px 1px rgba(0, 0, 0, .45);
    }

    /* Per-arm shadow direction overrides */
    .arm-left .c-red { text-shadow: 1px -1px 0 var(--red-dk), 2px -2px 0 var(--red-dk), 3px -3px 0 var(--red-dk), 4px -4px 0 var(--red-dk), 5px -5px 0 var(--red-dk), 6px -6px 0 var(--red-dk), 7px -7px 0 var(--red-dk), 8px -8px 1px rgba(0,0,0,.45); }
    .arm-left .c-yel { text-shadow: 1px -1px 0 var(--yel-dk), 2px -2px 0 var(--yel-dk), 3px -3px 0 var(--yel-dk), 4px -4px 0 var(--yel-dk), 5px -5px 0 var(--yel-dk), 6px -6px 0 var(--yel-dk), 7px -7px 0 var(--yel-dk), 8px -8px 1px rgba(0,0,0,.45); }
    .arm-left .c-cyn { text-shadow: 1px -1px 0 var(--cyn-dk), 2px -2px 0 var(--cyn-dk), 3px -3px 0 var(--cyn-dk), 4px -4px 0 var(--cyn-dk), 5px -5px 0 var(--cyn-dk), 6px -6px 0 var(--cyn-dk), 7px -7px 0 var(--cyn-dk), 8px -8px 1px rgba(0,0,0,.45); }
    .arm-left .c-wht { text-shadow: 1px -1px 0 #8aa8c0, 2px -2px 0 #8aa8c0, 3px -3px 0 #8aa8c0, 4px -4px 0 #8aa8c0, 5px -5px 0 #8aa8c0, 6px -6px 0 #8aa8c0, 7px -7px 0 #8aa8c0, 8px -8px 1px rgba(0,0,0,.45); }
    .arm-left .c-gry { text-shadow: 1px -1px 0 var(--gry-dk), 2px -2px 0 var(--gry-dk), 3px -3px 0 var(--gry-dk), 4px -4px 0 var(--gry-dk), 5px -5px 0 var(--gry-dk), 6px -6px 0 var(--gry-dk), 7px -7px 0 var(--gry-dk), 8px -8px 1px rgba(0,0,0,.45); }


    .sz-xl {font-size: clamp(2.0rem, 5.0vw, 4.0rem);}
    .sz-lg {font-size: clamp(1.5rem, 3.6vw, 3.0rem);}
    .sz-md {font-size: clamp(1.1rem, 2.6vw, 2.2rem);}
    .sz-sm {font-size: clamp(0.8rem, 1.8vw, 1.5rem);}

    @keyframes line-pop {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(.94);
      }

      65% {
        opacity: 1;
        transform: translateY(-3px) scale(1.02);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes arm-in-left {
      from {
        opacity: 0;
        transform: skewY(17.5deg) translateX(-50px);
      }

      to {
        opacity: 1;
        transform: skewY(17.5deg) translateX(0);
      }
    }

    .arm-left.visible {animation: arm-in-left 1s cubic-bezier(.16, 1, .3, 1) forwards;}

    @keyframes float-l {

      0%,
      100% {transform: skewY(17.5deg) translateY(0);}
      50% {transform: skewY(17.5deg) translateY(-7px);}
    }

    .arm-left.floating {
      opacity: 1;
      animation: float-l 5s ease-in-out infinite;
    }

    .arm-left.floating .tl {
      opacity: 1;
      animation: none;
    }

    /* Glow wave animation on individual characters */
    .char {
      display: inline-block;
      transition: filter 0.3s ease, transform 0.3s ease;
      will-change: filter, transform;
    }

    .arm-left.floating .char {
      animation: char-glow-wave 3.2s ease-in-out infinite;
      animation-delay: var(--glow-delay, 0s);
    }

    @keyframes char-glow-wave {
      0%, 100% {
        filter: brightness(1);
        transform: scale(1);
      }
      8% {
        filter: brightness(1.7) drop-shadow(0 0 10px currentColor);
        transform: scale(1.06);
      }
      16%, 90% {
        filter: brightness(1);
        transform: scale(1);
      }
    }

    #wireframe-canvas {
      position: fixed;
      bottom: 12vh;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 52vh;
      z-index: 5;
      cursor: pointer;
      opacity: 0;
      transition: opacity 1.2s ease, filter 0.3s ease, left 1.1s cubic-bezier(.16,1,.3,1), transform 1.1s cubic-bezier(.16,1,.3,1), bottom 1.1s cubic-bezier(.16,1,.3,1), height 1.1s cubic-bezier(.16,1,.3,1);
    }

    #wireframe-canvas:hover {
      filter: brightness(1.1) drop-shadow(0 0 15px rgba(245, 200, 0, 0.25));
    }

    /* Responsive repositioning and scaling */
    @media (max-width: 768px) {
      .stage {
        align-items: flex-end;
        padding-top: 0;
        padding-bottom: 50vh;
      }
      .arm-left {
        right: auto;
        left: 50%;
        transform: translate3d(-50%, 0, 0) skewY(10deg) scale(0.8);
        transform-origin: center bottom;
      }
      
      .arm-left.visible {
        animation: arm-in-left-mob 1s cubic-bezier(.16, 1, .3, 1) forwards;
      }

      .arm-left.floating {
        opacity: 1;
        animation: float-l-mob 5s ease-in-out infinite;
      }

      @keyframes arm-in-left-mob {
        from {
          opacity: 0;
          transform: translate3d(-50%, 20px, 0) skewY(10deg) scale(0.7);
        }
        to {
          opacity: 1;
          transform: translate3d(-50%, 0, 0) skewY(10deg) scale(0.8);
        }
      }

      @keyframes float-l-mob {
        0%, 100% {
          transform: translate3d(-50%, 0, 0) skewY(10deg) scale(0.8) translateY(0);
        }
        50% {
          transform: translate3d(-50%, 0, 0) skewY(10deg) scale(0.8) translateY(-6px);
        }
      }

      /* Bigger text on mobile */
      .sz-xl { font-size: clamp(2.8rem, 10vw, 5.0rem); }
      .sz-lg { font-size: clamp(2.0rem, 7.5vw, 3.8rem); }
      .sz-md { font-size: clamp(1.4rem, 5vw,  2.6rem); }
      .sz-sm { font-size: clamp(1.0rem, 3vw,  1.8rem); }

      /* Default canvas position (centred, full-screen) on mobile */
      #wireframe-canvas {
        bottom: 2vh;
        left: 50%;
        transform: translateX(-50%);
        width: 100vw;
        height: 45vh;
      }

      /* After lights are on: slide house to bottom half */
      #wireframe-canvas.shifted {
        bottom: 2vh;
        left: 50%;
        transform: translateX(-50%);
        width: 100vw;
        height: 48vh;
      }
    }

    @media (min-width: 769px) {
      /* Default canvas position (centred) on desktop */
      #wireframe-canvas {
        left: 50%;
        transform: translateX(-50%);
        width: 72vw;
        height: 80vh;
        bottom: 5vh;
      }

      /* After lights are on: slide house to the right */
      #wireframe-canvas.shifted {
        left: 72%;
        transform: translateX(-50%);
        width: 72vw;
        height: 80vh;
        bottom: 5vh;
      }
    }

    /* Highlight glow — added after all lines appear */
    .arm-left.highlighted .c-red { filter: brightness(1.5) drop-shadow(0 0 14px var(--red)); transition: filter 0.5s ease; }
    .arm-left.highlighted .c-yel { filter: brightness(1.5) drop-shadow(0 0 14px var(--yel)); transition: filter 0.5s ease; }
    .arm-left.highlighted .c-cyn { filter: brightness(1.5) drop-shadow(0 0 14px var(--cyn)); transition: filter 0.5s ease; }
    .arm-left.highlighted .c-wht { filter: brightness(1.4) drop-shadow(0 0 8px #fff);       transition: filter 0.5s ease; }

    /* Final line blink */
    @keyframes blink-line {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.05; }
    }
    .blinking { animation: blink-line 0.4s ease-in-out 4 !important; }
  </style>
</head>

<body>

  <div class="particles" id="pts"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <canvas id="wireframe-canvas"></canvas>

  <div class="stage">
    <div class="v-pivot">

      <div class="arm arm-left" id="arm-left">
        <span class="tl sz-sm c-gry">EXPLORE</span>
        <span class="tl sz-lg c-red">THE HOUSE</span>
        <span class="tl sz-xl c-red">OF AWE</span>
        <span class="tl sz-sm c-gry">AND DISCOVER</span>
        <span class="tl sz-sm c-yel">THE MEANING</span>
        <span class="tl sz-xl c-yel">OF LIFE</span>
        <span class="tl sz-md c-cyn">ACCORDING TO</span>
        <span class="tl sz-lg c-wht" id="arm-name">YOU</span>
      </div>

    </div>
  </div>

  <script>
    let nameToDisplay = 'YOU';
    try {
      const savedQuiz = JSON.parse(localStorage.getItem('userQuizProgress') || '{}');
      const savedReflections = JSON.parse(localStorage.getItem('houseReflections') || '{}');
      const savedName = savedQuiz.name || savedReflections.name;
      if (savedName && savedName.trim() !== '') {
        nameToDisplay = savedName.trim().toUpperCase();
      }
    } catch (e) {
      console.error('Error reading localStorage for visitor name:', e);
    }
    const nameEl = document.getElementById('arm-name');
    if (nameEl) {
      nameEl.textContent = nameToDisplay;
    }

    // Split text of each line into accessible character spans
    function splitLinesToCharacters() {
      const container = document.getElementById('arm-left');
      if (!container) return;
      const lines = container.querySelectorAll('.tl');
      lines.forEach(line => {
        const text = line.textContent;
        line.setAttribute('aria-label', text);
        line.innerHTML = '';
        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const span = document.createElement('span');
          span.textContent = char;
          span.setAttribute('aria-hidden', 'true');
          if (char === ' ') {
            span.innerHTML = '&nbsp;';
          } else {
            span.className = 'char';
          }
          line.appendChild(span);
        }
      });
    }
    splitLinesToCharacters();

    function justifyPillar() {
      const container = document.getElementById('arm-left');
      if (!container) return;
      const lines = Array.from(container.querySelectorAll('.tl'));
      if (lines.length === 0) return;

      // Temporarily clear transform and set letter-spacing to the base tight value to measure natural layout widths
      lines.forEach(el => {
        el.style.transform = 'none';
        el.style.letterSpacing = '-0.015em';
      });

      let maxWidth = 0;
      lines.forEach(el => {
        const w = el.getBoundingClientRect().width;
        if (w > maxWidth) maxWidth = w;
      });

      lines.forEach(el => {
        const w = el.getBoundingClientRect().width;
        const txt = el.textContent || '';
        const charCount = txt.length;
        if (charCount > 1 && w < maxWidth) {
          const neededSpace = maxWidth - w;
          const spacing = neededSpace / (charCount - 1);
          el.style.letterSpacing = `calc(-0.015em + ${spacing}px)`;
        } else {
          el.style.letterSpacing = '-0.015em';
        }
        // Restore transform so CSS animations work normally
        el.style.transform = '';
      });
    }

    // Calculate layout-based delays for the character glow wave
    function updateGlowWaveDelays() {
      const container = document.getElementById('arm-left');
      if (!container) return;
      const lines = Array.from(container.querySelectorAll('.tl'));
      const lineCount = lines.length || 1;

      lines.forEach((line, lineIdx) => {
        const chars = line.querySelectorAll('.char');
        // Flat delay based strictly on the parent line's vertical index
        const normalizedY = lineIdx / lineCount;
        const delay = normalizedY * 1.8;
        
        chars.forEach(char => {
          char.style.setProperty('--glow-delay', `${delay.toFixed(3)}s`);
        });
      });
    }

    function handleLayout() {
      justifyPillar();
      updateGlowWaveDelays();
    }

    // Run on load, resize, and font load
    window.addEventListener('load', handleLayout);
    window.addEventListener('resize', handleLayout);
    if (document.fonts) {
      document.fonts.ready.then(handleLayout);
    }

    // After casa is up and running, fetch the big Google Fonts bundle for
    // index/house into the HTTP cache so it's ready when the user navigates.
    window.addEventListener('load', function () {
      setTimeout(function () {
        const fontUrl = 'https://fonts.googleapis.com/css2?family=Bebas+Neue'
          + '&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400'
          + '&family=Baumans&family=Bitcount+Grid+Double:wght@300'
          + '&family=Courier+Prime&family=Lexend:wght@400;700'
          + '&family=Glass+Antiqua&family=JetBrains+Mono:wght@300;400;700'
          + '&family=Lato:wght@300;400;700&family=Orelega+One'
          + '&family=Share+Tech+Mono&family=Special+Elite'
          + '&family=Tilt+Neon&family=Fraunces:wght@400&display=swap';
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = fontUrl;
        document.head.appendChild(link);

        // fetch() actually warms the HTTP cache, unlike <link rel="prefetch">
        // which browsers routinely skip. We fetch local assets quietly in the
        // background — the response goes straight into cache, ignored otherwise.
        const localAssets = [
          'index.html',
          'house.html',
          'css/style.css',
          'css/mobile.css',
          'js/house.js?v=202608021145',
          'js/rooms.js',
          'js/ui.js',
          'js/data.js',
          'js/cars.js',
          'js/storage.js',
          'js/mobile.js',
        ];
        // Stagger the fetches so they don't all fire at once
        localAssets.forEach((url, i) => {
          setTimeout(() => {
            fetch(url, { cache: 'force-cache', priority: 'low' }).catch(() => {});
          }, i * 150);
        });
      }, 2000); // 2s delay — let casa's own animation settle first
    });

    (function () {
      const c = document.getElementById('pts');
      const cols = ['#004c80', '#ffa500', '#ffffff', '#002244'];
      for (let i = 0; i < 50; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        const s = Math.random() * 2.5 + .8;
        d.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;
      bottom:${-Math.random() * 10}%;background:${cols[~~(Math.random() * 4)]};
      animation-duration:${7 + Math.random() * 14}s;animation-delay:${Math.random() * 12}s`;
        c.appendChild(d);
      }
    })();

    function staggerLines(arm, baseDelay) {
      arm.querySelectorAll('.tl').forEach((el, i) => {
        el.style.animationDelay = (baseDelay + i * .13) + 's';
      });
    }

    const armL = document.getElementById('arm-left');

    // Text reveal: line-by-line top→bottom, then highlight, then last line blinks.
    window._textRevealed = false;
    window.triggerTextReveal = function() {
      if (window._textRevealed) return;
      window._textRevealed = true;

      const LINE_GAP   = 300;  // ms between consecutive lines
      const ARM_LEAD   = 600;  // ms head-start for the arm slide before lines appear
      const FADE_DELAY = 200;  // ms after last line before highlight glow
      const BLINK_DELAY = 400; // ms after highlight before last line blinks
      const BLINK_DUR  = 1800; // ms of blinking before float mode

      const lines = Array.from(armL.querySelectorAll('.tl'));

      // Freeze all lines invisible so the CSS default animation doesn't fire
      lines.forEach(line => {
        line.style.animation = 'none';
        line.style.opacity = '0';
      });

      // Slide house to the right (desktop) / bottom (mobile)
      document.getElementById('wireframe-canvas').classList.add('shifted');

      // Start arm slide-in, then reveal lines one by one
      setTimeout(() => {
        armL.classList.add('visible');

        lines.forEach((line, i) => {
          setTimeout(() => {
            line.style.opacity = '';          // un-freeze
            void line.offsetWidth;            // force reflow → restart animation
            line.style.animation = 'line-pop 0.5s ease forwards';
          }, ARM_LEAD + i * LINE_GAP);
        });

        const allDone = ARM_LEAD + lines.length * LINE_GAP;

        // Highlight glow on all colored lines
        setTimeout(() => {

      function createBrickTexture(type) {
        const canvas = document.createElement('canvas');

        const baseColor = isAmsterdam ? '#8b4513' : '#f0e68c';
        ctx.fillStyle = baseColor;
        ctx.fillRect(0, 0, 512, 512);

        const rows = 16, cols = 8;
        const h = 512 / rows, w = 512 / cols;

        for (let r = 0; r < rows; r++) {
          const offset = (r % 2) * (w / 2);
          for (let c = -1; c < cols + 1; c++) {
            const vari = Math.random() * 30 - 15;
            if (isAmsterdam) {
              const rVal = 139 + vari;
              const gVal = 69 + vari * 0.5;
              const bVal = 19 + vari * 0.2;
              ctx.fillStyle = `rgb(${rVal}, ${gVal}, ${bVal})`;
            } else {
              const rVal = 240 + vari;
              const gVal = 230 + vari;
              const bVal = 140 + vari;
              ctx.fillStyle = `rgb(${rVal}, ${gVal}, ${bVal})`;
            }
            ctx.fillRect(c * w + offset + 2, r * h + 2, w - 4, h - 4);
            ctx.strokeStyle = isAmsterdam ? 'rgba(0,0,0,0.3)' : 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(c * w + offset + 2, r * h + 2, w - 4, h - 4);

        tex.wrapT = THREE.RepeatWrapping;

      function wAddPart(w, h, d, x, y, z, mat) {

            localNormal.set(dirX, 0, 0);
            
            // Offset winGroup slightly outward so the frame sticks out
            winGroup.position.x += 0.05 * dirX;
          } else {

            glassH = h;

            new THREE.BoxGeometry(glassW, glassH, glassD),

      function wAddRoomBlock(x, y, z, w, h, d, color, winConfigs = null) {

        const atticX = -1.2, atticY = roofBaseY + 1.25, atticZ = 0;
        const atticW = 3.6, atticH = 2.4, atticD = 4.5;
        wAddRoomBlock(atticX, atticY, atticZ, atticW, atticH, atticD, 0xffffff, { type: 'dark', side: 'back', scale: 0.8 });
        for (let i = 0; i < 6; i++) {
          wAddPart(0.12, 2.3, 0.1, atticX - 1.5 + i * 0.6, atticY, atticZ + 2.28, winMat);
        }
        wAddPart(atticW + 0.3, 0.12, atticD + 0.3, atticX, atticY + atticH / 2 + 0.06, atticZ, redRoofMat);

        const _roofY = atticY + atticH / 2 + 0.13;
        const _pW = 0.7, _pD = 0.55, _gap = 0.12;
        const _sx = atticX - _pW / 2 - _gap / 2;
        const _sz = atticZ - _pD - _gap;
        for (let c = 0; c < 2; c++) {
          for (let r = 0; r < 3; r++) {
            const px = _sx + c * (_pW + _gap);
            const pz = _sz + r * (_pD + _gap);
            wAddPart(_pW + 0.06, 0.06, _pD + 0.06, px, _roofY, pz, frameMat);
            wAddPart(_pW, 0.04, _pD, px, _roofY + 0.02, pz, new THREE.MeshStandardMaterial({ color: 0x0a2a55, roughness: 0.2, metalness: 0.8, map: cellTex }));
          }
        }

        const stepW = livingW + studioW + 1.2; // match the full house front opening width
        const stepD = 0.6; // deeper treads
        for (let i = 0; i < 4; i++) {
          wAddPart(stepW, 0.2, stepD, (livingX + studioX) / 2, 0.1 + i * 0.22, 4.95 - i * stepD, stepMats);
        }
      }

      function wResize() {
        const rect = canvas.getBoundingClientRect();
        const w = rect.width || window.innerWidth;
        const h = rect.height || window.innerHeight;
        const aspect = w / h;
        
        const isDesktop = window.innerWidth > 768;
        const d = isDesktop ? 6.8 : 7.5;

        wCamera.left = -d * aspect;
        wCamera.right = d * aspect;
        wCamera.top = d;
        wCamera.bottom = -d;
        wCamera.updateProjectionMatrix();
        wRenderer.setSize(w, h, false);
      }

      function animate() {
        requestAnimationFrame(animate);
        
        const t = performance.now() * 0.001; // Time in seconds
        // sequenceEndTime and windowTimes computed in wInit after wBuild.
        const shiftTriggerTime = sequenceEndTime + 1.5 + 0.4;

        windowObjects.forEach((win, i) => {
          const u = win.beamMesh.userData;
          let targetIntensity = 0;
          let targetOpacity = 0;

          if (t < sequenceEndTime) {
            // Accelerating sequential phase — each window has a shorter slot than the last.
            const wt = windowTimes[i];
            if (wt && t >= wt.start && t < wt.end) {
              const progress = (t - wt.start) / wt.dur; // 0 → 1
              const factor   = Math.sin(progress * Math.PI); // bell curve
              targetIntensity = factor * 6.0;
              targetOpacity   = factor * 0.55;
            }
          } else {
            // Final phase: all windows on, fading in together
            const fadeInTime   = 1.5;
            const timeSinceEnd = t - sequenceEndTime;
            const fadeFactor   = Math.min(1.0, timeSinceEnd / fadeInTime);
            const pulse        = Math.sin(t * u.pulseSpeed + u.pulsePhase) * 0.15;
            const globalPulse  = Math.sin(t * 2.2) * 1.5;
            targetIntensity = fadeFactor * (5.0 + globalPulse);
            targetOpacity   = fadeFactor * (u.baseOpacity + pulse);
          }

          if (win.glassMat) win.glassMat.emissiveIntensity = targetIntensity;
          if (win.beamMesh && win.beamMesh.material) win.beamMesh.material.opacity = targetOpacity;
        });

        if (t >= shiftTriggerTime && typeof window.triggerTextReveal === 'function') {
          window.triggerTextReveal();
        }
        
        wRenderer.render(wScene, wCamera);
      }

      setTimeout(() => requestAnimationFrame(wInit), 100);

      canvas.addEventListener('click', () => {
        location.href = 'index.html';
      });

      document.addEventListener('keydown', e => {
        if (['Enter', 'Space', 'ArrowRight'].includes(e.code)) {
          e.preventDefault();
          location.href = 'index.html';
        }
      });
    })();
  </script>
