    <!-- Global error display — keep early so it catches script load failures -->
    <script>
        window.addEventListener('error', function (e) {
            window.hasCriticalError = true;
            const box = document.getElementById('loading');
            if (box) {
                box.innerHTML = '<div style="color:red;background:#000;padding:20px;z-index:9999">'
                    + 'ERROR: ' + e.message + '<br>File: ' + e.filename + '<br>Line: ' + e.lineno
                    + '</div>';
                box.style.display = 'flex';
                box.style.opacity = '1';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Fallback: force-hide loader if nothing resolves within 15 s
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if (loader && loader.style.display !== 'none' && !loader.innerHTML.includes('ERROR:')) {
                    console.warn('Loader fallback triggered after 15 s.');
                    if (window.hideLoader) window.hideLoader();
                }
            }, 15000);
        });
    </script>

    <script>
        // Refresh hardcoded UI strings that live in HTML rather than JS templates.
        // Called once on load and again whenever the language is switched.
        function refreshStaticUIStrings() {
            if (typeof t !== 'function') return;
            const ideaTitle = document.getElementById('idea-zone-title');
            const ideaClose = document.getElementById('idea-close-btn');
            const ideaSave = document.getElementById('idea-save-btn');
            const foundIt = document.getElementById('found-it-label');
            const browseHint = document.getElementById('browse-hint-text');
            const browseBtn = document.getElementById('browse-btn');
            if (ideaTitle) ideaTitle.textContent = t('idea_zone');
            if (ideaClose) ideaClose.textContent = t('idea_close');
            if (ideaSave) ideaSave.textContent = t('idea_save');
            if (foundIt) foundIt.textContent = t('found_it');
            if (browseHint) browseHint.textContent = t('browse_hint');
            if (browseBtn) browseBtn.textContent = t('browse');
        }

        // Run after all scripts have loaded
        window.addEventListener('load', refreshStaticUIStrings);

        // Re-run whenever language changes (SET_LANGUAGE postMessage is also handled
        // inside ui.js, but that only covers the narrative overlays — this covers HTML elements)
        const _origSetLang = window.setExperienceLanguage;
        window.setExperienceLanguage = function (lang) {
            if (_origSetLang) _origSetLang(lang);
            refreshStaticUIStrings();
        };

        // Hide fullscreen button if the API is not supported (e.g., iPhone Safari)
        (function () {
            const fsEnabled = document.fullscreenEnabled || document.webkitFullscreenEnabled || document.mozFullScreenEnabled || document.msFullscreenEnabled;
            if (!fsEnabled) {
                const fsBtn = document.getElementById('fullscreen-btn');
                if (fsBtn) {
                    fsBtn.style.display = 'none';
                    console.log("Fullscreen API not supported on this device/browser. Hiding toggle.");
                }
            }
        })();
    </script>


</body>
