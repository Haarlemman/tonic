    <script>
        // 1. Global Error Handler
        window.addEventListener('error', function (e) {
            const errorBox = document.getElementById('loading');
            if (errorBox) {
                errorBox.innerHTML = `<div style="color:red; background:black; padding:20px; z-index:9999;">ERROR: ${e.message}<br>File: ${e.filename}<br>Line: ${e.lineno}</div>`;
                errorBox.style.display = 'flex';
                errorBox.style.opacity = 1;
            }
        });

        // 2. Safety Timeout (Immediate Scope)
        document.addEventListener('DOMContentLoaded', () => {
            // Start timer as soon as DOM is ready. Don't wait for all assets (window.load).
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if (loader && getComputedStyle(loader).opacity !== '0') {
                    console.warn("Forcing Loader Off (Timeout)");
                    if (!loader.innerHTML.includes("ERROR:")) {
                        loader.style.opacity = 0;
                        setTimeout(() => { loader.style.display = 'none'; }, 500);

                        // Optional: Show a subtle warning
                        const err = document.getElementById('loading-error');
                        if (err) {
                            err.classList.remove('hidden');
                            err.innerHTML = "<span style='color:orange'>Loading took too long. Forcing start.</span>";
                        }
                    }
                }
            }, 8000);
        });
    </script>
