<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The House of Awe</title>
    <meta name="description"
        content="Explore The House of Awe, an interactive 3D environment and digital experience by David Enker.">
    <meta name="keywords" content="Interactive 3D, WebGL, Three.js, David Enker, Digital Art, Virtual Environment">
    <meta name="author" content="David Enker">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tonic.davidenker.com/house/index.html">
    <meta property="og:title" content="The House of Awe">
    <meta property="og:description" content="Interactive 3D Environment">
    <meta property="og:image" content="https://tonic.davidenker.com/assets/images/house.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://tonic.davidenker.com/house/">
    <meta property="twitter:title" content="The House of Awe">
    <meta property="twitter:description" content="Interactive 3D Environment">
    <meta property="twitter:image" content="https://tonic.davidenker.com/assets/images/house.jpg">

    <link rel="icon" type="image/x-icon" href="../assets/images/fav-infinity.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <link rel="stylesheet" href="css/style.css?v=52">
</head>

<body>

    <div id="app-header" data-theme="yellow"></div>
    <div id="loading">
        <div class="text-center">
            <h2 class="text-2xl mb-1">Loading...</h2>
        </div>
    </div>

    <div id="idea-overlay">
        <div class="notepad-paper">
            <h3 class="text-gray-800 font-bold mb-2 ml-5" style="font-family:'Courier Prime'">THE IDEA TANK</h3>
            <textarea id="idea-text" class="idea-input" placeholder="Type your brilliant ideas here..."></textarea>
            <div class="notepad-controls">
                <button class="btn-note btn-close" onclick="closeIdeaOverlay()">Close</button>
                <button class="btn-note btn-save" onclick="saveIdea()">Save Idea</button>
            </div>
        </div>
    </div>



    <header id="main-header"
        class="absolute left-0 w-full text-center z-30 transition-opacity duration-500 top-[30%] md:top-1/2 pointer-events-none"
        style="transform: translateY(-50%); opacity: 0;">
        <h1 class="glass-font text-2xl md:text-5xl text-gray-100 tracking-wide drop-shadow-lg leading-tight"
            style="text-shadow: 0 4px 25px rgba(0,0,0,0.9);">The House of Awe</h1>
        <p class="text-purple-200 text-[10px] md:text-xs mt-2 font-medium tracking-widest uppercase opacity-80">
            Interactive <br class="md:hidden" /> 3D Environment</p>
    </header>

    <div id="start-btn-container" class="absolute left-0 w-full text-center z-40"
        style="top: 75%; transform: translateY(-50%);">
        <button id="start-btn" onclick="enterExperience()"
            class="px-5 py-2 bg-white/10 hover:bg-white/20 border border-white/40 text-white font-bold tracking-widest uppercase backdrop-blur-sm transition-all text-xs rounded-sm">
            Enter Experience
        </button>
    </div>

    <div id="tooltip">Room Name</div>
    <div id="instructions">Click a room to enter it • Drag to rotate</div>
    <button id="back-btn" onclick="exitRoom()">← Exit Room</button>

    <div id="video-playlist-ui"
        class="hidden absolute top-4 right-4 w-64 bg-black/80 backdrop-blur-md rounded-lg p-4 border border-white/10 z-50">
    </div>

    <!-- Notepad Overlay -->
    <div id="notepad-overlay"
        class="hidden absolute top-0 left-0 w-full h-full bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-[#1a1a1a] p-6 rounded-lg w-96 border border-gray-700 shadow-2xl">
            <h2 class="text-white text-xl mb-4 font-mono">Notepad</h2>
            <textarea id="note-input"
                class="w-full h-40 bg-black/50 text-green-400 font-mono p-2 mb-4 border border-gray-700 focus:outline-none focus:border-green-500"
                placeholder="Type your thought..."></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="document.getElementById('notepad-overlay').classList.add('hidden')"
                    class="px-4 py-2 text-gray-400 hover:text-white">Cancel</button>
                <button onclick="saveNote()"
                    class="px-4 py-2 bg-green-900/50 text-green-400 border border-green-500/50 hover:bg-green-900">Save</button>
            </div>
        </div>
    </div>

    <div id="curtain"></div>

    <video id="attic-video" loop playsinline crossOrigin="anonymous" style="display: none;">
        <source src="../assets/video/historytrailer.mp4" type="video/mp4">
    </video>

    <video id="generic-video" loop crossOrigin="anonymous" playsinline style="display:none;">
        <source src="../assets/video/spirit.mp4" type="video/mp4">
    </video>

    <audio id="room-audio" loop>
        <source src="../assets/audio/green.mp3" type="audio/mpeg">
    </audio>

    <div id="canvas-container" class="w-full h-screen block outline-none cursor-move"></div>

    <script src="js/data.js?v=900&cb=2000"></script>
    <script src="../js/layout.js?v=531&cb=2"></script>

    <!-- Room Scripts -->
    <script src="js/rooms/music.js?v=901&cb=1006"></script>
    <script src="js/rooms/hall.js?v=608&cb=2"></script>
    <script src="js/rooms/basement.js?v=502&cb=2"></script>
    <script src="js/rooms/bathroom.js?v=502&cb=2"></script>
    <script src="js/rooms/attic.js?v=618&cb=2"></script>
    <script src="js/rooms/toilet.js?v=507&cb=6"></script>
    <script src="js/rooms/living.js?v=502&cb=2"></script>
    <script src="js/rooms/bedroom.js?v=508&cb=2"></script>
    <script src="js/rooms/studio.js?v=510&cb=2"></script>
    <script src="js/rooms/generic.js?v=501&cb=2"></script>

    <script src="js/house.js?v=901&cb=2000"></script>
</body>

</html>
