<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Memory House 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- TWEEN.js for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap');

        :root {
            --bg-color: #f0f4f8;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            overflow: hidden;
        }

        .serif {
            font-family: 'Crimson Pro', serif;
        }

        /* Loading Screen */
        #loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        /* Tooltip/Label styling */
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            transform: translate(-50%, -100%);
            margin-top: -15px;
            z-index: 10;
            white-space: nowrap;
        }

        /* Instructions overlay */
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #4a5568;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            pointer-events: none;
            text-align: center;
            transition: opacity 0.3s;
        }

        /* Transition Curtain */
        #curtain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f0f4f8;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }
        #curtain.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Back Button */
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 50;
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            font-weight: bold;
            display: none; /* Hidden by default */
            transition: transform 0.2s;
        }
        #back-btn:hover {
            transform: scale(1.05);
        }

        /* Room Info Panel (In-Room) */
        #room-info {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 45;
            display: none;
            max-height: 80vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="text-center">
            <h2 class="serif text-2xl mb-2">Building Interiors...</h2>
            <div class="w-16 h-1 bg-gray-300 mx-auto overflow-hidden rounded">
                <div class="w-full h-full bg-slate-600 animate-pulse"></div>
            </div>
        </div>
    </div>

    <!-- UI Elements -->
    <header id="main-header" class="absolute top-6 left-0 w-full text-center pointer-events-none z-20 transition-opacity duration-500">
        <h1 class="serif text-3xl md:text-4xl text-gray-800 tracking-wide drop-shadow-sm">The House of Thought</h1>
        <p class="text-gray-600 text-sm mt-2 font-medium">Interactive 3D Environment</p>
    </header>

    <div id="tooltip">Room Name</div>

    <div id="instructions">
        Click a room to enter it • Drag to rotate
    </div>

    <button id="back-btn" onclick="exitRoom()">
        ← Exit Room
    </button>

    <div id="room-info">
        <!-- Content injected via JS -->
    </div>

    <!-- Transition Curtain -->
    <div id="curtain"></div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="w-full h-screen block outline-none cursor-move"></div>

    <script>
        // --- DATA ---
        const roomContent = {
            living: {
                title: "Living Room: Photos & Music",
                hex: 0xf59e0b, 
                description: "The walls are lined with graphic novels and art. Jazz plays softly. Use the TV to view memories.",
                tvImages: [
                    { text: "Family: Ailish & Yaron", color: "#fca5a5" },
                    { text: "Tonic for the Bones (Draft)", color: "#93c5fd" },
                    { text: "Design Studio Work", color: "#86efac" },
                    { text: "Tel Aviv Sunset", color: "#fdba74" }
                ]
            },
            attic: {
                title: "The Attic: Memory",
                hex: 0x94a3b8,
                description: "Dust & Echoes. Old sketches, half-written manuscripts. The fragments of the past."
            },
            bathroom: {
                title: "The Bathroom: Parkinson",
                hex: 0x06b6d4,
                description: "The mirror reflects the physical reality. A space of vulnerability and resilience."
            },
            bedroom: {
                title: "The Bedroom: Stories",
                hex: 0xf43f5e,
                description: "Where dreaming happens. Tales for Yaron, stories about Ailish."
            },
            toilet: {
                title: "Toilet: Ideas",
                hex: 0x14b8a6,
                description: "The Think Tank. Politics, religion, and rough drafts of philosophy."
            },
            studio: {
                title: "Studio: Science",
                hex: 0x6366f1,
                description: "Psychology & Reason. Dissecting the 'why' of human behavior."
            },
            basement: {
                title: "Basement: Vault",
                hex: 0x334155,
                description: "Deep Storage. Secrets, fears, and absolute truths."
            }
        };

        // --- 3D SETUP ---
        let camera, scene, renderer, controls;
        let raycaster, mouse;
        
        // Groups
        let worldGroup; // Holds the exterior house
        let interiorGroup; // Holds the current room interior
        
        // Interaction State
        let state = 'HOUSE'; // 'HOUSE' or 'ROOM'
        let hoveredObject = null;
        let currentRoomKey = null;
        const clickableObjects = []; 
        const interiorClickables = []; // Specific for inside room (like TV)

        // TV State
        let tvMesh = null;
        let currentSlideIndex = 0;
        
        // Input State
        let isDragging = false;
        let mouseDownPos = { x: 0, y: 0 };
        const CLICK_THRESHOLD = 15; // Increased tolerance for clicks (pixels)

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f4f8);
            scene.fog = new THREE.Fog(0xf0f4f8, 10, 60);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(12, 12, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            // Groups
            worldGroup = new THREE.Group();
            scene.add(worldGroup);
            
            interiorGroup = new THREE.Group();
            scene.add(interiorGroup);
            interiorGroup.visible = false;

            // Build Exterior
            buildHouse();
            buildEnvironment();

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Events
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            
            // Unified Input Handling
            const canvas = renderer.domElement;
            canvas.addEventListener('mousedown', onPointerDown);
            canvas.addEventListener('mouseup', onPointerUp);
            canvas.addEventListener('touchstart', onTouchStart, {passive: false});
            canvas.addEventListener('touchend', onTouchEnd, {passive: false});

            // Remove loading
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
            }, 500);

            animate();
        }

        // --- EXTERIOR BUILDER ---
        function createRoomBlock(name, x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { name: name, type: 'room' };
            
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.1 }));
            mesh.add(line);

            // Simple Window
            if (w >= 1.5) {
                const winGeo = new THREE.PlaneGeometry(0.8, 0.8);
                const winMat = new THREE.MeshBasicMaterial({ color: 0x2d3748 });
                const win = new THREE.Mesh(winGeo, winMat);
                win.position.set(0, 0, d/2 + 0.01);
                mesh.add(win);
            }

            worldGroup.add(mesh);
            clickableObjects.push(mesh);
        }

        function buildHouse() {
            // Basement
            createRoomBlock('basement', 0, 0.4, 0, 4.2, 0.8, 4.2, roomContent.basement.hex);
            // Ground
            createRoomBlock('living', -1.1, 1.8, 1, 2, 2, 2, roomContent.living.hex);
            createRoomBlock('studio', 1.1, 1.8, 1, 2, 2, 2, roomContent.studio.hex);
            createRoomBlock('toilet', 0, 1.5, -1.2, 1.5, 1.4, 1.5, roomContent.toilet.hex);
            // First
            createRoomBlock('bedroom', -1.1, 3.8, 1, 2, 2, 2, roomContent.bedroom.hex);
            createRoomBlock('bathroom', 1.1, 3.8, 1, 2, 2, 2, roomContent.bathroom.hex);
            
            // Roof
            const roofShape = new THREE.Shape();
            roofShape.moveTo(-2.5, 0); roofShape.lineTo(2.5, 0); roofShape.lineTo(0, 2.5); roofShape.lineTo(-2.5, 0);
            const roofGeo = new THREE.ExtrudeGeometry(roofShape, { depth: 2.2, bevelEnabled: false });
            roofGeo.center();
            const roofMat = new THREE.MeshStandardMaterial({ color: roomContent.attic.hex });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 5.8, 1);
            roof.userData = { name: 'attic', type: 'room' };
            worldGroup.add(roof);
            clickableObjects.push(roof);
        }

        function buildEnvironment() {
            const plane = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0xe2e8f0 }));
            plane.rotation.x = -Math.PI / 2;
            worldGroup.add(plane);
            // Trees... (Simplified for brevity)
            const addTree = (x, z) => {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1), new THREE.MeshStandardMaterial({ color: 0x5D4037 }));
                trunk.position.set(x, 0.5, z);
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(1, 2, 8), new THREE.MeshStandardMaterial({ color: 0x4a7c59 }));
                leaves.position.y = 1.5;
                trunk.add(leaves);
                worldGroup.add(trunk);
            };
            addTree(-5, -4); addTree(6, 2);
        }

        // --- INTERIOR BUILDER ---
        
        function buildInterior(roomKey) {
            // Clear previous interior
            while(interiorGroup.children.length > 0){ 
                interiorGroup.remove(interiorGroup.children[0]); 
            }
            interiorClickables.length = 0; // Clear clickables

            const data = roomContent[roomKey];
            
            // Room Shell (Open Box)
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
            const wallMat = new THREE.MeshStandardMaterial({ color: data.hex, side: THREE.DoubleSide });

            // Floor
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), floorMat);
            floor.rotation.x = -Math.PI/2;
            interiorGroup.add(floor);

            // Back Wall
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 8), wallMat);
            backWall.position.set(0, 4, -5);
            interiorGroup.add(backWall);

            // Left Wall
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 8), wallMat);
            leftWall.rotation.y = Math.PI/2;
            leftWall.position.set(-5, 4, 0);
            interiorGroup.add(leftWall);

            // Lighting for interior
            const bulb = new THREE.PointLight(0xffffff, 0.8, 20);
            bulb.position.set(0, 6, 0);
            interiorGroup.add(bulb);

            // Specifics
            if (roomKey === 'living') {
                createLivingRoomInterior();
            } else {
                createGenericInterior(data.title);
            }
        }

        // ... existing code for createGenericInterior, createLivingRoomInterior, createSlideTexture, nextTVSlide, enterRoom, exitRoom ...

        // --- IMPROVED INTERACTION LOGIC ---

        function onMouseMove(event) {
            // Update mouse coordinates for hover effects
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Move tooltip
            const tooltip = document.getElementById('tooltip');
            tooltip.style.left = event.clientX + 'px';
            tooltip.style.top = event.clientY + 'px';

            // Handle hover highlighting
            if (state === 'HOUSE') checkIntersectionExternal();
            if (state === 'ROOM') checkIntersectionInternal();
        }

        function onPointerDown(event) {
            mouseDownPos = { x: event.clientX, y: event.clientY };
        }

        function onPointerUp(event) {
            const dist = Math.sqrt(
                Math.pow(event.clientX - mouseDownPos.x, 2) + 
                Math.pow(event.clientY - mouseDownPos.y, 2)
            );
            
            // If movement is small, treat as a click
            if (dist < CLICK_THRESHOLD) {
                performClick(event.clientX, event.clientY);
            }
        }

        // Touch handling
        function onTouchStart(event) {
            if (event.touches.length === 1) {
                mouseDownPos = { x: event.touches[0].clientX, y: event.touches[0].clientY };
            }
        }

        function onTouchEnd(event) {
            if (event.changedTouches.length > 0) {
                const touch = event.changedTouches[0];
                const dist = Math.sqrt(
                    Math.pow(touch.clientX - mouseDownPos.x, 2) + 
                    Math.pow(touch.clientY - mouseDownPos.y, 2)
                );
                
                if (dist < CLICK_THRESHOLD) {
                    performClick(touch.clientX, touch.clientY);
                }
            }
        }

        function performClick(clientX, clientY) {
            // 1. Calculate normalized device coordinates from the click position
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            // 2. Cast a ray
            raycaster.setFromCamera(mouse, camera);

            if (state === 'HOUSE') {
                // Recursive true ensures we hit windows/lines and find the parent room
                const intersects = raycaster.intersectObjects(clickableObjects, true);
                
                if (intersects.length > 0) {
                    // Traverse up to find the object with user data (the Room Group/Mesh)
                    let target = intersects[0].object;
                    while (target && !target.userData.name) {
                        target = target.parent;
                    }

                    if (target && target.userData.name) {
                        enterRoom(target.userData.name);
                    }
                }
            } else if (state === 'ROOM') {
                const intersects = raycaster.intersectObjects(interiorClickables, true);
                if (intersects.length > 0) {
                    let target = intersects[0].object;
                    // Check if we clicked the TV or something interactive
                    if (target.userData.type === 'tv' || (target.parent && target.parent.userData.type === 'tv')) {
                        nextTVSlide();
                    }
                }
            }
        }

        function checkIntersectionExternal() {
            raycaster.setFromCamera(mouse, camera);
            // Non-recursive for hover is lighter on performance and sufficient for highlighting
            const intersects = raycaster.intersectObjects(clickableObjects, false);
            
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (hoveredObject !== obj) {
                    if (hoveredObject) hoveredObject.material.emissive.setHex(0x000000);
                    hoveredObject = obj;
                    hoveredObject.material.emissive.setHex(0x333333);
                    
                    document.body.style.cursor = 'pointer';
                    const tooltip = document.getElementById('tooltip');
                    tooltip.textContent = "Enter " + roomContent[hoveredObject.userData.name].title;
                    tooltip.style.opacity = 1;
                }
            } else {
                if (hoveredObject) {
                    hoveredObject.material.emissive.setHex(0x000000);
                    hoveredObject = null;
                    document.body.style.cursor = 'default';
                    document.getElementById('tooltip').style.opacity = 0;
                }
            }
        }

        function checkIntersectionInternal() {
            // ... existing checkIntersectionInternal code ...
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interiorClickables);
            
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                hoveredObject = obj;
                document.body.style.cursor = 'pointer';
            } else {
                hoveredObject = null;
                document.body.style.cursor = 'default';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
