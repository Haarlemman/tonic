<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Memory House 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- TWEEN.js for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap');

        :root {
            /* Changed to a dark dusky blue for the page background to match 3D scene */
            --bg-color: #1a1a2e; 
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            overflow: hidden;
            touch-action: none; /* Prevents default touch scrolling/zooming */
            color: #e2e8f0; /* Lighter text for dark mode */
        }

        .serif {
            font-family: 'Crimson Pro', serif;
        }

        /* Loading Screen - Darker theme */
        #loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
            color: white;
        }

        /* Tooltip/Label styling */
        #tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            color: #1a202c;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            transform: translate(-50%, -100%);
            margin-top: -25px;
            z-index: 10;
            white-space: nowrap;
            font-weight: bold;
        }

        /* Instructions overlay */
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: none;
            text-align: center;
            transition: opacity 0.3s;
            width: 80%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Transition Curtain */
        #curtain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }
        #curtain.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Back Button */
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            font-weight: bold;
            display: none; /* Hidden by default */
            transition: transform 0.2s;
            border: none;
            color: #1a202c;
        }
        #back-btn:hover {
            transform: scale(1.05);
            background: #ffffff;
        }

        /* Room Info Panel (In-Room) */
        #room-info {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(26, 32, 44, 0.95); /* Dark panel */
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 45;
            display: none;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="text-center">
            <h2 class="serif text-2xl mb-2">Building The Memory House...</h2>
            <div class="w-16 h-1 bg-gray-700 mx-auto overflow-hidden rounded">
                <div class="w-full h-full bg-blue-400 animate-pulse"></div>
            </div>
        </div>
    </div>

    <!-- UI Elements -->
    <header id="main-header" class="absolute top-6 left-0 w-full text-center pointer-events-none z-20 transition-opacity duration-500">
        <h1 class="serif text-3xl md:text-4xl text-gray-100 tracking-wide drop-shadow-lg" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">The House of Thought</h1>
        <p class="text-gray-400 text-sm mt-2 font-medium">Interactive 3D Environment</p>
    </header>

    <div id="tooltip">Room Name</div>

    <div id="instructions">
        Click a room to enter it • Drag to rotate
    </div>

    <button id="back-btn" onclick="exitRoom()">
        ← Exit Room
    </button>

    <div id="room-info">
        <!-- Content injected via JS -->
    </div>

    <!-- Transition Curtain -->
    <div id="curtain"></div>

    <!-- Hidden Video Element for the Bedroom -->
    <video id="phone-video" loop crossOrigin="anonymous" playsinline style="display:none;">
        <source src="video/spirit.mp4" type="video/mp4">
    </video>

    <!-- Audio Element for Living Room -->
    <!-- REPLACE src="" with your MP3 URL -->
    <audio id="living-room-audio" loop>
        <source src="audio/Amon Tobin - Feed.mp3" type="audio/mpeg">
    </audio>

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="w-full h-screen block outline-none cursor-move"></div>

    <script>
        // --- DATA ---
        const roomContent = {
            living: {
                title: "Living Room: Photos & Music",
                hex: 0xf59e0b, 
                description: "The walls are lined with graphic novels and art. Jazz plays softly. Use the TV to view memories.",
                tvImages: [
                    { text: "Bavo", image: "images/bavo1.jpg", color: "#000" },
                    { text: "Hitchin, UK", image: "images/hitchin1.jpg", color: "#999" },
                    { text: "Lisbon", image: "images/lisbon01.jpg", color: "#cc0000" },
                    { text: "Family: Ailish & Yaron", color: "#fca5a5" },
                    { text: "Tonic for the Bones (Draft)", color: "#93c5fd" },
                    { text: "Design Studio Work", color: "#86efac" },
                    { text: "Tel Aviv Sunset", color: "#fdba74" }
                ]
            },
            attic: {
                title: "The Attic: Memory",
                hex: 0x94a3b8,
                description: "Dust & Echoes. Old sketches, half-written manuscripts. The fragments of the past."
            },
            bathroom: {
                title: "The Bathroom: Parkinson",
                hex: 0x06b6d4,
                description: "The mirror reflects the physical reality. A space of vulnerability and resilience."
            },
            bedroom: {
                title: "The Bedroom: Stories",
                hex: 0xf43f5e,
                description: "Where dreaming happens. Tales for Yaron, stories about Ailish. Watch the story unfold on the phone.",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
            },
            toilet: {
                title: "Toilet: Ideas",
                hex: 0x14b8a6,
                description: "The Think Tank. Politics, religion, and rough drafts of philosophy."
            },
            studio: {
                title: "Studio: Science",
                hex: 0x6366f1,
                description: "Psychology & Reason. Dissecting the 'why' of human behavior."
            },
            basement: {
                title: "Basement: Vault",
                hex: 0x334155,
                description: "Deep Storage. Secrets, fears, and absolute truths."
            }
        };

        // --- 3D SETUP ---
        let camera, scene, renderer, controls;
        let raycaster, mouse;
        let textureLoader;
        
        // Groups
        let worldGroup; 
        let interiorGroup; 
        
        // Interaction State
        let state = 'HOUSE'; 
        let hoveredObject = null;
        const interiorClickables = []; 

        // TV State
        let tvMesh = null;
        let currentSlideIndex = 0;
        
        // Phone/Video State
        let videoElement = null;
        let videoTexture = null;
        
        // Audio State
        let audioPlayer = null;

        // Unified Input State
        let pointerDownX = 0;
        let pointerDownY = 0;
        let isPossibleClick = false;

        function init() {
            scene = new THREE.Scene();
            // DUSKY BACKGROUND
            scene.background = new THREE.Color(0x1a1a2e); 
            // FOG for mystery
            scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(12, 12, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Helpers
            textureLoader = new THREE.TextureLoader();

            // Light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3); // Dimmer ambient
            scene.add(ambientLight);
            
            // Warm sunset/dusky directional light
            const dirLight = new THREE.DirectionalLight(0xffd1b3, 0.8); 
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            // Groups
            worldGroup = new THREE.Group();
            scene.add(worldGroup);
            
            interiorGroup = new THREE.Group();
            scene.add(interiorGroup);
            interiorGroup.visible = false;

            // Build Exterior
            buildHouse();
            buildEnvironment();

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Events
            window.addEventListener('resize', onWindowResize);
            
            const canvas = renderer.domElement;
            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointermove', onPointerMove);
            canvas.addEventListener('pointerup', onPointerUp);

            // Media Setup
            videoElement = document.getElementById('phone-video');
            audioPlayer = document.getElementById('living-room-audio');

            // Remove loading
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
            }, 500);

            animate();
        }

        // --- EXTERIOR BUILDER ---
        function createRoomBlock(name, x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { name: name, type: 'room' };
            
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2 }));
            mesh.add(line);

            // Glowing Windows for Dusky look
            if (w >= 1.5) {
                const winGeo = new THREE.PlaneGeometry(0.8, 0.8);
                // Emissive yellow for "lights on" look
                const winMat = new THREE.MeshStandardMaterial({ 
                    color: 0xffffcc, 
                    emissive: 0xffaa00,
                    emissiveIntensity: 0.8,
                    roughness: 0.2
                });
                const win = new THREE.Mesh(winGeo, winMat);
                win.position.set(0, 0, d/2 + 0.01);
                mesh.add(win);
            }

            worldGroup.add(mesh);
        }

        function buildHouse() {
            // Basement
            createRoomBlock('basement', 0, 0.4, 0, 4.2, 0.8, 4.2, roomContent.basement.hex);
            // Ground
            createRoomBlock('living', -1.1, 1.8, 1, 2, 2, 2, roomContent.living.hex);
            createRoomBlock('studio', 1.1, 1.8, 1, 2, 2, 2, roomContent.studio.hex);
            createRoomBlock('toilet', 0, 1.5, -1.2, 1.5, 1.4, 1.5, roomContent.toilet.hex);
            // First
            createRoomBlock('bedroom', -1.1, 3.8, 1, 2, 2, 2, roomContent.bedroom.hex);
            createRoomBlock('bathroom', 1.1, 3.8, 1, 2, 2, 2, roomContent.bathroom.hex);
            
            // Roof
            const roofShape = new THREE.Shape();
            roofShape.moveTo(-2.5, 0); roofShape.lineTo(2.5, 0); roofShape.lineTo(0, 2.5); roofShape.lineTo(-2.5, 0);
            const roofGeo = new THREE.ExtrudeGeometry(roofShape, { depth: 2.2, bevelEnabled: false });
            roofGeo.center();
            const roofMat = new THREE.MeshStandardMaterial({ color: roomContent.attic.hex });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 5.8, 1);
            roof.userData = { name: 'attic', type: 'room' };
            worldGroup.add(roof);
        }

        // Procedural Grass Texture
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Base dark green
            ctx.fillStyle = '#1e3312'; 
            ctx.fillRect(0,0,512,512);
            
            // Add noise blades
            for(let i=0; i<8000; i++) {
                // Varying shades of green/teal for dusk
                const shade = Math.random();
                ctx.fillStyle = shade > 0.7 ? '#2d4a1c' : (shade > 0.4 ? '#385c24' : '#15260d');
                
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const w = Math.random() * 3 + 1;
                const h = Math.random() * 6 + 2;
                ctx.fillRect(x,y,w,h);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(10, 10);
            return tex;
        }

        function buildEnvironment() {
            // Textured Grass Ground
            const groundTex = createGrassTexture();
            const planeMat = new THREE.MeshStandardMaterial({ 
                map: groundTex, 
                roughness: 1, 
                color: 0x888888 // Tint it slightly
            });
            const plane = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), planeMat);
            plane.rotation.x = -Math.PI / 2;
            worldGroup.add(plane);

            // Trees
            const addTree = (x, z, scale=1) => {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2*scale, 0.3*scale, 1.5*scale), new THREE.MeshStandardMaterial({ color: 0x3e2723 }));
                trunk.position.set(x, 0.75*scale, z);
                // Darker leaves for dusk
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.2*scale, 2.5*scale, 8), new THREE.MeshStandardMaterial({ color: 0x1b4d3e }));
                leaves.position.y = 1.25*scale;
                trunk.add(leaves);
                trunk.castShadow = true;
                worldGroup.add(trunk);
            };
            
            // Add a few more trees for "scene" feel
            addTree(-6, -5, 1.2);
            addTree(7, 3, 1.1);
            addTree(-5, 6, 0.9);
            addTree(8, -4, 1.3);
            addTree(-8, 2, 0.8);
        }

        // --- INTERIOR BUILDER ---
        
        function buildInterior(roomKey) {
            while(interiorGroup.children.length > 0){ 
                interiorGroup.remove(interiorGroup.children[0]); 
            }
            interiorClickables.length = 0; 

            const data = roomContent[roomKey];
            
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
            const wallMat = new THREE.MeshStandardMaterial({ color: data.hex, side: THREE.DoubleSide });

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), floorMat);
            floor.rotation.x = -Math.PI/2;
            interiorGroup.add(floor);

            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 8), wallMat);
            backWall.position.set(0, 4, -5);
            interiorGroup.add(backWall);

            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 8), wallMat);
            leftWall.rotation.y = Math.PI/2;
            leftWall.position.set(-5, 4, 0);
            interiorGroup.add(leftWall);

            const bulb = new THREE.PointLight(0xffffff, 0.8, 20);
            bulb.position.set(0, 6, 0);
            interiorGroup.add(bulb);

            if (roomKey === 'living') {
                createLivingRoomInterior();
            } else if (roomKey === 'bedroom') {
                createBedroomInterior();
            } else {
                createGenericInterior(data.title);
            }
        }

        function createGenericInterior(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(255,255,255,0.0)';
            ctx.fillRect(0,0,512,256);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.shadowColor="rgba(0,0,0,0.5)";
            ctx.shadowBlur=4;
            ctx.fillText(text, 256, 128);
            
            const tex = new THREE.CanvasTexture(canvas);
            const plane = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
            plane.position.set(0, 4, -4.9);
            interiorGroup.add(plane);
        }

        function createLivingRoomInterior() {
            const standGeo = new THREE.BoxGeometry(4, 1.5, 1);
            const standMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a });
            const stand = new THREE.Mesh(standGeo, standMat);
            stand.position.set(0, 0.75, -4);
            interiorGroup.add(stand);

            const tvFrameGeo = new THREE.BoxGeometry(3.5, 2, 0.2);
            const tvFrame = new THREE.Mesh(tvFrameGeo, new THREE.MeshStandardMaterial({ color: 0x111111 }));
            tvFrame.position.set(0, 2.6, -4);
            interiorGroup.add(tvFrame);

            const screenGeo = new THREE.PlaneGeometry(3.3, 1.8);
            const tex = createSlideTexture(0);
            const screenMat = new THREE.MeshBasicMaterial({ map: tex });
            tvMesh = new THREE.Mesh(screenGeo, screenMat);
            tvMesh.position.set(0, 2.6, -3.89);
            tvMesh.userData = { type: 'tv', action: 'nextSlide' };
            
            interiorGroup.add(tvMesh);
            interiorClickables.push(tvMesh);

            const rug = new THREE.Mesh(new THREE.CircleGeometry(2.5, 32), new THREE.MeshStandardMaterial({ color: 0x92400e }));
            rug.rotation.x = -Math.PI/2;
            rug.position.y = 0.02;
            interiorGroup.add(rug);
        }

        function createBedroomInterior() {
            // 1. Desk
            // Dimensions: Width 5, Height 1.2, Depth 2
            // Y Position: 0.6. Top surface is at 0.6 + (1.2/2) = 1.2
            const deskGeo = new THREE.BoxGeometry(5, 1.2, 2);
            const deskMat = new THREE.MeshStandardMaterial({ color: 0x5D4037 });
            const desk = new THREE.Mesh(deskGeo, deskMat);
            desk.position.set(0, 0.6, -3);
            interiorGroup.add(desk);

            // 2. The Smartphone (Body)
            // Height 3.2. Half height 1.6.
            // To sit on desk (y=1.2), center needs to be at 1.2 + 1.6 = 2.8
            const phoneGeo = new THREE.BoxGeometry(1.8, 3.2, 0.1); 
            const phoneMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });
            const phone = new THREE.Mesh(phoneGeo, phoneMat);
            
            // FIXED: Raised to 2.8 so bottom sits on desk
            phone.position.set(0, 2.8, -3);
            phone.rotation.x = -0.1;
            interiorGroup.add(phone);

            // 3. Screen
            videoTexture = new THREE.VideoTexture(videoElement);
            const screenGeo = new THREE.PlaneGeometry(1.6, 2.8);
            const screenMat = new THREE.MeshBasicMaterial({ map: videoTexture });
            const screenMesh = new THREE.Mesh(screenGeo, screenMat);
            screenMesh.position.set(0, 0, 0.06);
            phone.add(screenMesh); 

            screenMesh.userData = { type: 'phone', action: 'toggleVideo' };
            interiorClickables.push(screenMesh);

            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.shadowColor="black"; ctx.shadowBlur=4;
            ctx.fillText("Click screen to play/pause video", 256, 64);
            const hintTex = new THREE.CanvasTexture(canvas);
            const hintPlane = new THREE.Mesh(new THREE.PlaneGeometry(4, 1), new THREE.MeshBasicMaterial({ map: hintTex, transparent: true }));
            hintPlane.position.set(0, 5, -3); // Moved up
            interiorGroup.add(hintPlane);
        }

        function createSlideTexture(index) {
            const slide = roomContent.living.tvImages[index];
            if (slide.image) {
                const tex = textureLoader.load(slide.image);
                return tex;
            }
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = slide.color;
            ctx.fillRect(0,0,512,256);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(slide.text, 256, 110);
            ctx.font = '20px Arial';
            ctx.fillText("(Click TV for next photo)", 256, 160);
            return new THREE.CanvasTexture(canvas);
        }

        function nextTVSlide() {
            currentSlideIndex = (currentSlideIndex + 1) % roomContent.living.tvImages.length;
            if(tvMesh) {
                tvMesh.material.map = createSlideTexture(currentSlideIndex);
                tvMesh.material.needsUpdate = true;
            }
        }

        function toggleVideo() {
            if (videoElement.paused) videoElement.play();
            else videoElement.pause();
        }

        // --- TRANSITIONS ---

        function enterRoom(roomName) {
            state = 'TRANSITION';
            const curtain = document.getElementById('curtain');
            curtain.classList.add('active'); 
            
            // AUDIO LOGIC
            if (roomName === 'living' && audioPlayer) {
                // Try playing audio (requires user interaction first usually, click handles this)
                audioPlayer.currentTime = 0;
                audioPlayer.play().catch(e => console.log("Audio autoplay prevented"));
            }

            setTimeout(() => {
                worldGroup.visible = false;
                buildInterior(roomName);
                interiorGroup.visible = true;
                
                camera.position.set(0, 5, 8);
                camera.lookAt(0, 3, 0);
                controls.target.set(0, 3, 0);
                controls.update();

                const infoPanel = document.getElementById('room-info');
                infoPanel.style.display = 'block';
                const data = roomContent[roomName];
                infoPanel.innerHTML = `
                    <h2 class="text-2xl font-bold mb-2 text-gray-100">${data.title}</h2>
                    <p class="text-gray-300 leading-relaxed">${data.description}</p>
                `;

                document.getElementById('main-header').style.opacity = 0;
                document.getElementById('back-btn').style.display = 'block';
                document.getElementById('tooltip').style.opacity = 0;
                document.getElementById('instructions').textContent = "Click highlighted items inside.";

                curtain.classList.remove('active');
                state = 'ROOM';
            }, 800);
        }

        function exitRoom() {
            state = 'TRANSITION';
            const curtain = document.getElementById('curtain');
            curtain.classList.add('active');

            if (videoElement && !videoElement.paused) videoElement.pause();
            
            // AUDIO LOGIC
            if (audioPlayer && !audioPlayer.paused) {
                audioPlayer.pause();
            }

            setTimeout(() => {
                interiorGroup.visible = false;
                worldGroup.visible = true;
                
                camera.position.set(12, 12, 12);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();

                document.getElementById('room-info').style.display = 'none';
                document.getElementById('back-btn').style.display = 'none';
                document.getElementById('main-header').style.opacity = 1;
                document.getElementById('instructions').textContent = "Click a room to enter it • Drag to rotate";

                curtain.classList.remove('active');
                state = 'HOUSE';
            }, 800);
        }

        // --- INPUT HANDLING ---

        function updateMousePosition(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        }

        function onPointerDown(event) {
            isPossibleClick = true;
            pointerDownX = event.clientX;
            pointerDownY = event.clientY;
        }

        function onPointerMove(event) {
            const dist = Math.hypot(event.clientX - pointerDownX, event.clientY - pointerDownY);
            if (dist > 10) isPossibleClick = false;


            updateMousePosition(event);
            if (state === 'HOUSE') checkIntersectionExternal();
            else if (state === 'ROOM') checkIntersectionInternal();
            
            const tooltip = document.getElementById('tooltip');
            tooltip.style.left = event.clientX + 'px';
            tooltip.style.top = event.clientY + 'px';
        }

        function onPointerUp(event) {
            if (isPossibleClick) performClick(event);
            isPossibleClick = false;
        }

        function performClick(event) {
            updateMousePosition(event);
            raycaster.setFromCamera(mouse, camera);

            if (state === 'HOUSE') {
                const intersects = raycaster.intersectObjects(worldGroup.children, true);
                if (intersects.length > 0) {
                    let target = intersects[0].object;
                    while (target && (!target.userData || !target.userData.name)) {
                        target = target.parent;
                    }
                    if (target && target.userData && target.userData.name) {
                        enterRoom(target.userData.name);
                    }
                }
            } 
            else if (state === 'ROOM') {
                const intersects = raycaster.intersectObjects(interiorClickables, true);
                if (intersects.length > 0) {
                    let target = intersects[0].object;
                    if (target.userData.type === 'tv') nextTVSlide();
                    else if (target.userData.type === 'phone') toggleVideo();
                }
            }
        }

        function checkIntersectionExternal() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(worldGroup.children, true);
            
            if (intersects.length > 0) {
                let target = intersects[0].object;
                while (target && (!target.userData || !target.userData.name)) target = target.parent;

                if (target && target.userData && target.userData.name) {
                    if (hoveredObject !== target) {
                        if (hoveredObject) hoveredObject.material.emissive.setHex(0x000000); // Reset OLD window glow if it was a generic room
                        // Wait, we used specific window meshes for glow.
                        // Emissive highlight logic for interaction:
                        hoveredObject = target;
                        // Just show tooltip, don't mess with custom emissive windows too much or it flickers
                        document.body.style.cursor = 'pointer';
                        const tooltip = document.getElementById('tooltip');
                        tooltip.textContent = "Enter " + roomContent[hoveredObject.userData.name].title;
                        tooltip.style.opacity = 1;
                    }
                    return; 
                }
            }

            if (hoveredObject) {
                hoveredObject = null;
                document.body.style.cursor = 'default';
                document.getElementById('tooltip').style.opacity = 0;
            }
        }

        function checkIntersectionInternal() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interiorClickables);
            if (intersects.length > 0) document.body.style.cursor = 'pointer';
            else document.body.style.cursor = 'default';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
