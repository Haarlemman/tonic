<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="House of Awe">
    <meta name="theme-color" content="#000000">
    <title>House of Awe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #0a0a0a;
            color: #e2e8f0;
            font-family: 'Lato', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: max(2rem, env(safe-area-inset-top, 2rem))
                     max(2rem, env(safe-area-inset-right, 2rem))
                     max(2rem, env(safe-area-inset-bottom, 2rem))
                     max(2rem, env(safe-area-inset-left, 2rem));
        }

        .icon {
            opacity: 0.35;
            margin-bottom: 2rem;
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.25; transform: scale(1); }
            50%       { opacity: 0.45; transform: scale(1.04); }
        }

        h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(1rem, 4vw, 1.3rem);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 1rem;
        }

        p {
            font-size: 0.9rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.45);
            max-width: 280px;
            margin-bottom: 2.5rem;
        }

        .swipe-hint {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
            margin-bottom: 3rem;
        }

        .swipe-hint span {
            display: block;
            animation: swipe-up 2.5s ease-in-out infinite;
            font-size: 1.2rem;
            margin-bottom: 0.4rem;
        }

        @keyframes swipe-up {
            0%   { transform: translateY(4px); opacity: 0.3; }
            50%  { transform: translateY(-4px); opacity: 0.8; }
            100% { transform: translateY(4px); opacity: 0.3; }
        }

        .back-link {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            padding-bottom: 2px;
            transition: color 0.2s;
        }

        .back-link:hover, .back-link:active {
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>

    <!-- Breathing infinity / power icon -->
    <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="none"
             stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
             viewBox="0 0 24 24">
            <path d="M18.36 6.64A9 9 0 1 1 5.64 6.64"/>
            <line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
    </div>

    <h1>Until next time</h1>

    <p>Your progress is saved.<br>The House will remember you.</p>

    <div class="swipe-hint">
        <span>↑</span>
        swipe up to close
    </div>

    <a href="index.html" class="back-link">← Return to the house</a>

    <script>
        // Attempt window.close() on platforms that support it (non-iOS browsers)
        try {
            const isStandalone = window.navigator.standalone === true ||
                window.matchMedia('(display-mode: standalone)').matches;
            // On Android TWA / Chrome PWA, window.close() may work
            if (isStandalone && !(/iPhone|iPad|iPod/i.test(navigator.userAgent))) {
                window.close();
            }
        } catch(e) {}
    </script>

</body>
</html>
