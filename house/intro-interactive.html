<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House of Awe — Interactive Intro</title>
  <link rel="stylesheet" href="https://use.typekit.net/lcd0ood.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #192840;
      --red: #e82030;
      --red-dk: #6a0d16;
      --yel: #f5c800;
      --yel-dk: #6a5500;
      --cyn: #00d0e8;
      --cyn-dk: #004d58;
      --gry: #8aa8c0;
      --gry-dk: #2a3e50;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--navy);
      overflow: hidden;
      font-family: omnium, sans-serif;
    }

    /* ── Vignette ─────────────────────────────────────────── */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
      background: radial-gradient(ellipse 100% 100% at 50% 50%,
          transparent 30%, rgba(10, 18, 30, .7) 100%);
    }

    /* ── Scanlines ────────────────────────────────────────── */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 201;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px,
          rgba(0, 0, 0, .05) 3px, rgba(0, 0, 0, .05) 4px);
    }

    /* ── Floating particles ───────────────────────────────── */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .dot {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0% {
        opacity: 0;
        transform: translateY(0) translateX(0);
      }

      10% {
        opacity: .55;
      }

      90% {
        opacity: .25;
      }

      100% {
        opacity: 0;
        transform: translateY(-100vh) translateX(20px);
      }
    }

    #interactive-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    /* ── HUD / Help Info ─────────────────────────────────── */
    .hud {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 210;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .hud-hint {
      color: #ffffff;
      font-size: clamp(0.75rem, 1.5vw, 0.9rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.8;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      animation: pulse 2s infinite ease-in-out;
    }

    .hud-btn {
      pointer-events: auto;
      background: var(--red);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(232, 32, 48, 0.4);
      transition: all 0.3s ease;
    }

    .hud-btn:hover {
      background: #ffffff;
      color: var(--red);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 255, 255, 0.4);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.95; }
    }
  </style>
</head>

<body>

  <div class="particles" id="pts"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <!-- Fullscreen WebGL Canvas -->
  <canvas id="interactive-canvas"></canvas>

  <!-- HUD overlay instructions -->
  <div class="hud">
    <div class="hud-hint">Drag to Rotate • Scroll to Zoom • Click House to Enter</div>
    <button class="hud-btn" id="enter-btn">Enter Site</button>
  </div>

  <script>
    // Get visitor name
    let nameToDisplay = 'YOU';
    try {
      const savedQuiz = JSON.parse(localStorage.getItem('userQuizProgress') || '{}');
      const savedReflections = JSON.parse(localStorage.getItem('houseReflections') || '{}');
      const savedName = savedQuiz.name || savedReflections.name;
      if (savedName && savedName.trim() !== '') {
        nameToDisplay = savedName.trim().toUpperCase();
      }
    } catch (e) {
      console.error('Error reading localStorage for visitor name:', e);
    }

    /* particles */
    (function () {
      const c = document.getElementById('pts');
      const cols = ['#00d0e8', '#e82030', '#f5c800', '#8aa8c0'];
      for (let i = 0; i < 50; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        const s = Math.random() * 2.5 + .8;
        d.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;
      bottom:${-Math.random() * 10}%;background:${cols[~~(Math.random() * 4)]};
      animation-duration:${7 + Math.random() * 14}s;animation-delay:${Math.random() * 12}s`;
        c.appendChild(d);
      }
    })();

    /* 3D Scene Initialization */
    (function () {
      if (typeof THREE === 'undefined') return;

      const canvas = document.getElementById('interactive-canvas');
      if (!canvas) return;

      let scene, camera, renderer, controls;
      let houseGroup, leftArmGroup, rightArmGroup;
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let hovered = false;

      // Textures and Materials
      let brickAmsterdamTex, brickDudokTex, roofTex, numberTex, noiseTex, cellTex;
      let amsterdamMat, dudokMat, planeMat, studioMat, doorFacadeMat, doorMat, winMat, redRoofMat, frameMat;
      let stepDarkMat, stepWhiteMat, stepMats;

      function createNoiseTexture() {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#C0C0C0';
        ctx.fillRect(0, 0, size, size);
        const idata = ctx.getImageData(0, 0, size, size);
        for (let i = 0; i < idata.data.length; i += 4) {
          const grain = (Math.random() - 0.5) * 30;
          idata.data[i] = Math.min(255, Math.max(0, 128 + grain));
          idata.data[i + 1] = Math.min(255, Math.max(0, 128 + grain));
          idata.data[i + 2] = Math.min(255, Math.max(0, 128 + grain));
          idata.data[i + 3] = 255;
        }
        ctx.putImageData(idata, 0, 0);
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      function createBrickTexture(type) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const isAmsterdam = (type === 'amsterdam');
        const baseColor = isAmsterdam ? '#8b4513' : '#f0e68c';
        ctx.fillStyle = baseColor;
        ctx.fillRect(0, 0, 512, 512);

        const rows = 16, cols = 8;
        const h = 512 / rows, w = 512 / cols;

        for (let r = 0; r < rows; r++) {
          const offset = (r % 2) * (w / 2);
          for (let c = -1; c < cols + 1; c++) {
            const vari = Math.random() * 30 - 15;
            if (isAmsterdam) {
              const rVal = 139 + vari;
              const gVal = 69 + vari * 0.5;
              const bVal = 19 + vari * 0.2;
              ctx.fillStyle = `rgb(${rVal}, ${gVal}, ${bVal})`;
            } else {
              const rVal = 240 + vari;
              const gVal = 230 + vari;
              const bVal = 140 + vari;
              ctx.fillStyle = `rgb(${rVal}, ${gVal}, ${bVal})`;
            }
            ctx.fillRect(c * w + offset + 2, r * h + 2, w - 4, h - 4);
            ctx.strokeStyle = isAmsterdam ? 'rgba(0,0,0,0.3)' : 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(c * w + offset + 2, r * h + 2, w - 4, h - 4);
          }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(4, 8);
        return tex;
      }

      function createHouseNumberTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 128, 128);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 80px "Courier New", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('42', 64, 64);
        return new THREE.CanvasTexture(canvas);
      }

      function createRoofTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#5c0000'; ctx.fillRect(0, 0, 512, 512);
        const rows = 10, cols = 8;
        const tileH = 512 / rows, tileW = 512 / cols;
        for (let r = 0; r < rows; r++) {
          const offset = (r % 2) * (tileW / 2);
          for (let c = -1; c < cols + 1; c++) {
            const shade = Math.random() * 40;
            const redVal = 100 + shade;
            ctx.fillStyle = `rgb(${redVal}, 20, 20)`;
            ctx.beginPath();
            ctx.rect(c * tileW + offset + 2, r * tileH + 2, tileW - 4, tileH - 4);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.stroke();
          }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 4);
        return tex;
      }

      function createCellTexture() {
        const sc = document.createElement('canvas'); sc.width = 64; sc.height = 64;
        const sctx = sc.getContext('2d');
        sctx.fillStyle = '#0a2a55'; sctx.fillRect(0, 0, 64, 64);
        sctx.strokeStyle = '#1a4a80'; sctx.lineWidth = 2;
        for (let i = 1; i < 4; i++) {
          sctx.beginPath(); sctx.moveTo(i * 16, 0); sctx.lineTo(i * 16, 64); sctx.stroke();
          sctx.beginPath(); sctx.moveTo(0, i * 16); sctx.lineTo(64, i * 16); sctx.stroke();
        }
        return new THREE.CanvasTexture(sc);
      }

      function wAddPart(w, h, d, x, y, z, mat) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 }));
        mesh.add(line);

        houseGroup.add(mesh);
        return mesh;
      }

      function wAddRoomBlock(x, y, z, w, h, d, color, winConfigs = null) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const roomColor = new THREE.Color(color).addScalar(0.3);
        const mat = new THREE.MeshStandardMaterial({
          color: roomColor,
          roughness: 0.9,
          bumpMap: noiseTex,
          bumpScale: 0.05,
          map: noiseTex
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 }));
        mesh.add(line);

        if (winConfigs) {
          const configs = Array.isArray(winConfigs) ? winConfigs : [winConfigs];
          configs.forEach(cfg => {
            const s = cfg.scale || 1.0;
            const frameW = (cfg.narrow ? 0.4 : 1.0) * s;
            const frameH = cfg.height ? cfg.height : (1.0 * s);
            const shift = cfg.shift || 0;
            const frameDepth = 0.1;
            const frameColor = cfg.type === 'white' ? 0xffffff : 0x222222;

            const frame = new THREE.Mesh(
              new THREE.BoxGeometry(frameW, frameH, frameDepth),
              new THREE.MeshStandardMaterial({ color: frameColor })
            );

            const zOffset = d / 2 + 0.02;
            const xOffset = w / 2 + 0.02;
            const side = cfg.side || 'front';

            if (side === 'front') frame.position.set(shift, 0, zOffset);
            else if (side === 'back') {
              frame.position.set(shift, 0, -zOffset);
              frame.rotation.y = Math.PI;
            } else if (side === 'left') {
              frame.position.set(-xOffset, 0, shift);
              frame.rotation.y = -Math.PI / 2;
            } else if (side === 'right') {
              frame.position.set(xOffset, 0, shift);
              frame.rotation.y = Math.PI / 2;
            }

            const glass = new THREE.Mesh(
              new THREE.PlaneGeometry(frameW * 0.85, frameH * 0.85),
              winMat
            );
            glass.position.z = 0.06;
            frame.add(glass);
            mesh.add(frame);
          });
        }
        houseGroup.add(mesh);
        return mesh;
      }

      // ── Generate 3D Text Texture and Plane ─────────────────
      function create3DTextPlane(text, sizeClass, colorHex, shadowColorHex, width, height, fontFamily = 'omnium, sans-serif') {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        let fontSize = 72;
        if (sizeClass === 'xl') fontSize = 120;
        else if (sizeClass === 'lg') fontSize = 90;
        else if (sizeClass === 'md') fontSize = 72;
        else if (sizeClass === 'sm') fontSize = 48;

        ctx.font = `bold ${fontSize}px ${fontFamily}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Draw 3D shadow extrusion in canvas
        ctx.fillStyle = shadowColorHex;
        for (let offset = 1; offset <= 8; offset++) {
          ctx.fillText(text, 512 - offset, 128 + offset);
        }

        // Main text
        ctx.fillStyle = colorHex;
        ctx.fillText(text, 512, 128);

        const tex = new THREE.CanvasTexture(canvas);
        tex.minFilter = THREE.LinearFilter;

        const planeGeo = new THREE.PlaneGeometry(width, height);
        const planeMat = new THREE.MeshBasicMaterial({
          map: tex,
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false
        });

        const mesh = new THREE.Mesh(planeGeo, planeMat);
        return mesh;
      }

      function init() {
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 16, 25);
        camera.lookAt(0, 4.5, 0);

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // OrbitControls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05; // Prevent camera from going completely underground
        controls.minDistance = 8;
        controls.maxDistance = 45;
        controls.target.set(0, 3.5, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight1.position.set(20, 35, 20);
        dirLight1.castShadow = true;
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.35);
        dirLight2.position.set(-20, -35, -20);
        scene.add(dirLight2);

        // Init Textures
        brickAmsterdamTex = createBrickTexture('amsterdam');
        brickDudokTex = createBrickTexture('dudok');
        roofTex = createRoofTexture();
        numberTex = createHouseNumberTexture();
        noiseTex = createNoiseTexture();
        cellTex = createCellTexture();

        // Init Materials
        amsterdamMat = new THREE.MeshStandardMaterial({ color: 0x4d2600, map: brickAmsterdamTex, roughness: 0.8 });
        dudokMat = new THREE.MeshStandardMaterial({ color: 0x3d1f0d, map: brickDudokTex, roughness: 0.9 });
        planeMat = new THREE.MeshStandardMaterial({ color: 0x5c0000, roughness: 0.6 });
        studioMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.4, metalness: 0.1 });
        doorFacadeMat = new THREE.MeshStandardMaterial({ color: 0x5c3317, roughness: 0.5 });
        doorMat = new THREE.MeshStandardMaterial({ color: 0x3d1f0d, roughness: 0.6 });
        winMat = new THREE.MeshStandardMaterial({ color: 0xfffde0, emissive: 0xffbb00, emissiveIntensity: 1.8, roughness: 0.1 });
        redRoofMat = new THREE.MeshStandardMaterial({ map: roofTex, color: 0xcc1010, roughness: 0.85 });
        frameMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.4, metalness: 0.6 });
        stepDarkMat = new THREE.MeshStandardMaterial({ color: 0x1a0d00 });
        stepWhiteMat = new THREE.MeshStandardMaterial({ color: 0xbfb5ae });
        stepMats = [stepDarkMat, stepDarkMat, stepDarkMat, stepDarkMat, stepWhiteMat, stepDarkMat];

        // Groups
        houseGroup = new THREE.Group();
        houseGroup.position.set(0, 0.5, 0);
        scene.add(houseGroup);

        leftArmGroup = new THREE.Group();
        rightArmGroup = new THREE.Group();
        scene.add(leftArmGroup);
        scene.add(rightArmGroup);

        buildHouse();
        buildTextArms();

        // Animation Loop
        animate();

        // Event Listeners
        window.addEventListener('resize', onResize);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('click', onClick);
        document.getElementById('enter-btn').addEventListener('click', navigateToSite);
        document.addEventListener('keydown', e => {
          if (['Enter', 'Space'].includes(e.code)) {
            navigateToSite();
          }
        });
      }

      function buildHouse() {
        // Foundation
        wAddPart(7.5, 0.8, 6.5, 0, 0.4, 0, dudokMat);

        // Horizontal red plates
        wAddPart(7.5, 0.1, 6.5, 0, 0.85, 0, planeMat);
        wAddPart(7.5, 0.1, 6.5, 0, 3.25, 0, planeMat);

        // Living Room
        const livingX = -2.05, livingY = 2.1, livingZ = 0;
        const livingW = 2.9, livingH = 2.4, livingD = 5;
        wAddPart(livingW, livingH, livingD, livingX, livingY, livingZ, amsterdamMat);
        wAddPart(1.5, 0.4, 0.1, livingX, livingY + 0.4, livingZ + 2.55, winMat);
        wAddPart(1.5, 0.4, 0.1, livingX, livingY + 0.4, livingZ - 2.55, winMat);

        // Studio
        const studioX = 2.0, studioY = 2.05, studioZ = 0;
        const studioW = 2.8, studioH = 2.4, studioD = 5;
        wAddPart(studioW, studioH, studioD, studioX, studioY, studioZ, studioMat);
        wAddPart(1.5, 0.4, 0.1, studioX, studioY + 0.4, studioZ - 2.55, winMat);

        // Circular window
        const circWinGroup = new THREE.Group();
        circWinGroup.position.set(studioX, studioY, studioZ + 2.52);
        const circFrame = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.05, 8, 32), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        circFrame.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.TorusGeometry(0.6, 0.05, 8, 32)), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 })));
        circWinGroup.add(circFrame);
        const circGlass = new THREE.Mesh(new THREE.CircleGeometry(0.6, 32), winMat);
        circWinGroup.add(circGlass);
        houseGroup.add(circWinGroup);

        // Studio side windows (5 slots)
        const sWinSpan = 3.2;
        for (let i = 0; i < 5; i++) {
          const zPos = (studioZ - sWinSpan / 2) + (i * (sWinSpan / 4));
          wAddPart(0.12, 0.5, 0.5, studioX + 1.42, studioY + 0.3, zPos, winMat);
        }

        // Studio roof plate
        wAddPart(2.8, 0.05, 5.0, studioX, studioY + studioH / 2 + 0.025, studioZ, new THREE.MeshStandardMaterial({ color: 0xff0000 }));

        // Entrance Facade & Door
        wAddPart(1.2, 1.8, 0.2, 0, 1.6, 2.45, doorFacadeMat);
        const door = wAddPart(0.8, 1.6, 0.1, 0, 1.6, 2.57, doorMat);
        const windowShape = new THREE.Shape();
        windowShape.moveTo(0, 0.15); windowShape.lineTo(-0.1, -0.05); windowShape.lineTo(0.1, -0.05); windowShape.lineTo(0, 0.15);
        const triangularWindow = new THREE.Mesh(new THREE.ShapeGeometry(windowShape), winMat);
        triangularWindow.position.set(0, 0.4, 0.06);
        door.add(triangularWindow);
        const knob = new THREE.Mesh(new THREE.SphereGeometry(0.04), new THREE.MeshStandardMaterial({ color: 0x996633 }));
        knob.position.set(0.3, 0, 0.08); door.add(knob);

        // Number 42
        const numberMat = new THREE.MeshBasicMaterial({ map: numberTex, transparent: true });
        const numberPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), numberMat);
        numberPlane.position.set(0, 2.7, 2.56);
        houseGroup.add(numberPlane);

        // Hall ceilings
        wAddPart(1.25, 0.2, 5.0, 0, 3.15, 0, new THREE.MeshStandardMaterial({ color: 0x221100 }));
        wAddPart(1.25, 2.4, 0.2, 0, 2.0, -2.4, doorFacadeMat);
        wAddPart(1.2, 0.55, 0.2, 0, 2.775, 2.45, doorFacadeMat);

        // Bedroom Cantilever
        const bedX = -1.8, bedY = 4.5, bedZ = 0.5;
        wAddRoomBlock(bedX, bedY, bedZ, 3.2, 2.4, 4.0, 0x5c3317, [
          { type: 'dark', side: 'front', scale: 0.8 },
          { type: 'dark', side: 'back', scale: 0.4 }
        ]);
        wAddPart(0.1, 1.2, 1.5, bedX - 1.65, bedY, bedZ, winMat);

        // Bathroom Tower
        const bathX = 2.0, bathY = 5.05, bathZ = 0;
        wAddPart(2.0, 6.0, 2.5, bathX, bathY, bathZ, amsterdamMat);
        for (let i = 0; i < 3; i++) {
          wAddPart(0.1, 1.0, 0.4, bathX + 1.03, bathY + i * 1.2 - 0.1, 0, winMat);
        }
        for (let i = 0; i < 3; i++) {
          wAddPart(1.6, 1.0, 0.1, bathX, bathY + i * 1.2 - 0.1, bathZ - 1.27, winMat);
        }
        const bathRoofTopY = bathY + 3.0 + 0.06;
        wAddPart(2.3, 0.12, 2.8, bathX, bathRoofTopY, bathZ, redRoofMat);

        // Bathroom Solar Panels
        for (let r = 0; r < 2; r++) {
          wAddPart(0.71, 0.06, 0.61, bathX, bathRoofTopY + 0.07, bathZ - 0.35 + r * 0.7, frameMat);
          wAddPart(0.65, 0.04, 0.55, bathX, bathRoofTopY + 0.09, bathZ - 0.35 + r * 0.7, new THREE.MeshStandardMaterial({ color: 0x0a2a55, roughness: 0.2, metalness: 0.8, map: cellTex }));
        }

        // Attic Slab
        const roofBaseY = 6.6;
        wAddPart(7.5, 0.2, 6.0, 0, roofBaseY, 0, new THREE.MeshStandardMaterial({ color: 0xff0000 }));

        // Attic Room
        const atticX = -1.2, atticY = roofBaseY + 1.25, atticZ = 0;
        const atticW = 3.6, atticH = 2.4, atticD = 4.5;
        wAddRoomBlock(atticX, atticY, atticZ, atticW, atticH, atticD, 0x4d2600, { type: 'dark', side: 'back', scale: 0.8 });
        for (let i = 0; i < 6; i++) {
          wAddPart(0.12, 1.2, 0.1, atticX - 1.5 + i * 0.6, atticY + 0.2, atticZ + 2.28, winMat);
        }
        wAddPart(atticW + 0.3, 0.12, atticD + 0.3, atticX, atticY + atticH / 2 + 0.06, atticZ, redRoofMat);

        // Attic Solar Panels
        const _roofY = atticY + atticH / 2 + 0.13;
        const _pW = 0.7, _pD = 0.55, _gap = 0.12;
        const _sx = atticX - _pW / 2 - _gap / 2;
        const _sz = atticZ - _pD - _gap;
        for (let c = 0; c < 2; c++) {
          for (let r = 0; r < 3; r++) {
            const px = _sx + c * (_pW + _gap);
            const pz = _sz + r * (_pD + _gap);
            wAddPart(_pW + 0.06, 0.06, _pD + 0.06, px, _roofY, pz, frameMat);
            wAddPart(_pW, 0.04, _pD, px, _roofY + 0.02, pz, new THREE.MeshStandardMaterial({ color: 0x0a2a55, roughness: 0.2, metalness: 0.8, map: cellTex }));
          }
        }

        // Steps
        for (let i = 0; i < 4; i++) {
          wAddPart(2.0 - i * 0.2, 0.2, 0.4, 0, 0.1 + i * 0.22, 4.75 - i * 0.4, stepMats);
        }
      }

      function buildTextArms() {
        // Left Arm text configurations
        const leftConfigs = [
          { text: 'EXPLORE', size: 'sm', color: '#8aa8c0', dk: '#2a3e50', w: 6, h: 1.5 },
          { text: 'AND DISCOVER', size: 'sm', color: '#8aa8c0', dk: '#2a3e50', w: 6, h: 1.5 },
          { text: 'THE HOUSE', size: 'lg', color: '#e82030', dk: '#6a0d16', w: 8, h: 2.0 },
          { text: 'OF AWE', size: 'xl', color: '#e82030', dk: '#6a0d16', w: 8, h: 2.0 }
        ];

        // Stacking text lines vertically inside leftArmGroup
        leftConfigs.forEach((cfg, i) => {
          const plane = create3DTextPlane(cfg.text, cfg.size, cfg.color, cfg.dk, cfg.w, cfg.h, cfg.font || 'omnium, sans-serif');
          // Stack from bottom to top (OF AWE at bottom, EXPLORE at top)
          plane.position.y = (leftConfigs.length - 1 - i) * 1.5;
          leftArmGroup.add(plane);
        });

        // Position Left Arm in 3D Scene
        leftArmGroup.position.set(-8.5, 2.5, 3.0);
        leftArmGroup.rotation.y = -Math.PI / 5; // Rotate slightly outward
        leftArmGroup.rotation.z = Math.PI / 12; // Tilt slightly

        // Right Arm text configurations
        const rightConfigs = [
          { text: 'THE MEANING', size: 'sm', color: '#f5c800', dk: '#6a5500', w: 6, h: 1.5, font: 'Bebas Neue, sans-serif' },
          { text: 'OF LIFE', size: 'xl', color: '#f5c800', dk: '#6a5500', w: 8, h: 2.0, font: 'Bebas Neue, sans-serif' },
          { text: 'ACCORDING TO', size: 'md', color: '#00d0e8', dk: '#004d58', w: 8, h: 2.0, font: 'Bebas Neue, sans-serif' },
          { text: nameToDisplay, size: 'lg', color: '#ffffff', dk: '#8aa8c0', w: 8, h: 2.0, font: 'Bebas Neue, sans-serif' }
        ];

        rightConfigs.forEach((cfg, i) => {
          const plane = create3DTextPlane(cfg.text, cfg.size, cfg.color, cfg.dk, cfg.w, cfg.h, cfg.font || 'Bebas Neue, sans-serif');
          plane.position.y = (rightConfigs.length - 1 - i) * 1.5;
          rightArmGroup.add(plane);
        });

        // Position Right Arm in 3D Scene
        rightArmGroup.position.set(8.5, 2.5, 3.0);
        rightArmGroup.rotation.y = Math.PI / 5;
        rightArmGroup.rotation.z = -Math.PI / 12;
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onMouseMove(e) {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(houseGroup.children, true);

        if (intersects.length > 0) {
          if (!hovered) {
            document.body.style.cursor = 'pointer';
            winMat.emissiveIntensity = 2.6; // High window glow on hover
            hovered = true;
          }
        } else {
          if (hovered) {
            document.body.style.cursor = 'default';
            winMat.emissiveIntensity = 1.8; // Restore normal glow
            hovered = false;
          }
        }
      }

      function onClick(e) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(houseGroup.children, true);
        if (intersects.length > 0) {
          navigateToSite();
        }
      }

      function navigateToSite() {
        location.href = 'index.html';
      }

      function animate() {
        requestAnimationFrame(animate);

        // Smooth floating animation for V-shaped 3D text
        const time = Date.now() * 0.0015;
        leftArmGroup.position.y = 2.5 + Math.sin(time) * 0.15;
        rightArmGroup.position.y = 2.5 + Math.sin(time + 0.6) * 0.15;

        // Slight breathing scale on glowing windows
        winMat.emissiveIntensity = (hovered ? 2.6 : 1.8) + Math.sin(time * 2.0) * 0.15;

        controls.update();
        renderer.render(scene, camera);
      }

      // Initial execution
      setTimeout(init, 100);
    })();
  </script>
</body>
