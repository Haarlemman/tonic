<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy Division - Unknown Pleasures Classic Refined</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: move;
        }
        .ui-overlay {
            position: absolute;
            bottom: 40px;
            text-align: center;
            pointer-events: none;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-weight: 300;
            font-size: 14px;
            opacity: 0.5;
        }
        .controls-hint {
            position: absolute;
            top: 20px;
            font-size: 10px;
            opacity: 0.4;
            letter-spacing: 0.1em;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="controls-hint">
        Left Drag: Rotate • Right Drag (or Shift+Left): Pan<br>
        Scroll: Zoom • Classic Slices with Subtle Pulse
    </div>
    <div id="canvas-container"></div>
    <div class="ui-overlay">Unknown Pleasures</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /**
         * Joy Division - Unknown Pleasures 3D Visualization
         * Step Back: Restored the black occlusion "slices" and the paused pulse logic.
         * Refinements: Kept panning, zoom, halved height, and NaN safety.
         */

        let scene, camera, renderer, linesGroup;
        let targetRotationX = 0.5, targetRotationY = 0;
        let targetPanX = 0, targetPanY = 0;
        let isMouseDown = false;
        let lastMouseX = 0, lastMouseY = 0;

        const ROWS = 80;
        const COLS = 120; 
        const WIDTH = 45;
        const DEPTH = 65;
        const BASELINE_Y = -15; // Bottom of the "slices"

        const lineData = []; 

        window.onload = function() {
            init();
            animate();
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 45, 110);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            linesGroup = new THREE.Group();
            scene.add(linesGroup);

            createPulsarWaves();

            window.addEventListener('resize', onWindowResize, false);
            
            document.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            document.addEventListener('mouseup', () => isMouseDown = false);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('wheel', onMouseWheel);
            document.addEventListener('contextmenu', (e) => e.preventDefault());
            
            document.addEventListener('touchstart', (e) => {
                isMouseDown = true;
                if(e.touches.length > 0) {
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});
            document.addEventListener('touchend', () => isMouseDown = false);
            document.addEventListener('touchmove', (e) => {
                if(isMouseDown && e.touches.length > 0) {
                    const deltaX = e.touches[0].clientX - lastMouseX;
                    const deltaY = e.touches[0].clientY - lastMouseY;
                    
                    if (e.touches.length > 1) {
                        targetPanX += deltaX * 0.05;
                        targetPanY -= deltaY * 0.05;
                    } else {
                        targetRotationY += deltaX * 0.01;
                        targetRotationX += deltaY * 0.01;
                    }
                    
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});
        }

        function createPulsarWaves() {
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
            const planeMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
            
            for (let i = 0; i < ROWS; i++) {
                const points = [];
                const originalHeights = [];
                const z = (i / ROWS) * DEPTH - (DEPTH / 2);
                
                for (let j = 0; j < COLS; j++) {
                    const x = (j / COLS) * WIDTH - (WIDTH / 2);
                    const distFromCenter = Math.abs(x) / (WIDTH / 2);
                    let y = 0;
                    
                    // Static Pulsar Spikes
                    if (distFromCenter < 0.6) {
                        const cosVal = Math.max(0, Math.cos(distFromCenter * Math.PI * 0.8));
                        const envelope = Math.pow(cosVal, 2);
                        const rowSeed = i * 2.1; 
                        const noise = 
                            Math.sin(j * 0.3 + rowSeed) * 0.7 + 
                            Math.sin(j * 0.1 - rowSeed * 0.4) * 1.1 +
                            (Math.sin(j * 0.6 + rowSeed * 1.5) * 0.4);
                        
                        y = Math.abs(noise) * 2.75 * envelope;
                    }
                    points.push(new THREE.Vector3(x, y, z));
                    originalHeights.push(y);
                }

                // Line
                const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(lineGeometry, lineMaterial);
                
                // Occlusion "Slice" Plane
                const skirtGeometry = new THREE.BufferGeometry();
                const skirtVertices = new Float32Array(COLS * 2 * 3); 
                const skirtIndices = [];

                for (let j = 0; j < COLS; j++) {
                    const x = points[j].x;
                    const y = points[j].y;
                    
                    // Top (attached to line)
                    skirtVertices[j * 6] = x;
                    skirtVertices[j * 6 + 1] = y;
                    skirtVertices[j * 6 + 2] = 0; 
                    
                    // Bottom (fixed baseline)
                    skirtVertices[j * 6 + 3] = x;
                    skirtVertices[j * 6 + 4] = BASELINE_Y;
                    skirtVertices[j * 6 + 5] = 0;

                    if (j < COLS - 1) {
                        const base = j * 2;
                        skirtIndices.push(base, base + 1, base + 2);
                        skirtIndices.push(base + 1, base + 3, base + 2);
                    }
                }

                skirtGeometry.setAttribute('position', new THREE.BufferAttribute(skirtVertices, 3));
                skirtGeometry.setIndex(skirtIndices);
                
                const skirtMesh = new THREE.Mesh(skirtGeometry, planeMaterial);
                skirtMesh.position.z = z;
                
                linesGroup.add(skirtMesh);
                linesGroup.add(line);

                lineData.push({ 
                    line, 
                    skirt: skirtMesh, 
                    originalHeights, 
                    rowIdx: i,
                    pointsCount: COLS
                });
            }
        }

        function onMouseMove(event) {
            if (isMouseDown) {
                const deltaX = event.clientX - lastMouseX;
                const deltaY = event.clientY - lastMouseY;

                if (event.buttons === 2 || (event.buttons === 1 && event.shiftKey)) {
                    targetPanX += deltaX * 0.1;
                    targetPanY -= deltaY * 0.1;
                } else if (event.buttons === 1) {
                    targetRotationY += deltaX * 0.01;
                    targetRotationX += deltaY * 0.01;
                }
            }
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;
        }

        function onMouseWheel(event) {
            camera.position.z += event.deltaY * 0.05;
            camera.position.z = Math.max(20, Math.min(250, camera.position.z));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            linesGroup.rotation.y += (targetRotationY - linesGroup.rotation.y) * 0.05;
            linesGroup.rotation.x += (targetRotationX - linesGroup.rotation.x) * 0.05;

            linesGroup.position.x += (targetPanX - linesGroup.position.x) * 0.1;
            linesGroup.position.y += (targetPanY - linesGroup.position.y) * 0.1;

            const time = Date.now() * 0.0006; 

            lineData.forEach((data) => {
                const linePositions = data.line.geometry.attributes.position.array;
                const skirtPositions = data.skirt.geometry.attributes.position.array;
                
                for (let j = 0; j < data.pointsCount; j++) {
                    const x = (j / COLS) * WIDTH - (WIDTH / 2);
                    const distFromCenter = Math.abs(x) / (WIDTH / 2);
                    
                    const waveX = x * 0.2; 
                    const waveZ = data.rowIdx * 0.15;
                    const waveSpeed = time * 4.0; 
                    
                    // Reverted: Clamped whip (Math.max(0, rawPulse)) creates the pause
                    const rawPulse = Math.sin(waveX - waveSpeed + waveZ);
                    const whip = Math.pow(Math.max(0, rawPulse), 2.0); 
                    
                    const cosVal = Math.max(0, Math.cos(distFromCenter * Math.PI * 0.85));
                    const envelope = distFromCenter < 0.65 ? Math.pow(cosVal, 2.0) : 0;
                    
                    let finalY = data.originalHeights[j] + (whip * 2.5 * envelope);
                    
                    if (isNaN(finalY)) finalY = 0;
                    linePositions[j * 3 + 1] = finalY;
                    skirtPositions[j * 6 + 1] = finalY;
                }
                
                data.line.geometry.attributes.position.needsUpdate = true;
                data.skirt.geometry.attributes.position.needsUpdate = true;
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
