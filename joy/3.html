<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy Division - Chromatic Bass Visualizer</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: move;
        }
        .ui-overlay {
            position: absolute;
            bottom: 40px;
            text-align: center;
            pointer-events: none;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-weight: 300;
            font-size: 14px;
            opacity: 0.5;
        }
        .controls-hint {
            position: absolute;
            top: 20px;
            font-size: 10px;
            opacity: 0.4;
            letter-spacing: 0.1em;
            text-align: center;
            line-height: 1.6;
        }
        .audio-controls {
            position: absolute;
            top: 60px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        button, label {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        button:hover, label:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        input[type="file"] {
            display: none;
        }
        #status {
            position: absolute;
            top: 100px;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="controls-hint">
        Drag: Rotate • Right Drag: Pan • Scroll: Zoom<br>
        Chromatic Spectrum • Bass-Driven Spikes
    </div>

    <div class="audio-controls">
        <label for="upload">Upload MP3</label>
        <input type="file" id="upload" accept="audio/*">
        <button id="play-btn">Play / Pause</button>
    </div>

    <div id="status">Upload an MP3 to begin</div>
    <div id="canvas-container"></div>
    <div class="ui-overlay">Unknown Pleasures</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /**
         * Joy Division - Unknown Pleasures 3D Frequency Visualizer
         * Features: 
         * - Chromatic line spectrum
         * - Reverse color flow relative to wave motion
         * - Bass-heavy amplitude response
         * - Pure line wireframe (no occlusion planes)
         */

        let scene, camera, renderer, linesGroup;
        let targetRotationX = 0.5, targetRotationY = 0;
        let targetPanX = 0, targetPanY = 0;
        let isMouseDown = false;
        let lastMouseX = 0, lastMouseY = 0;

        // Audio variables
        let audioContext, analyser, dataArray, source;
        let isPlaying = false;

        const ROWS = 80;   
        const COLS = 120;  
        const WIDTH = 45;
        const DEPTH = 70;

        const lineData = []; 

        window.onload = function() {
            init();
            animate();
        };

        const uploadInput = document.getElementById('upload');
        const playBtn = document.getElementById('play-btn');
        const statusText = document.getElementById('status');

        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512; 
                analyser.smoothingTimeConstant = 0.8;
                analyser.connect(audioContext.destination);
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                audioContext.decodeAudioData(event.target.result, (buffer) => {
                    if (source) source.stop();
                    source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    source.connect(analyser);
                    source.loop = true;
                    source.start(0);
                    isPlaying = true;
                    statusText.textContent = "Playing: " + file.name;
                });
            };
            reader.readAsArrayBuffer(file);
        });

        playBtn.addEventListener('click', () => {
            if (!audioContext) return;
            if (audioContext.state === 'running') {
                audioContext.suspend();
                isPlaying = false;
            } else {
                audioContext.resume();
                isPlaying = true;
            }
        });

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 40, 120);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            linesGroup = new THREE.Group();
            scene.add(linesGroup);

            createPulsarWaves();

            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousedown', (e) => { isMouseDown = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
            document.addEventListener('mouseup', () => isMouseDown = false);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('wheel', onMouseWheel);
            document.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        function createPulsarWaves() {
            for (let i = 0; i < ROWS; i++) {
                const points = [];
                const z = (i / ROWS) * DEPTH - (DEPTH / 2);
                
                for (let j = 0; j < COLS; j++) {
                    const x = (j / COLS) * WIDTH - (WIDTH / 2);
                    points.push(new THREE.Vector3(x, 0, z));
                }

                const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                // Line material with higher initial transparency to handle dense overlaps
                const lineMaterial = new THREE.LineBasicMaterial({ 
                    color: 0xffffff, 
                    linewidth: 1.5, 
                    transparent: true, 
                    opacity: 0.7 
                });
                
                const line = new THREE.Line(lineGeometry, lineMaterial);
                linesGroup.add(line);

                lineData.push({ line, rowIdx: i });
            }
        }

        function onMouseMove(event) {
            if (isMouseDown) {
                const deltaX = event.clientX - lastMouseX;
                const deltaY = event.clientY - lastMouseY;
                if (event.buttons === 2 || (event.buttons === 1 && event.shiftKey)) {
                    targetPanX += deltaX * 0.1;
                    targetPanY -= deltaY * 0.1;
                } else if (event.buttons === 1) {
                    targetRotationY += deltaX * 0.01;
                    targetRotationX += deltaY * 0.01;
                }
            }
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;
        }

        function onMouseWheel(event) {
            camera.position.z += event.deltaY * 0.05;
            camera.position.z = Math.max(20, Math.min(250, camera.position.z));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            linesGroup.rotation.y += (targetRotationY - linesGroup.rotation.y) * 0.05;
            linesGroup.rotation.x += (targetRotationX - linesGroup.rotation.x) * 0.05;
            linesGroup.position.x += (targetPanX - linesGroup.position.x) * 0.1;
            linesGroup.position.y += (targetPanY - linesGroup.position.y) * 0.1;

            let bassIntensity = 0;
            if (isPlaying && analyser) {
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);
                
                // Calculate bass intensity from first 10 bins (low frequencies)
                let bassSum = 0;
                for (let i = 0; i < 10; i++) { bassSum += dataArray[i]; }
                bassIntensity = (bassSum / 10) / 255.0;
            }

            const time = Date.now() * 0.001;

            lineData.forEach((data, i) => {
                const linePositions = data.line.geometry.attributes.position.array;
                
                // Color Spectrum Logic:
                // Shifts from 0 to 1 based on row and time. 
                // Adding time here moves the color spectrum in the opposite direction of the waves.
                const colorHue = (i / ROWS + time * 0.1) % 1.0;
                data.line.material.color.setHSL(colorHue, 0.8, 0.5);

                // Use the flowing spectrum index
                const flowOffset = Math.floor(time * 15) % 100;
                const bandIndex = Math.floor((data.rowIdx / ROWS) * 40) + flowOffset; 
                const safeIndex = bandIndex % (analyser ? analyser.frequencyBinCount : 128); 
                
                // Final intensity is a mix of specific band and overall bass pulse
                let rowIntensity = isPlaying ? (dataArray[safeIndex] / 255.0) : 0;
                let activeIntensity = (rowIntensity * 0.4) + (bassIntensity * 0.6);

                for (let j = 0; j < COLS; j++) {
                    const x = (j / COLS) * WIDTH - (WIDTH / 2);
                    const distFromCenter = Math.abs(x) / (WIDTH / 2);
                    
                    const cosVal = Math.max(0, Math.cos(distFromCenter * Math.PI * 0.85));
                    const envelope = distFromCenter < 0.6 ? Math.pow(cosVal, 2.0) : 0;

                    // Micro-jitter to give it that "signal" feel
                    const jitter = Math.sin(j * 0.5 + time * 12.0 + data.rowIdx) * (activeIntensity * 0.3);
                    
                    // Passing wave phase
                    const xPhase = j * 0.3 - (time * 6.0) + (data.rowIdx * 0.2);
                    const noise = Math.sin(xPhase) * 0.5 + Math.sin(xPhase * 0.5) * 0.5;

                    // Calculate Y using activeIntensity (which is bass-heavy)
                    let finalY = (activeIntensity * 16.0 * envelope) + (Math.abs(noise + jitter) * activeIntensity * 8.0 * envelope);
                    
                    if (isNaN(finalY)) finalY = 0;
                    linePositions[j * 3 + 1] = finalY;
                }
                
                data.line.geometry.attributes.position.needsUpdate = true;
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
