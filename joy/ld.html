<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy Division - Unknown Pleasures Heartbeat Refined</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: move;
        }
        .ui-overlay {
            position: absolute;
            bottom: 40px;
            text-align: center;
            pointer-events: none;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-weight: 300;
            font-size: 14px;
            opacity: 0.5;
        }
        .controls-hint {
            position: absolute;
            top: 20px;
            font-size: 10px;
            opacity: 0.4;
            letter-spacing: 0.1em;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="controls-hint">
        Left Drag: Rotate • Right Drag: Pan • Scroll: Zoom<br>
        Rhythmic Lub-Dub Pulse
    </div>
    <div id="canvas-container"></div>
    <div class="ui-overlay">Unknown Pleasures</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /**
         * Joy Division - Unknown Pleasures 3D Visualization
         * Style: Pure Lines (Transparent Wireframe)
         * Rhythm: Distinct Lub-Dub (S1/S2) heartbeat with faster tempo
         */

        let scene, camera, renderer, linesGroup;
        let targetRotationX = 0.5, targetRotationY = 0;
        let targetPanX = 0, targetPanY = 0;
        let isMouseDown = false;
        let lastMouseX = 0, lastMouseY = 0;

        const ROWS = 80;
        const COLS = 120; 
        const WIDTH = 45;
        const DEPTH = 65;

        const lineData = []; 

        window.onload = function() {
            init();
            animate();
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 45, 110);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            linesGroup = new THREE.Group();
            scene.add(linesGroup);

            createPulsarWaves();

            window.addEventListener('resize', onWindowResize, false);
            
            document.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            document.addEventListener('mouseup', () => isMouseDown = false);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('wheel', onMouseWheel);
            document.addEventListener('contextmenu', (e) => e.preventDefault());
            
            // Touch support
            document.addEventListener('touchstart', (e) => {
                isMouseDown = true;
                if(e.touches.length > 0) {
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});
            document.addEventListener('touchend', () => isMouseDown = false);
            document.addEventListener('touchmove', (e) => {
                if(isMouseDown && e.touches.length > 0) {
                    const deltaX = e.touches[0].clientX - lastMouseX;
                    const deltaY = e.touches[0].clientY - lastMouseY;
                    
                    if (e.touches.length > 1) {
                        targetPanX += deltaX * 0.05;
                        targetPanY -= deltaY * 0.05;
                    } else {
                        targetRotationY += deltaX * 0.01;
                        targetRotationX += deltaY * 0.01;
                    }
                    
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});
        }

        function createPulsarWaves() {
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0xffffff, 
                linewidth: 1.5, 
                transparent: true, 
                opacity: 0.6 
            });
            
            for (let i = 0; i < ROWS; i++) {
                const points = [];
                const z = (i / ROWS) * DEPTH - (DEPTH / 2);
                
                for (let j = 0; j < COLS; j++) {
                    const x = (j / COLS) * WIDTH - (WIDTH / 2);
                    points.push(new THREE.Vector3(x, 0, z));
                }

                const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(lineGeometry, lineMaterial);
                linesGroup.add(line);

                lineData.push({ 
                    line, 
                    rowIdx: i,
                    pointsCount: COLS
                });
            }
        }

        function onMouseMove(event) {
            if (isMouseDown) {
                const deltaX = event.clientX - lastMouseX;
                const deltaY = event.clientY - lastMouseY;

                if (event.buttons === 2 || (event.buttons === 1 && event.shiftKey)) {
                    targetPanX += deltaX * 0.1;
                    targetPanY -= deltaY * 0.1;
                } else if (event.buttons === 1) {
                    targetRotationY += deltaX * 0.01;
                    targetRotationX += deltaY * 0.01;
                }
            }
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;
        }

        function onMouseWheel(event) {
            camera.position.z += event.deltaY * 0.05;
            camera.position.z = Math.max(20, Math.min(250, camera.position.z));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            linesGroup.rotation.y += (targetRotationY - linesGroup.rotation.y) * 0.05;
            linesGroup.rotation.x += (targetRotationX - linesGroup.rotation.x) * 0.05;
            linesGroup.position.x += (targetPanX - linesGroup.position.x) * 0.1;
            linesGroup.position.y += (targetPanY - linesGroup.position.y) * 0.1;

            const time = Date.now() * 0.001; 

            lineData.forEach((data) => {
                const linePositions = data.line.geometry.attributes.position.array;
                
                // --- REFINED LUB-DUB RHYTHM ---
                // Higher speed multiplier for a faster heart rate
                const rowOffset = data.rowIdx * 0.04;
                const heartbeatTime = (time * 2.5) - rowOffset;
                
                // Lub (S1): Sharp and dominant
                const lub = Math.pow(Math.max(0, Math.sin(heartbeatTime)), 24) * 1.6;
                // Dub (S2): Slightly smaller, following quickly
                const dub = Math.pow(Math.max(0, Math.sin(heartbeatTime - 0.35)), 24) * 1.0;
                
                const pulseIntensity = lub + dub;

                for (let j = 0; j < data.pointsCount; j++) {
                    const x = (j / COLS) * WIDTH - (WIDTH / 2);
                    const distFromCenter = Math.abs(x) / (WIDTH / 2);
                    
                    const cosVal = Math.max(0, Math.cos(distFromCenter * Math.PI * 0.85));
                    const envelope = distFromCenter < 0.65 ? Math.pow(cosVal, 2.0) : 0;

                    let finalY = 0;

                    if (envelope > 0) {
                        const waveSpeed = time * 3.5;
                        const xPhase = j * 0.25 + (data.rowIdx * 0.15) - waveSpeed;
                        
                        const noise = 
                            Math.sin(xPhase) * 0.8 + 
                            Math.sin(xPhase * 0.45) * 1.2 +
                            (Math.sin(xPhase * 1.8) * 0.3);
                        
                        // Half height multiplier kept as established (~1.5 pulse range)
                        const baseHeight = 1.6;
                        finalY = Math.abs(noise) * (baseHeight + (pulseIntensity * 1.4)) * envelope;
                    }
                    
                    if (isNaN(finalY)) finalY = 0;
                    linePositions[j * 3 + 1] = finalY;
                }
                
                data.line.geometry.attributes.position.needsUpdate = true;
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
