<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleeples</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      height: 100%;
      overflow: hidden;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 2rem;
      box-sizing: border-box;
    }

    .typewriter {
      white-space: pre-wrap;
      font-size: 1.2rem;
      max-width: 800px;
      line-height: 1.6;
    }

    .cursor {
      display: inline-block;
      width: 1ch;
      background-color: white;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { background-color: transparent; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="typewriter" id="typewriter"></div>
  </div>

  <script>
    const text = `i cannot sleep
so i make this instead

one line
then another

white text on black
like dreams inverted

scroll or don't
this is not a trap
just a mirror.`

    let i = 0;
    const speed = 50;
    const output = document.getElementById('typewriter');
    const cursor = document.createElement('span');
    cursor.classList.add('cursor');
    cursor.innerHTML = '&nbsp;';
    output.appendChild(cursor);

    function type() {
      if (i < text.length) {
        cursor.insertAdjacentText('beforebegin', text.charAt(i));
        i++;
        setTimeout(type, text.charAt(i - 1) === '\n' ? 300 : speed);
      }
    }

    type();
  </script>
</body>
</html>
