    <style>

<body class="relative flex items-center justify-center font-sans select-none">
    <!-- Interactive Radiant Light Dimension Canvas -->
    <canvas id="light-canvas"></canvas>

    <!-- Scanline overlay for atmospheric CRT feel -->
    <div class="fixed inset-0 crt-scanlines z-10 pointer-events-none"></div>

        <p class="font-share text-stone-300 text-sm sm:text-base md:text-lg leading-relaxed mb-8 max-w-xl text-shadow">

        </p>

            <a href="/"
                class="px-6 py-3 bg-tonicYellow text-black font-bold hover:bg-white hover:shadow-[0_0_30px_rgba(255,204,0,0.8)] transition-all duration-300 flex items-center gap-2 group">

            <a href="/vor/index.html"
                class="px-6 py-3 bg-black/70 border border-white/30 text-white hover:border-tonicYellow hover:text-tonicYellow transition-all duration-300">
                Visions of Reality →
            </a>
        </div>
    </div>

    <!-- Interactive Canvas Animation Script -->
    <script>
        const canvas = document.getElementById('light-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouseX = 0, mouseY = 0;
        let targetMouseX = 0, targetMouseY = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            mouseX = targetMouseX = width / 2;
            mouseY = targetMouseY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        // Rays & Particles
        const rays = Array.from({ length: 32 }, (_, i) => ({
            angle: (i / 32) * Math.PI * 2,
            speed: (Math.random() - 0.5) * 0.003,
            width: Math.random() * 0.15 + 0.05,
            length: Math.random() * 0.5 + 0.8
        }));

        const particles = Array.from({ length: 90 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.8,
            vy: -Math.random() * 1.2 - 0.3,
            size: Math.random() * 2.5 + 0.8,
            alpha: Math.random() * 0.7 + 0.3,
            color: Math.random() > 0.3 ? '#ffea66' : '#ffffff'
        }));

        let time = 0;

        function render() {
            time += 0.015;
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;

            ctx.fillStyle = '#060502';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2 + (mouseX - width / 2) * 0.15;
            const cy = height / 2 + (mouseY - height / 2) * 0.15;
            const maxRadius = Math.hypot(width, height) * 0.8;

            // Radiant background glow
            const bgGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, maxRadius);
            bgGrad.addColorStop(0, 'rgba(255, 245, 160, 0.45)');
            bgGrad.addColorStop(0.2, 'rgba(255, 204, 0, 0.22)');
            bgGrad.addColorStop(0.5, 'rgba(230, 140, 0, 0.08)');
            bgGrad.addColorStop(1, 'rgba(0, 0, 0, 0.95)');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Volumetric light rays
            ctx.save();
            ctx.translate(cx, cy);
            rays.forEach(r => {
                r.angle += r.speed;
                const rGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, maxRadius * r.length);
                rGrad.addColorStop(0, 'rgba(255, 255, 230, 0.28)');
                rGrad.addColorStop(0.35, 'rgba(255, 215, 0, 0.15)');
                rGrad.addColorStop(1, 'rgba(255, 170, 0, 0)');

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, maxRadius * r.length, r.angle - r.width / 2, r.angle + r.width / 2);
                ctx.closePath();
                ctx.fillStyle = rGrad;
                ctx.fill();
            });
            ctx.restore();

            // Luminous golden core flare
            const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 140 + Math.sin(time * 2) * 20);
            coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            coreGrad.addColorStop(0.25, 'rgba(255, 245, 160, 0.85)');
            coreGrad.addColorStop(0.6, 'rgba(255, 190, 0, 0.35)');
            coreGrad.addColorStop(1, 'rgba(255, 150, 0, 0)');
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, 240, 0, Math.PI * 2);
            ctx.fill();

            // Floating luminous motes
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
                if (p.x < -10) p.x = width + 10;
                if (p.x > width + 10) p.x = -10;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha * (0.6 + 0.4 * Math.sin(time + p.x));
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            requestAnimationFrame(render);
        }
        render();
    </script>
