<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planets Animation</title>
    <style>
        body {
            margin: 0;
            background-color: #001830;
        }
        canvas {
            display: block;
            min-height: 70vh;
			background: url('assets/images/ruimte.jpg') center center / cover no-repeat;
        }


	@media (max-width: 768px) {
        padding: 1.5rem;
        width: 90%;
    }

    </style>
</head>
<body>

    
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let sunX, sunY;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            sunX = canvas.width / 2;
            sunY = canvas.height / 2;
        }

        resizeCanvas();

        const backgroundImage = new Image();
        backgroundImage.src = 'assets/images/ruimte.jpg';

        class Planet {
            constructor(imageSrc, distance, speed, rotationSpeed, opacity) {
                this.image = new Image();
                this.image.src = imageSrc;
                this.distance = distance;
                this.speed = speed;
                this.rotationSpeed = rotationSpeed;
                this.opacity = opacity;
                this.angle = Math.random() * Math.PI * 2; // Start at a random angle
                this.rotationAngle = 0;
            }

            update() {
                this.angle += this.speed;
                this.rotationAngle += this.rotationSpeed;
                this.x = sunX + this.distance * Math.cos(this.angle);
                this.y = sunY + this.distance * Math.sin(this.angle);
            }

            draw() {
                if (this.image.complete) {
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    ctx.translate(this.x + this.image.width / 2, this.y + this.image.height / 2);
                    ctx.rotate(this.rotationAngle);
                    ctx.drawImage(this.image, -this.image.width / 2, -this.image.height / 2);
                    ctx.restore();
                }
            }
        }

        const planets = [
            new Planet('assets/images/planet1.png', 110, 0.05, 0.09, 1),
            new Planet('assets/images/planet2.png', 160, 0.02, 0.02, 1),
            new Planet('assets/images/planet3.png', 220, 0.015, 0.03, 1),
            new Planet('assets/images/planet4.png', 275, 0.03, 0.03, 0.8),
            new Planet('assets/images/planet5.png', 360, 0.025, 0.025, 0.9),
            new Planet('assets/images/planet6.png', 400, 0.02, 0.02, 0.9),
            new Planet('assets/images/planet7.png', 500, 0.035, 0.035, 0.8),
            new Planet('assets/images/planet8.png', 600, 0.04, 0.04, 0.7),
            // Add more planets as needed
        ];

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);

            // Draw the sun
            ctx.fillStyle = 'yellow';
            ctx.beginPath();
            ctx.arc(sunX, sunY, 60, 0, Math.PI * 2);
            ctx.fill();

            // Draw planets
            planets.forEach(planet => {
                planet.update();
                planet.draw();
            });

            requestAnimationFrame(animate);
        }

        // Start animation when all images are loaded
        let loadedImages = 0;
        planets.forEach(planet => {
            planet.image.onload = () => {
                loadedImages++;
                if (loadedImages === planets.length && backgroundImage.complete) {
                    animate();
                }
            };
            planet.image.onerror = (err) => {
                console.error(`Error loading ${planet.image.src}:`, err);
            };
        });

        backgroundImage.onload = () => {
            if (loadedImages === planets.length) {
                animate();
            }
        };
        backgroundImage.onerror = (err) => {
            console.error(`Error loading background image:`, err);
        };

        // Handle window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            // Recalculate positions of planets
            planets.forEach(planet => {
                planet.update();
            });
        });
    </script>
</body>
</html>
