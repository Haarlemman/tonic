<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The House of Awe</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#dfe7ef;
}

#title{
    position:absolute;
    top:25px;
    width:100%;
    text-align:center;
    font-family:Georgia,serif;
    font-size:42px;
    letter-spacing:4px;
    color:white;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
    z-index:100;
}
</style>

<script type="importmap">
{
"imports":{
"three":"https://unpkg.com/three@0.179/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.179/examples/jsm/"
}
}
</script>

</head>

<body>

<div id="title">
The House of Awe
</div>

<script type="module">

import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd8e5ef);

const camera=new THREE.PerspectiveCamera(
55,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(20,12,24);

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

scene.add(new THREE.HemisphereLight(0xffffff,0x888888,1.4));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,50,20);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.CircleGeometry(80,80),
new THREE.MeshStandardMaterial({
color:0xbfd3b8
})
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

const white=new THREE.MeshPhysicalMaterial({
color:"#fafafa",
roughness:.55
});

const glass=new THREE.MeshPhysicalMaterial({
color:"#b9eaff",
transmission:.95,
transparent:true,
roughness:0,
thickness:1
});

const steel=new THREE.MeshStandardMaterial({
color:"#666",
metalness:1,
roughness:.2
});

const house=new THREE.Group();

scene.add(house);

//
// Bauhaus base
//

const base=new THREE.Mesh(
new THREE.BoxGeometry(14,6,10),
white
);

base.position.y=3;
base.castShadow=true;
house.add(base);

//
// Floating upper floor
//

const upper=new THREE.Mesh(
new THREE.BoxGeometry(10,4,8),
white
);

upper.position.set(2,8,0);
upper.castShadow=true;
house.add(upper);

//
// Foster glass façade
//

const facade=new THREE.Mesh(
new THREE.BoxGeometry(.25,5,7),
glass
);

facade.position.set(7.15,6.5,0);
house.add(facade);

//
// Libeskind wedge
//

const wedge=new THREE.Mesh(

new THREE.ConeGeometry(4,9,4),

white

);

wedge.rotation.z=Math.PI/2;
wedge.rotation.y=Math.PI/4;

wedge.position.set(-8,6,-2);

house.add(wedge);

//
// Zaha roof
//

const roofShape=new THREE.Shape();

roofShape.moveTo(-6,0);
roofShape.bezierCurveTo(-3,3,3,3,6,0);
roofShape.lineTo(6,2);
roofShape.bezierCurveTo(3,5,-3,5,-6,2);

const roofGeo=new THREE.ExtrudeGeometry(
roofShape,
{
depth:8,
bevelEnabled:false
}
);

const roof=new THREE.Mesh(
roofGeo,
white
);

roof.rotation.x=Math.PI/2;
roof.position.set(0,10,-4);

house.add(roof);

//
// Jugendstil balcony
//

const balcony=new THREE.Mesh(
new THREE.CylinderGeometry(2.2,2.2,.25,40),
steel
);

balcony.rotation.x=Math.PI/2;
balcony.position.set(5,7,5);

house.add(balcony);

//
// Curved canopy
//

const canopy=new THREE.Mesh(
new THREE.TorusGeometry(2.8,.12,20,60,Math.PI),
steel
);

canopy.rotation.y=Math.PI;
canopy.position.set(5,8,5);

house.add(canopy);

//
// Columns
//

for(let x=-4;x<=4;x+=8){

const c=new THREE.Mesh(

new THREE.CylinderGeometry(.18,.18,6),

steel

);

c.position.set(x,3,5);

house.add(c);

}

//
// Reflecting pool
//

const pool=new THREE.Mesh(

new THREE.CircleGeometry(7,60),

new THREE.MeshPhysicalMaterial({

color:"#79c9ff",

transmission:1,

roughness:0

})

);

pool.rotation.x=-Math.PI/2;


pool.position.set(8,.02,8);

scene.add(pool);

//
// Trees
//

function tree(x,z){

const trunk=new THREE.Mesh(

new THREE.CylinderGeometry(.3,.4,2),

new THREE.MeshStandardMaterial({color:"#6d4323"})

);

trunk.position.set(x,1,z);

scene.add(trunk);

const top=new THREE.Mesh(

new THREE.SphereGeometry(1.5),

new THREE.MeshStandardMaterial({

color:"#7abf65"

})

);

top.position.set(x,3,z);

scene.add(top);

}

tree(-12,-6);
tree(15,-10);
tree(-15,8);

function animate(){

requestAnimationFrame(animate);

controls.update();

house.rotation.y+=0.0015;

renderer.render(scene,camera);

}

animate();

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>
