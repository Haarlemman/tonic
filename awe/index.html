<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Text Simulation - AWE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            pointer-events: none;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <div id="ui-overlay">
        <h1>3D Text Rendering</h1>
        <p>AWE centered.</p>
    </div>

    <div class="controls-hint">Click and drag to rotate • Scroll to zoom</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, textGroup;
        const colors = {
            teal: 0x32a1b1,
            red: 0xff0000,
            yellow: 0xffb700,
            orange: 0xff8c00,
            blue: 0x0000ff,
            green: 0x00ff00,
            white: 0xffffff,
            pink: 0xff00ff
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 16);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            textGroup = new THREE.Group();
            scene.add(textGroup);

            const loader = new THREE.FontLoader();
            loader.load('https://threejs.org/examples/fonts/droid/droid_sans_bold.typeface.json', function (font) {

                // Just "AWE" centered - wider spacing to prevent overlap
                create3DSection("A", font, colors.red, -5.0, 0);
                create3DSection("W", font, colors.yellow, 0, 0.1);
                create3DSection("E", font, colors.blue, 6.0, 0.2);

                // Initial orientation
                textGroup.rotation.y = -0.4;
                textGroup.rotation.x = 0.2;
            });

            window.addEventListener('resize', onWindowResize, false);

            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            const startPan = (x, y) => {
                isDragging = true;
                previousMousePosition = { x, y };
            };

            const movePan = (x, y) => {
                if (isDragging) {
                    const deltaX = x - previousMousePosition.x;
                    const deltaY = y - previousMousePosition.y;
                    textGroup.rotation.y += deltaX * 0.007;
                    textGroup.rotation.x += deltaY * 0.007;
                    previousMousePosition = { x, y };
                }
            };

            document.addEventListener('mousedown', e => startPan(e.clientX, e.clientY));
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('mousemove', e => movePan(e.clientX, e.clientY));

            document.addEventListener('touchstart', e => startPan(e.touches[0].clientX, e.touches[0].clientY), { passive: false });
            document.addEventListener('touchend', () => isDragging = false);
            document.addEventListener('touchmove', e => movePan(e.touches[0].clientX, e.touches[0].clientY), { passive: false });

            animate();
        }

        function create3DSection(text, font, color, xPos, zBase) {
            const size = 1.9;
            const height = 0.05;
            const layers = 10;

            for (let i = 0; i < layers; i++) {
                const geometry = new THREE.TextGeometry(text, {
                    font: font,
                    size: size,
                    height: height,
                    curveSegments: 24,
                    bevelEnabled: false
                });

                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    shininess: 30
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(xPos, 0, zBase - (i * 0.15));
                textGroup.add(mesh);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>

</html>
