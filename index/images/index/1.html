<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>David Enker - Paradox Prime</title>
    <style>
        /* --- 1. CORE VARIABLES & RESET --- */
        :root {
            --paper: #E8E6D9;
            --red: #D9381E;
            --yellow: #F2A900;
            --teal: #0097A7;
            --black: #0F0F0F;    
            --white: #F5F5F0;
            --neon-blue: #0ff;
            --neon-pink: #f0f;
            --neon-green: #0f0;
        }

        * { box-sizing: border-box; cursor: default; }
        a, button, .reel-group, .close-btn { cursor: pointer; }

        body {
            margin: 0; padding: 0;
            background-color: var(--paper);
            color: var(--black);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh; width: 100vw;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- 2. BACKGROUNDS --- */
        .texture {
            position: absolute; inset: 0;
            opacity: 0.25; pointer-events: none; z-index: 2;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
        }

        /* --- 3. UI ELEMENTS --- */
        .sys-status {
            position: absolute; top: 2rem; right: 2rem; 
            text-align: right; font-size: 0.7rem; opacity: 0.6;
            z-index: 10; pointer-events: none; font-weight: bold;
        }
        
        #decode-panel {
            position: absolute; top: 2rem; left: 2rem;
            width: 220px; z-index: 20;
            font-family: 'Courier New', monospace;
            border: 2px solid var(--black);
            background: rgba(232, 230, 217, 0.9);
            box-shadow: 10px 10px 0 rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .decode-header { background: var(--black); color: var(--white); font-size: 0.7rem; padding: 4px 8px; font-weight: bold; display: flex; justify-content: space-between; }
        .decode-frame { width: 100%; height: 140px; position: relative; overflow: hidden; border-bottom: 2px solid var(--black); background: #000; }
        .decode-img-display { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) contrast(1.2); opacity: 0.8; transition: opacity 0.3s; }
        .scan-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.5) 50%); background-size: 100% 4px; pointer-events: none; }
        .decode-text-area { padding: 10px; font-size: 0.65rem; height: 100px; overflow: hidden; line-height: 1.4; color: var(--black); font-weight: bold; text-transform: uppercase; }
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- 4. THE CENTRAL DISC STAGE (NEW) --- */
        #disc-stage {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 45vmin; height: 45vmin; /* Fits inside the inner triangle */
            z-index: 4; /* Behind SVG text, in front of BG */
            pointer-events: none;
            display: flex; justify-content: center; align-items: center;
        }

        .disc-img {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 50%; /* Forces everything into a circle */
            opacity: 0;
            transition: opacity 1s ease-in-out;
            will-change: transform;
        }

        /* Animation Classes */
        .spin-slow {
            animation: rotate-calm 20s linear infinite;
        }

        .spin-frantic {
            /* Chaos mode: Fast spin + slight scale wobble */
            animation: rotate-chaos 0.8s linear infinite;
            filter: contrast(1.5) saturate(1.5);
        }

        @keyframes rotate-calm {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotate-chaos {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(0.9); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* --- 5. THE SVG SYSTEM --- */
        #core-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85vmin; height: 85vmin; 
            z-index: 5;
        }
        svg.reel-system { width: 100%; height: 100%; overflow: visible; }
        .reel-group { transform-origin: 50% 50%; cursor: pointer; transition: all 0.2s ease-out; }
        
        .reel-group:hover path, .reel-group:hover polygon { fill: rgba(0,0,0,0.9) !important; stroke-width: 3px; vector-effect: non-scaling-stroke; }
        .group-outer:hover path { stroke: var(--neon-pink); filter: drop-shadow(0 0 20px var(--neon-pink)); }
        .group-outer:hover text { fill: var(--neon-pink) !important; text-shadow: 0 0 15px var(--neon-pink); }
        .group-mid:hover polygon { stroke: var(--neon-blue); filter: drop-shadow(0 0 20px var(--neon-blue)); }
        .group-mid:hover text { fill: var(--neon-blue) !important; text-shadow: 0 0 15px var(--neon-blue); }
        .group-inner:hover polygon { stroke: var(--neon-green); filter: drop-shadow(0 0 20px var(--neon-green)); }
        .group-inner:hover text { fill: var(--neon-green) !important; text-shadow: 0 0 15px var(--neon-green); }
        
        text { font-family: 'Impact', sans-serif; text-transform: uppercase; fill: currentColor; font-weight: normal; pointer-events: none; }

        .anim-name { animation: rotate-slow 120s linear infinite; }
        .anim-outer { animation: berserk-outer 14s linear infinite; }
        .anim-mid { animation: berserk-mid 14s linear infinite; }
        .anim-inner { animation: berserk-inner 14s linear infinite; }
        .reel-group:hover { animation-play-state: paused !important; }

        @keyframes rotate-slow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes berserk-outer { 0%, 15% { transform: rotate(0deg); } 20% { transform: rotate(180deg); } 30% { transform: rotate(720deg); } 50%, 65% { transform: rotate(360deg); } 70% { transform: rotate(500deg); } 100% { transform: rotate(360deg); } }
        @keyframes berserk-mid { 0%, 15% { transform: rotate(0deg); } 25% { transform: rotate(-360deg); } 35% { transform: rotate(-500deg); } 50%, 65% { transform: rotate(0deg); } 75% { transform: rotate(120deg); } 100% { transform: rotate(-360deg); } }
        @keyframes berserk-inner { 0%, 15% { transform: rotate(0deg); } 20% { transform: rotate(400deg); } 30% { transform: rotate(600deg); } 50%, 65% { transform: rotate(0deg); } 75% { transform: rotate(-180deg); } 100% { transform: rotate(360deg); } }

        /* --- 6. POPUP CARD --- */
        #card {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -40%) scale(0.9);
            opacity: 0; pointer-events: none;
            width: 320px; max-width: 90vw;
            background: rgba(240, 234, 214, 0.98);
            border: 4px solid var(--black);
            padding: 0; z-index: 100;
            box-shadow: 20px 20px 0 rgba(0,0,0,0.25);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #card.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .card-head { background: var(--black); color: var(--white); padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .card-body { padding: 25px; }
        .card-btn { display: block; margin-top: 20px; padding: 15px; background: transparent; border: 3px solid var(--black); color: var(--black); text-align: center; text-decoration: none; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; transition: 0.1s; }
        .card-btn:hover { background: var(--black); color: var(--white); transform: translate(-2px, -2px); box-shadow: 4px 4px 0 rgba(0,0,0,0.2); }

        /* --- 7. RESPONSIVE --- */
        @media (max-width: 768px) {
            #decode-panel { top: auto; bottom: 2rem; left: 1rem; transform: scale(0.85); transform-origin: bottom left; width: 200px; }
            .decode-frame { height: 100px; }
            .decode-text-area { height: 80px; }
            .sys-status { top: 1rem; right: 1rem; font-size: 0.6rem; }
            #core-container { width: 95vmin; height: 95vmin; }
            .text-name { font-size: 44px !important; letter-spacing: 4px !important; }
            .text-outer { font-size: 32px !important; }
            .text-mid { font-size: 18px !important; }
            .text-inner { font-size: 16px !important; }
            /* Adjust disc size for mobile */
            #disc-stage { width: 55vmin; height: 55vmin; }
        }
    </style>
</head>
<body>

    <div class="texture"></div>

    <div id="disc-stage">
        </div>

    <div id="decode-panel">
        <div class="decode-header">
            <span>SECURE.NET</span>
            <span>V.4.2</span>
        </div>
        <div class="decode-frame">
            <div class="scan-overlay"></div>
            <img id="panel-img" class="decode-img-display" src="">
        </div>
        <div class="decode-text-area" id="decode-text">
            > SYSTEM INITIALIZED...<br>
            > LOADING ASSETS...<span class="cursor-blink">_</span>
        </div>
    </div>

    <div class="sys-status">
        <p>SYS: ONLINE</p>
        <p>LOC: HAARLEM / NL</p>
        <p>USER: GUEST</p>
    </div>

    <div id="core-container">
        <svg class="reel-system" viewBox="0 0 600 600">
            <defs>
                <path id="path-name" d="M 300, 300 m -300, 0 a 300,300 0 1,1 600,0 a 300,300 0 1,1 -600,0" />
                <path id="path-outer" d="M 300, 300 m -204, 0 a 204,204 0 1,1 408,0 a 204,204 0 1,1 -408,0" />
                <path id="path-mid" d="M 300, 300 m -170, 0 a 170,170 0 1,1 340,0 a 170,170 0 1,1 -340,0" />
                <path id="path-inner" d="M 300, 300 m -110, 0 a 110,110 0 1,1 220,0 a 110,110 0 1,1 -220,0" />
            </defs>

            <g class="reel-group anim-name" style="pointer-events: none; color: var(--black); opacity: 1;">
                <text class="text-name" font-size="54" letter-spacing="8" fill="currentColor">
                    <textPath href="#path-name" startOffset="0%">
                        DAVID ENKER • PARADOX PRIME • HAARLEM • WRITER • DESIGNER •
                    </textPath>
                </text>
            </g>

            <g class="reel-group anim-outer group-outer" onclick="activate('paradox')" style="color: var(--red)">
                <path d="M300 300 L300 96 A204 204 0 0 1 476.6 198 Z" fill="currentColor" /> 
                <path d="M300 300 L476.6 402 A204 204 0 0 1 300 504 Z" fill="currentColor" /> 
                <path d="M300 300 L123.4 402 A204 204 0 0 1 123.4 198 Z" fill="currentColor" /> 
                <text class="text-outer" font-size="42" dy="-20" letter-spacing="5" fill="var(--paper)" style="font-weight: 900;">
                    <textPath href="#path-outer" startOffset="6%">
                        /// POLITICS /// FREE WILL
                    </textPath>
                </text>
            </g>

            <g class="reel-group anim-mid group-mid" onclick="activate('books')" style="color: var(--yellow)">
                <polygon points="300,90 481,405 119,405" fill="currentColor" opacity="1" style="mix-blend-mode: multiply;" />
                <text class="text-mid" font-size="22" dy="-10" letter-spacing="2" fill="black" style="font-weight: bold;">
                    <textPath href="#path-mid" startOffset="50%" text-anchor="middle">
                        TONIC FOR THE BONES • MANUSCRIPT
                    </textPath>
                </text>
            </g>

            <g class="reel-group anim-inner group-inner" onclick="activate('art')" style="color: var(--teal)">
                <polygon points="119,195 481,195 300,510" fill="currentColor" opacity="1" style="mix-blend-mode: multiply;" />
                <text class="text-inner" font-size="20" dy="-12" letter-spacing="2" fill="white" style="font-weight: bold;">
                    <textPath href="#path-inner" startOffset="50%" text-anchor="middle">
                        GRAPHIC DATA • JEWISH ICONOGRAPHY
                    </textPath>
                </text>
            </g>

            <circle cx="300" cy="300" r="10" fill="#111" stroke="#333" stroke-width="2" />
        </svg>
    </div>

    <div id="card">
        <div class="card-head"><span id="c-id">SYS.DAT</span><span onclick="closeCard()" class="close-btn">[✕]</span></div>
        <div class="card-body">
            <h2 id="c-title" style="margin:0 0 15px 0; font-family:'Impact'; font-size:2rem; text-transform:uppercase; line-height:0.9">TITLE</h2>
            <p id="c-desc" style="font-size:1rem; line-height:1.4; font-weight: 500;">Description.</p>
            <a id="c-link" href="#" class="card-btn">ENTER SECTION</a>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const contentData = {
            'paradox': {
                title: 'The Paradox',
                desc: 'Reflections on the complexity of life. "The more you learn, the more you realise you know nothing."',
                color: '#D9381E', 
                link: '/philosophy',
                stream: 'ANALYZING... FREE WILL ALGORITHMS... POLITICAL SPECTRUM DEVIATION...'
            },
            'books': {
                title: 'Tonic For The Bones',
                desc: 'My second book. A personal narrative on my 2021 diagnosis, family, and the stories we tell to survive.',
                color: '#F2A900', 
                link: '/books',
                stream: 'DECODING MANUSCRIPT... DIAGNOSIS: 2021... ARCHIVE: AILISH & YARON...'
            },
            'art': {
                title: 'Visual Data',
                desc: 'Experiments in structure, typography, and Jewish iconography.',
                color: '#0097A7', 
                link: '/art',
                stream: 'RENDERING VECTORS... ISRAEL/JEWISH ARCHIVE... TYPOGRAPHIC OVERLAY...'
            }
        };

        // --- 2. THE ROTATING DISC ENGINE ---
        const discImages = [
            'images/mandala.png', 'images/gotlib.png', 'images/green.png', 'images/bats.png', 
            'images/cccp.png', 'images/earthclouds.png', 'images/dao.png', 'images/escherbol.png', 'images/hmv.png'
            'images/cccp.png', 'images/earthclouds.png', 'images/dao.png', 'images/escherbol.png', 'images/hmv.png'
        ];
        
        // Blend modes to cycle through randomly for variety
        const blendModes = ['multiply', 'normal', 'difference', 'hard-light', 'darken'];
        
        let currentDiscIndex = 0;
        const stage = document.getElementById('disc-stage');
        const decodePanelImg = document.getElementById('panel-img'); // For the small monitor top left

        function spawnDisc() {
            // 1. Create Image
            const img = document.createElement('img');
            img.src = discImages[currentDiscIndex];
            img.classList.add('disc-img');
            
            // 2. Random Blend Mode for "Paradox" effect
            const randomBlend = blendModes[Math.floor(Math.random() * blendModes.length)];
            img.style.mixBlendMode = randomBlend;
            
            // 3. Add to stage
            stage.appendChild(img);
            
            // 4. Update the "Decode Panel" top left to match current disc
            decodePanelImg.src = discImages[currentDiscIndex];

            // 5. ANIMATION SEQUENCE
            
            // PHASE A: ENTER (Fade In + Slow Spin)
            setTimeout(() => {
                img.style.opacity = '0.8'; // Slight transparency
                img.classList.add('spin-slow');
            }, 100);

            // PHASE B: CHAOS (Switch to Frantic Spin)
            setTimeout(() => {
                img.classList.remove('spin-slow');
                img.classList.add('spin-frantic');
            }, 6000); // After 6 seconds, go berserk

            // PHASE C: EXIT (Fade Out)
            setTimeout(() => {
                img.style.opacity = '0';
            }, 9000); // After 9 seconds total (3s of berserk), fade out

            // PHASE D: CLEANUP
            setTimeout(() => {
                img.remove();
            }, 11000); // Remove from DOM after transition

            // 6. PREPARE NEXT
            currentDiscIndex = (currentDiscIndex + 1) % discImages.length;
        }

        // Start the cycle
        spawnDisc();
        setInterval(spawnDisc, 9000); // Overlap slightly: Start next one as previous one fades

        // --- 3. UI LOGIC (CARD & TEXT) ---
        const card = document.getElementById('card');
        const decodeText = document.getElementById('decode-text');
        let streamInterval;

        function runTextStream(text) {
            clearInterval(streamInterval);
            let index = 0;
            decodeText.innerHTML = "> DECRYPTING SOURCE...<br>> ";
            streamInterval = setInterval(() => {
                if (index < text.length) {
                    decodeText.innerHTML += text[index];
                    index++;
                } else {
                    clearInterval(streamInterval);
                    decodeText.innerHTML += "<span class='cursor-blink'>_</span>";
                }
            }, 30);
        }

        function activate(key) {
            const item = contentData[key];
            if(!item) return;

            document.getElementById('c-id').innerText = `SYS.${key.toUpperCase()}`;
            document.getElementById('c-title').innerText = item.title;
            document.getElementById('c-title').style.color = item.color;
            document.getElementById('c-desc').innerText = item.desc;
            document.getElementById('c-link').href = item.link;
            
            runTextStream(item.stream);
            
            const btn = document.getElementById('c-link');
            btn.style.color = 'black';
            btn.style.background = 'transparent';
            btn.style.borderColor = item.color;
            btn.onmouseover = () => { btn.style.background = item.color; btn.style.color = 'white'; };
            btn.onmouseout = () => { btn.style.background = 'transparent'; btn.style.color = 'black'; };

            card.classList.add('visible');
        }

        function closeCard() {
            card.classList.remove('visible');
            decodeText.innerHTML = "> CONNECTION TERMINATED.<br>> <span class='cursor-blink'>_</span>";
        }

        document.body.addEventListener('click', (e) => {
            if(!e.target.closest('.reel-group') && !e.target.closest('#card')) {
                closeCard();
            }
        });
    </script>
</body>
</html>
