    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #999; }
        
        .generation-line {
            position: relative;
            border-left: 2px solid #d1d5db;
            padding-left: 40px;
            margin-left: 20px;
        }
        
        .generation-line::before {
            content: '';
            position: absolute;
            left: -2px;
            top: 50%;
            width: 40px;
            height: 2px;
            background: #d1d5db;
        }
        
        .spouse-connector {
            position: relative;
        }
        
        .spouse-connector::after {
            content: '×';
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            color: #ef4444;
            font-weight: bold;
        }
        
        .child-line {
            position: relative;
        }
        
        .child-line::before {
            content: '';
            position: absolute;
            left: -40px;
            top: 0;
            width: 2px;
            height: 100%;
            background: #d1d5db;
        }
        
        .person-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .person-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .era-creation { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-color: #f59e0b; }
        .era-patriarchs { background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); border-color: #3b82f6; }
        .era-tribes { background: linear-gradient(135deg, #fed7aa 0%, #fdba74 100%); border-color: #f97316; }
        .era-kingdom { background: linear-gradient(135deg, #e9d5ff 0%, #d8b4fe 100%); border-color: #a855f7; }
        .era-exile { background: linear-gradient(135deg, #e7e5e4 0%, #d6d3d1 100%); border-color: #78716c; }
        .era-modern { background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%); border-color: #10b981; }
        .era-future { background: linear-gradient(135deg, #c7d2fe 0%, #a5b4fc 100%); border-color: #6366f1; }
        
        .female-card { border: 2px dashed #ec4899; }
        .male-card { border: 2px solid; }
