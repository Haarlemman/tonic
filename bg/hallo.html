    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            overflow: hidden;
            color: #fff;
        }
        
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .control-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        
        .control-btn:hover {
            transform: scale(1.05);
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, #f39c12 0%, #e74c3c 100%);
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
            position: relative;
        }
        
        #canvas-container.grabbing {
            cursor: grabbing;
        }
        
        canvas {
            display: block;
        }
        
        #tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 999;
            max-width: 300px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        #legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            font-size: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            margin-right: 10px;
        }
        
        .legend-line {
            width: 30px;
            height: 2px;
            margin-right: 10px;
        }

        function addCollapsedState(node) {
            node.collapsed = false;
            if (node.children) {
                node.children.forEach(addCollapsedState);
            }
            if (node.descendants) {
                node.descendants.forEach(addCollapsedState);
            }
        }
        addCollapsedState(genealogyData);
        
        function drawNode(x, y, node, isPatriarch = false) {
            const nodeRadius = node.expected ? 12 : (node.modern ? 10 : 8);
            let color;
            
            if (node.collapsed && (node.children || node.descendants)) {
                color = '#9b59b6';
            } else if (node.expected) {
                color = '#FFD700';
            } else if (node.modern) {
                color = '#27ae60';
            } else if (highlightDavidicLine && node.davidicLine) {
                color = '#e74c3c';
            } else if (isPatriarch) {
                color = '#f39c12';
            } else {
                color = '#3498db';
            }
            
            if (node.expected) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#FFD700';
            }
            
            ctx.beginPath();
            ctx.arc(x, y, nodeRadius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = '#fff';
            ctx.font = node.expected ? 'bold 16px Arial' : (node.modern ? 'italic 13px Arial' : 'bold 14px Arial');
            ctx.textAlign = 'center';
            ctx.fillText(node.name, x, y - 15);
            
            if (showDetails && node.details) {
                ctx.font = '11px Arial';
                ctx.fillStyle = '#aaa';
                ctx.fillText(node.details, x, y + 25);
            }
            
            if ((node.children || node.descendants) && (node.children?.length > 0 || node.descendants?.length > 0)) {
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Arial';
                ctx.fillText(node.collapsed ? '+' : '−', x, y + 5);
            }
            
            return { x, y, radius: nodeRadius, node };
        }
        
        function drawTree(node, x, y, level = 0, parent = null, isDottedLine = false) {
            const verticalSpacing = 100;
            const horizontalSpacing = 90;
            const levelY = y + level * verticalSpacing;
            
            if (parent) {
                // --- FIX: Changed to orthogonal (elbow) lines ---
                ctx.beginPath();
                ctx.moveTo(parent.x, parent.y); // Start at parent center
                
                const midY = parent.y + (verticalSpacing / 2); // Halfway down
                ctx.lineTo(parent.x, midY); // Draw straight down
                ctx.lineTo(x, midY);        // Draw horizontally to child X coordinate
                ctx.lineTo(x, levelY);      // Draw straight down to child center
                // --------------------------------------------------

                if (node.expected || node.modern || isDottedLine) {
                    ctx.setLineDash([5, 5]);
                    if (node.expected) {
                        ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
                        ctx.lineWidth = 3;
                    } else {
                        ctx.strokeStyle = 'rgba(39, 174, 96, 0.6)';
                        ctx.lineWidth = 2;
                    }
                } else if (highlightDavidicLine && node.davidicLine) {
                    ctx.setLineDash([]);
                    ctx.strokeStyle = 'rgba(231, 76, 60, 0.6)';
                    ctx.lineWidth = 3;
                } else {
                    ctx.setLineDash([]);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 2;
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            const nodeInfo = drawNode(x, levelY, node, level === 0);
            nodeInfo.level = level;
            clickableNodes.push(nodeInfo);
            
            let allChildren = [];
            if (node.children && !node.collapsed) {
                allChildren = [...node.children];
            }
            
            if (allChildren.length > 0) {
                const totalWidth = (allChildren.length - 1) * horizontalSpacing;
                const startX = x - totalWidth / 2;
                
                allChildren.forEach((child, i) => {
                    const childX = startX + i * horizontalSpacing;
                    drawTree(child, childX, y, level + 1, { x, y: levelY }, false);
                });
            }
            
            if (node.descendants && !node.collapsed) {
                const descendantSpacing = 120;
                const totalDescWidth = (node.descendants.length - 1) * descendantSpacing;
                const startDescX = x - totalDescWidth / 2;
                
                node.descendants.forEach((desc, i) => {
                    const descX = startDescX + i * descendantSpacing;
                    drawTree(desc, descX, y, level + 2, { x, y: levelY }, true);
                });
            }
        }
        
        let clickableNodes = [];
        
        function render() {
            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);
            
            clickableNodes = [];
            drawTree(genealogyData, 0, 0);
            
            ctx.restore();
        }
        
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left - offsetX) / scale,
                y: (e.clientY - rect.top - offsetY) / scale
            };
        }
        
        function findNodeAtPosition(x, y) {
            for (let node of clickableNodes) {
                const dx = x - node.x;
                const dy = y - node.y;
                if (Math.sqrt(dx * dx + dy * dy) <= node.radius * 2) {
                    return node;
                }
            }
            return null;
        }
        
        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            const node = findNodeAtPosition(pos.x, pos.y);
            
            if (node && (node.node.children || node.node.descendants)) {
                node.node.collapsed = !node.node.collapsed;
                render();
            } else {
                isDragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
                container.classList.add('grabbing');
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX += e.clientX - lastX;
                offsetY += e.clientY - lastY;
                lastX = e.clientX;
                lastY = e.clientY;
                render();
            } else {
                const pos = getMousePos(e);
                const node = findNodeAtPosition(pos.x, pos.y);
                
                if (node) {
                    tooltip.style.opacity = '1';
                    tooltip.style.left = e.clientX + 15 + 'px';
                    tooltip.style.top = e.clientY + 15 + 'px';
                    tooltip.innerHTML = `<strong>${node.node.name}</strong>` + 
                        (node.node.details ? `<br><em>${node.node.details}</em>` : '') +
                        (node.node.davidicLine && highlightDavidicLine ? '<br>⭐ In Davidic lineage' : '') +
                        (node.node.expected ? '<br>✡️ Expected Messiah - collective awakening' : '') +
                        (node.node.modern ? '<br>🌍 Modern descendant peoples' : '') +
                        ((node.node.children || node.node.descendants) ? `<br><small>Click to ${node.node.collapsed ? 'expand' : 'collapse'}</small>` : '');
                    canvas.style.cursor = 'pointer';
                } else {
                    tooltip.style.opacity = '0';
                    canvas.style.cursor = isDragging ? 'grabbing' : 'grab';
                }
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            container.classList.remove('grabbing');
        });
        
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = scale * delta;
            
            if (newScale >= 0.2 && newScale <= 3) {
                const mouseX = e.clientX - offsetX;
                const mouseY = e.clientY - offsetY;
                
                offsetX -= mouseX * (delta - 1);
                offsetY -= mouseY * (delta - 1);
                scale = newScale;
                render();
            }
        });
        
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            render();
        });
        
        function resetView() {
            scale = 0.4;
            offsetX = width / 2;
            offsetY = 50;
            render();
        }
        
        function expandAll() {
            function expand(node) {
                node.collapsed = false;
                if (node.children) node.children.forEach(expand);
                if (node.descendants) node.descendants.forEach(expand);
            }
            expand(genealogyData);
            render();
        }
        
        function collapseAll() {
            function collapse(node) {
                node.collapsed = true;
                if (node.children) node.children.forEach(collapse);
                if (node.descendants) node.descendants.forEach(collapse);
            }
            collapse(genealogyData);
            render();
        }
        
        function toggleHighlight() {
            highlightDavidicLine = !highlightDavidicLine;
            document.getElementById('highlightBtn').classList.toggle('active');
            render();
        }
        
        function toggleNames() {
            showDetails = !showDetails;
            render();
        }
        
        render();
