                    }),
                    }

        const App = () => {
            const [scale, setScale] = React.useState(1);
            const [position, setPosition] = React.useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = React.useState(false);
            const [dragStart, setDragStart] = React.useState({ x: 0, y: 0 });
            const [mode, setMode] = React.useState('pan'); // 'pan' or 'zoom'
            
            const [inspectedNode, setInspectedNode] = React.useState(null);
            const containerRef = React.useRef(null);
            const [touchDistance, setTouchDistance] = React.useState(null);

            const handleZoomIn = () => setScale(prev => Math.min(prev + 0.2, 3));
            const handleZoomOut = () => setScale(prev => Math.max(prev - 0.2, 0.3));
            const handleReset = () => { setScale(1); setPosition({ x: 0, y: 0 }); };

            const handleWheel = (e) => {
                if (e.ctrlKey || mode === 'zoom') {
                    e.preventDefault();
                    const delta = e.deltaY * -0.001;
                    setScale(prev => Math.min(Math.max(prev + delta, 0.1), 4));
                } else {
                   // Default scroll behavior (pan)
                }
            };

            const handleMouseDown = (e) => {
                // Only start drag if clicking on background, not a button
                if (e.target.closest('button')) return;
                
                setIsDragging(true);
                setDragStart({ x: e.clientX - position.x, y: e.clientY - position.y });
            };
            const handleMouseMove = (e) => {
                if (isDragging) {
                    setPosition({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
                }
            };
            const handleMouseUp = () => setIsDragging(false);

            const handleTouchStart = (e) => {
                if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    setTouchDistance(dist);
                } else if (e.touches.length === 1) {
                    setIsDragging(true);
                    setDragStart({ x: e.touches[0].clientX - position.x, y: e.touches[0].clientY - position.y });
                }
            };

            const handleTouchMove = (e) => {
                // Always prevent default to stop page scroll
                if (isDragging || touchDistance) e.preventDefault();
                
                if (e.touches.length === 2 && touchDistance) {
                    const newDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const delta = newDist / touchDistance;
                    setScale(prev => Math.min(Math.max(prev * delta, 0.1), 4));
                    setTouchDistance(newDist);
                } else if (e.touches.length === 1 && isDragging) {
                    setPosition({
                        x: e.touches[0].clientX - dragStart.x,
                        y: e.touches[0].clientY - dragStart.y
                    });
                }
            };

            const handleTouchEnd = () => {
                setIsDragging(false);
                setTouchDistance(null);
            };

            return (
                <div className="w-full h-screen bg-stone-100 flex flex-col font-sans overflow-hidden">
                    <div className="h-16 bg-white/90 backdrop-blur border-b border-stone-200 flex items-center justify-between px-6 z-20 shadow-sm">
                        <div className="flex items-center space-x-3">
                            <div className="p-2 bg-gradient-to-br from-amber-100 to-amber-200 rounded-lg text-amber-700 shadow-sm">

                                <p className="text-xs text-stone-500 hidden sm:block">From Adam to the Messiah</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2 bg-stone-100 p-1 rounded-lg">
                             <button 
                                onClick={() => setMode(mode === 'pan' ? 'zoom' : 'pan')}
                                className={`p-2 rounded-md transition-colors hidden sm:block ${mode === 'zoom' ? 'bg-amber-200 text-amber-800' : 'hover:bg-white text-stone-600'}`}
                                title={mode === 'pan' ? "Switch to Zoom Scroll" : "Switch to Pan Scroll"}
                             >
                                <Icons.Move size={18} />
                             </button>
                             <div className="w-px h-4 bg-stone-300 mx-1 hidden sm:block"></div>
                            <button onClick={handleZoomOut} className="p-2 hover:bg-white rounded-md text-stone-600"><Icons.Minus size={18} /></button>
                            <span className="text-xs font-mono w-12 text-center text-stone-500">{Math.round(scale * 100)}%</span>
                            <button onClick={handleZoomIn} className="p-2 hover:bg-white rounded-md text-stone-600"><Icons.Plus size={18} /></button>
                            <div className="w-px h-4 bg-stone-300 mx-1"></div>
                            <button onClick={handleReset} className="p-2 hover:bg-white rounded-md text-stone-600"><Icons.RefreshCw size={18} /></button>
                        </div>
                    </div>

                    <div 
                        ref={containerRef}
                        className="flex-1 overflow-hidden relative cursor-move"
                        onWheel={handleWheel}
                        onMouseDown={handleMouseDown}
                        onMouseMove={handleMouseMove}
                        onMouseUp={handleMouseUp}
                        onMouseLeave={handleMouseUp}
                        onTouchStart={handleTouchStart}
                        onTouchMove={handleTouchMove}
                        onTouchEnd={handleTouchEnd}
                        style={{
                            background: 'linear-gradient(to bottom, #fdfbf7 0%, #fffbeb 20%, #eff6ff 50%, #f3e8ff 80%, #ecfdf5 100%)',
                        }}
                    >
                        {/* Timeline Ruler (Fixed Left Sidebar) */}
                        <div className="absolute left-0 top-0 bottom-0 w-16 bg-white/50 border-r border-stone-200 z-10 hidden md:flex flex-col items-center py-8 gap-4 overflow-hidden pointer-events-none">
                            <div className="text-[10px] text-stone-400 font-bold uppercase -rotate-90 whitespace-nowrap mb-4 tracking-widest">Time Ruler</div>
                            {Object.values(ERAS).map((era, i) => (
                                <div key={era.id} className="flex-1 flex flex-col items-center w-full relative group">
                                     <div className={`w-1 h-full ${era.color.replace('bg-', 'bg-') || 'bg-gray-200'} rounded-full opacity-50`}></div>
                                     <div className="absolute left-8 top-1/2 -translate-y-1/2 text-[10px] font-bold text-stone-500 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity bg-white px-2 py-1 rounded shadow-sm">
                                         {era.label}
                                     </div>
                                </div>
                            ))}
                        </div>

                        <div className="absolute inset-0 pointer-events-none opacity-20" style={{
                            backgroundImage: 'radial-gradient(#a8a29e 1px, transparent 1px)',
                            backgroundSize: '32px 32px'
                        }}></div>

                        <div 
                            className="absolute origin-top-center transition-transform duration-75 ease-out w-full flex justify-center pt-20 pb-40"
                            style={{
                                transform: `translate(${position.x}px, ${position.y}px) scale(${scale})`,
                            }}
                        >
                            <TreeNode node={biblicalData} onInspect={setInspectedNode} />
                        </div>

                        <div className="absolute bottom-6 left-6 bg-white/95 backdrop-blur p-4 rounded-xl border border-stone-200 shadow-lg pointer-events-none select-none max-w-[200px] z-20">
                            <h3 className="text-xs font-bold text-stone-400 uppercase tracking-wider mb-3">Time Periods</h3>
                            <div className="space-y-2 text-xs text-stone-600">
                                {Object.values(ERAS).map(era => (
                                    <div key={era.id} className="flex items-center">
                                        <span className={`w-3 h-3 ${era.color} ${era.border} border rounded mr-2`}></span> 
                                        {era.label}
                                    </div>
                                ))}
                                <div className="flex items-center mt-3 pt-3 border-t border-stone-100 italic text-stone-400">
                                    <Icons.User size={12} className="mr-2"/> Click card for Bio
                                </div>
                            </div>
                        </div>
                    </div>

                    {inspectedNode && (
                        <AncestralWisdomModal node={inspectedNode} onClose={() => setInspectedNode(null)} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
