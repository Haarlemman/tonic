<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblical Genealogy to Jesus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2e;
            overflow: hidden;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            overflow: auto;
            position: relative;
            background: #2d2d44;
        }
        #virtual-canvas {
            position: relative;
            min-width: 3000px;
            min-height: 3000px;
        }
        canvas {
            display: block;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
        }
        .control-btn {
            background: #667eea;
            border: none;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        .control-btn:hover {
            transform: scale(1.05);
        }
        .control-btn.active {
            background: #f39c12;
        }
        #tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 999;
            max-width: 200px;
        }
        #legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 2px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button class="control-btn" onclick="resetView()">Reset View</button>
        <button class="control-btn" onclick="toggleGenderColors()">Toggle Gender Colors</button>
        <button class="control-btn" onclick="expandAll()">Expand All</button>
        <button class="control-btn" onclick="collapseAll()">Collapse All</button>
        <button class="control-btn" id="highlightBtn" onclick="toggleHighlight()">Highlight Jesus Line</button>
        <button class="control-btn" onclick="toggleDetails()">Toggle Details</button>
    </div>
    <div id="legend">
        <div class="legend-item"><div class="legend-color" style="background: #3498db;"></div><span>Husband</span></div>
        <div class="legend-item"><div class="legend-color" style="background: #ff69b4;"></div><span>Wife</span></div>
        <div class="legend-item"><div class="legend-color" style="background: #e74c3c;"></div><span>Jesus Line</span></div>
        <div class="legend-item"><div class="legend-color" style="background: #9b59b6;"></div><span>Collapsed</span></div>
    </div>
    <div id="canvas-container">
        <div id="virtual-canvas">
            <canvas id="canvas"></canvas>
        </div>
    </div>
    <div id="tooltip"></div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const tooltip = document.getElementById('tooltip');
            const container = document.getElementById('canvas-container');
            const virtualCanvas = document.getElementById('virtual-canvas');

            let width = 3000;
            let height = 3000;
            canvas.width = width;
            canvas.height = height;

            let offsetX = 0, offsetY = 0;
            let scale = 0.5;
            let isDragging = false;
            let lastX = 0, lastY = 0;
            let showDetails = true;
            let highlightJesusLine = false;
            let useGenderColors = false;

            const genealogyData = {
                name: "Adam & Eve",
                details: "First humans",
                jesusLine: true,
                gender: "mixed",
                children: [
                    {
                        name: "Seth & Azura",
                        gender: "mixed",
                        jesusLine: true,
                        children: [
                            { name: "Enos", gender: "male", jesusLine: true },
                            { name: "Cainan", gender: "male", jesusLine: true }
                        ]
                    },
                    {
                        name: "Cain",
                        gender: "male",
                        children: [
                            { name: "Enoch", gender: "male" }
                        ]
                    }
                ]
            };

            let current = genealogyData;
            const generations = [
                "Mahalalel", "Jared", "Enoch", "Methuselah", "Lamech",
                "Noah", "Shem", "Arphaxad", "Shelah", "Eber",
                "Peleg", "Reu", "Serug", "Nahor", "Terah",
                "Abraham", "Isaac & Rebekah", "Jacob & Leah", "Judah",
                "Perez", "Hezron", "Ram", "Amminadab", "Nahshon",
                "Salmon", "Boaz & Ruth", "Obed", "Jesse",
                "King David", "Solomon & Naamah", "Rehoboam", "Jeconiah",
                "Zerubbabel", "Joseph & Mary", "JESUS CHRIST"
            ];
            generations.forEach((name, i) => {
                const gender = name.includes("&") ? "mixed" : (i % 2 === 0 ? "male" : "female");
                const node = { name, gender, jesusLine: true, children: i < generations.length - 1 ? [] : undefined };
                current.children.push(node);
                if (i < generations.length - 2) current = node;
            });

            function addCollapsedState(node) {
                node.collapsed = false;
                if (node.children) node.children.forEach(addCollapsedState);
            }
            addCollapsedState(genealogyData);

            function getGeneration(node, gen = 0) {
                node.generation = gen;
                if (node.children) node.children.forEach(child => getGeneration(child, gen + 1));
            }
            getGeneration(genealogyData);

            let nodesByGen = {};
            function collectNodes(node) {
                if (!nodesByGen[node.generation]) nodesByGen[node.generation] = [];
                nodesByGen[node.generation].push(node);
                if (node.children && !node.collapsed) node.children.forEach(collectNodes);
            }

            function drawNode(x, y, node) {
                const nodeRadius = node.name === "JESUS CHRIST" ? 12 : 8;
                let color = '#3498db';
                if (useGenderColors) {
                    if (node.gender === "female" || (node.gender === "mixed" && node.name.split("&")[1])) color = '#ff69b4';
                    else if (node.gender === "male" || (node.gender === "mixed" && node.name.split("&")[0])) color = '#3498db';
                }
                if (node.collapsed && node.children) color = '#9b59b6';
                else if (highlightJesusLine && node.jesusLine) color = '#e74c3c';
                else if (node.name === "JESUS CHRIST") color = '#FFD700';

                ctx.beginPath();
                ctx.arc(x, y, nodeRadius, 0, Math.PI * 2);
                ctx.fillStyle = color;

                ctx.fill();
                if (node.name === "JESUS CHRIST") {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#FFD700';
                }

                const displayName = showDetails && node.details ? `${node.name} (${node.details})` : node.name;
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(displayName, x + 15, y + 5);
                ctx.shadowBlur = 0;

                return { x, y, radius: nodeRadius };
            }

            function drawTree() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(offsetX, offsetY);
                ctx.scale(scale, scale);

                nodesByGen = {}; // Reset nodesByGen
                collectNodes(genealogyData);

                const genHeight = 150;
                const genWidth = 200;
                Object.keys(nodesByGen).forEach((gen, i) => {
                    const y = (i + 1) * genHeight;
                    nodesByGen[gen].forEach((node, j) => {
                        const x = (j + 1) * genWidth;
                        const nodePos = drawNode(x, y, node);
                        if (node.children && !node.collapsed) {
                            node.children.forEach(child => {
                                const childGen = nodesByGen[parseInt(gen) + 1] || [];
                                const childIndex = childGen.indexOf(child);
                                if (childIndex !== -1) {
                                    ctx.beginPath();
                                    ctx.moveTo(nodePos.x, nodePos.y + nodePos.radius);
                                    ctx.lineTo((childIndex + 1) * genWidth, (parseInt(gen) + 2) * genHeight - nodePos.radius);
                                    ctx.strokeStyle = node.jesusLine && highlightJesusLine ? '#e74c3c' : '#fff';
                                    ctx.stroke();
                                }
                            });
                        }
                    });
                });

                ctx.restore();
            }

            // Event Listeners
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastX = e.clientX - offsetX;
                lastY = e.clientY - offsetY;
                container.classList.add('grabbing');
            });

            container.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const newX = e.clientX - offsetX;
                    const newY = e.clientY - offsetY;
                    offsetX += newX - lastX;
                    offsetY += newY - lastY;
                    lastX = newX;
                    lastY = newY;
                    drawTree();
                }
                const rect = canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - offsetX) / scale;
                const mouseY = (e.clientY - rect.top - offsetY) / scale;
                const nodes = [];
                function findNodes(node, x, y) {
                    const nodePos = { x, y, radius: node.name === "JESUS CHRIST" ? 12 : 8 };
                    if (Math.hypot(mouseX - nodePos.x, mouseY - nodePos.y) < nodePos.radius) {
                        nodes.push({ node, x, y });
                    }
                    if (node.children && !node.collapsed) {
                        const gen = nodesByGen[parseInt(node.generation) + 1] || [];
                        node.children.forEach((child, i) => {
                            const childX = (gen.indexOf(child) + 1) * genWidth;
                            const childY = (parseInt(node.generation) + 2) * genHeight;
                            findNodes(child, childX, childY);
                        });
                    }
                }
                Object.values(nodesByGen).flat().forEach(node => {
                    const x = (nodesByGen[node.generation].indexOf(node) + 1) * genWidth;
                    const y = (node.generation + 1) * genHeight;
                    findNodes(node, x, y);
                });
                if (nodes.length > 0) {
                    const node = nodes[0].node;
                    tooltip.style.left = (e.clientX + 10) + 'px';
                    tooltip.style.top = (e.clientY + 10) + 'px';
                    tooltip.style.opacity = 1;
                    tooltip.innerHTML = `<strong>${node.name}</strong><br>${node.details || ''}`;
                } else {
                    tooltip.style.opacity = 0;
                }
            });

            container.addEventListener('mouseup', () => {
                isDragging = false;
                container.classList.remove('grabbing');
            });

            container.addEventListener('mouseleave', () => {
                isDragging = false;
                container.classList.remove('grabbing');
                tooltip.style.opacity = 0;
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomSpeed = 0.1;
                const zoom = e.deltaY < 0 ? 1 + zoomSpeed : 1 - zoomSpeed;
                scale = Math.min(Math.max(0.1, scale * zoom), 10);
                drawTree();
            });

            // Control Functions
            window.resetView = function() {
                offsetX = 0;
                offsetY = 0;
                scale = 0.5;
                drawTree();
            };

            window.toggleGenderColors = function() {
                useGenderColors = !useGenderColors;
                document.querySelector('[onclick="toggleGenderColors()"]').classList.toggle('active', useGenderColors);
                drawTree();
            };

            window.expandAll = function() {
                function expand(node) { node.collapsed = false; if (node.children) node.children.forEach(expand); }
                expand(genealogyData);
                drawTree();
            };

            window.collapseAll = function() {
                function collapse(node) { node.collapsed = true; if (node.children) node.children.forEach(collapse); }
                collapse(genealogyData);
                drawTree();
            };

            window.toggleHighlight = function() {
                highlightJesusLine = !highlightJesusLine;
                document.getElementById('highlightBtn').classList.toggle('active', highlightJesusLine);
                drawTree();
            };

            window.toggleDetails = function() {
                showDetails = !showDetails;
                drawTree();
            };

            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - offsetX) / scale;
                const mouseY = (e.clientY - rect.top - offsetY) / scale;
                function toggleCollapse(node, x, y) {
                    const nodePos = { x, y, radius: node.name === "JESUS CHRIST" ? 12 : 8 };
                    if (Math.hypot(mouseX - nodePos.x, mouseY - nodePos.y) < nodePos.radius && node.children) {
                        node.collapsed = !node.collapsed;
                        drawTree();
                        return true;
                    }
                    if (node.children && !node.collapsed) {
                        const gen = nodesByGen[parseInt(node.generation) + 1] || [];
                        node.children.forEach((child, i) => {
                            const childX = (gen.indexOf(child) + 1) * genWidth;
                            const childY = (parseInt(node.generation) + 2) * genHeight;
                            if (toggleCollapse(child, childX, childY)) return true;
                        });
                    }
                    return false;
                }
                Object.values(nodesByGen).flat().forEach(node => {
                    const x = (nodesByGen[node.generation].indexOf(node) + 1) * genWidth;
                    const y = (node.generation + 1) * genHeight;
                    toggleCollapse(node, x, y);
                });
            });

            // Initial render
            drawTree();
        });
    </script>
</body>
</html>
