<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>THE WAR OF WORDS | Interactive Audio Visual Experience</title>
    <meta name="description" content="An interactive generative art experience exploring free will, entropy, and emotion through audio-visual synthesis.">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html, body {
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background: #000; 
            font-family: 'Share Tech Mono', monospace;
            -webkit-user-select: none; /* Safari */
            user-select: none;
            touch-action: none; /* Prevents iOS scroll/zoom gestures */
        }
        
        #root {
            width: 100vw;
            height: 100dvh; /* iOS Dynamic Viewport Height */
            position: relative;
        }

        canvas { 
            display: block; 
            width: 100%;
            height: 100%;
        }
        
        /* CRT SCANLINE EFFECT */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            position: absolute; inset: 0; pointer-events: none; z-index: 10;
        }
        .glow-text {
            text-shadow: 0 0 10px #39FF14;
        }
        
        /* UI BUTTONS */
        .icon-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid #39FF14;
            color: #39FF14;
            padding: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            z-index: 30;
        }
        .icon-btn:active {
            background: #39FF14;
            color: black;
        }
        .icon-btn:hover {
            box-shadow: 0 0 10px #39FF14;
        }

        /* HEADER */
        .hud-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: flex-end; /* Align right since icons are gone */
            align-items: center;
            z-index: 40;
            pointer-events: none; /* Let clicks pass through empty space */
        }
        .hud-interactive {
            pointer-events: auto;
            display: flex;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ICONS
        const IconVolume2 = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>;
        const IconVolumeX = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>;
        const IconMaximize = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>;
        const IconMinimize = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>;

        const C = {
            bg: "#000000",
            neon: "#39FF14",
            red: "#FF0033",
            orange: "#FF6000",
            cyan: "#00F3FF",
            pink: "#FF00CC",
            grid: "#111111",
            sky: "rgba(0, 243, 255, 0.4)"
        };

        const CONCEPTS_MALE = ['FREE WILL', 'CONTROL', 'POWER', 'TECHNOLOGY', 'PARADOX', 'ENTROPY', 'CHAOS', 'A. I.', 'MONEY', 'TIME', 'SPACE', 'QUANTUM', 'VOID', 'LOGIC', 'SYSTEM'];
        const CONCEPTS_FEMALE = ['LOVE', 'EMOTION', 'FEELING', 'A DATE', 'HI', 'HOW ARE YOU', 'WARMTH', 'CONNECTION', 'TOUCH', 'SMILE', 'LAUGH', 'DREAM', 'HEART', 'SOUL', 'GENTLE', 'HELLO', 'YOU', 'SOLACE'];

        // --- AUDIO ENGINE ---
        class RoboSynth {
            constructor() {
                this.ctx = null;
                this.filter = null;
                this.masterGain = null;
                this.baseVolume = 0.5; 
                this.tempo = 118;
                this.nextNoteTime = 0;
                this.step = 0;
                this.sequence = [110, 110, 220, 110, 130.8, 110, 164.8, 110]; 
                this.isMuted = false;
                this.maleVoice = null;
                this.femaleVoice = null;
                this.voicesLoaded = false;
                this.voiceLoadTries = 0;
                
                // Device Detection
                this.isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                this.isAndroid = /Android/.test(navigator.userAgent);
                
                this.currentUtterance = null;
                
                if (window.speechSynthesis) {
                    window.speechSynthesis.onvoiceschanged = () => this.loadVoices();
                    
                    this.voiceInterval = setInterval(() => {
                        if (!this.voicesLoaded && this.voiceLoadTries < 10) {
                            this.loadVoices();
                            this.voiceLoadTries++;
                        } else {
                            clearInterval(this.voiceInterval);
                        }
                    }, 500);
                }
            }

            loadVoices() {
                const voices = window.speechSynthesis.getVoices();
                if (voices.length > 0) {
                    this.voicesLoaded = true;
                    // console.log("Voices loaded:", voices.map(v => v.name));

                    // 1. SELECT MALE: STRATEGY = FORCE BRITISH (GB)
                    // "Daniel" (iOS), "Google UK English Male" (Chrome), or any "en-GB"
                    const malePriorities = ["Daniel", "Google UK English Male", "Rocko", "en-GB", "en_GB"];
                    
                    this.maleVoice = voices.find(v => 
                        malePriorities.some(p => v.name.includes(p) || v.lang.includes(p))
                    ) || voices.find(v => 
                        v.name.toLowerCase().includes("male")
                    );

                    // 2. SELECT FEMALE: STRATEGY = FORCE US (US)
                    // "Samantha" (iOS), "Google US English" (Chrome)
                    const femalePriorities = ["Samantha", "Google US English", "en-US", "en_US"];
                    this.femaleVoice = voices.find(v => femalePriorities.some(p => v.name.includes(p) || v.lang.includes(p))) 
                                       || voices.find(v => v.name.toLowerCase().includes("female"));

                    // FALLBACK: If we still don't have distinct voices, just use index 0 and 1
                    if (!this.maleVoice) this.maleVoice = voices[0];
                    if (!this.femaleVoice) this.femaleVoice = voices[1] || voices[0];
                }
            }

            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AC();
                    this.setupNodes();
                    this.nextNoteTime = this.ctx.currentTime + 0.1;
                    this.scheduler();
                } 
                this.ensureContext();
                
                if (window.speechSynthesis) {
                    if(!this.voicesLoaded) this.loadVoices();
                    window.speechSynthesis.cancel();
                    const silence = new SpeechSynthesisUtterance("");
                    window.speechSynthesis.speak(silence);
                }
            }

            ensureContext() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            setupNodes() {
                this.masterGain = this.ctx.createGain();
                
                if (this.isAndroid) {
                    this.baseVolume = 0.4;
                } else if (this.isIOS) {
                    this.baseVolume = 0.8; 
                } else {
                    this.baseVolume = 0.6;
                }
                
                this.masterGain.gain.value = this.baseVolume;
                this.masterGain.connect(this.ctx.destination);
                this.filter = this.ctx.createBiquadFilter();
                this.filter.type = "lowpass";
                this.filter.frequency.value = 1000;
                this.filter.Q.value = 5;
                this.filter.connect(this.masterGain);
            }

            toggleMute(shouldMute) {
                this.isMuted = shouldMute;
                if (this.masterGain && this.ctx) {
                    const now = this.ctx.currentTime;
                    const targetVolume = shouldMute ? 0 : this.baseVolume;
                    this.masterGain.gain.cancelScheduledValues(now);
                    this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, now);
                    this.masterGain.gain.linearRampToValueAtTime(targetVolume, now + 0.1);
                }
                if (shouldMute) {
                    window.speechSynthesis.cancel();
                }
            }

            setFilter(yPct) {
                if(!this.filter || !this.ctx) return;
                const clamped = Math.max(0, Math.min(1, yPct));
                const freq = 400 + (Math.pow(1 - clamped, 2) * 5000); 
                this.filter.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.1);
            }

            triggerKick(time) {
                if (!this.ctx || this.isMuted) return;
                const t = time;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.connect(g);
                g.connect(this.masterGain);
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.5);
                g.gain.setValueAtTime(0.8, t);
                g.gain.linearRampToValueAtTime(0.0, t + 0.5); 
                osc.start(t);
                osc.stop(t + 0.5);
            }

            triggerHat(time) {
                if (!this.ctx || this.isMuted) return;
                const t = time;
                const bufferSize = this.ctx.sampleRate * 2; 
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const bandpass = this.ctx.createBiquadFilter();
                bandpass.type = "bandpass";
                bandpass.frequency.value = 10000;
                bandpass.Q.value = 1;
                const highpass = this.ctx.createBiquadFilter();
                highpass.type = "highpass";
                highpass.frequency.value = 7000;
                const g = this.ctx.createGain();
                noise.connect(bandpass);
                bandpass.connect(highpass);
                highpass.connect(g);
                g.connect(this.masterGain);
                g.gain.setValueAtTime(0.2, t);
                g.gain.linearRampToValueAtTime(0.0, t + 0.05); 
                noise.start(t);
                noise.stop(t + 0.05);
            }

            playSynth(time, freq) {
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = 'sawtooth'; 
                osc.frequency.value = freq;
                g.gain.setValueAtTime(0.1, time);
                g.gain.linearRampToValueAtTime(0.0, time + 0.2);
                osc.connect(g);
                g.connect(this.filter); 
                osc.start(time);
                osc.stop(time + 0.2);
            }

            speak(text, gender = 'male') {
                if (this.isMuted) return;
                if (!this.voicesLoaded) this.loadVoices(); 

                // 1. Trigger Sound FX
                if (this.ctx) {
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    
                    if (gender === 'male') {
                        osc.type = 'sawtooth'; // Rougher
                        osc.frequency.setValueAtTime(60, t); // Deep bass
                        osc.frequency.exponentialRampToValueAtTime(30, t + 0.5); // Pitch drop
                        g.gain.setValueAtTime(0.4, t);
                    } else {
                        osc.type = 'sine'; // Smooth
                        osc.frequency.setValueAtTime(880, t);
                        osc.frequency.exponentialRampToValueAtTime(440, t + 0.5);
                        g.gain.setValueAtTime(0.1, t);
                    }

                    g.gain.linearRampToValueAtTime(0.0, t + 0.5);
                    osc.connect(g);
                    g.connect(this.masterGain);
                    osc.start(t);
                    osc.stop(t + 0.5);
                }

                // 2. Trigger Voice
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    
                    const u = new SpeechSynthesisUtterance(text);
                    this.currentUtterance = u;
                    u.onend = () => { this.currentUtterance = null; };
                    u.onerror = (e) => { console.error("TTS Error:", e); };
                    
                    u.volume = this.isIOS ? 0.6 : 1.0; 
                    
                    if (gender === 'male') {
                        // MALE SETTINGS
                        // If we are using Daniel (GB), he is naturally deep. 
                        // We use 0.9 pitch (slightly low) rather than 0.4 (broken robot).
                        u.rate = 0.9; 
                        u.pitch = 0.9; 
                        if (this.maleVoice) u.voice = this.maleVoice;
                        // Lang override to ensure accent if voice fails
                        u.lang = 'en-GB'; 
                    } else {
                        // FEMALE SETTINGS
                        u.rate = 1.0; 
                        u.pitch = 1.2; 
                        if (this.femaleVoice) u.voice = this.femaleVoice;
                        u.lang = 'en-US';
                    }

                    window.speechSynthesis.speak(u);
                    return "SPEAKING";
                }
                return "NO TTS";
            }

            scheduler() {
                const lookahead = 0.1;
                const interval = 25;
                if (!this.ctx) return;
                
                const scheduleAhead = () => {
                    if (this.nextNoteTime < this.ctx.currentTime) {
                         this.nextNoteTime = this.ctx.currentTime + 0.05;
                    }

                    while (this.nextNoteTime < this.ctx.currentTime + lookahead) {
                        if (!this.isMuted) {
                            if (this.step % 4 === 0) this.triggerKick(this.nextNoteTime);
                            this.triggerHat(this.nextNoteTime);
                            const note = this.sequence[this.step % this.sequence.length];
                            const finalNote = Math.random() > 0.9 ? note * 2 : note;
                            this.playSynth(this.nextNoteTime, finalNote);
                        }
                        const secondsPerBeat = 60.0 / this.tempo;
                        this.nextNoteTime += 0.25 * secondsPerBeat;
                        this.step++;
                    }
                    setTimeout(scheduleAhead, interval);
                };
                scheduleAhead();
            }
        }
        
        const audio = new RoboSynth();

        const App = () => {
            const canvasRef = useRef(null);
            const requestRef = useRef(null);
            const mouse = useRef({ x: 0.5, y: 0.5 });
            const [active, setActive] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [isMuted, setIsMuted] = useState(false);
            const [isIOS, setIsIOS] = useState(false);
            const [systemLog, setSystemLog] = useState("SYSTEM READY");
            
            const lastTouchRef = useRef(0);
            const globeRef = useRef([]);
            const cloudsRef = useRef([]);
            const wordsRef = useRef([]);
            const clicksRef = useRef([]); 
            const orbRef = useRef({ x: 0, y: 20, baseY: 20, radius: 40, speed: 0.05, hit: 0 });
            const sunHitRef = useRef(0); 

            useEffect(() => {
                const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                setIsIOS(iOS);

                const points = [];
                const res = 16; 
                for(let lat = 0; lat <= res; lat++) {
                    const theta = (lat * Math.PI) / res;
                    const sinTheta = Math.sin(theta);
                    const cosTheta = Math.cos(theta);
                    for(let lon = 0; lon <= res; lon++) {
                        const phi = (lon * 2 * Math.PI) / res;
                        const x = Math.sin(phi) * sinTheta;
                        const y = cosTheta;
                        const z = Math.cos(phi) * sinTheta;
                        points.push({x, y, z});
                    }
                }
                globeRef.current = points;

                const clouds = [];
                for(let i = 0; i < 15; i++) {
                    clouds.push({
                        x: Math.random() * 100,
                        y: Math.random() * 40,
                        w: Math.random() * 20 + 5,
                        speed: Math.random() * 0.05 + 0.01
                    });
                }
                cloudsRef.current = clouds;

                const handleFsChange = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleFsChange);
                return () => document.removeEventListener('fullscreenchange', handleFsChange);
            }, []);

            const checkHit = (clientX, clientY) => {
                audio.ensureContext();
                
                if (!canvasRef.current) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                const dpr = window.devicePixelRatio || 1;
                const w = canvasRef.current.width / dpr;
                const h = canvasRef.current.height / dpr;

                clicksRef.current.push({ x: (x/w)*100, y: (y/h)*100, life: 1.0 });

                // 1. Check ORB Hit (FEMALE)
                const orb = orbRef.current;
                const orbX = (orb.x / 100) * w;
                const orbY = (orb.y / 100) * h;
                const orbHitDist = w < 600 ? 100 : 150; 
                const distToOrb = Math.hypot(x - orbX, y - orbY);
                
                if (distToOrb < orbHitDist) {
                    orb.hit = Date.now();
                    const concept = CONCEPTS_FEMALE[Math.floor(Math.random() * CONCEPTS_FEMALE.length)];
                    const status = audio.speak(concept, 'female');
                    setSystemLog(`TARGET: ORB [${status}]`);
                    
                    wordsRef.current.push({
                        text: concept,
                        x: orb.x,
                        y: orb.y,
                        life: 1.0,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: -0.2 - (Math.random() * 0.2),
                        color: C.cyan
                    });
                    return; 
                }

                // 2. Check SUN Hit (MALE)
                const cx = w/2;
                const cy = h/2 - 50; 
                const sunRadius = w < 600 ? 120 : 180;
                const distToSun = Math.hypot(x - cx, y - cy);

                if (distToSun < sunRadius) {
                    sunHitRef.current = Date.now();
                    const concept = CONCEPTS_MALE[Math.floor(Math.random() * CONCEPTS_MALE.length)];
                    const status = audio.speak(concept, 'male');
                    setSystemLog(`TARGET: SUN [${status}]`);
                    
                    const pctX = (cx / w) * 100;
                    const pctY = (cy / h) * 100;

                    wordsRef.current.push({
                        text: concept,
                        x: pctX,
                        y: pctY,
                        life: 1.0,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: -0.2 - (Math.random() * 0.2),
                        color: C.neon 
                    });
                    return;
                }

                setSystemLog("TARGET: MISS");
            };

            const updateInput = (clientX, clientY) => {
                const x = clientX / window.innerWidth;
                const y = clientY / window.innerHeight;
                mouse.current = { x, y };
                audio.setFilter(y);
            };

            const handleMove = (e) => updateInput(e.clientX, e.clientY);
            
            const handleTouch = (e) => {
                lastTouchRef.current = Date.now();
                audio.ensureContext();
                if (e.touches && e.touches.length > 0) {
                    if (e.type === 'touchstart') {
                        for (let i = 0; i < e.touches.length; i++) {
                            checkHit(e.touches[i].clientX, e.touches[i].clientY);
                        }
                    }
                    updateInput(e.touches[0].clientX, e.touches[0].clientY);
                }
            };
            
            const handleMouseDown = (e) => {
                if (Date.now() - lastTouchRef.current < 500) return;
                audio.ensureContext();
                checkHit(e.clientX, e.clientY);
            }

            const toggleFullScreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            };

            const toggleMute = (e) => {
                e.stopPropagation(); 
                audio.ensureContext();
                const newState = !isMuted;
                setIsMuted(newState);
                audio.toggleMute(newState);
                setSystemLog(newState ? "AUDIO: MUTED" : "AUDIO: ACTIVE");
            };

            const start = () => {
                audio.init(); 
                setActive(true);
                if(window.speechSynthesis) window.speechSynthesis.resume();
                if (!isIOS && !document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
                requestRef.current = requestAnimationFrame(animate);
            };

            const animate = (t) => {
                const time = t * 0.001;
                const canvas = canvasRef.current;
                if(!canvas) return;

                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                
                if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
                    canvas.width = rect.width * dpr;
                    canvas.height = rect.height * dpr;
                    ctx.setTransform(1, 0, 0, 1, 0, 0); 
                    ctx.scale(dpr, dpr);
                }

                const w = rect.width;
                const h = rect.height;
                const cx = w/2;
                const cy = h/2;
                const speed = 0.5 + (mouse.current.x * 4);

                // CLEAR
                ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
                ctx.fillRect(0, 0, w, h);

                // 1. UPDATE ORB
                const orb = orbRef.current;
                orb.x += orb.speed * speed * 2;
                if (orb.x > 110) orb.x = -10; 
                orb.y = orb.baseY + Math.sin(time * 0.5) * 5;

                // 2. DRAW ORB & TARGETING BRACKETS
                const orbScreenX = (orb.x / 100) * w;
                const orbScreenY = (orb.y / 100) * h;
                const orbHitTime = Date.now() - orb.hit;
                const isOrbHit = orbHitTime < 200;

                ctx.save();
                ctx.translate(orbScreenX, orbScreenY);
                ctx.rotate(time);
                const bracketSize = w < 600 ? 40 : 50;
                ctx.strokeStyle = "rgba(0, 243, 255, 0.3)"; 
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(0, 0, bracketSize, -0.5, 0.5); ctx.stroke();
                ctx.beginPath(); ctx.arc(0, 0, bracketSize, Math.PI - 0.5, Math.PI + 0.5); ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.shadowBlur = isOrbHit ? 50 : 20;
                ctx.shadowColor = isOrbHit ? "#FFFFFF" : C.cyan; 
                ctx.fillStyle = isOrbHit ? "#FFFFFF" : C.cyan;
                ctx.beginPath();
                ctx.arc(orbScreenX, orbScreenY, w < 600 ? 30 : 40, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = C.pink;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(orbScreenX, orbScreenY, (w < 600 ? 45 : 55) + Math.sin(time*5)*2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                // 3. CLOUDS
                cloudsRef.current.forEach(cloud => {
                    cloud.x += cloud.speed * speed;
                    if (cloud.x > 100) cloud.x = -cloud.w;
                    ctx.strokeStyle = C.sky;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    const screenY = (cloud.y / 100) * h;
                    const screenX = (cloud.x / 100) * w;
                    const screenW = (cloud.w / 100) * w;
                    ctx.moveTo(screenX, screenY);
                    ctx.lineTo(screenX + screenW * 0.3, screenY);
                    ctx.moveTo(screenX + screenW * 0.5, screenY);
                    ctx.lineTo(screenX + screenW, screenY);
                    ctx.stroke();
                });

                // 4. GRID
                ctx.save();
                ctx.translate(cx, cy);
                const fov = w < 600 ? 250 : 350;
                const gridY = 150; 
                ctx.strokeStyle = `rgba(57, 255, 20, 0.4)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                const segmentCount = 30;
                const segmentDepth = 50; 
                const zOffset = (time * 500 * speed) % segmentDepth;
                for(let i = 0; i < segmentCount; i++) {
                    const z = (i * segmentDepth) - zOffset + 10; 
                    if (z < 1) continue;
                    const scale = fov / z;
                    const yProj = (gridY * scale); 
                    if (yProj > h/2) continue; 
                    ctx.moveTo(-w*2, yProj);
                    ctx.lineTo(w*2, yProj);
                }
                const vLines = 20;
                const spacing = 150; 
                const xOffset = (Math.sin(time * 0.2) * 500) + (mouse.current.x - 0.5) * 2000;
                for(let i = -vLines; i <= vLines; i++) {
                    const worldX = (i * spacing) + xOffset;
                    const zNear = 10; const scaleNear = fov / zNear;
                    const xNear = worldX * scaleNear; const yNear = gridY * scaleNear;
                    const zFar = segmentCount * segmentDepth; const scaleFar = fov / zFar;
                    const xFar = worldX * scaleFar; const yFar = gridY * scaleFar;
                    ctx.moveTo(xNear, yNear);
                    ctx.lineTo(xFar, yFar);
                }
                ctx.stroke();
                ctx.restore();

                // 5. SUN / GLOBE
                ctx.save();
                ctx.translate(cx, cy - 50); 
                
                const sunHitTime = Date.now() - sunHitRef.current;
                if (sunHitTime < 200) {
                     const shake = 5;
                     ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
                }

                const rotX = time * speed * 0.3;
                const rotY = time * speed * 0.5;
                const rotZ = time * speed * 0.2;
                const radius = (w < 600 ? 80 : 120) + (Math.sin(time * 10) * 5); 

                const ringRes = 60;
                const ringPoints = [];
                for (let i = 0; i <= ringRes; i++) {
                    const theta = (i / ringRes) * Math.PI * 2;
                    let px = Math.sin(theta) * radius * 1.3;
                    let py = 0;
                    let pz = Math.cos(theta) * radius * 1.3;
                    let x1 = px * Math.cos(rotY) - pz * Math.sin(rotY);
                    let z1 = px * Math.sin(rotY) + pz * Math.cos(rotY);
                    let y1 = py;
                    let y2 = y1 * Math.cos(rotX) - z1 * Math.sin(rotX);
                    let z2 = y1 * Math.sin(rotX) + z1 * Math.cos(rotX);
                    let x2 = x1;
                    let x3 = x2 * Math.cos(rotZ) - y2 * Math.sin(rotZ);
                    let y3 = x2 * Math.sin(rotZ) + y2 * Math.cos(rotZ);
                    let z3 = z2;
                    const scale = fov / (fov + z3 + 400);
                    ringPoints.push({ x: x3 * scale, y: y3 * scale, z: z3 });
                }

                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.strokeStyle = sunHitTime < 200 ? "#FFFFFF" : C.red;
                ctx.shadowColor = C.red;
                ctx.shadowBlur = 10;
                for (let i = 0; i < ringRes; i++) {
                    const p1 = ringPoints[i];
                    const p2 = ringPoints[i+1];
                    if (p1.z > 0 && p2.z > 0) {
                         ctx.moveTo(p1.x, p1.y);
                         ctx.lineTo(p2.x, p2.y);
                    }
                }
                ctx.stroke();

                const centerScale = fov / (fov + 400); 
                ctx.beginPath();
                ctx.fillStyle = "#000000"; 
                ctx.shadowBlur = 0; 
                ctx.arc(0, 0, radius * centerScale, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = sunHitTime < 200 ? "#FFFFFF" : C.neon;
                ctx.shadowBlur = sunHitTime < 200 ? 20 : 5; 
                ctx.shadowColor = C.neon;
                globeRef.current.forEach((p) => {
                    let px = p.x; let py = p.y; let pz = p.z;
                    let x1 = px * Math.cos(rotY) - pz * Math.sin(rotY);
                    let z1 = px * Math.sin(rotY) + pz * Math.cos(rotY);
                    let y1 = py;
                    let y2 = y1 * Math.cos(rotX) - z1 * Math.sin(rotX);
                    let z2 = y1 * Math.sin(rotX) + z1 * Math.cos(rotX);
                    let x2 = x1;
                    let x3 = x2 * Math.cos(rotZ) - y2 * Math.sin(rotZ);
                    let y3 = x2 * Math.sin(rotZ) + y2 * Math.cos(rotZ);
                    let z3 = z2;
                    const scale = fov / (fov + z3 + 400); 
                    const sx = x3 * radius * scale;
                    const sy = y3 * radius * scale;
                    if (z3 < 0) ctx.fillRect(sx - 1.5, sy - 1.5, 3, 3);
                });

                ctx.beginPath();
                ctx.strokeStyle = sunHitTime < 200 ? "#FFFFFF" : C.red;
                ctx.shadowColor = C.red;
                ctx.shadowBlur = 10;
                for (let i = 0; i < ringRes; i++) {
                    const p1 = ringPoints[i];
                    const p2 = ringPoints[i+1];
                    if (p1.z <= 0 || p2.z <= 0) {
                         ctx.moveTo(p1.x, p1.y);
                         ctx.lineTo(p2.x, p2.y);
                    }
                }
                ctx.stroke();
                ctx.restore();

                // 6. WORDS
                wordsRef.current = wordsRef.current.filter(word => word.life > 0);
                wordsRef.current.forEach(word => {
                    word.x += word.vx * speed;
                    word.y += word.vy * speed;
                    word.life -= 0.01;
                    const screenX = (word.x / 100) * w;
                    const screenY = (word.y / 100) * h;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, word.life);
                    ctx.font = `bold 24px 'Share Tech Mono'`;
                    ctx.textAlign = "center";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = word.color || C.neon;
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillText(word.text, screenX, screenY);
                    ctx.restore();
                });

                // 7. CLICK RIPPLES
                clicksRef.current = clicksRef.current.filter(c => c.life > 0);
                clicksRef.current.forEach(c => {
                    c.life -= 0.05;
                    const screenX = (c.x / 100) * w;
                    const screenY = (c.y / 100) * h;
                    const size = (1.0 - c.life) * 100;
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(255, 255, 255, ${c.life})`;
                    ctx.lineWidth = 2;
                    ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
                    ctx.stroke();
                });

                // 8. EQUALIZER
                const bars = 20;
                const barW = w / bars;
                ctx.fillStyle = C.cyan;
                ctx.shadowColor = C.cyan;
                ctx.shadowBlur = 5;
                for(let i=0; i<bars; i++) {
                    const noise = Math.sin(i * 0.5 + time * 10) * Math.cos(time * speed);
                    const hBar = Math.abs(noise) * (h * 0.2) * mouse.current.y;
                    ctx.fillRect(i * barW, h - hBar, barW - 4, hBar);
                    ctx.fillStyle = C.bg;
                    ctx.fillRect(i * barW, h - hBar, barW - 4, 4);
                    ctx.fillStyle = C.cyan;
                }

                // 9. DRAW STYLIZED TITLE (Manual Layout for Canvas)
                ctx.shadowBlur = 0;
                ctx.fillStyle = C.neon;
                ctx.textAlign = "left";
                
                const baseX = 20;
                let baseY = 40;
                
                const bigFont = "bold 48px 'Share Tech Mono'";
                const smallFont = "bold 24px 'Share Tech Mono'";
                
                // Line 1: THE (small/underlined) WAR (big)
                ctx.font = smallFont;
                ctx.fillText("THE", baseX, baseY);
                const wThe = ctx.measureText("THE").width;
                ctx.fillRect(baseX, baseY + 4, wThe, 2); // Underline
                
                ctx.font = bigFont;
                ctx.fillText("WAR", baseX + wThe + 10, baseY);
                
                // Line 2: OF (small/underlined) WORDS (big)
                baseY += 40; // New Line
                ctx.font = smallFont;
                ctx.fillText("OF", baseX, baseY);
                const wOf = ctx.measureText("OF").width;
                ctx.fillRect(baseX, baseY + 4, wOf, 2); // Underline
                
                ctx.font = bigFont;
                ctx.fillText("WORDS", baseX + wOf + 10, baseY);

                // CPU
                ctx.font = "16px 'Share Tech Mono'";
                ctx.fillText(`CPU: ${(speed * 20).toFixed(0)}%`, 20, baseY + 30); 
                
                // SYSTEM LOG
                ctx.fillStyle = systemLog.includes("MISS") ? C.red : (systemLog.includes("ORB") ? C.cyan : C.neon);
                ctx.fillText(`LOG > ${systemLog}`, 20, h - 100);

                ctx.textAlign = "right";
                ctx.fillStyle = C.red;
                ctx.fillText("ONLINE", w - 20, h - 20);

                requestRef.current = requestAnimationFrame(animate);
            };

            if (!active) {
                return (
                    <div className="absolute inset-0 flex flex-col items-center justify-center cursor-pointer bg-black" onClick={start}>
                        <div className="border border-[#39FF14] p-8 m-4 shadow-[0_0_20px_#39FF14] text-center max-w-sm">
                            <h1 className="text-[#39FF14] glow-text mb-4 font-bold tracking-tighter flex flex-col items-center leading-none">
                                <div className="flex items-baseline gap-2">
                                    <span className="text-2xl md:text-3xl underline decoration-2 underline-offset-4">THE</span>
                                    <span className="text-5xl md:text-7xl">WAR</span>
                                </div>
                                <div className="flex items-baseline gap-2">
                                    <span className="text-2xl md:text-3xl underline decoration-2 underline-offset-4">OF</span>
                                    <span className="text-5xl md:text-7xl">WORDS</span>
                                </div>
                            </h1>
                            <p className="text-[#39FF14] animate-pulse text-sm md:text-base">[ TAP TO INITIATE ]</p>
                            <p className="text-[#39FF14] text-xs mt-4 opacity-70">USE HEADPHONES</p>
                        </div>
                    </div>
                );
            }

            return (
                <div 
                    className="w-full h-full relative" 
                    onMouseMove={handleMove}
                    onMouseDown={handleMouseDown}
                    onTouchMove={handleTouch}
                    onTouchStart={handleTouch}
                >
                    <div className="scanlines"></div>
                    <canvas ref={canvasRef} />
                    
                    {/* HUD HEADER */}
                    <div className="hud-header">
                        <div className="flex gap-4 hud-interactive">
                             <button 
                                onClick={toggleMute}
                                className={`icon-btn ${isMuted ? 'opacity-50' : ''}`}
                             >
                                {isMuted ? <IconVolumeX /> : <IconVolume2 />}
                             </button>
                             {!isIOS && (
                                 <button onClick={toggleFullScreen} className="icon-btn">
                                    {isFullscreen ? <IconMinimize /> : <IconMaximize />}
                                 </button>
                             )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
