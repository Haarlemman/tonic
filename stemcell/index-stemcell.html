                                        className={`text-sm font-medium transition-colors duration-200 ${
                                            activeSection === item.id 
                                                ? 'text-emerald-600 dark:text-emerald-400 border-b-2 border-emerald-600 dark:border-emerald-400' 
                                                : 'text-slate-600 dark:text-slate-300 hover:text-emerald-600 dark:hover:text-emerald-400'
                                        }`}
                                    >
                                        {item.label}
                                    </button>
                                ))}
                                
                                <div className="flex items-center gap-2 border-l border-slate-200 dark:border-slate-700 pl-4 ml-2">
                                    {/* Language Toggle */}
                                    <div className="flex items-center text-sm font-medium bg-slate-100 dark:bg-slate-800 rounded-lg px-2 py-1">
                                        <button
                                            type="button"
                                            onClick={() => setLang('en')}
                                            className={`px-3 py-1 rounded-md transition-all duration-200 cursor-pointer ${
                                                lang === 'en' 
                                                ? 'text-emerald-700 dark:text-emerald-300 font-bold bg-white dark:bg-slate-700 shadow-sm ring-1 ring-emerald-500/20' 
                                                : 'text-slate-500 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-300'
                                            }`}
                                        >
                                            EN
                                        </button>
                                        <span className="mx-1 text-slate-300 dark:text-slate-600">/</span>
                                        <button
                                            type="button"
                                            onClick={() => setLang('nl')}
                                            className={`px-3 py-1 rounded-md transition-all duration-200 cursor-pointer ${
                                                lang === 'nl' 
                                                ? 'text-emerald-700 dark:text-emerald-300 font-bold bg-white dark:bg-slate-700 shadow-sm ring-1 ring-emerald-500/20' 
                                                : 'text-slate-500 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-300'
                                            }`}
                                        >
                                            NL
                                        </button>
                                    </div>

                                    {/* Dark Mode Toggle */}
                                    <button 
                                        onClick={() => setIsDark(!isDark)}
                                        className="p-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors"
                                        aria-label="Toggle Dark Mode"
                                    >
                                        {isDark ? <Sun className="h-5 w-5" /> : <Moon className="h-5 w-5" />}
                                    </button>
                                </div>
                            </div>

                            {/* Mobile Menu Button */}
                            <div className="md:hidden flex items-center gap-3">
                                <button 
                                    onClick={() => setIsDark(!isDark)}
                                    className="p-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"
                                >
                                    {isDark ? <Sun className="h-5 w-5" /> : <Moon className="h-5 w-5" />}
                                </button>
                                <div className="flex items-center text-xs font-medium bg-slate-100 dark:bg-slate-800 rounded px-2 py-1">
                                    <button 
                                        type="button"
                                        onClick={() => setLang('en')}
                                        className={`px-1.5 py-0.5 rounded cursor-pointer ${
                                            lang === 'en' 
                                            ? 'text-emerald-700 dark:text-emerald-400 font-bold bg-white dark:bg-slate-700 shadow-sm' 
                                            : 'text-slate-500 dark:text-slate-400'
                                        }`}
                                    >EN</button>
                                    <span className="mx-1 text-slate-300 dark:text-slate-600">/</span>
                                    <button 
                                        type="button"
                                        onClick={() => setLang('nl')}
                                        className={`px-1.5 py-0.5 rounded cursor-pointer ${
                                            lang === 'nl' 
                                            ? 'text-emerald-700 dark:text-emerald-400 font-bold bg-white dark:bg-slate-700 shadow-sm' 
                                            : 'text-slate-500 dark:text-slate-400'
                                        }`}
                                    >NL</button>
                                </div>
                                <button 
                                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                    className="p-2 rounded-md text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white focus:outline-none"
                                >
                                    {mobileMenuOpen ? <X className="h-6 w-6" /> : <Menu className="h-6 w-6" />}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Mobile Nav Menu */}
                    {mobileMenuOpen && (
                        <div className="md:hidden bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
                            <div className="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                                {navItems.map((item) => (
                                    <button
                                        key={item.id}
                                        onClick={() => {
                                            document.getElementById(item.id)?.scrollIntoView({ behavior: 'smooth' });
                                            setActiveSection(item.id);
                                            setMobileMenuOpen(false);
                                        }}
                                        className="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-slate-700 dark:text-slate-300 hover:text-emerald-600 dark:hover:text-emerald-400 hover:bg-slate-50 dark:hover:bg-slate-800"
                                    >
                                        {item.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                </nav>
            );
        };

        const Hero = ({ t }) => (
            <div className="relative bg-slate-900 dark:bg-slate-950 overflow-hidden transition-colors duration-300 z-0">
                {/* Abstract Visuals Background */}
                <div className="absolute inset-0 overflow-hidden">
                    {/* Dark base */}
                    <div className="absolute inset-0 bg-slate-900"></div>
                    
                    {/* Colorful Organic Orbs representing cells/energy */}
                    <div className="absolute top-0 left-1/4 w-96 h-96 bg-purple-500 rounded-full mix-blend-screen filter blur-[64px] opacity-70 animate-blob"></div>
                    <div className="absolute top-0 right-1/4 w-96 h-96 bg-emerald-500 rounded-full mix-blend-screen filter blur-[64px] opacity-70 animate-blob animation-delay-2000"></div>
                    <div className="absolute -bottom-8 left-1/3 w-96 h-96 bg-blue-500 rounded-full mix-blend-screen filter blur-[64px] opacity-70 animate-blob animation-delay-4000"></div>

                    {/* SVG Cell Pattern Overlay */}
                    <svg className="absolute inset-0 w-full h-full opacity-20" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <pattern id="cell-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                                <circle cx="2" cy="2" r="1.5" className="text-white" fill="currentColor" />
                            </pattern>
                        </defs>
                        <rect width="100%" height="100%" fill="url(#cell-pattern)" />
                    </svg>

                    {/* Gradient Overlay for integration */}
                    <div className="absolute inset-0 bg-gradient-to-b from-transparent via-slate-900/40 to-slate-900/90"></div>
                </div>
                
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24 relative z-10">
                    <div className="text-center">
                        <h1 className="text-4xl sm:text-5xl md:text-6xl font-extrabold text-white tracking-tight mb-6 drop-shadow-lg">
                            {t.title1} <br className="hidden sm:block" />
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">{t.title2}</span>
                        </h1>
                        <p className="mt-4 max-w-2xl mx-auto text-xl text-slate-300 drop-shadow-md">
                            {t.subtitle}
                        </p>
                        <div className="mt-8 flex justify-center gap-4">
                            <button 
                                onClick={() => document.getElementById('basics').scrollIntoView({ behavior: 'smooth' })}
                                className="px-8 py-3 border border-transparent text-base font-medium rounded-md text-slate-900 bg-emerald-400 hover:bg-emerald-500 md:py-4 md:text-lg md:px-10 transition-all shadow-lg hover:shadow-emerald-500/20"
                            >
                                {t.button}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );

        const Section = ({ id, title, children, className = "" }) => (
            <section id={id} className={`py-16 transition-colors duration-300 ${className}`}>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    {title && (
                        <div className="mb-12 border-l-4 border-emerald-500 pl-4">
                            <h2 className="text-3xl font-bold text-slate-900 dark:text-white">{title}</h2>
                        </div>
                    )}
                    {children}
                </div>
            </section>
        );

        const Card = ({ icon: Icon, title, content }) => (
            <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 hover:shadow-md transition-all duration-300">
                <div className="flex items-center mb-4">
                    <div className="p-2 bg-emerald-100 dark:bg-emerald-900/30 rounded-lg">
                        <Icon className="h-6 w-6 text-emerald-600 dark:text-emerald-400" />
                    </div>
                    <h3 className="ml-3 text-xl font-semibold text-slate-800 dark:text-white">{title}</h3>
                </div>
                <p className="text-slate-600 dark:text-slate-300 leading-relaxed">{content}</p>
            </div>
        );

        const AlertBox = ({ title, children, type = "warning" }) => {
            const styles = type === "danger" 
                ? "bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800 text-red-800 dark:text-red-200"
                : "bg-amber-50 dark:bg-amber-900/20 border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-200";
            const Icon = type === "danger" ? ShieldAlert : AlertTriangle;
            return (
                <div className={`border-l-4 p-6 rounded-r-lg ${styles} mb-8 transition-colors duration-300`}>
                    <div className="flex items-start">
                        <div className="flex-shrink-0">
                            <Icon className="h-6 w-6" />
                        </div>
                        <div className="ml-4">
                            <h3 className="text-lg font-medium mb-2">{title}</h3>
                            <div className="text-sm leading-relaxed opacity-90">
                                {children}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TrialTable = ({ t }) => (
            <div className="overflow-x-auto rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm">
                <table className="min-w-full divide-y divide-slate-200 dark:divide-slate-700">
                    <thead className="bg-slate-50 dark:bg-slate-800">
                        <tr>
                            <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">{t.tableHeaders[0]}</th>
                            <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">{t.tableHeaders[1]}</th>
                            <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">{t.tableHeaders[2]}</th>
                        </tr>
                    </thead>
                    <tbody className="bg-white dark:bg-slate-900 divide-y divide-slate-200 dark:divide-slate-700">
                        {t.rows.map((row, idx) => (
                            <tr key={idx} className={idx % 2 === 0 ? 'bg-white dark:bg-slate-900' : 'bg-slate-50 dark:bg-slate-800/50'}>
                                <td className="px-6 py-4 whitespace-normal">
                                    <div className="text-sm font-medium text-slate-900 dark:text-white">
                                        {row.link ? (
                                            <a 
                                                href={row.link} 
                                                target="_blank" 
                                                rel="noopener noreferrer" 
                                                className="hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors flex items-center group"
                                            >
                                                {row.sponsor}
                                                <ExternalLink className="h-3 w-3 ml-1 opacity-50 group-hover:opacity-100" />
                                            </a>
                                        ) : (
                                            row.sponsor
                                        )}
                                    </div>
                                    <div className="text-sm text-slate-500 dark:text-slate-400">{row.details}</div>
                                </td>
                                <td className="px-6 py-4 whitespace-normal text-sm text-slate-600 dark:text-slate-300">{row.cells}</td>
                                <td className="px-6 py-4 whitespace-normal text-sm text-slate-600 dark:text-slate-300">
                                    <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-300">
                                        {row.status}
                                    </span>
                                </td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        );

        const App = () => {
            const [activeSection, setActiveSection] = useState('basics');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [lang, setLang] = useState('en');
            const [isDark, setIsDark] = useState(false);

            const t = content[lang];

            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDark]);

            useEffect(() => {
                const handleScroll = () => {
                    // Reset if at top
                    if (window.scrollY < 50) {
                        setActiveSection('');
                        return;
                    }

                    const sections = ['basics', 'updates', 'parkinsons', 'tourism', 'trials'];
                    const scrollPosition = window.scrollY + 100;
                    for (const section of sections) {
                        const element = document.getElementById(section);
                        if (element && element.offsetTop <= scrollPosition && (element.offsetTop + element.offsetHeight) > scrollPosition) {
                            setActiveSection(section);
                        }
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen bg-slate-50 dark:bg-slate-900 font-sans text-slate-900 dark:text-slate-100 transition-colors duration-300">
                    <Navigation 
                        activeSection={activeSection} 
                        setActiveSection={setActiveSection}
                        mobileMenuOpen={mobileMenuOpen}
                        setMobileMenuOpen={setMobileMenuOpen}
                        lang={lang}
                        setLang={setLang}
                        isDark={isDark}
                        setIsDark={setIsDark}
                        t={t.nav}
                    />
                    
                    <Hero t={t.hero} />

                    <Section id="basics" title={t.basics.title}>
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <Card icon={Activity} title={t.basics.card1.title} content={t.basics.card1.text} />
                            <Card icon={Dna} title={t.basics.card2.title} content={t.basics.card2.text} />
                            <Card icon={Microscope} title={t.basics.card3.title} content={t.basics.card3.text} />
                        </div>
                        {/* New Lab Image Insertion */}
                        <div className="mt-12">
                            <div className="bg-white dark:bg-slate-800 p-2 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                                <img 
                                    src="https://davidenker.com/stemcell/lab.jpg" 
                                    alt="Stem Cell Laboratory Infographic" 
                                    className="w-full h-auto rounded-lg"
                                />
                            </div>
                        </div>
                    </Section>

                    <Section id="updates" title={t.updates.title} className="bg-white dark:bg-slate-800">
                        <div className="space-y-8">
                            <div className="flex flex-col md:flex-row gap-6">
                                <div className="flex-1">
                                    <h3 className="text-xl font-bold text-slate-800 dark:text-white mb-3 flex items-center">
                                        <span className="bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-300 px-2 py-1 rounded text-sm mr-3">{t.updates.mscLabel}</span>
                                        {t.updates.mscTitle}
                                    </h3>
                                    <p className="text-slate-600 dark:text-slate-300">{t.updates.mscText}</p>
                                </div>
                                <div className="flex-1">
                                    <h3 className="text-xl font-bold text-slate-800 dark:text-white mb-3 flex items-center">
                                        <span className="bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 px-2 py-1 rounded text-sm mr-3">{t.updates.ipscLabel}</span>
                                        {t.updates.ipscTitle}
                                    </h3>
                                    <p className="text-slate-600 dark:text-slate-300">{t.updates.ipscText}</p>
                                </div>
                            </div>
                            <div className="border-t border-slate-100 dark:border-slate-700 pt-6">
                                <div className="bg-slate-50 dark:bg-slate-900 p-6 rounded-lg">
                                    <h4 className="font-semibold text-slate-900 dark:text-white mb-2">{t.updates.govTitle}</h4>
                                    <p className="text-slate-700 dark:text-slate-300 text-sm">{t.updates.govText}</p>
                                </div>
                            </div>
                        </div>
                    </Section>

                    <Section id="parkinsons" title={t.parkinsons.title}>
                        <div className="bg-white dark:bg-slate-800 rounded-2xl p-8 shadow-sm border border-slate-200 dark:border-slate-700 transition-colors duration-300">
                            <div className="flex flex-col lg:flex-row items-center gap-10">
                                <div className="flex-1">
                                    <Brain className="w-16 h-16 text-emerald-600 dark:text-emerald-500 mb-6" />
                                    <h3 className="text-2xl font-bold text-slate-900 dark:text-white mb-4">{t.parkinsons.goalTitle}</h3>
                                    <p className="text-slate-600 dark:text-slate-300 mb-4 leading-relaxed">{t.parkinsons.goalText}</p>
                                    <div className="space-y-3">
                                        {t.parkinsons.checks.map((check, i) => (
                                            <div key={i} className="flex items-center text-slate-700 dark:text-slate-300">
                                                <CheckCircle2 className="w-5 h-5 text-emerald-500 dark:text-emerald-400 mr-3" />
                                                <span>{check}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex-1 bg-slate-50 dark:bg-slate-900 p-6 rounded-xl border border-slate-100 dark:border-slate-700">
                                    <h4 className="font-bold text-slate-800 dark:text-white mb-4">{t.parkinsons.hurdlesTitle}</h4>
                                    <ul className="space-y-4">
                                        {t.parkinsons.hurdles.map((item, i) => (
                                            <li key={i} className="flex items-start">
                                                <span className="flex-shrink-0 h-6 w-6 flex items-center justify-center rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 text-xs font-bold mt-0.5">{i + 1}</span>
                                                <span className="ml-3 text-slate-600 dark:text-slate-300 text-sm"><strong>{item.label}:</strong> {item.text}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </Section>

                    <Section id="tourism" title={t.tourism.title} className="bg-red-50/50 dark:bg-red-900/10">
                        <div className="max-w-4xl mx-auto">
                            <AlertBox title={t.tourism.alertTitle} type="danger">
                                <p className="mb-4">{t.tourism.alertText1}</p>
                                <p className="font-semibold">{t.tourism.trapLabel}</p>
                                <p dangerouslySetInnerHTML={{ __html: t.tourism.trapText.replace('**', '<strong>').replace('**', '</strong>') }} />
                            </AlertBox>

                            <div className="grid md:grid-cols-2 gap-6 mt-8">
                                <div className="bg-white dark:bg-slate-800 p-6 rounded-lg shadow-sm border border-red-100 dark:border-red-900/30">
                                    <h4 className="text-red-700 dark:text-red-400 font-bold flex items-center mb-4">
                                        <XCircle className="w-5 h-5 mr-2" />
                                        {t.tourism.touristTitle}
                                    </h4>
                                    <ul className="space-y-3 text-sm text-slate-600 dark:text-slate-300">
                                        {t.tourism.touristList.map((item, i) => (
                                            <li key={i} className="flex items-start">
                                                <span className="mr-2">•</span>
                                                <span dangerouslySetInnerHTML={{__html: item}} />
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                <div className="bg-white dark:bg-slate-800 p-6 rounded-lg shadow-sm border border-emerald-100 dark:border-emerald-900/30">
                                    <h4 className="text-emerald-700 dark:text-emerald-400 font-bold flex items-center mb-4">
                                        <CheckCircle2 className="w-5 h-5 mr-2" />
                                        {t.tourism.scienceTitle}
                                    </h4>
                                    <ul className="space-y-3 text-sm text-slate-600 dark:text-slate-300">
                                        {t.tourism.scienceList.map((item, i) => (
                                            <li key={i} className="flex items-start">
                                                <span className="mr-2">•</span>
                                                <span dangerouslySetInnerHTML={{__html: item}} />
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </Section>

                    <Section id="trials" title={t.trials.title}>
                        <p className="mb-6 text-slate-600 dark:text-slate-300 max-w-3xl">{t.trials.desc}</p>
                        <TrialTable t={t.trials} />
                        
                        <div className="mt-12 bg-emerald-50 dark:bg-emerald-900/10 rounded-xl p-8 border border-emerald-100 dark:border-emerald-900/30 transition-colors duration-300">
                            <h3 className="text-xl font-bold text-slate-800 dark:text-white mb-4">{t.trials.checklistTitle}</h3>
                            <p className="text-slate-600 dark:text-slate-300 mb-6">{t.trials.checklistDesc}</p>
                            <div className="grid md:grid-cols-2 gap-4">
                                {t.trials.checklistItems.map((item, idx) => (
                                    <div key={idx} className="flex items-center bg-white dark:bg-slate-800 p-3 rounded-lg shadow-sm">
                                        <div className="h-6 w-6 rounded-full bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-xs font-bold mr-3">?</div>
                                        <span 
                                            className="text-sm font-medium text-slate-700 dark:text-slate-300"
                                            dangerouslySetInnerHTML={{__html: item}}
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </Section>

                    <footer className="bg-slate-900 dark:bg-slate-950 text-slate-400 py-12 transition-colors duration-300">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                            <Dna className="h-10 w-10 mx-auto text-emerald-500 mb-4" />
                            <p className="text-lg font-medium text-slate-200 mb-2">{t.footer.tagline}</p>
                            <p className="text-sm max-w-md mx-auto">{t.footer.disclaimer}</p>
                            <div className="mt-8 pt-8 border-t border-slate-800 dark:border-slate-900 text-xs" dangerouslySetInnerHTML={{__html: t.footer.copyright}}></div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
