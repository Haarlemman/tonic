<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONIC — For the Bones</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #fefce8; /* Desert Base */
            font-family: 'Courier New', Courier, monospace;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* Intro Overlay */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(254, 252, 232, 0.85); /* Sun-bleached tint */
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1a1a1a;
            text-align: center;
            transition: opacity 1.5s ease, visibility 1.5s;
        }

        #intro-text {
            font-size: 1.2rem;
            font-weight: 700;
            max-width: 600px;
            min-height: 100px;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 0 20px;
            letter-spacing: 2px;
            transition: opacity 0.8s ease;
            text-transform: uppercase;
        }

        .action-btn {
            background: #1a1a1a;
            border: 1px solid #000;
            color: #fff;
            padding: 15px 40px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            min-width: 260px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .action-btn:hover {
            background: #ef4444; /* Bliss Red on hover */
            color: white;
            transform: scale(1.05);
        }

        /* Faculty/Artifact Data Screen */
        #faculty-screen {
            position: absolute;
            width: 280px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #1a1a1a;
            padding: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            display: none;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 80;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            transform: translate(-50%, -120%);
        }

        #faculty-screen.active {
            display: flex;
            opacity: 1;
        }

        .neon-text {
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.2;
            min-height: 3em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .text-bliss { color: #ef4444; }
        .text-knowledge { color: #3b82f6; }
        .text-wisdom { color: #eab308; }

        .screen-sub {
            color: #999;
            font-size: 0.55rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        /* HUD Layer */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
            z-index: 50;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .brand-box {
            background: #1a1a1a;
            color: white;
            padding: 15px 25px;
            display: inline-block;
            pointer-events: auto;
            border-bottom: 5px solid #ef4444; /* Bliss Red Accent */
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1;
        }

        .sub-brand {
            font-size: 0.6rem;
            margin-top: 6px;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .status-box {
            pointer-events: auto;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .hud-btn {
            background: white;
            color: black;
            border: 1px solid black;
            padding: 10px 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.65rem;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .hud-btn:hover {
            background: black;
            color: white;
        }

        #audio-status {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 0, 0, 0.4);
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 40;
            opacity: 0;
            transition: opacity 2s;
        }
    </style>
</head>

<body>

    <audio id="bg-music" loop crossorigin="anonymous">
        <source src="https://assets.codepen.io/21542/howling-wind-ambient.mp3" type="audio/mpeg">
    </audio>

    <div id="intro-overlay">
        <div id="intro-text"></div>
        <div class="intro-btns">
            <button id="skip-btn" class="action-btn">The Dosage</button>
        </div>
    </div>

    <div id="faculty-screen">
        <div id="screen-content" class="neon-text"></div>
        <div class="screen-sub">DOSAGE DATA STREAM</div>
    </div>

    <nav id="hud-layer">
        <div class="brand-box">
            <h1>TONIC</h1>
            <div class="sub-brand">FOR THE BONES</div>
        </div>

        <div class="status-box">
            <button class="hud-btn" id="music-toggle" onclick="toggleMusic()">AUDIO: OFF</button>
            <button class="hud-btn" onclick="focusRandom()">RANDOM DOSE</button>
            <button class="hud-btn" style="background:#ef4444; color:white; border-color:#ef4444;">LOGIN</button>
        </div>
    </nav>

    <div id="audio-status">KINETIC PULSE ANALYSIS: ACTIVE</div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, raycaster, mouse, controls;
        let artifactGroups = [];
        let debrisObjects = [];
        let blissObj, knowledgeObj, wisdomObj;

        let audioCtx, analyser, dataArray;
        let audioInitialized = false;
        let beatLevel = 0;

        let introActive = true;
        let skipRequested = false;
        let cinematicTarget = null;
        let lastZoomTime = 0;
        let lastQuoteTime = 0;
        const ZOOM_INTERVAL = 12000;
        const QUOTE_INTERVAL = 3000;

        const introTextEl = document.getElementById('intro-text');
        const skipBtn = document.getElementById('skip-btn');
        const hudLayer = document.getElementById('hud-layer');
        const bgMusic = document.getElementById('bg-music');
        const facultyScreen = document.getElementById('faculty-screen');
        const screenContent = document.getElementById('screen-content');

        const dosageData = {
            bliss: {
                quotes: ["BEAUTY IS RESISTANCE", "THE BODY REMEMBERS", "BLOOD ON THE CANVAS", "AESTHETICS OF PAIN", "PHYSICAL BLISS"],
                class: "text-bliss",
                quoteIndex: 0
            },
            knowledge: {
                quotes: ["THE ATOM OF TRUTH", "LOGIC IS A LABYRINTH", "DATA WITHOUT SPIRIT IS ZERO", "MEASURE THE UNKNOWN", "THE MIND IS A PARADOX"],
                class: "text-knowledge",
                quoteIndex: 0
            },
            wisdom: {
                quotes: ["SPIRE OF THE SOUL", "SILENCE IS THE TONIC", "LETTING GO IS THE KEY", "BEYOND THE BONE", "WISDOM THROUGH VOID"],
                class: "text-wisdom",
                quoteIndex: 0
            }
        };

        const introQuotes = [
            "This is your Tonic.",
            "For the bones that carry the weight.",
            "Three elements in the dry yellow waste.",
            "Bliss. Knowledge. Wisdom."
        ];

        window.onload = function () {
            init();
            animate();
            runIntroSequence();
            skipBtn.onclick = (e) => { e.stopPropagation(); startExperience(); };
        };

        function toggleMusic() {
            if (!audioInitialized) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (bgMusic.paused) {
                bgMusic.play();
                document.getElementById('music-toggle').innerText = "Audio: On";
            } else {
                bgMusic.pause();
                document.getElementById('music-toggle').innerText = "Audio: Off";
            }
        }

        async function runIntroSequence() {
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            for (let quote of introQuotes) {
                if (skipRequested) break;
                introTextEl.style.opacity = 0;
                await new Promise(r => setTimeout(r, 800));
                if (skipRequested) break;
                introTextEl.innerText = quote;
                introTextEl.style.opacity = 1;
                await new Promise(r => setTimeout(r, 3000));
            }
        }

        function initAudio() {
            if (audioInitialized) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(bgMusic);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioInitialized = true;
                document.getElementById('audio-status').style.opacity = 1;
            } catch (e) { console.log("Audio Error:", e); }
        }

        function startExperience() {
            skipRequested = true;
            introActive = false;
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            bgMusic.volume = 0.6;
            bgMusic.play().catch(() => { });
            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                hudLayer.style.opacity = 1;
                lastZoomTime = Date.now();
            }, 1000);
        }

        function focusRandom() {
            const types = ['bliss', 'knowledge', 'wisdom'];
            focusArtifact(types[Math.floor(Math.random()*3)]);
        }

        function focusArtifact(type) {
            const b = artifactGroups.find(b => b.userData.type === type);
            if (b) {
                cinematicTarget = b;
                lastZoomTime = Date.now();
                lastQuoteTime = Date.now();
                updateArtifactScreen(type);
                facultyScreen.classList.add('active');
            }
        }

        function updateArtifactScreen(type) {
            const data = dosageData[type];
            if (!data) return;
            screenContent.className = 'neon-text ' + data.class;
            screenContent.innerText = data.quotes[data.quoteIndex];
            data.quoteIndex = (data.quoteIndex + 1) % data.quotes.length;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfefce8); // Pale Desert Yellow
            scene.fog = new THREE.Fog(0xfefce8, 20, 110);
            
            const aspect = window.innerWidth / window.innerHeight;
            const d = 18;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(50, 40, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(20, 50, 10);
            scene.add(sun);

            createDesert();
            window.addEventListener('resize', onWindowResize, false);
        }

        function createDesert() {
            // The Ground - Cracked Earth
            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xfdf6e3, roughness: 1 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Debris (Small rocks/stones)
            const rockMat = new THREE.MeshStandardMaterial({ color: 0xd4d4d8 });
            for(let i=0; i<300; i++) {
                const s = 0.1 + Math.random() * 0.4;
                const rock = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), rockMat);
                rock.position.set(
                    (Math.random() - 0.5) * 60,
                    s/2,
                    (Math.random() - 0.5) * 60
                );
                rock.rotation.y = Math.random() * Math.PI;
                scene.add(rock);
                debrisObjects.push(rock);
            }

            // 1. BLISS (Body/Red) - A pulsing crystalline cluster
            blissObj = new THREE.Group();
            const blissMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x7f1d1d, emissiveIntensity: 0.5 });
            for(let i=0; i<8; i++) {
                const h = 2 + Math.random() * 4;
                const crystal = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.5, h, 4), blissMat);
                crystal.position.y = h/2;
                crystal.rotation.x = (Math.random()-0.5) * 0.5;
                crystal.rotation.z = (Math.random()-0.5) * 0.5;
                blissObj.add(crystal);
            }
            blissObj.position.set(-15, 0, -10);
            blissObj.userData = { type: 'bliss' };
            scene.add(blissObj);
            artifactGroups.push(blissObj);

            // 2. KNOWLEDGE (Mind/Blue) - Atomic Orbital Sphere
            knowledgeObj = new THREE.Group();
            const blueMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
            const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 1), blueMat);
            core.position.y = 4;
            knowledgeObj.add(core);
            
            const ringGeo = new THREE.TorusGeometry(3.5, 0.04, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.6 });
            const ring1 = new THREE.Mesh(ringGeo, ringMat);
            ring1.position.y = 4;
            knowledgeObj.add(ring1);
            const ring2 = new THREE.Mesh(ringGeo, ringMat);
            ring2.position.y = 4;
            ring2.rotation.x = Math.PI/2;
            knowledgeObj.add(ring2);
            
            knowledgeObj.position.set(15, 0, -5);
            knowledgeObj.userData = { type: 'knowledge' };
            scene.add(knowledgeObj);
            artifactGroups.push(knowledgeObj);

            // 3. WISDOM (Spirit/Yellow) - Infinite Spire of Light
            wisdomObj = new THREE.Group();
            const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.8, 6, 3), new THREE.MeshStandardMaterial({color: 0xeab308}));
            tower.position.y = 3;
            wisdomObj.add(tower);
            
            const beamGeo = new THREE.CylinderGeometry(0.05, 0.05, 100, 32);
            const beamMat = new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.8 });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.y = 53;
            wisdomObj.add(beam);

            wisdomObj.position.set(0, 0, 15);
            wisdomObj.userData = { type: 'wisdom' };
            scene.add(wisdomObj);
            artifactGroups.push(wisdomObj);
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 18;
            camera.left = -d * aspect; camera.right = d * aspect;
            camera.top = d; camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const now = Date.now();

            if (audioInitialized && !bgMusic.paused) {
                analyser.getByteFrequencyData(dataArray);
                let bass = 0; for (let i = 0; i < 10; i++) bass += dataArray[i];
                beatLevel = (bass / 10 / 255);
                
                // Bliss throbs with bass
                const bScale = 1 + beatLevel * 0.5;
                blissObj.scale.lerp(new THREE.Vector3(bScale, bScale, bScale), 0.1);
                
                // Knowledge rings spin with mid-highs
                const mid = dataArray[40] / 255;
                knowledgeObj.children[1].rotation.z += 0.05 + mid * 0.2;
                knowledgeObj.children[2].rotation.y += 0.03 + mid * 0.1;
                
                // Wisdom beam flickers
                wisdomObj.children[1].material.opacity = 0.4 + (dataArray[10] / 255) * 0.6;
            }

            // Cinematic Logic
            if (!introActive && now - lastZoomTime > ZOOM_INTERVAL) {
                if (cinematicTarget) { cinematicTarget = null; facultyScreen.classList.remove('active'); }
                else { focusRandom(); }
                lastZoomTime = now;
            }

            if (cinematicTarget) {
                controls.target.lerp(new THREE.Vector3(cinematicTarget.position.x, 3, cinematicTarget.position.z), 0.08);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 2.5, 0.04);
                
                if (now - lastQuoteTime > QUOTE_INTERVAL) { updateArtifactScreen(cinematicTarget.userData.type); lastQuoteTime = now; }
                
                // Project screen overlay
                const vector = cinematicTarget.position.clone();
                vector.y += 4;
                vector.project(camera);
                facultyScreen.style.left = (vector.x * .5 + .5) * window.innerWidth + 'px';
                facultyScreen.style.top = (vector.y * -.5 + .5) * window.innerHeight + 'px';
            } else {
                controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.03);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.03);
            }

            camera.updateProjectionMatrix();
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
