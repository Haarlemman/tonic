<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAS E-MODELL v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --neon-red: #FF0033;
            --neon-green: #39FF14;
            --screen-bg: #050505;
            --grid-color: #1a1a1a;
        }

        body {
            background-color: black;
            font-family: 'VT323', monospace;
            color: var(--neon-green);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* CRT Overlay - Passive */
        .crt-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.06), 
                rgba(0, 255, 0, 0.02), 
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 2px, 3px 100%;
        }

        .pixel-border {
            box-shadow: 
                -2px 0 0 0 var(--neon-green),
                2px 0 0 0 var(--neon-green),
                0 -2px 0 0 var(--neon-green),
                0 2px 0 0 var(--neon-green);
            margin: 4px;
        }

        .man-machine-text {
            text-shadow: 2px 2px var(--neon-red);
            letter-spacing: 2px;
        }

        .grid-bg {
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Animations */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor {
            animation: blink 1s step-end infinite;
        }

        button {
            cursor: pointer;
            user-select: none;
        }

        button:active {
            transform: translateY(2px);
            background-color: var(--neon-red);
            color: black;
        }
        
        .active-btn {
            background-color: var(--neon-green);
            color: black;
            box-shadow: 0 0 10px var(--neon-green);
        }

        /* Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 12px;
            background: var(--neon-red);
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 5px var(--neon-red);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--neon-green);
        }

        /* Canvas Container */
        .scope-container {
            position: relative;
            height: 160px;
            width: 100%;
            border-left: 1px solid white;
            border-bottom: 1px solid white;
            background-color: #0a0a0a;
            overflow: hidden;
        }
        
        /* The target line (e) */
        .limit-line {
            position: absolute;
            left: 0;
            width: 100%;
            border-top: 1px dashed var(--neon-red);
            opacity: 0.7;
            pointer-events: none;
            z-index: 10;
        }

    </style>
</head>
<body>

    <div class="crt-layer"></div>

    <!-- Header -->
    <header class="w-full p-4 border-b-2 border-[#39FF14] flex justify-between items-center bg-black z-10 shrink-0">
        <h1 class="text-2xl md:text-5xl uppercase font-bold man-machine-text text-white">DAS E-MODELL</h1>
        <div class="text-xs md:text-sm text-[#FF0033] flex flex-col items-end">
            <span>OSCILLOSCOPE MODE</span>
            <span>V 3.0</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow grid-bg flex flex-col items-center justify-start md:justify-center p-4 overflow-y-auto z-0 pb-20">
        
        <div class="w-full max-w-3xl bg-black border-2 border-[#39FF14] p-4 md:p-6 relative shadow-[0_0_20px_rgba(57,255,20,0.2)] mb-6">
            
            <!-- Terminal -->
            <div id="terminal" class="h-20 mb-4 text-[#39FF14] text-lg uppercase tracking-widest border-b border-[#1a1a1a] pb-2 overflow-hidden">
                > SYSTEM READY<br>
                > INFINITE GRAPH LOADER...<span class="cursor">_</span>
            </div>

            <!-- Visualization Area -->
            <div class="flex flex-col gap-4">
                
                <!-- Stats Row -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 items-end">
                    <div class="col-span-2 text-white">
                         <div class="text-sm text-[#FF0033] uppercase">Formula</div>
                         <div class="text-xl font-mono">(1 + 1/n)<sup class="text-[#FF0033]">n</sup></div>
                    </div>
                    
                    <div class="border border-[#39FF14] p-1">
                        <div class="text-xs text-[#FF0033] uppercase">n (Steps)</div>
                        <div id="display-n" class="text-xl text-right">1</div>
                    </div>
                    <div class="border border-[#39FF14] p-1">
                        <div class="text-xs text-[#FF0033] uppercase">Result</div>
                        <div id="display-e" class="text-xl text-right text-white">2.00000</div>
                    </div>
                </div>

                <!-- Oscilloscope Graph -->
                <div class="scope-container" id="scope-container">
                    <!-- Target Line e = 2.718... scaled to canvas height -->
                    <!-- We will map 1.0 to bottom, 3.0 to top. 
                         Range is 2.0. e is at 1.718 above bottom.
                         1.718 / 2.0 = 85.9% height -->
                    <div class="limit-line" style="bottom: 85.9%"></div>
                    <div class="absolute right-1 top-4 text-xs text-[#FF0033]">e (2.718...)</div>
                    <div class="absolute right-1 bottom-1 text-xs text-[#666]">n -> ∞</div>
                    
                    <canvas id="graph-canvas" class="block w-full h-full"></canvas>
                </div>

            </div>
        </div>

        <!-- Controls -->
        <div class="w-full max-w-3xl grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="pixel-border p-4 bg-black flex justify-between items-center">
                <span class="text-[#FF0033]">AUDIO DATA</span>
                <button id="btn-audio" class="border border-[#39FF14] px-4 py-1 hover:bg-[#39FF14] hover:text-black transition-colors">OFF</button>
            </div>

            <div class="pixel-border p-4 bg-black flex gap-2 justify-center">
                <button id="btn-step" class="flex-1 border border-[#39FF14] px-2 py-1 hover:bg-[#39FF14] hover:text-black uppercase">Step</button>
                <button id="btn-auto" class="flex-1 border border-[#39FF14] px-2 py-1 hover:bg-[#39FF14] hover:text-black uppercase">Run ∞</button>
                <button id="btn-reset" class="border border-[#FF0033] text-[#FF0033] px-2 py-1 hover:bg-[#FF0033] hover:text-white uppercase">Reset</button>
            </div>
        </div>
        
        <!-- Manual Slider -->
        <div class="w-full max-w-3xl mt-4 px-1 pb-8">
             <input type="range" id="slider-n" min="1" max="1000" value="1" step="1">
             <div class="flex justify-between text-xs text-[#1a1a1a] mt-1 font-mono">
                 <span>START</span>
                 <span>(ACCELERATE)</span>
                 <span>INFINITY</span>
             </div>
        </div>

    </main>

    <footer class="p-2 text-center text-[10px] text-[#333] font-mono z-10 bg-black shrink-0 border-t border-[#1a1a1a]">
        KRAFTWERK ENGINE // v3.0 // INFINITE LOOP
    </footer>

    <script>
        // --- CONFIG ---
        const MIN_VAL = 1.0;
        const MAX_VAL = 3.0; // Y-axis range
        const SCROLL_SPEED = 2; // px per update

        // --- STATE ---
        let n = 1;
        let isAutoRunning = false;
        let audioEnabled = false;
        let audioCtx = null;
        let autoInterval = null;
        let prevY = null; // Canvas drawing state

        // --- DOM ---
        const displayN = document.getElementById('display-n');
        const displayE = document.getElementById('display-e');
        const terminal = document.getElementById('terminal');
        const slider = document.getElementById('slider-n');
        const btnStep = document.getElementById('btn-step');
        const btnAuto = document.getElementById('btn-auto');
        const btnReset = document.getElementById('btn-reset');
        const btnAudio = document.getElementById('btn-audio');
        const canvas = document.getElementById('graph-canvas');
        const ctx = canvas.getContext('2d');

        // --- CANVAS SETUP ---
        function resizeCanvas() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            prevY = null; // Reset drawing point
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function mapValueToY(val) {
            // Map val between MIN_VAL (bottom) and MAX_VAL (top)
            const range = MAX_VAL - MIN_VAL;
            const normalized = (val - MIN_VAL) / range;
            // Canvas Y is inverted (0 is top)
            return canvas.height - (normalized * canvas.height);
        }

        // --- LOGIC ---
        function calculateE(val) {
            return Math.pow(1 + (1/val), val);
        }

        function drawGraphPoint(val) {
            const currentY = mapValueToY(val);
            
            // If first point
            if (prevY === null) {
                prevY = currentY;
                // Draw initial dot
                ctx.fillStyle = '#39FF14';
                ctx.fillRect(canvas.width - SCROLL_SPEED, currentY, 2, 2);
                return;
            }

            // 1. Shift canvas content to the left
            // We use drawImage to draw the canvas onto itself shifted over
            ctx.globalCompositeOperation = 'copy';
            ctx.drawImage(canvas, -SCROLL_SPEED, 0);
            ctx.globalCompositeOperation = 'source-over';

            // 2. Draw connecting line at the right edge
            ctx.beginPath();
            ctx.strokeStyle = '#39FF14';
            ctx.lineWidth = 2;
            // From previous point (shifted left by speed) to new point
            ctx.moveTo(canvas.width - SCROLL_SPEED, prevY);
            ctx.lineTo(canvas.width, currentY);
            ctx.stroke();

            // 3. Update state
            prevY = currentY;
        }

        function updateSystem() {
            const eVal = calculateE(n);
            
            // Update Text
            displayN.innerText = n.toLocaleString();
            displayE.innerText = eVal.toFixed(6); // Higher precision
            
            // Slider follows n (clamped visually, but n can go higher)
            if (n <= 1000) slider.value = n;

            // Draw to oscilloscope
            drawGraphPoint(eVal);

            // Terminal
            if (n === 1) typeToTerminal("> SEQUENCE START");
            if (n === 100) typeToTerminal("> ACCELERATING...");
            if (n === 1000) typeToTerminal("> APPROACHING LIMIT");
            if (n === 10000) typeToTerminal("> INFINITY MODE ACTIVE");

            playSound();
        }

        // --- AUDIO (Minimalist) ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound() {
            if (!audioEnabled || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            // High tech data blip
            osc.type = 'square';
            // Pitch rises slightly with n but caps out
            const pitch = 400 + (Math.log(n) * 20);
            osc.frequency.setValueAtTime(pitch, now);
            
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            
            osc.start(now);
            osc.stop(now + 0.05);
        }

        function typeToTerminal(text) {
            // Simple update to avoid flickering cursor issues in loop
            const content = terminal.innerHTML.split('<br>');
            if(content.length > 2) content.shift(); // Keep last 2 lines
            // Check if last line is same to avoid spam
            if(!terminal.innerHTML.includes(text)) {
                terminal.innerHTML = `${text}<br>> PROCESSING...<span class="cursor">_</span>`;
            }
        }

        // --- CONTROLS ---
        slider.addEventListener('input', (e) => {
            stopAutoRun();
            n = parseInt(e.target.value);
            // Reset graph slightly visually if jumping? 
            // For continuous graph, jumping x-axis usually breaks continuity.
            // We will just draw a line to the new value.
            updateSystem();
        });

        btnStep.addEventListener('click', () => {
            stopAutoRun();
            n += Math.max(1, Math.floor(n * 0.1)); // 10% increase per step
            updateSystem();
        });

        btnReset.addEventListener('click', () => {
            stopAutoRun();
            n = 1;
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            prevY = null;
            typeToTerminal("> MEMORY CLEARED");
            updateSystem();
        });

        btnAuto.addEventListener('click', () => {
            if (isAutoRunning) stopAutoRun();
            else startAutoRun();
        });

        btnAudio.addEventListener('click', () => {
            audioEnabled = !audioEnabled;
            btnAudio.innerText = audioEnabled ? "ON" : "OFF";
            btnAudio.classList.toggle("active-btn");
            if (audioEnabled) initAudio();
        });

        function startAutoRun() {
            isAutoRunning = true;
            btnAuto.classList.add("active-btn");
            btnAuto.innerText = "STOP";
            
            // Dynamic interval for speed
            autoInterval = setInterval(() => {
                // Growth logic:
                // Start slow, then get faster, but allow infinite growth
                if (n < 50) n += 1;
                else if (n < 500) n += 5;
                else if (n < 5000) n += 53;
                else n += 1024; // Big jumps for infinity
                
                updateSystem();
            }, 50);
        }

        function stopAutoRun() {
            isAutoRunning = false;
            btnAuto.classList.remove("active-btn");
            btnAuto.innerText = "RUN ∞";
            clearInterval(autoInterval);
        }

        // Init
        updateSystem();

    </script>
</body>
</html>
