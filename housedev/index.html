    <script>
        // 1. Global Error Handler
        window.addEventListener('error', function (e) {
            const errorBox = document.getElementById('loading');
            if (errorBox) {
                errorBox.innerHTML = `<div style="color:red; background:black; padding:20px; z-index:9999;">ERROR: ${e.message}<br>File: ${e.filename}<br>Line: ${e.lineno}</div>`;
                errorBox.style.display = 'flex';
                errorBox.style.opacity = 1;
            }
        });


        // 3. Monitor Loader for Fade (Icon Sync)
        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loading');
            const topControls = document.getElementById('top-controls');

            if (loader && topControls) {
                const observer = new MutationObserver((mutations) => {
                    mutations.forEach((mutation) => {
                        if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                            if (loader.style.opacity === '0' || loader.style.display === 'none') {
                                topControls.style.opacity = '1';
                                observer.disconnect();
                            }
                        }
                    });
                });
                observer.observe(loader, { attributes: true, attributeFilter: ['style'] });
            }
        });

        // 2. Safety Timeout (Immediate Scope)
        document.addEventListener('DOMContentLoaded', () => {
            // Start timer as soon as DOM is ready. Don't wait for all assets (window.load).
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if (loader && getComputedStyle(loader).opacity !== '0') {
                    console.warn("Forcing Loader Off (Timeout)");
                    if (!loader.innerHTML.includes("ERROR:")) {
                        loader.style.opacity = 0;

                        // Force Icons Show
                        const topControls = document.getElementById('top-controls');
                        if (topControls) topControls.style.opacity = '1';

                        setTimeout(() => { loader.style.display = 'none'; }, 500);

                        // Optional: Show a subtle warning
                        const err = document.getElementById('loading-error');
                        if (err) {
                            err.classList.remove('hidden');
                            err.innerHTML = "<span style='color:orange'>Loading took too long. Forcing start.</span>";
                        }
                    }
                }
            }, 8000);
        });
    </script>

        .house-svg {

            /* V290: Intense Glowing Outline */
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
            animation: svgPulse 2s ease-in-out infinite alternate;
        }

        @keyframes svgPulse {
            from {
                filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8)) drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
            }

            to {
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 1.0)) drop-shadow(0 0 30px rgba(255, 255, 255, 0.6));
            }
        }

        .house-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
            animation: drawOnce 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards infinite alternate;
        }

        @keyframes drawOnce {
            0% {
                stroke-dashoffset: 1;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                stroke-dashoffset: 0;
                opacity: 1;
            }
        }

        .intro-text {

            font-size: 12px;
            color: #888;
            font-family: monospace;
            text-transform: uppercase;
            animation: pulseText 1.5s ease-in-out infinite alternate;
        }

        @keyframes pulseText {
            from {
                opacity: 0.3;
            }

            to {
                opacity: 1.0;
            }
        }
    </style>
