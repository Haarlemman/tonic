<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Molecule</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        canvas {
            display: block;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 0, 25, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(191, 0, 255, 0.4);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 220px;
            user-select: none;
            z-index: 10;
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.3);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #eabfff;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #bf00ff;
        }
        button {
            background: #2a0044;
            color: white;
            border: 1px solid #bf00ff;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: #4a0088;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.6);
        }
        button.active {
            background: #ff0055;
            border-color: #ff0055;
        }
        .export-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        #ui-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(191, 0, 255, 0.6);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="control-group">
            <label>Simulation Speed</label>
            <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
        </div>
        
        <button id="pauseBtn">Pause Simulation</button>

        <div class="control-group">
            <label>Export Image</label>
            <div class="export-group">
                <button onclick="exportImage('png')">PNG</button>
                <button onclick="exportImage('jpg')">JPG</button>
            </div>
        </div>
    </div>

    <div id="ui-hint">Drag to Rotate</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, molecule;
        let isDragging = false;
        let isPaused = false;
        let speedMultiplier = 1;
        let previousMousePosition = { x: 0, y: 0 };
        const electrons = [];
        const solidBeams = [];

        window.onload = function () {
            init();
            animate();
        };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                preserveDrawingBuffer: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 2, 100);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            molecule = new THREE.Group();
            scene.add(molecule);

            // Nucleus
            const nucleusGeom = new THREE.SphereGeometry(1.4, 32, 32);
            const nucleusMat = new THREE.MeshPhongMaterial({
                color: 0x0066ff,
                emissive: 0x001144,
                shininess: 150,
                transparent: true,
                opacity: 0.95
            });
            const nucleus = new THREE.Mesh(nucleusGeom, nucleusMat);
            molecule.add(nucleus);

            // 6 Orbits - Innermost is set to 5x speed
            const orbitData = [
                { radius: 2.8, speed: 0.12, axis: new THREE.Vector3(1, 1, 0.2).normalize() }, // 5x Speed
                { radius: 3.8, speed: 0.024, axis: new THREE.Vector3(1, -1, 0.5).normalize() },
                { radius: 4.8, speed: 0.020, axis: new THREE.Vector3(0, 1, 0.3).normalize() },
                { radius: 5.8, speed: 0.016, axis: new THREE.Vector3(-1, 0.5, 0.8).normalize() },
                { radius: 6.8, speed: 0.012, axis: new THREE.Vector3(0.2, 0.8, -1).normalize() },
                { radius: 7.8, speed: 0.010, axis: new THREE.Vector3(0.5, -0.2, 1).normalize() }
            ];

            orbitData.forEach((data) => {
                const curve = new THREE.EllipseCurve(0, 0, data.radius, data.radius, 0, 2 * Math.PI, false, 0);
                const points = curve.getPoints(200);
                const orbitGeom = new THREE.BufferGeometry().setFromPoints(points);
                const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), data.axis);

                // Multiple layers for "Bright Glowing" look
                const colors = [0xffccff, 0xbf00ff, 0x6600ff];
                const opacities = [1.0, 0.6, 0.3];
                const dashSizes = [0.1, 0.3, 0.6];

                colors.forEach((col, idx) => {
                    const orbitMat = new THREE.LineDashedMaterial({ 
                        color: col, 
                        dashSize: dashSizes[idx],
                        gapSize: 0.05,
                        transparent: true, 
                        opacity: opacities[idx]
                    });
                    const orbitLine = new THREE.Line(orbitGeom, orbitMat);
                    orbitLine.computeLineDistances();
                    orbitLine.applyQuaternion(q);
                    molecule.add(orbitLine);
                });

                // Electron (Red)
                const eGeom = new THREE.SphereGeometry(0.32, 24, 24);
                const eMat = new THREE.MeshPhongMaterial({
                    color: 0xff0000,
                    emissive: 0xcc0000,
                    emissiveIntensity: 1.5,
                    shininess: 100
                });
                const electron = new THREE.Mesh(eGeom, eMat);
                electron.userData = { 
                    radius: data.radius, 
                    speed: data.speed, 
                    angle: Math.random() * Math.PI * 2, 
                    quaternion: q 
                };
                molecule.add(electron);
                electrons.push(electron);

                // Solid Thick Yellow Beam Connector
                const beamGeom = new THREE.CylinderGeometry(0.08, 0.08, 1, 12);
                beamGeom.translate(0, 0.5, 0); 
                beamGeom.rotateX(Math.PI / 2); 
                
                const beamMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const beam = new THREE.Mesh(beamGeom, beamMat);
                
                const beamPivot = new THREE.Group();
                beamPivot.add(beam);
                molecule.add(beamPivot);
                solidBeams.push({ mesh: beam, pivot: beamPivot, radius: data.radius });
            });

            // Interaction
            document.addEventListener('mousedown', () => isDragging = true);
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('mousemove', handleRotation);
            
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                speedMultiplier = parseFloat(e.target.value);
            });

            const pauseBtn = document.getElementById('pauseBtn');
            pauseBtn.addEventListener('click', () => {
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? "Resume Simulation" : "Pause Simulation";
                pauseBtn.classList.toggle('active', isPaused);
            });

            window.addEventListener('resize', onWindowResize);
        }

        function handleRotation(e) {
            if (isDragging) {
                const delta = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
                const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(toRadians(delta.y * 0.5), toRadians(delta.x * 0.5), 0, 'XYZ'));
                molecule.quaternion.multiplyQuaternions(q, molecule.quaternion);
            }
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        }

        function toRadians(angle) { return angle * (Math.PI / 180); }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function exportImage(format) {
            renderer.render(scene, camera);
            const mime = format === 'png' ? 'image/png' : 'image/jpeg';
            const dataUrl = renderer.domElement.toDataURL(mime, 1.0);
            const link = document.createElement('a');
            link.download = `molecule-capture.${format}`;
            link.href = dataUrl;
            link.click();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused) {
                electrons.forEach((e, i) => {
                    const data = e.userData;
                    data.angle += data.speed * speedMultiplier;
                    
                    const x = Math.cos(data.angle) * data.radius;
                    const y = Math.sin(data.angle) * data.radius;
                    
                    // Direct local position calculation
                    const pos = new THREE.Vector3(x, y, 0).applyQuaternion(data.quaternion);
                    e.position.copy(pos);

                    // Update beam connector - ensure pivot points exactly at local electron position
                    const beamData = solidBeams[i];
                    beamData.pivot.lookAt(pos); 
                    beamData.mesh.scale.z = data.radius; 
                });

                if (!isDragging) {
                    molecule.rotation.y += 0.001 * speedMultiplier;
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
