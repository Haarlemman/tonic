```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plutonian Star-Whisker</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: linear-gradient(to top, #0b1a3a 0%, #000000 100%);
        }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #88ccff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #00ffff;
            user-select: none;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="ui">Plutonian Star-Whisker<br><span style="font-size:0.7em; opacity:0.8">Scroll to Zoom • Drag to Rotate</span></div>
    <div id="canvas-container"></div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = null; 
        scene.fog = new THREE.FogExp2(0x0b1a3a, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 9); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 20;

        const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x222233, 1.0); 
        scene.add(hemiLight);
        const keyLight = new THREE.DirectionalLight(0xffeedd, 2.5);
        keyLight.position.set(5, 8, 8); 
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        scene.add(keyLight);
        const rimLight = new THREE.SpotLight(0x00ffff, 5.0);
        rimLight.position.set(-6, 4, -5);
        scene.add(rimLight);
        const purpleFill = new THREE.PointLight(0xaa00ff, 1.5, 10);
        purpleFill.position.set(3, -2, 3);
        scene.add(purpleFill);

        const skinMaterial = new THREE.MeshPhysicalMaterial({color: 0x6655aa, emissive: 0x111122, roughness: 0.4, metalness: 0.1, clearcoat: 0.5});
        const eyelidMaterial = new THREE.MeshStandardMaterial({color: 0x6655aa, roughness: 0.4, metalness: 0.1, side: THREE.DoubleSide});

        const pantsCanvas = document.createElement('canvas');
        pantsCanvas.width = 512;
        pantsCanvas.height = 512;
        const ctx = pantsCanvas.getContext('2d');
        ctx.fillStyle = '#44aa44';
        ctx.fillRect(0, 0, 512, 512);
        ctx.strokeStyle = '#3a9a3a';
        ctx.lineWidth = 1;
        for(let i = 0; i < 512; i += 4) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, 512);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(512, i);
            ctx.stroke();
        }
        for(let i = 0; i < 20; i++) {
            ctx.fillStyle = `rgba(58, 154, 58, ${Math.random() * 0.3})`;
            ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 30 + 10, (Math.random() * 30 + 10) * 0.3);
        }
        const pantsTexture = new THREE.CanvasTexture(pantsCanvas);
        pantsTexture.wrapS = THREE.RepeatWrapping;
        pantsTexture.wrapT = THREE.RepeatWrapping;
        pantsTexture.repeat.set(2, 2);
        
        const pantsMaterial = new THREE.MeshStandardMaterial({map: pantsTexture, color: 0x44aa44, roughness: 0.9});
        const shirtMaterial = new THREE.MeshStandardMaterial({color: 0xffd700, roughness: 0.7, metalness: 0.1});
        const gloveMaterial = new THREE.MeshStandardMaterial({color: 0x2a5a2a, roughness: 0.8});
        const bellyMaterial = new THREE.MeshStandardMaterial({color: 0xaa88cc, roughness: 0.6});
        const glowMaterial = new THREE.MeshStandardMaterial({color: 0x55ffff, emissive: 0x00ffff, emissiveIntensity: 3, roughness: 0.1});
        const crystalSpikeMaterial = new THREE.MeshPhysicalMaterial({color: 0xff00aa, emissive: 0x550022, transmission: 0.5, opacity: 0.9, roughness: 0.0, thickness: 1});
        const eyeWhiteMaterial = new THREE.MeshBasicMaterial({color: 0xe4f0ef});
        const pupilMaterial = new THREE.MeshBasicMaterial({color: 0x051b2a}); 
        const glintMaterial = new THREE.MeshBasicMaterial({color: 0xeeeeff});
        const droneMaterial = new THREE.MeshStandardMaterial({color: 0x8899aa, metalness: 0.8, roughness: 0.2});
        
        const creatureGroup = new THREE.Group();
        scene.add(creatureGroup);

        const headGroup = new THREE.Group();
        creatureGroup.add(headGroup);
        const head = new THREE.Mesh(new THREE.SphereGeometry(1.2, 64, 64), skinMaterial);
        head.scale.set(1.15, 0.95, 1);
        head.castShadow = true;
        headGroup.add(head);

        const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), bellyMaterial);
        muzzle.position.set(0, -0.25, 1.1); 
        muzzle.scale.set(1.2, 0.8, 0.8);
        headGroup.add(muzzle);

        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshStandardMaterial({color: 0xcc4444, roughness: 0.3, emissive: 0x331111, emissiveIntensity: 0.5})); 
        nose.position.set(0, 0.1, 0.4); 
        muzzle.add(nose);

        const upperLids = [];
        const lowerLids = [];

        function createEye(isLeft) {
            const g = new THREE.Group();
            const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.44, 32, 32), eyeWhiteMaterial);
            sclera.position.z = -0.02;
            g.add(sclera);
            const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.22, 32), pupilMaterial);
            pupil.position.z = 0.421;
            g.add(pupil);
            const glint = new THREE.Mesh(new THREE.CircleGeometry(0.06, 16), glintMaterial);
            glint.position.set(isLeft ? -0.12 : 0.12, 0.12, 0.422);
            g.add(glint);
            const upperLid = new THREE.Mesh(new THREE.SphereGeometry(0.52, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.5), eyelidMaterial);
            upperLid.rotation.x = -Math.PI * 0.3; 
            upperLid.position.z = 0.03; 
            upperLid.castShadow = true;
            g.add(upperLid);
            upperLids.push(upperLid);
            const lowerLid = new THREE.Mesh(new THREE.SphereGeometry(0.52, 32, 32, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.5), eyelidMaterial);
            lowerLid.rotation.x = Math.PI * 0.3; 
            lowerLid.position.z = 0.03; 
            lowerLid.castShadow = true;
            g.add(lowerLid);
            lowerLids.push(lowerLid);
            return g;
        }

        const leftEye = createEye(true);
        leftEye.position.set(-0.5, 0.15, 0.95); 
        leftEye.rotation.y = 0.15; 
        headGroup.add(leftEye);
        const rightEye = createEye(false);
        rightEye.position.set(0.5, 0.15, 0.95);
        rightEye.rotation.y = -0.15; 
        headGroup.add(rightEye);

        const bodyGroup = new THREE.Group();
        bodyGroup.position.set(0, -1.3, -0.2);
        creatureGroup.add(bodyGroup);

        const body = new THREE.Mesh(new THREE.SphereGeometry(0.85, 64, 64), skinMaterial);
        body.scale.set(0.9, 1.1, 0.9);
        body.castShadow = true;
        bodyGroup.add(body);

        const shirt = new THREE.Mesh(new THREE.SphereGeometry(0.87, 64, 64, 0, Math.PI * 2, 0, Math.PI * 0.55), shirtMaterial);
        shirt.scale.set(0.91, 1.11, 0.91);
        shirt.position.y = 0.25;
        bodyGroup.add(shirt);

        const collar = new THREE.Mesh(new THREE.TorusGeometry(0.65, 0.08, 8, 32, Math.PI * 1.3), new THREE.MeshStandardMaterial({color: 0x000000, roughness: 0.7, metalness: 0.1}));
        collar.rotation.x = Math.PI / 2;
        collar.rotation.z = Math.PI * 0.85;
        collar.position.set(0, 0.85, 0.1);
        bodyGroup.add(collar);

        const badgeShape = new THREE.Shape();
        badgeShape.moveTo(0, 0);
        badgeShape.lineTo(-0.05, 0.2);
        badgeShape.lineTo(0.15, 0.1);
        badgeShape.lineTo(0, 0);
        const extrudeSettings = { depth: 0.02, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.005, bevelSegments: 3 };
        const badgeGeo = new THREE.ExtrudeGeometry(badgeShape, extrudeSettings);
        const badge = new THREE.Mesh(badgeGeo, new THREE.MeshStandardMaterial({color: 0xffd700, metalness: 0.9, roughness: 0.1}));
        badge.position.set(-0.3, 0.75, 0.4);
        badge.rotation.y = 0.1;
        badge.rotation.x = -0.2;
        badge.scale.set(1.2, 1.2, 1.2);
        bodyGroup.add(badge);

        const leftSleeve = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.06, 8, 16), shirtMaterial);
        leftSleeve.rotation.set(0, 0.3, Math.PI / 2);
        leftSleeve.position.set(-0.68, 0.4, 0.15);
        body.add(leftSleeve);
        const rightSleeve = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.06, 8, 16), shirtMaterial);
        rightSleeve.rotation.set(0, -0.3, Math.PI / 2);
        rightSleeve.position.set(0.68, 0.4, 0.15);
        body.add(rightSleeve);

        const pants = new THREE.Mesh(new THREE.SphereGeometry(0.88, 64, 64, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), pantsMaterial);
        pants.scale.set(0.92, 1.12, 0.92);
        pants.position.y = 0.1; 
        bodyGroup.add(pants);

        const waist = new THREE.Mesh(new THREE.TorusGeometry(0.88, 0.05, 16, 64), pantsMaterial);
        waist.rotation.x = Math.PI / 2;
        waist.scale.set(0.92, 0.92, 1);
        waist.position.y = 0.1;
        bodyGroup.add(waist);

        const belly = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 32), bellyMaterial);
        belly.position.set(0, 0.3, 0.6); 
        belly.scale.set(1, 0.8, 0.5);
        body.add(belly);

        function createLimb(x, y, z, rotZ, rotX, isLeg) {
            const g = new THREE.Group();
            g.position.set(x, y, z);
            g.rotation.set(rotX, 0, rotZ);
            if(isLeg) {
                const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.2, 16), pantsMaterial);
                cuff.position.y = 0.2;
                g.add(cuff);
                g.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.6, 4, 16), skinMaterial));
            } else {
                g.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.6, 4, 16), skinMaterial));
                const glove = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), gloveMaterial);
                glove.position.y = -0.45;
                glove.scale.set(1, 0.8, 1.1);
                g.add(glove);
                const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.18, 0.15, 16), gloveMaterial);
                cuff.position.y = -0.35;
                g.add(cuff);
                for(let f = 0; f < 3; f++) {
                    const angle = (f - 1) * 0.4;
                    const finger = new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.15, 4, 8), gloveMaterial);
                    finger.position.set(Math.sin(angle) * 0.13, -0.58, 0.08 + Math.cos(angle) * 0.08);
                    finger.rotation.set(0.2, 0, angle);
                    g.add(finger);
                    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), gloveMaterial);
                    tip.position.y = -0.09;
                    finger.add(tip);
                }
            }
            for(let t = -1; t <= 1; t++) {
                const toe = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), bellyMaterial);
                toe.position.set(t * 0.08, -0.3, 0.12); 
                g.add(toe);
            }
            return g;
        }

        const leftArm = createLimb(-0.75, 0.4, 0.1, -1.2, 0.2, false);
        body.add(leftArm);
        const rightArm = createLimb(0.75, 0.4, 0.1, 1.2, 0.2, false);
        body.add(rightArm);
        const leftLeg = createLimb(-0.45, -0.75, 0.3, 0, -0.2, true);
        bodyGroup.add(leftLeg);
        const rightLeg = createLimb(0.45, -0.75, 0.3, 0, -0.2, true);
        bodyGroup.add(rightLeg);

        for(let i = 0; i < 5; i++) {
            const spike = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.3, 4), crystalSpikeMaterial);
            spike.position.set(0, 0.5 - (i*0.25), -0.75 - (i*0.1));
            spike.rotation.x = -Math.PI/4;
            body.add(spike);
        }

        const tailGroup = new THREE.Group();
        tailGroup.position.set(0, -0.7, -0.7);
        bodyGroup.add(tailGroup);
        for(let i = 0; i < 8; i++) {
            const s = new THREE.Mesh(new THREE.SphereGeometry(0.14 - (i*0.015), 16, 16), skinMaterial);
            s.position.set(0, i * 0.15, -(i * 0.25));
            tailGroup.add(s);
        }

        const leftStalk = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.02, 0.8, 16), skinMaterial);
        leftStalk.position.set(-0.6, 0.8, 0);
        leftStalk.rotation.set(-0.2, 0, 0.5);
        headGroup.add(leftStalk);
        const rightStalk = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.02, 0.8, 16), skinMaterial);
        rightStalk.position.set(0.6, 0.8, 0);
        rightStalk.rotation.set(-0.2, 0, -0.5);
        headGroup.add(rightStalk);

        const droneGroup = new THREE.Group();
        droneGroup.position.set(0, 1.8, 0); 
        headGroup.add(droneGroup);
        droneGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), droneMaterial));
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.05, 8, 32), droneMaterial);
        ring.rotation.x = Math.PI/2;
        droneGroup.add(ring);
        const propGroup = new THREE.Group();
        droneGroup.add(propGroup);
        propGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.01, 0.8), glowMaterial));
        const prop2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.01, 0.8), glowMaterial);
        prop2.rotation.y = Math.PI/2;
        propGroup.add(prop2);

        const platform = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 2.5, 0.5, 7, 1), new THREE.MeshStandardMaterial({color: 0x603000, roughness: 0.8, flatShading: true}));
        platform.position.y = -2.6;
        platform.receiveShadow = true;
        scene.add(platform);

        for(let i = 0; i < 15; i++) {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random() * 0.3), new THREE.MeshStandardMaterial({color: 0x334455, roughness: 0.9}));
            rock.position.set((Math.random() - 0.5) * 4, 0.3, (Math.random() - 0.5) * 4);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            platform.add(rock);
        }

        const pRing = new THREE.Mesh(new THREE.RingGeometry(8, 12, 64), new THREE.MeshStandardMaterial({color: 0x442266, side: THREE.DoubleSide, transparent: true, opacity: 0.4}));
        pRing.rotation.x = Math.PI / 2;
        pRing.position.y = -3;
        scene.add(pRing);

        const starsGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(6000);
        for(let i = 0; i < 2000; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 200;
            starPos[i*3+1] = (Math.random() - 0.5) * 200;
            starPos[i*3+2] = (Math.random() - 0.5) * 200;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.1}));
        scene.add(stars);

        const clock = new THREE.Clock();
        let lookTarget = {x: 0, y: 0};
        let nextLookTime = 3;
        let headTarget = {rotY: 0, rotX: 0};
        let nextHeadTime = 4;
        let skyPhase = 0;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            const t = clock.getElapsedTime();

            skyPhase += 0.002;
            const sb = (Math.sin(skyPhase) + 1) / 2;
            const r = Math.floor(11 + sb * 20);
            const g = Math.floor(26 + sb * 40);
            const h = Math.floor(58 + sb * 60);
            document.body.style.background = `linear-gradient(to top, rgb(${r}, ${g}, ${h}) 0%, #000000 100%)`;
            scene.fog.color.setHex((r << 16) | (g << 8) | h);

            creatureGroup.rotation.y = Math.sin(t * 0.2) * 0.05;

            if (t > nextHeadTime) {
                headTarget.rotY = (Math.random() - 0.5) * 0.6;
                headTarget.rotX = (Math.random() - 0.5) * 0.4;
                nextHeadTime = t + 2.5 + Math.random() * 3;
            }
            headGroup.rotation.y += (headTarget.rotY - headGroup.rotation.y) * 0.015;
            headGroup.rotation.x += (headTarget.rotX - headGroup.rotation.x) * 0.015;

            if (t > nextLookTime) {
                lookTarget.x = (Math.random() - 0.5) * 0.5;
                lookTarget.y = (Math.random() - 0.5) * 0.4;
                nextLookTime = t + 1.5 + Math.random() * 2.5;
            }
            leftEye.rotation.y += (0.15 + lookTarget.x - leftEye.rotation.y) * 0.02;
            leftEye.rotation.x += (lookTarget.y - leftEye.rotation.x) * 0.02;
            rightEye.rotation.y += (-0.15 + lookTarget.x - rightEye.rotation.y) * 0.02;
            rightEye.rotation.x += (lookTarget.y - rightEye.rotation.x) * 0.02;

            let blink = Math.sin(t * 2);
            if (blink > 0.85) {
                const bf = (blink - 0.85) / 0.15; 
                upperLids.forEach(l => l.rotation.x = -Math.PI * 0.3 * (1 - bf));
                lowerLids.forEach(l => l.rotation.x = Math.PI * 0.3 * (1 - bf));
            } else {
                upperLids.forEach(l => l.rotation.x = -Math.PI * 0.3);
                lowerLids.forEach(l => l.rotation.x = Math.PI * 0.3);
            }

            leftStalk.rotation.z = 0.5 + Math.sin(t * 2.5) * 0.05;
            rightStalk.rotation.z = -0.5 + Math.cos(t * 2.5) * 0.05;

            leftArm.rotation.z = -1.2 + Math.sin(t * 1.8) * 0.2;
            leftArm.rotation.x = 0.2 + Math.cos(t * 1.5) * 0.15;
            rightArm.rotation.z = 1.2 + Math.sin(t * 1.8 + Math.PI) * 0.2;
            rightArm.rotation.x = 0.2 + Math.cos(t * 1.5 + Math.PI) * 0.15;

            tailGroup.rotation.z = Math.sin(t * 1.5) * 0.15;
            propGroup.rotation.y += 0.3; 
            droneGroup.position.y = 1.8 + Math.sin(t * 5) * 0.05; 
            droneGroup.rotation.z = Math.sin(t * 1.2) * 0.1; 

            pRing.rotation.z = t * -0.05;
            stars.rotation.y = t * 0.005;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
```
