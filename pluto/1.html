<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plutonian Star-Whisker</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: linear-gradient(to top, #0b1a3a 0%, #000000 100%);
            transition: background 1.5s ease;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #88ccff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #00ffff;
            user-select: none;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="ui">Plutonian Star-Whisker<br><span style="font-size:0.7em; opacity:0.8">Full Detail Restored • Gaze & Sway Active</span></div>
    <div id="canvas-container"></div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = null; 
        scene.fog = new THREE.FogExp2(0x0b1a3a, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 9); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 20;

        // --- 2. Lighting ---
        const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x222233, 1.0); 
        scene.add(hemiLight);

        const keyLight = new THREE.DirectionalLight(0xffeedd, 2.5);
        keyLight.position.set(5, 8, 8); 
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        scene.add(keyLight);

        const rimLight = new THREE.SpotLight(0x00ffff, 5.0);
        rimLight.position.set(-6, 4, -5);
        scene.add(rimLight);

        const purpleFill = new THREE.PointLight(0xaa00ff, 1.5, 10);
        purpleFill.position.set(3, -2, 3);
        scene.add(purpleFill);

        // --- 3. Materials ---
        const skinMaterial = new THREE.MeshPhysicalMaterial({ color: 0x6655aa, roughness: 0.4, metalness: 0.1, clearcoat: 0.5 });
        const eyelidMaterial = new THREE.MeshStandardMaterial({ color: 0x6655aa, roughness: 0.4, side: THREE.DoubleSide });
        const pantsMaterial = new THREE.MeshStandardMaterial({ color: 0x44aa44, roughness: 0.9 });
        const bellyMaterial = new THREE.MeshStandardMaterial({ color: 0xaa88cc, roughness: 0.6 });
        const glowMaterial = new THREE.MeshStandardMaterial({ color: 0x55ffff, emissive: 0x00ffff, emissiveIntensity: 3 });
        const spikeMat = new THREE.MeshPhysicalMaterial({ color: 0xff00aa, emissive: 0x550022, transmission: 0.5, opacity: 0.9, thickness: 1 });
        const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xe4f0ef });
        const pupilMat = new THREE.MeshBasicMaterial({ color: 0x051b2a }); 
        const glintMat = new THREE.MeshBasicMaterial({ color: 0xeeeeff });
        const droneMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, metalness: 0.8, roughness: 0.2 });
        
        // --- 4. Creature Construction ---
        const creatureGroup = new THREE.Group();
        scene.add(creatureGroup);

        const headGroup = new THREE.Group();
        creatureGroup.add(headGroup);

        const head = new THREE.Mesh(new THREE.SphereGeometry(1.2, 64, 64), skinMaterial);
        head.scale.set(1.15, 0.95, 1);
        head.castShadow = true;
        headGroup.add(head);

        const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), bellyMaterial);
        muzzle.position.set(0, -0.25, 1.1); 
        muzzle.scale.set(1.2, 0.8, 0.8);
        headGroup.add(muzzle);

        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshStandardMaterial({ color: 0xcc4444, roughness: 0.3, emissive: 0x331111, emissiveIntensity: 0.5 })); 
        nose.position.set(0, 0.1, 0.4); 
        muzzle.add(nose);

        // Eyes
        const eyeRadius = 0.44;
        const eyelidRadius = 0.52; 
        const upperLids = [];
        const lowerLids = [];

        function createHemisphereEye(isLeft) {
            const eyeGroup = new THREE.Group();
            const sclera = new THREE.Mesh(new THREE.SphereGeometry(eyeRadius, 32, 32), eyeWhiteMat);
            sclera.position.z = -0.02;
            eyeGroup.add(sclera);
            const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.22, 32), pupilMat);
            pupil.position.z = eyeRadius - 0.02 + 0.001; 
            eyeGroup.add(pupil);
            const glint = new THREE.Mesh(new THREE.CircleGeometry(0.06, 16), glintMat);
            glint.position.set(isLeft ? -0.12 : 0.12, 0.12, eyeRadius - 0.02 + 0.002); 
            eyeGroup.add(glint);
            const upperLid = new THREE.Mesh(new THREE.SphereGeometry(eyelidRadius, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.5), eyelidMaterial);
            upperLid.rotation.x = -Math.PI * 0.3; 
            upperLid.position.z = 0.03; 
            eyeGroup.add(upperLid);
            upperLids.push(upperLid);
            const lowerLid = new THREE.Mesh(new THREE.SphereGeometry(eyelidRadius, 32, 32, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.5), eyelidMaterial);
            lowerLid.rotation.x = Math.PI * 0.3; 
            lowerLid.position.z = 0.03; 
            eyeGroup.add(lowerLid);
            lowerLids.push(lowerLid);
            return eyeGroup;
        }

        const leftEyeGroup = createHemisphereEye(true);
        leftEyeGroup.position.set(-0.5, 0.15, 0.95); leftEyeGroup.rotation.y = 0.15;
        headGroup.add(leftEyeGroup);
        const rightEyeGroup = createHemisphereEye(false);
        rightEyeGroup.position.set(0.5, 0.15, 0.95); rightEyeGroup.rotation.y = -0.15;
        headGroup.add(rightEyeGroup);

        // Body & Detailed Pants
        const bodyGroup = new THREE.Group();
        bodyGroup.position.set(0, -1.3, -0.2);
        creatureGroup.add(bodyGroup);

        const bodyMain = new THREE.Mesh(new THREE.SphereGeometry(0.85, 64, 64), skinMaterial);
        bodyMain.scale.set(0.9, 1.1, 0.9);
        bodyMain.castShadow = true;
        bodyGroup.add(bodyMain);

        const belly = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 32), bellyMaterial);
        belly.position.set(0, 0.3, 0.6); belly.scale.set(1, 0.8, 0.5);
        bodyMain.add(belly);

        const pantsMain = new THREE.Mesh(new THREE.SphereGeometry(0.88, 64, 64, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), pantsMaterial);
        pantsMain.scale.set(0.92, 1.12, 0.92); pantsMain.position.y = 0.1; 
        bodyGroup.add(pantsMain);

        const waistband = new THREE.Mesh(new THREE.TorusGeometry(0.88, 0.05, 16, 64), pantsMaterial);
        waistband.rotation.x = Math.PI / 2; waistband.scale.set(0.92, 0.92, 1); waistband.position.y = 0.1;
        bodyGroup.add(waistband);

        for(let i=0; i<5; i++) {
            const spike = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.3, 4), spikeMat);
            spike.position.set(0, 0.5 - (i*0.25), -0.75 - (i*0.1));
            spike.rotation.x = -Math.PI/4;
            bodyMain.add(spike);
        }

        // Limbs with Hands/Feet Detail
        const limbGeo = new THREE.CapsuleGeometry(0.18, 0.4, 4, 16);
        const toeGeo = new THREE.SphereGeometry(0.06, 8, 8);
        
        function createLimb(x, y, z, rotZ, rotX, isLeg) {
            const group = new THREE.Group();
            group.position.set(x, y, z);
            group.rotation.set(rotX, 0, rotZ);
            
            if(isLeg) {
                const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.2, 16), pantsMaterial);
                cuff.position.y = 0.2;
                group.add(cuff);
            }
            const limb = new THREE.Mesh(limbGeo, skinMaterial);
            group.add(limb);
            
            for(let t=-1; t<=1; t++) {
                const toe = new THREE.Mesh(toeGeo, bellyMaterial);
                toe.position.set(t * 0.08, -0.3, 0.12); 
                group.add(toe);
            }
            return group;
        }

        const leftArm = createLimb(-0.7, 0.2, 0.2, -0.6, 0.5, false);
        bodyMain.add(leftArm);
        const rightArm = createLimb(0.7, 0.2, 0.2, 0.6, 0.5, false);
        bodyMain.add(rightArm);
        const leftLeg = createLimb(-0.45, -0.75, 0.3, 0, -0.2, true);
        bodyGroup.add(leftLeg);
        const rightLeg = createLimb(0.45, -0.75, 0.3, 0, -0.2, true);
        bodyGroup.add(rightLeg);

        const tailGroup = new THREE.Group();
        tailGroup.position.set(0, -0.7, -0.7);
        bodyGroup.add(tailGroup);
        for(let i=0; i<8; i++) {
            const s = new THREE.Mesh(new THREE.SphereGeometry(0.14 - (i*0.015), 16, 16), skinMaterial);
            s.position.set(0, i * 0.15, -(i * 0.25));
            tailGroup.add(s);
        }

        const stalkGeo = new THREE.CylinderGeometry(0.04, 0.02, 0.8, 16);
        const leftStalk = new THREE.Mesh(stalkGeo, skinMaterial);
        leftStalk.position.set(-0.6, 0.8, 0); leftStalk.rotation.z = 0.5;
        headGroup.add(leftStalk);
        const rightStalk = new THREE.Mesh(stalkGeo, skinMaterial);
        rightStalk.position.set(0.6, 0.8, 0); rightStalk.rotation.z = -0.5;
        headGroup.add(rightStalk);

        const droneGroup = new THREE.Group();
        droneGroup.position.set(0, 1.8, 0); headGroup.add(droneGroup);
        droneGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), droneMat));
        const propGroup = new THREE.Group();
        droneGroup.add(propGroup);
        const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.01, 0.8), glowMaterial);
        const p2 = p1.clone(); p2.rotation.y = Math.PI/2;
        propGroup.add(p1, p2);

        // --- 5. Environment ---
        const platform = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 2.5, 0.5, 7, 1), new THREE.MeshStandardMaterial({ color: 0x603000, roughness: 0.8, flatShading: true }));
        platform.position.y = -2.6; platform.receiveShadow = true;
        scene.add(platform);

        for(let i=0; i<15; i++) {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random() * 0.3), new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.9 }));
            rock.position.set((Math.random() - 0.5) * 4, 0.3, (Math.random() - 0.5) * 4);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            platform.add(rock);
        }

        const planetaryRing = new THREE.Mesh(new THREE.RingGeometry(8, 12, 64), new THREE.MeshStandardMaterial({ color: 0x442266, side: THREE.DoubleSide, transparent: true, opacity: 0.4 }));
        planetaryRing.rotation.x = Math.PI / 2; planetaryRing.position.y = -3;
        scene.add(planetaryRing);

        const starsGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(2000 * 3);
        for(let i=0; i<2000; i++) { starPos[i*3] = (Math.random()-0.5)*200; starPos[i*3+1] = (Math.random()-0.5)*200; starPos[i*3+2] = (Math.random()-0.5)*200; }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.1})));

        // --- 6. Animation ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            const time = clock.getElapsedTime();

            // Head Looking
            headGroup.rotation.y = Math.sin(time * 0.4) * 0.2 + Math.sin(time * 0.17) * 0.1;
            headGroup.rotation.x = Math.sin(time * 0.31) * 0.08 + Math.cos(time * 0.12) * 0.04;

            // Arm Sway
            const sway = Math.sin(time * 0.8) * 0.12;
            leftArm.rotation.z = -0.6 + sway;
            rightArm.rotation.z = 0.6 - sway;
            leftArm.rotation.x = 0.5 + Math.cos(time * 0.6) * 0.05;
            rightArm.rotation.x = 0.5 + Math.sin(time * 0.6) * 0.05;

            // Sky Cycle
            const skyCycle = (Math.sin(time * 0.15) + 1) / 2;
            const r = Math.floor(11 + skyCycle * 10);
            const g = Math.floor(26 + skyCycle * 10);
            const b = Math.floor(58 + skyCycle * 15);
            document.body.style.background = `linear-gradient(to top, rgb(${r}, ${g}, ${b}) 0%, #000000 100%)`;

            // Blink
            const bVal = Math.sin(time * 2);
            if (bVal > 0.85) {
                const bf = (bVal - 0.85) / 0.15; 
                upperLids.forEach(l => l.rotation.x = -Math.PI * 0.3 * (1 - bf));
                lowerLids.forEach(l => l.rotation.x = Math.PI * 0.3 * (1 - bf));
            } else {
                upperLids.forEach(l => l.rotation.x = -Math.PI * 0.3);
                lowerLids.forEach(l => l.rotation.x = Math.PI * 0.3);
            }

            leftStalk.rotation.z = 0.5 + Math.sin(time * 2.5) * 0.05;
            rightStalk.rotation.z = -0.5 + Math.cos(time * 2.5) * 0.05;
            tailGroup.rotation.z = Math.sin(time * 1.5) * 0.15;
            propGroup.rotation.y += 0.3; 
            droneGroup.position.y = 1.8 + Math.sin(time * 5) * 0.05; 
            planetaryRing.rotation.z = time * -0.05;

            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
