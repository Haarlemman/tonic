<!DOCTYPE html>

</head>
<body>
	
	
	 <audio id="bg-music" loop crossorigin="anonymous">

    <div id="campus-viewport">     
    <div id="audio-status">Audio Kinetic Analysis Online</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="js/campus.js"></script>

    </div>


    <div id="hud-layer">
        
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div class="brand-box">
                <h1>University of Free Will</h1><br>
                <div class="subtitle">"ADVERSITY IS YOUR TEACHER" [Source 130]</div>
            </div>
            <div>
                <button class="hud-btn" onclick="toggleAudio()">AUDIO: ON/OFF</button>
                <button class="hud-btn" style="background:var(--red); color:white; border-color:var(--red);" 
                        onclick="window.location.href='https://davidenker.com/shop/account/login'">

            <a href="dept-soul.html" class="gate-btn gate-soul">DEPT. SOUL<span>Faith & Silence</span></a></div>
    </div>

    <script>

        function toggleAudio() {
            const audio = document.querySelector('audio');
            if(audio) {
                audio.paused ? audio.play() : audio.pause();
            } else {
                alert("Audio player not found. Make sure your <audio> tag is pasted in the Body!");
            }
        }
    </script>

</body>
