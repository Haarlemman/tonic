<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Light Sculpture</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020202;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #ffffff;
            opacity: 0.4;
            pointer-events: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 12px;
        }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    The Perspective Paradox<br>
    Rotate to align the pillars.
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, group;
    let targetRotationX = 0.5;
    let targetRotationY = 0.8;
    let mouseX = 0, mouseY = 0;
    let isMouseDown = false;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 8);
        camera.lookAt(0, 1, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        group = new THREE.Group();
        scene.add(group);

        createSculpture();

        // Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.1);
        scene.add(ambient);

        const pointLight = new THREE.PointLight(0x00aaff, 2, 20);
        pointLight.position.set(0, 3, 2);
        scene.add(pointLight);

        // Ground Glow (Emission from the pedestal)
        const pedestalLight = new THREE.PointLight(0xffffff, 1, 5);
        pedestalLight.position.set(0, 0.5, 0);
        scene.add(pedestalLight);

        // Events
        window.addEventListener('resize', onWindowResize);
        document.addEventListener('mousedown', (e) => { isMouseDown = true; mouseX = e.clientX; mouseY = e.clientY; });
        document.addEventListener('mouseup', () => isMouseDown = false);
        document.addEventListener('mousemove', onMouseMove);
        
        // Touch
        document.addEventListener('touchstart', (e) => { isMouseDown = true; mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; });
        document.addEventListener('touchend', () => isMouseDown = false);
        document.addEventListener('touchmove', (e) => {
            if(isMouseDown) {
                const dx = e.touches[0].clientX - mouseX;
                const dy = e.touches[0].clientY - mouseY;
                targetRotationY += dx * 0.005;
                targetRotationX += dy * 0.005;
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
            }
        });

        animate();
    }

    function createSculpture() {
        // Pedestal
        const pedGeom = new THREE.BoxGeometry(2.5, 0.2, 2.5);
        const pedMat = new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 100 });
        const pedestal = new THREE.Mesh(pedGeom, pedMat);
        pedestal.position.y = -0.1;
        group.add(pedestal);

        // The Pillars (The Hybrid)
        const pillarMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0x0066ff,
            transparent: true,
            opacity: 0.8,
            roughness: 0,
            metalness: 0.5
        });

        const starRadius = 1.2;
        // Hexagonal coordinates for the Star of David points
        const points = [
            { x: 0, z: starRadius, h: 1.0 },              // Point 1
            { x: starRadius * 0.866, z: starRadius * 0.5, h: 1.4 },  // Point 2
            { x: starRadius * 0.866, z: -starRadius * 0.5, h: 1.8 }, // Point 3
            { x: 0, z: -starRadius, h: 2.2 },             // Shamash / Point 4
            { x: -starRadius * 0.866, z: -starRadius * 0.5, h: 1.8 },// Point 5
            { x: -starRadius * 0.866, z: starRadius * 0.5, h: 1.4 }, // Point 6
            { x: 0, z: 0, h: 1.0 }                        // Center
        ];

        points.forEach((p, i) => {
            const geom = new THREE.CylinderGeometry(0.06, 0.06, p.h, 16);
            const pillar = new THREE.Mesh(geom, pillarMat);
            
            // Positioning pillars so they are on the pedestal
            pillar.position.set(p.x, p.h / 2, p.z);
            group.add(pillar);

            // Light cap (The 'Flame')
            const capGeom = new THREE.SphereGeometry(0.08, 8, 8);
            const capMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const cap = new THREE.Mesh(capGeom, capMat);
            cap.position.set(p.x, p.h, p.z);
            group.add(cap);
        });
    }

    function onMouseMove(event) {
        if (isMouseDown) {
            const dx = event.clientX - mouseX;
            const dy = event.clientY - mouseY;
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            mouseX = event.clientX;
            mouseY = event.clientY;
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);

        // Smoothly interpolate rotation
        group.rotation.y += (targetRotationY - group.rotation.y) * 0.05;
        group.rotation.x += (targetRotationX - group.rotation.x) * 0.05;

        // Auto-rotation when not interacting
        if (!isMouseDown) {
            targetRotationY += 0.002;
        }

        renderer.render(scene, camera);
    }

    window.onload = init;
</script>
</body>
</html>
