<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University of Free Will | Campus Map</title>
    <!-- LINK TO YOUR NEW CSS FILE -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1. THE 3D CONTAINER -->
    <!-- YOUR 3D STUFF GOES HERE. The ID "campus-viewport" is the target for your JS. -->
    <div id="campus-viewport"></div>

    <!-- 2. THE UI LAYER -->
    <nav id="hud-layer">
        <div class="hud-header">
            <div class="brand-box">
                <h1>University<br>of Free Will</h1>
                <div class="sub-brand">ADVERSITY IS YOUR TEACHER</div>
            </div>
            <div>
                <button class="hud-btn" onclick="toggleMenu()">DIRECTORY (+)</button>
                <button class="hud-btn" style="background:var(--red); color:white; border-color:var(--red);" 
                        onclick="window.location.href='/shop/login'">LOGIN ID</button>
            </div>
        </div>
        
        <!-- Controls Footer [Source 162] -->
        <div style="background:rgba(255,255,255,0.9); padding:15px; border:1px solid black; font-family:'Courier New'; font-size:0.7rem;">
            [NAV] L-CLICK: ROTATE / R-CLICK: PAN / SCROLL: ZOOM
        </div>
    </nav>

    <!-- 3. THE MENU OVERLAY -->
    <div id="menu-overlay">
        <div class="menu-grid">
            <div class="admin-col">
                <h3>ADMINISTRATION</h3>
                <a href="/shop/products/tonic-book" style="display:block; margin-bottom:10px; color:#111; font-weight:bold;">BOOKSTORE</a>
                <button class="hud-btn" onclick="toggleMenu()" style="margin:0; width:100%;">CLOSE (X)</button>
            </div>
            <div class="gates-col">
                <a href="dept-body.html" class="gate-link gate-body">
                    <h2 style="margin:0; text-transform:uppercase;">Dept. of Body</h2>
                    <span style="font-family:'Courier New'">PHYSICS // ACTION // RESISTANCE</span>
                </a>
                <a href="dept-mind.html" class="gate-link gate-mind">
                    <h2 style="margin:0; text-transform:uppercase;">Dept. of Mind</h2>
                    <span style="font-family:'Courier New'">LOGIC // SEMANTICS // CONTROL</span>
                </a>
                <a href="dept-soul.html" class="gate-link gate-soul">
                    <h2 style="margin:0; text-transform:uppercase;">Dept. of Soul</h2>
                    <span style="font-family:'Courier New'">FAITH // SILENCE // AWE</span>
                </a>
            </div>
        </div>
    </div>

    <!-- LINK TO YOUR JS FILES -->
    <script src="campus-3d.js"></script> <!-- The 3D Logic -->
    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu-overlay');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }
    </script>
</body>
</html>
