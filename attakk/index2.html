<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>ATTACK ARENA — Choose Your Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6efdd;
    --ink:#191512;
    --cream:#fffaf0;

    --jan-1:#ffea00; --jan-2:#665200; --jan-glow:#ffff55; --jan-accent:#e2273f;
    --vik-1:#4a82cd; --vik-2:#1c3d69; --vik-glow:#8ebbf5; --vik-accent:#a0e6d2;
    --giy-1:#8e56c9; --giy-2:#401b63; --giy-glow:#c28eff; --giy-accent:#ff7a1a;
    --ban-1:#c99a12; --ban-2:#5e4306;
    --bul-1:#2b6b63; --bul-2:#0e2b27;
    --ele-1:#1f6fae; --ele-2:#0b2c47;
    --clo-1:#7a1f4b; --clo-2:#2e0a1f;
    --kil-1:#9d2b6c; --kil-2:#3b0a2c;
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; font-family:'Nunito', sans-serif; overflow:hidden; color:var(--cream); }

  .stage{
    position:relative; width:100vw; height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    background: radial-gradient(120% 90% at 50% 20%, var(--jan-1), var(--jan-2));
    transition: background 0.7s ease; isolation:isolate;
  }

  .grain{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    opacity:.10; mix-blend-mode:overlay;
    background-image: radial-gradient(circle, #000 1px, transparent 1.4px);
    background-size: 5px 5px;
  }

  .scribble-ring{
    position:absolute; top:50%; left:50%; z-index:0; pointer-events:none;
    width:min(70vw,640px); height:min(70vw,640px);
    transform:translate(-50%,-52%); opacity:.35;
    animation: spin 40s linear infinite;
  }
  .scribble-ring svg{ width:100%; height:100%; }
  @keyframes spin{ to{ transform:translate(-50%,-52%) rotate(360deg);} }

  .title-wrap{ position:relative; z-index:2; text-align:center; margin-top:2.2vh; }
  .game-title{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:clamp(2.1rem, 5vw, 3.6rem);
    margin:0; letter-spacing:1px; color:var(--cream);
    text-shadow: 4px 4px 0 var(--ink), -1px -1px 0 var(--ink);
    -webkit-text-stroke: 2px var(--ink);
  }
  .game-title .arena{
    display:inline-block; font-size:.5em; vertical-align:middle; margin-left:.4em;
    padding:.25em .6em; background:var(--jan-accent); border:3px solid var(--ink);
    border-radius:10px; transform:rotate(-3deg); -webkit-text-stroke:0; box-shadow:3px 3px 0 var(--ink);
  }
  .subtitle{
    margin:.4rem 0 0; font-family:'Baloo 2', sans-serif; font-weight:500;
    font-size:clamp(.85rem,1.6vw,1.15rem); letter-spacing:3px; text-transform:uppercase; opacity:.85;
  }

  .fighter-display{
    position:relative; z-index:2; display:flex; align-items:center; justify-content:center;
    gap:clamp(10px, 3vw, 40px); flex:1; width:100%; padding: 0 3vw;
  }

  .nav-arrow{
    font-family:'Baloo 2', sans-serif; background:var(--cream); border:3px solid var(--ink);
    color:var(--ink); width:52px; height:52px; border-radius:50%; font-size:1.4rem; cursor:pointer;
    box-shadow:3px 3px 0 var(--ink); transition: transform .15s ease; flex:0 0 auto;
  }
  .nav-arrow:hover{ transform:translateY(-3px) scale(1.05); }
  .nav-arrow:active{ transform:translateY(1px) scale(.96); box-shadow:1px 1px 0 var(--ink); }

  .card{
    position:relative; width:min(88vw, 380px); background:var(--cream); border:5px solid var(--ink);
    border-radius:22px; padding: 34px 22px 20px; box-shadow: 8px 8px 0 var(--ink); color:var(--ink);
    text-align:center; animation: cardIn .5s cubic-bezier(.2,1.4,.4,1); transition: border-color .5s ease;
  }
  @keyframes cardIn{ 0%{ transform:scale(.85) rotate(-2deg); opacity:0; } 100%{ transform:scale(1) rotate(0); opacity:1; } }

  .rarity-banner{
    position:absolute; top:-20px; left:50%; transform:translateX(-50%) rotate(-2deg);
    font-family:'Baloo 2', sans-serif; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    padding:6px 22px; border:3px solid var(--ink); border-radius:8px; font-size:.95rem;
    box-shadow:3px 3px 0 var(--ink); color:var(--ink); animation: ribbonWiggle 3.4s ease-in-out infinite; white-space:nowrap;
  }
  .rarity-banner.epic{ background:linear-gradient(90deg,#a99bff,#6a5acd); color:#1c1642; }
  .rarity-banner.rare{ background:linear-gradient(90deg,#ffb84d,#ff7a3d); color:#3a1400; }
  .rarity-banner.legendary{
    background:linear-gradient(90deg,#ff9a3d,#ffd23f,#7fd858,#4fb0e0,#b07be0,#ff7ab0);
    background-size:300% 100%; animation: ribbonWiggle 3.4s ease-in-out infinite, rainbow 4s linear infinite; color:#241a09;
  }
  @keyframes ribbonWiggle{ 0%,100%{ transform:translateX(-50%) rotate(-3deg); } 50%{ transform:translateX(-50%) rotate(3deg); } }
  @keyframes rainbow{ 0%{ background-position:0% 0; } 100%{ background-position:300% 0; } }

  .portrait-frame{
    width:172px; height:172px; margin:6px auto 10px; border:4px solid var(--ink); border-radius:16px;
    display:flex; align-items:center; justify-content:center; position:relative; overflow:visible;
    background:var(--cream); transition: background .5s ease;
  }
  .portrait-frame::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.35), transparent 60%); pointer-events:none;
  }
  .portrait-frame svg{ width:88%; height:88%; overflow:visible; animation: floaty 3s ease-in-out infinite; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }

  .fighter-name{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:1.7rem; text-transform:uppercase; letter-spacing:1px; margin:2px 0 12px; }
  .stat-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; text-align:left; }
  .stat{ display:flex; align-items:center; gap:8px; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:.8rem; }
  .stat .icon{ width:22px; height:22px; flex:0 0 auto; }
  .bar-track{ flex:1; height:14px; background:#e9e2cf; border:2.5px solid var(--ink); border-radius:7px; overflow:hidden; display:flex; }
  .bar-fill{ height:100%; transition: width .6s ease; }
  .bar-fill.hp{ background: repeating-linear-gradient(90deg, #e2273f 0 8px, #c21030 8px 10px); }
  .bar-fill.pow{ background: repeating-linear-gradient(90deg, #4f9e2f 0 8px, #3c7d21 8px 10px); }
  .stat-value{ font-size:.75rem; opacity:.75; min-width:26px; text-align:right; }

  .section-label{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:.68rem; letter-spacing:2.5px; text-transform:uppercase; opacity:.55; margin:0 0 8px; }
  .moves{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .move-chip{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:.72rem; text-transform:uppercase;
    letter-spacing:.5px; padding:6px 10px; border:2.5px solid var(--ink); border-radius:20px;
    background:var(--cream); display:flex; align-items:center; gap:5px;
  }
  .move-chip .dot{ width:9px;height:9px;border-radius:50%;background:var(--ink);flex:0 0 auto; }
  .move-chip.super .dot{ animation:pulseDot 1.1s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.6);} }

  .platform{
    position:relative; z-index:1; width:min(70vw, 460px); height:34px; margin-bottom:6px;
    border-radius:50%; background: radial-gradient(closest-side, rgba(0,0,0,.35), rgba(0,0,0,0) 75%); filter:blur(1px);
  }

  .roster{
    position:relative; z-index:2; display:flex; gap:12px; flex-wrap:wrap;
    justify-content:center; max-width:92vw; margin-bottom:3vh;
  }
  .roster-item{
    width:56px; height:56px; border-radius:14px; border:3px solid var(--ink); cursor:pointer;
    padding:0; overflow:hidden; box-shadow:3px 3px 0 var(--ink); opacity:.55; transform:scale(.92);
    transition: opacity .2s ease, transform .2s ease; background:var(--cream);
  }
  .roster-item svg{ width:100%; height:100%; }
  .roster-item.active{ opacity:1; transform:scale(1.06); box-shadow:4px 4px 0 var(--ink); }

  .enter-arena-btn{
    margin-top:18px; width:100%; padding:13px 16px; border:3px solid var(--ink); border-radius:12px;
    background:#e2273f; color:#fffaf0; font:800 1rem 'Baloo 2',sans-serif; letter-spacing:1px;
    cursor:pointer; box-shadow:4px 4px 0 var(--ink); transition:.15s ease;
  }
  .enter-arena-btn:hover{transform:translateY(-2px);filter:saturate(1.15)}

  #arena{ position:fixed; inset:0; z-index:50; display:none; overflow:hidden; background:#0d0519; color:#fffaf0; }
  #arena.active{display:block}
  .arena-world{ position:absolute; inset:0; overflow:hidden; background:linear-gradient(#1c0933 0 38%,#0f071f 38% 65%,#080312 65%); }
  .sky-glow{ position:absolute; inset:-20%; background:radial-gradient(ellipse at 50% 35%,#a855f744,transparent 50%); pointer-events:none; }

  .spotlight{
    position:absolute; top:-40px; width:140px; height:450px;
    background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(200,160,255,0.2) 40%, transparent 100%);
    clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%); pointer-events:none; z-index:2; filter:blur(2px);
    animation: spotPulse 4s ease-in-out infinite alternate;
  }
  .spotlight.s1{ left:12%; } .spotlight.s2{ left:38%; } .spotlight.s3{ left:64%; } .spotlight.s4{ left:85%; }
  @keyframes spotPulse { 0% { opacity: 0.3; } 100% { opacity: 0.85; } }

  .spot-fixture{ position:absolute; top:5px; width:28px; height:28px; border-radius:50%; background:#ffffff; box-shadow:0 0 25px 8px #ffffff, 0 0 50px 15px #b066fe; z-index:3; }
  .spot-fixture.f1{ left:calc(12% + 56px); } .spot-fixture.f2{ left:calc(38% + 56px); } .spot-fixture.f3{ left:calc(64% + 56px); } .spot-fixture.f4{ left:calc(85% + 56px); }

  .parallax{ position:absolute; left:0; width:300%; height:100%; will-change:transform; pointer-events:none; }
  .clouds{top:0;opacity:.2}
  .clouds:before,.clouds:after{ content:"";position:absolute;width:180px;height:55px;border-radius:50%;background:#c084fc33;top:14%;left:8%;box-shadow:520px 80px 0 #c084fc22,980px -30px 0 #c084fc22; }
  .architecture{ top:17%;height:53%;opacity:.85; background: repeating-linear-gradient(90deg,#160a26 0 4%,transparent 4% 8%,#1f0d36 8% 14%); }

  .crowd{ position:absolute;left:0;right:0;top:22%;height:45%; overflow:hidden;pointer-events:none; filter:saturate(.85); }
  .crowd-row{ position:absolute;left:-5%;width:110%;display:flex;gap:10px; align-items:flex-end; white-space:nowrap; animation: crowdSway var(--speed) linear infinite; }
  .crowd-row.r6{top:0%;opacity:.30;--speed:40s; transform: scale(0.55); transform-origin: left bottom;}
  .crowd-row.r5{top:8%;opacity:.40;--speed:34s; transform: scale(0.63); transform-origin: left bottom;}
  .crowd-row.r4{top:17%;opacity:.52;--speed:28s; transform: scale(0.72); transform-origin: left bottom;}
  .crowd-row.r3{top:27%;opacity:.68;--speed:23s; transform: scale(0.81); transform-origin: left bottom;}
  .crowd-row.r2{top:38%;opacity:.84;--speed:18s; transform: scale(0.90); transform-origin: left bottom;}
  .crowd-row.r1{top:50%;opacity:1.0;--speed:14s; transform: scale(1.05); transform-origin: left bottom;}

  .person{ display:inline-block;position:relative;width:20px;height:30px; flex:0 0 20px; animation:personBob var(--bob) ease-in-out infinite alternate; }
  .person:before{ content:"";position:absolute;left:5px;top:0;width:10px;height:10px; border-radius:50%;background:var(--skin);box-shadow:0 1px 0 #0008; }
  .person:after{ content:"";position:absolute;left:2px;top:10px;width:16px;height:20px; border-radius:8px 8px 0 0;background:var(--shirt); box-shadow:inset 0 -3px 0 rgba(0,0,0,0.3); }
  @keyframes crowdSway{from{transform:translateX(0)}to{transform:translateX(-28%)}}
  @keyframes personBob{from{transform:translateY(0)}to{transform:translateY(-2px)}}

  .arena-floor{ position:absolute;left:-100%;right:-100%;bottom:0;height:38%; background:#0a0512; transform-origin:bottom; overflow:hidden; }
  .floor-lines{
    position:absolute;inset:-300px;
    background-image: linear-gradient(45deg, #181824 25%, transparent 25%), linear-gradient(-45deg, #181824 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #181824 75%), linear-gradient(-45deg, transparent 75%, #181824 75%);
    background-size: 80px 80px; background-position: 0 0, 0 40px, 40px -40px, -40px 0px; background-color: #f2f2f7;
    transform:perspective(400px) rotateX(65deg); will-change: transform;
  }

  /* =========================================================
     3D PERSPECTIVE RIG & MOVESET ANIMATION SYSTEM
     ========================================================= */
  .arena-fighter {
    position: absolute; bottom: 25%; width: 170px; height: 210px; z-index: 8;
    transform-origin: center bottom;
    perspective: 900px;
    transform-style: preserve-3d;
    filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.85)) drop-shadow(0 0 28px rgba(180, 100, 255, 0.7));
  }

  .arena-fighter svg {
    width: 100%; height: 100%; overflow: visible;
    transform-origin: center bottom;
    transform-style: preserve-3d;
    backface-visibility: visible;
    will-change: transform;
    transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .arena-fighter.face-right svg { transform: rotate3d(0, 1, 0, 0deg); }
  .arena-fighter.face-left svg { transform: rotate3d(0, 1, 0, 180deg); }

  /* 3D Arc-Jump Turn Pivot */
  .arena-fighter.turning svg {
    animation: turn3DPivot 0.34s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes turn3DPivot {
    0% { transform: rotate3d(0, 1, 0, var(--from-deg, 0deg)) translateY(0) scale(1, 1); }
    40% { transform: rotate3d(0, 1, 0, calc(var(--from-deg, 0deg) + (var(--to-deg, 180deg) - var(--from-deg, 0deg)) * 0.5)) translateY(-22px) scale(0.8, 1.18) rotateZ(var(--turn-skew, -8deg)); }
    75% { transform: rotate3d(0, 1, 0, calc(var(--to-deg, 180deg) + var(--turn-overshoot, 18deg))) translateY(-4px) scale(1.1, 0.9); }
    100% { transform: rotate3d(0, 1, 0, var(--to-deg, 180deg)) translateY(0) scale(1, 1); }
  }

  .arena-fighter::after {
    content: ""; position: absolute; bottom: -10px; left: 20%; width: 60%; height: 16px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.65) 0%, transparent 75%);
    border-radius: 50%; z-index: -1; transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .arena-fighter.turning::after { transform: scale(0.45, 0.35) translateY(8px); opacity: 0.3; }

  /* Unique Character Strengths Animations */
  .arena-fighter.attack-ultaclownsy svg { animation: clownseyFart 0.58s ease-in-out forwards; }
  @keyframes clownseyFart {
    0% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateY(0); }
    30% { transform: rotate3d(0,1,0, calc(var(--current-deg,0deg) + 180deg)) translateY(16px) rotateZ(-22deg); }
    60% { transform: rotate3d(0,1,0, calc(var(--current-deg,0deg) + 180deg)) translateY(22px) scale(1.2, 0.8); }
    100% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateY(0); }
  }

  .arena-fighter.attack-bullygan svg { animation: bullySwing 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes bullySwing {
    0% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateX(0); }
    35% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateX(-25px) rotateZ(-15deg); }
    70% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateX(60px) scale(1.25, 0.85); }
    100% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateX(0); }
  }

  .arena-fighter.attack-jansina svg { animation: jansinaPunch 0.38s cubic-bezier(0.12, 0, 0.39, 0); }
  @keyframes jansinaPunch {
    0% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateX(0); }
    30% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateX(-35px) rotateZ(-18deg); }
    65% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateX(85px) scale(1.35, 0.8); }
    100% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateX(0); }
  }

  .arena-fighter.attack-electro svg { animation: electroZap 0.4s ease-out; }
  @keyframes electroZap {
    0% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) scale(1); }
    50% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateX(55px) scale(1.22, 0.88) skewX(-14deg); }
    100% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) scale(1); }
  }

  /* Moveset Projectiles */
  .projectile {
    position: absolute; z-index: 25; pointer-events: none; width: 65px; height: 65px;
    font-size: 2.5rem; display: flex; align-items: center; justify-content: center;
    animation: flyProjectile 0.48s linear forwards;
  }
  @keyframes flyProjectile {
    0% { transform: translate(var(--startX), var(--startY)) scale(0.6) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--endX), var(--startY)) scale(1.5) rotate(720deg); opacity: 0.9; }
  }

  .stink-cloud {
    position: absolute; z-index: 24; pointer-events: none; width: 100px; height: 100px;
    background: radial-gradient(circle, rgba(140,220,0,0.88) 0%, rgba(60,120,0,0) 70%);
    border-radius: 50%; filter: blur(4px); animation: stinkExpand 0.8s ease-out forwards;
  }
  @keyframes stinkExpand {
    0% { transform: translate(var(--startX), var(--startY)) scale(0.2); opacity: 0.95; }
    100% { transform: translate(var(--endX), calc(var(--startY) - 35px)) scale(2.4); opacity: 0; }
  }

  .arena-fighter.hit {
    filter: brightness(2.2) saturate(.3) drop-shadow(0 0 25px #ff1144) !important;
    animation: takeDamage 0.25s cubic-bezier(0.36, 0.07, 0.19, 0.97) !important;
  }
  @keyframes takeDamage {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-18px) rotate(-6deg); }
    40%, 80% { transform: translateX(14px) rotate(4deg); }
  }

  .arena-legs { display: none; }
  .has-arena-legs .arena-legs { display: block; }

  .walking.has-arena-legs .arena-legs .leg-left {
    animation: legWalkLeft 0.26s linear infinite alternate;
    transform-origin: 47px 112px;
  }
  .walking.has-arena-legs .arena-legs .leg-right {
    animation: legWalkRight 0.26s linear infinite alternate;
    transform-origin: 67px 112px;
  }
  .walking svg { animation: walkBob 0.26s ease-in-out infinite alternate; }

  @keyframes legWalkLeft { 0% { transform: rotate(-28deg) translateY(-4px); } 100% { transform: rotate(24deg) translateY(2px); } }
  @keyframes legWalkRight { 0% { transform: rotate(24deg) translateY(2px); } 100% { transform: rotate(-28deg) translateY(-4px); } }
  @keyframes walkBob {
    0% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateY(0) rotate(-1.5deg); }
    100% { transform: rotate3d(0,1,0, var(--current-deg,0deg)) translateY(-6px) rotate(2deg); }
  }

  .arena-ui{ position:absolute;inset:0;z-index:10;pointer-events:none; }
  .arena-top{ position:absolute;top:14px;left:20px;right:20px; display:flex;align-items:center;justify-content:space-between; }
  .fighter-hud{ width:min(36vw,360px);background:#fffaf0ee;color:#191512; border:3px solid #191512;border-radius:12px;padding:8px 12px; box-shadow:4px 4px 0 #191512; }
  .fighter-hud.right{text-align:right}
  .hud-name{font:800 1rem 'Baloo 2';text-transform:uppercase}
  .hp-track{height:15px;border:2px solid #191512;background:#d9d0bf;border-radius:8px;overflow:hidden}
  .hp-fill{height:100%;background:#e2273f;transition:width .2s}
  .hud-status{font-size:.7rem;opacity:.65;margin-top:3px}
  .round{ font:800 1rem 'Baloo 2';padding:7px 12px;background:#e2273f; border:3px solid #191512;border-radius:10px;box-shadow:3px 3px 0 #191512; }

  .arena-controls{ position:absolute;left:50%;bottom:15px;transform:translateX(-50%); display:flex;gap:8px;align-items:center;pointer-events:auto; }
  .control-btn{ border:3px solid #191512;background:#fffaf0;color:#191512; border-radius:10px;padding:9px 12px;min-width:62px; font:800 .78rem 'Baloo 2';cursor:pointer;box-shadow:3px 3px 0 #191512; }
  .control-btn.attack{background:#e2273f;color:white}
  .mode-pill{ position:absolute;left:50%;bottom:68px;transform:translateX(-50%); background:#191512dd;border:2px solid #fffaf0;padding:5px 10px;border-radius:20px; font:700 .7rem 'Baloo 2';white-space:nowrap; }
  .close-arena{ position:absolute;right:18px;bottom:15px;z-index:20;pointer-events:auto; }
  .hit-flash{ position:absolute;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none; }
  .hit-flash.on{animation:flash .13s ease}
  @keyframes flash{0%{opacity:.5}100%{opacity:0}}

/* Render UI Menu */
const stage = document.getElementById('stage');
const card = document.getElementById('card');
const rarityBanner = document.getElementById('rarityBanner');
const portraitFrame = document.getElementById('portraitFrame');
const fighterName = document.getElementById('fighterName');
const hpBar = document.getElementById('hpBar');
const powBar = document.getElementById('powBar');
const hpVal = document.getElementById('hpVal');
const powVal = document.getElementById('powVal');
const movesEl = document.getElementById('moves');
const rosterEl = document.getElementById('roster');

let current = 3;

function renderRoster(){
  rosterEl.innerHTML = fighters.map((f,i) => `
    <button class="roster-item ${i===current?'active':''}" data-index="${i}" aria-label="Select ${f.name}">${f.svg}</button>
  `).join('');
  rosterEl.querySelectorAll('.roster-item').forEach(btn=>{
    btn.addEventListener('click', ()=> goTo(parseInt(btn.dataset.index,10)));
  });
}

function render(){
  const f = fighters[current];
  stage.style.background = `radial-gradient(120% 90% at 50% 20%, ${f.colors.bg1}, ${f.colors.bg2})`;
  card.style.borderColor = f.box; portraitFrame.style.background = f.box;
  rarityBanner.textContent = f.rarity; rarityBanner.className = 'rarity-banner ' + f.rarity;
  portraitFrame.innerHTML = f.svg; fighterName.textContent = f.name;
  hpBar.style.width = (f.hp / f.hpMax * 100) + '%'; hpVal.textContent = f.hp + '/' + f.hpMax;
  powBar.style.width = (f.pow / f.powMax * 100) + '%'; powVal.textContent = '+' + f.pow;
  movesEl.innerHTML = f.moves.map(m => `<span class="move-chip ${m.super ? 'super' : ''}"><span class="dot"></span>${m.label}</span>`).join('');
  renderRoster();
}

function goTo(index){ current = (index + fighters.length) % fighters.length; render(); }
document.getElementById('prevBtn').addEventListener('click', ()=> goTo(current - 1));
document.getElementById('nextBtn').addEventListener('click', ()=> goTo(current + 1));
render();
</script>

    </div>

    <div class="mode-pill" id="modePill">BOT MATCH · A/D MOVE · W JUMP · SPACE ATTACK</div>
    <div class="arena-controls">
      <button class="control-btn" data-key="a">←</button>
      <button class="control-btn" data-key="w">↑</button>
      <button class="control-btn attack" data-key=" ">ATTACK</button>
      <button class="control-btn" data-key="d">→</button>
    </div>
    <button class="control-btn close-arena" id="leaveArena">EXIT</button>
  </div>
  <div class="hit-flash" id="hitFlash"></div>
</div>

<script>
(() => {
  const enter = document.getElementById('enterArenaBtn');
  const arena = document.getElementById('arena');
  const world = document.getElementById('arenaWorld');
  const playerEl = document.getElementById('playerFighter');
  const enemyEl = document.getElementById('enemyFighter');
  const playerName = document.getElementById('playerName');
  const enemyName = document.getElementById('enemyName');
  const playerHp = document.getElementById('playerHp');
  const enemyHp = document.getElementById('enemyHp');
  const flash = document.getElementById('hitFlash');
  const floorLines = document.getElementById('floorLines');
  const crowd = document.getElementById('crowd');

  /* Build Spectators */
  const skins = ['#d59a78','#efb88d','#9a6248','#f0c7a0','#76503f'];
  const shirts = ['#e2273f','#4f8fe0','#ffd23f','#55a77b','#a86bdb','#e88937','#fffaf0'];
  for(let r=6;r>=1;r--){
    const row=document.createElement('div'); row.className='crowd-row r'+r;
    for(let i=0;i<52;i++){
      const p=document.createElement('span'); p.className='person';
      p.style.setProperty('--skin',skins[(i+r)%skins.length]);
      p.style.setProperty('--shirt',shirts[(i*3+r)%shirts.length]);
      p.style.setProperty('--bob',(1.1+(i%7)*.22)+'s');
      p.style.animationDelay=(-((i*0.31+r)*0.17))+'s';
      row.appendChild(p);
    }
    crowd.appendChild(row);
  }

  let player, enemy, playerHP, enemyHP, px, ex, vy;
  let playerFacing = 1, enemyFacing = -1;
  let keys = new Set(), running = false, last = 0, enemyThink = 0;
  let arenaScroll = 0;

  function pickEnemy(){
    const choices=fighters.filter(f => f.id !== fighters[current].id);
    return choices[Math.floor(Math.random()*choices.length)];
  }

  function setupFighterRig(el, f) {
    el.innerHTML = f.svg;
    el.setAttribute('data-id', f.id);
    if(f.hasArenaLegs) el.classList.add('has-arena-legs');
    else el.classList.remove('has-arena-legs');
  }

  function setOrientation(el, newFacing, currentFacing) {
    if (newFacing !== currentFacing) {
      const fromDeg = currentFacing === 1 ? 0 : 180;
      const toDeg = newFacing === 1 ? 0 : 180;
      const skew = newFacing === 1 ? '-6deg' : '6deg';
      const overshoot = newFacing === 1 ? '-12deg' : '12deg';

      el.style.setProperty('--from-deg', `${fromDeg}deg`);
      el.style.setProperty('--to-deg', `${toDeg}deg`);
      el.style.setProperty('--current-deg', `${toDeg}deg`);
      el.style.setProperty('--turn-skew', skew);
      el.style.setProperty('--turn-overshoot', overshoot);

      el.classList.remove('turning'); void el.offsetWidth;
      el.classList.add('turning');

      if (newFacing === 1) { el.classList.add('face-right'); el.classList.remove('face-left'); }
      else { el.classList.add('face-left'); el.classList.remove('face-right'); }

      setTimeout(() => el.classList.remove('turning'), 340);
      return newFacing;
    }
    return currentFacing;
  }

  function openArena(){
    player = fighters[current]; enemy = pickEnemy();
    playerHP = player.hpMax; enemyHP = enemy.hpMax;
    px = window.innerWidth * .22; ex = window.innerWidth * .70; vy = 0;
    playerFacing = 1; enemyFacing = -1;

    setupFighterRig(playerEl, player);
    setupFighterRig(enemyEl, enemy);

    playerFacing = setOrientation(playerEl, 1, -1);
    enemyFacing = setOrientation(enemyEl, -1, 1);

    playerName.textContent = player.name; enemyName.textContent = enemy.name;
    arena.classList.add('active'); arena.setAttribute('aria-hidden','false');
    running = true; last = performance.now();
    requestAnimationFrame(loop);
  }

  function closeArena(){ running = false; arena.classList.remove('active'); arena.setAttribute('aria-hidden','true'); }
  function updateHud(){ playerHp.style.width = Math.max(0, playerHP / player.hpMax * 100) + '%'; enemyHp.style.width = Math.max(0, enemyHP / enemy.hpMax * 100) + '%'; }
  function flashHit(){ flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on'); }

  function executeCharacterMove(attacker, fighter) {
    const isPlayer = attacker === 'p';
    const attackerEl = isPlayer ? playerEl : enemyEl;
    const startX = isPlayer ? px : ex;
    const endX = isPlayer ? ex : px;

    attackerEl.classList.add(`attack-${fighter.id}`);
    setTimeout(() => attackerEl.classList.remove(`attack-${fighter.id}`), 580);

    if (fighter.id === 'ultaclownsy') {
      const cloud = document.createElement('div');
      cloud.className = 'stink-cloud';
      cloud.style.setProperty('--startX', `${startX}px`);
      cloud.style.setProperty('--startY', `280px`);
      cloud.style.setProperty('--endX', `${endX}px`);
      world.appendChild(cloud);
      setTimeout(() => cloud.remove(), 800);
    } 
    else if (['giya', 'bananaflip', 'bullygan'].includes(fighter.id)) {
      const proj = document.createElement('div');
      proj.className = 'projectile';
      proj.style.setProperty('--startX', `${startX}px`);
      proj.style.setProperty('--startY', `260px`);
      proj.style.setProperty('--endX', `${endX}px`);
      proj.innerHTML = fighter.id === 'giya' ? '🔥' : (fighter.id === 'bananaflip' ? '🍌' : '💣');
      world.appendChild(proj);
      setTimeout(() => proj.remove(), 480);
    }
  }

  function attack(attacker, target, amount){
    const fighter = attacker === 'p' ? player : enemy;
    executeCharacterMove(attacker, fighter);

    if(attacker==='p'){
      enemyHP = Math.max(0, enemyHP - amount);
      enemyEl.classList.remove('hit'); void enemyEl.offsetWidth; enemyEl.classList.add('hit');
    } else {
      playerHP = Math.max(0, playerHP - amount);
      playerEl.classList.remove('hit'); void playerEl.offsetWidth; playerEl.classList.add('hit');
    }
    flashHit(); updateHud();

    if(playerHP<=0 || enemyHP<=0){
      setTimeout(() => alert((enemyHP<=0?player.name:enemy.name) + ' WINS!'), 100);
      setTimeout(openArena, 400);
    }
  }

  function doPlayerAttack(){ if(running) attack('p','e',Math.max(1,player.pow)); }
  function doBotAttack(){ if(running) attack('e','p',Math.max(1,enemy.pow)); }

  function loop(t){
    if(!running) return;
    const dt = Math.min(.033, (t - last) / 1000); last = t;

    let isWalking = false;
    if(keys.has('a')) { px -= 260 * dt; playerFacing = setOrientation(playerEl, -1, playerFacing); isWalking = true; }
    if(keys.has('d')) { px += 260 * dt; playerFacing = setOrientation(playerEl, 1, playerFacing); isWalking = true; }
    if(keys.has('w') && Math.abs(vy) < 1) vy = -540;

    if(isWalking) playerEl.classList.add('walking'); else playerEl.classList.remove('walking');

    vy += 1280 * dt; px = Math.max(40, Math.min(innerWidth - 210, px));
    window.__playerY = (window.__playerY || 0) + vy * dt;
    if(window.__playerY > 0) { window.__playerY = 0; vy = 0; }

    playerEl.style.left = px + 'px';
    playerEl.style.bottom = (25 + (-window.__playerY / 14)) + '%';

    enemyThink -= dt;
    const dist = px - ex;
    let enemyMoving = false;
    if(dist > 135) { ex += 145 * dt; enemyFacing = setOrientation(enemyEl, 1, enemyFacing); enemyMoving = true; }
    else if(dist < -135) { ex -= 145 * dt; enemyFacing = setOrientation(enemyEl, -1, enemyFacing); enemyMoving = true; }

    if(enemyMoving) enemyEl.classList.add('walking'); else enemyEl.classList.remove('walking');

    if(enemyThink <= 0){
      enemyThink = .45 + Math.random() * .65;
      if(Math.abs(dist) < 160 && Math.random() < .75) doBotAttack();
    }

    ex = Math.max(40, Math.min(innerWidth - 210, ex));
    enemyEl.style.right = 'auto'; enemyEl.style.left = ex + 'px';

    arenaScroll += ((px - innerWidth * .22) * .035);
    floorLines.style.transform = `perspective(400px) rotateX(65deg) translateX(${-arenaScroll % 80}px)`;

    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', e => {
    if(!running) return;
    const k = e.key.toLowerCase();
    if(['a','d','w',' '].includes(k)){ e.preventDefault(); keys.add(k); }
    if(k === ' ' && !e.repeat) doPlayerAttack();
  });
  document.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

  enter.addEventListener('click', openArena);
  document.getElementById('leaveArena').addEventListener('click', closeArena);
})();
</script>

</body>
</html>
