<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATTAKK - Character Selection (v2)</title>
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --accent-color: #ff2a5f;
      --card-glow: rgba(255, 42, 95, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #05070d;
      font-family: 'Impact', 'Arial Black', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    /* 16:9 Landscape Screen Frame */
    .game-screen {
      position: relative;
      width: 90vw;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: visible; /* Modified to allow Jansina's punch outside the frame */
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px var(--card-glow);
      border: 3px solid rgba(255, 255, 255, 0.2);
      transition: box-shadow 0.6s ease;
      background: #101424;
      display: flex;
      flex-direction: column;
    }

    /* Background Canvas & Platform */
    .bg-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: 13px; /* Match inner radius */
      transition: background 0.8s ease;
    }

    .platform {
      position: absolute;
      bottom: 12%;
      left: 10%;
      width: 45%;
      height: 35px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      border-radius: 50%;
      filter: blur(4px);
      box-shadow: 0 10px 30px var(--accent-color);
      transform: rotateX(70deg);
      transition: box-shadow 0.6s ease;
    }

    /* Header Title */
    .header {
      position: relative;
      z-index: 10;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent);
    }

    .game-logo {
      font-size: 2.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-style: italic;
      text-shadow: 3px 3px 0px #000, 0 0 15px var(--accent-color);
    }

    /* Character Display Area */
    .showcase {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
    }

    /* Character Stage: Centered platform for character */
    .character-stage {
      position: relative;
      width: 45%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 30px;
    }

    /* Character Portrait Frame: Recreating original sketch boxes */
    .char-portrait-frame {
      position: absolute;
      border: 3px solid #000;
      background: #eee;
      width: 250px;
      height: 250px;
      bottom: 50px;
      left: 20px;
      overflow: visible; /* Important for Jansina's punch! */
      box-shadow: 5px 5px 0px #000;
    }

    /* Target background colors for the portrait frame */
    .p-frame-jansina { background-color: #2b998f; } /* Dark teal */
    .p-frame-giya { background-color: #c4ca4d; }    /* Olive yellow */
    .p-frame-viking { background-color: #e32636; }  /* Alizarin red */

    .character-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
    }

    /* Stats Card (Right Side) */
    .stats-card {
      width: 45%;
      background: rgba(12, 16, 28, 0.85);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes slideIn {
      from { transform: translateX(30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .hero-name {
      font-size: 2.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .rarity-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
      box-shadow: 0 0 12px currentColor;
    }

    .rarity-epic { background: #9d22ff; color: #fff; }
    .rarity-legendary { background: #ffaa00; color: #000; }

    /* Meter Bars (HP & Energy) */
    .stat-row { margin-bottom: 12px; }

    .stat-label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      font-family: sans-serif;
      font-weight: bold;
    }

    .bar-container { display: flex; gap: 6px; height: 20px; }

    .bar-segment {
      flex: 1;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: background 0.3s ease;
    }

    .bar-segment.filled-hp {
      background: linear-gradient(180deg, #ff4e4e, #c01111);
      box-shadow: 0 0 8px #ff4e4e;
    }

    .bar-segment.filled-energy {
      background: linear-gradient(180deg, #4eff7b, #11c045);
      box-shadow: 0 0 8px #4eff7b;
    }

    /* Attack Move Badges */
    .attacks-title {
      font-size: 0.9rem;
      color: #888;
      margin: 16px 0 8px 0;
      font-family: sans-serif;
      text-transform: uppercase;
    }

    .attacks-grid { display: flex; gap: 12px; }

    .attack-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      transition: transform 0.2s;
    }

    .attack-name { font-size: 1rem; color: #fff; margin-top: 4px; text-transform: uppercase; }
    .attack-icon { font-size: 1.5rem; }

    /* Footer Selector Bar */
    .controls-bar {
      position: relative;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px;
      display: flex;
      justify-content: center;
      gap: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hero-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 24px;
      border-radius: 30px;
      font-family: inherit;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-btn:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
    .hero-btn.active {
      border-color: #fff;
      background: var(--accent-color);
      box-shadow: 0 0 20px var(--accent-color);
      transform: scale(1.05);
    }

    /* Custom Animations */
    
    /* Jansina Fist Pump: Moves OUTSIDE of the SVG viewbox / portrait frame! */
    .jansina-fist-pump {
      animation: fistPumpBurst 5s infinite;
      transform-origin: 30% 60%; /* Base of the arm */
    }
    @keyframes fistPumpBurst {
      0%, 80%, 100% { transform: scale(1) translate(0, 0); }
      85% { transform: scale(1.2) translate(110px, -70px); } /* Punch up and out! */
      90% { transform: scale(1) translate(100px, -60px); }
    }

    /* Giya Flame Flicker */
    .flame-flicker {
      animation: fireFlicker 0.6s infinite alternate ease-in-out;
    }
    @keyframes fireFlicker {
      0% { opacity: 0.8; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    /* Viking Axe Tilt */
    .axe-tilt {
      animation: axeTiltMove 2s infinite alternate ease-in-out;
      transform-origin: center;
    }
    @keyframes axeTiltMove {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(12deg); }
    }
  </style>
</head>
<body>

  <div class="game-screen" id="gameScreen">
    <!-- Dynamic Background -->
    <div class="bg-layer" id="bgLayer"></div>

    <!-- Header -->
    <div class="header">
      <div class="game-logo">ATTAKK</div>
      <div style="font-family: sans-serif; font-size: 0.85rem; color: #888;">SELECT HERO</div>
    </div>

    <!-- Main Character & Stats Showcase Area -->
    <div class="showcase">
      
      <!-- Left: Character Stage -->
      <div class="character-stage">
        <div class="platform"></div>
        
        <!-- Portrait Frame Box (Stylized like the sketch) -->
        <div class="char-portrait-frame" id="charPortrait">
          <div id="characterContainer">
            <!-- SVG injected by JS -->
          </div>
        </div>
      </div>

      <!-- Right: Detailed Stats Card -->
      <div class="stats-card" id="statsCard">
        <!-- Content injected by JS -->
      </div>

    </div>

    <!-- Bottom Selection Navigation -->
    <div class="controls-bar">
      <button class="hero-btn active" onclick="selectHero(0)" id="btn-0"><span>1.</span> JANSINA</button>
      <button class="hero-btn" onclick="selectHero(1)" id="btn-1"><span>2.</span> GIYA</button>
      <button class="hero-btn" onclick="selectHero(2)" id="btn-2"><span>3.</span> VIKING</button>
    </div>
  </div>

  <script>
    // Hero Data
    const heroes = [
      {
        id: "jansina",
        name: "Jansina",
        frameClass: "p-frame-jansina",
        rarity: "EPIC",
        rarityClass: "rarity-epic",
        hp: 6, maxHp: 8, energy: 2, maxEnergy: 5,
        themeColor: "#ff2a5f",
        bgGradient: "radial-gradient(circle at 30% 60%, #3a0d25 0%, #0d1124 70%)",
        attacks: [{ name: "SUPER ATTACK", icon: "🥊" }, { name: "CLAW SLAP (+2)", icon: "🖐️" }],
        svg: `
          <svg class="character-svg" viewBox="0 0 200 200">
            <!-- Body: Blue Shirt -->
            <path d="M 60 130 Q 100 110 140 130 L 150 200 L 50 200 Z" fill="#0077ff" />
            
            <!-- Round Red Face -->
            <circle cx="100" cy="85" r="35" fill="#e60039" />
            
            <!-- Yellow Forehead Spot (Replaces hair) -->
            <ellipse cx="100" cy="62" rx="12" ry="7" fill="#ffd700" />
            
            <!-- NEW EYES: Visible now -->
            <!-- Left Eye (Black Dot) -->
            <circle cx="85" cy="80" r="4" fill="#000" />
            <!-- Right Eye (White Sclera with Pupil) -->
            <circle cx="115" cy="80" r="8" fill="#fff" />
            <circle cx="115" cy="80" r="4" fill="#000" />

            <!-- TEETH Grid: Moved down on the face -->
            <rect x="80" y="100" width="40" height="15" rx="3" fill="#111" />
            <rect x="84" y="103" width="8" height="9" fill="#fff" />
            <rect x="96" y="103" width="8" height="9" fill="#fff" />
            <rect x="108" y="103" width="8" height="9" fill="#fff" />
            
            <!-- Arm and FIST PUMP: Occasional massive punch UP and OUT -->
            <g class="jansina-fist-pump">
              <!-- Arm connecting to shirt -->
              <path d="M 65 140 Q 60 120 70 100" stroke="#0077ff" stroke-width="12" stroke-linecap="round" fill="none" />
              <!-- Giant Red Fist -->
              <circle cx="70" cy="95" r="28" fill="#e60039" />
              <rect x="55" y="80" width="28" height="28" rx="6" fill="#b3002d" />
            </g>
          </svg>
        `
      },
      {
        id: "giya",
        name: "Giya",
        frameClass: "p-frame-giya",
        rarity: "LEGENDARY",
        rarityClass: "rarity-legendary",
        hp: 5, maxHp: 8, energy: 4, maxEnergy: 5,
        themeColor: "#ffaa00",
        bgGradient: "radial-gradient(circle at 30% 60%, #4a3300 0%, #0d1124 70%)",
        attacks: [{ name: "FIREBOL", icon: "🔥" }, { name: "THUNDER SLAP", icon: "⚡" }],
        svg: `
          <svg class="character-svg" viewBox="0 0 200 200">
            <!-- Body/Teal Shirt -->
            <path d="M 65 130 Q 100 120 135 130 L 145 200 L 55 200 Z" fill="#0055ff" />
            
            <!-- Head -->
            <circle cx="100" cy="95" r="32" fill="#d9a05b" />
            <!-- Red Eyes -->
            <circle cx="88" cy="92" r="6" fill="#ff0000" />
            <circle cx="112" cy="92" r="6" fill="#ff0000" />
            
            <!-- HAIR: Dramatic, spiky golden hair (Replaces Crown) -->
            <path d="M 68 75 L 60 40 L 80 60 L 90 20 L 105 55 L 125 15 L 130 60 L 145 35 L 132 75 Z" fill="#ffd700" stroke="#ccac00" stroke-width="2"/>
            
            <!-- Arms visible holding flames -->
            <!-- Left Arm -->
            <path d="M 65 140 Q 40 130 35 110" stroke="#0055ff" stroke-width="10" stroke-linecap="round" fill="none"/>
            <!-- Right Arm -->
            <path d="M 135 140 Q 160 130 165 110" stroke="#0055ff" stroke-width="10" stroke-linecap="round" fill="none"/>

            <!-- Flames in each hand -->
            <g class="flame-flicker">
              <!-- Left Flame -->
              <path d="M 35 110 Q 25 80 40 70 Q 55 80 45 110 Z" fill="#ff4500" />
              <path d="M 37 105 Q 30 85 40 80 Q 47 85 41 105 Z" fill="#ffcc00" />
              <!-- Right Flame -->
              <path d="M 165 110 Q 175 80 160 70 Q 145 80 155 110 Z" fill="#ff4500" />
              <path d="M 163 105 Q 170 85 160 80 Q 153 85 159 105 Z" fill="#ffcc00" />
            </g>
          </svg>
        `
      },
      {
        id: "viking",
        name: "Viking",
        frameClass: "p-frame-viking",
        rarity: "EPIC",
        rarityClass: "rarity-epic",
        hp: 7, maxHp: 8, energy: 3, maxEnergy: 5,
        themeColor: "#00d2ff",
        bgGradient: "radial-gradient(circle at 30% 60%, #082d38 0%, #0d1124 70%)",
        attacks: [{ name: "TRIO AX SPIN", icon: "🪓" }, { name: "AXE CHOP", icon: "⚔️" }],
        svg: `
          <svg class="character-svg" viewBox="0 0 200 200">
            <!-- Spiked Armor Body -->
            <path d="M 55 125 L 145 125 L 155 200 L 45 200 Z" fill="#4a5568" />
            <path d="M 45 125 L 35 110 L 52 120 Z" fill="#cbd5e0" />
            <path d="M 155 125 L 165 110 L 148 120 Z" fill="#cbd5e0" />
            <!-- Head -->
            <rect x="70" y="65" width="60" height="60" rx="10" fill="#d9a05b" />
            <circle cx="85" cy="85" r="5" fill="#000" />
            <circle cx="115" cy="85" r="5" fill="#000" />
            <path d="M 70 100 Q 100 130 130 100 Z" fill="#333" />
            <!-- Helmet with Horns -->
            <path d="M 65 70 Q 100 50 135 70 Z" fill="#2d3748" />
            <path d="M 68 65 Q 45 40 40 20 Q 55 35 62 55 Z" fill="#e2e8f0" />
            <path d="M 132 65 Q 155 40 160 20 Q 145 35 138 55 Z" fill="#e2e8f0" />
            <!-- Axes floating -->
            <g class="axe-tilt">
              <path d="M 150 140 L 175 115" stroke="#718096" stroke-width="4" />
              <path d="M 165 110 C 180 115 180 130 165 130 Z" fill="#cbd5e0" />
              <path d="M 30 140 L 10 115" stroke="#718096" stroke-width="4" />
              <path d="M 15 110 C 0 115 0 130 15 130 Z" fill="#cbd5e0" />
            </g>
          </svg>
        `
      }
    ];

    let currentHeroIndex = 0;

    function renderHero(index) {
      const hero = heroes[index];
      
      // Update Root CSS variables for Dynamic Glowing Effect
      document.documentElement.style.setProperty('--accent-color', hero.themeColor);
      document.documentElement.style.setProperty('--card-glow', `${hero.themeColor}66`);
      
      // Update Screen Background Gradient
      document.getElementById('bgLayer').style.background = hero.bgGradient;

      // Set portrait frame background and apply class
      const portrait = document.getElementById('charPortrait');
      portrait.className = `char-portrait-frame ${hero.frameClass}`;

      // Render Character SVG
      document.getElementById('characterContainer').innerHTML = hero.svg;

      // Build Health & Energy Segments
      let hpSegments = '';
      for (let i = 0; i < hero.maxHp; i++) {
        hpSegments += `<div class="bar-segment ${i < hero.hp ? 'filled-hp' : ''}"></div>`;
      }
      let energySegments = '';
      for (let i = 0; i < hero.maxEnergy; i++) {
        energySegments += `<div class="bar-segment ${i < hero.energy ? 'filled-energy' : ''}"></div>`;
      }

      // Build Attack Cards
      let attackCards = hero.attacks.map(atk => `<div class="attack-card"><div class="attack-icon">${atk.icon}</div><div class="attack-name">${atk.name}</div></div>`).join('');

      // Render Stats Card with animation reset
      const statsCard = document.getElementById('statsCard');
      statsCard.style.animation = 'none';
      statsCard.offsetHeight; // trigger reflow
      statsCard.style.animation = 'slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

      statsCard.innerHTML = `
        <div class="hero-header">
          <div class="hero-name">${hero.name}</div>
          <div class="rarity-badge ${hero.rarityClass}">${hero.rarity}</div>
        </div>
        <div class="stat-row">
          <div class="stat-label"><span>HEALTH</span><span>${hero.hp} / ${hero.maxHp} HP</span></div>
          <div class="bar-container">${hpSegments}</div>
        </div>
        <div class="stat-row">
          <div class="stat-label"><span>ENERGY / MANA</span><span>${hero.energy} / ${hero.maxEnergy}</span></div>
          <div class="bar-container">${energySegments}</div>
        </div>
        <div class="attacks-title">SPECIAL ABILITIES</div>
        <div class="attacks-grid">${attackCards}</div>
      `;

      // Update Active Navigation Button
      heroes.forEach((_, i) => {
        const btn = document.getElementById(`btn-${i}`);
        if (i === index) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    function selectHero(index) {
      currentHeroIndex = index;
      renderHero(currentHeroIndex);
    }

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') selectHero((currentHeroIndex + 1) % heroes.length);
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') selectHero((currentHeroIndex - 1 + heroes.length) % heroes.length);
      else if (e.key === '1') selectHero(0); else if (e.key === '2') selectHero(1); else if (e.key === '3') selectHero(2);
    });

    // Initialize initial hero display
    renderHero(0);
  </script>
</body>
</html>
