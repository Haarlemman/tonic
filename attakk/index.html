<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>ATTACK ARENA — Choose Your Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6efdd;
    --ink:#191512;
    --cream:#fffaf0;

    /* Jansina — bright yellow background / red & yellow face / blue body */
    --jan-1:#e6ac00;
    --jan-2:#8c6900;
    --jan-glow:#ffe156;
    --jan-accent:#e2273f;

    /* Viking — blue background / black pointy mask / studded collar */
    --vik-1:#4a82cd;
    --vik-2:#1c3d69;
    --vik-glow:#8ebbf5;
    --vik-accent:#a0e6d2;

    /* Giya — purple background / spiky flame hair / fiery hands */
    --giy-1:#8e56c9;
    --giy-2:#401b63;
    --giy-glow:#c28eff;
    --giy-accent:#ff7a1a;

    /* Bannana Flip — yellow/brown */
    --ban-1:#c99a12;
    --ban-2:#5e4306;

    /* Bully Gan — teal/robot */
    --bul-1:#2b6b63;
    --bul-2:#0e2b27;

    /* Electro — electric blue */
    --ele-1:#1f6fae;
    --ele-2:#0b2c47;

    /* Ulta Clownsy — carnival red/purple */
    --clo-1:#7a1f4b;
    --clo-2:#2e0a1f;

    /* Killroy — vivid magenta / deep green */
    --kil-1:#9d2b6c;
    --kil-2:#3b0a2c;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Nunito', sans-serif;
    overflow:hidden;
    color:var(--cream);
  }

  .stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; flex-direction:column; align-items:center;
    justify-content:space-between;
    background: radial-gradient(120% 90% at 50% 20%, var(--jan-1), var(--jan-2));
    transition: background 0.7s ease;
    isolation:isolate;
  }

  /* subtle hand-drawn paper grain */
  .grain{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    opacity:.10; mix-blend-mode:overlay;
    background-image: radial-gradient(circle, #000 1px, transparent 1.4px);
    background-size: 5px 5px;
  }

  /* wobble ring behind the card */
  .scribble-ring{
    position:absolute; top:50%; left:50%; z-index:0; pointer-events:none;
    width:min(70vw,640px); height:min(70vw,640px);
    transform:translate(-50%,-52%);
    opacity:.35;
    animation: spin 40s linear infinite;
  }
  .scribble-ring svg{ width:100%; height:100%; }
  @keyframes spin{ to{ transform:translate(-50%,-52%) rotate(360deg);} }

  /* ---------- Title ---------- */
  .title-wrap{
    position:relative; z-index:2;
    text-align:center;
    margin-top:2.2vh;
  }
  .game-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(2.1rem, 5vw, 3.6rem);
    margin:0;
    letter-spacing:1px;
    color:var(--cream);
    text-shadow: 4px 4px 0 var(--ink), -1px -1px 0 var(--ink);
    -webkit-text-stroke: 2px var(--ink);
  }
  .game-title .arena{
    display:inline-block;
    font-size:.5em;
    vertical-align:middle;
    margin-left:.4em;
    padding:.25em .6em;
    background:var(--jan-accent);
    border:3px solid var(--ink);
    border-radius:10px;
    transform:rotate(-3deg);
    -webkit-text-stroke:0;
    box-shadow:3px 3px 0 var(--ink);
  }
  .subtitle{
    margin:.4rem 0 0;
    font-family:'Baloo 2', sans-serif;
    font-weight:500;
    font-size:clamp(.85rem,1.6vw,1.15rem);
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:.85;
  }

  /* ---------- Fighter display ---------- */
  .fighter-display{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:center;
    gap:clamp(10px, 3vw, 40px);
    flex:1;
    width:100%;
    padding: 0 3vw;
  }

  .nav-arrow{
    font-family:'Baloo 2', sans-serif;
    background:var(--cream);
    border:3px solid var(--ink);
    color:var(--ink);
    width:52px; height:52px;
    border-radius:50%;
    font-size:1.4rem;
    cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);
    transition: transform .15s ease;
    flex:0 0 auto;
  }
  .nav-arrow:hover{ transform:translateY(-3px) scale(1.05); }
  .nav-arrow:active{ transform:translateY(1px) scale(.96); box-shadow:1px 1px 0 var(--ink); }

  .card{
    position:relative;
    width:min(88vw, 380px);
    background:var(--cream);
    border:5px solid var(--ink);
    border-radius:22px;
    padding: 34px 22px 20px;
    box-shadow: 8px 8px 0 var(--ink);
    color:var(--ink);
    text-align:center;
    animation: cardIn .5s cubic-bezier(.2,1.4,.4,1);
    transition: border-color .5s ease;
  }
  @keyframes cardIn{
    0%{ transform:scale(.85) rotate(-2deg); opacity:0; }
    100%{ transform:scale(1) rotate(0); opacity:1; }
  }

  .rarity-banner{
    position:absolute; top:-20px; left:50%; transform:translateX(-50%) rotate(-2deg);
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:6px 22px;
    border:3px solid var(--ink);
    border-radius:8px;
    font-size:.95rem;
    box-shadow:3px 3px 0 var(--ink);
    color:var(--ink);
    animation: ribbonWiggle 3.4s ease-in-out infinite;
    white-space:nowrap;
  }
  .rarity-banner.epic{ background:linear-gradient(90deg,#a99bff,#6a5acd); color:#1c1642; }
  .rarity-banner.rare{ background:linear-gradient(90deg,#ffb84d,#ff7a3d); color:#3a1400; }
  .rarity-banner.legendary{
    background:linear-gradient(90deg,#ff9a3d,#ffd23f,#7fd858,#4fb0e0,#b07be0,#ff7ab0);
    background-size:300% 100%;
    animation: ribbonWiggle 3.4s ease-in-out infinite, rainbow 4s linear infinite;
    color:#241a09;
  }
  @keyframes ribbonWiggle{
    0%,100%{ transform:translateX(-50%) rotate(-3deg); }
    50%{ transform:translateX(-50%) rotate(3deg); }
  }
  @keyframes rainbow{
    0%{ background-position:0% 0; } 100%{ background-position:300% 0; }
  }

  .portrait-frame{
    width:172px; height:172px;
    margin:6px auto 10px;
    border:4px solid var(--ink);
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:visible;
    background:var(--cream);
    transition: background .5s ease;
  }
  .portrait-frame::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.35), transparent 60%);
    pointer-events:none;
  }
  .portrait-frame svg{
    width:88%; height:88%;
    overflow:visible;
    animation: floaty 3s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }

  .fighter-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.7rem;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:2px 0 12px;
  }

  .stat-row{
    display:flex; flex-direction:column; gap:8px;
    margin-bottom:14px;
    text-align:left;
  }
  .stat{
    display:flex; align-items:center; gap:8px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:.8rem;
  }
  .stat .icon{ width:22px; height:22px; flex:0 0 auto; }
  .bar-track{
    flex:1;
    height:14px;
    background:#e9e2cf;
    border:2.5px solid var(--ink);
    border-radius:7px;
    overflow:hidden;
    display:flex;
  }
  .bar-fill{
    height:100%;
    transition: width .6s ease;
  }
  .bar-fill.hp{ background: repeating-linear-gradient(90deg, #e2273f 0 8px, #c21030 8px 10px); }
  .bar-fill.pow{ background: repeating-linear-gradient(90deg, #4f9e2f 0 8px, #3c7d21 8px 10px); }
  .stat-value{ font-size:.75rem; opacity:.75; min-width:26px; text-align:right; }

  .section-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:.68rem;
    letter-spacing:2.5px;
    text-transform:uppercase;
    opacity:.55;
    margin:0 0 8px;
  }

  .moves{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
  }
  .move-chip{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.5px;
    padding:6px 10px;
    border:2.5px solid var(--ink);
    border-radius:20px;
    background:var(--cream);
    display:flex; align-items:center; gap:5px;
  }
  .move-chip .dot{
    width:9px;height:9px;border-radius:50%;background:var(--ink);flex:0 0 auto;
  }
  .move-chip.super .dot{ animation:pulseDot 1.1s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.6);} }

  /* ---------- Platform ---------- */
  .platform{
    position:relative; z-index:1;
    width:min(70vw, 460px);
    height:34px;
    margin-bottom:6px;
    border-radius:50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.35), rgba(0,0,0,0) 75%);
    filter:blur(1px);
  }

  /* ---------- Roster ---------- */
  .roster{
    position:relative; z-index:2;
    display:flex; gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:92vw;
    margin-bottom:3vh;
  }
  .roster-item{
    width:56px; height:56px;
    border-radius:14px;
    border:3px solid var(--ink);
    cursor:pointer;
    padding:0;
    overflow:hidden;
    box-shadow:3px 3px 0 var(--ink);
    opacity:.55;
    transform:scale(.92);
    transition: opacity .2s ease, transform .2s ease;
    background:var(--cream);
  }
  .roster-item svg{ width:100%; height:100%; }
  .roster-item.active{
    opacity:1; transform:scale(1.06);
    box-shadow:4px 4px 0 var(--ink);
  }
  .roster-item:hover{ opacity:.9; }

  @media (max-height: 640px){
    .subtitle{ display:none; }
    .platform{ height:20px; }
  }

  /* =========================================================
     ARENA MODE — first playable prototype
     ========================================================= */
  .enter-arena-btn{
    margin-top:18px;
    width:100%;
    padding:13px 16px;
    border:3px solid var(--ink);
    border-radius:12px;
    background:#e2273f;
    color:#fffaf0;
    font:800 1rem 'Baloo 2',sans-serif;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:.15s ease;
  }
  .enter-arena-btn:hover{transform:translateY(-2px);filter:saturate(1.15)}
  .enter-arena-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}

  #arena{
    position:fixed; inset:0; z-index:50;
    display:none; overflow:hidden;
    background:#15101d;
    color:#fffaf0;
    font-family:'Nunito',sans-serif;
  }
  #arena.active{display:block}
  .arena-world{
    position:absolute; inset:0;
    overflow:hidden;
    background:linear-gradient(#38285e 0 38%,#172338 38% 65%,#11151d 65%);
  }
  .sky-glow{
    position:absolute; inset:-20%;
    background:radial-gradient(ellipse at 50% 35%,#ffbf5b55,transparent 45%);
    pointer-events:none;
  }
  .parallax{
    position:absolute; left:0; width:300%; height:100%;
    will-change:transform;
    pointer-events:none;
  }
  .clouds{top:0;opacity:.35}
  .clouds:before,.clouds:after{
    content:"";position:absolute;width:180px;height:55px;border-radius:50%;
    background:#fff3d544;top:14%;left:8%;
    box-shadow:520px 80px 0 #fff3d533,980px -30px 0 #fff3d533,1450px 100px 0 #fff3d522;
  }
  .architecture{
    top:17%;height:53%;opacity:.85;
    background:
      linear-gradient(90deg,transparent 0 4%,#211a2d 4% 8%,transparent 8% 12%,
      #2b2137 12% 18%,transparent 18% 23%,#1f192b 23% 29%,transparent 29% 34%,
      #2a2037 34% 40%,transparent 40% 45%,#211a2d 45% 52%,transparent 52% 58%,
      #2b2137 58% 65%,transparent 65% 71%,#20182b 71% 78%,transparent 78% 84%,
      #2a2037 84% 91%,transparent 91% 100%);
  }
  .architecture:after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:35%;
    background:repeating-linear-gradient(90deg,#11101a 0 28px,transparent 28px 44px);
    opacity:.65;
  }

  .crowd{
    position:absolute;left:0;right:0;top:31%;height:38%;
    overflow:hidden;pointer-events:none;
    filter:saturate(.75);
  }
  .crowd-row{
    position:absolute;left:-5%;width:110%;display:flex;gap:12px;
    align-items:flex-end;white-space:nowrap;
    animation: crowdSway var(--speed) linear infinite;
  }
  .crowd-row.r1{top:3%;opacity:.35;--speed:34s}
  .crowd-row.r2{top:22%;opacity:.52;--speed:27s}
  .crowd-row.r3{top:42%;opacity:.72;--speed:21s}
  .person{
    display:inline-block;position:relative;width:18px;height:42px;
    flex:0 0 18px;animation:personBob var(--bob) ease-in-out infinite alternate;
  }
  .person:before{
    content:"";position:absolute;left:5px;top:0;width:9px;height:9px;
    border-radius:50%;background:var(--skin);box-shadow:0 1px 0 #0008;
  }
  .person:after{
    content:"";position:absolute;left:2px;top:9px;width:15px;height:25px;
    border-radius:7px 7px 3px 3px;background:var(--shirt);
    box-shadow:-3px 21px 0 -5px #17151d,8px 21px 0 -5px #17151d;
  }
  @keyframes crowdSway{from{transform:translateX(0)}to{transform:translateX(-28%)}}
  @keyframes personBob{from{transform:translateY(0)}to{transform:translateY(-3px)}}

  .arena-floor{
    position:absolute;left:0;right:0;bottom:0;height:38%;
    background:
      repeating-linear-gradient(90deg,#252a36 0 2px,transparent 2px 110px),
      linear-gradient(#303746,#151820);
    transform-origin:bottom;
    box-shadow:inset 0 12px 30px #0008;
  }
  .floor-lines{
    position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,transparent 0 130px,#6f718044 132px 134px);
    transform:perspective(450px) rotateX(55deg) translateY(-25%);
  }

  .arena-ui{
    position:absolute;inset:0;z-index:10;pointer-events:none;
  }
  .arena-top{
    position:absolute;top:14px;left:20px;right:20px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .fighter-hud{
    width:min(36vw,360px);background:#fffaf0ee;color:#191512;
    border:3px solid #191512;border-radius:12px;padding:8px 12px;
    box-shadow:4px 4px 0 #191512;
  }
  .fighter-hud.right{text-align:right}
  .hud-name{font:800 1rem 'Baloo 2';text-transform:uppercase}
  .hp-track{height:15px;border:2px solid #191512;background:#d9d0bf;border-radius:8px;overflow:hidden}
  .hp-fill{height:100%;background:#e2273f;transition:width .2s}
  .hud-status{font-size:.7rem;opacity:.65;margin-top:3px}
  .round{
    font:800 1rem 'Baloo 2';padding:7px 12px;background:#e2273f;
    border:3px solid #191512;border-radius:10px;box-shadow:3px 3px 0 #191512;
  }

  .arena-fighter{
    position:absolute;bottom:27%;width:170px;height:190px;
    z-index:8;transition:filter .12s,transform .12s;
    transform-origin:center bottom;
  }
  .arena-fighter.left{left:16%}
  .arena-fighter.right{right:16%;transform:scaleX(-1)}
  .arena-fighter svg{width:100%;height:100%;overflow:visible}
  .arena-fighter.hit{filter:brightness(2) saturate(.4);transform:translateX(10px) rotate(-4deg)}
  .arena-fighter.right.hit{transform:scaleX(-1) translateX(10px) rotate(-4deg)}
  .arena-fighter.attack{animation:attackL .22s ease}
  .arena-fighter.right.attack{animation:attackR .22s ease}
  @keyframes attackL{50%{transform:translateX(55px) scale(1.05)}}
  @keyframes attackR{50%{transform:translateX(-55px) scaleX(-1) scale(1.05)}}

  .arena-controls{
    position:absolute;left:50%;bottom:15px;transform:translateX(-50%);
    display:flex;gap:8px;align-items:center;pointer-events:auto;
  }
  .control-btn{
    border:3px solid #191512;background:#fffaf0;color:#191512;
    border-radius:10px;padding:9px 12px;min-width:62px;
    font:800 .78rem 'Baloo 2';cursor:pointer;box-shadow:3px 3px 0 #191512;
  }
  .control-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #191512}
  .control-btn.attack{background:#e2273f;color:white}
  .mode-pill{
    position:absolute;left:50%;bottom:68px;transform:translateX(-50%);
    background:#191512dd;border:2px solid #fffaf0;padding:5px 10px;border-radius:20px;
    font:700 .7rem 'Baloo 2';white-space:nowrap;
  }
  .close-arena{
    position:absolute;right:18px;bottom:15px;z-index:20;pointer-events:auto;
  }
  .hit-flash{
    position:absolute;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none;
  }
  .hit-flash.on{animation:flash .13s ease}
  @keyframes flash{0%{opacity:.5}100%{opacity:0}}

  @media(max-width:700px){
    .arena-fighter{width:130px;height:150px;bottom:30%}
    .arena-fighter.left{left:6%}.arena-fighter.right{right:6%}
    .fighter-hud{width:39vw}
    .arena-controls{gap:4px}
    .control-btn{min-width:48px;padding:8px 7px}
  }

</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="grain"></div>
  <div class="scribble-ring">
    <svg viewBox="0 0 200 200"><path d="M20,100 C20,50 60,15 100,18 C150,22 182,55 180,102 C178,150 145,182 98,180 C50,178 20,148 20,100 Z"
      fill="none" stroke="#ffffff" stroke-width="1.4" stroke-dasharray="2 10" stroke-linecap="round"/></svg>
  </div>

  <div class="title-wrap">
    <h1 class="game-title">ATTACK<span class="arena">ARENA</span></h1>
    <p class="subtitle">Choose your fighter</p>
  </div>

  <div class="fighter-display">
    <button class="nav-arrow" id="prevBtn" aria-label="Previous fighter">&#10094;</button>

    <div class="card" id="card">
      <div class="rarity-banner" id="rarityBanner"></div>
      <div class="portrait-frame" id="portraitFrame"></div>
      <h2 class="fighter-name" id="fighterName"></h2>

      <div class="stat-row">
        <div class="stat">
          <svg class="icon" viewBox="0 0 24 24"><path fill="#e2273f" stroke="#191512" stroke-width="1.5" d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4 6 4c2.2 0 3.7 1.2 4.6 2.6C11.5 5.2 13 4 15.2 4c4 0 5.6 4 4 7.7C19.5 16.4 12 21 12 21z"/></svg>
          <div class="bar-track"><div class="bar-fill hp" id="hpBar"></div></div>
          <span class="stat-value" id="hpVal"></span>
        </div>
        <div class="stat">
          <svg class="icon" viewBox="0 0 24 24"><path fill="#e2273f" stroke="#191512" stroke-width="1.5" d="M6 14c-2 0-4-1.5-4-4 0-2 1.5-3.3 3.3-3.3.3-2 2-3.7 4.2-3.7 2 0 3.6 1.3 4.1 3 .4-.2.9-.3 1.4-.3 2 0 3.6 1.6 3.6 3.6 0 2.3-1.9 4-4.2 3.9H6z"/><rect x="7" y="13" width="10" height="8" rx="2" fill="#e2273f" stroke="#191512" stroke-width="1.5"/></svg>
          <div class="bar-track"><div class="bar-fill pow" id="powBar"></div></div>
          <span class="stat-value" id="powVal"></span>
        </div>
      </div>

      <p class="section-label">Strengths</p>
      <div class="moves" id="moves"></div>
        <button id="enterArenaBtn" class="enter-arena-btn">ENTER THE ARENA →</button>
    </div>

    <button class="nav-arrow" id="nextBtn" aria-label="Next fighter">&#10095;</button>
  </div>

  <div class="platform" id="platform"></div>

  <nav class="roster" id="roster"></nav>
</div>

<script>
/* ---------------- Fighter portraits ---------------- */

/* KILLROYS — Updated with green skin, animated mouth opening, no stars, no black void */
const killroySVG = `
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><g transform="translate(-16,-69) scale(1.36)">
  <!-- SWAY & LATERAL MOTION -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 18,0; 0,0; -18,0; 0,0" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>

    <ellipse cx="60" cy="140" rx="22" ry="4.5" fill="#00000022"/>

    <!-- ===== REAR / BACKSIDE SCRUB SCALE SPIKES ===== -->
    <g fill="#133d23" stroke="#191512" stroke-width="1.2" stroke-linejoin="round" opacity="0.45">
      <path d="M42 98 L37 94 L40 102 Z"/>
      <path d="M48 108 L42 106 L45 113 Z"/>
      <path d="M54 118 L48 118 L52 124 Z"/>

const stage = document.getElementById('stage');
const card = document.getElementById('card');
const rarityBanner = document.getElementById('rarityBanner');
const portraitFrame = document.getElementById('portraitFrame');
const fighterName = document.getElementById('fighterName');
const hpBar = document.getElementById('hpBar');
const powBar = document.getElementById('powBar');
const hpVal = document.getElementById('hpVal');
const powVal = document.getElementById('powVal');
const movesEl = document.getElementById('moves');
const rosterEl = document.getElementById('roster');

let current = 3; // Killroys index

function renderRoster(){
  rosterEl.innerHTML = fighters.map((f,i) => `
    <button class="roster-item ${i===current?'active':''}" data-index="${i}" aria-label="Select ${f.name}">
      ${f.svg}
    </button>
  `).join('');
  rosterEl.querySelectorAll('.roster-item').forEach(btn=>{
    btn.addEventListener('click', ()=> goTo(parseInt(btn.dataset.index,10)));
  });
}

function render(){
  const f = fighters[current];

  stage.style.background = `radial-gradient(120% 90% at 50% 20%, ${f.colors.bg1}, ${f.colors.bg2})`;
  card.style.borderColor = f.box;
  portraitFrame.style.background = f.box;

  rarityBanner.textContent = f.rarity;
  rarityBanner.className = 'rarity-banner ' + f.rarity;

  portraitFrame.innerHTML = f.svg;
  fighterName.textContent = f.name;

  portraitFrame.querySelectorAll('animateTransform, animate').forEach(el => {
    try {
      if (typeof el.beginElement === 'function') el.beginElement();
    } catch(e){}
  });

  hpBar.style.width = (f.hp / f.hpMax * 100) + '%';
  hpVal.textContent = f.hp + '/' + f.hpMax;
  powBar.style.width = (f.pow / f.powMax * 100) + '%';
  powVal.textContent = '+' + f.pow;

  movesEl.innerHTML = f.moves.map(m => `
    <span class="move-chip ${m.super ? 'super' : ''}"><span class="dot"></span>${m.label}</span>
  `).join('');

  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';

  renderRoster();
}

function goTo(index){
  current = (index + fighters.length) % fighters.length;
  render();
}

document.getElementById('prevBtn').addEventListener('click', ()=> goTo(current - 1));
document.getElementById('nextBtn').addEventListener('click', ()=> goTo(current + 1));

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowLeft') goTo(current - 1);
  if(e.key === 'ArrowRight') goTo(current + 1);
});

render();
</script>

  const world = document.getElementById('arenaWorld');

  const crowd = document.getElementById('crowd');

  const skins = ['#d59a78','#efb88d','#9a6248','#f0c7a0','#76503f'];
  const shirts = ['#e2273f','#4f8fe0','#ffd23f','#55a77b','#a86bdb','#e88937','#fffaf0'];
  for(let r=1;r<=3;r++){
    const row=document.createElement('div');
    row.className='crowd-row r'+r;
    for(let i=0;i<52;i++){
      const p=document.createElement('span');
      p.className='person';
      p.style.setProperty('--skin',skins[(i+r)%skins.length]);
      p.style.setProperty('--shirt',shirts[(i*3+r)%shirts.length]);
      p.style.setProperty('--bob',(1.1+(i%7)*.22)+'s');
      p.style.animationDelay=(-((i*0.31+r)*0.17))+'s';
      row.appendChild(p);
    }
    crowd.appendChild(row);
  }

  let player, enemy, playerHP, enemyHP, px, ex, vy, enemyVy;
  let facing=1, keys=new Set(), running=false, last=0, enemyThink=0;
  let arenaScroll=0;

  function pickEnemy(){
    const choices=fighters.filter(f => f.id !== fighters[current].id);
    return choices[Math.floor(Math.random()*choices.length)];
  }

  function openArena(){
    player=fighters[current];
    enemy=pickEnemy();
    playerHP=player.hpMax; enemyHP=enemy.hpMax;
    px=window.innerWidth*.22; ex=window.innerWidth*.70;
    vy=enemyVy=0; facing=1;
    playerEl.innerHTML=player.svg;
    enemyEl.innerHTML=enemy.svg;
    playerName.textContent=player.name;
    enemyName.textContent=enemy.name;
    modePill.textContent='BOT MATCH · A/D MOVE · W JUMP · SPACE ATTACK';
    enemyStatus.textContent='BOT · THINKING...';
    arena.classList.add('active');
    arena.setAttribute('aria-hidden','false');
    running=true; last=performance.now(); enemyThink=0;
    requestAnimationFrame(loop);
  }

  function closeArena(){
    running=false;
    arena.classList.remove('active');
    arena.setAttribute('aria-hidden','true');
  }

  function updateHud(){
    playerHp.style.width=Math.max(0,playerHP/player.hpMax*100)+'%';
    enemyHp.style.width=Math.max(0,enemyHP/enemy.hpMax*100)+'%';
  }

  function flashHit(){
    flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
  }

  function attack(attacker, target, amount){
    const aX=attacker==='p'?px:ex, tX=attacker==='p'?ex:px;
    if(Math.abs(aX-tX)>150) return;
    if(attacker==='p'){
      enemyHP=Math.max(0,enemyHP-amount);
      enemyEl.classList.remove('hit'); void enemyEl.offsetWidth; enemyEl.classList.add('hit');
      playerEl.classList.add('attack'); setTimeout(()=>playerEl.classList.remove('attack'),220);
    }else{
      playerHP=Math.max(0,playerHP-amount);
      playerEl.classList.remove('hit'); void playerEl.offsetWidth; playerEl.classList.add('hit');
      enemyEl.classList.add('attack'); setTimeout(()=>enemyEl.classList.remove('attack'),220);
    }
    flashHit(); updateHud();
    if(playerHP<=0 || enemyHP<=0){
      setTimeout(()=>alert((enemyHP<=0?player.name:enemy.name)+' WINS!'),80);
      setTimeout(openArena,350);
    }
  }

  function doPlayerAttack(){
    if(!running) return;
    attack('p','e',Math.max(1,player.pow));
  }

  function doBotAttack(){
    attack('e','p',Math.max(1,enemy.pow));
  }

  function loop(t){
    if(!running) return;
    const dt=Math.min(.033,(t-last)/1000); last=t;

    if(keys.has('a')) { px-=260*dt; facing=-1; }
    if(keys.has('d')) { px+=260*dt; facing=1; }
    if(keys.has('w') && Math.abs(vy)<1) vy=-520;
    vy+=1250*dt; px=Math.max(40,Math.min(innerWidth-210,px)); 
    if(vy>0 && window.__playerGround){}

    window.__playerY=(window.__playerY||0)+vy*dt;
    if(window.__playerY>0){window.__playerY=0;vy=0}
    playerEl.style.left=px+'px';
    playerEl.style.bottom=(27 + (-window.__playerY/14))+'%';
    playerEl.style.transform='scaleX('+facing+')';

    enemyThink-=dt;
    const dist=px-ex;
    if(dist>135) ex-=145*dt;
    else if(dist<-135) ex+=145*dt;
    if(enemyThink<=0){
      enemyThink=.35+Math.random()*.75;
      if(Math.abs(dist)<145 && Math.random()<.72) doBotAttack();
      if(Math.random()<.22) ex += (Math.random()<.5?-1:1)*45;
    }
    ex=Math.max(40,Math.min(innerWidth-210,ex));
    enemyEl.style.right='auto';
    enemyEl.style.left=ex+'px';

    arenaScroll += ((px-innerWidth*.22)*.035);
    document.querySelectorAll('.parallax').forEach(el=>{
      const s=parseFloat(el.dataset.speed||'.2');
      el.style.transform='translateX('+(-arenaScroll*s)+'px)';
    });

    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown',e=>{
    if(!running) return;
    const k=e.key.toLowerCase();
    if(['a','d','w',' '].includes(k)){e.preventDefault();keys.add(k)}
    if(k===' ' && !e.repeat) doPlayerAttack();
  });
  document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

  document.querySelectorAll('.control-btn[data-key]').forEach(btn=>{
    const k=btn.dataset.key;
    btn.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);if(k===' ')doPlayerAttack()});
    btn.addEventListener('pointerup',()=>keys.delete(k));
    btn.addEventListener('pointerleave',()=>keys.delete(k));
  });

  enter.addEventListener('click',openArena);
  document.getElementById('leaveArena').addEventListener('click',closeArena);
})();
</script>

</body>
</html>
