<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>ATTACK ARENA — Choose Your Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6efdd;
    --ink:#191512;
    --cream:#fffaf0;

    /* Jansina — superyellow background / dark background accent */
    --jan-1:#ffea00;
    --jan-2:#665200;
    --jan-glow:#ffff55;
    --jan-accent:#e2273f;

    /* Viking — blue background / black pointy mask / studded collar */
    --vik-1:#4a82cd;
    --vik-2:#1c3d69;
    --vik-glow:#8ebbf5;
    --vik-accent:#a0e6d2;

    /* Giya — purple background / spiky flame hair / fiery hands */
    --giy-1:#8e56c9;
    --giy-2:#401b63;
    --giy-glow:#c28eff;
    --giy-accent:#ff7a1a;

    /* Bannana Flip — yellow/brown */
    --ban-1:#c99a12;
    --ban-2:#5e4306;

    /* Bullyboy — teal/robot */
    --bul-1:#2b6b63;
    --bul-2:#0e2b27;

    /* Electro — electric blue */
    --ele-1:#1f6fae;
    --ele-2:#0b2c47;

    /* Ulta Clownsy — carnival red/purple */
    --clo-1:#7a1f4b;
    --clo-2:#2e0a1f;

    /* Killroyce — vivid magenta / deep green */
    --kil-1:#9d2b6c;
    --kil-2:#3b0a2c;

    /* Toms — orange tabby cat */
    --tom-1:#e68a3c;
    --tom-2:#5c3510;
    --tom-glow:#ffb366;
    --tom-accent:#8b4513;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Nunito', sans-serif;
    overflow:hidden;
    color:var(--cream);
  }

  .stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; flex-direction:column; align-items:center;
    justify-content:space-between;
    background: radial-gradient(120% 90% at 50% 20%, #1c3d69, #0a1727);
    isolation:isolate;
  }

  /* subtle hand-drawn paper grain */
  .grain{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    opacity:.10; mix-blend-mode:overlay;
    background-image: radial-gradient(circle, #000 1px, transparent 1.4px);
    background-size: 5px 5px;
  }

  /* wobble ring behind the card */
  .scribble-ring{
    position:absolute; top:50%; left:50%; z-index:0; pointer-events:none;
    width:min(70vw,640px); height:min(70vw,640px);
    transform:translate(-50%,-52%);
    opacity:.35;
    animation: spin 40s linear infinite;
  }
  .scribble-ring svg{ width:100%; height:100%; }
  @keyframes spin{ to{ transform:translate(-50%,-52%) rotate(360deg);} }

  /* ---------- Title ---------- */
  .title-wrap{
    position:relative; z-index:2;
    text-align:center;
    margin-top:2.2vh;
  }
  .game-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(3.4rem, 8.5vw, 6.2rem);
    margin:0;
    letter-spacing:1px;
    color:var(--cream);
    text-shadow: 5px 5px 0 var(--ink), -1px -1px 0 var(--ink);
    -webkit-text-stroke: 2.5px var(--ink);
  }
  .game-title .arena{
    display:inline-block;
    font-size:.5em;
    vertical-align:middle;
    margin-left:.4em;
    padding:.25em .6em;
    background:var(--jan-accent);
    border:3px solid var(--ink);
    border-radius:10px;
    transform:rotate(-3deg);
    -webkit-text-stroke:0;
    box-shadow:3px 3px 0 var(--ink);
  }
  .subtitle{
    margin:.4rem 0 0;
    font-family:'Baloo 2', sans-serif;
    font-weight:500;
    font-size:clamp(.85rem,1.6vw,1.15rem);
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:.85;
  }

/* ---------- Selection Grid + Preview ---------- */
  .select-layout{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:center;
    gap:clamp(16px, 3.5vw, 50px);
    flex:1; width:100%; padding:0 4vw;
  }

  .select-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    flex:0 0 auto;
  }

  .grid-slot{
    width:clamp(72px, 8.5vw, 100px);
    height:clamp(72px, 8.5vw, 100px);
    border-radius:16px;
    border:3px solid var(--ink);
    background:var(--cream);
    cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);
    padding:4px;
    transition:transform .2s ease, box-shadow .2s ease, border-color .3s ease;
    overflow:hidden;
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .grid-slot svg{ width:90%; height:90%; pointer-events:none; }
  .grid-slot:hover{
    transform:translateY(-4px) scale(1.1);
    box-shadow:5px 5px 0 var(--ink), 0 0 20px rgba(255,255,255,.25);
    z-index:3;
  }
  .grid-slot.selected{
    border-color:#e2273f;
    box-shadow:4px 4px 0 var(--ink), 0 0 16px #e2273f66;
    transform:scale(1.05);
  }
  .grid-slot .slot-name{
    position:absolute; bottom:2px; left:0; right:0;
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:.48rem;
    text-align:center; color:var(--ink);
    text-transform:uppercase; letter-spacing:.5px;
    opacity:0; transition:opacity .2s;
    pointer-events:none;
  }
  .grid-slot:hover .slot-name{ opacity:.75; }

  /* Preview Panel */
  .preview-panel{
    width:min(42vw, 320px);
    background:var(--cream);
    border:5px solid var(--ink);
    border-radius:22px;
    padding:22px 18px 16px;
    box-shadow:8px 8px 0 var(--ink);
    color:var(--ink);
    position:relative;
    transition:border-color .5s ease;
    flex:0 0 auto;
    animation:cardIn .4s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes cardIn{
    0%{ transform:scale(.85) rotate(-2deg); opacity:0; }
    100%{ transform:scale(1) rotate(0); opacity:1; }
  }

  .preview-portrait{
    width:150px; height:150px;
    margin:0 auto 8px;
    border:4px solid var(--ink);
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:visible;
    background:var(--cream);
    transition:background .4s ease;
  }
  .preview-portrait::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.35), transparent 60%);
    pointer-events:none;
  }
  .preview-portrait svg{
    width:88%; height:88%;
    overflow:visible;
    animation:floaty 3s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }

  .preview-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:800; font-size:1.4rem;
    text-transform:uppercase; text-align:center;
    letter-spacing:1px; margin:2px 0 8px;
  }

  .preview-stats-wrap{
    position:absolute; top:14px; right:14px; z-index:5;
    display:flex; flex-direction:column;
    align-items:flex-end; gap:6px;
  }

  .preview-power-tag{
    font-family:'Baloo 2', sans-serif;
    font-weight:800; font-size:.72rem;
    text-transform:uppercase; letter-spacing:1px;
    padding:5px 11px;
    border:2.5px solid var(--ink);
    border-radius:9px;
    background:#e2273f;
    color:var(--cream);
    box-shadow:2.5px 2.5px 0 var(--ink);
    white-space:nowrap;
    animation:wobbleTag 2.4s ease-in-out infinite;
  }
  .preview-power-tag .power-prefix{
    opacity:.85;
    margin-right:2px;
  }
  @keyframes wobbleTag{
    0%,100%{ transform:rotate(-2deg); }
    50%{ transform:rotate(2deg); }
  }

  .preview-rating{
    display:flex; flex-direction:column;
    gap:2px; align-items:flex-end;
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:.78rem;
    color:var(--ink);
    background:var(--cream);
    border:2px solid var(--ink);
    border-radius:8px;
    padding:4px 9px;
    box-shadow:2px 2px 0 var(--ink);
  }
  .preview-rating span{
    display:flex; align-items:center; gap:4px;
  }

  .preview-moves{
    display:flex; flex-wrap:wrap; gap:5px; justify-content:center;
    margin-bottom:10px;
  }
  .preview-move-chip{
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:.65rem;
    text-transform:uppercase; letter-spacing:.5px;
    padding:4px 8px;
    border:2px solid var(--ink);
    border-radius:18px;
    background:var(--cream);
    display:flex; align-items:center; gap:4px;
    color:var(--ink);
  }
  .preview-move-chip .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--ink); flex:0 0 auto;
  }
  .preview-move-chip.super .dot{
    animation:pulseDot 1.1s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.6); }
  }

  .enter-arena-btn{
    margin-top:10px; width:100%;
    padding:11px 16px;
    border:3px solid var(--ink);
    border-radius:12px;
    background:#e2273f;
    color:#fffaf0;
    font:800 .9rem 'Baloo 2',sans-serif;
    letter-spacing:1px; cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:.15s ease;
  }
  .enter-arena-btn:hover{transform:translateY(-2px);filter:saturate(1.15)}
  .enter-arena-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}

  @media (max-height: 640px){
    .subtitle{ display:none; }
    .select-layout{ gap:10px; }
    .grid-slot{ width:64px; height:64px; border-radius:12px; }
    .preview-panel{ padding:12px 10px 10px; }
    .preview-portrait{ width:100px; height:100px; }
  }

  @media (max-width: 600px){
    .select-layout{ flex-direction:column; gap:10px; }
    .preview-panel{ width:min(90vw, 340px); }
  }

  #arena{
    position:fixed; inset:0; z-index:50;
    display:none; overflow:hidden;
    background:#0d0519;
    color:#fffaf0;
    font-family:'Nunito',sans-serif;
  }
  #arena.active{display:block}
  .arena-world{
    position:absolute; inset:0;
    overflow:hidden;
    background:linear-gradient(#1c0933 0 38%,#0f071f 38% 65%,#080312 65%);
  }
  .sky-glow{
    position:absolute; inset:-20%;
    background:radial-gradient(ellipse at 50% 35%,#a855f744,transparent 50%);
    pointer-events:none;
  }

  /* Top Spotlights */
  .spotlight{
    position:absolute; top:-40px; width:140px; height:450px;
    background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(200,160,255,0.2) 40%, transparent 100%);
    clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
    pointer-events:none; z-index:2; filter:blur(2px);
    animation: spotPulse 4s ease-in-out infinite alternate;
  }
  .spotlight.s1{ left:12%; animation-delay:0s; }
  .spotlight.s2{ left:38%; animation-delay:1.3s; }
  .spotlight.s3{ left:64%; animation-delay:2.5s; }
  .spotlight.s4{ left:85%; animation-delay:0.8s; }

  @keyframes spotPulse {
    0% { opacity: 0.3; transform: scaleX(0.9); }
    100% { opacity: 0.85; transform: scaleX(1.1); }
  }

  .spot-fixture{
    position:absolute; top:5px; width:28px; height:28px; border-radius:50%;
    background:#ffffff; box-shadow:0 0 25px 8px #ffffff, 0 0 50px 15px #b066fe;
    z-index:3;
  }
  .spot-fixture.f1{ left:calc(12% + 56px); }
  .spot-fixture.f2{ left:calc(38% + 56px); }
  .spot-fixture.f3{ left:calc(64% + 56px); }
  .spot-fixture.f4{ left:calc(85% + 56px); }

  .parallax{
    position:absolute; left:0; width:300%; height:100%;
    will-change:transform;
    pointer-events:none;
  }
  .clouds{top:0;opacity:.2}
  .clouds:before,.clouds:after{
    content:"";position:absolute;width:180px;height:55px;border-radius:50%;
    background:#c084fc33;top:14%;left:8%;
    box-shadow:520px 80px 0 #c084fc22,980px -30px 0 #c084fc22,1450px 100px 0 #c084fc22;
  }
  .architecture{
    top:17%;height:53%;opacity:.85;
    background:
      linear-gradient(90deg,transparent 0 4%,#160a26 4% 8%,transparent 8% 12%,
      #1f0d36 12% 18%,transparent 18% 23%,#130821 23% 29%,transparent 29% 34%,
      #1e0c33 34% 40%,transparent 40% 45%,#160a26 45% 52%,transparent 52% 58%,
      #1f0d36 58% 65%,transparent 65% 71%,#120721 71% 78%,transparent 78% 84%,
      #1e0c33 84% 91%,transparent 91% 100%);
  }
  .architecture:after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:35%;
    background:repeating-linear-gradient(90deg,#090312 0 28px,transparent 28px 44px);
    opacity:.65;
  }

  /* Crowds - 6 distinct rows with scale gradient and seated bodies */
  .crowd{
    position:absolute;left:0;right:0;top:22%;height:45%;
    overflow:hidden;pointer-events:none;
    filter:saturate(.85);
  }
  .crowd-row{
    position:absolute;left:-5%;width:110%;display:flex;gap:10px;
    align-items:flex-end;white-space:nowrap;
    animation: crowdSway var(--speed) linear infinite;
  }
  .crowd-row.r6{top:0%;opacity:.30;--speed:40s; transform: scale(0.55); transform-origin: left bottom;}
  .crowd-row.r5{top:8%;opacity:.40;--speed:34s; transform: scale(0.63); transform-origin: left bottom;}
  .crowd-row.r4{top:17%;opacity:.52;--speed:28s; transform: scale(0.72); transform-origin: left bottom;}
  .crowd-row.r3{top:27%;opacity:.68;--speed:23s; transform: scale(0.81); transform-origin: left bottom;}
  .crowd-row.r2{top:38%;opacity:.84;--speed:18s; transform: scale(0.90); transform-origin: left bottom;}
  .crowd-row.r1{top:50%;opacity:1.0;--speed:14s; transform: scale(1.05); transform-origin: left bottom;}

  .person{
    display:inline-block;position:relative;width:20px;height:30px;
    flex:0 0 20px;animation:personBob var(--bob) ease-in-out infinite alternate;
  }
  /* Head */
  .person:before{
    content:"";position:absolute;left:5px;top:0;width:10px;height:10px;
    border-radius:50%;background:var(--skin);box-shadow:0 1px 0 #0008;
  }
  /* Torso sitting behind each other - NO LEGS */
  .person:after{
    content:"";position:absolute;left:2px;top:10px;width:16px;height:20px;
    border-radius:8px 8px 0 0;background:var(--shirt);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,0.3);
  }
  @keyframes crowdSway{from{transform:translateX(0) scale(var(--sc, 1))}to{transform:translateX(-28%) scale(var(--sc, 1))}}
  @keyframes personBob{from{transform:translateY(0)}to{transform:translateY(-2px)}}

  /* Interactive Black & White Checkerboard Arena Floor */
  .arena-floor{
    position:absolute;left:-100%;right:-100%;bottom:0;height:38%;
    background:#0a0512;
    transform-origin:bottom;
    box-shadow:inset 0 12px 30px #000;
    overflow:hidden;
  }
  .floor-lines{
    position:absolute;inset:-300px;
    background-image:
      linear-gradient(45deg, #181824 25%, transparent 25%),
      linear-gradient(-45deg, #181824 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #181824 75%),
      linear-gradient(-45deg, transparent 75%, #181824 75%);
    background-size: 80px 80px;
    background-position: 0 0, 0 40px, 40px -40px, -40px 0px;
    background-color: #f2f2f7;
    transform:perspective(400px) rotateX(65deg);
    will-change: transform, background-position;
  }

  .arena-ui{
    position:absolute;inset:0;z-index:10;pointer-events:none;
  }
  .arena-top{
    position:absolute;top:14px;left:20px;right:20px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .fighter-hud{
    width:min(36vw,360px);background:#fffaf0ee;color:#191512;
    border:3px solid #191512;border-radius:12px;padding:8px 12px;
    box-shadow:4px 4px 0 #191512;
  }
  .fighter-hud.right{text-align:right}
  .hud-name{font:800 1rem 'Baloo 2';text-transform:uppercase}
  .hp-track{height:15px;border:2px solid #191512;background:#d9d0bf;border-radius:8px;overflow:hidden}
  .hp-fill{height:100%;background:#e2273f;transition:width .2s}
  .hud-status{font-size:.7rem;opacity:.65;margin-top:3px}
  .round{
    font:800 1rem 'Baloo 2';padding:7px 12px;background:#e2273f;
    border:3px solid #191512;border-radius:10px;box-shadow:3px 3px 0 #191512;
  }

  /* Arena Fighters - Vibrant Aura Glow in Dark Arena */
  .arena-fighter{
    position:absolute;bottom:25%;width:170px;height:210px;
    z-index:8;transition:filter .12s,transform .12s;
    transform-origin:center bottom;
    filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.85)) drop-shadow(0 0 28px rgba(180, 100, 255, 0.7));
  }
  .arena-fighter.left{left:16%}
  .arena-fighter.right{right:16%;transform:scaleX(-1)}
  .arena-fighter svg{width:100%;height:100%;overflow:visible}
  .arena-fighter.hit{filter:brightness(2) saturate(.4) drop-shadow(0 0 20px #ff2255);transform:translateX(10px) rotate(-4deg)}
  .arena-fighter.right.hit{transform:scaleX(-1) translateX(10px) rotate(-4deg)}
  .arena-fighter.attack{animation:attackL .22s ease}
  .arena-fighter.right.attack{animation:attackR .22s ease}
  @keyframes attackL{50%{transform:translateX(55px) scale(1.05)}}
  @keyframes attackR{50%{transform:translateX(-55px) scaleX(-1) scale(1.05)}}

  /* Dynamic Arena Feet / Legs - Realistic Walking Animation strictly when moving */
  .arena-legs {
    display: none;
  }
  .has-arena-legs .arena-legs {
    display: block;
  }

  .walking .arena-legs .leg-left {
    animation: legWalkLeft 0.28s linear infinite alternate;
    transform-origin: 47px 112px;
  }
  .walking .arena-legs .leg-right {
    animation: legWalkRight 0.28s linear infinite alternate;
    transform-origin: 67px 112px;
  }

  @keyframes legWalkLeft {
    0% { transform: rotate(-22deg) translateY(-3px); }
    100% { transform: rotate(18deg) translateY(2px); }
  }
  @keyframes legWalkRight {
    0% { transform: rotate(18deg) translateY(2px); }
    100% { transform: rotate(-22deg) translateY(-3px); }
  }

  .arena-controls{
    position:absolute;left:50%;bottom:15px;transform:translateX(-50%);
    display:flex;gap:8px;align-items:center;pointer-events:auto;
  }
  .control-btn{
    border:3px solid #191512;background:#fffaf0;color:#191512;
    border-radius:10px;padding:9px 12px;min-width:62px;
    font:800 .78rem 'Baloo 2';cursor:pointer;box-shadow:3px 3px 0 #191512;
  }
  .control-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #191512}
  .control-btn.attack{background:#e2273f;color:white}
  .mode-pill{
    position:absolute;left:50%;bottom:68px;transform:translateX(-50%);
    background:#191512dd;border:2px solid #fffaf0;padding:5px 10px;border-radius:20px;
    font:700 .7rem 'Baloo 2';white-space:nowrap;
  }
  .close-arena{
    position:absolute;right:18px;bottom:15px;z-index:20;pointer-events:auto;
  }
  .hit-flash{
    position:absolute;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none;
  }
  .hit-flash.on{animation:flash .13s ease}
  @keyframes flash{0%{opacity:.5}100%{opacity:0}}

  @media(max-width:700px){
    .arena-fighter{width:130px;height:170px;bottom:28%}
    .arena-fighter.left{left:6%}.arena-fighter.right{right:6%}
    .fighter-hud{width:39vw}
    .arena-controls{gap:4px}
    .control-btn{min-width:48px;padding:8px 7px}
  }


/* =========================================================
   ATTACK ARENA V2 — frame-based SVG combat animation rig
   The original vector characters are retained. Instead of
   swapping bitmap sprites, we animate the SVG rig + effects,
   which keeps edges crisp at any resolution.
   ========================================================= */
.arena-fighter{
  width:190px;height:235px;
  bottom:24%;
  transform-origin:center bottom;
  will-change:left,bottom,filter;
  transition:filter .08s ease;
}
.arena-fighter .body-rig{
  position:absolute;inset:0;
  transform-origin:center bottom;
  will-change:transform;
}
.arena-fighter .body-rig svg{
  width:100%;height:100%;overflow:visible;
  transform-origin:center bottom;
  will-change:transform;
}
.arena-fighter.face-left .body-rig,
.arena-fighter.face-left .body-rig svg{transform:scaleX(-1)}
.arena-fighter.face-right .body-rig,
.arena-fighter.face-right .body-rig svg{transform:none}

.arena-fighter.walking .body-rig{
  animation: fighterWalkBob .20s ease-in-out infinite alternate;
}
@keyframes fighterWalkBob{
  from{transform:translateY(0) rotate(-1deg) scaleY(1)}
  to{transform:translateY(-5px) rotate(1deg) scaleY(.985)}
}
.walking.has-arena-legs .arena-legs .leg-left{
  animation:legWalkLeft .20s linear infinite alternate;
}
.walking.has-arena-legs .arena-legs .leg-right{
  animation:legWalkRight .20s linear infinite alternate;
}

/* Attack anticipation / contact / recovery. These are deliberately
   short so the controls feel responsive rather than slideshow-like. */
.arena-fighter.action .body-rig{z-index:12}
.arena-fighter.attack-jansina .body-rig{animation:atkPunch .34s cubic-bezier(.2,.9,.25,1) both}
.arena-fighter.attack-giya .body-rig{animation:atkGiya .42s cubic-bezier(.2,.9,.25,1) both}
.arena-fighter.attack-viking .body-rig{animation:atkViking .48s cubic-bezier(.2,.8,.2,1) both}
.arena-fighter.attack-killroy .body-rig{animation:atkKillroy .42s cubic-bezier(.2,.9,.25,1) both}
.arena-fighter.attack-bananaflip .body-rig{animation:atkBanana .38s cubic-bezier(.2,.9,.25,1) both}
.arena-fighter.attack-bullygan .body-rig{animation:atkBully .44s cubic-bezier(.2,.9,.25,1) both}
.arena-fighter.attack-electro .body-rig{animation:atkElectro .40s cubic-bezier(.2,.9,.25,1) both}
.arena-fighter.attack-toms .body-rig{animation:atkToms .36s cubic-bezier(.2,.9,.25,1) both}
.arena-fighter.attack-ultaclownsy .body-rig{animation:atkClown .50s cubic-bezier(.2,.9,.25,1) both}

@keyframes atkPunch{
  0%{transform:translateX(0) rotate(0) scale(1)}
  28%{transform:translateX(-18px) rotate(-7deg) scale(.96,1.04)}
  52%{transform:translateX(35px) rotate(5deg) scale(1.10,.94)}
  68%{transform:translateX(62px) rotate(1deg) scale(1.16,.90)}
  100%{transform:translateX(0) rotate(0) scale(1)}
}
@keyframes atkGiya{
  0%{transform:translateX(0) scale(1)}
  25%{transform:translateX(-15px) rotate(-8deg) scale(.96,1.04)}
  55%{transform:translateX(28px) rotate(4deg) scale(1.08,.94)}
  72%{transform:translateX(18px) scale(1.12,.92)}
  100%{transform:translateX(0) scale(1)}
}
@keyframes atkViking{
  0%{transform:rotate(0) scale(1)}
  18%{transform:translateX(-12px) rotate(-10deg) scale(.96,1.04)}
  52%{transform:translateX(18px) rotate(190deg) scale(1.10,.92)}
  76%{transform:translateX(8px) rotate(345deg) scale(1.03,.97)}
  100%{transform:rotate(360deg) scale(1)}
}
@keyframes atkKillroy{
  0%{transform:translateX(0) rotate(0) scale(1)}
  30%{transform:translateX(-16px) rotate(-5deg) scale(.94,1.05)}
  60%{transform:translateX(48px) rotate(7deg) scale(1.12,.92)}
  100%{transform:translateX(0) rotate(0) scale(1)}
}
@keyframes atkBanana{
  0%{transform:translateY(0) rotate(0)}
  25%{transform:translate(-10px,-4px) rotate(-8deg) scale(.96,1.04)}
  55%{transform:translate(30px,-12px) rotate(18deg) scale(1.10,.92)}
  78%{transform:translate(15px,0) rotate(-4deg)}
  100%{transform:none}
}
@keyframes atkBully{
  0%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(-22px) rotate(-7deg) scale(.94,1.05)}
  55%{transform:translateX(28px) rotate(8deg) scale(1.10,.93)}
  72%{transform:translateX(8px) rotate(-3deg)}
  100%{transform:none}
}
@keyframes atkElectro{
  0%{transform:translateX(0) scale(1)}
  20%{transform:translateX(-10px) scale(.96,1.04)}
  45%{transform:translateX(25px) scale(1.12,.90) skewX(-7deg)}
  60%{transform:translateX(34px) scale(1.08,.94)}
  75%{transform:translateX(8px)}
  100%{transform:none}
}
@keyframes atkClown{
  0%{transform:translateY(0) rotate(0) scale(1)}
  25%{transform:translateY(8px) rotate(-10deg) scale(.95,1.05)}
  55%{transform:translateY(-4px) rotate(9deg) scale(1.12,.9)}
  72%{transform:translateY(2px) rotate(-3deg)}
  100%{transform:none}
}
@keyframes atkToms{
  0%{transform:translateX(0) rotate(0) scale(1)}
  25%{transform:translateX(-12px) rotate(-6deg) scale(.95,1.04)}
  50%{transform:translateX(40px) rotate(8deg) scale(1.14,.90)}
  75%{transform:translateX(16px) rotate(-2deg)}
  100%{transform:none}
}

/* Impact squash and recoil */
.arena-fighter.hit .body-rig{
  animation:damageRecoil .24s cubic-bezier(.36,.07,.19,.97) both;
}
@keyframes damageRecoil{
  0%{transform:translateX(0) rotate(0) scale(1)}
  22%{transform:translateX(-16px) rotate(-7deg) scale(.95,1.05)}
  48%{transform:translateX(18px) rotate(5deg) scale(1.08,.92)}
  72%{transform:translateX(-7px) rotate(-2deg) scale(.98,1.02)}
  100%{transform:none}
}
.arena-fighter.hit{
  filter:brightness(2.2) saturate(.35) drop-shadow(0 0 18px #ff174d) !important;
}

/* Combat effects: lightweight DOM "sprite" objects, no external assets. */
.combat-effect{
  position:absolute;z-index:28;pointer-events:none;
  left:0;top:0;width:80px;height:80px;
  transform:translate(-50%,-50%);
}
.fx-ring{border:4px solid var(--fx,#fff);border-radius:50%;animation:fxRing .32s ease-out both}
@keyframes fxRing{from{opacity:1;transform:translate(-50%,-50%) scale(.15)}to{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
.fx-starburst{animation:fxBurst .30s ease-out both}
.fx-starburst:before,.fx-starburst:after{
  content:"";position:absolute;left:50%;top:50%;
  width:72px;height:7px;border-radius:4px;background:var(--fx,#fff);
  box-shadow:0 0 12px var(--fx,#fff);
}
.fx-starburst:before{transform:translate(-50%,-50%) rotate(0)}
.fx-starburst:after{transform:translate(-50%,-50%) rotate(90deg)}
@keyframes fxBurst{
  from{opacity:1;transform:translate(-50%,-50%) scale(.35) rotate(0)}
  to{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(45deg)}
}
.fx-fire,.fx-zap,.fx-banana,.fx-spore,.fx-stink,.fx-ball{
  font-size:52px;display:flex;align-items:center;justify-content:center;
  animation:fxProjectile .42s cubic-bezier(.15,.8,.25,1) forwards;
  width:auto;height:auto;
}
@keyframes fxProjectile{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-20deg)}
  18%{opacity:1}
  100%{opacity:1;transform:translate(calc(var(--dx) - 50%),calc(var(--dy) - 50%)) scale(1.15) rotate(360deg)}
}
.fx-stink{font-size:70px;filter:hue-rotate(35deg);animation:fxStink .62s ease-out forwards}
@keyframes fxStink{
  0%{opacity:.95;transform:translate(-50%,-50%) scale(.2)}
  55%{opacity:.9;transform:translate(calc(var(--dx) - 50%),calc(var(--dy) - 50%)) scale(1.2)}
  100%{opacity:0;transform:translate(calc(var(--dx) - 50%),calc(var(--dy) - 50%)) scale(2)}
}
.fx-zap{font-size:58px;animation:fxZap .34s steps(3,end) forwards}
@keyframes fxZap{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  30%{opacity:1}
  100%{opacity:0;transform:translate(calc(var(--dx) - 50%),calc(var(--dy) - 50%)) scale(1.25)}
}
.hit-number{
  position:absolute;z-index:31;pointer-events:none;
  color:#fff;font:900 28px 'Baloo 2',sans-serif;
  text-shadow:3px 3px 0 #191512,-1px -1px 0 #191512;
  animation:damageNumber .65s cubic-bezier(.2,.9,.2,1) forwards;
}
@keyframes damageNumber{
  0%{opacity:0;transform:translate(-50%,0) scale(.5) rotate(-8deg)}
  18%{opacity:1;transform:translate(-50%,-12px) scale(1.2) rotate(4deg)}
  100%{opacity:0;transform:translate(-50%,-70px) scale(.9) rotate(-2deg)}
}
.arena-fighter.guard .body-rig{
  animation:guardPose .30s ease-out both;
  filter:drop-shadow(0 0 22px #55e6ff);
}
@keyframes guardPose{
  0%{transform:none}
  45%{transform:translateY(-4px) scale(.9,1.08) rotate(-4deg)}
  100%{transform:none}
}
.arena-shake{animation:arenaShake .16s linear}
@keyframes arenaShake{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-5px,2px)}
  50%{transform:translate(5px,-2px)}
  75%{transform:translate(-3px,1px)}
}

</style>

/* ---------------- Render ---------------- */
const stage = document.getElementById('stage');
const selectGrid = document.getElementById('selectGrid');
const previewPanel = document.getElementById('previewPanel');
const previewPortrait = document.getElementById('previewPortrait');
const previewName = document.getElementById('previewName');
const previewPowerTag = document.getElementById('previewPowerTag');
const previewRating = document.getElementById('previewRating');
const previewMoves = document.getElementById('previewMoves');

let current = 0;

function renderGrid(){
  selectGrid.innerHTML = fighters.map((f,i) => `
    <button class="grid-slot ${i===current?'selected':''}" data-index="${i}" aria-label="Select ${f.name}" style="background:${f.box}">
      ${f.svg}
      <span class="slot-name">${f.name}</span>
    </button>
  `).join('');
  selectGrid.querySelectorAll('.grid-slot').forEach(btn => {
    const idx = parseInt(btn.dataset.index, 10);
    btn.addEventListener('click', () => {
      current = idx;
      renderGrid();
      showPreview(fighters[current]);
    });
    btn.addEventListener('mouseenter', () => {
      showPreview(fighters[idx]);
    });
    btn.addEventListener('mouseleave', () => {
      showPreview(fighters[current]);
    });
  });
}

function showPreview(f){
  previewPanel.style.borderColor = f.box;
  previewPanel.style.background = `linear-gradient(165deg, #fffaf0 70%, ${f.box}38)`;
  previewPanel.style.boxShadow = `8px 8px 0 var(--ink), 0 0 28px ${f.box}66`;
  previewPortrait.style.background = f.box;
  previewPortrait.innerHTML = f.svg;
  previewName.textContent = f.name;

  previewPowerTag.innerHTML = `<span class="power-prefix">POWER:</span> ${f.power.toUpperCase()}`;
  previewRating.innerHTML = '<span>\u2665 ' + f.hp + '/' + f.hpMax + '</span><span>\u25BC +' + f.pow + '</span>';

  previewMoves.innerHTML = f.moves.map(m => `
    <span class="preview-move-chip ${m.super ? 'super' : ''}"><span class="dot"></span>${m.label}</span>
  `).join('');

  previewPortrait.querySelectorAll('animateTransform, animate').forEach(el => {
    try { if (typeof el.beginElement === 'function') el.beginElement(); } catch(e){}
  });
}

document.addEventListener('keydown', (e) => {
  const cols = 3;
  const total = fighters.length;
  let changed = false;
  if(e.key === 'ArrowRight') { current = (current + 1) % total; changed = true; }
  else if(e.key === 'ArrowLeft') { current = (current - 1 + total) % total; changed = true; }
  else if(e.key === 'ArrowDown') { current = (current + cols) % total; changed = true; }
  else if(e.key === 'ArrowUp') { current = (current - cols + total) % total; changed = true; }
  if(!changed) return;
  e.preventDefault();
  renderGrid();
  showPreview(fighters[current]);
});

renderGrid();
showPreview(fighters[current]);
</script>

  const enter = document.getElementById('enterArenaBtn');
  const arena = document.getElementById('arena');
  const world = document.getElementById('arenaWorld');
  const playerEl = document.getElementById('playerFighter');
  const enemyEl = document.getElementById('enemyFighter');
  const playerName = document.getElementById('playerName');
  const enemyName = document.getElementById('enemyName');
  const playerHp = document.getElementById('playerHp');
  const enemyHp = document.getElementById('enemyHp');
  const modePill = document.getElementById('modePill');
  const enemyStatus = document.getElementById('enemyStatus');
  const flash = document.getElementById('hitFlash');
  const floorLines = document.getElementById('floorLines');
  const crowd = document.getElementById('crowd');

  const skins=['#d59a78','#efb88d','#9a6248','#f0c7a0','#76503f'];
  const shirts=['#e2273f','#4f8fe0','#ffd23f','#55a77b','#a86bdb','#e88937','#fffaf0'];
  for(let r=6;r>=1;r--){
    const row=document.createElement('div');
    row.className='crowd-row r'+r;
    for(let i=0;i<52;i++){
      const p=document.createElement('span');
      p.className='person';
      p.style.setProperty('--skin',skins[(i+r)%skins.length]);
      p.style.setProperty('--shirt',shirts[(i*3+r)%shirts.length]);
      p.style.setProperty('--bob',(1.1+(i%7)*.22)+'s');
      p.style.animationDelay=(-((i*.31+r)*.17))+'s';
      row.appendChild(p);
    }
    crowd.appendChild(row);
  }

  let player,enemy,playerHP,enemyHP,px,ex,vy;
  let playerFacing=1,enemyFacing=-1;
  let keys=new Set(),running=false,last=0,enemyThink=0;
  let arenaScroll=0, playerY=0, attackLock=false, matchOver=false;

  const MOVE_SPEED=285, BOT_SPEED=170, GRAVITY=1320, JUMP=-545;
  const ATTACKS={
    jansina:{label:'SUPER PUNCH',duration:340,impact:170,damage:2,fx:'👊',fxClass:'fx-starburst',color:'#ffd23f'},
    giya:{label:'FIREBALL',duration:420,impact:210,damage:3,fx:'🔥',fxClass:'fx-fire',color:'#ff7a1a',projectile:true},
    viking:{label:'AXE SPIN',duration:480,impact:235,damage:2,fx:'⚔️',fxClass:'fx-starburst',color:'#8ebbf5',area:true},
    killroy:{label:'SPIKE TAIL',duration:420,impact:200,damage:3,fx:'🟢',fxClass:'fx-spore',color:'#65e36a',projectile:true},
    bananaflip:{label:'BANANA TOSS',duration:380,impact:205,damage:2,fx:'🍌',fxClass:'fx-banana',color:'#ffd23f',projectile:true},
    bullygan:{label:'WRECKING BALL',duration:440,impact:220,damage:3,fx:'💥',fxClass:'fx-ball',color:'#5fd6c0',projectile:true},
    electro:{label:'ZAP',duration:400,impact:195,damage:3,fx:'⚡',fxClass:'fx-zap',color:'#ffe14d',projectile:true},
    toms:{label:'SCRATCH',duration:360,impact:180,damage:2,fx:'🐱',fxClass:'fx-starburst',color:'#ffb366'},
    ultaclownsy:{label:'STINK BOMB',duration:500,impact:250,damage:3,fx:'💨',fxClass:'fx-stink',color:'#9be21c',projectile:true}
  };

  function pickEnemy(){
    const choices=fighters.filter(f=>f.id!==fighters[current].id);
    return choices[Math.floor(Math.random()*choices.length)];
  }

  function setupFighterRig(el,f){
    el.innerHTML='<div class="body-rig">'+f.svg+'</div>';
    el.setAttribute('data-id',f.id);
    el.classList.toggle('has-arena-legs',!!f.hasArenaLegs);
    el.classList.remove('face-left','face-right','walking','action','hit','guard');
    el.classList.add('face-right');
  }

  function setOrientation(el,newFacing,currentFacing){
    if(newFacing===currentFacing) return currentFacing;
    el.classList.remove('face-left','face-right');
    el.classList.add(newFacing===1?'face-right':'face-left');
    return newFacing;
  }

  function resetSvgAnimations(el){
    el.querySelectorAll('animateTransform,animate').forEach(a=>{
      try{ if(typeof a.beginElement==='function') a.beginElement(); }catch(e){}
    });
  }

  function openArena(){
    player=fighters[current];
    enemy=pickEnemy();
    playerHP=player.hpMax; enemyHP=enemy.hpMax;
    px=innerWidth*.22; ex=innerWidth*.70;
    vy=0; playerY=0; arenaScroll=0;
    playerFacing=1; enemyFacing=-1;
    enemyThink=.4; attackLock=false; matchOver=false;

    setupFighterRig(playerEl,player);
    setupFighterRig(enemyEl,enemy);
    playerName.textContent=player.name;
    enemyName.textContent=enemy.name;
    modePill.textContent='BOT MATCH · A/D MOVE · W JUMP · SPACE ATTACK';
    enemyStatus.textContent='BOT · THINKING...';
    arena.classList.add('active');
    arena.setAttribute('aria-hidden','false');
    updateHud();
    resetSvgAnimations(playerEl);
    resetSvgAnimations(enemyEl);
    running=true; last=performance.now();
    requestAnimationFrame(loop);
  }

  function closeArena(){
    running=false;
    arena.classList.remove('active');
    arena.setAttribute('aria-hidden','true');
    keys.clear();
  }

  function updateHud(){
    playerHp.style.width=Math.max(0,playerHP/player.hpMax*100)+'%';
    enemyHp.style.width=Math.max(0,enemyHP/enemy.hpMax*100)+'%';
  }

  function flashHit(){
    flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
  }

  function spawnImpact(x,y,color='#fff'){
    const fx=document.createElement('div');
    fx.className='combat-effect fx-ring';
    fx.style.left=x+'px'; fx.style.top=y+'px'; fx.style.setProperty('--fx',color);
    world.appendChild(fx);
    setTimeout(()=>fx.remove(),350);
  }

  function spawnProjectile(attacker,fighter){
    const aX=attacker==='p'?px:ex;
    const tX=attacker==='p'?ex:px;
    const y=innerHeight*.53;
    const spec=ATTACKS[fighter.id];
    if(!spec?.projectile) return;
    const fx=document.createElement('div');
    fx.className='combat-effect '+spec.fxClass;
    fx.textContent=spec.fx;
    fx.style.left=aX+'px'; fx.style.top=y+'px';
    fx.style.setProperty('--dx',(tX-aX)+'px');
    fx.style.setProperty('--dy','0px');
    fx.style.setProperty('--fx',spec.color);
    world.appendChild(fx);
    setTimeout(()=>fx.remove(),fighter.id==='ultaclownsy'?650:470);
  }

  function showDamage(targetEl,amount,x,y){
    targetEl.classList.remove('hit'); void targetEl.offsetWidth; targetEl.classList.add('hit');
    const n=document.createElement('div');
    n.className='hit-number';
    n.textContent='-'+amount;
    n.style.left=x+'px'; n.style.top=y+'px';
    world.appendChild(n);
    setTimeout(()=>n.remove(),700);
  }

  function doAttack(attacker){
    if(!running || matchOver) return;
    const fighter=attacker==='p'?player:enemy;
    const attackerEl=attacker==='p'?playerEl:enemyEl;
    const targetEl=attacker==='p'?enemyEl:playerEl;
    const aX=attacker==='p'?px:ex;
    const tX=attacker==='p'?ex:px;
    const dist=Math.abs(aX-tX);
    const spec=ATTACKS[fighter.id] || ATTACKS.jansina;

    if(attackLock && attacker==='p') return;
    if(attacker==='p') attackLock=true;

    attackerEl.classList.remove('action');
    attackerEl.classList.remove('attack-'+fighter.id);
    void attackerEl.offsetWidth;
    attackerEl.classList.add('action','attack-'+fighter.id);
    spawnProjectile(attacker,fighter);

    // Ranged characters can connect at longer range; melee requires contact.
    const range=spec.projectile?235:155;
    const connects=dist<=range;

    setTimeout(()=>{
      if(!running || matchOver) return;
      if(connects){
        const damage=spec.damage;
        if(attacker==='p') enemyHP=Math.max(0,enemyHP-damage);
        else playerHP=Math.max(0,playerHP-damage);
        showDamage(targetEl,damage,tX,innerHeight*.47);
        spawnImpact(tX,innerHeight*.51,spec.color);
        flashHit();
        arena.classList.remove('arena-shake'); void arena.offsetWidth; arena.classList.add('arena-shake');
        updateHud();
      }
    },spec.impact);

    setTimeout(()=>{
      attackerEl.classList.remove('action','attack-'+fighter.id);
      if(attacker==='p') attackLock=false;
    },spec.duration);

    setTimeout(()=>{
      if(running && (playerHP<=0 || enemyHP<=0)) endMatch();
    },spec.impact+30);
  }

  function endMatch(){
    if(matchOver) return;
    matchOver=true;
    const winner=enemyHP<=0?player:enemy;
    running=false;
    enemyStatus.textContent=winner.name.toUpperCase()+' WINS';
    modePill.textContent='MATCH OVER · PRESS EXIT OR WAIT';
    setTimeout(()=>{
      if(arena.classList.contains('active')) openArena();
    },1400);
  }

  function doPlayerAttack(){ doAttack('p'); }
  function doBotAttack(){ doAttack('e'); }

  function loop(t){
    if(!running) return;
    const dt=Math.min(.033,(t-last)/1000); last=t;

    let walking=false;
    if(keys.has('a')){px-=MOVE_SPEED*dt;playerFacing=setOrientation(playerEl,-1,playerFacing);walking=true}
    if(keys.has('d')){px+=MOVE_SPEED*dt;playerFacing=setOrientation(playerEl,1,playerFacing);walking=true}
    if(keys.has('w') && Math.abs(vy)<1){vy=JUMP}
    vy+=GRAVITY*dt;
    playerY+=vy*dt;
    if(playerY>0){playerY=0;vy=0}
    px=Math.max(40,Math.min(innerWidth-210,px));
    playerEl.style.left=px+'px';
    playerEl.style.bottom=(24+(-playerY/14))+'%';
    playerEl.classList.toggle('walking',walking && !attackLock);

    enemyThink-=dt;
    const dist=px-ex;
    let enemyMoving=false;
    if(Math.abs(dist)>145){
      ex += (dist>0?1:-1)*BOT_SPEED*dt;
      enemyFacing=setOrientation(enemyEl,dist>0?1:-1,enemyFacing);
      enemyMoving=true;
    }else if(Math.random()<.015){
      ex += (Math.random()<.5?-1:1)*35;
      enemyFacing=setOrientation(enemyEl,ex<px?1:-1,enemyFacing);
    }
    ex=Math.max(40,Math.min(innerWidth-210,ex));
    enemyEl.style.left=ex+'px';
    enemyEl.style.right='auto';
    enemyEl.classList.toggle('walking',enemyMoving);

    if(enemyThink<=0 && !matchOver){
      enemyThink=.45+Math.random()*.75;
      const d=Math.abs(px-ex);
      if(d<240 && Math.random()<.70) doBotAttack();
    }

    arenaScroll += ((px-innerWidth*.22)*.035);
    floorLines.style.transform=`perspective(400px) rotateX(65deg) translateX(${-arenaScroll%80}px)`;
    document.querySelectorAll('.parallax').forEach(el=>{
      const s=parseFloat(el.dataset.speed||'.2');
      el.style.transform=`translateX(${(-arenaScroll*s)%innerWidth}px)`;
    });

    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown',e=>{
    if(!running) return;
    const k=e.key.toLowerCase();
    if(['a','d','w',' '].includes(k)){e.preventDefault();keys.add(k)}
    if(k===' ' && !e.repeat) doPlayerAttack();
  });
  document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

  document.querySelectorAll('.control-btn[data-key]').forEach(btn=>{
    const k=btn.dataset.key;
    const press=e=>{e.preventDefault();if(!running)return;keys.add(k);if(k===' ')doPlayerAttack()};
    const release=()=>keys.delete(k);
    btn.addEventListener('pointerdown',press);
    btn.addEventListener('pointerup',release);
    btn.addEventListener('pointercancel',release);
    btn.addEventListener('pointerleave',release);
  });

  enter.addEventListener('click',openArena);
  document.getElementById('leaveArena').addEventListener('click',closeArena);
})();
</script>


</body>
</html>
